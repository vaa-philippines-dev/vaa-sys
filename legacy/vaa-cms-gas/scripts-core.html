<script>
// ─────────────────────────────────────────
// scripts-main.html — v6
// Fix: customers bundled in getInitialData (no race)
// Fix: all callback params are full descriptive names
// ─────────────────────────────────────────

// ── App state ──────────────────────────────────────────────────────
// Use var (not const/let) so re-evaluation of this script block
// (which GAS can trigger via document.write on page reloads) does
// not throw "Identifier 'CMS' has already been declared".
var CMS = {
  user: null, settings: null, stats: null,
  customers: [], specialists: [],
  currentPage: null, currentParam: null
};

var PAGE_TITLES = {
  dashboard: 'Dashboard', customers: 'Customers', clients: 'Accounts',
  'playbook':           'Playbook',
  'customers-accounts': 'Customers & Accounts',
  'customers':          'Customers & Accounts',
  'clients':            'Customers & Accounts',
  'customer-profile': 'Customer Profile', 'client-profile': 'Account Profile',
  activity: 'Activity Logs', settings: 'System Settings', import: 'Bulk Import',
  'users':             'User Management',
  'specialists':        'CS Specialists',
  'my-clients':        'My Customers',
  'va-requests':        'Service Requests',
  'hours-schedule':     'Hours & Schedule',
  'va-request-profile': 'Request Detail',
  'va-connections':     'VA Connections',
  'kpi-performance':    'KPI Performance',
  'va-connection-profile': 'VA Connection',
  'va-database':        'VA Database',
  'va-rates':           'VA Rate Assignment',
  'attendance':         'Attendance',
  'customer-onboarding':'Customer Onboarding',
  'celebrations':       'Birthdays & Anniversaries',
  'report-headcount':  'Headcount Report',
  'report-overall':    'Overall Report',
  'report-department': 'Per Department Report',
  'report-service':    'Per Service Report',
  'report-type':       'Per Type Report',
  'report-churn':      'Churn Report',
  'report-lifetime':   'Lifetime Value Report',
  'report-ca':          'Customer / Account Report',
  'report-performance': 'Performance Report',
  'report-hours':        'Hours Report',
  'report-idle':          'Customer Idle Time Report',
  'report-sr-completion': 'Service Request Completion Report',
  'audit':               'Audit',
  'contracts':           'Contracts',
  'follow-ups':          'Follow-Ups',
  'inquiries':          'Concerns & Inquiries',
  'inquiry-profile':   'Inquiry Detail',
  'meetings':          'Account Meetings'
};

// ── Bootstrap ──────────────────────────────────────────
// Updates the visible loading text shown while the app boots — replaces
// the static "Initializing…" with stage-specific progress, so a slow
// boot shows exactly which stage it's stuck on instead of one generic,
// unchanging label the whole time.
function _setBootStatus(text) {
  console.log('[BOOT] Status: ' + text);
  var el = document.getElementById('bootStatusText');
  if (el) el.textContent = text;
}
// Shared loading-state builder — every spinner across the app should use
// this instead of a bare, text-less loader-ring, so the user always sees
// what's actually being fetched rather than an unlabeled spinner that
// looks identical whether it's about to finish in 200ms or hang for 20s.
function _loadingHtml(text, height) {
  return '<div class="loading-screen" style="height:' + (height||'160px') + ';">' +
    '<div class="loader-ring"></div>' +
    (text ? '<p style="font-size:12.5px;color:var(--text-muted);margin-top:8px;">' + _esc(text) + '</p>' : '') +
  '</div>';
}
// Maps the initial landing page to a readable "what's loading right now"
// label — shown while booting, so a slow load points at the actual
// dataset involved instead of a generic, unchanging "Initializing…".
function _bootStatusLabelForPage(page) {
  var LABELS = {
    'dashboard':          'Initializing Customers and Accounts…',
    'customers-accounts': 'Initializing Customers and Accounts…',
    'customers':          'Initializing Customers…',
    'clients':             'Initializing Accounts…',
    'my-clients':          'Initializing your Accounts…',
    'va-requests':         'Initializing Service Requests…',
    'va-request-profile':  'Initializing Service Request…',
    'va-database':         'Initializing VA Database…',
    'va-connections':      'Initializing VA Connections…',
    'kpi-performance':     'Initializing KPI Performance…',
    'va-rates':            'Initializing VA Rates…',
    'inquiries':           'Initializing Concerns & Inquiries…',
    'inquiry-profile':     'Initializing Inquiry…',
    'contracts':           'Initializing Contracts…',
    'follow-ups':          'Initializing Follow-Ups…',
    'meetings':            'Initializing Account Meetings…',
    'playbook':            'Initializing Playbook…',
    'celebrations':        'Initializing Birthdays & Anniversaries…',
    'client-payments':     'Initializing Client Payments…',
    'hours-schedule':      'Initializing Hours & Schedule…',
    'settings':            'Initializing Settings…',
    'audit':               'Initializing Audit…',
    'attendance':          'Initializing Attendance…'
  };
  return LABELS[page] || ('Initializing ' + (page || 'page').replace(/-/g,' ').replace(/\b\w/g, function(c){return c.toUpperCase();}) + '…');
}

(function() {
  // Visible, on-page proof that this script tag is actually executing —
  // independent of whether DevTools' console is even pointed at the
  // right frame. If the page never shows this, the script never ran at
  // all; if it does show this but nothing past it, the problem is later
  // in the boot chain (DOMContentLoaded, _loadInitialData, etc.), not
  // script execution itself.
  var el = document.getElementById('bootStatusText');
  if (el) el.textContent = 'Script loaded — waiting for DOMContentLoaded…';
  console.log('[BUILD] scripts-core.html loaded — workflow-diagnostics-v2 (CS Manager override + move-to-VA-assignment + close-lost restrictions build)');
})();

document.addEventListener('DOMContentLoaded', function () {
  console.log('%c[BUILD] scripts-core.html loaded — workflow-diagnostics-v2 (CS Manager override + move-to-VA-assignment + close-lost restrictions build)', 'color:#7c3aed;font-weight:bold;');
  console.log('[BOOT] DOMContentLoaded fired.');
  try {
    _initSidebar();
    console.log('[BOOT] _initSidebar() completed.');
  } catch (e) {
    console.error('[BOOT] _initSidebar() THREW — this would block everything after it:', e);
  }
  console.log('[BOOT] Calling _loadInitialData()…');
  try {
    _loadInitialData();
  } catch (e) {
    // A synchronous throw here — happening before google.script.run is
    // even dispatched — would otherwise fail completely silently, with
    // the page stuck on "Initializing…" and no console error explaining
    // why, since nothing downstream (including the watchdog below) would
    // ever get the chance to run.
    console.error('[BOOT] _loadInitialData() THREW SYNCHRONOUSLY — this is why the page is stuck on "Initializing…":', e);
    var pv0 = document.getElementById('pageView');
    if (pv0) pv0.innerHTML =
      '<div style="max-width:520px;margin:80px auto;padding:0 20px;text-align:center;">' +
        '<div style="font-size:36px;margin-bottom:12px;">⚠️</div>' +
        '<div style="font-size:20px;font-weight:800;color:var(--text-primary);margin-bottom:8px;">Startup Failed</div>' +
        '<div style="font-size:14px;color:var(--text-muted);line-height:1.6;margin-bottom:20px;">A script error occurred before the app could even contact the server: ' + _esc(e && e.message ? e.message : String(e)) + '</div>' +
        '<button class="btn btn-primary" onclick="location.reload()">Retry</button>' +
      '</div>';
  }
});

function _loadInitialData() {
  console.log('[BOOT] _loadInitialData(): firing getInitialData() to the server now.');
  _setBootStatus('Connecting to server…');
  var _bootStart = Date.now();
  var _bootResolved = false;
  // Watchdog — if getInitialData() never calls back at all (neither
  // success nor failure), e.g. because the backend call is hanging or
  // exceeded Apps Script's execution time limit, google.script.run gives
  // no feedback whatsoever and the user is left staring at the blank
  // "Initializing…" placeholder indefinitely. This surfaces something
  // actionable instead once it's clearly taking too long.
  setTimeout(function() {
    if (_bootResolved) return;
    console.error('[BOOT] getInitialData() has not responded after 20s — showing the stuck-boot fallback.');
    var pv = document.getElementById('pageView');
    if (pv) pv.innerHTML =
      '<div style="max-width:520px;margin:80px auto;padding:0 20px;text-align:center;">' +
        '<div style="font-size:36px;margin-bottom:12px;">⏳</div>' +
        '<div style="font-size:20px;font-weight:800;color:var(--text-primary);margin-bottom:8px;">Taking longer than expected</div>' +
        '<div style="font-size:14px;color:var(--text-muted);line-height:1.6;margin-bottom:20px;">The server hasn\'t responded after 20 seconds. This usually means it\'s under heavy load, or a script on the server is taking too long to finish.</div>' +
        '<button class="btn btn-primary" onclick="location.reload()">Retry</button>' +
      '</div>';
  }, 20000);
  google.script.run
    .withSuccessHandler(function (data) {
      _bootResolved = true;
      console.log('[BOOT] getInitialData() responded after ' + (Date.now()-_bootStart) + 'ms. success=', data && data.success, '| raw:', data);
      if (!data || !data.success) {
        var errMsg = (data && data.error) || 'Initialization failed.';
        console.error('[BOOT] getInitialData() returned failure:', errMsg);
        var isAuthErr = errMsg && (
          errMsg.indexOf('permission') !== -1 ||
          errMsg.indexOf('Authorization') !== -1 ||
          errMsg.indexOf('SpreadsheetApp') !== -1 ||
          errMsg.indexOf('googleapis.com/auth') !== -1
        );
        if (isAuthErr) {
          _showAuthRequiredBanner(errMsg);
        } else {
          var pv = document.getElementById('pageView');
          if (pv) pv.innerHTML =
            '<div style="max-width:520px;margin:80px auto;padding:0 20px;text-align:center;">' +
              '<div style="font-size:36px;margin-bottom:12px;">⚠️</div>' +
              '<div style="font-size:20px;font-weight:800;color:var(--text-primary);margin-bottom:8px;">Startup Failed</div>' +
              '<div style="font-size:14px;color:var(--text-muted);line-height:1.6;margin-bottom:20px;">' + _esc(errMsg) + '</div>' +
              '<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 20px;text-align:left;font-size:13px;color:var(--text-secondary);line-height:1.7;margin-bottom:20px;">' +
                '<strong style="color:var(--text-primary);">Common causes:</strong><br>' +
                '• <strong>initializeSystem()</strong> has not been run yet — run it once from the Apps Script editor.<br>' +
                '• A required sheet is missing from the spreadsheet.<br>' +
                '• The app does not have permission to access the spreadsheet.' +
              '</div>' +
              '<button class="btn btn-primary" onclick="location.reload()">Retry</button>' +
            '</div>';
          showToast(errMsg, 'error');
        }
        return;
      }

      CMS.user      = data.user      || null;
      CMS.settings  = data.settings  || {};
      CMS.stats     = {};       // populated by getDashboardData on first dashboard load
      CMS.customers = [];       // populated lazily on first customers page render
      console.log('[BOOT] CMS.user set:', CMS.user, '| CMS.settings keys:', Object.keys(CMS.settings||{}));
      _setBootStatus('Loading user profile and settings…');

      // Pre-load specialists list in background — needed for dropdowns across modules
      setTimeout(function() {
        google.script.run
          .withSuccessHandler(function (res) { if (res && res.success) CMS.specialists = res.data || []; console.log('[BOOT] getSpecialistsList() done.'); })
          .withFailureHandler(function(err){ console.error('[BOOT] getSpecialistsList() failed (non-blocking):', err); })
          .getSpecialistsList();
      }, 100);

      // Pre-load this user's active Take Over customer IDs in background —
      // per the Take Over model replacing Backup Specialist, needed by
      // _getSpecialistCustomerIds() below.
      CMS.myTakeoverCustomerIds = [];
      if (CMS.user && CMS.user.role === 'CS Specialist') {
        setTimeout(function() {
          google.script.run
            .withSuccessHandler(function (res) { CMS.myTakeoverCustomerIds = res || []; console.log('[BOOT] getTakeoverCustomerIdsForSpecialist() done.'); })
            .withFailureHandler(function(err){ console.error('[BOOT] getTakeoverCustomerIdsForSpecialist() failed (non-blocking):', err); })
            .getTakeoverCustomerIdsForSpecialist(CMS.user.email);
        }, 100);
      }

      // CS Specialists specifically need CMS.customers loaded up front, not
      // lazily — _getSpecialistCustomerIds() (used by _scopeToSpecialist()
      // across Service Requests, Inquiries, VA Connections, Clients,
      // Follow-Ups, Meetings, and Contracts) reads assignedSpecialist off of
      // it to build "my customers." Since pages can now be landed on
      // directly (URL-persisted ?page= on refresh), waiting for whichever
      // page happens to load it first isn't reliable enough for something
      // this scoping-critical.
      if (CMS.user && CMS.user.role === 'CS Specialist') {
        google.script.run
          .withSuccessHandler(function (res) { if (res && res.success) CMS.customers = res.data || []; console.log('[BOOT] getEnrichedCustomers() done (CS Specialist preload).'); })
          .withFailureHandler(function(err){ console.error('[BOOT] getEnrichedCustomers() failed (non-blocking):', err); })
          .getEnrichedCustomers({});
      }

      console.log('[BOOT] Calling _renderUserUI()…');
      try { _renderUserUI(); console.log('[BOOT] _renderUserUI() completed.'); }
      catch (e) { console.error('[BOOT] _renderUserUI() THREW:', e); }

      var initParam = (typeof INITIAL_PARAM !== 'undefined' && INITIAL_PARAM) ? INITIAL_PARAM : undefined;
      var initPage = typeof INITIAL_PAGE !== 'undefined' ? INITIAL_PAGE : 'dashboard';
      _setBootStatus(_bootStatusLabelForPage(initPage));
      console.log('[BOOT] Calling navigate(', initPage, ',', initParam, ') — this should replace the "Initializing…" placeholder.');
      try { navigate(initPage, initParam); console.log('[BOOT] navigate() call completed synchronously (async sub-loads may still be running).'); }
      catch (e) { console.error('[BOOT] navigate() THREW — this is very likely why the page is stuck on "Initializing…":', e); }
    })
    .withFailureHandler(function (err) {
      _bootResolved = true;
      var msg = err && err.message ? err.message : String(err);
      console.error('[BOOT] getInitialData() THREW after ' + (Date.now()-_bootStart) + 'ms:', msg, err);
      var isAuthErr = msg && (
        msg.indexOf('permission') !== -1 ||
        msg.indexOf('googleapis.com/auth') !== -1 ||
        msg.indexOf('SpreadsheetApp') !== -1
      );
      if (isAuthErr) { _showAuthRequiredBanner(msg); }
      else { showToast('Connection failed: ' + msg, 'error'); }
    })
    .getInitialData();
}

// ── CS Specialist data scoping helper
function _getSpecialistCustomerIds() {
  if (!CMS.user || CMS.user.role !== 'CS Specialist') return null; // null = no restriction
  // Bug fix: this used to include EVERY customer's ID regardless of who
  // they're assigned to — CMS.customers holds the full company-wide list
  // (getEnrichedCustomers() doesn't filter by role), so nothing here was
  // actually narrowing it down to "my customers." That silently made every
  // _scopeToSpecialist() call below a no-op, letting a CS Specialist see
  // every other specialist's Service Requests, Inquiries, VA Connections,
  // Clients, Follow-Ups, Meetings, and Contracts. Now actually filters by
  // assignedSpecialist matching the logged-in user's email.
  //
  // Take Over model (replaces Backup Specialist entirely): also includes
  // any customer a CS Manager has specifically assigned to this user for
  // a fixed date range — CMS.myTakeoverCustomerIds is preloaded once at
  // boot from getTakeoverCustomerIdsForSpecialist(), which only returns
  // customers currently within their active window. Mirrors the same
  // backend rule in Router.gs/VARequestService.gs/etc. — this is the
  // frontend half of that same enforcement; without it, this filter would
  // silently re-narrow every list right back down after the backend
  // response already came back correctly widened.
  var myEmail = (CMS.user.email || '').toLowerCase().trim();
  var myTakeoverIds = CMS.myTakeoverCustomerIds || [];
  var ids = {};
  (CMS.customers || []).forEach(function(cu) {
    var isOwn = (cu.assignedSpecialist || '').toLowerCase().trim() === myEmail;
    var isTakenOver = myTakeoverIds.indexOf(cu.customerId) !== -1;
    if (isOwn || isTakenOver) ids[cu.customerId] = true;
  });
  return ids;
}

function _scopeToSpecialist(arr, custIdField) {
  var ids = _getSpecialistCustomerIds();
  if (!ids) return arr; // not a specialist — return all
  return arr.filter(function(r){ return ids[r[custIdField||'customerId']]; });
}

// Ensures CMS.customers is populated before running a specialist-scoped
// load — without this, a CS Specialist landing directly on a scoped page
// (e.g. via the URL-persisted ?page= on refresh, skipping Dashboard/
// Customers entirely) could hit _getSpecialistCustomerIds() before
// CMS.customers has ever loaded, and — since scoping fails closed for
// safety — see an empty list instead of their own records.
function _ensureCustomersLoadedForScoping(callback) {
  if (!CMS.user || CMS.user.role !== 'CS Specialist' || (CMS.customers && CMS.customers.length)) { callback(); return; }
  google.script.run
    .withSuccessHandler(function(res) { CMS.customers = (res && res.success) ? (res.data || []) : []; callback(); })
    .withFailureHandler(function() { callback(); })
    .getEnrichedCustomers({});
}

// ── Nav role permissions ────────────────────────────────────────────
// Default pages accessible per role. CS Managers and Admins have no
// restriction (undefined entry = show everything).
// This block lives here (scripts-core.html) so _loadNavPermissions is
// always defined before _applyNavPermissions calls it during init,
// regardless of the order in which the included script files are parsed.
var NAV_ROLE_DEFAULT = {
  'CS Specialist': [
    'dashboard','customers-accounts','customers','clients','my-clients','va-requests',
    'hours-schedule','va-connections','kpi-performance','inquiries','contracts',
    'follow-ups','meetings','playbook','celebrations','client-payments','audit','terminations'
  ],
  'Service Manager': [
    'dashboard','va-requests','hours-schedule','va-connections','inquiries','customers-accounts','terminations'
  ],
  'HR Specialist': [
    'dashboard','va-database','va-requests','va-connections','hours-schedule','va-rates','attendance','inquiries','terminations'
  ],
  'HR Manager': [
    'dashboard','va-database','va-requests','va-connections',
    'hours-schedule','reports','va-rates','attendance','terminations'
  ],
  'Accounting': [
    'dashboard','customers-accounts','customers','clients','va-connections','va-database','va-rates','attendance','client-payments','accounting','report-performance'
  ],
  'Recruitment Specialist': [
    'dashboard','va-requests','va-database'
  ],
  'Training Manager': [
    'dashboard','va-requests','va-database'
  ],
  'Executive': [
    'dashboard','va-requests','accounting'
  ]
};

var _navRolePermissions = {};

function _loadNavPermissions() {
  _navRolePermissions = {};
  Object.keys(NAV_ROLE_DEFAULT).forEach(function(role) {
    _navRolePermissions[role] = (NAV_ROLE_DEFAULT[role]||[]).slice();
  });
  // Merge any overrides saved in CMS.settings
  if (CMS.settings && CMS.settings._navPermissions) {
    try {
      var overrides = JSON.parse(CMS.settings._navPermissions);
      Object.keys(overrides).forEach(function(role){
        _navRolePermissions[role] = overrides[role];
      });
    } catch(e) {}
  }
}

function _applyNavPermissions() {
  var role = CMS.user ? CMS.user.role : '';
  _loadNavPermissions(); // always reload so defaults are merged
  var allowed = _navRolePermissions[role]; // undefined = no restriction
  if (allowed && allowed.length) {
    document.querySelectorAll('.nav-item[data-page]').forEach(function(el) {
      var page = el.dataset.page || '';
      el.style.display = allowed.indexOf(page) !== -1 ? '' : 'none';
    });
  } else {
    // No restriction for this role (e.g. Administrator) — explicitly show
    // everything rather than leaving whatever display state a PREVIOUS
    // role (e.g. a simulated "View As" role) left behind. This is the fix
    // for the left nav not resetting after exiting View As.
    document.querySelectorAll('.nav-item[data-page]').forEach(function(el) {
      el.style.display = '';
    });
  }
  // Hard rule, independent of the whitelist above: "VA Rate Assignment" is
  // HR-only. The whitelist system only restricts roles that have an entry in
  // NAV_ROLE_DEFAULT — Administrator, CS Manager, and Manager have none, so
  // they'd otherwise fall through to "show everything" and see this too.
  // Administrator stays allowed (superuser); everyone else is force-hidden
  // here regardless of whitelist state.
  var vaRatesEl = document.querySelector('.nav-item[data-page="va-rates"]');
  if (vaRatesEl) {
    var rateAllowed = role === 'Administrator' || role === 'CS Manager' || role === 'HR Specialist' || role === 'HR Manager';
    vaRatesEl.style.display = rateAllowed ? '' : 'none';
  }
  // Hard rule: Follow-Ups must always be visible to CS Specialist and CS
  // Manager — a saved whitelist override completely replaces the default
  // per role (not merged with it), so if either role already has a
  // restrictive saved override that predates this fix and simply never
  // included follow-ups, updating the default alone wouldn't be enough.
  // Force-shown here regardless of whatever whitelist/override state
  // actually exists, on top of the underlying default list.
  var followUpsEl = document.querySelector('.nav-item[data-page="follow-ups"]');
  if (followUpsEl && (role === 'CS Specialist' || role === 'CS Manager')) {
    followUpsEl.style.display = '';
  }
  document.querySelectorAll('.nav-section-label').forEach(function(label) {
    var next = label.nextElementSibling;
    var allHidden = true;
    while (next && !next.classList.contains('nav-section-label')) {
      if (next.style.display !== 'none') { allHidden = false; break; }
      next = next.nextElementSibling;
    }
    label.style.display = allHidden ? 'none' : '';
  });
}

function _renderUserUI() {
  var u = CMS.user;
  console.log('[CMS] _renderUserUI → user:', u && u.email, '| name:', u && u.name, '| role:', u && u.role);
  if (!u) { console.warn('[CMS] _renderUserUI: CMS.user is null — skipping'); return; }
  var initials = (u.name || u.email || '?').charAt(0).toUpperCase();
  var el;
  el = document.getElementById('userAvatarSidebar'); if (el) el.textContent = initials;
  el = document.querySelector('#userInfoSidebar .user-name'); if (el) el.textContent = u.name || u.email;
  el = document.querySelector('#userInfoSidebar .user-role'); if (el) el.textContent = u.role;
  el = document.getElementById('topbarAvatar'); if (el) el.textContent = initials;
  el = document.getElementById('topbarName');   if (el) el.textContent = u.name || (u.email || '').split('@')[0];
  el = document.getElementById('topbarRole');   if (el) el.textContent = u.role + (u._realRole ? ' (viewing)' : '');
  _applyNavPermissions();
  _renderViewAsBanner();
}

// ═══════════════════════════════════════════════════════════════════════
// VIEW AS — lets an Administrator preview the app the way another role
// would see it (nav visibility, buttons, hidden sections, etc.).
//
// IMPORTANT SCOPE: this is a CLIENT-SIDE UI PREVIEW ONLY. It overrides
// CMS.user.role so every UI check in this file (nav visibility, button
// gating, etc.) reacts as that role would. It does NOT change what the
// backend allows — every google.script.run call still authenticates as
// the real signed-in Administrator, since server-side permission checks
// (checkPermission, getCurrentUser) read the real Users sheet row, which
// this never touches. So an action that would be blocked for the
// simulated role but is allowed for Administrator will still succeed —
// this shows what the role SEES, not a security boundary test.
// ═══════════════════════════════════════════════════════════════════════
var VIEW_AS_ROLES = ['CS Manager', 'CS Specialist', 'HR Specialist', 'Service Manager', 'Accounting', 'Recruitment Specialist', 'Training Manager', 'Team Leader'];

function _toggleViewAsDropdown() {
  var u = CMS.user;
  if (!u || (u._realRole || u.role) !== 'Administrator') return; // only real Administrators get this
  var dd = document.getElementById('viewAsDropdown');
  if (!dd) return;
  if (dd.style.display !== 'none') { dd.style.display = 'none'; return; }
  _renderViewAsMainMenu();
  dd.style.display = '';
}
function _renderViewAsMainMenu() {
  var u = CMS.user;
  var dd = document.getElementById('viewAsDropdown'); if (!dd) return;
  var currentSim = u._realRole ? u.role : null;
  var items = VIEW_AS_ROLES.map(function(r) {
    var active = currentSim === r;
    var activeDept = active && r === 'Service Manager' && u.department ? ' — ' + u.department : '';
    // Service Manager needs a department to actually mean anything (its
    // dashboard scoping reads CMS.user.department) — clicking it opens a
    // department sub-picker instead of simulating immediately.
    var clickFn = r === 'Service Manager' ? '_openViewAsDeptPicker()' : "_setViewAsRole('"+r+"')";

function navigate(page, param) {
  console.log('[NAV] navigate(' + page + ', ' + param + ') called.');
  // Leaving the wizard page for anywhere else — clear its state now rather
  // than letting it linger. A user can leave mid-flow lots of ways (a nav
  // click, browser back/forward, a deep link) that never call the wizard's
  // own pbStopWizard()/pbStartWizard() exit paths, and a stale _pbWizard
  // object left with active still true would otherwise get incorrectly
  // picked up by a later, completely unrelated action (e.g. a normal
  // Service Request creation wrongly trying to advance a wizard step).
  if (CMS.currentPage === 'customer-onboarding' && page !== 'customer-onboarding' && typeof _pbWizard !== 'undefined' && _pbWizard) {
    console.log('[Wizard] Leaving the onboarding wizard page — clearing wizard state.');
    _pbWizard = null;
  }
  // Same defensive cleanup for the Notifications View's fullscreen mode
  // and auto-reload interval — a user can leave it many ways besides its
  // own back button (nav click, browser back/forward, a deep link).
  if (CMS.currentPage === 'notifications-view' && page !== 'notifications-view') {
    document.body.classList.remove('notif-fullscreen');
    if (typeof _notifReloadInterval !== 'undefined' && _notifReloadInterval) { clearInterval(_notifReloadInterval); _notifReloadInterval = null; }
  }
  CMS.currentPage  = page;
  CMS.currentParam = param || null;
  // Keep the URL's query string in sync with the current page/param. This is
  // what makes a browser refresh land back on the same page instead of
  // resetting to the dashboard: doGet() (Router.gs) already reads ?page= and
  // ?id= on every fresh load and passes them through as INITIAL_PAGE/
  // INITIAL_PARAM below — replaceState just keeps the address bar (and
  // therefore what a refresh re-requests) matching what's on screen, with no
  // page reload and no new back-button history entry.
  try {
    if (window.history && window.history.replaceState) {
      var qs = '?page=' + encodeURIComponent(page) + (param ? '&id=' + encodeURIComponent(param) : '');
      window.history.replaceState(null, '', qs);
    }
  } catch (navUrlErr) { /* non-fatal — URL sync is a nice-to-have, not required for navigation to work */ }
  document.querySelectorAll('.nav-item[data-page]').forEach(function (navEl) {
    var isActive = navEl.dataset.page === page ||
      (page === 'customer-profile' && navEl.dataset.page === 'customers') ||
      (page === 'client-profile'   && navEl.dataset.page === 'clients') ||
      (page === 'my-clients'         && navEl.dataset.page === 'my-clients') ||
      (page === 'va-request-profile' && navEl.dataset.page === 'va-requests') ||
      (page === 'specialist-profile'   && navEl.dataset.page === 'specialists') ||
      (page === 'inquiry-profile'       && navEl.dataset.page === 'inquiries');
    navEl.classList.toggle('active', isActive);
  });
  var titleEl = document.getElementById('pageTitle');
  if (titleEl) titleEl.textContent = PAGE_TITLES[page] || page;
  var view = document.getElementById('pageView');
  view.innerHTML = '<div class="loading-screen"><div class="loader-ring"></div><p id="bootStatusText">Loading '+_esc(PAGE_TITLES[page] || page)+'…</p></div>';
  console.log('[NAV] Placeholder swapped to spinner with status text. Scheduling _loadPage(' + page + ') in 20ms…');
  var _navStart = Date.now();

  // Page-load performance monitoring, per the request — tracks how long
  // this specific navigation actually takes until real content replaces
  // the loading spinner, then logs it. Works generically across every
  // page, since they all follow the same "show .loading-screen, then
  // replace it once data arrives" pattern, rather than needing each
  // page's own rendering function individually instrumented.
  if (window._pllObserver) { window._pllObserver.disconnect(); window._pllObserver = null; }
  if (window._pllTimeoutId) { clearTimeout(window._pllTimeoutId); window._pllTimeoutId = null; }
  var _pllModule = page;
  var _pllLogged = false;
  function _pllLogAndCleanup() {
    if (_pllLogged) return; // never log twice for the same navigation
    _pllLogged = true;
    if (window._pllObserver) { window._pllObserver.disconnect(); window._pllObserver = null; }
    if (window._pllTimeoutId) { clearTimeout(window._pllTimeoutId); window._pllTimeoutId = null; }
    var seconds = (Date.now() - _navStart) / 1000;
    try {
      google.script.run
        .withFailureHandler(function(){ /* logging failures are never shown to the user */ })
        .logPageLoadTime(_pllModule, seconds);
    } catch (pllErr) { /* non-fatal — never let logging break navigation */ }
  }
  window._pllObserver = new MutationObserver(function() {
    if (!view.querySelector('.loading-screen')) _pllLogAndCleanup();
  });
  window._pllObserver.observe(view, { childList: true, subtree: true });
  // Safety net — if a page never finishes loading, log it as a 3-minute
  // timeout rather than letting the observer run indefinitely.
  window._pllTimeoutId = setTimeout(_pllLogAndCleanup, 180000);

  setTimeout(function () {
    console.log('[NAV] Calling _loadPage(' + page + ', ' + param + ')…');
    try { _loadPage(page, param, view); console.log('[NAV] _loadPage(' + page + ') returned without throwing, after ' + (Date.now()-_navStart) + 'ms.'); }
    catch (e) { console.error('[NAV] _loadPage(' + page + ') THREW after ' + (Date.now()-_navStart) + 'ms — this is very likely why the page never finished loading:', e); }
  }, 20);
}

// Generic click-to-sort for every table header, everywhere. Pure event
// delegation — doesn't modify any table's render logic, doesn't conflict
// with row-click handlers (those are on <tr> in tbody, this only reacts to
// <th> in thead), and works automatically on tables that get re-rendered
// dynamically since it's never bound to specific elements.
document.addEventListener('click', function(e) {
  var th = e.target.closest('#pageView table thead th');
  if (!th) return;
  var headerRow = th.parentElement;
  var table = th.closest('table');
  var tbody = table && table.querySelector('tbody');
  if (!tbody) return;
  var ths = Array.prototype.slice.call(headerRow.children);
  var colIndex = ths.indexOf(th);
  var asc = !th.classList.contains('dca-sort-asc');
  ths.forEach(function(h) { h.classList.remove('dca-sort-asc', 'dca-sort-desc'); });
  th.classList.add(asc ? 'dca-sort-asc' : 'dca-sort-desc');

  var rows = Array.prototype.slice.call(tbody.children).filter(function(r){ return r.tagName === 'TR'; });
  rows.sort(function(a, b) {
    var aText = (a.children[colIndex] ? a.children[colIndex].textContent : '').trim();
    var bText = (b.children[colIndex] ? b.children[colIndex].textContent : '').trim();
    var aNum = parseFloat(aText.replace(/[^0-9.\-]/g, ''));
    var bNum = parseFloat(bText.replace(/[^0-9.\-]/g, ''));
    var bothNumeric = !isNaN(aNum) && !isNaN(bNum) && /^[^0-9]*-?[\d,.]+[^0-9]*$/.test(aText) && /^[^0-9]*-?[\d,.]+[^0-9]*$/.test(bText);
    var cmp = bothNumeric ? (aNum - bNum) : aText.localeCompare(bText, undefined, { numeric: true, sensitivity: 'base' });
    return asc ? cmp : -cmp;
  });
  rows.forEach(function(r) { tbody.appendChild(r); });
});

function _loadPage(page, param, container) {

  // app-shell.html rather than toggled per page. What used to be
  // conditional here (auto-collapse on narrow screens, the improved
  // refresh icon) now simply always runs.
  _dcaSyncSidebarForViewport();
  _dcaSwapRefreshIcon(true);
  // Notifications button in the topbar only makes sense on the dashboard
  // — shown/hidden here rather than baked into the dashboard's own
  // content, since it now lives beside the global Refresh button.
  var topbarNotifBtn = document.getElementById('topbarNotifBtn');
  if (topbarNotifBtn) topbarNotifBtn.style.display = (page === 'dashboard') ? '' : 'none';
  // One-time, idempotent: mirrors each nav item's visible label text into a
  // data-label attribute, purely so CSS (which can't read text content) can

  document.querySelectorAll('.nav-item[data-page]:not([data-label])').forEach(function(navEl) {
    var labelEl = navEl.querySelector('.nav-label');
    if (labelEl) navEl.setAttribute('data-label', labelEl.textContent.trim());

  console.log('[LOADPAGE] Dispatching switch(page) for page=', page);

    case 'specialist-profile': _openSpecialistModal(param); navigate('specialists'); break;
    case 'va-requests':      _renderVARequestsPage(container);                            break;
    case 'hours-schedule':   _renderHoursSchedulePage(container);                break;
    case 'va-request-profile': _renderVARequestProfile(container, param);   break;
    case 'va-database':      _renderVADatabasePage(container);              break;
    case 'va-rates':         _renderVARatesPage(container);                 break;
    case 'attendance':       _renderAttendancePage(container);              break;

// Routes a clicked change to the appropriate record — a Service Request
// opens its detail modal, everything else (Hours/Schedule Change, VA
// Connected, VA Terminated) opens the VA Connection modal, since all
// three are fundamentally about a specific connection.
function dashOpenChangeItem(kind, id) {
  if (kind === 'request') { if (typeof reqOpenDetailModal === 'function') reqOpenDetailModal(id); else navigate('va-request-profile', id); }
  else if (kind === 'connection') { if (typeof vaConnOpenModal === 'function') vaConnOpenModal(id); }
  else if (kind === 'customer') { if (typeof custOpenModal === 'function') custOpenModal(id); }
}

// ── Dual-line chart: two series on the same SVG (new=primary, terminated=red)
function _buildDualLineChart(series1, colors1, label1, series2, colors2, label2, chartId) {
  if (!series1 || !series1.length) {
    return '<div class="empty-state" style="padding:40px;"><h3>No data</h3></div>';
  }

  var W = 760, H = 240;
  var pad = { top:32, right:24, bottom:48, left:16 };
  var cW = W - pad.left - pad.right, cH = H - pad.top - pad.bottom;

  // Combine both series for shared Y axis
  var allVals = series1.map(function(p){ return p.value; }).concat(
    (series2||[]).map(function(p){ return p.value; })
  );
  var rawMin = Math.min.apply(null, allVals);
  var rawMax = Math.max.apply(null, allVals);
  if (rawMax === 0) rawMax = 1;
  var range = rawMax - rawMin || 1;
  var roughStep = range / 5;
  var mag = Math.pow(10, Math.floor(Math.log(roughStep) / Math.LN10));
  var tickStep = (roughStep/mag < 1.5 ? 1 : roughStep/mag < 3 ? 2 : roughStep/mag < 7 ? 5 : 10) * mag;
  tickStep = Math.max(1, tickStep);
  var axisMin = Math.max(0, Math.floor(rawMin / tickStep) * tickStep - tickStep);
  var axisMax = Math.ceil((rawMax + Math.max(Math.ceil(rawMax*0.12), tickStep)) / tickStep) * tickStep;
  var axisRange = axisMax - axisMin;

  var xFor = function(i, len) {
    return pad.left + (len <= 1 ? cW/2 : (i/(len-1))*cW);
  };
  var yFor = function(v) { return pad.top + cH - ((v-axisMin)/axisRange)*cH; };

  function cubicPath(pts) {
    if (pts.length < 2) return 'M'+pts[0].x+','+pts[0].y;
    var d = 'M'+pts[0].x+','+pts[0].y;
    for (var i=0; i<pts.length-1; i++) {
      var cp1x = pts[i].x   + (pts[i+1].x-(i>0?pts[i-1].x:pts[i].x))/6;
      var cp1y = pts[i].y   + (pts[i+1].y-(i>0?pts[i-1].y:pts[i].y))/6;
      var cp2x = pts[i+1].x - (i<pts.length-2?pts[i+2].x-pts[i].x:pts[i+1].x-pts[i].x)/6;
      var cp2y = pts[i+1].y - (i<pts.length-2?pts[i+2].y-pts[i].y:pts[i+1].y-pts[i].y)/6;
      d += ' C'+cp1x+','+cp1y+' '+cp2x+','+cp2y+' '+pts[i+1].x+','+pts[i+1].y;
    }
    return d;
  }

  function buildPts(series, len) {
    return series.map(function(p,i){ return { x:xFor(i,len), y:yFor(p.value), v:p.value, lbl:p.label }; });
  }

  var pts1   = buildPts(series1, series1.length);
  var pts2   = series2 && series2.length ? buildPts(series2, series2.length) : [];
  var line1  = cubicPath(pts1);
  var fill1  = line1 + ' L'+pts1[pts1.length-1].x+','+(pad.top+cH)+' L'+pts1[0].x+','+(pad.top+cH)+' Z';
  var line2  = pts2.length ? cubicPath(pts2) : '';
  var gradId1= 'dashDG1_'+chartId, gradId2='dashDG2_'+chartId;

  // Grid
  var gridLines = '';
  for (var tick=axisMin; tick<=axisMax+0.001; tick+=tickStep) {
    var ty=yFor(tick);
    if (ty<pad.top-4||ty>pad.top+cH+4) continue;
    gridLines+='<line x1="'+pad.left+'" y1="'+ty+'" x2="'+(W-pad.right)+'" y2="'+ty+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="'+(Math.abs(tick-axisMin)<0.001?'0':'4,4')+'"/>';
  }

  // X labels
  var xLabels='', xStep=Math.max(1,Math.ceil(series1.length/10));
  for (var k=0;k<series1.length;k+=xStep) {
    xLabels+='<text x="'+pts1[k].x+'" y="'+(H-pad.bottom+18)+'" font-size="11" text-anchor="middle" fill="var(--text-muted)">'+_esc(series1[k].label)+'</text>';
  }

  // Dots + value labels
  var labelStep = series1.length<=18?1:Math.ceil(series1.length/14);
  function buildDots(pts, series, color) {
    return pts.map(function(p,i) {
      var showLabel = (i%labelStep===0);
      var valLabel = showLabel ? '<text x="'+p.x+'" y="'+(p.y-9)+'" font-size="10.5" text-anchor="middle" font-weight="600" fill="'+color+'">'+p.v+'</text>' : '';
      return valLabel+
        '<circle cx="'+p.x+'" cy="'+p.y+'" r="14" fill="transparent" style="cursor:pointer;"><title>'+_esc(series[i].label)+': '+p.v+'</title></circle>'+
        '<circle cx="'+p.x+'" cy="'+p.y+'" r="3.5" fill="'+color+'" stroke="var(--surface)" stroke-width="2" pointer-events="none"/>';
    }).join('');
  }

  var lastVal1 = series1[series1.length-1].value;
  var lastVal2 = series2 && series2.length ? series2[series2.length-1].value : 0;

  return (
    '<div class="dash-inline-stats">' +
      '<div class="dash-inline-stat"><span class="dash-inline-val" style="color:'+colors1.stroke+'">'+lastVal1+'</span><span class="dash-inline-lbl">Latest New</span></div>' +
      '<div class="dash-inline-stat"><span class="dash-inline-val" style="color:'+colors2.stroke+'">'+lastVal2+'</span><span class="dash-inline-lbl">Latest Terminated</span></div>' +
      // Legend
      '<div style="display:flex;gap:14px;align-items:center;margin-left:auto;">' +
        '<span style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:'+colors1.stroke+';">' +
          '<span style="width:20px;height:2.5px;background:'+colors1.stroke+';border-radius:2px;display:inline-block;"></span>'+label1+'</span>' +
        '<span style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:'+colors2.stroke+';">' +
          '<span style="width:20px;height:2.5px;background:'+colors2.stroke+';border-radius:2px;display:inline-block;"></span>'+label2+'</span>' +
      '</div>' +
    '</div>' +
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;" xmlns="http://www.w3.org/2000/svg">' +
      '<defs>' +
        '<linearGradient id="'+gradId1+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+colors1.stroke+'" stop-opacity="0.18"/><stop offset="100%" stop-color="'+colors1.stroke+'" stop-opacity="0"/></linearGradient>' +
        '<linearGradient id="'+gradId2+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+colors2.stroke+'" stop-opacity="0.12"/><stop offset="100%" stop-color="'+colors2.stroke+'" stop-opacity="0"/></linearGradient>' +
      '</defs>' +
      gridLines + xLabels +
      '<path d="'+fill1+'" fill="url(#'+gradId1+')" stroke="none"/>' +
      '<path d="'+line1+'" fill="none" stroke="'+colors1.stroke+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
      (pts2.length ? '<path d="'+cubicPath(pts2)+'" fill="none" stroke="'+colors2.stroke+'" stroke-width="2" stroke-dasharray="6,3" stroke-linecap="round" stroke-linejoin="round"/>' : '') +
      buildDots(pts1, series1, colors1.stroke) +
      (pts2.length ? buildDots(pts2, series2, colors2.stroke) : '') +
    '</svg>'
  );
}

// Loads/renders the Critical section — VA connections flagged at risk via
// an open meeting Concern. Separate from _dashLoadAll's combined response
// since this is its own dedicated function, not folded into
// getDashboardData.
function _dashLoadCriticalSection() {
  var section = document.getElementById('dashCriticalSection'); if (!section) return;
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) return;
      // Per the request — only concerns raised in the past 14 days.
      // Filtered here rather than in the shared backend function, since
      // getAllOpenMeetingConcerns is also used elsewhere (Birthdays &
      // Anniversaries' own open-concern warning icon needs every open
      // concern, not just recent ones).
      var cutoff = Date.now() - 14*24*60*60*1000;
      var concerns = (res.data || []).filter(function(c) { return c.raisedAt && new Date(c.raisedAt).getTime() >= cutoff; });
      if (!concerns.length) { section.innerHTML = ''; return; }
      section.innerHTML =
        '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius-lg);padding:14px 16px;">' +

function _dashToggleConcernSnippet(snippetId) {

// Single combined dashboard loader — replaces the 5+ sequential GAS calls
// (getDashboardStats, getFollowUpReminders, getNotifications,
// getMeetingNotifications, getStatusMismatches) with one round-trip.
function _dashLoadAll() {
  console.log('[DASH] _dashLoadAll(): firing getDashboardData()…');
  var _t = Date.now();
  var _dashResolved = false;
  setTimeout(function() {
    if (_dashResolved) return;
    console.error('[DASH] getDashboardData() has not responded after 25s — this is the actual dataset that was loading when things stalled.');
    _setBootStatus('Still loading dashboard data after 25s — this may be taking unusually long.');
  }, 25000);
  google.script.run
    .withSuccessHandler(function(res) {
      _dashResolved = true;
      console.log('[DASH] getDashboardData() responded after ' + (Date.now()-_t) + 'ms. success=', res && res.success);
      if (!res || !res.success) { console.error('[DASH] getDashboardData() returned failure:', res && res.error); return; }
      // Update cached stats
      CMS.stats = res.stats || {};
      CMS.customers = (res.customers && res.customers.length) ? res.customers : CMS.customers;
      // Render all dashboard sections from the combined response
      try { _dashRenderStats(res.stats || {}); console.log('[DASH] _dashRenderStats done.'); } catch(e) { console.error('[DASH] _dashRenderStats THREW:', e); }
      try { _dashRenderLast30(res.stats || {}); console.log('[DASH] _dashRenderLast30 done.'); } catch(e) { console.error('[DASH] _dashRenderLast30 THREW:', e); }
      try { _dashRenderNotifications(res.notifications || []); } catch(e) { console.error('[DASH] _dashRenderNotifications THREW:', e); }
      try { _dashRenderMeetingNotifications(res.upcomingMeetings || []); } catch(e) { console.error('[DASH] _dashRenderMeetingNotifications THREW:', e); }
      try { _dashRenderStatusMismatches(res.mismatches || []); } catch(e) { console.error('[DASH] _dashRenderStatusMismatches THREW:', e); }
      try { _dashRenderFollowUpReminders(res.reminders || []); } catch(e) { console.error('[DASH] _dashRenderFollowUpReminders THREW:', e); }
      try { _dashRenderSpecialistPortfolio(); console.log('[DASH] _dashRenderSpecialistPortfolio done.'); } catch(e) { console.error('[DASH] _dashRenderSpecialistPortfolio THREW:', e); }
      console.log('[DASH] Calling _dashRenderMyTickets()…');
      try { _dashRenderMyTickets(); } catch(e) { console.error('[DASH] _dashRenderMyTickets THREW:', e); }
    })
    .withFailureHandler(function(err) {
      _dashResolved = true;
      console.error('[DASH] getDashboardData() THREW after ' + (Date.now()-_t) + 'ms:', err.message, err);
    })
    .getDashboardData();
}

var _dashNotifSections = ['dashNotifSection', 'dashMeetingSection', 'dashStatusMismatchSection'];

// Accordion: clicking a section opens it and collapses the other two.
// Clicking an already-open section collapses it (leaving all three closed).
function dashOpenNotifSection(sectionId) {
  var isOpen = !document.getElementById(sectionId).classList.contains('collapsed');
  // Collapse all first
  _dashNotifSections.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.classList.add('collapsed');
  });
  // If it was closed, now open it
  if (!isOpen) {
    var target = document.getElementById(sectionId);
    if (target) target.classList.remove('collapsed');
  }
}

// Legacy compatibility — kept in case other code still calls the old name
function dashToggleNotifSection(sectionId) { dashOpenNotifSection(sectionId); }

// Updates a sidebar section's count badge — greys it out at zero so an

function _buildLineChart(series, colors, label, chartId) {
  if (!series || !series.length) {
    return '<div class="empty-state" style="padding:40px;"><svg width="40" height="40" viewBox="0 0 20 20" fill="none" style="opacity:.2;margin:0 auto 8px;display:block;"><path d="M2 15l5-5 3 3 4-7 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><h3>No data</h3><p>No records found for the selected period and filters.</p></div>';
  }

  // ── Dynamic Y axis: start near data floor, ceiling is niceMax
  var rawMin = Math.min.apply(null, series.map(function(p){ return p.value; }));
  var rawMax = Math.max.apply(null, series.map(function(p){ return p.value; }));
  if (rawMax === 0) rawMax = 1;

  // Nice floor: round down to nearest multiple of tickStep
  var range = rawMax - rawMin || 1;
  // Choose a nice tick step based on range magnitude
  var roughStep = range / 5;
  var magnitude = Math.pow(10, Math.floor(Math.log(roughStep) / Math.LN10));
  var tickStep   = (roughStep / magnitude < 1.5 ? 1 : roughStep / magnitude < 3 ? 2 : roughStep / magnitude < 7 ? 5 : 10) * magnitude;
  tickStep = Math.max(1, tickStep);

  var axisMin = Math.max(0, Math.floor(rawMin / tickStep) * tickStep - tickStep);
  // Ceiling: add 10-15% headroom above max, rounded up to tickStep
  var rawCeil = rawMax + Math.max(Math.ceil(rawMax * 0.12), tickStep);
  var axisMax = Math.ceil(rawCeil / tickStep) * tickStep;

  var W = 760, H = 240;
  var pad = { top:32, right:24, bottom:48, left:16 };
  var cW  = W - pad.left - pad.right;
  var cH  = H - pad.top  - pad.bottom;
  var axisRange = axisMax - axisMin;

  var xFor = function(i) {
    return pad.left + (series.length <= 1 ? cW / 2 : (i / (series.length - 1)) * cW);
  };
  var yFor = function(v) {
    return pad.top + cH - ((v - axisMin) / axisRange) * cH;
  };

  var points = series.map(function(p, i) {
    return { x: xFor(i), y: yFor(p.value), v: p.value, lbl: p.label };
  });

  // ── Smooth cubic Bézier
  function cubicPath(pts) {
    if (pts.length < 2) return 'M' + pts[0].x + ',' + pts[0].y;
    var d = 'M' + pts[0].x + ',' + pts[0].y;
    for (var i = 0; i < pts.length - 1; i++) {
      var cp1x = pts[i].x   + (pts[i+1].x - (i>0 ? pts[i-1].x : pts[i].x)) / 6;
      var cp1y = pts[i].y   + (pts[i+1].y - (i>0 ? pts[i-1].y : pts[i].y)) / 6;
      var cp2x = pts[i+1].x - (i < pts.length-2 ? pts[i+2].x - pts[i].x : pts[i+1].x - pts[i].x) / 6;
      var cp2y = pts[i+1].y - (i < pts.length-2 ? pts[i+2].y - pts[i].y : pts[i+1].y - pts[i].y) / 6;
      d += ' C' + cp1x + ',' + cp1y + ' ' + cp2x + ',' + cp2y + ' ' + pts[i+1].x + ',' + pts[i+1].y;
    }
    return d;
  }

  var linePath = cubicPath(points);
  var fillPath = linePath + ' L' + points[points.length-1].x + ',' + (pad.top+cH) + ' L' + points[0].x + ',' + (pad.top+cH) + ' Z';
  var gradId   = 'dashGrad_' + chartId;

  // ── Y grid + labels using nice ticks
  var gridLines = '', yLabels = '';
  for (var tick = axisMin; tick <= axisMax + 0.001; tick += tickStep) {
    var ty = yFor(tick);
    if (ty < pad.top - 4 || ty > pad.top + cH + 4) continue;
    var isDomain = Math.abs(tick - axisMin) < 0.001;
    gridLines += '<line x1="' + pad.left + '" y1="' + ty + '" x2="' + (W-pad.right) + '" y2="' + ty + '" stroke="var(--border)" stroke-width="1" stroke-dasharray="' + (isDomain ? '0' : '4,4') + '"/>';  // Y-axis value labels suppressed (no left scale)
  }

  // ── X labels (skip to avoid crowding, max 10)
  var xLabels = '';
  var maxXLabels = 10;
  var xStep = Math.max(1, Math.ceil(series.length / maxXLabels));
  for (var k = 0; k < series.length; k += xStep) {
    xLabels += '<text x="' + points[k].x + '" y="' + (H - pad.bottom + 18) + '" font-size="11" text-anchor="middle" fill="var(--text-muted)">' + _esc(series[k].label) + '</text>';
  }

  // ── Dots with value labels on top
  // Show labels only when series is short enough (≤ 18 points) or on alternating points
  var showAllLabels = series.length <= 18;
  var labelStep     = showAllLabels ? 1 : Math.ceil(series.length / 14);
  var MIN_DOT_SPACING = 38; // px — suppress label if dots too close

  var dots = points.map(function(p, i) {
    var showLabel = (i % labelStep === 0);
    // Suppress label if horizontally too close to previous shown label
    if (showLabel && i > 0 && (p.x - points[i - labelStep < 0 ? 0 : i - labelStep].x) < MIN_DOT_SPACING) {
      showLabel = false;
    }
    var valLabel = showLabel
      ? '<text x="' + p.x + '" y="' + (p.y - 9) + '" font-size="10.5" text-anchor="middle" font-weight="600" fill="' + colors.stroke + '">' + p.v + '</text>'
      : '';
    return valLabel +
      '<circle cx="' + p.x + '" cy="' + p.y + '" r="14" fill="transparent" style="cursor:pointer;">' +
        '<title>' + _esc(series[i].label) + ': ' + p.v + '</title>' +
      '</circle>' +
      '<circle cx="' + p.x + '" cy="' + p.y + '" r="3.5" fill="' + colors.stroke + '" stroke="var(--surface)" stroke-width="2" pointer-events="none"/>';
  }).join('');

  var lastVal   = series[series.length-1].value;
  var maxSeries = series.reduce(function(a,b){ return b.value>a.value?b:a; }, series[0]);
  var avg       = Math.round(series.reduce(function(a,b){return a+b.value;},0) / series.length * 10) / 10;

  return (
    '<div class="dash-inline-stats">' +
      '<div class="dash-inline-stat"><span class="dash-inline-val" style="color:'+colors.stroke+'">' + lastVal + '</span><span class="dash-inline-lbl">Latest</span></div>' +
      '<div class="dash-inline-stat"><span class="dash-inline-val">' + maxSeries.value + '</span><span class="dash-inline-lbl">Peak</span></div>' +
      '<div class="dash-inline-stat"><span class="dash-inline-val">' + avg + '</span><span class="dash-inline-lbl">Avg</span></div>' +
      '<div class="dash-inline-stat"><span class="dash-inline-lbl dash-inline-period">' + series[0].label + ' → ' + series[series.length-1].label + '</span></div>' +
    '</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;" xmlns="http://www.w3.org/2000/svg">' +
      '<defs>' +
        '<linearGradient id="' + gradId + '" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="' + colors.stroke + '" stop-opacity="0.18"/>' +
          '<stop offset="100%" stop-color="' + colors.stroke + '" stop-opacity="0"/>' +
        '</linearGradient>' +
      '</defs>' +
      gridLines + xLabels +
      '<path d="' + fillPath + '" fill="url(#' + gradId + ')" stroke="none"/>' +
      '<path d="' + linePath + '" fill="none" stroke="' + colors.stroke + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots +
    '</svg>'
  );
}


function dashExportCSV() {
  if (!_dashAnalytics) return;
  var d = _dashAnalytics;
  var rows = [['Period','Active Customers','Active Accounts','Active VA Connections','New Customers','New Accounts','New VA Connections']];
  var len = Math.max(
    (d.active.customers||[]).length,
    (d.newRecords.customers||[]).length
  );
  for (var i=0; i<len; i++) {
    var ac = d.active.customers[i]    || {};
    var aa = d.active.accounts[i]     || {};
    var av = d.active.connections[i]  || {};
    var nc = d.newRecords.customers[i] || {};
    var na = d.newRecords.accounts[i]  || {};
    var nv = d.newRecords.connections[i]|| {};
    rows.push([ac.label||na.label||'', ac.value||0, aa.value||0, av.value||0, nc.value||0, na.value||0, nv.value||0]);
  }
  var csv = rows.map(function(r){ return r.map(function(v){ return '"'+String(v||'').replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  var blob = new Blob([csv],{type:'text/csv'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a'); a.href=url; a.download='dashboard-analytics.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

// Show a prominent full-page banner when authorization is needed

          'Click the <strong>Authorize</strong> button in the top bar to grant access.' +
        '</p>' +
        '<button class="btn btn-primary" style="padding:10px 28px;font-size:14px;" onclick="triggerAuthorization()">' +
          '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" style="margin-right:6px;">' +
            '<circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.75"/>' +

          '</svg>' +
          'Authorize Now' +
        '</button>' +
        '<details style="margin-top:20px;max-width:480px;text-align:left;">' +
          '<summary style="cursor:pointer;font-size:12px;color:var(--text-muted);">Show technical details</summary>' +
          '<pre style="margin-top:8px;font-size:11px;color:var(--text-muted);white-space:pre-wrap;word-break:break-word;background:var(--surface-2);padding:10px;border-radius:var(--radius-sm);">' +
            (errMsg || 'Unknown authorization error') +
          '</pre>' +
        '</details>' +
      '</div>';
  }
  // Also highlight the auth button in the topbar
  var btn = document.getElementById('topbarAuthBtn');
  if (btn) {
    btn.style.animation = 'authPulse 1.5s ease-in-out 3';
  }
}

function triggerAuthorization() {
  var btn = document.getElementById('topbarAuthBtn');
  if (btn) {
    btn.disabled = true;
    btn.classList.add('loading');
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 20 20" fill="none" class="spin"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="2" stroke-dasharray="22 22" stroke-linecap="round"/></svg><span>Checking…</span>';
  }

  google.script.run
    .withSuccessHandler(function(res) {
      if (btn) { btn.disabled = false; btn.classList.remove('loading'); }
      _resetAuthBtn();

      if (!res || !res.success) {
        showToast('Could not retrieve authorization URL. Try running any function in the Apps Script editor first.', 'error');
        return;
      }
      if (!res.required) {
        showToast('✓ App is fully authorized. Reloading…', 'success');
        setTimeout(function(){ window.location.reload(); }, 1200);
        return;
      }

      var authUrl = res.url || '';
      if (!authUrl) {
        showToast('No authorization URL returned.', 'error');
        return;
      }

      // Open the OAuth consent screen directly — GAS requires window.open to be
      // called from a direct user gesture, so we use google.script.run callback timing
      // which counts as a user-gesture context in the GAS sandbox.
      // Store URL and show a minimal confirm before opening (avoids popup blocker)
      window._authPendingUrl = authUrl;
      openModal(
        '<div class="modal-header">' +
          '<div class="modal-title">Authorize App Access</div>' +
          '<button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:18px;">' +
            '<div style="font-size:36px;">🔐</div>' +
            '<div>' +
              '<div style="font-weight:700;font-size:14px;margin-bottom:6px;">Google Sheets permission needed</div>' +
              '<div style="font-size:13px;color:var(--text-muted);line-height:1.65;">' +
                'Clicking <strong>Grant Access</strong> will open Google&#39;s permission screen. ' +
                'After you click <strong>Allow</strong>, come back to this tab and click <strong>Reload App</strong>.' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 14px;font-size:12.5px;line-height:1.9;">' +
            '<strong>1.</strong> Click <strong>Grant Access</strong> below<br>' +
            '<strong>2.</strong> Sign in and click <strong>Allow</strong> on Google&#39;s page<br>' +
            '<strong>3.</strong> Return here and click <strong>Reload App</strong>' +
          '</div>' +
        '</div>' +
        '<div class="modal-footer" style="gap:8px;">' +
          '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
          '<button class="btn btn-secondary" onclick="window.location.reload();">Reload App</button>' +
          '<button class="btn btn-primary" id="authGrantBtn" onclick="_authOpenUrl()">' +
            '🔓 Grant Access' +
          '</button>' +
        '</div>'
      );
    })
    .withFailureHandler(function(err) {
      if (btn) { btn.disabled = false; btn.classList.remove('loading'); }
      _resetAuthBtn();
      // Even if the backend is fully broken (auth not granted at all),
      // we can still try opening the script's own URL to trigger auth
      openModal(
        '<div class="modal-header">' +
          '<div class="modal-title">Authorization Required</div>' +
          '<button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;">' +
            '<div style="width:40px;height:40px;border-radius:10px;background:#fee2e2;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;">⚠️</div>' +
            '<div>' +
              '<div style="font-weight:700;font-size:14px;margin-bottom:4px;">Permissions Not Granted</div>' +
              '<div style="font-size:13px;color:var(--text-muted);line-height:1.6;">' +
                'The app cannot access Google Sheets because authorization has not been granted yet. ' +
                'To fix this, open the Apps Script editor and run any function manually — this will trigger the permission dialog.' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;font-size:12.5px;color:var(--text-secondary);line-height:1.8;">' +
            '<strong>How to authorize manually:</strong><br>' +
            '1. Open <strong>script.google.com</strong> and select this project<br>' +
            '2. Select any function (e.g. <code>initializeSystem</code>) from the dropdown<br>' +
            '3. Click <strong>▶ Run</strong> — a permissions dialog will appear<br>' +
            '4. Click <strong>Review permissions → Allow</strong><br>' +
            '5. Return here and refresh the page' +
          '</div>' +
        '</div>' +
        '<div class="modal-footer">' +
          '<button class="btn btn-secondary" onclick="closeModal()">Close</button>' +
          '<button class="btn btn-primary" onclick="window.open(\'https://script.google.com\',\'_blank\');">Open Apps Script</button>' +
        '</div>'
      );
    })
    .getAppAuthorizationUrl();
}

    var toEl   = document.getElementById(prefix + 'DateTo');
    return {
      from: fromEl && fromEl.value ? new Date(fromEl.value + 'T00:00:00') : null,
      to:   toEl   && toEl.value   ? new Date(toEl.value   + 'T23:59:59') : null
    };
  }
  var now   = new Date();
  var y     = now.getFullYear(), m = now.getMonth();
  if (preset === 'all')       return { from: null, to: null };
  if (preset === 'mtd')       return { from: new Date(y, m, 1),    to: now };
  if (preset === 'lastmonth') return { from: new Date(y, m-1, 1),  to: new Date(y, m, 0, 23, 59, 59) };
  if (preset === 'last3')     return { from: new Date(y, m-2, 1),  to: now };
  if (preset === 'last6')     return { from: new Date(y, m-5, 1),  to: now };
  if (preset === 'ytd')       return { from: new Date(y, 0, 1),    to: now };
  return { from: null, to: null };
}

// Which date field to filter by, based on the current status tab
// All/Pending/Active → createdAt   |   Paused/Inactive/Terminated/Cancelled → statusDate
function _dateFieldForStatus(statusFilter) {
  var terminalStatuses = ['Paused', 'Inactive', 'Terminated', 'Cancelled'];
  if (terminalStatuses.indexOf(statusFilter) !== -1) return 'statusDate';
  return 'createdAt';
}

function custApplyFilters() {
  console.log('[CMS] custApplyFilters: _custAll.length =', _custAll.length);
  var searchVal  = ((document.getElementById('custSearch')       || {}).value || '').toLowerCase();
  var statusVal  = (document.getElementById('custStatusFilter') && document.getElementById('custStatusFilter').value) || window._custStatusTabFilter || '';
  var preset     = window._custDatePreset || 'all';
  var dateRange  = _getPresetRange(preset, 'cust');
  var dateField  = _dateFieldForStatus(statusVal);
  var specVal   = ((document.getElementById('custSpecFilter') || {}).value || '');
  _custFiltered = _custAll.filter(function (row) {
    var matchQ = !searchVal || (row.customerName || '').toLowerCase().includes(searchVal) || (row.customerId || '').toLowerCase().includes(searchVal);
    var multi = window._custStatusMulti || [];
    var matchS = (multi.length > 0)
      ? (multi.indexOf(row.status) !== -1)
      : (!statusVal || row.status === statusVal);
    var matchSp = !specVal  || (row.assignedSpecialist || '') === specVal;
    var matchD = true;
    if (dateRange.from || dateRange.to) {
      var rawDate = row[dateField];
      var d = rawDate ? new Date(rawDate) : null;
      if (d) {
        if (dateRange.from && d < dateRange.from) matchD = false;
        if (dateRange.to   && d > dateRange.to)   matchD = false;
      } else { matchD = false; }
    }
    var matchOpenSR   = !(document.getElementById('custFilterOpenSR')   && document.getElementById('custFilterOpenSR').checked)   || (row.openRequests  > 0);
    var matchActiveVA = !(document.getElementById('custFilterActiveVA') && document.getElementById('custFilterActiveVA').checked) || (row.activeVACount > 0);
    var matchWarn     = !(document.getElementById('custFilterWarnings') && document.getElementById('custFilterWarnings').checked) || (_custWarnings(row).length > 0);
    return matchQ && matchS && matchSp && matchD && matchOpenSR && matchActiveVA && matchWarn;
  });
  _custFiltered.sort(function (rowA, rowB) {
    var va = rowA[_custSortField] || '';
    var vb = rowB[_custSortField] || '';
    // Date fields: compare as timestamps
    if (_custSortField === 'createdAt' || _custSortField === 'updatedAt' || _custSortField === 'statusDate') {
      var ta = va ? new Date(va).getTime() : 0;
      var tb = vb ? new Date(vb).getTime() : 0;
      return _custSortAsc ? ta - tb : tb - ta;
    }
    va = String(va).toLowerCase(); vb = String(vb).toLowerCase();
    return _custSortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
  });
  _custPage = 1;
  custRender();
}

// ── Warning logic ─────────────────────────────────────────────────────────
// Returns an array of warning strings for a customer or account row.
// Three conditions generate warnings:
//   (a) Has active VA connections but status is not Active
//   (b) No CS Specialist assigned
//   (c) Status is Active but has zero active VA connections
function _custWarnings(row) {
  var w = [];
  var st = (row.status || '').toLowerCase();
  var hasActive = (row.activeVACount || 0) > 0;
  if (hasActive && st !== 'active')
    w.push('Has active VA but status is ' + (row.status || 'non-active'));
  if (!row.assignedSpecialist && st !== 'terminated')
    w.push('No CS Specialist assigned');
  if (st === 'active' && !hasActive)
    w.push('Active but no active VAs');
  return w;
}

function _cliWarnings(row) { return _custWarnings(row); }

function _custRenderPager() {
  var el = document.getElementById('custPager'); if (!el) return;
  var total     = _custFiltered.length;
  var pageCount = Math.max(1, Math.ceil(total / _custPageSize));
  var startNum  = (_custPage - 1) * _custPageSize + 1;
  var endNum    = Math.min(_custPage * _custPageSize, total);
  var btns = '';
  for (var pg = 1; pg <= pageCount; pg++) {
    if (pg === 1 || pg === pageCount || Math.abs(pg - _custPage) <= 1)
      btns += '<button class="page-btn' + (pg === _custPage ? ' active' : '') + '" onclick="custGoPage(' + pg + ')">' + pg + '</button>';
    else if (Math.abs(pg - _custPage) === 2)
      btns += '<span style="padding:0 4px;color:var(--text-muted)">…</span>';
  }
  el.innerHTML = '<span>Showing ' + (total ? startNum : 0) + '–' + endNum + ' of ' + total + '</span>' +
    '<div class="page-btns">' +
      '<button class="page-btn" onclick="custGoPage(' + (_custPage - 1) + ')"' + (_custPage === 1 ? ' disabled' : '') + '>‹</button>' +
      btns +
      '<button class="page-btn" onclick="custGoPage(' + (_custPage + 1) + ')"' + (_custPage >= pageCount ? ' disabled' : '') + '>›</button>' +
    '</div>';
}

  var total = _custAll.length;
  var rows = statuses.map(function(s) {
    var pct = total ? Math.round(counts[s] / total * 100) : 0;
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-light);">' +

// ── VA type breakdown for summary modals
// Takes the full data array; each record may have .vaType field
// Returns HTML string of a section showing Regular / Project Based / Mixed counts
function _vaTypeSummaryRows(items, idKey) {
  var active  = (items||[]).filter(function(r){ return r.status==='Active'; });
  var regular = 0, project = 0, mixed = 0;
  active.forEach(function(r) {
    if      (r.vaType==='Mixed')         mixed++;
    else if (r.vaType==='Non-Regular')   project++;
    else if (r.vaType==='Regular')       regular++;
  });
  var total = active.length;
  if (!total) return '';
  function statRow(label, count, color) {
    var pct = Math.round(count/total*100);
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-light);">' +
      '<div style="display:flex;align-items:center;gap:8px;">' +
        '<div style="width:10px;height:10px;border-radius:50%;background:'+color+'"></div>' +
        '<span style="font-size:13px;font-weight:600;">'+label+'</span>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:14px;">' +
        '<div style="width:90px;height:5px;background:var(--surface-2);border-radius:4px;overflow:hidden;">' +
          '<div style="height:100%;width:'+pct+'%;background:'+color+';border-radius:4px;"></div>' +
        '</div>' +
        '<span style="font-weight:700;font-size:13.5px;min-width:22px;text-align:right;">'+count+'</span>' +
        '<span style="color:var(--text-muted);font-size:12px;min-width:32px;">'+pct+'%</span>' +
      '</div>' +
    '</div>';
  }
  return '<div style="margin-top:16px;padding-top:14px;border-top:2px solid var(--border);">' +
    '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);margin-bottom:8px;">Active — VA Connection Type</div>' +
    statRow('Regular Only',       regular, '#3b82f6') +
    statRow('Non-Regular Only',   project, '#8b5cf6') +
    statRow('Mixed (Both)',       mixed,   '#10b981') +
  '</div>';
}

function custApplyFiltersMulti() {
  var checked = [];
  document.querySelectorAll('.cust-status-cb:checked').forEach(function(cb){ checked.push(cb.value); });
  // At least one status must always be selected — if the user unchecks the
  // last one, silently re-check it so the list is never completely empty.
  if (checked.length === 0) {
    var lastCb = document.querySelector('.cust-status-cb[value="Active"]') ||
                 document.querySelector('.cust-status-cb');
    if (lastCb) { lastCb.checked = true; checked = [lastCb.value]; }
  }
  window._custStatusMulti = checked;
  document.querySelectorAll('#custStatusTabs .req-type-tab').forEach(function(b){ b.classList.remove('active'); });
  window._custStatusTabFilter = '';
  _updateStatusMultiLabel('cust');
  custApplyFilters();
}

function custSetStatusTab(btn, statusVal) {
  // Clear multi-select checkboxes when a tab is clicked
  window._custStatusMulti = [];
  document.querySelectorAll('.cust-status-cb').forEach(function(cb){ cb.checked = false; });
  document.querySelectorAll('#custStatusTabs .req-type-tab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  var filt = document.getElementById('custStatusFilter');
  if (filt) { filt.value = statusVal === 'All' ? '' : statusVal; }
  else {
    // no dropdown — store in variable
    window._custStatusTabFilter = statusVal === 'All' ? '' : statusVal;
  }
  _updateStatusMultiLabel('cust');
  custApplyFilters();
}

function custOpenModal(customerId) {
  document.getElementById('modalBox').style.maxWidth = '1040px';
  openModal(_loadingModal('180px', 'Loading customer profile…'));
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { closeModal(); showToast(res && res.error || 'Not found.', 'error'); return; }
      _cpData = res.data;
      _cpSelectedClient = (_cpData.clients && _cpData.clients.length) ? _cpData.clients[0] : null;
      _cpRenderModal();
      // Bug fix (2026-06-24): this used to fire on a blind setTimeout(…, 80)
      // started before getCustomerFullProfileData even resolved. On a slow
      // connection _cpData wasn't set yet, _cpLoadAccountVACounts silently
      // no-op'd, and the small "cpAcctList" spinner above the account tabs
      // was left spinning forever with nothing to ever retry it. Calling it
      // here — right after the modal's real content is rendered — means the
      // VA-count enrichment only ever runs once the data and DOM it needs
      // both actually exist.
      _cpLoadAccountVACounts();

function _cpBuildStatusLog(d) {
  var statusLog   = d.statusLog   || [];
  var specHistory = d.specHistory || [];

  var allEvents = [];

  statusLog.forEach(function(e) {
    var newSt  = (e.newValue||'').toLowerCase();
    var oldSt  = (e.oldValue||'').toLowerCase();
    var wasChurned = (oldSt==='terminated'||oldSt==='cancelled');
    var nowActive  = (newSt==='active');
    var color = '#3b82f6', label = 'Status changed to ' + _esc(e.newValue||'—');
    if (nowActive && wasChurned) { color='#8b5cf6'; label='Reactivated'; }
    else if (newSt==='active')   { color='#10b981'; label='Activated'; }
    else if (newSt==='paused')   { color='#f59e0b'; label='Paused'; }
    else if (newSt==='terminated'||newSt==='cancelled') { color='#ef4444'; label='Terminated'; }
    else if (newSt==='inactive') { color='#94a3b8'; label='Set Inactive'; }
    allEvents.push({ date:e.date, color:color, label:label,
      sub: e.oldValue ? 'From: '+_esc(e.oldValue) : '', by:e.by });
  });

  specHistory.forEach(function(e) {
    var sNewName = e.newName || _cpSpecName(e.newValue) || e.newValue || '—';
    var sOldName = e.oldName || (e.oldValue ? (_cpSpecName(e.oldValue) || e.oldValue) : '');
    allEvents.push({ date:e.date, color:'#6366f1',
      label:'Specialist: '+_esc(sNewName),
      sub: sOldName ? 'Previously: '+_esc(sOldName) : '', by:e.by });
  });

  if (!allEvents.length) {
    return '<div style="font-size:13px;color:var(--text-muted);padding:4px 0;">No log entries yet. Status changes will appear here.</div>';
  }

  return allEvents.map(function(ev) {
    return '<div class="clog-row">' +
      '<div class="clog-icon" style="background:'+ev.color+'22;color:'+ev.color+';">●</div>' +
      '<div class="clog-body">' +
        '<div class="clog-label">'+ev.label+'</div>' +
        (ev.sub ? '<div class="clog-sub">'+ev.sub+'</div>' : '') +
        '<div class="clog-meta">'+_fdate(ev.date)+(ev.by?' · '+_esc(ev.by):'')+'</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ── Customer modal: load accounts with VA connection counts
function _cpLoadAccountVACounts() {
  var listEl = document.getElementById('cpAcctList'); if (!listEl) return;
  var d = _cpData; if (!d) return;
  var clients = d.clients || [];
  if (!clients.length) { listEl.innerHTML = ''; return; }

  google.script.run
    .withSuccessHandler(function(res) {
      var listEl2 = document.getElementById('cpAcctList'); if (!listEl2) return;
      var allConns = (res && res.success) ? res.data : [];

      // Count per clientId
      var counts = {}; // clientId → {regular:0, project:0, connList:[]}
      allConns.forEach(function(conn) {
        if (conn.connectionStatus !== 'Started') return;
        var cid = conn.clientId; if (!cid) return;
        if (!counts[cid]) counts[cid] = { regular:[], project:[] };
        if (conn.connectionType === 'Non-Regular') counts[cid].project.push(conn);
        else counts[cid].regular.push(conn);
      });

      var rows = clients.map(function(cl) {
        var ct = counts[cl.clientId] || { regular:[], project:[] };
        var rCount = ct.regular.length, pCount = ct.project.length;
        var totalActive = rCount + pCount;
        var statusBadge = '<span class="badge badge-'+(cl.status||'').toLowerCase()+'">'+_esc(cl.status||'—')+'</span>';
        var regBtn = rCount > 0
          ? '<button class="cp-va-count-btn cp-va-regular" data-cid="'+_esc(cl.clientId)+'" data-type="Regular" onclick="_cpShowVAList(this.dataset.cid,this.dataset.type)">'+rCount+' Regular</button>'
          : '<span class="cp-va-count-zero">0 Regular</span>';
        var prjBtn = pCount > 0
          ? '<button class="cp-va-count-btn cp-va-project" data-cid="'+_esc(cl.clientId)+'" data-type="Non-Regular" onclick="_cpShowVAList(this.dataset.cid,this.dataset.type)">'+pCount+' Non-Regular</button>'
          : '<span class="cp-va-count-zero">0 Non-Regular</span>';
        return '<div class="cp-acct-row" data-cid="'+_esc(cl.clientId)+'" onclick="cpSelectAccount(this.dataset.cid)">' +
          '<div class="cp-acct-row-left">' +
            '<div class="cp-acct-row-name">'+_esc(cl.accountName||cl.companyName||cl.clientId)+'</div>' +
            '<div style="margin-top:3px;">'+statusBadge+'</div>' +
          '</div>' +
          '<div class="cp-acct-row-right">' +
            regBtn + prjBtn +
            (totalActive > 0 ? '<div style="font-size:10.5px;color:var(--text-muted);text-align:right;margin-top:2px;">'+totalActive+' active VA'+(totalActive>1?'s':'')+'</div>' : '') +
          '</div>' +
        '</div>';
      }).join('');

      listEl2.innerHTML = '<div class="cp-acct-list-inner">' + rows + '</div>';

      // Store conn data for drill-down
      window._cpConnData = allConns;
    })
    .withFailureHandler(function() {
      var el=document.getElementById('cpAcctList');
      if(el) el.innerHTML='';
    })
    .getActiveVAConnectionList({ all: true });
}

function _cpCalcHealth(d, cl) {
  // Placeholder formula — to be finalised
  // Currently: 100 - (10 * openSRTotal) - (8 * openIQTotal)
  var score = 100;
  score -= (d.openSRTotal || 0) * 10;
  score -= (d.openIQTotal || 0) * 8;
  if (d.status === 'Paused')      score -= 15;
  if (d.status === 'Inactive')    score -= 25;
  if (d.status === 'Terminated')  score = 0;
  if (d.status === 'Cancelled')   score = 0;
  score = Math.max(0, Math.min(100, score));
  return score;
}

// The LOCAL calendar date as YYYY-MM-DD. (d.toISOString().substring(0,10) is the UTC date — a day off for part of
// every day anywhere that isn't UTC, which is how a date picked as Oct 15 could be saved as Oct 14 or 16.)
function _ymdLocal(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function _todayStr() { var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function _reqOneYearAgoStr() { var d=new Date(); d.setFullYear(d.getFullYear()-1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// Same idea as _todayStr() but for <input type="datetime-local">, which
// needs "YYYY-MM-DDTHH:MM" in the browser's local time.
function _nowLocalDateTimeStr() {
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') +
    'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
// Converts any storable date value (ISO string, Date, etc.) to the
// "YYYY-MM-DDTHH:MM" format <input type="datetime-local"> requires.
function _toLocalDateTimeStr(val) {
  if (!val) return '';
  var d = new Date(val);
  if (isNaN(d.getTime())) return '';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') +
    'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
