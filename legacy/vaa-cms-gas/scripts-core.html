// Bug fix (2026-06-24): the Contract dropdown on the Add/Edit Account form
// reads from _contAll, which used to be populated ONLY by visiting the
// Contracts page first. If the user opened Add Account without ever having
// been to Contracts in that session, _contAll stayed empty and the dropdown
// just sat on "— No contract —" forever — looking exactly like a stuck/slow
// load, since nothing was ever going to populate it. This loads contracts
// on demand (skipping the full getContracts() section-values join, since
// the dropdown only needs id/name/active — see getContractListLite) and
// only re-fetches if we don't already have a cached list.
function _cliEnsureContractsLoaded(callback) {
  if (_contAll && _contAll.length) { callback(); return; }
  google.script.run
    .withSuccessHandler(function(res) {
      _contAll = (res && res.success) ? res.data : [];
      callback();
    })
    .withFailureHandler(function() {
      _contAll = _contAll || [];
      callback(); // proceed anyway — form still works, just shows "No contract"
    })
    .getContractListLite();
}

function _custOpenReactivateModal(customerId, customerName, currentStatus, isReactivating, accounts) {
  var title = isReactivating ? 'Reactivate Customer' : 'Change Status';

  // Reactivating doesn't jump straight to Active — it goes to Pending first,
  // for both the customer AND its accounts. It only actually becomes
  // Active once a new VA connection on this customer reaches Started (which
  // also closes that request as Won) — see _activateCustomerAndAccount in
  // VAConnectionService.gs, which already promotes anything non-Active to
  // Active at that point. This avoids counting a customer as "reactivated"
  // just because someone flipped a status field, before any real work has
  // actually resumed.
  var targetOptions = isReactivating
    ? [{ val:'Pending', label:'Pending', desc:'Reactivate this customer and its accounts — becomes Active once a new VA connection actually starts (or a request closes as Won).' }]
    : [
        { val:'Terminated', label:'Terminated', desc:'Customer relationship has ended.' },
        { val:'Cancelled',  label:'Cancelled',  desc:'Customer cancelled the engagement.' }
      ];

  var radioOpts = targetOptions.map(function(s, idx) {
    var checked = idx === 0 ? ' checked' : '';
    return '<label style="display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-md);cursor:pointer;margin-bottom:8px;">' +
      '<input type="radio" name="custStatusChoice" value="'+s.val+'"'+checked+' style="margin-top:3px;accent-color:var(--accent);" />' +
      '<div><span class="badge badge-'+s.val.toLowerCase()+'" style="font-size:11px;">'+s.label+'</span>' +
      '<div style="font-size:11.5px;color:var(--text-muted);margin-top:3px;">'+s.desc+'</div></div>' +
    '</label>';
  }).join('');

  openModal(
    '<div class="modal-header"><div class="modal-title">' + title + ' — ' + _esc(customerName) + '</div>' +
      '<button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button></div>' +
    '<div class="modal-body">' +
      (isReactivating

function custDoReactivate(customerId) {
  var checkedRadio = document.querySelector('input[name="custStatusChoice"]:checked');
  var statusVal    = checkedRadio ? checkedRadio.value : '';
  var dateVal      = ((document.getElementById('cust_statusDate')||{}).value || '');
  var reasonVal    = ((document.getElementById('cust_statusReasonCustom')||{}).value || '').trim();
  var errEl        = document.getElementById('custStatusErr');

  if (!statusVal) { if (errEl) errEl.textContent = 'Please select a status.'; return; }
  if (errEl) errEl.textContent = '';

  var btn = document.getElementById('custStatusBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) {
        if (errEl) errEl.textContent = (res && res.error) || 'Failed.';
        if (btn) { btn.disabled = false; btn.textContent = 'Update Status'; }
        return;
      }
      if (res.requiresApproval) {
        closeModal();
        showToast('Termination request submitted — awaiting CS Manager approval.', 'warning');
        _custRefresh();
        return;
      }
      if (res.isReactivation) {
        // Cascade the same Pending status to this customer's accounts —
        // reactivating is a customer+account action, not customer-only.
        // If an account checklist was shown (multiple accounts), only the
        // checked ones get passed through; if there was no checklist at
        // all (a single account, or none), pass nothing and the backend
        // defaults to reactivating everything, same as before.
        var acctCbs = document.querySelectorAll('.cust-reactivate-acct-cb');
        var selectedAcctIds = acctCbs.length
          ? Array.prototype.slice.call(acctCbs).filter(function(cb){ return cb.checked; }).map(function(cb){ return cb.value; })
          : undefined;
        if (selectedAcctIds && selectedAcctIds.length === 0) {
          // Every account was explicitly unchecked — nothing to cascade,
          // and passing an empty array would be misread by the backend as
          // "no filter" (reactivate everything), the opposite of intent.
          closeModal();
          showToast('Customer reactivated — no accounts were selected to reactivate.', 'success');
          _custRefresh();
          return;
        }
        google.script.run
          .withSuccessHandler(function(cliRes) {
            closeModal();
            showToast('Customer and selected account(s) set to Pending — will become Active once a new VA connection starts.', 'success');
            _custRefresh();
          })
          .withFailureHandler(function() {
            closeModal();
            showToast('Customer reactivated, but could not update its accounts — check them individually.', 'warning');
            _custRefresh();
          })
          .cascadeReactivateAccountsForCustomer(customerId, dateVal, reasonVal, selectedAcctIds);
      } else {
        closeModal();
        showToast('Status updated to ' + statusVal + '.', 'warning');
        _custRefresh();
      }
    })
    .withFailureHandler(function(err) {
      showToast(err.message, 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Update Status'; }
    })
    .updateCustomerStatusFull(customerId, statusVal, reasonVal, dateVal);
}

// ── Status history — shared data shaping, two render skins (sidebar / full-page card)
function _custStatusHistoryParts(d) {
  var termCount  = d.terminationCount  || 0;
  var reactCount = d.reactivationCount || 0;
  var history = [];
  if (d.statusHistory) {
    try { history = JSON.parse(d.statusHistory); if (!Array.isArray(history)) history = []; }
    catch (e) { history = []; }
  }
  history = history.slice().reverse(); // most recent first

  var summaryHtml =
    '<div style="display:flex;gap:16px;margin-bottom:10px;">' +
      '<div><span style="font-size:20px;font-weight:800;color:#ef4444;">' + termCount + '</span>' +
        '<div style="font-size:11px;color:var(--text-muted);">Termination' + (termCount!==1?'s':'') + '</div></div>' +
      '<div><span style="font-size:20px;font-weight:800;color:#10b981;">' + reactCount + '</span>' +
        '<div style="font-size:11px;color:var(--text-muted);">Reactivation' + (reactCount!==1?'s':'') + '</div></div>' +
    '</div>';

  var timelineHtml = history.length
    ? '<div style="max-height:200px;overflow-y:auto;">' +
        history.map(function(ev) {
          var isReact = ev.to === 'Active' && (ev.from === 'Terminated' || ev.from === 'Cancelled');
          var icon = isReact ? '↺' : '⊘';
          var color = isReact ? '#10b981' : '#ef4444';
          return '<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:12px;">' +
            '<span style="color:'+color+';font-weight:700;">'+icon+'</span>' +
            '<div style="flex:1;">' +
              '<div>' + _esc(ev.from||'—') + ' → <strong>' + _esc(ev.to||'—') + '</strong>' + (ev.reason ? ' — '+_esc(ev.reason) : '') + '</div>' +
              '<div style="color:var(--text-muted);font-size:11px;">' + _fdate(ev.date) + '</div>' +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>'
    : '<div style="font-size:12px;color:var(--text-muted);">No detailed history recorded yet.</div>';

  return { termCount: termCount, reactCount: reactCount, summaryHtml: summaryHtml, timelineHtml: timelineHtml };
}

// ── Idle Time widget — shown on Customer Profile (sidebar + full-page skin
// both use this same markup, unlike Status History which has two skins,
// since this widget is small enough not to need a layout variant).
// d.idleDaysSinceAdded / d.idleDaysSincePaid are null when the customer
// hasn't reached a qualifying (Accepted/Started) VA connection yet — in that
// case we show "still idle, N days and counting" computed live instead of a
// blank dash, since an open-ended idle period is itself useful to surface.
function _cpIdleTimeWidget(d) {
  var hasConnection = !!d.firstVAConnectedAt;
  function row(label, days, extraHint) {
    var valHtml = (days === null || days === undefined)
      ? '<span style="color:var(--border);">—</span>'
      : '<span style="font-weight:800;font-size:15px;">' + days + '</span><span style="font-size:11px;color:var(--text-muted);"> days</span>';
    return '<div style="display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;">' +
      '<span style="font-size:12.5px;color:var(--text-secondary);">' + label + (extraHint ? ' <span style="font-size:10.5px;color:var(--text-muted);">' + extraHint + '</span>' : '') + '</span>' +
      '<span>' + valHtml + '</span>' +
    '</div>';
  }
  if (hasConnection) {
    return row('Since added', d.idleDaysSinceAdded) +
      row('Since paid', d.idleDaysSincePaid, d.noPaymentYet ? '(unpaid)' : '') +
      '<div style="font-size:10.5px;color:var(--text-muted);margin-top:4px;">First connected ' + _fdate(d.firstVAConnectedAt) + '</div>';
  }
  // Not yet connected to any VA — compute a live "still idle" count so the
  // card shows something actionable instead of a pair of dashes.
  var createdMs = d.createdAt ? (new Date() - new Date(d.createdAt)) : null;
  var paidMs    = (!d.noPaymentYet && d.paymentDate) ? (new Date() - new Date(d.paymentDate)) : null;
  var stillSinceAdded = createdMs !== null && !isNaN(createdMs) ? Math.max(0, Math.round(createdMs/86400000)) : null;
  var stillSincePaid  = paidMs    !== null && !isNaN(paidMs)    ? Math.max(0, Math.round(paidMs/86400000))    : null;
  return '<div style="font-size:11.5px;color:var(--warning);font-weight:600;margin-bottom:4px;">⏳ Not yet connected to a VA</div>' +
    row('Idle since added', stillSinceAdded) +
    row('Idle since paid', stillSincePaid, d.noPaymentYet ? '(unpaid)' : '');
}

// Toggle the Payment Date field when "No payment yet" is checked/unchecked —
// disables + clears the date (so it can't be half-filled-in while flagged
// unpaid) and drops the required-asterisk styling as a visual cue.
function custToggleNoPayment(cb) {
  var dateEl = document.getElementById('f_paymentDate');
  var reqEl  = document.getElementById('f_paymentDateReq');
  if (!dateEl) return;
  dateEl.disabled = cb.checked;
  dateEl.style.background = cb.checked ? 'var(--surface-2)' : '';
  if (cb.checked) dateEl.value = '';
  if (reqEl) reqEl.style.display = cb.checked ? 'none' : '';

function custSubmit(id) {
  var nameEl  = document.getElementById('f_customerName');
  var nameVal = nameEl ? nameEl.value.trim() : '';
  var errEl   = document.getElementById('custFormErr');
  if (!nameVal) { if (errEl) errEl.textContent = 'Customer Name is required.'; return; }
  var noPaymentYet = (document.getElementById('f_noPaymentYet')||{}).checked || false;
  var paymentDateVal = (document.getElementById('f_paymentDate')||{}).value || '';
  if (!noPaymentYet && !paymentDateVal) {
    if (errEl) errEl.textContent = 'Payment Date is required, or check "No payment yet".';
    return;
  }
  if (errEl) errEl.textContent = '';
  var submitBtn = document.getElementById('custSubmitBtn');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Saving…'; }
  var payload = { customerName: nameVal, assignedSpecialist: (document.getElementById('f_assignedSpecialist') || {}).value || '', status: (document.getElementById('f_status') || {}).value || 'Pending', notes: (document.getElementById('f_notes') || {}).value || '', createdAt: (document.getElementById('f_createdAt')||{}).value || '', paymentDate: noPaymentYet ? '' : paymentDateVal, noPaymentYet: noPaymentYet };
  function onDone(res) {
    if (!res || !res.success) { if (errEl) errEl.textContent = res && res.errors ? res.errors.join(' ') : ((res && res.error) || 'Save failed.'); if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = id ? 'Save Changes' : 'Create Customer'; } return; }
    if (!id && res.id) {
      // New customer: close the modal immediately, then open the Add Account
      // form. We must NOT chain another google.script.run inside a
      // google.script.run callback (the customer-save response) — GAS will
      // silently drop the second call. So we reload the customer list in the
      // background with a short setTimeout to escape the current callback,
      // then open the Add Account modal, which itself will fire its own
      // google.script.run (getContractListLite) safely in a new turn.
      closeModal();
      showToast('Customer created — add their first account.', 'success');
      // Background refresh of CMS.customers (no GAS call — just update state)
      CMS.customers = CMS.customers || [];
      // Insert a minimal placeholder so the customer-dropdown in the Add Account
      // form can pre-select the new customer immediately, before the full reload.
      var alreadyExists = CMS.customers.some(function(c){ return c.customerId === res.id; });
      if (!alreadyExists) {
        CMS.customers.unshift({ customerId: res.id, customerName: nameVal, assignedSpecialist: payload.assignedSpecialist || '', status: payload.status || 'Pending', clients: [] });
      }
      _custAll = CMS.customers.slice();
      custApplyFilters();
      if (_pbWizardIsActuallyActive()) {
        // Onboarding wizard is running — advance the wizard page to step 2
        // instead of opening the Add Account modal directly.
        console.log('[Wizard] Customer created, advancing to step 2. customerId=', res.id, '| _pbWizard=', JSON.stringify(_pbWizard));
        _pbWizard.customerId = res.id;
        _pbWizard.customerName = nameVal;
        setTimeout(function(){
          console.log('[Wizard] setTimeout fired, calling _pbWizardGoToStep(1). CMS.currentPage=', CMS.currentPage, '| pbWizardStepBody exists=', !!document.getElementById('pbWizardStepBody'));
          _pbWizardGoToStep(1);
        }, 150);
      } else {
        // Normal flow (not the wizard): auto-chain into Add Account, same
        // as always. Opened in the next JS tick — safely outside the GAS
        // callback chain so _cliEnsureContractsLoaded can fire its own call.
        setTimeout(function() { cliOpenAdd(res.id); }, 50);
      }
      // Full background reload (happens concurrently; won't block modal open)
      setTimeout(function() { _reloadCustomers(function(){ _custAll = CMS.customers.slice(); custApplyFilters(); }); }, 500);
    } else {
      _custRefresh();
      closeModal(); showToast('Customer saved.', 'success');
    }
  }
  function onFail(err) { showToast(err.message, 'error'); if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Save'; } }
  if (id) google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).updateCustomer(id, payload);
  else    google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).createCustomer(payload);
}

function custConfirmDelete(id, custName) {
  openModal('<div class="modal-header"><div class="modal-title">Delete Customer</div><button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button></div>' +
    '<div class="modal-body"><p style="font-size:14px;">Delete <strong>' + _esc(custName) + '</strong>?</p><p style="font-size:13px;color:var(--text-muted);margin-top:8px;">All associated clients must be removed first. This can\'t be undone.</p>' +
      '<div class="form-group" style="margin-top:14px;"><label class="form-label">Type <strong>DELETE</strong> to confirm</label>' +
        '<input class="form-input" id="f_custDeleteConfirm" type="text" placeholder="DELETE" autocomplete="off" /></div>' +
      '<div id="custDeleteErr" style="color:var(--danger);font-size:12.5px;"></div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-danger" id="custDeleteBtn" onclick="custDoDelete(\'' + _esc(id) + '\')">Delete</button></div>');
}
function custDoDelete(id) {
  var confirmText = ((document.getElementById('f_custDeleteConfirm')||{}).value||'').trim();
  var errEl = document.getElementById('custDeleteErr');
  if (confirmText !== 'DELETE') { if (errEl) errEl.textContent = 'Type DELETE (all caps) to confirm.'; return; }
  var btn = document.getElementById('custDeleteBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Deleting…'; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success) { closeModal(); showToast('Deleted.', 'success'); _custRefresh(); }
      else { if (errEl) errEl.textContent = (res && res.error) || 'Failed.'; if (btn) { btn.disabled=false; btn.textContent='Delete'; } }
    })
    .withFailureHandler(function (err) { if (errEl) errEl.textContent = err.message; if (btn) { btn.disabled=false; btn.textContent='Delete'; } })
    .deleteCustomer(id, confirmText);
}
function _custRefresh() {
  CMS.customers = []; // clear cache — force re-fetch from server
  _reloadCustomers(function () { _custAll = CMS.customers.slice(); custApplyFilters(); });
}

function cliApplyFilters() {
  if (window._cliStatusTabFilter === undefined) window._cliStatusTabFilter = 'Active';
  var searchVal = ((document.getElementById('cliSearch')       || {}).value || '').toLowerCase();
  var statusVal = (document.getElementById('cliStatusFilter') && document.getElementById('cliStatusFilter').value) || window._cliStatusTabFilter || '';
  var catVal    = ((document.getElementById('cliCatFilter')    || {}).value || '');
  var typeVal   = ((document.getElementById('cliTypeFilter')   || {}).value || '');
  var specVal   = ((document.getElementById('cliSpecFilter')   || {}).value || '');
  var preset    = window._cliDatePreset || 'all';
  var dateRange = _getPresetRange(preset, 'cli');
  var dateField = _dateFieldForStatus(statusVal);
  _cliFiltered = _cliAll.filter(function (row) {
    var matchQ = !searchVal || [row.companyName, row.accountName, row.primaryContact, row.clientId, row.customerName].some(function (fld) { return (fld || '').toLowerCase().includes(searchVal); });
    // Multi-status checkboxes take priority over the tab/dropdown
    var multi = window._cliStatusMulti || [];
    var matchS = (multi.length > 0)
      ? (multi.indexOf(row.status) !== -1)
      : (!statusVal || row.status === statusVal);
    var matchC = !catVal  || row.category === catVal;
    var matchT = !typeVal || row.type     === typeVal;
    var matchSp= !specVal || (row.assignedSpecialist || '') === specVal;
    var matchD = true;
    if (dateRange.from || dateRange.to) {
      var rawDate = row[dateField];
      var d = rawDate ? new Date(rawDate) : null;
      if (d) {
        if (dateRange.from && d < dateRange.from) matchD = false;
        if (dateRange.to   && d > dateRange.to)   matchD = false;
      } else { matchD = false; }
    }
    var matchOpenSR   = !(document.getElementById('cliFilterOpenSR')   && document.getElementById('cliFilterOpenSR').checked)   || (row.openRequests  > 0);
    var matchActiveVA = !(document.getElementById('cliFilterActiveVA') && document.getElementById('cliFilterActiveVA').checked) || (row.activeVACount > 0);
    var matchWarn     = !(document.getElementById('cliFilterWarnings') && document.getElementById('cliFilterWarnings').checked) || (_cliWarnings(row).length > 0);
    return matchQ && matchS && matchC && matchT && matchSp && matchD && matchOpenSR && matchActiveVA && matchWarn;
  });
  _cliFiltered.sort(function (rowA, rowB) {
    // Date fields must be compared as timestamps, not strings
    if (_cliSortField === 'createdAt' || _cliSortField === 'updatedAt' || _cliSortField === 'statusDate') {
      var ta = rowA[_cliSortField] ? new Date(rowA[_cliSortField]).getTime() : 0;
      var tb = rowB[_cliSortField] ? new Date(rowB[_cliSortField]).getTime() : 0;
      return _cliSortAsc ? ta - tb : tb - ta;
    }
    var va = String(rowA[_cliSortField] || '').toLowerCase();
    var vb = String(rowB[_cliSortField] || '').toLowerCase();
    return _cliSortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
  });
  _cliPage = 1;
  cliRender();
}

          : '—') +

          : (row.status === 'Paused'
              ? '<button class="btn btn-ghost btn-icon" title="Resume Account" onclick="cliOpenStatusAction(\''+_esc(row.clientId)+'\',\''+_esc(row.companyName)+'\',\'Active\')">▶</button>' +
                '<button class="btn btn-ghost btn-icon" style="color:var(--danger);" title="Terminate Account" onclick="cliOpenStatusAction(\''+_esc(row.clientId)+'\',\''+_esc(row.companyName)+'\',\'Terminated\')">✕</button>'

                '<button class="btn btn-ghost btn-icon" style="color:var(--danger);" title="Terminate Account" onclick="cliOpenStatusAction(\''+_esc(row.clientId)+'\',\''+_esc(row.companyName)+'\',\'Terminated\')">✕</button>')) +
        (canDel ? '<button class="btn btn-ghost btn-icon" title="Delete" style="color:var(--danger)" onclick="cliConfirmDelete(\'' + _esc(row.clientId) + '\',\'' + _esc(row.companyName) + '\')">' + _svgTrash() + '</button>' : '') +
      '</div></td>' +

  _cliRenderPager();

function _cliRenderPager() {
  var el = document.getElementById('cliPager'); if (!el) return;
  var total     = _cliFiltered.length;
  var pageCount = Math.max(1, Math.ceil(total / _cliPageSize));
  var startNum  = (_cliPage - 1) * _cliPageSize + 1;
  var endNum    = Math.min(_cliPage * _cliPageSize, total);
  var btns = '';
  for (var pg = 1; pg <= pageCount; pg++) {
    if (pg === 1 || pg === pageCount || Math.abs(pg - _cliPage) <= 1) btns += '<button class="page-btn' + (pg === _cliPage ? ' active' : '') + '" onclick="cliGoPage(' + pg + ')">' + pg + '</button>';
    else if (Math.abs(pg - _cliPage) === 2) btns += '<span style="padding:0 4px;color:var(--text-muted)">…</span>';
  }
  el.innerHTML = '<span>Showing ' + (total ? startNum : 0) + '–' + endNum + ' of ' + total + '</span>' +
    '<div class="page-btns"><button class="page-btn" onclick="cliGoPage(' + (_cliPage - 1) + ')"' + (_cliPage === 1 ? ' disabled' : '') + '>‹</button>' +
    btns + '<button class="page-btn" onclick="cliGoPage(' + (_cliPage + 1) + ')"' + (_cliPage >= pageCount ? ' disabled' : '') + '>›</button></div>';
}

function cliSort(field)       { _cliSortField === field ? _cliSortAsc = !_cliSortAsc : (_cliSortField = field, _cliSortAsc = true); cliApplyFilters(); }
function cliSetPageSize(val)  { _cliPageSize = parseInt(val); _cliPage = 1; cliRender(); }
function cliGoPage(pg)        { var maxPg = Math.max(1, Math.ceil(_cliFiltered.length / _cliPageSize)); if (pg >= 1 && pg <= maxPg) { _cliPage = pg; cliRender(); } }

// Build customer <option> list from CMS.customers — always synchronous
function _buildCustOptions(prefillId, selectedId) {
  var custList = (CMS.customers||[]).slice().sort(function(a,b){return(a.customerName||'').localeCompare(b.customerName||'');});
  console.log('[CMS] _buildCustOptions: CMS.customers.length =', custList.length, '| prefill =', prefillId, '| selected =', selectedId);
  if (!custList.length) return '<option value="">No customers yet — add one first</option>';
  return custList.map(function (custRow) {
    var isSel = (custRow.customerId === selectedId || custRow.customerId === prefillId);
    return '<option value="' + _esc(custRow.customerId) + '"' + (isSel ? ' selected' : '') + '>' + _esc(custRow.customerName) + '</option>';
  }).join('');
}

// ── Country/Region of Focal Person — selection + inline "add new" flow ────
// Looks up the timezone tied to the selected Country/Region (set via Settings
// or the inline add-new panel below) and shows it as a hint under the field.
// Picking "+ Add new Country/Region…" reveals an inline panel instead of a
// second modal, since openModal() replaces the whole modal body and would
// otherwise discard the Add Account form already in progress.
function cliRegionChanged(sel) {
  var panel = document.getElementById('f_regionAddNewPanel');
  var hint  = document.getElementById('f_regionTzHint');
  if (sel.value === '__add_new__') {
    if (panel) panel.style.display = '';
    if (hint) hint.textContent = '';
    return;
  }
  if (panel) panel.style.display = 'none';
  _cliShowRegionTzHint(sel.value);
}

function _cliShowRegionTzHint(regionValue) {
  var hint = document.getElementById('f_regionTzHint');
  if (!hint) return;
  if (!regionValue) { hint.textContent = ''; return; }
  var entry = ((CMS.settings && CMS.settings.CountryRegion) || []).find(function(r){ return r.value === regionValue; });
  hint.textContent = (entry && entry.timezone) ? ('Timezone: ' + entry.timezone) : 'No timezone set for this Country/Region yet — add one in Settings.';
}

function cliRegionCancelNew() {
  var panel = document.getElementById('f_regionAddNewPanel');
  var sel   = document.getElementById('f_region');
  if (panel) panel.style.display = 'none';
  if (sel) sel.value = '';
  var err = document.getElementById('f_regionAddNewErr'); if (err) err.textContent = '';
}

function cliRegionSaveNew() {
  var valEl = document.getElementById('f_regionNewValue');
  var tzEl  = document.getElementById('f_regionNewTimezone');
  var errEl = document.getElementById('f_regionAddNewErr');
  var val   = valEl ? valEl.value.trim() : '';
  if (!val) { if (errEl) errEl.textContent = 'Enter a name for the new Country/Region.'; return; }
  if (errEl) errEl.textContent = '';
  var btn = document.getElementById('f_regionAddNewSaveBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  var payload = { category: 'CountryRegion', value: val, label: val, timezone: tzEl ? tzEl.value : '' };
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) {
        if (errEl) errEl.textContent = (res && res.errors ? res.errors.join(' ') : (res && res.error)) || 'Save failed.';
        if (btn) { btn.disabled = false; btn.textContent = 'Save & Use'; }
        return;
      }
      // Refresh the settings map so CMS.settings.CountryRegion includes the
      // new entry (with its timezone), then rebuild the dropdown in place
      // and select it — all without closing the Add Account form.
      google.script.run
        .withSuccessHandler(function(settingsMap) {
          if (settingsMap) CMS.settings = settingsMap;
          var sel = document.getElementById('f_region');
          var panel = document.getElementById('f_regionAddNewPanel');
          if (sel) {

              '<button type="button" id="weModeSource" onclick="_cliSetWelcomeBodyView(false)" style="padding:3px 12px;border:none;cursor:pointer;background:var(--surface-2);color:var(--text-secondary);font-size:12px;">Source (HTML)</button>' +
            '</div>' : '') +
          '</div>' +
          '<div id="weBodyPreview" contenteditable="true" style="min-height:180px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;line-height:1.6;display:'+(isHtml?'':'none')+';overflow-y:auto;max-height:320px;">'+d.body+'</div>' +

          (isHtml ? '<div class="form-hint">Preview shows the email as it will actually look (e.g. line breaks render properly). Switch to Source to edit the raw HTML directly. Both stay in sync.</div>' : '') +

          '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +

    })

    .getWelcomeEmailPreview(clientId, templateId);
}
// Toggles between the rendered HTML preview (contenteditable, so <br> etc.
// actually render as line breaks instead of showing as literal text) and
// the raw HTML source in the textarea — syncing content across the
// switch so edits made in either view aren't lost.
function _cliSetWelcomeBodyView(showPreview) {
  var previewEl = document.getElementById('weBodyPreview');
  var sourceEl = document.getElementById('f_weBody');
  var btnPreview = document.getElementById('weModePreview');
  var btnSource = document.getElementById('weModeSource');
  if (!previewEl || !sourceEl) return;
  if (showPreview) {
    previewEl.innerHTML = sourceEl.value; // pull any Source edits into Preview
    previewEl.style.display = '';
    sourceEl.style.display = 'none';
  } else {
    sourceEl.value = previewEl.innerHTML; // pull any Preview edits into Source
    previewEl.style.display = 'none';
    sourceEl.style.display = '';
  }
  if (btnPreview) { btnPreview.style.background = showPreview ? 'var(--accent)' : 'var(--surface-2)'; btnPreview.style.color = showPreview ? '#fff' : 'var(--text-secondary)'; }
  if (btnSource) { btnSource.style.background = !showPreview ? 'var(--accent)' : 'var(--surface-2)'; btnSource.style.color = !showPreview ? '#fff' : 'var(--text-secondary)'; }
}
function _cliDoSendWelcomeEmail(clientId) {
  // If currently in Preview mode, pull those edits back into the source
  // textarea first — otherwise sending would use whatever was last in
  // Source, silently dropping anything typed directly into Preview.
  var previewEl = document.getElementById('weBodyPreview');
  var sourceEl = document.getElementById('f_weBody');
  if (previewEl && sourceEl && previewEl.style.display !== 'none') {
    sourceEl.value = previewEl.innerHTML;
  }
  var toRaw = ((document.getElementById('f_weTo')||{}).value||'').trim();
  var toList = toRaw.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  var subject = ((document.getElementById('f_weSubject')||{}).value||'').trim();
  var body = (document.getElementById('f_weBody')||{}).value||'';
  var isHtml = (document.getElementById('f_weIsHtml')||{}).value === '1';
  var errEl = document.getElementById('weErr');
  if (!toList.length) { if (errEl) errEl.textContent = 'At least one recipient email is required.'; return; }
  if (!subject || !body.trim()) { if (errEl) errEl.textContent = 'Subject and body are required.'; return; }
  if (errEl) errEl.textContent = '';
  var btn = document.getElementById('weSendBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { if (errEl) errEl.textContent = (res&&res.error)||'Failed to send.'; if (btn){btn.disabled=false;btn.textContent='Send';} return; }
      closeModal();
      showToast('Welcome email sent.', 'success');
    })
    .withFailureHandler(function(err) { if (errEl) errEl.textContent = err.message; if (btn){btn.disabled=false;btn.textContent='Send';} })
    .sendWelcomeEmail(clientId, subject, body, toList, isHtml, window._weCurrentTemplateName || '');
}

// Enable Save button only when a field changes — shared by both cliOpenEdit paths
function _cliOpenEditPostSetup() {
  setTimeout(function() {
    var modal = document.getElementById('modalBox');
    var btn   = document.getElementById('cliSubmitBtn');
    if (!modal || !btn) return;
    function enableSave() { btn.disabled = false; btn.style.opacity = ''; }
    modal.querySelectorAll('input,select,textarea').forEach(function(el) {
      el.addEventListener('change', enableSave);
      el.addEventListener('input',  enableSave);
    });

    var regionSel = document.getElementById('f_region');

  var isEdit      = !!rec;

  var appSettings = CMS.settings || {};
  var custOpts    = _buildCustOptions(prefillCustId, rec && rec.customerId);

  function buildOptions(optionArr, currentVal, defaultVal) {
    return (optionArr || []).map(function (optItem) {
      var isSel = currentVal ? (currentVal === optItem.value) : (defaultVal === optItem.value);
      return '<option value="' + _esc(optItem.value) + '"' + (isSel ? ' selected' : '') + '>' + _esc(optItem.label) + '</option>';
    }).join('');
  }

  var statusOptions = ['Pending', 'Active', 'Paused', 'Inactive', 'Terminated', 'Cancelled'].map(function (s) {
    return '<option value="' + s + '"' + (rec && rec.status === s ? ' selected' : ((!rec && s === 'Active') ? ' selected' : '')) + '>' + s + '</option>';
  }).join('');

  // Focal defaults: primary is focal by default for new records
  var priIsFocal = rec ? rec.primaryIsFocal === true : true;
  var secIsFocal = rec ? rec.secondaryIsFocal === true : false;

  // Find customer name for Same-as-Customer features
  var custName = '';

    var custMatch = CMS.customers.find(function (cr) { return cr.customerId === effectiveCustId; });

// When customer dropdown changes: auto-fill Company Name if "Same as Customer" is checked
function cliFormCustomerChanged(sel) {
  if ((document.getElementById('f_sameAsCustomer')    || {}).checked) cliToggleSameAsCustomer();
  if ((document.getElementById('f_acctNameSameAs')    || {}).checked) cliAcctNameSameAs();
  if ((document.getElementById('f_priContactSameAs')  || {}).checked) cliPriContactSameAs();
  if ((document.getElementById('f_invSameAsCust')     || {}).checked) cliInvSameAsToggle();
}

// Sync Company Name field with customer name when checkbox is checked
function cliToggleSameAsCustomer() {
  var cb     = document.getElementById('f_sameAsCustomer');
  var field  = document.getElementById('f_companyName');
  var custId = (document.getElementById('f_customerId') || {}).value;
  var cust   = custId && CMS.customers.find(function (cr) { return cr.customerId === custId; });
  if (cb && cb.checked && cust) {
    if (field) { field.value = cust.customerName; field.readOnly = true; field.style.background = 'var(--surface-2)'; }
  } else {
    if (field) { field.readOnly = false; field.style.background = ''; }
  }
}

// If "Same as Customer" is already checked, keep company name in sync as user types (prevents overriding)
function cliSyncCompanyName() {
  var cb = document.getElementById('f_sameAsCustomer');
  if (cb && cb.checked) cliToggleSameAsCustomer();
}

// Invoice: Same as Customer Name checkbox
function cliInvSameAsToggle() {
  var cb     = document.getElementById('f_invSameAsCust');
  var nameEl  = document.getElementById('f_invName');
  var roleEl  = document.getElementById('f_invRole');
  var emailEl = document.getElementById('f_invEmail');
  var priName  = (document.getElementById('f_primaryContact') || {}).value || '';
  var priRole  = (document.getElementById('f_primaryRole')    || {}).value || '';
  var priEmail = (document.getElementById('f_primaryEmail')   || {}).value || '';
  function setLocked(el, val) { if(el){ el.value=val; el.readOnly=true; el.style.background='var(--surface-2)'; } }
  function setFree(el)  { if(el){ el.readOnly=false; el.style.background=''; } }
  if (cb && cb.checked) {
    setLocked(nameEl, priName); setLocked(roleEl, priRole); setLocked(emailEl, priEmail);
  } else {
    setFree(nameEl); setFree(roleEl); setFree(emailEl);
  }
}

// Secondary focal toggle button
function cliToggleSecFocal() {
  var btn       = document.getElementById('btn_secFocal');
  var secHidden = document.getElementById('f_secondaryIsFocal');
  var priHidden = document.getElementById('f_primaryIsFocal');
  var priBadge  = document.getElementById('pri_focal_badge');
  if (!btn || !secHidden) return;
  var isNowFocal = secHidden.value !== 'true';
  // Secondary becomes focal
  secHidden.value        = isNowFocal ? 'true' : 'false';
  btn.textContent        = isNowFocal ? '✓ Focal Person' : 'Make Focal Person';
  btn.style.borderColor  = isNowFocal ? 'var(--accent)' : 'var(--border)';
  btn.style.background   = isNowFocal ? 'var(--accent-light)' : 'transparent';
  btn.style.color        = isNowFocal ? 'var(--accent)' : 'var(--text-secondary)';
  // If secondary is now focal, remove focal from primary
  if (isNowFocal && priHidden) {
    priHidden.value = 'false';
    if (priBadge) {
      priBadge.innerHTML = '<button type="button" id="btn_priFocal" onclick="cliTogglePriFocal()" style="padding:7px 14px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:transparent;color:var(--text-secondary);">Make Focal Person</button>';
    }
  } else if (!isNowFocal && priHidden) {
    // Restore primary as focal when secondary is unfocaled
    priHidden.value = 'true';
    if (priBadge) {
      priBadge.innerHTML = '<div style="padding:7px 12px;background:var(--accent-light);border:1.5px solid var(--accent);border-radius:var(--radius-sm);font-size:12.5px;color:var(--accent);font-weight:600;">✓ Focal Person</div>';
    }
  }
}

function cliTogglePriFocal() {
  var priHidden = document.getElementById('f_primaryIsFocal');
  var priBadge  = document.getElementById('pri_focal_badge');
  var secHidden = document.getElementById('f_secondaryIsFocal');
  var secBtn    = document.getElementById('btn_secFocal');
  if (!priHidden) return;
  priHidden.value = 'true';
  if (priBadge) {
    priBadge.innerHTML = '<div style="padding:7px 12px;background:var(--accent-light);border:1.5px solid var(--accent);border-radius:var(--radius-sm);font-size:12.5px;color:var(--accent);font-weight:600;">✓ Focal Person</div>';
  }
  // Remove focal from secondary
  if (secHidden) secHidden.value = 'false';
  if (secBtn) {
    secBtn.textContent       = 'Make Focal Person';
    secBtn.style.borderColor = 'var(--border)';
    secBtn.style.background  = 'transparent';
    secBtn.style.color       = 'var(--text-secondary)';
  }
}

function cliMgrRemove(btn) {

function _cliMgrInsertTag(name) {
  var container = document.getElementById('mgrsTagContainer');

  if (!container || !inp) return;
  var tag = document.createElement('span');
  tag.className = 'mgr-tag';

    '<button type="button" onclick="cliMgrRemove(this)" style="margin-left:4px;background:none;border:none;cursor:pointer;font-size:12px;color:var(--text-muted);">×</button>';

function _cliMgrSyncHidden() {

function cliSubmit(id) {
  var custIdVal  = (document.getElementById('f_customerId')  || {}).value;
  var companyVal = ((document.getElementById('f_companyName') || {}).value || '').trim();
  var errEl      = document.getElementById('cliFormErr');
  if (!custIdVal)  { if (errEl) errEl.textContent = 'Please select a Customer.'; return; }
  if (!companyVal) { if (errEl) errEl.textContent = 'Company Name is required.';  return; }
  if (errEl) errEl.textContent = '';
  var submitBtn = document.getElementById('cliSubmitBtn');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Saving…'; }
  var payload = {
    customerId:          custIdVal,
    companyName:         companyVal,
    accountName:         ((document.getElementById('f_accountName')      || {}).value || '').trim(),
    primaryContact:      ((document.getElementById('f_primaryContact')   || {}).value || '').trim(),
    primaryRole:         ((document.getElementById('f_primaryRole')      || {}).value || '').trim(),
    primaryEmail:        ((document.getElementById('f_primaryEmail')     || {}).value || '').trim(),
    primaryIsFocal:           (document.getElementById('f_primaryIsFocal') || {}).value === 'true',
    primaryLinkedToCustomer:  !!(document.getElementById('f_sameAsCustomer') || {}).checked,
    secondaryContact:    ((document.getElementById('f_secondaryContact') || {}).value || '').trim(),
    secondaryRole:       ((document.getElementById('f_secondaryRole')    || {}).value || '').trim(),
    secondaryEmail:      ((document.getElementById('f_secondaryEmail')   || {}).value || '').trim(),
    secondaryIsFocal:    (document.getElementById('f_secondaryIsFocal') || {}).value === 'true',
    accountManagers:     ((document.getElementById('f_accountManagers')  || {}).value || '').split(',').map(function(s){return s.trim();}).filter(Boolean).join(', '),
    invoiceContactName:  ((document.getElementById('f_invName')          || {}).value || '').trim(),
    invoiceContactRole:  ((document.getElementById('f_invRole')          || {}).value || '').trim(),
    invoiceContactEmail: ((document.getElementById('f_invEmail')         || {}).value || '').trim(),
    category:            (document.getElementById('f_category')   || {}).value || 'Seller',
    type:                (document.getElementById('f_type')       || {}).value || 'Silver',
    countryRegion:       (document.getElementById('f_region')     || {}).value || '',
    status:              (document.getElementById('f_cliStatus')  || {}).value || 'Pending',
    notes:               (document.getElementById('f_cliNotes')   || {}).value || '',
    sellerOnboardingLink: (document.getElementById('f_onboardingLink') || {}).value || '',
    contractId:          (document.getElementById('f_contractId')  || {}).value || '',
    createdAt:           (document.getElementById('f_createdAt') || {}).value || ''
  };
  function onDone(res) {
    if (!res || !res.success) { if (errEl) errEl.textContent = res && res.errors ? res.errors.join(' ') : ((res && res.error) || 'Save failed.'); if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = id ? 'Save Changes' : 'Create Client'; } return; }
    closeModal();
    showToast(res.isReturning ? 'Saved — marked as Returning Customer.' : 'Client saved.', res.isReturning ? 'warning' : 'success');
    _cliRefresh();
    // Switch to Change History tab after an edit so user sees the changes
    if (id && CMS.currentPage === 'client-profile' && CMS.currentParam) {
      setTimeout(function() { profileSwitchTab('history', 'client', CMS.currentParam); }, 400);
    }
    if (!id && _pbWizardIsActuallyActive()) {
      console.log('[Wizard] Account created, advancing to next step. clientId=', res.id, '| _pbWizard=', JSON.stringify(_pbWizard));
      _pbWizard.clientId = res.id;
      setTimeout(function(){
        console.log('[Wizard] setTimeout fired, calling _pbWizardGoToStep(' + (_pbWizard.stepIndex + 1) + ').');
        _pbWizardGoToStep(_pbWizard.stepIndex + 1);
      }, 150);
    }
  }
  function onFail(err) { showToast(err.message, 'error'); if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Save'; } }
  if (id) google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).updateClient(id, payload);
  else    google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).createClient(payload);
}

function _acctToggleWaiverField(which) {
  var waived = (document.getElementById('f_acct'+which+'Waived')||{}).checked;

  if (wrap) wrap.style.display = waived ? '' : 'none';

function acctDoAddInitialBilling(clientId) {
  var errEl = document.getElementById('acctInitialBillingErr');
  var otfWaived = (document.getElementById('f_acctOtfWaived')||{}).checked;
  var otfReason = ((document.getElementById('f_acctOtfReason')||{}).value||'').trim();
  var depositWaived = (document.getElementById('f_acctDepositWaived')||{}).checked;
  var depositReason = ((document.getElementById('f_acctDepositReason')||{}).value||'').trim();
  if (otfWaived && !otfReason) { if (errEl) errEl.textContent = 'A reason is required when waiving or discounting the One-Time Fee.'; return; }
  if (depositWaived && !depositReason) { if (errEl) errEl.textContent = 'A reason is required when waiving or discounting the Deposit.'; return; }
  var btn = document.getElementById('acctInitialBillingBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  var payload = {
    clientId: clientId,
    oneTimeFeeAmount: (document.getElementById('f_acctOtfAmount')||{}).value || 250,
    otfWaived: otfWaived, otfWaiverReason: otfReason,
    depositAmount: (document.getElementById('f_acctDepositAmount')||{}).value || 250,
    depositWaived: depositWaived, depositWaiverReason: depositReason
  };
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { if (errEl) errEl.textContent = (res&&res.error)||'Failed.'; if (btn) { btn.disabled=false; btn.textContent='Save'; } return; }
      closeModal();
      showToast('Initial billing added.', 'success');
      if (CMS.currentPage === 'client-profile' && CMS.currentParam) profileSwitchTab('billing', 'client', CMS.currentParam);
    })
    .withFailureHandler(function(err) { if (errEl) errEl.textContent = err.message; if (btn) { btn.disabled=false; btn.textContent='Save'; } })
    .createEnrollment(payload);
}

function _cliStatusDateMaxToggle(status) {

  else el.removeAttribute('max');

function cliDoStatusChange(clientId) {
  var checkedRadio = document.querySelector('input[name="statusChoice"]:checked');
  var statusVal    = checkedRadio ? checkedRadio.value : '';
  var dateVal      = ((document.getElementById('f_statusDate')   || {}).value || '');
  var reasonVal    = ((document.getElementById('f_statusReason') || {}).value || '').trim();
  var categoryVal  = (document.getElementById('f_scCategory')    || {}).value || '';
  var typeVal      = (document.getElementById('f_scType')        || {}).value || '';
  var errEl        = document.getElementById('statusChangeErr');

  if (!statusVal) { if (errEl) errEl.textContent = 'Please select a status.'; return; }
  if (errEl) errEl.textContent = '';

  var btn = document.getElementById('statusChangeBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        if (errEl) errEl.textContent = (res && res.error) || 'Failed.';
        if (btn) { btn.disabled = false; btn.textContent = 'Update Status'; }
        return;
      }
      closeModal();
      var msg = 'Status updated to ' + statusVal + '.';
      if (res.isReturning) msg += ' Marked as Returning Account.';
      showToast(msg, statusVal === 'Active' ? 'success' : 'warning');
      _cliRefresh();

      // Offer to cascade to customer if account is Terminal
      var isCancelled   = statusVal === 'Cancelled';
      var isTerminated  = statusVal === 'Terminated';
      var custId        = res.customerId || '';
      if (custId && (isCancelled || isTerminated)) {
        setTimeout(function () {
          _offerCustomerStatusCascade(custId, statusVal, isTerminated);
        }, 600);
      }
    })
    .withFailureHandler(function (err) {
      showToast(err.message, 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Update Status'; }
    })
    .updateClientStatusFull(clientId, statusVal, reasonVal, dateVal, categoryVal, typeVal);
}

// ── Customer Profile: Pause / Terminate / Resume from profile page ────
// Opened by the Pause, Terminate, and Resume buttons in the profile hero.
// Loads the latest customer data to check for active VA Connections before
// allowing the status change — a customer with active VAs cannot be paused
// or terminated (the work relationship must be formally ended first via the
// VA Connection flow).
function custOpenStatusAction(customerId, customerName, newStatus) {
  openModal(_loadingModal('160px', 'Loading customer details…'));
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { closeModal(); showToast((res&&res.error)||'Could not load customer.', 'error'); return; }
      var cust = res.data;
      var clients = cust.clients || [];

      // Check for active VA Connections across all accounts
      var hasActiveConn = false;
      google.script.run
        .withSuccessHandler(function(connRes) {
          var allConns = (connRes && connRes.success) ? connRes.data : [];
          var activeConns = allConns.filter(function(c) {
            return clients.some(function(cl){ return cl.clientId === c.clientId; }) &&
                   c.connectionStatus === 'Started';
          });
          hasActiveConn = activeConns.length > 0;

          var isPause    = newStatus === 'Paused';
          var isTerminate= newStatus === 'Terminated';
          var isResume   = newStatus === 'Active';
          var actionLabel = isResume ? 'Resume' : isPause ? 'Pause' : 'Terminate';
          var actionColor = isResume ? 'btn-primary' : isPause ? 'btn-warning' : 'btn-danger';

          var bodyHtml = '';

          if (hasActiveConn && !isResume) {
            // Blocking state — cannot pause/terminate while VAs are active
            bodyHtml =
              '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius-md);padding:14px 16px;margin-bottom:16px;">' +
                '<div style="font-weight:700;color:#b91c1c;margin-bottom:6px;">⛔ Cannot ' + actionLabel + '</div>' +
                '<div style="font-size:13px;color:#7f1d1d;line-height:1.6;">' +
                  '<strong>' + _esc(customerName) + '</strong> has <strong>' + activeConns.length + ' active VA connection' + (activeConns.length>1?'s':'') + '</strong>. ' +
                  'You must end all active VA connections before pausing or terminating a customer.' +
                '</div>' +
              '</div>' +
              '<div style="font-size:13px;color:var(--text-secondary);">Go to each Account\'s VA Connections tab to terminate the active connections, then return here to change the customer status.</div>';
            document.getElementById('modalBox').style.maxWidth = '500px';
            openModal(
              '<div class="modal-header"><div class="modal-title">Cannot ' + actionLabel + ' Customer</div><button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>' +
              '<div class="modal-body">' + bodyHtml + '</div>' +
              '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>'
            );
            return;
          }

          // Build list of accounts that will be affected
          var nonTerminated = clients.filter(function(cl){ return cl.status !== 'Terminated' && cl.status !== 'Cancelled'; });
          var affectedList = nonTerminated.length
            ? '<ul style="margin:10px 0 0 16px;font-size:13px;color:var(--text-secondary);line-height:1.8;">' +
                nonTerminated.map(function(cl){ return '<li>'+_esc(cl.companyName+(cl.accountName?' — '+cl.accountName:''))+' <span class="badge badge-'+(cl.status||'').toLowerCase()+'">'+_esc(cl.status)+'</span></li>'; }).join('') +
              '</ul>'
            : '<div style="font-size:13px;color:var(--text-muted);margin-top:8px;">No active accounts to cascade to.</div>';

          var warningBox = isTerminate
            ? '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius-md);padding:12px 14px;margin-bottom:14px;font-size:13px;color:#7f1d1d;">' +
                '<strong>⚠ This action marks the customer as Terminated.</strong> All non-terminated accounts listed below will also be marked Terminated.' +
              '</div>'
            : isPause
              ? '<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:var(--radius-md);padding:12px 14px;margin-bottom:14px;font-size:13px;color:#78350f;">' +
                  '<strong>ℹ The customer and all active accounts will be set to Paused.</strong> VA connections are not affected.' +
                '</div>'
              : '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:var(--radius-md);padding:12px 14px;margin-bottom:14px;font-size:13px;color:#14532d;">' +
                  '<strong>▶ The customer and all Paused accounts will be set back to Active.</strong>' +
                '</div>';

          document.getElementById('modalBox').style.maxWidth = '520px';
          openModal(
            '<div class="modal-header"><div class="modal-title">' + actionLabel + ' Customer</div><button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>' +
            '<div class="modal-body">' +
              warningBox +
              '<div style="font-size:14px;font-weight:600;margin-bottom:6px;">' + _esc(customerName) + '</div>' +
              '<div style="font-size:13px;color:var(--text-muted);margin-bottom:4px;">The following accounts will also be updated:</div>' +
              affectedList +
              '<div class="form-group" style="margin-top:16px;">' +
                '<label class="form-label">Effective Date <span class="required">*</span></label>' +
                '<input class="form-input" type="date" id="custStatusActionDate" value="' + _todayStr() + '"' + (isTerminate ? ' max="' + _todayStr() + '"' : '') + ' />' +
              '</div>' +
              '<div id="custStatusActionErr" style="color:var(--danger);font-size:12.5px;margin-top:4px;"></div>' +
            '</div>' +
            '<div class="modal-footer">' +
              '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
              '<button class="btn ' + actionColor + '" ' +
                'data-cid="'+_esc(customerId)+'" data-status="'+_esc(newStatus)+'" ' +
                'data-accounts="'+_esc(JSON.stringify(nonTerminated.map(function(cl){return cl.clientId;})))+'" ' +
                'onclick="custDoStatusAction(this.dataset.cid,this.dataset.status,JSON.parse(this.dataset.accounts))">' +
                actionLabel + ' Customer' +
              '</button>' +
            '</div>'
          );
        })
        .withFailureHandler(function(err){ closeModal(); showToast(err.message, 'error'); })
        .getVAConnections({});
    })
    .withFailureHandler(function(err){ closeModal(); showToast(err.message, 'error'); })
    .getCustomerById(customerId);
}

        btn.disabled = false; btn.textContent = 'Yes, ' + status + ' Customer';

      if (res.pendingReview) {
        showToast('Customer status updated to ' + status + ' — flagged for CS Manager review.', 'warning');
      } else {
        showToast('Customer status updated to ' + status + '.', 'success');
      }
      navigate('customers');
    })
    .withFailureHandler(function(err){ if(errEl) errEl.textContent = err.message; btn.disabled=false; btn.textContent='Yes, '+status+' Customer'; })
    .updateCustomer(customerId, { status: status, statusDate: todayStr });

function _offerCustomerStatusCascade(customerId, accountStatus, isTerminate) {
  // Look up the customer record to check if this is the last non-active account
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) return;
      var cust = res.data;
      var custStatus = cust.status || '';
      // For Cancel: just offer if customer is not already cancelled
      // For Terminate: only offer if this was the last non-terminated account
      var clients = cust.clients || [];
      var activeCount = clients.filter(function(cl) {
        return cl.status !== 'Terminated' && cl.status !== 'Cancelled';
      }).length;

      var shouldOffer = false;
      if (isTerminate && activeCount === 0) shouldOffer = true;
      if (!isTerminate && custStatus !== 'Cancelled') shouldOffer = true;
      if (!shouldOffer) return;

      var newCustStatus = isTerminate ? 'Terminated' : 'Cancelled';
      if (custStatus === newCustStatus) return; // already in that state

      openModal(
        '<div class="modal-header">' +
          '<div class="modal-title">' + (isTerminate ? 'Terminate Customer?' : 'Cancel Customer?') + '</div>' +
          '<button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<p style="font-size:14px;margin-bottom:12px;">' +
            (isTerminate
              ? 'All accounts under <strong>' + _esc(cust.customerName) + '</strong> are now terminated.'
              : 'The account was cancelled under <strong>' + _esc(cust.customerName) + '</strong>.') +
          '</p>' +
          '<p style="font-size:13px;color:var(--text-muted);">Would you also like to ' +
            (isTerminate ? 'terminate' : 'cancel') + ' the customer record?' +
          '</p>' +
          '<div class="form-group" style="margin-top:14px;">' +
            '<label class="form-label">Effective Date</label>' +
            '<input type="date" class="form-input" id="custCascadeDate" value="' + _todayStr() + '" />' +
          '</div>' +
        '</div>' +
        '<div class="modal-footer">' +
          '<button class="btn btn-secondary" onclick="closeModal()">No, keep as-is</button>' +
          '<button class="btn ' + (isTerminate ? 'btn-danger' : 'btn-secondary') + '" ' +
          '<button class="btn ' + (isTerminate ? 'btn-danger' : 'btn-secondary') + '" data-custid="' + _esc(customerId) + '" data-newstatus="' + newCustStatus + '" onclick="custDoCascadeStatus(this.dataset.custid, this.dataset.newstatus)">' +
            'Yes, ' + newCustStatus + ' Customer' +
          '</button>' +
        '</div>'
      );
    })
    .withFailureHandler(function(){})
    .getCustomerById(customerId);
}

function custDoCascadeStatus(customerId, newStatus) {
  var dateVal = (document.getElementById('custCascadeDate')||{}).value || '';
  closeModal();
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { showToast((res&&res.error)||'Failed.', 'error'); return; }
      showToast('Customer marked as ' + newStatus + '.', 'warning');
      // Refresh customer list and profile if open
      _reloadCustomers(function(){});
    })
    .withFailureHandler(function(err){ showToast(err.message, 'error'); })
    .updateCustomer(customerId, { status: newStatus, statusDate: dateVal });
}

// ─── Active profile tab state
var _profileActiveTab = 'overview';

function profileSwitchTab(tabKey, entityType, entityId) {
  _profileActiveTab = tabKey;
  document.querySelectorAll('.profile-tab').forEach(function (tabBtn) {
    tabBtn.classList.toggle('active', tabBtn.dataset.tab === tabKey);
  });
  var body = document.getElementById('profileTabBody');
  if (!body) return;
  if (tabKey === 'overview') {
    if (entityType === 'customer') _profileCustomerOverview(body, window._profileData);
    else                            _profileClientOverview(body, window._profileData);
  } else if (tabKey === 'history') {
    _profileHistory(body, entityType, entityId);
  } else if (tabKey === 'requests' && entityType === 'client') {
    _profileClientRequests(body, entityId, window._profileData);
  } else if (tabKey === 'billing' && entityType === 'client') {
    _profileClientBilling(body, entityId, window._profileData);
  } else if (tabKey === 'inquiries' && entityType === 'client') {
    _profileClientInquiries(body, entityId, window._profileData);
  } else if (tabKey === 'va' && entityType === 'client') {
    _profileClientVAConnections(body, entityId);
  } else {
    body.innerHTML = '<div class="upcoming-page" style="padding:48px 24px;">' +
      '<div class="upcoming-badge">Upcoming Feature</div>' +
      '<h2>' + tabKey.charAt(0).toUpperCase() + tabKey.slice(1) + '</h2>' +
      '<p>This section will be available in a future release.</p></div>';
  }
}

function _profileTabBar(entityType, entityId) {
  var tabs = entityType === 'client' ? [
    { key: 'overview',  label: 'Overview' },
    { key: 'billing',   label: 'Billing' },
    { key: 'va',        label: 'VA Connections' },
    { key: 'requests',  label: 'Service Requests' },
    { key: 'inquiries', label: 'Inquiries' },
    { key: 'history',   label: 'History' }
  ] : [
    { key: 'overview',  label: 'Overview' },
    { key: 'history',   label: 'History' }
  ];
  return '<div class="profile-tab-bar">' +
    tabs.map(function (tabItem) {
      return '<button class="profile-tab' + (_profileActiveTab === tabItem.key ? ' active' : '') +
        (tabItem.upcoming ? ' tab-upcoming' : '') +
        '" data-tab="' + tabItem.key + '" onclick="profileSwitchTab(\'' + tabItem.key + '\',\'' + entityType + '\',\'' + _esc(entityId) + '\')">' +
        _esc(tabItem.label) +

    }).join('') +
  '</div>';
}

// Pre-fill request form with client/customer (from account/customer profile)
function reqOpenAddForClient(clientId, customerId) {
  reqOpenAdd();
  setTimeout(function() {
    var custSel   = document.getElementById('f_reqCustomer');
    var clientSel = document.getElementById('f_reqClient');
    var custSearchEl = document.getElementById('f_reqCustomerSearch');
    var cliSearchEl  = document.getElementById('f_reqClientSearch');
    if (custSel && customerId) {
      custSel.value    = customerId;
      custSel.disabled = true;
      // The hidden select drives actual submission; the visible combobox
      // input next to it is what the user actually sees, and previously
      // never got updated here — looking blank even though the form was
      // functionally correct underneath.
      var custMatch = (CMS.customers||[]).find(function(c){ return c.customerId === customerId; });
      if (custSearchEl) { custSearchEl.value = custMatch ? custMatch.customerName : ''; custSearchEl.disabled = true; }
      reqFormLoadClients(custSel);
      setTimeout(function() {
        if (clientSel && clientId) { clientSel.value = clientId; clientSel.disabled = true; }
        var cliMatch = _cliAll.find(function(c){ return c.clientId === clientId; }) || (window._profileData && window._profileData.clientId === clientId ? window._profileData : null);
        if (cliSearchEl) { cliSearchEl.value = cliMatch ? (cliMatch.accountName || cliMatch.companyName) : ''; cliSearchEl.disabled = true; }
        // Auto-detect request type: check if customer has prior Won requests
        var custReqs = _reqAll.filter(function(r){ return r.customerId === customerId; });
        var hasWon = custReqs.some(function(r){ return r.status === 'Closed - Won'; });
        var typeSel = document.getElementById('f_reqType');
        if (typeSel) typeSel.value = hasWon ? 'Additional' : 'New';
        // Load and disable contacts
        reqLoadContactsForClient(clientId);
        var priSel = document.getElementById('f_reqPrimary');
        var secSel = document.getElementById('f_reqSecondary');
        if (priSel) priSel.disabled = true;
        if (secSel) secSel.disabled = true;
      }, 650);
    }
  }, 200);
}

// Pre-fill inquiry form with client/customer
function iqOpenAddForClient(clientId, customerId) {
  iqOpenAdd();
  setTimeout(function() {
    var custSel = document.getElementById('iq_customer');
    if (custSel && customerId) {
      custSel.value = customerId;
      var custMatch = (CMS.customers||[]).find(function(c){ return c.customerId === customerId; });
      var searchEl = document.getElementById('iq_customerSearch');
      if (searchEl && custMatch) searchEl.value = custMatch.customerName;
      iqFormLoadAccounts();
      setTimeout(function() {
        var clientSel = document.getElementById('iq_client');
        if (clientSel) clientSel.value = clientId;
      }, 600);
    }

function _showCustomerProfile(custData) {

          (function() {

      '</div>' +
      '<div class="profile-meta-row">' +

function _profileCustomerOverview(body, custData) {

            '<span class="badge badge-' + (clientRow.status || '').toLowerCase() + '" style="font-size:10px;">' + _esc(clientRow.status || '—') + '</span>' +
          '</div>' +
          '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--text-secondary);">' +
            '<span><strong style="color:var(--text-muted);font-weight:600;">Primary:</strong> ' + _esc(clientRow.primaryContact || '—') + (clientRow.primaryIsFocal ? ' ⭐' : '') + '</span>' +

                '<h3>No clients yet</h3>' +

          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  canLoadCustomerNotes(custData.customerId);

function _cpToggleAccountVAs(expandId, caretId) {
  var panel = document.getElementById(expandId);
  var caret = document.getElementById(caretId);
  if (!panel) return;
  var isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : '';
  if (caret) caret.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(90deg)';
}
