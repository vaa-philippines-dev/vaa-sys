function _profileHistory(body, entityType, entityId) {
  if (!body) return;
  body.innerHTML = '<div class="loading-screen" style="height:160px;"><div class="loader-ring"></div><p style="font-size:12.5px;color:var(--text-muted);margin-top:8px;">Loading history…</p></div>';

  if (entityType === 'customer') {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          body.innerHTML = '<div class="empty-state"><h3>Failed to load history</h3><p>' + _esc((res&&res.error)||'') + '</p></div>';
          return;
        }
        _renderCustomerAccountHistory(body, res.accountHistory || [], res.vaConnectionHistory || []);
      })
      .withFailureHandler(function (err) {
        body.innerHTML = '<div class="empty-state"><h3>Failed to load history</h3><p>' + _esc(err.message) + '</p></div>';
      })
      .getCustomerAccountHistory(entityId);
    return;
  }

  var entityLabel = entityType === 'customer' ? 'Customer' : 'Client';

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success || !res.data.length) {
        body.innerHTML = '<div class="empty-state" style="padding:48px;">' +
          '<svg width="36" height="36" viewBox="0 0 20 20" fill="none"><path d="M2 10h3l2-6 4 12 2-6 2 4 1-4h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
          '<h3>No change history</h3><p>Any edits to this record will appear here automatically.</p></div>';
        return;
      }

      var logs = res.data;

      // ── Name changes summary panel (customer name or company name changes)
      var nameField     = entityType === 'customer' ? 'customerName' : 'companyName';
      var nameChanges   = logs.filter(function (logRow) {
        return logRow.action === 'UPDATE' && logRow.fieldChanged === nameField;
      });

      var nameSummaryHtml = '';
      if (nameChanges.length > 0) {
        var nameRows = nameChanges.map(function (logRow) {
          return '<div class="name-history-row">' +
            '<span class="history-val-old">' + _esc(String(logRow.oldValue || '—').substring(0, 80)) + '</span>' +
            '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0;"><path d="M3 7h8M8 4l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '<span class="history-val-new">' + _esc(String(logRow.newValue || '—').substring(0, 80)) + '</span>' +
            '<span class="history-time" style="margin-left:auto;">' + _formatDate(logRow.timestamp) + ' · ' + _esc(logRow.changedBy || '—') + '</span>' +
          '</div>';
        }).join('');

        nameSummaryHtml =
          '<div class="section-card" style="margin-bottom:14px;border-left:3px solid var(--accent);">' +
            '<div class="section-header">' +
              '<div><div class="section-title">Name History</div>' +
              '<div class="section-subtitle">' + nameChanges.length + ' name change' + (nameChanges.length !== 1 ? 's' : '') + ' on record</div></div>' +
            '</div>' +
            '<div style="padding:4px 0;">' + nameRows + '</div>' +
          '</div>';
      }

      // ── Status lifecycle panel (Pending → Active → Paused → Terminated → Active etc.)
      var statusChanges = logs.filter(function (logRow) {
        return logRow.action === 'UPDATE' && (logRow.fieldChanged === 'status' || logRow.fieldChanged === 'Status');
      });
      // Also add CREATE event as the "birth" entry
      var createEvent = logs.filter(function (logRow) { return logRow.action === 'CREATE'; });

      var lifecycleHtml = '';
      if (statusChanges.length > 0 || createEvent.length > 0) {
        var lifecycleEvents = [];
        // Add creation
        if (createEvent.length > 0) {
          lifecycleEvents.push({
            icon: '✦', color: 'var(--success)',
            label: 'Created',
            value: 'Status: ' + (entityType === 'customer' ? 'Pending' : 'Active'),
            time:  createEvent[0].timestamp,
            by:    createEvent[0].changedBy
          });
        }
        // Add each status change
        statusChanges.forEach(function (logRow) {
          var statusVal = String(logRow.newValue || '');
          var icon  = statusVal === 'Active' ? '✓' :
                      statusVal === 'Pending' ? '◷' :
                      statusVal === 'Paused' ? '⏸' :
                      statusVal === 'Terminated' || statusVal === 'Cancelled' ? '✕' : '→';
          var color = statusVal === 'Active' ? 'var(--success)' :
                      statusVal === 'Pending' ? 'var(--accent)' :
                      statusVal === 'Paused' ? '#ca8a04' :
                      statusVal === 'Terminated' || statusVal === 'Cancelled' ? 'var(--danger)' :
                      'var(--text-muted)';
          lifecycleEvents.push({
            icon: icon, color: color,
            label: statusVal,
            value: logRow.oldValue ? 'from ' + logRow.oldValue : '',
            time:  logRow.timestamp,
            by:    logRow.changedBy
          });
        });
        // Sort by time
        lifecycleEvents.sort(function (a, b) { return new Date(a.time||0) - new Date(b.time||0); });

        var lcRows = lifecycleEvents.map(function (ev) {
          return '<div class="lifecycle-row">' +
            '<div class="lifecycle-icon" style="color:' + ev.color + ';">' + ev.icon + '</div>' +
            '<div class="lifecycle-body">' +
              '<span class="lifecycle-label" style="color:' + ev.color + ';">' + _esc(ev.label) + '</span>' +
              (ev.value ? '<span class="lifecycle-from">' + _esc(ev.value) + '</span>' : '') +
            '</div>' +
            '<div class="lifecycle-meta">' +
              '<span class="history-time">' + _formatDate(ev.time) + '</span>' +
              '<span class="history-by" style="margin-left:8px;">· ' + _esc(ev.by || '—') + '</span>' +
            '</div>' +
          '</div>';
        }).join('');

        lifecycleHtml =
          '<div class="section-card" style="margin-bottom:14px;border-left:3px solid var(--accent);">' +
            '<div class="section-header">' +
              '<div><div class="section-title">Status Lifecycle</div>' +
              '<div class="section-subtitle">Full status history from creation to now</div></div>' +
            '</div>' +
            '<div class="lifecycle-timeline">' + lcRows + '</div>' +
          '</div>';
      }

      // ── Full timeline
      var timelineHtml = '<div class="history-timeline">';
      logs.forEach(function (logRow) {
        var isCreate = logRow.action === 'CREATE';
        var isDelete = logRow.action === 'DELETE';
        var dotClass = isCreate ? 'dot-create' : (isDelete ? 'dot-delete' : 'dot-update');

        timelineHtml += '<div class="history-item">' +
          '<div class="history-dot-col">' +
            '<div class="history-dot ' + dotClass + '"></div>' +
            '<div class="history-line"></div>' +
          '</div>' +
          '<div class="history-content">' +
            '<div class="history-header">' +
              '<span class="history-action history-action-' + logRow.action.toLowerCase() + '">' + _esc(logRow.action) + '</span>' +
              (logRow.fieldChanged ? '<span class="history-field">· ' + _esc(_friendlyFieldName(logRow.fieldChanged)) + '</span>' : '') +
              '<span class="history-by">by ' + _esc(logRow.changedBy || '—') + '</span>' +
              '<span class="history-time">' + _formatDate(logRow.timestamp) + '</span>' +
            '</div>' +
            (logRow.fieldChanged && (logRow.oldValue || logRow.newValue)
              ? '<div class="history-change-row">' +
                  (logRow.oldValue ? '<div class="history-old"><span class="history-val-label">Before</span> <span class="history-val-old">' + _esc(String(logRow.oldValue).substring(0, 120)) + '</span></div>' : '') +
                  (logRow.newValue ? '<div class="history-new"><span class="history-val-label">After</span> <span class="history-val-new">' + _esc(String(logRow.newValue).substring(0, 120)) + '</span></div>' : '') +
                '</div>'
              : '') +
          '</div>' +
        '</div>';
      });
      timelineHtml += '</div>';

      body.innerHTML =
        lifecycleHtml +
        nameSummaryHtml +
        '<div class="section-card">' +
          '<div class="section-header">' +
            '<div class="section-title">History</div>' +
            '<div class="section-subtitle">' + logs.length + ' event(s)</div>' +
          '</div>' +
          timelineHtml +
        '</div>';
    })
    .withFailureHandler(function (err) {
      body.innerHTML = '<div class="empty-state"><h3>Failed to load history</h3><p>' + _esc(err.message) + '</p></div>';
    })
    .getLogs({ entityId: entityId, entityType: entityLabel });
}

// Renders the Customer Profile's curated History tab — Account History
// (a unified timeline of Customer/Account creation and status events plus
// VA connect/terminate events, latest first) and VA Connection History
// (every VA connection under any of this customer's accounts, as a table,
// sorted by start date, latest first).
function _renderCustomerAccountHistory(body, accountHistory, vaConnectionHistory) {
  var AH_STATUS_COLOR = {
    'Active': 'var(--success)', 'Pending': 'var(--accent)', 'Paused': '#ca8a04',
    'Terminated': 'var(--danger)', 'Cancelled': 'var(--danger)'
  };
  var VA_STATUS_COLOR = {
    'Started': '#10b981', 'Accepted': 'var(--accent)', 'Pending': '#ca8a04',
    'Terminated': 'var(--danger)', 'Cancelled': 'var(--danger)', 'Declined': 'var(--danger)'
  };
  var canEditDates = CMS.user && (CMS.user.role === 'CS Specialist' || CMS.user.role === 'CS Manager' || CMS.user.role === 'Administrator');

  var ahRows = accountHistory.length ? accountHistory.map(function (ev, i) {
    var stColor = AH_STATUS_COLOR[ev.status] || 'var(--text-muted)';
    var details = [ev.col1, ev.col2, ev.col3].filter(function(v){ return v !== undefined && v !== ''; });
    return '<div class="history-item">' +
      '<div class="history-dot-col">' +
        '<div class="history-dot" style="background:'+stColor+';border-color:'+stColor+';"></div>' +
        (i < accountHistory.length - 1 ? '<div class="history-line"></div>' : '') +
      '</div>' +
      '<div class="history-content">' +
        '<div class="history-header">' +
          '<span class="history-action" style="background:var(--surface-2);color:var(--text-primary);font-weight:700;">' + _esc(ev.type) + '</span>' +
          (ev.status ? '<span class="history-field" style="color:'+stColor+';font-weight:600;">Status: ' + _esc(ev.status) + '</span>' : '') +
          '<span class="history-by">' + _esc(ev.by ? 'by ' + ev.by : '') + '</span>' +
          '<span class="history-time">' + _formatDate(ev.date) + '</span>' +
        '</div>' +
        (details.length ? '<div style="font-size:12.5px;color:var(--text-secondary);margin-top:3px;">' + details.map(_esc).join(' · ') + '</div>' : '') +
      '</div>' +
    '</div>';
  }).join('') : '<div class="empty-state" style="padding:32px;"><h3 style="font-size:13.5px;">No account history yet</h3></div>';

  // Each date cell has a hover-reveal edit icon (CS Specialist/Admin only)
  // that opens a tiny inline date input in place, saving directly without
  // touching Activity Logs — this is a correction tool, not a lifecycle
  // event, per how updateVAConnectionDates is deliberately scoped.
  function dateCell(connectionId, field, value) {
    var displayId = 'vaDateDisp_' + field + '_' + connectionId;
    var editIcon = canEditDates
      ? '<span class="cp-date-edit-icon" onclick="_cpEditConnDate(\''+_esc(connectionId)+'\',\''+field+'\',\''+_esc(value||'')+'\')" title="Edit" style="opacity:0;cursor:pointer;margin-left:5px;font-size:11px;color:var(--accent);">✎</span>'
      : '';
    return '<td class="muted cp-date-cell" id="'+displayId+'">' + (value ? _fdate(value) : '—') + editIcon + '</td>';
  }

  var vaRows = vaConnectionHistory.length ? vaConnectionHistory.map(function (r) {
    var stColor = VA_STATUS_COLOR[r.status] || null;
    var bc = stColor ? '' : ('badge badge-' + (r.status||'').toLowerCase());
    var statusHtml = stColor
      ? '<span class="badge" style="background:'+stColor+'22;color:'+stColor+';font-weight:700;">' + _esc(r.status||'—') + '</span>'
      : '<span class="'+bc+'">' + _esc(r.status||'—') + '</span>';
    return '<tr>' +
      '<td class="muted" style="font-size:11.5px;">' + _esc(r.requestId||'—') + '</td>' +
      '<td class="muted" style="font-size:11.5px;">' + _esc(r.connectionId||'—') + '</td>' +
      '<td><div style="font-weight:600;">' + _esc(r.service||'—') + '</div>' + (r.department ? '<div style="font-size:11px;color:var(--text-muted);">' + _esc(r.department) + '</div>' : '') + '</td>' +
      '<td style="font-weight:600;">' + _esc(r.vaName||'—') + '</td>' +
      '<td>' + statusHtml + '</td>' +
      dateCell(r.connectionId, 'dateStarted', r.dateStarted) +
      dateCell(r.connectionId, 'dateEnded', r.dateEnded) +
    '</tr>';
  }).join('') : '<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-muted);">No VA connections on file.</td></tr>';

  body.innerHTML =
    '<style>.cp-date-cell:hover .cp-date-edit-icon{opacity:1 !important;}</style>' +
    '<div class="section-card" style="margin-bottom:14px;">' +
      '<div class="section-header">' +
        '<div><div class="section-title">Account History</div>' +
        '<div class="section-subtitle">Oldest first, latest last · ' + accountHistory.length + ' event(s)</div></div>' +
      '</div>' +
      '<div class="history-timeline">' + ahRows + '</div>' +
    '</div>' +
    '<div class="section-card">' +
      '<div class="section-header">' +
        '<div><div class="section-title">VA Connection History</div>' +
        '<div class="section-subtitle">Sorted by start date, latest first · ' + vaConnectionHistory.length + ' connection(s)</div></div>' +
      '</div>' +
      '<div class="table-wrap"><table>' +
        '<thead><tr><th>Request ID</th><th>Connection ID</th><th>Service</th><th>VA Name</th><th>Status</th><th>Date Started</th><th>Date Ended</th></tr></thead>' +
        '<tbody>' + vaRows + '</tbody>' +
      '</table></div>' +
    '</div>';
}
function _cpEditConnDate(connectionId, field, currentValue) {
  var displayId = 'vaDateDisp_' + field + '_' + connectionId;
  var cell = document.getElementById(displayId);
  if (!cell) return;
  var inputId = 'vaDateInput_' + field + '_' + connectionId;
  cell.innerHTML =
    '<input type="date" id="'+inputId+'" class="form-input" style="padding:3px 6px;font-size:12px;width:120px;" value="'+(currentValue?currentValue.substring(0,10):'')+'" />' +
    '<button class="btn btn-primary btn-sm" style="padding:2px 8px;margin-left:4px;font-size:11px;" onclick="_cpSaveConnDate(\''+_esc(connectionId)+'\',\''+field+'\')">Save</button>';
  setTimeout(function(){ var el = document.getElementById(inputId); if (el) el.focus(); }, 30);
}
function _cpSaveConnDate(connectionId, field) {
  var inputId = 'vaDateInput_' + field + '_' + connectionId;
  var el = document.getElementById(inputId);
  var val = el ? el.value : '';
  var payload = {};
  payload[field] = val;
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { showToast((res&&res.error)||'Failed to save.', 'error'); return; }
      showToast('Date updated.', 'success');
      // Re-render the whole History tab so the table (and Account History,
      // which reads these same connections) reflects the corrected date.
      if (window._profileData) _profileHistory(document.getElementById('profileTabBody'), 'customer', window._profileData.customerId);
    })
    .withFailureHandler(function(err) { showToast(err.message, 'error'); })
    .updateVAConnectionDates(connectionId, payload);
}

// Convert camelCase field names to readable labels
function _friendlyFieldName(field) {

function specSaveNew() {

  var role  = ((document.getElementById('specAddRole') ||{}).value||'');

    .withFailureHandler(function(err){if(errEl)errEl.textContent=err.message;if(btn){btn.disabled=false;btn.textContent='Add Specialist';}})

function specToggleReassignForm(existUserId) {
  var fields = document.getElementById('specReassignNewFields');
  if (fields) fields.style.display = existUserId ? 'none' : '';
}

function specDoReassign(fromUserId) {
  var existUserId = ((document.getElementById('specReassignExist')||{}).value||'');
  var toName  = ((document.getElementById('specReassignName') ||{}).value||'').trim();
  var toEmail = ((document.getElementById('specReassignEmail')||{}).value||'').trim().toLowerCase();
  var toRole  = ((document.getElementById('specReassignRole') ||{}).value||'CS Specialist');
  var errEl   = document.getElementById('specReassignErr');

  if (!existUserId) {
    if (!toName)  { if(errEl) errEl.textContent = 'New specialist name is required.'; return; }
    if (!toEmail) { if(errEl) errEl.textContent = 'New specialist email is required.'; return; }
  }
  if (errEl) errEl.textContent = '';
  var btn = document.getElementById('specReassignBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res||!res.success) {
        if(errEl) errEl.textContent=(res&&res.error)||'Reassignment failed.';
        if(btn){btn.disabled=false;btn.textContent='↔ Reassign';}
        return;
      }
      closeModal();
      if (res.renamedInPlace) {
        showToast('Name updated — same email, so nothing needed to move.', 'success');
      } else {
        showToast('Reassignment complete. '+res.customersTransferred+' customer'+(res.customersTransferred!==1?'s':'')+' transferred.', 'success');
      }
      google.script.run
        .withSuccessHandler(function(r2){ if(r2&&r2.success){_specAll=r2.data||[];_renderSpecCards();} })
        .withFailureHandler(function(){})
        .getCSSpecialistsData();
    })
    .withFailureHandler(function(err){if(errEl)errEl.textContent=err.message;if(btn){btn.disabled=false;btn.textContent='↔ Reassign';}})
    .doReassignSpecialist({
      fromUserId:    fromUserId,
      toExistUserId: existUserId,
      toName:        toName,
      toEmail:       toEmail,
      toRole:        toRole,
      moveCustomers: true
    });
}

function specOpenAssignCustomer(userId) {
  // Always fetch fresh data to avoid stale cache issues
  var loadingHtml =
    '<div class="modal-header"><div class="modal-title">Assign Customers</div>' +
    '<button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button></div>' +
    '<div class="modal-body"><div class="loading-screen" style="height:160px;"><div class="loader-ring"></div><p>Loading customers…</p></div></div>';
  openModal(loadingHtml);

  // Fetch fresh specialist data and all customers in parallel
  var freshSpec = null, freshCustomers = null, pending = 2;

  function tryBuild() {
    if (--pending > 0) return;
    // Find the target specialist from fresh data
    var sp       = (freshSpec || []).find(function(s){ return s.userId === userId; });
    var specName = sp ? (sp.name || sp.email) : userId;
    var assigned = sp ? sp.customers.map(function(x){ return String(x.customerId).trim(); }) : [];

    var allCusts = (freshCustomers || []).slice().sort(function(a,b){
      return (a.customerName||'').localeCompare(b.customerName||'');
    });

    if (!allCusts.length) {
      openModal(
        '<div class="modal-header"><div class="modal-title">Assign Customers to ' + _esc(specName) + '</div>' +
        '<button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button></div>' +
        '<div class="modal-body"><div class="empty-state" style="padding:40px;"><h3>No customers found</h3></div></div>' +
        '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>'
      );
      return;
    }

    // Build a map of all assigned customer IDs across ALL specialists (not just this one)
    var allAssignedIds = {};
    (freshSpec||[]).forEach(function(s) {
      (s.customers||[]).forEach(function(x){ allAssignedIds[String(x.customerId).trim()] = true; });
    });

    // Show only customers not assigned to ANY specialist (unassigned pool)
    var unassignedCusts = allCusts.filter(function(cust) {
      var cid = String(cust.customerId||'').trim();
      return !allAssignedIds[cid];
    });

    var unassignedCount = unassignedCusts.length;
    var listHtml = unassignedCusts.map(function(cust) {
      var custId = String(cust.customerId || '').trim();
      return '<label class="spec-assign-row" data-name="' + _esc((cust.customerName||'').toLowerCase()) + '">' +
        '<input type="checkbox" class="spec-assign-cb" value="' + _esc(custId) + '" style="width:15px;height:15px;accent-color:var(--accent);" />' +
        '<span class="spec-assign-name">' + _esc(cust.customerName||'—') + '</span>' +
        (cust.status ? '<span class="badge badge-' + (cust.status||'').toLowerCase() + '" style="font-size:10px;margin-left:auto;">' + _esc(cust.status) + '</span>' : '') +
      '</label>';
    }).join('');

    if (!unassignedCount) {
      listHtml = '<div class="empty-state" style="padding:30px;"><h3>All customers assigned</h3><p>Every customer is already assigned to a specialist.</p></div>';
    }

    document.getElementById('modalBox').style.maxWidth = '520px';
    openModal(
      '<div class="modal-header">' +
        '<div class="modal-title">Assign Customers to ' + _esc(specName) + '</div>' +
        '<button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<div style="margin-bottom:10px;display:flex;gap:8px;align-items:center;">' +
          '<div class="table-search" style="flex:1;">' +
            '<svg width="13" height="13" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.6"/><path d="M9.5 9.5L12 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
            '<input type="text" id="specAssignSearch" placeholder="Search customers..." oninput="specAssignFilter()" />' +
          '</div>' +
          '<label style="font-size:12.5px;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;">' +
            '<input type="checkbox" id="specSelectAll" onchange="specToggleAllAssign(this)" style="accent-color:var(--accent);" /> Select all' +
          '</label>' +
        '</div>' +
        '<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">' +
          allCusts.length + ' total · ' + assigned.length + ' already assigned · <strong>' + unassignedCount + ' available</strong>' +
        '</div>' +
        '<div id="specAssignList" style="max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-md);padding:4px 0;">' +
          listHtml +
        '</div>' +
        '<div id="specAssignCount" style="font-size:12px;color:var(--text-muted);margin-top:8px;">0 selected</div>' +
        '<div id="specAssignErr" style="color:var(--danger);font-size:12.5px;margin-top:4px;"></div>' +
      '</div>' +
      '<div class="modal-footer">' +
        '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
        '<button class="btn btn-primary" id="specAssignBtn" data-uid="' + _esc(userId) + '" data-specname="' + _esc(specName) + '" onclick="specDoAssignMultiple(this.dataset.uid, this.dataset.specname)">Assign Selected</button>' +
      '</div>'
    );
    setTimeout(function() {
      var list = document.getElementById('specAssignList');
      if (list) list.addEventListener('change', specAssignUpdateCount);
    }, 50);
  }

  // Load fresh specialists
  google.script.run
    .withSuccessHandler(function(res) {
      freshSpec = (res && res.success) ? res.data : (_specAll || []);
      tryBuild();
    })
    .withFailureHandler(function() {
      freshSpec = _specAll || [];
      tryBuild();
    })
    .getCSSpecialistsData();

  // Load fresh customers
  google.script.run
    .withSuccessHandler(function(res) {
      freshCustomers = (res && res.success) ? res.data : (CMS.customers || []);
      tryBuild();
    })
    .withFailureHandler(function() {
      freshCustomers = CMS.customers || [];
      tryBuild();
    })
    .getCustomers({});
}


function specAssignFilter() {
  var q = ((document.getElementById('specAssignSearch')||{}).value||'').toLowerCase();
  document.querySelectorAll('#specAssignList .spec-assign-row').forEach(function(row) {
    row.style.display = (!q || (row.dataset.name||'').includes(q)) ? '' : 'none';
  });
}

function specToggleAllAssign(masterCb) {
  document.querySelectorAll('#specAssignList .spec-assign-row').forEach(function(row) {
    if (row.style.display === 'none') return;
    var cb = row.querySelector('input[type="checkbox"]');
    if (cb) cb.checked = masterCb.checked;
  });
  specAssignUpdateCount();
}

function specAssignUpdateCount() {
  var cbs = document.querySelectorAll('#specAssignList .spec-assign-cb:checked');
  var el  = document.getElementById('specAssignCount');
  if (el) el.textContent = cbs.length + ' customer' + (cbs.length !== 1 ? 's' : '') + ' selected';
}

function specDoAssignMultiple(userId, specName) {
  var cbs = document.querySelectorAll('#specAssignList .spec-assign-cb:checked');
  var ids = Array.prototype.map.call(cbs, function(cb){ return cb.value; });
  var errEl = document.getElementById('specAssignErr');
  if (!ids.length) { if (errEl) errEl.textContent = 'Please select at least one customer.'; return; }

  // Resolve sp once from _specAll using the passed userId
  var sp    = _specAll.find(function(s){ return s.userId === userId; });
  var email = sp ? sp.email : '';
  if (!email) { if (errEl) errEl.textContent = 'Specialist not found. Please refresh.'; return; }

  // Lock modal (prevent overlay dismiss) and show progress
  _modalLocked = true;
  var btn = document.getElementById('specAssignBtn');
  if (btn) { btn.disabled = true; }

  var remaining = ids.slice(), done = 0, failed = [];

  function updateProgress() {
    var progEl = document.getElementById('specAssignProgress');
    if (progEl) {
      progEl.textContent = 'Saving ' + done + ' / ' + ids.length + '…';
    }
    if (btn) btn.textContent = 'Saving ' + done + ' / ' + ids.length + '…';
  }

  // Inject a progress indicator into the modal body
  var countEl = document.getElementById('specAssignCount');
  if (countEl) {
    countEl.innerHTML = '<div id="specAssignProgress" style="color:var(--accent);font-weight:600;">Preparing…</div>' +
      '<div style="margin-top:6px;height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden;">' +
        '<div id="specAssignBar" style="height:100%;background:var(--accent);width:0%;transition:width .3s;"></div>' +
      '</div>';
  }
  // Hide search + list while saving
  var searchRow = document.querySelector('#specAssignList')?.previousElementSibling;
  var listEl    = document.getElementById('specAssignList');
  if (listEl) listEl.style.opacity = '0.4';

  function doNext() {
    if (!remaining.length) {
      _modalLocked = false;
      closeModal();
      var saved = ids.length - failed.length;
      var msg = saved + ' customer' + (saved !== 1 ? 's' : '') + ' assigned to ' + specName + '.';
      if (failed.length) msg += ' ' + failed.length + ' could not be saved.';
      showToast(msg, failed.length ? 'warning' : 'success');
      _reloadCustomers(function(){});
      google.script.run
        .withSuccessHandler(function(r){ if(r&&r.success){ _specAll=r.data||[]; _renderSpecCards(); } })
        .getCSSpecialistsData();
      return;
    }
    var custId = remaining.shift();
    done++;
    updateProgress();
    var barEl = document.getElementById('specAssignBar');
    if (barEl) barEl.style.width = Math.round(done / ids.length * 100) + '%';
    google.script.run
      .withSuccessHandler(function(res){ if(!res||!res.success) failed.push(custId); doNext(); })
      .withFailureHandler(function(){ failed.push(custId); doNext(); })
      .assignCustomerToSpecialist(custId, email);
  }
  doNext();
}

    '</div>' +

      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-danger btn-sm" ' +

    '</div>'
  );

function specDoRemove(customerId, customerName, specUserId, specName) {
  closeModal();
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { showToast((res&&res.error)||'Failed.', 'error'); return; }
      showToast(customerName + ' removed from ' + specName + '.', 'success');
      // Reload specialist data then reopen profile
      google.script.run
        .withSuccessHandler(function(r){
          if (r&&r.success) { _specAll = r.data||[]; }
          _openSpecialistModal(specUserId);
        })
        .getCSSpecialistsData();
    })
    .withFailureHandler(function(err){ showToast(err.message, 'error'); })
    .assignCustomerToSpecialist(customerId, ''); // empty email = unassign
}

  if (!otherSpecs.length) {
    showToast('No other specialists available for transfer.', 'info');
    return;
  }

  var specOpts = otherSpecs.map(function(s) {
    return '<option value="' + _esc(s.email) + '" data-name="' + _esc(s.name||s.email) + '">' +
      _esc(s.name||s.email) + ' (' + s.customerCount + ' customers)</option>';
  }).join('');

  openModal(
    '<div class="modal-header">' +
      '<div class="modal-title">Transfer Customer</div>' +
      '<button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button>' +
    '</div>' +
    '<div class="modal-body">' +
      '<div class="form-group">' +
        '<label class="form-label">Customer</label>' +
        '<div style="font-weight:600;font-size:13.5px;padding:8px 0;">' + _esc(customerName) + '</div>' +
      '</div>' +
      '<div class="form-group">' +
        '<label class="form-label">Current Specialist</label>' +
        '<div style="font-size:13px;color:var(--text-muted);padding:4px 0;">' + _esc(specName) + '</div>' +
      '</div>' +
      '<div class="form-group">' +
        '<label class="form-label">Transfer To <span class="required">*</span></label>' +
        '<select class="form-select" id="transferTargetSel">' +
          '<option value="">— Select specialist —</option>' + specOpts +
        '</select>' +
      '</div>' +
      '<div class="form-group">' +
        '<label class="form-label">Reason / Notes <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>' +
        '<textarea class="form-textarea" id="transferNote" style="min-height:60px;" placeholder="e.g. Workload rebalancing, specialist change..."></textarea>' +
      '</div>' +
      '<div id="transferErr" style="color:var(--danger);font-size:12.5px;"></div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" ' +
        'data-cid="' + _esc(customerId) + '" data-cname="' + _esc(customerName) + '" ' +
        'data-fromspid="' + _esc(specUserId) + '" data-fromspname="' + _esc(specName) + '" ' +
        'onclick="specDoTransfer(this.dataset.cid,this.dataset.cname,this.dataset.fromspid,this.dataset.fromspname)">Transfer</button>' +
    '</div>'
  );
}

function specDoTransfer(customerId, customerName, fromSpecUserId, fromSpecName) {
  var sel      = document.getElementById('transferTargetSel');
  var note     = ((document.getElementById('transferNote')||{}).value||'').trim();
  var errEl    = document.getElementById('transferErr');
  if (!sel || !sel.value) {
    if (errEl) errEl.textContent = 'Please select a target specialist.';
    return;
  }
  var toEmail  = sel.value;
  var toName   = sel.options[sel.selectedIndex] ? (sel.options[sel.selectedIndex].dataset.name || toEmail) : toEmail;
  closeModal();

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { showToast((res&&res.error)||'Failed.', 'error'); return; }
      showToast(customerName + ' transferred to ' + toName + '.', 'success');
      // Reload and reopen
      google.script.run
        .withSuccessHandler(function(r){
          if (r&&r.success) _specAll = r.data||[];
          _openSpecialistModal(fromSpecUserId);
        })
        .getCSSpecialistsData();
    })
    .withFailureHandler(function(err){ showToast(err.message, 'error'); })
    .doTransferCustomer(customerId, toEmail, fromSpecName, toName, note);
}

function _openSpecialistModal(userId) {
  // Try from already-loaded _specAll first
  var sp = _specAll.find(function(s){ return s.userId === userId; });
  if (sp) {
    _showSpecialistModal(sp);
    return;
  }
  // Else load from server
  openModal(_loadingModal('140px', 'Loading specialist profile…'));
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { closeModal(); showToast('Not found.', 'error'); return; }
      _specAll = res.data || [];
      var found = _specAll.find(function(s){ return s.userId === userId; });
      if (found) _showSpecialistModal(found);
      else { closeModal(); showToast('Specialist not found.', 'error'); }
    })
    .withFailureHandler(function(err){ closeModal(); showToast(err.message, 'error'); })
    .getCSSpecialistsData();
}

// Kept for legacy compatibility (router case still references it indirectly)
function _renderSpecialistProfile(container, userId) {
  _openSpecialistModal(userId);
}

function _showSpecialistModal(sp, activeTab) {
  activeTab = activeTab || 'active';
  var isAdmin   = CMS.user && (CMS.user.role === 'Administrator' || CMS.user.role === 'CS Manager');
  var initials  = (sp.name || sp.email || '?').charAt(0).toUpperCase();
  var statusCls = sp.isActive ? 'badge-active' : 'badge-inactive';
  var roleCls   = sp.role === 'CS Manager' ? 'badge-returning' : 'badge-active';

  // Group assigned customers by status. Default view is what the specialist
  // is actually working (Active + Paused); Terminated gets its own tab so
  // it's still reachable without cluttering the main list; anything else
  // (Pending/Inactive/Cancelled — rare here, but shouldn't just vanish)
  // falls into a third "Other" tab that only shows up if it's non-empty.
  var allCusts     = sp.customers || [];
  var activeGroup  = allCusts.filter(function(c){ return c.status === 'Active' || c.status === 'Paused'; });
  var termGroup    = allCusts.filter(function(c){ return c.status === 'Terminated'; });
  var otherGroup   = allCusts.filter(function(c){ return c.status !== 'Active' && c.status !== 'Paused' && c.status !== 'Terminated'; });
  var groupForTab  = { active: activeGroup, terminated: termGroup, other: otherGroup };
  var shownCusts   = groupForTab[activeTab] || activeGroup;

  // Customer list rows for whichever tab is active
  var custRows = shownCusts.length
    ? shownCusts.map(function(cust) {
        var badgeCls = 'badge badge-' + (cust.status || '').toLowerCase();
        return '<tr>' +
          '<td><a href="#" data-cid="' + _esc(cust.customerId) + '" onclick="custOpenModal(this.dataset.cid);return false;" style="color:var(--accent);font-weight:600;">' + _esc(cust.customerName) + '</a></td>' +
          '<td><span class="' + badgeCls + '">' + _esc(cust.status || '—') + '</span></td>' +
          '<td style="white-space:nowrap;width:1px;">' +
            '<button class="btn btn-ghost btn-sm" style="font-size:11.5px;color:var(--text-secondary);" ' +
              'data-cid="' + _esc(cust.customerId) + '" data-cname="' + _esc(cust.customerName) + '" data-spid="' + _esc(sp.userId) + '" data-spemail="' + _esc(sp.email) + '" data-spname="' + _esc(sp.name||sp.email) + '" ' +
              'onclick="specOpenTransfer(this.dataset.cid,this.dataset.cname,this.dataset.spid,this.dataset.spemail,this.dataset.spname)">⇄ Transfer</button>' +
            '<button class="btn btn-ghost btn-sm" style="font-size:11.5px;color:var(--danger);" ' +
              'data-cid="' + _esc(cust.customerId) + '" data-cname="' + _esc(cust.customerName) + '" data-spid="' + _esc(sp.userId) + '" data-spname="' + _esc(sp.name||sp.email) + '" ' +
              'onclick="specConfirmRemove(this.dataset.cid,this.dataset.cname,this.dataset.spid,this.dataset.spname)">✕ Remove</button>' +
          '</td>' +
        '</tr>';
      }).join('')
    : '<tr><td colspan="3"><div class="empty-state" style="padding:20px;">' +
        '<h3 style="font-size:14px;">No ' + (activeTab==='terminated'?'terminated':activeTab==='other'?'other':'active or paused') + ' customers</h3>' +
      '</div></td></tr>';

  var custTabsHtml =
    '<div class="req-type-tabs" style="margin-bottom:10px;">' +
      '<button class="req-type-tab' + (activeTab==='active'?' active':'') + '" data-uid="' + _esc(sp.userId) + '" onclick="_specSwitchCustTab(this.dataset.uid,\'active\')">Active &amp; Paused (' + activeGroup.length + ')</button>' +
      '<button class="req-type-tab' + (activeTab==='terminated'?' active':'') + '" data-uid="' + _esc(sp.userId) + '" onclick="_specSwitchCustTab(this.dataset.uid,\'terminated\')">Terminated (' + termGroup.length + ')</button>' +
      (otherGroup.length ? '<button class="req-type-tab' + (activeTab==='other'?' active':'') + '" data-uid="' + _esc(sp.userId) + '" onclick="_specSwitchCustTab(this.dataset.uid,\'other\')">Other (' + otherGroup.length + ')</button>' : '') +
    '</div>';

  openModal(
    // ── Header
    '<div class="modal-header">' +
      '<div style="display:flex;align-items:center;gap:12px;">' +
        '<div style="width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#6366f1);' +
             'color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;">' +
          initials +
        '</div>' +
        '<div>' +
          '<div class="modal-title" style="margin-bottom:2px;">' + _esc(sp.name || sp.email) + '</div>' +
          '<div style="display:flex;gap:6px;">' +
            '<span class="badge ' + roleCls   + '" style="font-size:10.5px;">' + _esc(sp.role)     + '</span>' +
            '<span class="badge ' + statusCls + '" style="font-size:10.5px;">' + (sp.isActive ? 'Active' : 'Inactive') + '</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button>' +
    '</div>' +

    // ── Body
    '<div class="modal-body" style="max-height:72vh;overflow-y:auto;">' +

      // Meta row
      '<div class="detail-list" style="margin-bottom:16px;">' +
        '<div class="detail-row"><span class="detail-label">Email</span>' +

    .getCustomerTakeovers();

// Re-renders the specialist modal on whichever customer-status tab was
// clicked. sp data is already in memory (_specAll), so this is instant —
// no server round-trip needed just to switch tabs.
// Take Over assignment — lets a CS Manager pick specific active customers
// from this specialist and hand them to a covering specialist for a fixed
// date range. Replaces Backup Specialist's all-or-nothing blanket coverage.
function specOpenAssignTakeover(userId) {
  var sp = _specAll.find(function(s){ return s.userId === userId; });
  if (!sp) return;
  var activeCusts = (sp.customers||[]).filter(function(c){ return c.status === 'Active'; });
  if (!activeCusts.length) { showToast('This specialist has no active customers to take over.', 'info'); return; }

  var custCheckboxes = activeCusts.map(function(c) {
    return '<label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;cursor:pointer;">' +
      '<input type="checkbox" class="tkoCustCheck" value="' + _esc(c.customerId) + '" /> ' + _esc(c.customerName) +
    '</label>';
  }).join('');

  var specOptions = (CMS.specialists||[])
    .filter(function(s){ return s.userId !== userId; })
    .map(function(s){ return '<option value="' + _esc(s.email) + '">' + _esc(s.name || s.email) + '</option>'; })
    .join('');

  var todayStr = _todayStr();
  openModal(
    '<div class="modal-header"><div class="modal-title">Assign Take Over — ' + _esc(sp.name || sp.email) + '</div><button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button></div>' +
    '<div class="modal-body">' +
      '<div class="form-group"><label class="form-label">Customers to Take Over <span class="required">*</span></label>' +
        '<div style="max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 12px;">' + custCheckboxes + '</div>' +
      '</div>' +
      '<div class="form-group"><label class="form-label">Covering Specialist <span class="required">*</span></label>' +
        '<select class="form-select" id="tkoSpecialistSel"><option value="">Select…</option>' + specOptions + '</select>' +
      '</div>' +
      '<div class="form-row">' +
        '<div class="form-group"><label class="form-label">Start Date <span class="required">*</span></label>' +
          '<input class="form-input" id="tkoStartDate" type="date" value="' + todayStr + '" />' +
        '</div>' +
        '<div class="form-group"><label class="form-label">End Date <span class="required">*</span></label>' +
          '<input class="form-input" id="tkoEndDate" type="date" />' +
        '</div>' +
      '</div>' +
      '<div class="form-group"><label class="form-label">Reason</label><textarea class="form-textarea" id="tkoReason" style="min-height:60px;" placeholder="Optional — e.g. annual leave, medical leave"></textarea></div>' +
      '<div id="tkoErr" style="color:var(--danger);font-size:12.5px;"></div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" id="tkoSaveBtn" data-uid="' + _esc(userId) + '" onclick="specSaveTakeover(this.dataset.uid)">Assign</button>' +
    '</div>'
  );
}

function specSaveTakeover(userId) {
  var custIds = Array.prototype.slice.call(document.querySelectorAll('.tkoCustCheck:checked')).map(function(el){ return el.value; });
  var specEmail = (document.getElementById('tkoSpecialistSel')||{}).value || '';
  var startDate = (document.getElementById('tkoStartDate')||{}).value || '';
  var endDate = (document.getElementById('tkoEndDate')||{}).value || '';
  var reason = (document.getElementById('tkoReason')||{}).value || '';
  var errEl = document.getElementById('tkoErr');

  if (!custIds.length) { if (errEl) errEl.textContent = 'Select at least one customer.'; return; }
  if (!specEmail) { if (errEl) errEl.textContent = 'Select a covering specialist.'; return; }
  if (!startDate || !endDate) { if (errEl) errEl.textContent = 'Start and end dates are required.'; return; }
  if (endDate < startDate) { if (errEl) errEl.textContent = 'End date must be on or after the start date.'; return; }

  var btn = document.getElementById('tkoSaveBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Assigning…'; }
  if (errEl) errEl.textContent = '';

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) {
        if (errEl) errEl.textContent = (res && res.error) || 'Failed to assign.';
        if (btn) { btn.disabled = false; btn.textContent = 'Assign'; }
        return;
      }
      closeModal();
      showToast('Take over assigned for ' + res.count + ' customer' + (res.count !== 1 ? 's' : '') + '.', 'success');
      var sp = _specAll.find(function(s){ return s.userId === userId; });
      if (sp) _showSpecialistModal(sp);
    })
    .withFailureHandler(function(err) {
      if (errEl) errEl.textContent = err.message;
      if (btn) { btn.disabled = false; btn.textContent = 'Assign'; }
    })
    .assignCustomerTakeover(custIds, specEmail, startDate, endDate, reason);
}

function specCancelTakeover(takeoverId, userId) {
  if (!confirm('End this take over now?')) return;
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { showToast((res && res.error) || 'Failed to cancel.', 'error'); return; }
      showToast('Take over cancelled.', 'success');
      var sp = _specAll.find(function(s){ return s.userId === userId; });
      if (sp) _showSpecialistModal(sp);
    })
    .withFailureHandler(function(err) { showToast(err.message, 'error'); })
    .cancelCustomerTakeover(takeoverId);
}

function _specSwitchCustTab(userId, tab) {
  var sp = _specAll.find(function(s){ return s.userId === userId; });
  if (!sp) return;
  _showSpecialistModal(sp, tab);
}

var _usersAll      = [];
var _usersFiltered = [];
var _specialistsList = [];

var _usersActiveRoleTab = 'All';
var USER_ROLE_GROUPS = {
  'Customer Success': ['CS Manager', 'CS Specialist'],
  'Human Resources':  ['HR Manager', 'HR Specialist']
};
function usersSwitchRoleTab(btn, role) {
  _usersActiveRoleTab = role;
  document.querySelectorAll('#usersRoleTabs .req-type-tab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  usersApplyFilters();
}

function usersApplyFilters() {
  var searchVal = ((document.getElementById('usersSearch')     || {}).value || '').toLowerCase();
  var groupRoles = USER_ROLE_GROUPS[_usersActiveRoleTab] || null;
  _usersFiltered = _usersAll.filter(function (userRow) {
    var mQ = !searchVal || (userRow.name || '').toLowerCase().includes(searchVal) || (userRow.email || '').toLowerCase().includes(searchVal);
    var mR = _usersActiveRoleTab === 'All' || (groupRoles ? groupRoles.indexOf(userRow.role) !== -1 : userRow.role === _usersActiveRoleTab);
    return mQ && mR;
  });
  // Within a combined role group (Customer Success, Human Resources),
  // sort by the group's own role priority — e.g. CS Manager before CS
  // Specialist — rather than leaving it in whatever order the underlying
  // sheet happens to have, which a plain filter() would otherwise preserve.
  if (groupRoles) {
    _usersFiltered.sort(function(a, b) {
      return groupRoles.indexOf(a.role) - groupRoles.indexOf(b.role);
    });
  }
  // Within a grouped tab, the "manager" role of that group comes first —
  // e.g. CS Manager before CS Specialist, HR Manager before HR Specialist.
  if (groupRoles) {
    _usersFiltered.sort(function(a, b) {
      var ai = groupRoles.indexOf(a.role), bi = groupRoles.indexOf(b.role);
      if (ai !== bi) return ai - bi;
      return (a.name||'').localeCompare(b.name||'');
    });
  }
  usersRender();
}

function usersRender() {
  var tbody = document.getElementById('usersTbody');
  if (!tbody) return;
  var currentUserId = CMS.user && CMS.user.id;

  if (!_usersFiltered.length) {
    tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><svg width="36" height="36" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3.5" stroke="currentColor" stroke-width="1.5"/><path d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><h3>No users found</h3><p>Adjust your search or add a new user.</p></div></td></tr>';
    return;
  }

  tbody.innerHTML = _usersFiltered.map(function (userRow) {
    var initials = (userRow.name || userRow.email || '?').charAt(0).toUpperCase();
    var isSelf   = userRow.userId === currentUserId;
    var roleClass = {
      'Administrator': 'badge-role',
      'CS Manager':    'badge-returning',
      'CS Specialist': 'badge-active',
      'Manager':       'badge-inactive'
    }[userRow.role] || 'badge-inactive';

    return '<tr>' +
      '<td><div style="display:flex;align-items:center;gap:10px;">' +
        '<div class="user-avatar" style="width:34px;height:34px;font-size:13px;">' + initials + '</div>' +
        '<div><div style="font-weight:600;font-size:13px;">' + _esc(userRow.name) + (isSelf ? ' <span style="font-size:10.5px;color:var(--text-muted);">(you)</span>' : '') + '</div>' +
          '<div style="font-size:11.5px;color:var(--text-muted);">' + _esc(userRow.email) + '</div></div>' +
      '</div></td>' +
      '<td><span class="badge ' + roleClass + '">' + _esc(userRow.role) + '</span></td>' +
      '<td>' + (userRow.isActive
        ? '<span class="badge badge-active">Active</span>'
        : '<span class="badge badge-inactive">Inactive</span>') + '</td>' +
      '<td class="muted">' + (userRow.lastLogin ? _fdate(userRow.lastLogin) : 'Never') + '</td>' +
      '<td><div class="flex gap-2">' +
        '<button class="btn btn-ghost btn-icon" title="Edit" onclick="usersOpenEdit(\'' + _esc(userRow.userId) + '\')">' + _svgEdit() + '</button>' +
        (!isSelf ? '<button class="btn btn-ghost btn-icon" title="' + (userRow.isActive ? 'Deactivate' : 'Activate') + '" onclick="usersToggleActive(\'' + _esc(userRow.userId) + '\',' + !userRow.isActive + ')" style="color:' + (userRow.isActive ? 'var(--warning)' : 'var(--success)') + ';">' +
          (userRow.isActive
            ? '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 7l2 2 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
            : '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.4"/><path d="M5 5l4 4M9 5l-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>') +
        '</button>' : '') +
      '</div></td>' +
    '</tr>';
  }).join('');
}

function usersOpenAdd() {
  openModal(_usersBuildForm(null));
  setTimeout(function () { var el = document.getElementById('f_userName'); if (el) el.focus(); }, 60);
}
function usersOpenEdit(userId) {
  var found = _usersAll.find(function (userRow) { return userRow.userId === userId; });
  if (!found) { showToast('User not found.', 'error'); return; }
  openModal(_usersBuildForm(found));
}

function _usersBuildForm(rec) {
  var isEdit = !!rec;
  var getVal = function (field) { return rec ? _esc(rec[field] || '') : ''; };
  var roleOptions = ['Administrator', 'CS Manager', 'CS Specialist', 'Manager', 'HR Specialist', 'HR Manager', 'Service Manager', 'Accounting', 'Recruitment Specialist', 'Training Manager', 'Executive', 'Executive Support'].map(function (roleOpt) {
    return '<option value="' + roleOpt + '"' + (rec && rec.role === roleOpt ? ' selected' : '') + '>' + roleOpt + '</option>';
  }).join('');
  var deptOpts = ((CMS.settings && CMS.settings.Department) || []).map(function(d) {
    return '<option value="'+_esc(d.value)+'"'+(rec && rec.department===d.value?' selected':'')+'>'+_esc(d.label)+'</option>';
  }).join('');
  var showDeptNow = rec && rec.role === 'Service Manager';

  return '<div class="modal-header"><div class="modal-title">' + (isEdit ? 'Edit User' : 'Add User') + '</div>' +
    '<button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button></div>' +
    '<div class="modal-body">' +
      '<div class="form-group"><label class="form-label">Full Name <span class="required">*</span></label>' +
        '<input class="form-input" id="f_userName" type="text" value="' + getVal('name') + '" placeholder="e.g. John Doe" /></div>' +
      '<div class="form-group"><label class="form-label">Email Address <span class="required">*</span></label>' +
        '<input class="form-input" id="f_userEmail" type="email" value="' + getVal('email') + '" placeholder="john@company.com"' + (isEdit ? '' : '') + ' /></div>' +
      '<div class="form-group"><label class="form-label">Role <span class="required">*</span></label>' +
        '<select class="form-select" id="f_userRole" onchange="_usersToggleDeptField(this.value)"><option value="">Select role…</option>' + roleOptions + '</select>' +
        '<div class="form-hint">Role determines what the user can access and modify.</div></div>' +
      '<div class="form-group" id="f_userDeptWrap" style="' + (showDeptNow ? '' : 'display:none;') + '">' +
        '<label class="form-label">Department <span class="required">*</span></label>' +
        '<select class="form-select" id="f_userDepartment"><option value="">Select department…</option>' + deptOpts + '</select>' +
        '<div class="form-hint">Service Managers only see dashboard data for their own department.</div></div>' +
      '<div id="usersFormErr" style="color:var(--danger);font-size:12.5px;margin-top:4px;"></div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" id="usersSubmitBtn" onclick="usersSubmit(\'' + (isEdit ? rec.userId : '') + '\')">' + (isEdit ? 'Save Changes' : 'Add User') + '</button>' +
    '</div>';
}
function _usersToggleDeptField(role) {
  var wrap = document.getElementById('f_userDeptWrap');
  if (wrap) wrap.style.display = (role === 'Service Manager') ? '' : 'none';
}

function usersSubmit(userId) {
  var nameVal  = ((document.getElementById('f_userName')  || {}).value || '').trim();
  var emailVal = ((document.getElementById('f_userEmail') || {}).value || '').trim();
  var roleVal  = (document.getElementById('f_userRole')   || {}).value || '';
  var errEl    = document.getElementById('usersFormErr');

  if (!nameVal)  { if (errEl) errEl.textContent = 'Name is required.';  return; }
  if (!emailVal) { if (errEl) errEl.textContent = 'Email is required.'; return; }
  if (!roleVal)  { if (errEl) errEl.textContent = 'Role is required.';  return; }
  var deptVal = (document.getElementById('f_userDepartment')||{}).value || '';
  if (roleVal === 'Service Manager' && !deptVal) { if (errEl) errEl.textContent = 'Department is required for Service Managers.'; return; }
  if (errEl) errEl.textContent = '';

  var submitBtn = document.getElementById('usersSubmitBtn');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Saving…'; }

  var payload = { name: nameVal, email: emailVal, role: roleVal, department: roleVal === 'Service Manager' ? deptVal : '' };

  function onDone(res) {
    if (!res || !res.success) {
      if (errEl) errEl.textContent = res && res.errors ? res.errors.join(' ') : ((res && res.error) || 'Save failed.');
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = userId ? 'Save Changes' : 'Add User'; }
      return;
    }
    closeModal();
    showToast('User saved.', 'success');
    _usersRefresh();
  }
  function onFail(err) { showToast(err.message, 'error'); if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Save'; } }

  if (userId) google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).updateUser(userId, payload);
  else        google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).createUser(payload);
}

function usersToggleActive(userId, newState) {
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success) { showToast('User ' + (newState ? 'activated' : 'deactivated') + '.', 'success'); _usersRefresh(); }
      else showToast((res && res.error) || 'Failed.', 'error');
    })
    .withFailureHandler(function (err) { showToast(err.message, 'error'); })
    .toggleUserActive(userId, newState);
}

function _usersRefresh() {
  google.script.run
    .withSuccessHandler(function (res) { if (res && res.success) { _usersAll = res.data || []; usersApplyFilters(); } })
    .getUsers({});
}

// ── Active Users Report — "who's actually using the system" ────────────
// Computed entirely from the logs already loaded into _logAll (no extra
// backend round trip needed): counts actions per user and their most
// recent action, so you can see at a glance who's been active recently vs.
// who hasn't touched the system in a while.
function actShowActiveUsersReport() {
  document.getElementById('modalBox') && (document.getElementById('modalBox').style.maxWidth = '760px');
  openModal(
    '<div class="modal-header"><div class="modal-title">Active Users Report</div><button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>' +
    '<div class="modal-body" style="max-height:65vh;overflow-y:auto;"><div class="loading-screen" style="height:160px;"><div class="loader-ring"></div><p>Loading fresh activity…</p></div></div>'
  );
  // Fresh-fetched every time this opens, rather than reusing _logAll —
  // that's only as current as whatever was loaded when the Activity Logs
  // page itself was last visited, which could be stale if this tab's been
  // sitting open for a while even though real activity has happened since.
  // limit raised well above what a single day's activity could plausibly
  // produce — the previous 2000 cap could silently push a user's true
  // most recent action out of view if enough OTHER activity happened more
  // recently system-wide, which is exactly the "shows 15 days ago despite
  // more recent logs" symptom.
  google.script.run
    .withSuccessHandler(function(logRes) {
      var freshLogs = (logRes && logRes.success) ? (logRes.data || []) : [];
      google.script.run
        .withSuccessHandler(function(userRes) {
          var users = (userRes && userRes.success) ? (userRes.data || []) : [];
          _actRenderActiveUsersReport(freshLogs, users, 'CS Specialist');
        })
        .withFailureHandler(function() { _actRenderActiveUsersReport(freshLogs, [], 'CS Specialist'); })
        .getUsers({});
    })
    .withFailureHandler(function(err) { showToast(err.message, 'error'); closeModal(); })
    .getLogs({ allTime: true, limit: 50000 });
}
window._actReportLogs = [];
window._actReportUsers = [];
function _actRenderActiveUsersReport(freshLogs, users, activeTab) {
  window._actReportLogs = freshLogs;
  window._actReportUsers = users;

  // Last-active-per-user, built from logs (whoever has any). Every user
  // gets a row regardless of whether they have log activity — Last Login
  // is a direct field on the user record, independent of Activity Logs.
  var lastActiveByEmail = {}, actionCountByEmail = {};
  freshLogs.forEach(function(r) {
    var key = (r.changedByEmail || '').toLowerCase().trim(); if (!key) return;
    actionCountByEmail[key] = (actionCountByEmail[key] || 0) + 1;
    var ts = new Date(r.timestamp);
    if (!lastActiveByEmail[key] || ts > new Date(lastActiveByEmail[key])) lastActiveByEmail[key] = r.timestamp;
  });

  var byRole = {};
  users.forEach(function(u) {
    var role = u.role || '(No Role)';
    if (!byRole[role]) byRole[role] = [];
    var emailKey = (u.email||'').toLowerCase().trim();
    byRole[role].push({
      name: u.name || u.email, email: u.email,
      lastLogin: u.lastLogin || '',
      lastActive: lastActiveByEmail[emailKey] || '',
      actionCount: actionCountByEmail[emailKey] || 0
    });
  });
  // CS Specialist first (default tab), then alphabetical for the rest.
  var roles = Object.keys(byRole).sort(function(a,b) {
    if (a === 'CS Specialist') return -1;
    if (b === 'CS Specialist') return 1;
    return a.localeCompare(b);
  });
  if (!activeTab || !byRole[activeTab]) activeTab = roles[0] || 'CS Specialist';

  var tabsHtml = roles.map(function(r) {
    return '<button class="active-users-tab'+(r===activeTab?' active':'')+'" onclick="_actSwitchReportTab(\''+_esc(r)+'\')">'+_esc(r)+' <span class="active-users-tab-count">'+byRole[r].length+'</span></button>';
  }).join('');

  var now = new Date();
  function daysAgo(dateStr) { return Math.floor((now - new Date(dateStr)) / (1000*60*60*24)); }
  var list = (byRole[activeTab] || []).slice().sort(function(a,b) {
    // Whoever's been active most recently first; users with no activity
    // at all sort to the bottom regardless of login recency.
    if (!a.lastActive && !b.lastActive) return new Date(b.lastLogin||0) - new Date(a.lastLogin||0);
    if (!a.lastActive) return 1;
    if (!b.lastActive) return -1;
    return new Date(b.lastActive) - new Date(a.lastActive);
  });
  var rowsHtml = list.length ? list.map(function(u) {
    var hasActivity = !!u.lastActive;
    var d = hasActivity ? daysAgo(u.lastActive) : null;
    var recencyColor = !hasActivity ? 'var(--text-muted)' : (d <= 1 ? 'var(--success)' : d <= 7 ? 'var(--warning)' : 'var(--text-muted)');
    var recencyLabel = !hasActivity ? 'No activity on file' : (d <= 0 ? 'Today' : d === 1 ? 'Yesterday' : d + ' days ago');
    return '<tr>' +
      '<td><div style="font-weight:600;font-size:13px;">'+_esc(u.name)+'</div><div style="font-size:11px;color:var(--text-muted);">'+_esc(u.email)+'</div></td>' +
      '<td style="text-align:center;font-weight:700;">'+u.actionCount+'</td>' +
      '<td style="color:'+recencyColor+';font-weight:600;font-size:12.5px;">'+recencyLabel+'</td>' +
      '<td class="muted" style="font-size:11.5px;">'+(hasActivity?_formatDate(u.lastActive):'—')+'</td>' +
      '<td class="muted" style="font-size:11.5px;">'+(u.lastLogin?_formatDate(u.lastLogin):'—')+'</td>' +
    '</tr>';
  }).join('') : '<tr><td colspan="5"><div class="empty-state" style="padding:20px;"><h3 style="font-size:13.5px;">No users in this group</h3></div></td></tr>';

  openModal(
    '<div class="modal-header"><div class="modal-title">Active Users Report</div><button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>' +
    '<div class="modal-body" style="max-height:70vh;overflow-y:auto;">' +
      '<div class="active-users-tab-group" style="margin-bottom:12px;">'+tabsHtml+'</div>' +
      '<div class="form-hint" style="margin-bottom:10px;">Based on '+freshLogs.length+' logged actions across all entities (freshly loaded just now). "Last Active" is the most recent logged action; "Last Login" is the most recent time they opened the app — these can differ.</div>' +
      '<div class="table-wrap"><table>' +
        '<thead><tr><th>User</th><th style="text-align:center;">Actions</th><th>Last Active</th><th>Last Active (Timestamp)</th><th>Last Login</th></tr></thead>' +
        '<tbody>'+rowsHtml+'</tbody>' +
      '</table></div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>'
  );
}

function actExport() {
  if (!_logFiltered.length) { showToast('No data to export.', 'warning'); return; }
  var headerRow = ['Timestamp','ActualDate','EntityType','EntityID','Action','FieldChanged','OldValue','NewValue','ChangedBy','Email'];
  var dataRows  = _logFiltered.map(function (logRow) { return [_formatDate(logRow.timestamp),logRow.effectiveDate?_fdate(logRow.effectiveDate):'',logRow.entityType,logRow.entityId,logRow.action,logRow.fieldChanged,logRow.oldValue,logRow.newValue,logRow.changedBy,logRow.changedByEmail].map(function (cellVal) { var cellStr=String(cellVal||''); return '"'+cellStr.replace(/"/g,'""')+'"'; }).join(','); });

// Recognizes known Google Apps Script infrastructure errors and appends

// Unrecognized messages pass through unchanged.
var _KNOWN_ERROR_PATTERNS = [
  { test: /too many scripts running simultaneously/i,
    hint: 'This happens when a lot of actions run at once — please wait a few seconds and try again.' },
  { test: /timed out while accessing document|service spreadsheets timed out/i,
    hint: 'This usually resolves itself — please wait a moment and try again. If it keeps happening, let an admin know.' },
  { test: /rate limit exceeded/i,
    hint: 'Please wait a moment before trying again.' },
  { test: /authorization is required|authorization required/i,
    hint: 'Please refresh the page — you may need to sign in or re-authorize.' },
  { test: /script function not found/i,
    hint: 'Please refresh the page and try again.' },
  { test: /you do not have permission|permission denied/i,
    hint: 'Contact your administrator if you believe you should have access to this.' },
  { test: /^timed out|request timed out/i,
    hint: 'The request took too long to complete — please try again.' }

function _friendlyErrorMessage(rawMessage) {
  var msg = String(rawMessage || '').trim();
  if (!msg) return msg;
  for (var i = 0; i < _KNOWN_ERROR_PATTERNS.length; i++) {
    if (_KNOWN_ERROR_PATTERNS[i].test.test(msg)) {
      return msg + ' — ' + _KNOWN_ERROR_PATTERNS[i].hint;

}

function _esc(str)        { return String(str == null ? '' : str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// Safe for a value passed as a JS string literal argument inside an
// inline onclick="..." attribute (wrapped in single quotes) — plain _esc
// is NOT enough here, since the browser HTML-decodes &#39; back to a
// literal ' before executing onclick as JS, breaking right back out of
// the string argument for any value containing an apostrophe (e.g. a
// company name like "O'Brien Logistics"). Escapes backslash first, then
// the quote as \' (a JS escape sequence, not an HTML entity) so it
// survives HTML parsing intact and is still a valid escape once JS runs.
function _escJs(str) {
  return String(str == null ? '' : str)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

    '<span id="'+uid+'_full" style="display:none;">'+esc+' <a href="#" onclick="document.getElementById(\''+uid+'_full\').style.display=\'none\';document.getElementById(\''+uid+'_short\').style.display=\'\';return false;" style="color:var(--accent);font-size:12px;font-weight:600;">View less</a></span>' +

var _MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// Real bug fixed here: this used to read the calendar day using the
// VIEWER'S browser-local timezone (new Date(val).getDate() etc.).
// Every date this app stores (start dates, termination dates, due
// dates...) is a calendar-day concept, not a specific moment in time —
// there's no "time of day" a termination date is supposed to mean. But
// dates get anchored at noon in the SERVER's timezone when saved
// (_safeParseDateNoon, VAConnectionService.gs), and reading that back
// with browser-local getters meant two people in different timezones —
// or a value round-tripped through UTC at all — could see a different
// day for the exact same stored value than a spot elsewhere in the app
// showing the same field, since not everywhere used browser-local
// getters (the Edit Termination Date modal's prefill, for one, already
// read the raw UTC date directly). Reading UTC components here matches
// that, and is timezone-proof for every viewer regardless of where
// they are.
function _fdate(dateVal)  { if (!dateVal) return '—'; var d = new Date(dateVal); return isNaN(d) ? String(dateVal) : _MONTH_ABBR[d.getUTCMonth()]+' '+d.getUTCDate()+' '+d.getUTCFullYear(); }

// ── CSV parser — handles quoted fields and commas inside quotes
function _csvParse(text) {
  var lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');

  // Skip empty trailing lines
  while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
  if (!lines.length) return { headers: [], rows: [] };

  function parseLine(line) {
    var fields = [];
    var cur    = '';
    var inQ    = false;
    for (var ci = 0; ci < line.length; ci++) {
      var ch   = line[ci];
      var next = line[ci + 1];
      if (inQ) {
        if (ch === '"' && next === '"') { cur += '"'; ci++; }
        else if (ch === '"')             { inQ = false; }
        else                             { cur += ch; }
      } else {
        if (ch === '"')       { inQ = true; }
        else if (ch === ',')  { fields.push(cur.trim()); cur = ''; }
        else                  { cur += ch; }
      }
    }
    fields.push(cur.trim());
    return fields;
  }

  var headers = parseLine(lines[0]).map(function (hdr) { return hdr.trim(); });
  var rows    = [];

  for (var li = 1; li < lines.length; li++) {
    var line = lines[li].trim();
    if (!line) continue;
    var vals = parseLine(line);
    var obj  = {};
    headers.forEach(function (hdr, idx) {
      obj[hdr] = vals[idx] !== undefined ? vals[idx] : '';
    });
    rows.push(obj);
  }

  return { headers: headers, rows: rows };
}

    '<div class="section-card">' +
      '<div style="padding:20px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">' +
        '<div>' +

          '<tbody>' + rowsHtml + '</tbody>' +

  if (!dryRun && res.imported > 0) {

var _ltvData = null;

// ── LTV: Specialist Breakdown Panel
function _ltvSpecialistSection(d) {
  if (!d || !d.customers || !d.customers.items || !d.customers.items.length) return '';

  // Group customer items by specialist (using their current status filter)
  var filtered = _ltvFilterItems(d.customers.items, 'createdAt');
  if (!filtered.length) return '';

  // Build specialist map
  var specMap = {};
  filtered.forEach(function(cust) {
    var spec = (cust.specialist || '').trim() || '(Unassigned)';
    if (!specMap[spec]) specMap[spec] = { name: spec, items: [] };
    specMap[spec].items.push(cust);
  });

  // Sort specialists by avg lifetime desc
  var specs = Object.keys(specMap).map(function(k) {
    var items  = specMap[k].items;
    var total  = items.length;
    var lifetimes = items.map(function(r){ return r.lifetimeMonths; });
    var avg    = total ? Math.round(lifetimes.reduce(function(a,b){return a+b;},0) / total * 10) / 10 : 0;
    var maxLtv = total ? Math.max.apply(null, lifetimes) : 0;
    var active = items.filter(function(r){ return r.status === 'Active'; }).length;
    return { name: k, total: total, avg: avg, max: maxLtv, active: active, items: items };
  }).sort(function(a,b){ return b.avg - a.avg; });

  var globalMax = Math.max.apply(null, specs.map(function(s){ return s.avg; })) || 1;

  // Top customers per specialist (up to 5) — the card's own inline
  // preview. Stops click-through to the card's own onclick (which opens
  // the "view all" modal) so clicking a customer name here still opens
  // that customer's own profile, not the specialist modal underneath it.
  function specTopCusts(items) {
    return items.slice()
      .sort(function(a,b){ return b.lifetimeMonths - a.lifetimeMonths; })
      .slice(0, 5)
      .map(function(r) {
        return '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border-light);">' +
          '<a href="#" data-cid="' + _esc(r.id) + '" onclick="event.stopPropagation();custOpenModal(this.dataset.cid);return false;" ' +
             'style="font-size:12.5px;color:var(--accent);font-weight:600;text-decoration:none;">' + _esc(r.name) + '</a>' +
          '<span style="font-size:12px;font-weight:700;color:var(--text-secondary);">' + r.lifetimeMonths + ' mo</span>' +
        '</div>';
      }).join('');
  }

  var cards = specs.map(function(sp) {
    var pct = Math.round(sp.avg / globalMax * 100);
    return '<div class="ltv-spec-card" data-spec="' + _esc(sp.name) + '" onclick="ltvOpenSpecialistModal(this.dataset.spec)" title="Click to view all ' + sp.total + ' customer' + (sp.total !== 1 ? 's' : '') + '">' +
      '<div class="ltv-spec-header">' +
        '<div>' +
          '<div class="ltv-spec-name">' + _esc(sp.name) + '</div>' +
          '<div class="ltv-spec-meta">' + sp.total + ' customer' + (sp.total !== 1 ? 's' : '') + ' · ' + sp.active + ' active</div>' +
        '</div>' +
        '<div style="text-align:right;">' +
          '<div class="ltv-spec-avg" style="color:#3b82f6;">' + sp.avg + ' mo</div>' +
          '<div style="font-size:10.5px;color:var(--text-muted);">avg lifetime</div>' +
        '</div>' +
      '</div>' +
      '<div class="ltv-spec-bar-track"><div class="ltv-spec-bar-fill" style="width:' + pct + '%;"></div></div>' +
      '<div style="padding:10px 0 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);">Top Customers by Lifetime</div>' +
      specTopCusts(sp.items) +
    '</div>';
  }).join('');

  return '<div class="ltv-section" style="margin-top:20px;">' +
    '<div class="ltv-section-header" style="border-left:4px solid #3b82f6;">' +
      '<div class="ltv-section-icon" style="background:#3b82f622;color:#3b82f6;">👥</div>' +
      '<div>' +
        '<div class="ltv-section-title">Lifetime Value by CS Specialist</div>' +
        '<div class="ltv-section-sub">' + specs.length + ' specialist' + (specs.length !== 1 ? 's' : '') + ' · Based on assigned customer lifetimes</div>' +
      '</div>' +
    '</div>' +
    '<div class="ltv-spec-grid">' + cards + '</div>' +
  '</div>';
}

        items.length + ' customer' + (items.length !== 1 ? 's' : '') +
      '</div>' +
      '<table style="width:100%;border-collapse:collapse;">' +
        '<thead><tr style="border-bottom:1px solid var(--border);">' +
          '<th style="text-align:left;padding:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);">Name</th>' +
          '<th style="text-align:right;padding:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);">Lifetime Value</th>' +

        '</tr></thead>' +
        '<tbody>' + (rows || '<tr><td colspan="3" style="padding:24px;text-align:center;color:var(--text-muted);">No customers found.</td></tr>') + '</tbody>' +

  var btn = document.getElementById('ltvExportBtn');

    .withSuccessHandler(function(res) {
