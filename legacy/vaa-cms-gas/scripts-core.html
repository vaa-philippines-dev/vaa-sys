// ══════════════════════════════════════════
// LTV REPORT — GLOBAL FILTER STATE
// ══════════════════════════════════════════
var _ltvGlobalFilter = {
  status:    'all',      // 'all' | 'active' | 'terminated'
  preset:    'all',      // 'all' | 'ytd' | 'lastyear' | '6mo' | '3mo' | 'custom'
  dateFrom:  '',
  dateTo:    ''
};

function ltvApplyFilter() {
  // Read values from the filter bar DOM
  var statusSel = document.getElementById('ltvStatusFilter');
  var presetSel = document.getElementById('ltvPreset');
  var fromEl    = document.getElementById('ltvFromDate');
  var toEl      = document.getElementById('ltvToDate');
  if (statusSel) _ltvGlobalFilter.status = statusSel.value;
  if (presetSel) _ltvGlobalFilter.preset = presetSel.value;
  _ltvApplyPresetDates(_ltvGlobalFilter.preset);
  if (_ltvData) ltvRender(_ltvData);
}

function ltvApplyCustomDate() {
  var fromEl = document.getElementById('ltvFromDate');
  var toEl   = document.getElementById('ltvToDate');
  _ltvGlobalFilter.preset   = 'custom';
  _ltvGlobalFilter.dateFrom = fromEl ? fromEl.value : '';
  _ltvGlobalFilter.dateTo   = toEl   ? toEl.value   : '';
  var presetSel = document.getElementById('ltvPreset');
  if (presetSel) presetSel.value = 'custom';
  if (_ltvData) ltvRender(_ltvData);
}

function _ltvApplyPresetDates(preset) {
  var now   = new Date();
  var from  = '';
  var to    = _ymdLocal(now);
  if (preset === 'ytd') {
    from = now.getFullYear() + '-01-01';
  } else if (preset === 'lastyear') {
    from = (now.getFullYear() - 1) + '-01-01';
    to   = (now.getFullYear() - 1) + '-12-31';
  } else if (preset === '6mo') {
    var d6 = new Date(now); d6.setMonth(d6.getMonth() - 6);
    from = _ymdLocal(d6);
  } else if (preset === '3mo') {
    var d3 = new Date(now); d3.setMonth(d3.getMonth() - 3);
    from = _ymdLocal(d3);
  } else if (preset === 'custom') {
    // leave as-is — user sets manually
    return;
  }
  // 'all' → clear dates
  _ltvGlobalFilter.dateFrom = from;
  _ltvGlobalFilter.dateTo   = to;
  var fromEl = document.getElementById('ltvFromDate');
  var toEl   = document.getElementById('ltvToDate');
  if (fromEl) fromEl.value = from;
  if (toEl)   toEl.value   = (preset === 'all' ? '' : to);
}

function _ltvFilterItems(items, dateField) {
  var f     = _ltvGlobalFilter;
  var fromT = f.dateFrom ? new Date(f.dateFrom).getTime() : 0;
  var toT   = f.dateTo   ? new Date(f.dateTo + 'T23:59:59').getTime() : Infinity;
  return items.filter(function(r) {
    // Status filter
    if (f.status === 'active'     && !(r.status === 'Active'     || r.status === 'Started'))                   return false;
    if (f.status === 'terminated' && !(r.status === 'Terminated' || r.status === 'Cancelled'))                  return false;
    if (f.status === 'cancelled'  && r.status !== 'Cancelled')                                                  return false;
    // Date filter: filter by the record's start date
    var rawDate = r[dateField] || r.createdAt || r.startDate;
    if (rawDate && (fromT > 0 || toT < Infinity)) {
      var t = new Date(rawDate).getTime();
      if (isNaN(t)) return true; // no date — include
      if (fromT > 0 && t < fromT) return false;
      if (toT < Infinity && t > toT) return false;
    }
    return true;
  });
}

function ltvRender(d) {
  var body = document.getElementById('ltvBody');
  if (!body) return;

  // ── Colour palette
  var BASE_PALETTE = [
    '#94a3b8','#60a5fa','#34d399','#f59e0b',
    '#f97316','#ec4899','#8b5cf6','#06b6d4',
    '#a3e635','#fb923c','#e879f9','#2dd4bf'
  ];
  function bucketColor(i) { return BASE_PALETTE[Math.min(i, BASE_PALETTE.length - 1)]; }

  // ── Helpers
  function quickStats(items) {
    if (!items.length) return { avg:0, median:0, min:0, max:0, total:0 };
    var vals = items.map(function(x){ return x.lifetimeMonths; }).sort(function(a,b){return a-b;});
    var sum  = vals.reduce(function(a,b){return a+b;},0);
    var mid  = Math.floor(vals.length/2);
    return {
      avg:    Math.round(sum/vals.length*10)/10,
      median: vals.length%2===0 ? Math.round((vals[mid-1]+vals[mid])/2*10)/10 : vals[mid],
      min:    vals[0], max: vals[vals.length-1], total: vals.length
    };
  }
  function quickBuckets(items, keys) {
    var b = {}; keys.forEach(function(k){b[k]=0;});
    items.forEach(function(x){ if(b[x.bucket]!==undefined) b[x.bucket]++; });
    return b;
  }

  function statCards(stats, color) {
    return [
      { label: 'Avg Lifetime',  val: stats.avg    + ' mo', sub: 'average tenure' },
      { label: 'Median',        val: stats.median + ' mo', sub: 'middle value' },
      { label: 'Longest',       val: stats.max    + ' mo', sub: 'max tenure' },
      { label: 'Shortest',      val: stats.min    + ' mo', sub: 'min tenure' },
      { label: 'Total Records', val: stats.total,           sub: 'in dataset' }
    ].map(function(card) {
      return '<div class="ltv-stat-card">' +
        '<div class="ltv-stat-val" style="color:' + color + ';">' + card.val + '</div>' +
        '<div class="ltv-stat-label">' + card.label + '</div>' +
        '<div class="ltv-stat-sub">' + card.sub + '</div>' +
      '</div>';
    }).join('');
  }

  function barChart(buckets, bucketKeys) {
    var vals = bucketKeys.map(function(k){ return buckets[k] || 0; });
    var max  = Math.max.apply(null, vals) || 1;
    return '<div class="ltv-bar-chart">' +
      bucketKeys.map(function(bk, i) {
        var v   = buckets[bk] || 0;
        var pct = Math.round(v / max * 100);
        return '<div class="ltv-bar-group">' +
          '<div class="ltv-bar-label">' + bk + '</div>' +
          '<div class="ltv-bar-track">' +
            '<div class="ltv-bar-fill" style="width:' + pct + '%;background:' + bucketColor(i) + ';"></div>' +
          '</div>' +
          '<div class="ltv-bar-count">' + v + '</div>' +
        '</div>';
      }).join('') +
    '</div>';
  }

  function topTable(items, nameFields, idField, maxRows) {
    var sorted = items.slice().sort(function(a,b){ return b.lifetimeMonths - a.lifetimeMonths; }).slice(0, maxRows || 10);
    if (!sorted.length) return '<div class="empty-state" style="padding:24px;"><h3>No data</h3></div>';
    return '<div class="table-wrap" style="max-height:320px;overflow-y:auto;"><table>' +
      '<thead><tr><th>#</th>' + nameFields.map(function(f){ return '<th>'+f.label+'</th>'; }).join('') + '<th>Status</th><th>Lifetime</th><th>Start</th><th>End / Today</th></tr></thead>' +
      '<tbody>' + sorted.map(function(row, idx) {
        var stCls = 'badge badge-' + (row.status||'').toLowerCase();
        return '<tr>' +
          '<td class="muted" style="font-size:11px;">' + (idx+1) + '</td>' +
          nameFields.map(function(f) {
            var val = _esc(row[f.field] || '—');
            if (f.clickFn && f.clickId) {
              var recId = _esc(row[f.clickId] || '');
              return '<td style="font-size:13px;"><a href="#" onclick="' + f.clickFn + '(\'' + recId + '\');return false;" style="color:var(--accent);font-weight:600;">' + val + '</a></td>';
            }
            return '<td style="font-size:13px;">' + val + '</td>';
          }).join('') +
          '<td><span class="' + stCls + '">' + _esc(row.status||'—') + '</span></td>' +
          '<td><strong style="font-size:13px;">' + row.lifetimeMonths + ' mo</strong></td>' +
          '<td class="muted">' + _fdate(row.createdAt || row.startDate) + '</td>' +
          '<td class="muted">' + (row.endDate ? _fdate(row.endDate) : '<span style="color:var(--success);">Active</span>') + '</td>' +
        '</tr>';
      }).join('') +
      '</tbody></table></div>';
  }

  function section(title, color, icon, entityData, nameFields, dateField) {
    var filtered  = _ltvFilterItems(entityData.items, dateField);
    var fStats    = quickStats(filtered);
    var fBuckets  = quickBuckets(filtered, entityData.bucketKeys);
    var total     = entityData.items.length;

    return '<div class="ltv-section">' +
      '<div class="ltv-section-header" style="border-left:4px solid ' + color + ';">' +
        '<div class="ltv-section-icon" style="background:' + color + '22;color:' + color + ';">' + icon + '</div>' +
        '<div>' +
          '<div class="ltv-section-title">' + title + '</div>' +
          '<div class="ltv-section-sub">Showing <strong>' + fStats.total + '</strong> of ' + total + ' record' + (total !== 1 ? 's' : '') + ' · Avg <strong>' + fStats.avg + ' mo</strong></div>' +
        '</div>' +
      '</div>' +
      '<div class="ltv-stat-grid">' + statCards(fStats, color) + '</div>' +
      '<div class="ltv-two-col" style="grid-template-columns:1fr 2fr;">' +
        '<div class="ltv-col">' +
          '<div class="ltv-col-title">Distribution by Lifetime Bucket</div>' +
          barChart(fBuckets, entityData.bucketKeys) +
        '</div>' +
        '<div class="ltv-col">' +
          '<div class="ltv-col-title">Top 10 by Longest Lifetime</div>' +
          topTable(filtered, nameFields, 'id', 10) +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // ── Apply global filter to each entity
  var custFiltered = _ltvFilterItems(d.customers.items,   'createdAt');
  var acctFiltered = _ltvFilterItems(d.accounts.items,    'createdAt');
  var connFiltered = _ltvFilterItems(d.connections.items, 'startDate');

  // ── Comparative overview (filtered)
  var compData = [
    { label: 'Customers',      items: custFiltered, color: '#3b82f6' },
    { label: 'Accounts',       items: acctFiltered, color: '#10b981' },
    { label: 'VA Connections', items: connFiltered, color: '#8b5cf6' }
  ].map(function(x) {
    var s = quickStats(x.items);
    return { label: x.label, avg: s.avg, total: s.total, color: x.color };
  });
  var maxAvg = Math.max.apply(null, compData.map(function(x){ return x.avg; })) || 1;
  var compSection =
    '<div class="ltv-section ltv-compare">' +
      '<div style="font-weight:700;font-size:15px;margin-bottom:16px;">Comparative Overview</div>' +
      '<div class="ltv-compare-grid">' +
      compData.map(function(x) {
        var pct = Math.round(x.avg / maxAvg * 100);
        return '<div class="ltv-compare-item">' +
          '<div class="ltv-compare-label">' + x.label + '</div>' +
          '<div class="ltv-compare-track">' +
            '<div class="ltv-compare-fill" style="width:' + pct + '%;background:' + x.color + ';"></div>' +
          '</div>' +
          '<div class="ltv-compare-val" style="color:' + x.color + ';">' + x.avg + ' mo avg</div>' +
          '<div class="ltv-compare-sub">' + x.total + ' records</div>' +
        '</div>';
      }).join('') +
      '</div>' +
    '</div>';

  var custSection = section('Customers',    '#3b82f6', '👤', d.customers,   [{ label:'Customer Name', field:'name',        clickFn:'custOpenModal', clickId:'id' }], 'createdAt');
  var acctSection = section('Accounts',     '#10b981', '🏢', d.accounts,    [{ label:'Account',       field:'companyName', clickFn:'cliOpenModal',  clickId:'id' }, { label:'Customer', field:'customerName' }, { label:'Type', field:'type' }], 'createdAt');
  var connSection = section('VA Connections','#8b5cf6','🔗', d.connections, [{ label:'VA Name',        field:'vaName',     clickFn:'vaConnOpenModal',clickId:'id' }, { label:'Account', field:'accountName' }, { label:'Customer', field:'customerName' }], 'startDate');

  // ── Tab bar
  var tabBar =
    '<div class="ltv-section-tabs" id="ltvSectionTabs">' +
      ['customers','accounts','connections'].map(function(tk) {
        var lbl = tk==='customers'?'Customers':tk==='accounts'?'Accounts':'VA Connections';
        return '<button class="ltv-section-tab'+((_ltvSectionTab||'customers')===tk?' active':'')+'" ' +
          'onclick="ltvSetSectionTab(\''+tk+'\')">' + lbl + '</button>';
      }).join('') +
    '</div>';

  var activeTab = _ltvSectionTab || 'customers';
  var activeSection = activeTab==='customers' ? custSection : activeTab==='accounts' ? acctSection : connSection;

  body.innerHTML = tabBar + activeSection + _ltvSpecialistSection(d);
}


function ltvExportCSV() {
  if (!_ltvData) return;
  var lines = [['Type','ID','Name','Status','Lifetime (Months)','Bucket','Start Date','End Date','Customer']];
  (_ltvData.customers.items || []).forEach(function(r) {
    lines.push(['Customer', r.id, r.name, r.status, r.lifetimeMonths, r.bucket, r.createdAt ? r.createdAt.substring(0,10) : '', r.endDate ? r.endDate.substring(0,10) : '', r.specialist]);
  });
  (_ltvData.accounts.items || []).forEach(function(r) {
    lines.push(['Account', r.id, r.companyName + (r.accountName ? ' — '+r.accountName : ''), r.status, r.lifetimeMonths, r.bucket, r.createdAt ? r.createdAt.substring(0,10) : '', r.endDate ? r.endDate.substring(0,10) : '', r.customerName]);
  });
  (_ltvData.connections.items || []).forEach(function(r) {
    lines.push(['VA Connection', r.id, r.vaName, r.status, r.lifetimeMonths, r.bucket, r.startDate ? r.startDate.substring(0,10) : '', r.endDate ? r.endDate.substring(0,10) : '', r.customerName]);
  });
  var csv = lines.map(function(row){ return row.map(function(v){ return '"' + String(v||'').replace(/"/g,'""') + '"'; }).join(','); }).join('\n');
  var blob = new Blob([csv], { type: 'text/csv' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = 'lifetime-value-report.csv';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function _approvalsLoad() {
  var wrap = document.getElementById('approvalsListWrap'); if (!wrap) return;
  var custRows = null, cliRows = null, gotError = '';
  function renderIfReady() {
    if (custRows === null || cliRows === null) return;
    if (!custRows.length && !cliRows.length) {
      wrap.innerHTML = gotError
        ? '<div class="empty-state"><h3>Error</h3><p>'+_esc(gotError)+'</p></div>'
        : '<div class="empty-state" style="padding:40px;"><h3>All caught up</h3><p>No status changes pending review right now.</p></div>';
      return;
    }
    function actionButtons(id) {
      return '<div style="display:flex;gap:6px;flex-shrink:0;">' +
        '<button class="btn btn-secondary btn-sm" data-cid="'+_esc(id)+'" onclick="_approvalsAct(this.dataset.cid,\'Cancel\',this.closest(\'.section-card\').dataset.entity)">Cancel</button>' +
        '<button class="btn btn-primary btn-sm" data-cid="'+_esc(id)+'" onclick="_approvalsAct(this.dataset.cid,\'Confirm\',this.closest(\'.section-card\').dataset.entity)">Confirm</button>' +
      '</div>';
    }
    function statusLine(r) {
      var action = r.pendingReviewAction || 'Terminated';
      return 'Already <strong>'+_esc(action)+'</strong> by '+_esc(r.requestedBy)+' on '+_fdate(r.requestedAt)+' · Effective '+_fdate(r.requestedDate);
    }
    var html = '';
    if (custRows.length) {
      html += '<div class="section-card" data-entity="customer" style="margin-bottom:14px;"><div class="section-title" style="margin-bottom:10px;">Customer Status Changes Pending Review ('+custRows.length+')</div>' +
        custRows.map(function(r) {
          return '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--border-light);" data-cid="'+_esc(r.customerId)+'">' +
            '<div>' +
              '<div style="font-size:13.5px;font-weight:700;">'+_esc(r.customerName||r.customerId)+'</div>' +
              '<div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">'+statusLine(r)+'</div>' +
              (r.reason ? '<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">"'+_esc(r.reason)+'"</div>' : '') +
            '</div>' + actionButtons(r.customerId) +
          '</div>';
        }).join('') + '</div>';
    }
    if (cliRows.length) {
      html += '<div class="section-card" data-entity="account"><div class="section-title" style="margin-bottom:10px;">Account Status Changes Pending Review ('+cliRows.length+')</div>' +
        cliRows.map(function(r) {
          return '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--border-light);" data-cid="'+_esc(r.clientId)+'">' +
            '<div>' +
              '<div style="font-size:13.5px;font-weight:700;">'+_esc(r.companyName||r.clientId)+'</div>' +
              '<div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">'+statusLine(r)+'</div>' +
              (r.reason ? '<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">"'+_esc(r.reason)+'"</div>' : '') +
            '</div>' + actionButtons(r.clientId) +
          '</div>';
        }).join('') + '</div>';
    }
    wrap.innerHTML = html;
  }
  google.script.run
    .withSuccessHandler(function(res) { custRows = (res && res.success) ? (res.data||[]) : []; if (res && !res.success) gotError = res.error; renderIfReady(); })
    .withFailureHandler(function(err) { custRows = []; gotError = err.message; renderIfReady(); })
    .getPendingCustomerTerminationApprovals();
  google.script.run
    .withSuccessHandler(function(res) { cliRows = (res && res.success) ? (res.data||[]) : []; if (res && !res.success) gotError = res.error; renderIfReady(); })
    .withFailureHandler(function(err) { cliRows = []; gotError = err.message; renderIfReady(); })
    .getPendingClientTerminationApprovals();
}
function _approvalsAct(id, action, entity) {
  var btnRow = document.querySelector('[data-cid="'+id+'"]');
  var buttons = btnRow ? btnRow.querySelectorAll('button') : [];
  buttons.forEach(function(b){ b.disabled = true; });
  var messages = { Confirm: 'Status change confirmed.', Cancel: 'Status change cancelled — reverted to the previous status.' };
  var handlers = google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { showToast((res&&res.error)||'Failed.', 'error'); buttons.forEach(function(b){ b.disabled = false; }); return; }
      showToast(messages[action] || 'Done.', action === 'Cancel' ? 'warning' : 'success');
      _approvalsLoad();
    })
    .withFailureHandler(function(err) { showToast(err.message, 'error'); buttons.forEach(function(b){ b.disabled = false; }); });
  if (entity === 'account') handlers.approveClientTermination(id, action);
  else handlers.approveCustomerTermination(id, action);
}

function termApplyFilters() {
  var q = ((document.getElementById('termSearch')||{}).value||'').toLowerCase();
  _termFiltered = _termAll.filter(function(r) {
    if (!q) return true;
    return [(r.relatedVAName||''),(r.customerName||''),(r.accountName||''),(r.terminationCause||'')]
      .some(function(v){ return v.toLowerCase().includes(q); });
  });
  _termFiltered.sort(function(a,b){ return new Date(b.createdAt||0)-new Date(a.createdAt||0); });
  termRender();
}

function termRender() {
  var tbody = document.getElementById('termTbody'); if (!tbody) return;
  if (!_termFiltered.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="muted" style="text-align:center;padding:24px;">No terminations found.</td></tr>';
    return;
  }
  var STATUS_COLORS = { 'Open':'badge-inactive','Closed - Resolved':'badge-active','Closed - Unresolved':'badge-terminated' };
  var TYPE_COLORS = { 'End of Project':'#8b5cf6','End of Contract':'#3b82f6','Remove':'#ef4444','Replace':'#10b981' };
  tbody.innerHTML = _termFiltered.map(function(r) {
    var typeColor = TYPE_COLORS[r.terminationStatusType] || '#64748b';
    return '<tr style="cursor:pointer;" onclick="iqOpenTicketModal(\''+_esc(r.inquiryId)+'\')">' +
      '<td><div style="font-weight:600;">'+_esc(r.relatedVAName||'—')+'</div><div class="muted" style="font-size:11.5px;">'+_esc(r.accountName||r.customerName||'—')+'</div></td>' +

      '<td><span class="badge '+(STATUS_COLORS[r.status]||'badge-inactive')+'">'+_esc(r.status||'—')+'</span></td>' +
      '<td class="muted">'+(r.targetTerminationDate ? _fdate(r.targetTerminationDate) : '—')+'</td>' +

function _iqLoadAllInner() {

    .withSuccessHandler(function(res) {

      if (!res || !res.success) { showToast((res&&res.error)||'Failed.','error'); return; }

      // "assigned to me" for CS Specialists — no client-side re-filter
      // needed here, and re-filtering by customerId would risk hiding an

      // customer outside their usual book.
      // Per the request — Termination tickets now stay visible in the
      // main Concerns & Inquiries list too, not just the dedicated
      // Terminations tab. They were being filtered out here entirely,

      _iqAll = res.data || [];

function iqApplyFilters() {
  var q   = ((document.getElementById('iqSearch')||{}).value||'').toLowerCase();
  var typ = (document.getElementById('iqTypeFilter')||{}).value||'';
  var pri = (document.getElementById('iqPriorityFilter')||{}).value||'';
  var csAssigned = (document.getElementById('iqCsAssignedFilter')||{}).value||'';
  var dept = (document.getElementById('iqDeptFilter')||{}).value||'';

  _iqFiltered = _iqAll.filter(function(r) {
    // "Open" is the umbrella bucket for anything not yet closed — In
    // Progress and Needs Response were never functionally distinct from
    // Open (In Progress had no meaningful different behavior, and nothing
    // in the backend ever actually set Needs Response), so both fold into
    // it here rather than being separate, mostly-empty tabs.
    if (_iqStatusTab === 'Open') {
      if (['Open','In Progress','Needs Response'].indexOf(r.status) === -1) return false;
    } else if (_iqStatusTab !== 'all' && r.status !== _iqStatusTab) {
      return false;
    }
    if (typ && r.inquiryType !== typ) return false;
    if (pri && r.priority    !== pri) return false;
    if (csAssigned && r.assignedTo !== csAssigned) return false;
    if (dept && r.department !== dept && r.relatedVADepartment !== dept) return false;
    if (q && ![(r.subject||''),(r.inquiryType||''),(r.customerName||''),(r.contactName||'')].some(function(v){ return v.toLowerCase().includes(q); })) return false;
    return true;
  });
  _iqPageNum = 1;
  iqRender();
}

function _iqLoadLinkedTermStatus(termInquiryId) {
  google.script.run
    .withSuccessHandler(function(res) {
      var row = document.getElementById('iqLinkedTermStatusRow'); if (!row) return;
      if (!res || !res.success) { row.innerHTML = ''; return; }
      var term = res.data;
      var STATUS_COLORS = { 'Open':'#64748b','Closed - Resolved':'#10b981','Closed - Unresolved':'#ef4444','Escalated':'#f59e0b' };

function _iqTermCauseChanged() {

function iqSaveTerminationClearance(inquiryId) {
  var reasonSel = document.getElementById('iqTermReason');
  var reasonLabel = reasonSel && reasonSel.selectedIndex > 0 ? reasonSel.options[reasonSel.selectedIndex].text : '';
  var reasonNotes = ((document.getElementById('iqTermReasonNotes')||{}).value||'').trim();
  var fullReason = [reasonLabel, reasonNotes].filter(Boolean).join(' — ');
  var securityAndExitChecked = !!(document.getElementById('iqTermSecurityConducted')||{}).checked;
  var securityAndExitDate = (document.getElementById('iqTermSecurityDate')||{}).value || '';
  var payload = {
    terminationCause: (document.getElementById('iqTermCause')||{}).value || '',
    csRetention: ((document.getElementById('iqTermCSRetention')||{}).value||'').trim(),
    securityConducted: securityAndExitChecked,
    securityDate: securityAndExitDate,
    vaExitCallConducted: securityAndExitChecked,
    vaExitCallDate: securityAndExitDate,
    targetTerminationDate: (document.getElementById('iqTermTargetDate')||{}).value || '',
    terminationReason: fullReason
  };
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { showToast((res&&res.error)||'Failed.', 'error'); return; }
      showToast('Clearance details saved.', 'success');
      iqOpenTicketModal(inquiryId);
    })
    .withFailureHandler(function(err) { showToast(err.message, 'error'); })
    .updateInquiry(inquiryId, payload);
}

// "Cancelled" resolves the underlying concern with no further cascade —
// per the request, only "Pushed Through" actually terminates the VA
// Connection, and "Changed to Replacement" routes through the existing
// escalation flow instead (see iqTerminationChangeToReplacement below).
function iqConfirmTerminationOutcome(inquiryId, outcome) {
  if (!confirm('Set this termination\'s outcome to "' + outcome + '"?')) return;
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { showToast((res&&res.error)||'Failed.', 'error'); return; }
      showToast('Outcome set to ' + outcome + '.', 'success');
      iqOpenTicketModal(inquiryId);
    })
    .withFailureHandler(function(err) { showToast(err.message, 'error'); })
    .updateInquiry(inquiryId, { terminationOutcome: outcome });
}

// Routes through the same "Escalate to Service Request" flow already
// used elsewhere, per the request — a termination ticket being changed
// to a replacement outcome should create (or link to) a replacement
// request the same way any other ticket does, rather than a separate,
// diverging mechanism.
function iqTerminationChangeToReplacement(inquiryId, clientId, customerId) {
  // Per the request — a proper modal-on-modal confirmation instead of
  // the browser's native confirm(), matching the pattern used
  // everywhere else in this app (e.g. iqOpenCreateTerminationTicket).
  // Wording matches what actually happens now — see the fix in
  // _reqProcessPendingEscalation (scripts-va-ops.html): this only ever
  // links a new Replacement request to this termination ticket. It no
  // longer touches the termination's own outcome or the VA Connection —
  // that still happens later, through this ticket's normal
  // Accept/Retract flow, same as any other termination.
  openStackedModal(
    '<div class="modal-header"><div class="modal-title">Apply a Replacement</div><button class="modal-close" onclick="closeStackedModal()">'+_svgClose()+'</button></div>' +
    '<div class="modal-body">' +
      '<p style="font-size:13.5px;color:var(--text-secondary);line-height:1.6;">This creates a <strong>Replacement Service Request</strong> for this VA, linked to this termination ticket.</p>' +
      '<p style="font-size:13.5px;color:var(--text-secondary);line-height:1.6;margin-top:10px;">The termination ticket itself <strong>stays open</strong> and keeps being processed normally alongside it — this step doesn\'t change its outcome or touch the VA Connection.</p>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeStackedModal()">Cancel</button>' +
      '<button class="btn btn-primary" data-iid="'+_esc(inquiryId)+'" data-cid="'+_esc(clientId||'')+'" data-custid="'+_esc(customerId||'')+'" onclick="_iqDoApplyReplacement(this.dataset.iid,this.dataset.cid,this.dataset.custid)">Apply a Replacement</button>' +
    '</div>'
  );
}
function _iqDoApplyReplacement(inquiryId, clientId, customerId) {
  closeStackedModal();
  window._pendingTerminationOutcomeOnEscalation = inquiryId;
  iqCreateSRFromModal(inquiryId, clientId, customerId, 'Replacement');
}

// The actual date the termination happened can differ from the Target
// Termination Date that was only ever the plan going in — per the
// request, this is re-confirmed at the point the termination is
// actually pushed through, rather than silently reusing the target date.
function iqConfirmPushThroughTermination(inquiryId, connectionId) {
  var today = _todayStr();
  openStackedModal(
    '<div class="modal-header"><div class="modal-title">Accept Termination</div><button class="modal-close" onclick="closeStackedModal()">'+_svgClose()+'</button></div>' +
    '<div class="modal-body">' +
      '<p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">This will terminate the linked VA Connection ('+_esc(connectionId||'—')+') and close this ticket as Closed - Unresolved (or Closed - Resolved, if a linked replacement has already been accepted).</p>' +
      '<div class="form-group">' +
        '<label class="form-label">VA\'s Actual Last Working Date <span class="required">*</span></label>' +
        '<input type="date" class="form-input" id="f_termPushDate" value="'+_esc(today)+'" />' +
      '</div>' +
      '<div id="termPushErr" class="form-error"></div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeStackedModal()">Cancel</button>' +
      '<button class="btn btn-danger" id="termPushBtn" data-iid="'+_esc(inquiryId)+'" onclick="iqDoPushThroughTermination(this.dataset.iid)">⚠ Accept Termination</button>' +
    '</div>'
  );
}

function iqDoPushThroughTermination(inquiryId) {
  var dateVal = (document.getElementById('f_termPushDate')||{}).value || '';
  var errEl = document.getElementById('termPushErr');
  if (!dateVal) { if (errEl) errEl.textContent = 'The VA\'s actual last working date is required.'; return; }
  var btn = document.getElementById('termPushBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="btn-spinner"></span> Processing…'; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { if (errEl) errEl.textContent = (res&&res.error)||'Failed.'; if (btn) { btn.disabled=false; btn.textContent='⚠ Accept Termination'; } return; }
      closeStackedModal();
      showToast('Termination accepted — VA Connection terminated.', 'success');
      iqOpenTicketModal(inquiryId);
    })
    .withFailureHandler(function(err) { if (errEl) errEl.textContent = err.message; if (btn) { btn.disabled=false; btn.textContent='⚠ Accept Termination'; } })
    .updateInquiry(inquiryId, { terminationOutcome: 'Accepted', actualTerminationDate: dateVal, actualLastWorkingDate: dateVal });
}

// ══════════════════════════════════════════════════════════════
// Left: where the termination stands (progress strip), the key ticket details, then one card each for
// the VA Connection, the Concern it came from, the Termination Clearance (with the decision), and the
// Replacement. Right: the conversation. The connection / concern / replacement cards are filled in by
// one backend call (getTerminationTicketContext).
function _iqtChip(text, status) {
  var COLORS = {
    'Started':'#10b981','Closed - Won':'#10b981','Closed - Resolved':'#10b981','Won':'#10b981','Completed':'#10b981',
    'Pending':'#f59e0b','Accepted':'#f59e0b','Paused':'#f59e0b','In Progress':'#f59e0b','Escalated':'#f59e0b','Needs Response':'#f59e0b',
    'Terminated':'#ef4444','Closed - Lost':'#ef4444','Closed - Unresolved':'#ef4444','Declined':'#ef4444',
    'Cancelled':'#64748b','Open':'#64748b'
  };
  var c = COLORS[status || text] || '#64748b';
  return '<span class="iqt-chip" style="background:' + c + '1f;color:' + c + ';">' + _esc(text || '—') + '</span>';
}
function _iqtKV(label, valueHtml) {
  return '<div><div class="iqt-kv-l">' + _esc(label) + '</div><div class="iqt-kv-v">' + valueHtml + '</div></div>';
}
function _iqtCard(id, icon, title, bodyHtml) {
  return '<section class="iqt-card">' +
    '<header class="iqt-card-h"><span>' + icon + '</span><span class="iqt-card-t">' + _esc(title) + '</span><span class="iqt-card-chip" id="' + id + 'Chip"></span></header>' +
    '<div class="iqt-card-b" id="' + id + 'Body">' + bodyHtml + '</div>' +
  '</section>';
}

function _iqtClearanceCard(iq, isClosed) {
  var outcome = iq.terminationOutcome || '';
  var outcomeLabel = outcome === 'Accepted' ? 'Pushed through' : (outcome || '');
  if (isClosed) {
    var secOn = iq.securityConducted || iq.vaExitCallConducted;
    var secDate = iq.securityDate || iq.vaExitCallDate;
    var reasonParts = String(iq.terminationReason || '').split(' — ');
    return _iqtCard('iqtClear', '📋', 'Termination Clearance',
      '<div class="iqt-grid" style="margin-top:0;">' +
        _iqtKV('Cause', _esc(iq.terminationCause || '—')) +
        _iqtKV('Outcome', outcome ? _iqtChip(outcomeLabel, outcome === 'Accepted' ? 'Terminated' : 'Cancelled') : '<span class="iqt-muted">—</span>') +
        _iqtKV('Target termination', iq.targetTerminationDate ? _fdate(iq.targetTerminationDate) : '—') +
        _iqtKV('Actual last working day', iq.actualLastWorkingDate ? _fdate(iq.actualLastWorkingDate) : '—') +
        (iq.terminationCause === 'Client Initiated' ? _iqtKV('Security & VA exit call', secOn ? 'Done' + (secDate ? ' · ' + _fdate(secDate) : '') : '<span class="iqt-muted">Not done</span>') : '') +
        _iqtKV('Reason', _esc(reasonParts[0] || '—')) +
      '</div>' +
      (iq.csRetention ? '<div style="margin-top:10px;">' + _iqtKV('CS retention', _esc(iq.csRetention)) + '</div>' : '') +
      (reasonParts.length > 1 ? '<div style="margin-top:10px;">' + _iqtKV('Notes', _esc(reasonParts.slice(1).join(' — '))) + '</div>' : ''));
  }
  var reasons = (CMS.settings && CMS.settings['TerminationReason']) || [];
  var reasonOpts = reasons.map(function(r) {
    var sel = (iq.terminationReason || '').split(' — ')[0] === r.label ? ' selected' : '';
    return '<option value="' + _esc(r.value) + '"' + sel + '>' + _esc(r.label) + '</option>';
  }).join('');
  var causeOpts = ['VA Resignation', 'VA Removal: Absence without Official Leave (AWOL)', 'Client Initiated'].map(function(c) {
    return '<option value="' + _esc(c) + '"' + (iq.terminationCause === c ? ' selected' : '') + '>' + _esc(c) + '</option>';
  }).join('');
  var isClientCause = iq.terminationCause === 'Client Initiated';
  var secDateVal = (iq.securityDate || iq.vaExitCallDate) ? String(iq.securityDate || iq.vaExitCallDate).substring(0, 10) : '';
  return '<div id="iqTermClearance" data-iid="' + _esc(iq.inquiryId) + '">' + _iqtCard('iqtClear', '📋', 'Termination Clearance',
    '<div class="iqt-fgrid">' +
      '<div><label class="form-label">Termination cause</label><select class="form-select" id="iqTermCause" onchange="_iqTermCauseChanged()"><option value="">Select…</option>' + causeOpts + '</select></div>' +
      '<div><label class="form-label">Target termination date</label><input type="date" class="form-input" id="iqTermTargetDate" value="' + _esc(iq.targetTerminationDate ? String(iq.targetTerminationDate).substring(0, 10) : '') + '" /></div>' +
      '<div class="iqt-full"><label class="form-label">CS retention</label><textarea class="form-textarea" id="iqTermCSRetention" style="min-height:64px;" placeholder="What retention effort was made before this was accepted?">' + _esc(iq.csRetention || '') + '</textarea></div>' +
      '<div class="iqt-full" id="iqTermClientChecklist" style="display:' + (isClientCause ? '' : 'none') + ';">' +
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--border-light);border-radius:8px;">' +
          '<input type="checkbox" id="iqTermSecurityConducted" ' + ((iq.securityConducted || iq.vaExitCallConducted) ? 'checked' : '') + ' />' +
          '<label for="iqTermSecurityConducted" style="font-size:13px;margin:0;">Security and VA exit call conducted</label>' +
          '<input type="date" id="iqTermSecurityDate" class="form-input" style="width:auto;padding:4px 8px;font-size:12.5px;margin-left:auto;" value="' + _esc(secDateVal) + '" />' +
        '</div>' +
      '</div>' +
      '<div class="iqt-full"><label class="form-label">Termination reason</label><select class="form-select" id="iqTermReason"><option value="">Select reason…</option>' + reasonOpts + '</select>' +
        '<textarea class="form-textarea" id="iqTermReasonNotes" style="min-height:56px;margin-top:6px;" placeholder="Additional notes…">' + _esc((iq.terminationReason || '').split(' — ').slice(1).join(' — ')) + '</textarea></div>' +
    '</div>' +
    '<div style="display:flex;justify-content:flex-end;margin-top:10px;"><button class="btn btn-secondary btn-sm" data-iid="' + _esc(iq.inquiryId) + '" onclick="iqSaveTerminationClearance(this.dataset.iid)">💾 Save clearance details</button></div>' +
    '<div class="iqt-decision"><div class="iqt-decision-l">Decision</div>' +
      '<button class="btn btn-secondary btn-sm" data-iid="' + _esc(iq.inquiryId) + '" onclick="iqConfirmTerminationOutcome(this.dataset.iid,\'Retracted\')" title="Cancels the termination — the VA stays connected">✕ Retract termination</button>' +
      '<button class="btn btn-secondary btn-sm" style="color:var(--danger);" data-iid="' + _esc(iq.inquiryId) + '" data-cid="' + _esc(iq.relatedConnectionId || '') + '" onclick="iqConfirmPushThroughTermination(this.dataset.iid,this.dataset.cid)" title="Pushes the termination through and ends the VA connection">⚠ Accept termination</button>' +
    '</div>') + '</div>';
}

function _iqRenderTerminationTicketModal(iq, x) {
  var isClosed = x.isClosed;
  var outcome = iq.terminationOutcome || '';
  var clearanceDone = !!(iq.terminationCause && iq.targetTerminationDate && iq.terminationReason);
  var steps = [
    { l: 'Concern',     st: iq.originatingInquiryId ? 'done' : 'skip', s: iq.originatingInquiryId ? 'Raised from a concern' : 'Raised directly' },
    { l: 'Clearance',   st: clearanceDone ? 'done' : 'current',        s: clearanceDone ? 'Details complete' : 'Details incomplete' },
    { l: 'Decision',    st: outcome ? 'done' : (clearanceDone ? 'current' : 'todo'), s: outcome === 'Accepted' ? 'Pushed through' : (outcome || 'Pending') },
    { l: 'Replacement', st: iq.escalatedToRequestId ? 'done' : 'todo', s: iq.escalatedToRequestId ? 'Requested' : 'None applied' }
  ];
  var stepsHtml = '<div class="iqt-steps">' + steps.map(function(p, i) {
    return '<div class="iqt-step iqt-step-' + p.st + '"><span class="iqt-dot">' + (p.st === 'done' ? '✓' : (i + 1)) + '</span>' +
      '<div style="min-width:0;"><div class="iqt-step-l">' + _esc(p.l) + '</div><div class="iqt-step-s">' + _esc(p.s) + '</div></div></div>';
  }).join('') + '</div>';

  var spec = (CMS.specialists || []).find(function(sp) { return sp.email === iq.assignedTo; });
  var infoHtml = '<div class="iqt-info-grid">' +
    _iqtKV('Customer / account', '<strong>' + _esc(iq.customerName || '—') + '</strong>' + (iq.accountName ? '<div class="iqt-sub">' + _esc(iq.accountName) + '</div>' : '')) +
    _iqtKV('Contact', _esc(iq.contactName || '—') + (iq.contactEmail ? '<div><a href="mailto:' + _esc(iq.contactEmail) + '" class="iqt-id" style="font-family:inherit;">' + _esc(iq.contactEmail) + '</a></div>' : '')) +
    _iqtKV('Assigned', '<span>' + _esc((spec && spec.name) || iq.assignedTo || '—') + '</span> ' +
      '<button class="pb-edit-btn" title="Transfer to a different CS Specialist" data-iid="' + _esc(iq.inquiryId) + '" data-cur="' + _esc(iq.assignedTo || '') + '" onclick="iqOpenTransferModal(this.dataset.iid,this.dataset.cur)">✎</button>') +
    _iqtKV('Created', _fdate(iq.createdAt)) +
    '<div class="iqt-info-actions">' +
      (iq.ticketReportLink ? '<a href="' + _esc(iq.ticketReportLink) + '" target="_blank" rel="noopener" class="btn btn-secondary btn-sm" style="font-size:12px;">📎 Ticket report</a>' : '') +
      '<button class="btn btn-secondary btn-sm" style="font-size:12px;" data-iid="' + _esc(iq.inquiryId) + '" onclick="iqGenerateReportText(this.dataset.iid)">📄 Generate report text</button>' +
    '</div>' +
  '</div>';

  var connCard   = _iqtCard('iqtConn',   '🔗', 'VA Connection', iq.relatedConnectionId ? '<div class="iqt-empty">Loading connection…</div>' : '<div class="iqt-empty">No VA connection is linked to this ticket.</div>');
  var originCard = _iqtCard('iqtOrigin', '💬', 'Concern ticket (origin)', iq.originatingInquiryId ? '<div class="iqt-empty">Loading concern…</div>' : '<div class="iqt-empty">Raised directly as a termination — it did not come from a concern ticket.</div>');
  var replBody = iq.escalatedToRequestId
    ? '<div class="iqt-empty">Loading replacement…</div>'
    : '<div class="iqt-empty">No replacement has been applied.' + (isClosed ? '' : ' Applying one creates a replacement request linked to this termination.') + '</div>' +
      (isClosed ? '' : '<div style="margin-top:10px;"><button class="btn btn-secondary btn-sm" style="color:var(--success);" data-iid="' + _esc(iq.inquiryId) + '" data-cid="' + _esc(iq.clientId || '') + '" data-custid="' + _esc(iq.customerId || '') + '" onclick="iqTerminationChangeToReplacement(this.dataset.iid,this.dataset.cid,this.dataset.custid)">🔄 Apply a replacement</button></div>');
  var replCard = _iqtCard('iqtRepl', '🔄', 'Replacement', replBody);

  var threadCount = (iq.thread || []).length;
  document.getElementById('modalBox').style.maxWidth = '1280px';
  openModal(
    '<div class="modal-header" style="border-bottom:2px solid var(--border);">' +
      '<div>' +
        '<div class="modal-title" style="font-size:16px;">' + _esc(iq.subject || 'Termination') + '</div>' +
        '<div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">' + _esc(iq.inquiryId) + ' · ' +
          '<span class="badge ' + x.badgeCls + '" style="font-size:10px;">' + _esc(iq.status) + '</span> ' +
          '<span style="font-weight:700;font-size:10.5px;color:' + x.priColor + ';">' + _esc(iq.priority || '—') + ' Priority</span>' +
          (x.needsResp ? ' <span style="font-size:11px;font-weight:700;color:#ef4444;">⚡ Needs Response</span>' : '') +
        '</div>' +
      '</div>' +
      '<div style="display:flex;gap:6px;align-items:center;">' +
        '<a href="#" onclick="closeModal();navigate(\'inquiry-profile\',\'' + _esc(iq.inquiryId) + '\');return false;" class="btn btn-ghost btn-sm" style="font-size:12px;">Full Page View →</a>' +
        '<button class="btn btn-ghost btn-sm" style="font-size:12px;" data-iid="' + _esc(iq.inquiryId) + '" onclick="iqOpenEditHeader(this.dataset.iid)">✎ Edit</button>' +
        '<button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button>' +
      '</div>' +
    '</div>' +
    '<div class="modal-body iqt-body">' +
      '<div class="iqt-left">' + stepsHtml + infoHtml + connCard + originCard + _iqtClearanceCard(iq, isClosed) + replCard + '</div>' +
      '<div class="iqt-right">' +
        '<div class="iqt-conv-h">💬 Conversation <span>' + threadCount + ' update' + (threadCount !== 1 ? 's' : '') + '</span></div>' +
        '<div id="iqTimelineScroll" class="iqt-conv-scroll">' + x.threadHtml + '</div>' +
        '<div class="iqt-reply">' + x.replyBox + '</div>' +
      '</div>' +
    '</div>'
  );
  setTimeout(function() { var sc = document.getElementById('iqTimelineScroll'); if (sc) sc.scrollTop = sc.scrollHeight; }, 80);
  _iqtFillContext(iq, isClosed);
}

function _iqtFillContext(iq, isClosed) {
  google.script.run
    .withSuccessHandler(function(res) {
      var cb = document.getElementById('iqtConnBody'), ob = document.getElementById('iqtOriginBody'), rb = document.getElementById('iqtReplBody');
      if (!cb && !ob && !rb) return; // modal was closed meanwhile
      function setChip(id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html || ''; }
      if (!res || !res.success) {
        var msg = '<div class="iqt-repl-warn">Couldn\'t load the linked details' + ((res && res.error) ? ' — ' + _esc(res.error) : '') + '.</div>';
        if (iq.relatedConnectionId && cb) cb.innerHTML = msg;
        if (iq.originatingInquiryId && ob) ob.innerHTML = msg;
        if (iq.escalatedToRequestId && rb) rb.innerHTML = msg;
        return;
      }
      var d = res.data;

      // ── VA Connection
      if (iq.relatedConnectionId && cb) {
        var c = d.connection;
        if (c) {
          setChip('iqtConnChip', _iqtChip(c.connectionStatus, c.connectionStatus));
          cb.innerHTML =
            '<div class="iqt-va">' + _esc(c.vaName || iq.relatedVAName || '—') + (iq.relatedVADepartment ? ' <span class="iqt-sub">· ' + _esc(iq.relatedVADepartment) + '</span>' : '') + '</div>' +
            '<a href="#" class="iqt-id" onclick="vaConnOpenModal(\'' + _esc(c.connectionId) + '\');return false;">' + _esc(c.connectionId) + ' ↗</a>' +
            '<div class="iqt-grid">' +
              _iqtKV('Account', _esc((c.companyName || c.customerName || iq.customerName || '—') + (c.accountName ? ' — ' + c.accountName : ''))) +
              _iqtKV('Connection type', _esc(c.connectionType || '—')) +
              _iqtKV('Hours', c.hours ? _esc(c.hours + 'h · ' + (c.hoursType || '')) : '—') +
              _iqtKV('Started', c.actualStartDate ? _fdate(c.actualStartDate) : '—') +
              _iqtKV('Termination date', c.terminationDate ? '<strong>' + _fdate(c.terminationDate) + '</strong>' : '<span class="iqt-muted">Not yet terminated</span>') +
              _iqtKV('Target termination', iq.targetTerminationDate ? _fdate(iq.targetTerminationDate) : '<span class="iqt-muted">Not set</span>') +
            '</div>';
        } else cb.innerHTML = '<div class="iqt-repl-warn">Connection ' + _esc(iq.relatedConnectionId) + ' could not be found.</div>';
      }

      // ── Concern ticket it came from
      if (iq.originatingInquiryId && ob) {
        var o = d.originating;
        if (o) {
          setChip('iqtOriginChip', _iqtChip(o.status, o.status));
          var spec2 = (CMS.specialists || []).find(function(sp) { return sp.email === o.assignedTo; });
          ob.innerHTML =
            '<a href="#" class="iqt-link" data-iid="' + _esc(o.inquiryId) + '" onclick="iqOpenTicketSummary(this.dataset.iid);return false;">' + _esc(o.subject || o.inquiryId) + '</a>' +
            '<div class="iqt-sub" style="margin-top:2px;">' + _esc(o.inquiryId) + ' · ' + _esc(o.inquiryType || 'Concern') + '</div>' +
            '<div class="iqt-grid">' +
              _iqtKV('Priority', _esc(o.priority || '—')) +
              _iqtKV('Raised', o.createdAt ? _fdate(o.createdAt) : '—') +
              _iqtKV('Assigned', _esc((spec2 && spec2.name) || o.assignedTo || '—')) +
              (o.resolution ? _iqtKV('Resolution', _esc(o.resolution)) : '') +
            '</div>';
        } else ob.innerHTML = '<div class="iqt-repl-warn">Concern ' + _esc(iq.originatingInquiryId) + ' could not be found.</div>';
      }

      // ── Replacement request + the replacement VA's connection
      if (iq.escalatedToRequestId && rb) {
        var r = d.replacement;
        if (r) {
          setChip('iqtReplChip', _iqtChip(r.status || '—', r.status));
          var rc = r.connection;
          var connLine;
          if (rc && rc.connectionStatus && ['Pending', 'Accepted', 'Declined', 'Cancelled'].indexOf(rc.connectionStatus) === -1) {
            connLine = '<div class="iqt-repl-ok">✓ <strong>Connected:</strong> ' + _esc(rc.vaName || '—') + ' ' + _iqtChip(rc.connectionStatus, rc.connectionStatus) +
              (rc.actualStartDate ? ' · started ' + _fdate(rc.actualStartDate) : '') +
              '<div><a href="#" class="iqt-id" onclick="vaConnOpenModal(\'' + _esc(rc.connectionId) + '\');return false;">' + _esc(rc.connectionId) + ' ↗</a></div></div>';
          } else if (r.status === 'Closed - Lost') {
            connLine = '<div class="iqt-repl-warn">The replacement request was <strong>cancelled</strong> (Closed - Lost) — it did not push through.</div>';
          } else {
            connLine = '<div class="iqt-repl-warn">Waiting for the replacement VA to connect' + (rc && rc.vaName ? ' — ' + _esc(rc.vaName) + ' (' + _esc(rc.connectionStatus) + ')' : '') + '.</div>';
          }
          rb.innerHTML =
            '<a href="#" class="iqt-link" data-rid="' + _esc(r.requestId) + '" onclick="reqOpenDetailModal(this.dataset.rid);return false;">' + _esc(r.requestId) + ' ↗</a>' +
            '<div class="iqt-grid">' +
              _iqtKV('Request status', _iqtChip(r.status || '—', r.status)) +
              _iqtKV('Type', _esc(r.requestType || 'Replacement')) +
              _iqtKV('Service', _esc(r.service || '—') + (r.department ? '<div class="iqt-sub">' + _esc(r.department) + '</div>' : '')) +
              _iqtKV('Requested', r.createdAt ? _fdate(r.createdAt) : '—') +
            '</div>' + connLine;
        } else rb.innerHTML = '<div class="iqt-repl-warn">Replacement request ' + _esc(iq.escalatedToRequestId) + ' could not be found.</div>';
      }
    })
    .withFailureHandler(function(err) {
      var msg = '<div class="iqt-repl-warn">Couldn\'t load the linked details — ' + _esc(err.message) + '.</div>';
      var cb = document.getElementById('iqtConnBody'), ob = document.getElementById('iqtOriginBody'), rb = document.getElementById('iqtReplBody');
      if (iq.relatedConnectionId && cb) cb.innerHTML = msg;
      if (iq.originatingInquiryId && ob) ob.innerHTML = msg;
      if (iq.escalatedToRequestId && rb) rb.innerHTML = msg;
    })
    .getTerminationTicketContext(iq.inquiryId);
}

function _iqRenderTicketModal(iq) {
  window._iqModalData = iq; // cache for edit/header actions
  var isClosed   = iq.status === 'Closed - Resolved' || iq.status === 'Closed - Unresolved';
  var badgeCls   = IQ_STATUS_BADGE[iq.status] || 'badge-inactive';
  var priColor   = IQ_PRIORITY_COLOR[iq.priority] || '#94a3b8';
  var needsResp  = iq.status === 'Needs Response';

  // ── Timeline: initial notes entry first, then thread
  var initialEntry = iq.notes
    ? _iqBuildEntry({
        authorName:  iq.createdBy || 'System',
        authorEmail: iq.createdBy || '',
        senderType:  'client',
        messageType: 'note',
        content:     iq.notes,
        statusChange:'',
        createdAt:   iq.createdAt,
        isInitial:   true
      })
    : '';

  var threadHtml = initialEntry + (iq.thread || []).map(function(u) {
    return _iqBuildEntry(u);
  }).join('');

  // ── Reply box
  var specOpts = (CMS.specialists||[]).map(function(s){
    var sel = CMS.user && CMS.user.email === s.email ? ' selected' : '';
    return '<option value="'+_esc(s.email)+'"'+sel+'>'+_esc(s.name||s.email)+'</option>';
  }).join('');
  var managerOpts = (CMS.specialists||[]).filter(function(s){return s.role==='CS Manager';}).map(function(s){
    return '<option value="'+_esc(s.email)+'">'+_esc(s.name||s.email)+' (Manager)</option>';
  }).join('');

  var replyBox = !isClosed
    ? '<div class="iq-reply-area">' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center;">' +
          '<div class="form-group" style="margin:0;flex:0 0 auto;">' +
            '<label class="form-label" style="margin-bottom:4px;">Message From</label>' +
            '<select class="form-select" id="iqSenderType" style="font-size:12.5px;" onchange="iqUpdateReplyStyle()">' +
              '<option value="cs">CS Specialist / Internal</option>' +
              '<option value="client">Client / Customer</option>' +
              '<option value="manager">CS Manager</option>' +
            '</select>' +
          '</div>' +
          '<div class="form-group" style="margin:0;flex:0 0 auto;">' +
            '<label class="form-label" style="margin-bottom:4px;">Message Type</label>' +
            '<select class="form-select" id="iqMessageType" style="font-size:12.5px;">' +
              '<option value="note">Internal Note</option>' +
              '<option value="email">Email (from client)</option>' +
              '<option value="whatsapp">WhatsApp Message</option>' +
              '<option value="response">Response to Client</option>' +
              '<option value="followup">Follow-Up</option>' +
            '</select>' +
          '</div>' +
        '</div>' +
        '<div id="iqReplyWrap" style="position:relative;">' +
          '<textarea class="form-textarea" id="iqReplyInput" style="min-height:90px;resize:vertical;" placeholder="Type a message, note, or follow-up…"></textarea>' +
        '</div>' +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:2px;">' +
          '<label style="font-size:12px;color:var(--text-muted);">Date Posted:</label>' +
          '<input type="datetime-local" id="iqPostedAt" class="form-input" style="max-width:220px;padding:4px 8px;font-size:12px;" value="'+_nowLocalDateTimeStr()+'" />' +
        '</div>' +
        '<div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;">This also serves as the response time for this message — used wherever response turnaround is measured.</div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
            '<button class="btn btn-ghost btn-sm" style="color:var(--success);font-size:12px;" onclick="iqOpenCloseModal(\''+_esc(iq.inquiryId)+'\',\'won\')">✓ Resolve</button>' +
            '<button class="btn btn-ghost btn-sm" style="color:var(--danger);font-size:12px;" onclick="iqOpenCloseModal(\''+_esc(iq.inquiryId)+'\',\'lost\')">✗ Unresolved</button>' +
            (iq.escalatedToRequestId
              ? '<button class="btn btn-ghost btn-sm" style="font-size:12px;" data-rid="'+_esc(iq.escalatedToRequestId)+'" onclick="iqOpenEscalatedRequestSummary(this.dataset.rid)">↗ View Escalated Request</button>'
              : '') +
          '</div>' +

// EDIT INQUIRY (header fields: subject, type, priority, contact)
// ══════════════════════════════════════════════════════════════
// ── Generate a full plain-text report of this inquiry + its whole
// conversation thread, formatted to paste straight into a Google Doc.
// Built client-side from the already-loaded ticket data — no extra
// server round-trip needed.
function iqGenerateReportText(inquiryId) {
  var iq = (window._iqModalData && window._iqModalData.inquiryId === inquiryId)
    ? window._iqModalData
    : ((typeof _iqProfileData !== 'undefined' && _iqProfileData && _iqProfileData.inquiryId === inquiryId) ? _iqProfileData : null);
  if (!iq) { showToast('Open the ticket first.', 'error'); return; }

  var lines = [];
  lines.push('INQUIRY REPORT');
  lines.push('='.repeat(50));
  lines.push('Ticket ID: ' + (iq.inquiryId || ''));
  lines.push('Subject: ' + (iq.subject || ''));
  lines.push('Type: ' + (iq.inquiryType || '—'));
  lines.push('Priority: ' + (iq.priority || '—'));
  lines.push('Status: ' + (iq.status || '—'));
  lines.push('Customer: ' + (iq.customerName || '—') + (iq.accountName ? ' / ' + iq.accountName : ''));
  lines.push('Contact: ' + (iq.contactName || '—') + (iq.contactEmail ? ' (' + iq.contactEmail + ')' : ''));
  lines.push('Assigned To: ' + (iq.assignedTo || '—'));
  lines.push('Created: ' + _fdate(iq.createdAt));
  if (iq.resolution) lines.push('Resolution: ' + iq.resolution);
  if (iq.lostReason) lines.push('Unresolved Reason: ' + iq.lostReason);
  lines.push('');
  lines.push('CONVERSATION LOG');
  lines.push('-'.repeat(50));

  var MSG_TYPE_LABEL = { email:'Email', whatsapp:'WhatsApp Message', note:'Internal Note', response:'Response to Client', followup:'Follow-Up' };
  var SENDER_LABEL = { client:'Client', cs:'CS Specialist', manager:'CS Manager' };
  function fmtTs(v) { var d = new Date(v); return isNaN(d.getTime()) ? String(v||'') : d.toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' }); }

  var entries = [];
  if (iq.notes) {
    entries.push({ label: 'Original Inquiry', sender: 'Client', author: iq.createdBy || 'System', content: iq.notes, at: iq.createdAt });
  }
  (iq.thread || []).forEach(function(u) {
    if (!u.content) return; // skip pure status-change entries with no message
    entries.push({
      label: MSG_TYPE_LABEL[u.messageType] || 'Message',
      sender: SENDER_LABEL[u.senderType] || u.senderType || '',
      author: u.authorName || u.authorEmail || '',
      content: u.content,
      at: u.postedAt || u.createdAt
    });
  });

  if (!entries.length) {
    lines.push('(No messages recorded.)');
  } else {
    entries.forEach(function(e) {
      lines.push('');
      lines.push('[' + fmtTs(e.at) + '] ' + e.label + ' — ' + e.sender + (e.author ? ' (' + e.author + ')' : ''));
      lines.push(e.content);
    });
  }

  var reportText = lines.join('\n');

  openModal(
    '<div class="modal-header"><div class="modal-title">Inquiry Report Text</div><button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>' +
    '<div class="modal-body">' +
      '<div class="form-hint" style="margin-bottom:8px;">Copy this and paste it into a Google Doc, then link that doc back on this inquiry via "Edit".</div>' +
      '<textarea class="form-textarea" id="iqReportTextArea" readonly style="min-height:360px;font-family:var(--font-mono);font-size:12px;white-space:pre-wrap;">'+_esc(reportText)+'</textarea>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Close</button>' +
      '<button class="btn btn-primary" onclick="iqCopyReportText()">Copy to Clipboard</button>' +
    '</div>'
  );
}
function iqCopyReportText() {
  var ta = document.getElementById('iqReportTextArea');
  if (!ta) return;
  ta.focus(); ta.select();
  var copied = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value);
      copied = true;
    }
  } catch (e) { /* fall through to execCommand */ }
  if (!copied) {
    try { copied = document.execCommand('copy'); } catch (e) { copied = false; }
  }
  showToast(copied ? 'Copied to clipboard.' : 'Select the text above and copy manually (Ctrl/Cmd+C).', copied ? 'success' : 'info');
}

        '<div class="form-group"><label class="form-label">Contact Name</label>' +

        '<input class="form-input" id="iqEdit_reportLink" type="url" placeholder="https://docs.google.com/…" value="'+_esc(iq.ticketReportLink||'')+'" />' +
        '<div class="form-hint">Link to the Google Doc (or other document) this ticket\'s report was saved to — see "Generate Report Text" on the ticket for content to paste in.</div></div>' +
      '<div id="iqEditHeaderErr" style="color:var(--danger);font-size:12.5px;"></div>' +

    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" onclick="iqDoEditHeader(\''+_esc(inquiryId)+'\')">Save Changes</button>' +
    '</div>'
  );
}

function iqDoEditHeader(inquiryId) {
  var subject = ((document.getElementById('iqEdit_subject')||{}).value||'').trim();
  var errEl   = document.getElementById('iqEditHeaderErr');
  if (!subject) { if (errEl) errEl.textContent = 'Subject is required.'; return; }
  if (errEl) errEl.textContent = '';

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { if (errEl) errEl.textContent = (res&&res.error)||'Failed.'; return; }
      showToast('Inquiry updated.', 'success');
      iqLoadAll();
      iqOpenTicketModal(inquiryId);
    })
    .withFailureHandler(function(err) { if (errEl) errEl.textContent = err.message; })
    .updateInq(inquiryId, {
      subject:      subject,
      inquiryType:  (document.getElementById('iqEdit_type')||{}).value||'',
      priority:     (document.getElementById('iqEdit_priority')||{}).value||'Medium',
      ticketReportLink: ((document.getElementById('iqEdit_reportLink')||{}).value||'').trim(),
      contactName:  (document.getElementById('iqEdit_contactName')||{}).value||'',
      contactEmail: (document.getElementById('iqEdit_contactEmail')||{}).value||'',
      createdDate:  (document.getElementById('iqEdit_createdDate')||{}).value||''
    });
}

function iqDoEditEntry(updateId, inquiryId) {
  var content = ((document.getElementById('iqEditEntry_content')||{}).value||'').trim();
  var errEl   = document.getElementById('iqEditEntryErr');
  if (!content) { if (errEl) errEl.textContent = 'Message content cannot be empty.'; return; }

  google.script.run
    .withSuccessHandler(function(res) {

function _iqBuildEntry(u) {
  var isClient  = u.senderType === 'client';
  var isManager = u.senderType === 'manager';
  var isSystem  = !u.content && u.statusChange;
  var typeTag   = '';
  if (u.isInitial)        typeTag = '<span class="iq-tag iq-tag-initial">Original</span>';
  else if (u.messageType === 'email')    typeTag = '<span class="iq-tag iq-tag-email">📧 Email</span>';
  else if (u.messageType === 'whatsapp') typeTag = '<span class="iq-tag iq-tag-whatsapp">💚 WhatsApp</span>';
  else if (u.messageType === 'response') typeTag = '<span class="iq-tag iq-tag-response">💬 Response</span>';
  else if (u.messageType === 'followup') typeTag = '<span class="iq-tag iq-tag-followup">🔔 Follow-up</span>';
  else if (u.messageType === 'note')     typeTag = '<span class="iq-tag iq-tag-note">📝 Note</span>';

  if (isSystem) {
    return '<div class="iq-entry iq-entry-system">' +
      '<span style="font-size:11.5px;color:var(--text-muted);font-style:italic;">' +
        _esc(u.statusChange) + ' · ' + _fdate(u.createdAt) +
      '</span>' +
    '</div>';
  }

  // Role badge: who actually sent this message (Client, CS Specialist, or CS Manager)
  var roleLabel = isClient ? 'Client' : isManager ? 'CS Manager' : 'CS Specialist';
  var roleColor = isClient ? '#3b82f6' : isManager ? '#8b5cf6' : '#10b981';
  var roleBadge = '<span class="iq-role-badge" style="background:'+roleColor+'1a;color:'+roleColor+';">'+roleLabel+'</span>';

  // Display name: when the message is FROM the client, show the ticket's
  // registered client/contact name (not the CS user who logged it on their behalf).
  // The actual person who posted the entry (CS user logging it) shows as a subtitle email.
  var iqCtx = window._iqModalData || {};
  var displayName, subtitleEmail;
  if (isClient) {
    displayName   = iqCtx.contactName || u.authorName || u.authorEmail || 'Client';
    subtitleEmail = u.authorEmail || '';
  } else {
    displayName   = u.authorName || u.authorEmail || '—';
    subtitleEmail = u.authorEmail || '';
  }

  var avatarInitial = (displayName || '?').charAt(0).toUpperCase();
  var avatarBg = isClient ? '#3b82f6' : isManager ? '#8b5cf6' : '#10b981';
  var bubbleBg = isClient ? 'var(--surface-2)' : 'var(--accent-light)';
  var align    = isClient ? '' : 'align-self:flex-end;';

  return '<div class="iq-entry' + (isClient ? '' : ' iq-entry-right') + '">' +
    (isClient
      ? '<div class="iq-entry-avatar" style="background:'+avatarBg+';">'+avatarInitial+'</div>'
      : '') +
    '<div class="iq-entry-bubble" style="background:'+bubbleBg+';'+align+'">' +
      '<div class="iq-entry-header">' +
        '<span class="iq-entry-name">' + _esc(displayName) + '</span>' +
        roleBadge +
        typeTag +
        '<span class="iq-entry-time">' + _fdate(u.postedAt||u.createdAt) + '</span>' +
        (u.updateId && !u.isInitial
          ? '<button class="iq-entry-edit-btn" title="Edit message" data-uid="'+_esc(u.updateId)+'" data-iid="'+_esc((window._iqModalData||{}).inquiryId||'')+'" onclick="iqOpenEditEntry(this.dataset.uid,this.dataset.iid)">✎</button>'
          : '') +
      '</div>' +
      (subtitleEmail ? '<div class="iq-entry-subtitle">'+_esc(subtitleEmail)+'</div>' : '') +
      (u.statusChange ? '<div class="iq-entry-status-chip">'+_esc(u.statusChange)+'</div>' : '') +
      '<div class="iq-entry-content">' + _escHtml(u.content) + '</div>' +
    '</div>' +
    (!isClient
      ? '<div class="iq-entry-avatar" style="background:'+avatarBg+';">'+avatarInitial+'</div>'
      : '') +
  '</div>';
}

// HTML escape that preserves newlines as <br>
function _escHtml(text) {
  if (!text) return '';
  return _esc(text).replace(/\n/g, '<br>');
}

function iqCreateSRFromModal(inquiryId, clientId, customerId, reqType) {
  var iq = window._iqModalData;
  // Reuses the same globals/completion logic as iqOpenEscalateToRequest,
  // per this fix — sourceInquiryId was previously passed into the form's
  // prefill data but never actually read anywhere, so this entry point
  // never linked back to the ticket at all.
  window._pendingEscalationInquiryId = inquiryId;
  // Per the request — this dedicated Replacement Request entry point
  // intentionally does not set the connection ID here (unlike the
  // generic "Escalate to Service Request" flow), since that's what
  // triggers _reqProcessPendingEscalation's auto-creation of a separate
  // Termination ticket. Choosing Replacement already makes the intent
  // explicit — there should only be the one ticket, simply transitioning
  // from Open to Escalated, not a second, duplicate one alongside it.
  window._pendingEscalationConnectionId = '';
  closeModal();
  _ensureReqFormData(function() {
    document.getElementById('modalBox').style.maxWidth = '860px';
    openModal(_reqBuildForm(null, {
      prefillClientId:   clientId,
      prefillCustomerId: customerId,
      prefillType:       reqType || 'Additional',
      sourceInquiryId:   inquiryId
    }));
    setTimeout(function() {
      var cs = document.getElementById('f_reqCustomer');
      if (cs && customerId) { cs.value = customerId; cs.disabled = true; reqFormLoadClients(cs); }
      setTimeout(function() {
        var cl = document.getElementById('f_reqClient');
        if (cl && clientId) { cl.value = clientId; cl.disabled = true; }
        var ts = document.getElementById('f_reqType');
        if (ts) { ts.value = reqType||'Additional'; ts.disabled = true; }
        reqLoadContactsForClient(clientId);
        var pri = document.getElementById('f_reqPrimary');
        var sec = document.getElementById('f_reqSecondary');
        if (pri) pri.disabled = true;
        if (sec) sec.disabled = true;
      }, 650);
    }, 200);
    // Bug fix, per the same class already found and fixed once for
    // vaConnProfileAddReplacement — every other path that opens this form
    // calls reqFormLoadTimezones() right after rendering it, but this one
    // never did, leaving the hidden <select> stuck on its "Loading
    // timezones…" placeholder forever, which is what the "Client
    // Timezone is required" validation was actually reading.
    var escConnIdForTz = (iq && iq.inquiryId === inquiryId) ? (iq.relatedConnectionId || '') : '';
    if (escConnIdForTz) {
      google.script.run
        .withSuccessHandler(function(connRes) {
          var tz = (connRes && connRes.success && connRes.data) ? (connRes.data.clientTimezone || '') : '';
          reqFormLoadTimezones(tz);
        })
        .withFailureHandler(function() { reqFormLoadTimezones(''); })
        .getVAConnById(escConnIdForTz);
    } else {
      reqFormLoadTimezones('');
    }
  });
}

function iqOpenCloseModal(inquiryId, outcome) {
  var appSettings = CMS.settings || {};
  var lostReasons = (appSettings.InquiryLostReason || []).map(function(r){
    return '<option value="'+_esc(r.value)+'">'+_esc(r.label)+'</option>';
  }).join('');
  var isLost = outcome === 'lost';
  // A Termination ticket's "Resolved" path always means Retracted — the
  // only other way it resolves (Replace) is computed automatically from
  // whether a linked replacement was itself accepted, never chosen
  // directly here.
  var isTermination = _iqProfileData && /termination/i.test(_iqProfileData.inquiryType || '');
  openModal(
    '<div class="modal-header"><div class="modal-title">'+(isLost?'Close as Unresolved':'Close as Resolved')+'</div>'+
    '<button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>'+
    '<div class="modal-body">'+
      (isTermination && !isLost ? '<div class="form-hint" style="margin-bottom:10px;">This will be recorded as <strong>Retracted</strong> — the termination did not go through.</div>' : '')+
      (isTermination && isLost ? '<div class="form-hint" style="margin-bottom:10px;">This will be recorded as <strong>Accepted</strong> — the account did lose this VA.</div>' : '')+
      (isLost && !isTermination ? '<div class="form-group"><label class="form-label">Reason <span class="required">*</span></label>'+
        '<select class="form-select" id="iqCloseLostReason"><option value="">Select reason…</option>'+lostReasons+'</select></div>' : '')+
      '<div class="form-group"><label class="form-label">Closing Notes</label>'+
        '<textarea class="form-textarea" id="iqCloseNote" style="min-height:72px;"></textarea></div>'+
    '</div>'+
    '<div class="modal-footer">'+
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>'+
      '<button class="btn '+(isLost?'btn-danger':'btn-primary')+'" onclick="iqDoCloseModal(\''+_esc(inquiryId)+'\',\''+outcome+'\')">Confirm</button>'+
    '</div>'
  );
}

function iqDoCloseModal(inquiryId, outcome) {
  var note = ((document.getElementById('iqCloseNote')||{}).value||'').trim();
  var lostR = ((document.getElementById('iqCloseLostReason')||{}).value||'');
  var isLost = outcome === 'lost';
  var isTermination = _iqProfileData && /termination/i.test(_iqProfileData.inquiryType || '');
  var payload;
  if (isTermination) {
    var termOutcome = isLost ? 'Accepted' : 'Retracted';
    payload = { terminationOutcome: termOutcome, resolution: note };
  } else {
    if (isLost && !lostR) { showToast('Please select a reason.','error'); return; }
    payload = { status: isLost ? 'Closed - Unresolved' : 'Closed - Resolved', resolution: note, lostReason: lostR };
  }
  google.script.run
    .withSuccessHandler(function(res){
      if (!res||!res.success){ showToast((res&&res.error)||'Failed.','error'); return; }
      showToast('Ticket closed.','success'); iqLoadAll(); closeModal();
    })
    .withFailureHandler(function(e){ showToast(e.message,'error'); })
    .updateInq(inquiryId, payload);
}

function iqRender() {
  var tbody = document.getElementById('iqTbody'); if (!tbody) return;
  var start = (_iqPageNum - 1) * _iqPageSize;
  var rows  = _iqFiltered.slice(start, start + _iqPageSize);

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><svg width="36" height="36" viewBox="0 0 20 20" fill="none" style="opacity:.2;"><path d="M3 4h14a1 1 0 011 1v9a1 1 0 01-1 1H3a1 1 0 01-1-1V5a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5"/><path d="M2 4l8 7 8-7" stroke="currentColor" stroke-width="1.5"/></svg><h3>No inquiries found</h3><p>Adjust filters or create a new inquiry.</p></div></td></tr>';
    return;
  }

  tbody.innerHTML = rows.map(function(r) {
    var badgeCls = IQ_STATUS_BADGE[r.status] || 'badge-inactive';
    var priColor = IQ_PRIORITY_COLOR[r.priority] || '#94a3b8';
    var needsResp2 = r.status === 'Needs Response';
    return '<tr style="cursor:pointer;'+(needsResp2?'background:#fef2f2;':'')+' " onclick="iqOpenTicketModal(\'' + _esc(r.inquiryId) + '\')">' +
      '<td><div style="font-weight:600;font-size:13px;">'+_esc(r.subject||'—')+'</div></td>' +
      '<td style="font-size:12.5px;">'+_esc(r.inquiryType||'—')+'</td>' +
      '<td><span style="display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:'+priColor+';">'+
        '<span style="width:7px;height:7px;border-radius:50%;background:'+priColor+';flex-shrink:0;"></span>'+_esc(r.priority||'—')+
      '</span></td>' +
      '<td style="font-size:12.5px;">'+_esc(r.customerName||'—')+(r.accountName?'<div style="font-size:11px;color:var(--text-muted);">'+_esc(r.accountName)+'</div>':'')+'</td>' +
      '<td style="font-size:12.5px;">'+_esc(r.relatedVADepartment||'—')+'</td>' +
      '<td style="font-size:12.5px;">'+_iqAssignedLabel(r.assignedTo)+'</td>' +
      '<td><span class="badge '+badgeCls+'">'+_esc(r.status)+'</span></td>' +
      '<td class="muted">'+_fdate(r.createdAt)+'</td>' +
      '<td onclick="event.stopPropagation()">'+(r.ticketReportLink?'<a href="'+_esc(r.ticketReportLink)+'" target="_blank" rel="noopener" style="font-size:12px;color:var(--accent);">Open →</a>':'<span class="muted" style="font-size:12px;">—</span>')+'</td>' +
      '<td onclick="event.stopPropagation()"><button class="btn btn-ghost btn-icon" onclick="navigate(\'inquiry-profile\',\''+_esc(r.inquiryId)+'\')" title="View"><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M1 7s2.5-5 6-5 6 5 6 5-2.5 5-6 5-6-5-6-5z" stroke="currentColor" stroke-width="1.4"/><circle cx="7" cy="7" r="2" stroke="currentColor" stroke-width="1.4"/></svg></button></td>' +
    '</tr>';
  }).join('');

  // Pager
  var el = document.getElementById('iqPager'); if (!el) return;
  var total=_iqFiltered.length, pages=Math.max(1,Math.ceil(total/_iqPageSize));
  var s=(_iqPageNum-1)*_iqPageSize+1, e=Math.min(_iqPageNum*_iqPageSize,total);
  var btns='';
  for(var pg=1;pg<=pages;pg++){
    if(pg===1||pg===pages||Math.abs(pg-_iqPageNum)<=1) btns+='<button class="page-btn'+(pg===_iqPageNum?' active':'')+'" onclick="_iqGoPage('+pg+')">'+pg+'</button>';
    else if(Math.abs(pg-_iqPageNum)===2) btns+='<span style="padding:0 4px;color:var(--text-muted)">…</span>';
  }
  el.innerHTML='<span>Showing '+(total?s:0)+'–'+e+' of '+total+'</span><div class="page-btns"><button class="page-btn" onclick="_iqGoPage('+(_iqPageNum-1)+')"'+(_iqPageNum===1?' disabled':'')+'>‹</button>'+btns+'<button class="page-btn" onclick="_iqGoPage('+(_iqPageNum+1)+')"'+(_iqPageNum>=pages?' disabled':'')+'>›</button></div>';
}
