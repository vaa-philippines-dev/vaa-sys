function iqUpdateAddFormSender() {
  var stype   = (document.getElementById('iq_msgSenderType')||{}).value||'client';
  var mtype   = document.getElementById('iq_msgType');
  var ta      = document.getElementById('iq_firstMessage');
  if (stype === 'client') {
    if (mtype) mtype.value = 'email';
    if (ta) ta.placeholder = 'Paste or type the email received from the client…';
  } else {
    if (mtype) mtype.value = 'note';
    if (ta) ta.placeholder = 'Type the first internal note or response…';
  }
}

function iqOpenSettings() {
  // Show a modal with two settings sections: Inquiry Types and Lost Reasons
  // Managed identically to the main settings page but scoped to these two categories
  var appSettings = CMS.settings || {};
  function renderSettingsList(category, items) {
    var rows = items.map(function(item, idx) {
      return '<div class="iq-setting-row" data-key="' + _esc(item.value) + '">' +
        '<span style="flex:1;font-size:13px;">' + _esc(item.label) + '</span>' +
        '<div class="flex gap-1">' +
          '<button class="btn btn-ghost btn-icon btn-sm" title="Move up" '+'data-cat="'+_esc(category)+'" data-val="'+_esc(item.value)+'" data-dir="-1" onclick="iqSettingMoveBtn(this)" style="font-size:14px;">↑</button>' +
          '<button class="btn btn-ghost btn-icon btn-sm" title="Move down" '+'data-cat="'+_esc(category)+'" data-val="'+_esc(item.value)+'" data-dir="1" onclick="iqSettingMoveBtn(this)" style="font-size:14px;">↓</button>' +
          '<button class="btn btn-ghost btn-icon btn-sm" title="Delete" '+'data-cat="'+_esc(category)+'" data-val="'+_esc(item.value)+'" onclick="iqSettingDeleteBtn(this)" style="color:var(--danger);font-size:14px;">×</button>' +
        '</div>' +
      '</div>';
    }).join('');
    return '<div id="iqSet_' + category + '">' +
      (rows || '<div style="color:var(--text-muted);font-size:13px;padding:8px 0;">No items yet.</div>') +
    '</div>' +
    '<div style="display:flex;gap:8px;margin-top:8px;">' +
      '<input type="text" id="iqSetNew_'+category+'" class="form-input" style="flex:1;" placeholder="Add new…" data-cat="'+_esc(category)+'" onkeydown="if(event.key===\'Enter\')iqSettingAddInput(this)" />' +
      '<button class="btn btn-secondary btn-sm" data-cat="'+_esc(category)+'" onclick="iqSettingAddBtn(this)">+ Add</button>' +
    '</div>';
  }

  var typeItems   = appSettings.InquiryType       || [];
  var lostItems   = appSettings.InquiryLostReason  || [];

  openModal(
    '<div class="modal-header">' +
      '<div class="modal-title">Inquiry Settings</div>' +
      '<button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button>' +
    '</div>' +
    '<div class="modal-body" style="max-height:70vh;overflow-y:auto;">' +
      '<div class="form-section-label">Inquiry Types</div>' +
      '<div style="margin-bottom:20px;">' + renderSettingsList('InquiryType', typeItems) + '</div>' +
      '<div class="form-section-label">Unresolved Reasons</div>' +
      '<div>' + renderSettingsList('InquiryLostReason', lostItems) + '</div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-primary" onclick="closeModal()">Done</button>' +
    '</div>'
  );
}

function iqSettingAddBtn(btn)    { var cat=btn.dataset.cat; var inp=document.getElementById('iqSetNew_'+cat); if(!inp||!inp.value.trim())return; iqSettingAdd(cat, inp.value.trim()); inp.value=''; }
function iqSettingAddInput(inp)  { if(!inp.value.trim())return; iqSettingAdd(inp.dataset.cat, inp.value.trim()); inp.value=''; }
function iqSettingDeleteBtn(btn) { iqSettingDelete(btn.dataset.cat, btn.dataset.val); }
function iqSettingMoveBtn(btn)   { iqSettingMove(btn.dataset.cat, btn.dataset.val, parseInt(btn.dataset.dir)||0); }


function iqSettingAdd(category, val) {
  if (!val) return;
  var payload = { category: category, value: val, label: val, sortOrder: 99, isActive: true };
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { showToast((res && res.error) || 'Failed.', 'error'); return; }
      showToast('"' + val + '" added.', 'success');
      // Refresh settings in memory then reopen
      google.script.run
        .withSuccessHandler(function(r) { if(r&&r.success){CMS.settings=r.data;} iqOpenSettings(); })
        .getSettingsMap();
    })
    .withFailureHandler(function(err) { showToast(err.message, 'error'); })
    .createSetting(payload);
}

function iqSettingDelete(category, value) {
  // Find the settingId by matching category+value in the loaded settings
  var allSettings = CMS.rawSettings || [];
  var found = allSettings.find(function(s){ return s.category === category && s.value === value; });
  if (!found) { showToast('Setting not found.', 'error'); return; }
  if (!confirm('Delete "' + value + '"?')) return;
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { showToast((res && res.error) || 'Failed.', 'error'); return; }
      showToast('Deleted.', 'success');
      google.script.run
        .withSuccessHandler(function(r) { if(r&&r.success){CMS.settings=r.data;} iqOpenSettings(); })
        .getSettingsMap();
    })
    .withFailureHandler(function(err){ showToast(err.message,'error'); })
    .deleteSetting(found.settingId);
}

function iqSettingMove(category, value, dir) {
  var allSettings = CMS.rawSettings || [];
  var found = allSettings.find(function(s){ return s.category === category && s.value === value; });
  if (!found) return;
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) return;
      google.script.run
        .withSuccessHandler(function(r) { if(r&&r.success){CMS.settings=r.data;} iqOpenSettings(); })
        .getSettingsMap();
    })
    .reorderSettings(found.settingId, dir);
}


// ── Customer combobox for the New Inquiry form — same pattern used
// elsewhere: the hidden <select> stays the real source of truth (still
// what iqFormLoadAccounts/submit read), this just drives it.
function iqCustComboShow() {
  iqCustComboFilter(document.getElementById('iq_customerSearch'));
}
function iqCustComboToggle() {
  var list = document.getElementById('iqCustComboList');
  if (!list) return;
  if (list.style.display === 'none' || !list.style.display) iqCustComboShow();
  else list.style.display = 'none';
}
function iqCustComboFilter(inputEl) {
  if (!inputEl) return;
  var q = (inputEl.value||'').trim().toLowerCase();
  var matches = (CMS.customers||[])
    .filter(function(c){ return !q || (c.customerName||'').toLowerCase().indexOf(q) !== -1; })
    .sort(function(a,b){ return (a.customerName||'').localeCompare(b.customerName||''); });
  var list = document.getElementById('iqCustComboList'); if (!list) return;
  list.innerHTML = matches.length
    ? matches.slice(0,50).map(function(c){
        return '<div class="combo-option" style="padding:8px 12px;cursor:pointer;font-size:13px;" data-id="'+_esc(c.customerId)+'" data-name="'+_esc(c.customerName)+'" ' +
          'onmousedown="event.preventDefault();iqCustComboPick(this.dataset.id,this.dataset.name)" ' +
          'onmouseover="this.style.background=\'var(--surface-2)\'" onmouseout="this.style.background=\'\'">'+_esc(c.customerName)+'</div>';
      }).join('')
    : '<div style="padding:8px 12px;color:var(--text-muted);font-size:12.5px;">No matches</div>';
  list.style.display = '';
}
function iqCustComboPick(customerId, customerName) {
  var input = document.getElementById('iq_customerSearch');
  var list  = document.getElementById('iqCustComboList');
  var hiddenSel = document.getElementById('iq_customer');
  if (input) input.value = customerName;
  if (list)  list.style.display = 'none';
  if (hiddenSel) { hiddenSel.value = customerId; iqFormLoadAccounts(); }
}
document.addEventListener('click', function(e) {
  var iqList = document.getElementById('iqCustComboList');
  if (iqList && iqList.style.display !== 'none' && !e.target.closest('#iq_customerSearch') && !e.target.closest('#iqCustComboList')) {
    iqList.style.display = 'none';
  }
});

function iqFormLoadAccounts() {
  var custId    = (document.getElementById('iq_customer')||{}).value;
  var clientSel = document.getElementById('iq_client');
  if (!clientSel) return;
  if (!custId) {
    clientSel.innerHTML = '<option value="">Select customer first…</option>';
    _iqClearContactFields();
    return;
  }
  clientSel.innerHTML = '<option value="">Loading…</option>';

  // Also populate Assigned To from customer's specialist
  var cust = (CMS.customers||[]).find(function(cr){ return cr.customerId === custId; });
  if (cust && cust.assignedSpecialist) {
    var assignedSel = document.getElementById('iq_assignedTo');
    if (assignedSel) {
      // Find option matching email
      var opts = assignedSel.options;
      for (var i=0; i<opts.length; i++) {
        if (opts[i].value === cust.assignedSpecialist) { assignedSel.value = cust.assignedSpecialist; break; }
      }
    }
  }

  google.script.run
    .withSuccessHandler(function(res){
      var accounts = (res&&res.success) ? res.data : [];
      clientSel.innerHTML = '<option value="">— None —</option>' +
        accounts.map(function(a){
          return '<option value="'+_esc(a.clientId)+'">'+_esc(a.companyName)+(a.accountName?' — '+_esc(a.accountName):'')+'</option>';
        }).join('');
      // Store accounts data for contact auto-fill
      window._iqAccountsCache = accounts;
      // Enable assignedTo once a customer is selected
      var assignedEl = document.getElementById('iq_assignedTo');
      if (assignedEl) { assignedEl.disabled = false; assignedEl.style.background = ''; }
    })
    .withFailureHandler(function(){ clientSel.innerHTML='<option value="">Error</option>'; })
    .getClients({ customerId: custId });
}

function iqFormLoadContactFromAccount() {
  var clientId  = (document.getElementById('iq_client')||{}).value;
  var accounts  = window._iqAccountsCache || [];
  var acct      = accounts.find(function(a){ return a.clientId === clientId; });
  if (!acct) { _iqClearContactFields(); return; }
  // Auto-fill primary contact fields from the selected account
  var nameEl  = document.getElementById('iq_contactName');
  var emailEl = document.getElementById('iq_contactEmail');
  // Enable contact fields and fill from account's primary contact
  if (nameEl) {
    nameEl.disabled = false; nameEl.style.background = '';
    if (!nameEl.value && acct.primaryContact) nameEl.value = acct.primaryContact;
  }
  if (emailEl) {
    emailEl.disabled = false; emailEl.style.background = '';
    if (!emailEl.value && acct.primaryEmail) emailEl.value = acct.primaryEmail;
  }
  iqLoadVAsForAccount(clientId);
}

// Populates the Related VA dropdown with this account's active VA
// connections, so a concern can optionally be tied to a specific VA.
function iqLoadVAsForAccount(clientId) {
  var sel = document.getElementById('iq_relatedVA'); if (!sel) return;
  var listEl = document.getElementById('iq_relatedVAList');
  sel.disabled = true;
  sel.innerHTML = '<option value="">Loading…</option>';
  if (listEl) listEl.innerHTML = 'Loading…';
  google.script.run
    .withSuccessHandler(function(res) {
      var conns = (res && res.success) ? (res.data||[]).filter(function(c){ return c.clientId === clientId; }) : [];
      sel.disabled = false;
      sel.style.background = '';
      if (!conns.length) {
        sel.innerHTML = '<option value="">No active VAs on this account</option>';
        if (listEl) listEl.innerHTML = 'No active VAs on this account.';
        return;
      }
      sel.innerHTML = '<option value="">— Not specific to a VA —</option>' +
        conns.map(function(c){ return '<option value="'+_esc(c.vaId)+'" data-vaname="'+_esc(c.vaName)+'">'+_esc(c.vaName)+'</option>'; }).join('');
      if (listEl) {
        listEl.innerHTML = conns.map(function(c) {
          return '<label style="display:flex;align-items:center;gap:7px;cursor:pointer;padding:3px 0;color:var(--text-primary);"><input type="checkbox" class="iq-related-va-cb" value="'+_esc(c.vaId)+'" data-vaname="'+_esc(c.vaName)+'" onchange="iqUpdateDepartmentVisibility()" style="width:14px;height:14px;accent-color:var(--accent);" /> '+_esc(c.vaName)+'</label>';
        }).join('');
      }
      iqUpdateDepartmentVisibility();
    })
    .withFailureHandler(function() {
      sel.disabled = false;
      sel.innerHTML = '<option value="">— Not specific to a VA —</option>';
      if (listEl) listEl.innerHTML = 'Could not load VAs for this account.';
    })
    .getActiveVAConnectionList({ all: true });
}

function _iqClearContactFields() {
  var nameEl    = document.getElementById('iq_contactName');
  var emailEl   = document.getElementById('iq_contactEmail');
  var assignedEl= document.getElementById('iq_assignedTo');
  if (nameEl)    { nameEl.value  = ''; nameEl.disabled  = true;  nameEl.style.background  = 'var(--surface-2)'; }
  if (emailEl)   { emailEl.value = ''; emailEl.disabled = true;  emailEl.style.background = 'var(--surface-2)'; }
  if (assignedEl){ assignedEl.value = ''; assignedEl.disabled = true; assignedEl.style.background = 'var(--surface-2)'; }
  var vaEl = document.getElementById('iq_relatedVA');
  if (vaEl) { vaEl.innerHTML = '<option value="">— Select account first —</option>'; vaEl.disabled = true; vaEl.style.background = 'var(--surface-2)'; }
  window._iqAccountsCache = [];
}

function iqDoCreate() {
  var subject  = ((document.getElementById('iq_subject')||{}).value||'').trim();
  var type     = (document.getElementById('iq_type')||{}).value||'';
  var custId   = (document.getElementById('iq_customer')||{}).value||'';
  var clientId = (document.getElementById('iq_client')||{}).value||'';
  var errEl    = document.getElementById('iqFormErr');
  if (!subject)  { if(errEl) errEl.textContent='Subject is required.';  return; }
  if (!type)     { if(errEl) errEl.textContent='Type is required.';     return; }
  if (!custId)   { if(errEl) errEl.textContent='Customer is required.'; return; }
  if (!clientId) { if(errEl) errEl.textContent='Account is required.';  return; }
  var isTermination = /termination/i.test(type);
  if (isTermination) {
    var connVal = (document.getElementById('iq_relatedConnection')||{}).value||'';
    var causeVal = (document.getElementById('iq_terminationCause')||{}).value||'';
    if (!connVal)  { if(errEl) errEl.textContent='VA Connection is required for a Termination ticket.'; return; }
    if (!causeVal) { if(errEl) errEl.textContent='Termination Cause is required for a Termination ticket.'; return; }
  }
  if (errEl) errEl.textContent = '';

  // Multiple Related VAs (non-Termination only) — either one ticket per
  // VA, or a single ticket covering all of them, per the checkbox.
  var checkedVACbs = isTermination ? [] : Array.prototype.filter.call(document.querySelectorAll('.iq-related-va-cb'), function(el){ return el.checked; });
  var oneTicketPerVA = !!(document.getElementById('iq_oneTicketPerVA')||{}).checked;

  var basePayload = {
    subject:        subject,
    inquiryType:    type,
    priority:       (document.getElementById('iq_priority')||{}).value||'Medium',
    customerId:     custId,
    clientId:       clientId,
    contactName:    (document.getElementById('iq_contactName')||{}).value||'',
    contactEmail:   (document.getElementById('iq_contactEmail')||{}).value||'',
    assignedTo:     (document.getElementById('iq_assignedTo')||{}).value||'',
    notes:          (document.getElementById('iq_notes')||{}).value||'',
    ticketReportLink: ((document.getElementById('iq_reportLink')||{}).value||'').trim(),
    entryDate:      (document.getElementById('iq_date')||{}).value||'',
    firstMessage:   (document.getElementById('iq_firstMessage')||{}).value||'',
    firstMsgSender: (document.getElementById('iq_msgSenderType')||{}).value||'client',
    firstMsgType:   (document.getElementById('iq_msgType')||{}).value||'email',
    relatedConnectionId: (document.getElementById('iq_relatedConnection')||{}).value||'',
    terminationCause:    (document.getElementById('iq_terminationCause')||{}).value||'',
    department:          (document.getElementById('iq_department')||{}).value||''
  };

  var btn = document.getElementById('iqSubmitBtn');
  if (btn) { btn.disabled=true; btn.textContent='Creating…'; }

  if (isTermination || !checkedVACbs.length) {
    // Termination (single VA, unchanged) or no VA selected at all.
    basePayload.relatedVAId   = (document.getElementById('iq_relatedVA')||{}).value||'';
    basePayload.relatedVAName = (function(){ var el=document.getElementById('iq_relatedVA'); return el&&el.selectedOptions&&el.selectedOptions[0] ? (el.selectedOptions[0].dataset.vaname||'') : ''; })();
    _iqCreateOne(basePayload, btn, errEl);
  } else if (oneTicketPerVA) {
    // One ticket per selected VA, created in sequence.
    var queue = checkedVACbs.map(function(cb){ return { id: cb.value, name: cb.dataset.vaname||'' }; });
    var createdIds = [];
    (function createNext(i) {
      if (i >= queue.length) {
        showToast(createdIds.length + ' inquiry ticket(s) created.', 'success');
        iqLoadAll();
        if (createdIds.length) iqOpenTicketModal(createdIds[createdIds.length-1]);
        return;
      }
      var payload = Object.assign({}, basePayload, { relatedVAId: queue[i].id, relatedVAName: queue[i].name });
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res || !res.success) { if(errEl) errEl.textContent=(res&&res.error)||('Failed on '+queue[i].name+'.'); if(btn){btn.disabled=false;btn.textContent='Create Inquiry';} return; }
          createdIds.push(res.inquiryId);
          createNext(i+1);
        })
        .withFailureHandler(function(err) { if(errEl) errEl.textContent=err.message; if(btn){btn.disabled=false;btn.textContent='Create Inquiry';} })
        .createInq(payload);
    })(0);
  } else {
    // A single ticket covering every selected VA.
    basePayload.relatedVAIds   = checkedVACbs.map(function(cb){ return cb.value; });
    basePayload.relatedVANames = checkedVACbs.map(function(cb){ return cb.dataset.vaname||''; });
    _iqCreateOne(basePayload, btn, errEl);
  }
}
function _iqCreateOne(payload, btn, errEl) {
  google.script.run
    .withSuccessHandler(function(res){
      if (!res||!res.success){ if(errEl) errEl.textContent=(res&&res.error)||'Failed.'; if(btn){btn.disabled=false;btn.textContent='Create Inquiry';} return; }
      showToast('Inquiry created.','success');
      iqLoadAll();
      iqOpenTicketModal(res.inquiryId);
    })
    .withFailureHandler(function(err){ if(errEl) errEl.textContent=err.message; if(btn){btn.disabled=false;btn.textContent='Create Inquiry';} })
    .createInq(payload);
}

var _iqProfileData = null;

function _renderInquiryProfile(container, inquiryId) {
  container.innerHTML = '<div class="loading-screen" style="height:300px;"><div class="loader-ring"></div><p>Loading inquiry…</p></div>';
  google.script.run
    .withSuccessHandler(function(res){
      if (!res||!res.success){ showToast((res&&res.error)||'Not found.','error'); navigate('inquiries'); return; }
      _iqProfileData = res.data;
      _showIqProfile(res.data);
    })
    .withFailureHandler(function(err){ showToast(err.message,'error'); navigate('inquiries'); })
    .getInquiry(inquiryId);
}

    : '';
  var threadHtml = initialPageEntry + ((iq.thread && iq.thread.length)

    '<div class="section-card" style="margin-bottom:14px;">' +
      '<div style="padding:20px 24px;">' +
        '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;">' +
          '<div style="flex:1;min-width:0;">' +
            '<div style="font-size:20px;font-weight:800;color:var(--text-primary);margin-bottom:8px;">'+_esc(iq.subject||'—')+'</div>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">' +

              '<span style="display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:'+priColor+';">'+
                '<span style="width:7px;height:7px;border-radius:50%;background:'+priColor+';"></span>'+_esc(iq.priority||'—')+
              '</span>' +

              (iq.accountName  ? '<span class="profile-meta-chip">'+_esc(iq.accountName)+'</span>'  : '') +
            '</div>' +
          '</div>' +
          '<div class="flex gap-2" style="flex-shrink:0;">'+actions+'</div>' +
        '</div>' +
        '<div class="profile-meta-row profile-meta-row-sm" style="margin-top:14px;">' +

function iqOpenClose(inquiryId, outcome) {
  var appSettings = CMS.settings || {};
  var lostReasons = (appSettings.InquiryLostReason || []).map(function(r){
    return '<option value="'+_esc(r.value)+'">'+_esc(r.label)+'</option>';
  }).join('');

  var isLost = outcome === 'lost';
  openModal(
    '<div class="modal-header"><div class="modal-title">'+(isLost ? 'Close as Unresolved' : 'Close as Resolved')+'</div>'+
    '<button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>'+
    '<div class="modal-body">'+
      (isLost
        ? '<div class="form-group"><label class="form-label">Reason for Closing Unresolved <span class="required">*</span></label>'+
            '<select class="form-select" id="iqCloseLostReason"><option value="">Select reason…</option>'+lostReasons+'</select></div>'
        : '') +
      '<div class="form-group"><label class="form-label">Resolution / Closing Notes'+(isLost?' <span style="color:var(--text-muted);font-weight:400;">(optional)</span>':'')+'</label>'+
        '<textarea class="form-textarea" id="iqCloseNote" style="min-height:72px;" placeholder="'+(isLost?'Describe why this could not be resolved…':'Describe how the inquiry was resolved…')+'"></textarea></div>'+
    '</div>'+
    '<div class="modal-footer">'+
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>'+
      '<button class="btn '+(isLost?'btn-danger':'btn-primary')+'" onclick="iqDoClose(\''+_esc(inquiryId)+'\',\''+outcome+'\')">Confirm</button>'+
    '</div>'
  );
}

function iqDoClose(inquiryId, outcome) {
  var reason = ((document.getElementById('iqCloseLostReason')||{}).value||'');
  var note   = ((document.getElementById('iqCloseNote')||{}).value||'').trim();
  if (outcome === 'lost' && !reason) { showToast('Please select a reason.','error'); return; }
  closeModal();
  google.script.run
    .withSuccessHandler(function(res){
      if (!res||!res.success){ showToast((res&&res.error)||'Failed.','error'); return; }
      showToast('Inquiry closed.', outcome==='won'?'success':'warning');
      _renderInquiryProfile(document.getElementById('pageView'), inquiryId);
    })
    .withFailureHandler(function(err){ showToast(err.message,'error'); })
    .closeInq(inquiryId, outcome, reason, note);
}

function iqDoReopen(inquiryId) {
  google.script.run
    .withSuccessHandler(function(res){
      if (!res||!res.success){ showToast((res&&res.error)||'Failed.','error'); return; }
      showToast('Inquiry reopened.','success');
      _renderInquiryProfile(document.getElementById('pageView'), inquiryId);
    })
    .withFailureHandler(function(err){ showToast(err.message,'error'); })
    .reopenInq(inquiryId);
}

function iqPostUpdate(inquiryId) {
  var inp  = document.getElementById('iqReplyInput');
  var text = inp ? inp.value.trim() : '';
  var sender = ((document.getElementById('iqPageSenderType')||{}).value||'cs');
  var mtype  = ((document.getElementById('iqPageMsgType')||{}).value||'note');
  if (!text) return;
  inp.value = ''; inp.disabled = true;
  google.script.run
    .withSuccessHandler(function(res){
      inp.disabled = false;
      if (!res||!res.success){ showToast((res&&res.error)||'Failed.','error'); return; }
      _renderInquiryProfile(document.getElementById('pageView'), inquiryId);
    })
    .withFailureHandler(function(err){ inp.disabled=false; showToast(err.message,'error'); })
    .addInqUpdateV2(inquiryId, { content:text, senderType:sender, messageType:mtype });
}



// Per the request — when the left navigation is collapsed (icons only),
// hovering an icon shows a tooltip with that module's name. Delegated at the
// document level so it covers every nav item, including any added later, and
// rendered in a fixed-position element so the sidebar can't clip it.
(function initCollapsedNavTooltips() {
  var tipEl = null;
  function tip() {
    if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'nav-collapsed-tooltip'; document.body.appendChild(tipEl); }
    return tipEl;
  }
  function labelFor(item) {
    var l = item.querySelector('.nav-label');
    var t = '';
    if (l) {
      var clone = l.cloneNode(true);
      var badges = clone.querySelectorAll('[class*="badge"]');
      for (var i = 0; i < badges.length; i++) badges[i].parentNode.removeChild(badges[i]);
      t = (clone.textContent || '').replace(/\s+/g, ' ').trim();
    }
    return t || item.getAttribute('aria-label') || item.getAttribute('title') || '';
  }
  function hide() { if (tipEl) tipEl.classList.remove('show'); }
  document.addEventListener('mouseover', function(e) {
    var item = e.target && e.target.closest ? e.target.closest('.sidebar.collapsed .nav-item') : null;
    if (!item) return;
    var text = labelFor(item); if (!text) return;
    var t = tip(); t.textContent = text;
    var r = item.getBoundingClientRect();
    t.style.left = (r.right + 10) + 'px';
    t.style.top = (r.top + r.height / 2) + 'px';
    t.classList.add('show');
  });
  document.addEventListener('mouseout', function(e) {
    var item = e.target && e.target.closest ? e.target.closest('.sidebar.collapsed .nav-item') : null;
    if (!item) return;
    if (e.relatedTarget && item.contains(e.relatedTarget)) return;
    hide();
  });
  document.addEventListener('click', hide, true);
  window.addEventListener('scroll', hide, true);
})();
</script>
