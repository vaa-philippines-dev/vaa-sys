.cp-open-num { font-size: 24px; font-weight: 900; line-height: 1; }
.cp-open-sr .cp-open-num { color: #92400e; }
.cp-open-iq .cp-open-num { color: #1d4ed8; }
.cp-open-lbl { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 3px; color: var(--text-muted); }

/* Specialist history */
.cp-hist { display: flex; flex-direction: column; gap: 6px; }
.cp-hist-row {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 6px 8px;
  background: var(--surface); border-radius: var(--radius-sm);
  border: 1px solid var(--border-light);
  font-size: 12px;
}

/* Health section accent */
.cp-health-section { background: transparent; }


/* Clickable table row */
tr.table-row-clickable:hover td { background: var(--surface-2); }


/* ══════════════════════════════════════════
   REQUEST DETAIL MODAL (single-view layout)
══════════════════════════════════════════ */
.rdr-body { padding: 0 !important; max-height: 85vh; overflow-y: auto; flex: 1; min-height: 0; }

/* Hero bar */
.rdr-hero {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 22px 14px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.rdr-hero-left  { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.rdr-hero-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.rdr-customer   { font-size: 17px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.2px; }
.rdr-sep        { color: var(--text-muted); font-weight: 400; }
.rdr-tags       { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.rdr-type-chip  { display: inline-block; padding: 2px 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.rdr-started    { margin-top: 4px; font-size: 12.5px; }
.rdr-meta-row   { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); }
.rdr-meta-row .rdr-meta-divider { color: var(--border); }
.rdr-meta-row .rdr-meta-label { font-weight: 700; text-transform: uppercase; letter-spacing: .03em; font-size: 10px; color: var(--text-muted); margin-right: 4px; }

/* Two-column layout — a single scroll container (.rdr-body above) holds
   everything; nothing in here scrolls independently anymore, since that
   was the actual cause of multiple simultaneous scrollbars. */
.rdr-layout {
  display: grid;
  grid-template-columns: 1.2fr 1fr 260px;
  gap: 18px;
  align-items: stretch;
  padding: 18px 20px;
}
.rdr-main {
  min-width: 0;
}
.rdr-notes-col {
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.rdr-notes-col .rdr-section {
  display: flex;
  flex-direction: column;
  flex: 1;
}
.rdr-sidebar {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
  position: sticky;
  top: 0;
}

/* Department / Service accent bar */
.rdr-dept-accent {
  display: flex;
  align-items: stretch;
  gap: 0;
  background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(139,92,246,0.08));
  border: 1.5px solid rgba(99,102,241,0.2);
  border-radius: var(--radius-md);
  margin-bottom: 16px;
  overflow: hidden;
}
.rdr-dept-item {
  flex: 1;
  padding: 10px 16px;
}
.rdr-dept-divider { width: 1px; background: rgba(99,102,241,0.15); }
.rdr-payment-hover:hover .rdr-payment-edit-icon {
  opacity: 1 !important;
}
.rdr-dept-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: #6366f1;
  margin-bottom: 3px;
}
.rdr-dept-val {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
}

/* Sections inside main — lighter border, tighter padding, no background
   fill (so nested sections don't read as "boxes within boxes"). */
.rdr-section { margin-bottom: 16px; border-bottom: 1px solid var(--border-light); border-radius: 0; padding: 0 0 16px; background: transparent; }
.rdr-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.rdr-vaconn-box {
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg, 12px);
  padding: 16px;
  background: var(--surface);
}
.wf-instructions-panel {
  display: flex; align-items: center; gap: 10px;
  background: #eff6ff; border: 1px solid #bfdbfe;
  border-radius: var(--radius-md); padding: 9px 14px;
  margin: 10px 16px 4px;
}
.wf-instructions-step {
  flex-shrink: 0; font-size: 11px; font-weight: 800;
  color: #fff; background: var(--accent);
  border-radius: 10px; padding: 2px 8px;
}
.wf-instructions-label { font-size: 12.5px; font-weight: 600; color: #1e40af; }
.rdr-section-title {
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

/* VA connection cards (compact) */
.rdr-conn-card {
  background: var(--surface-2);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  margin-bottom: 8px;
}

/* Thread sidebar */
.rdr-thread-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
.rdr-thread {
  flex: 1;
  overflow-y: auto;
  padding-right: 4px;
  min-height: 0;
}
.rdr-thread .note-item { margin-bottom: 10px; }

@media (max-width: 800px) {
  .rdr-layout { grid-template-columns: 1fr; }
  .rdr-main   { border-right: none; border-bottom: 1px solid var(--border-light); max-height: none; }
  .rdr-sidebar{ max-height: 300px; }
}


/* ── Request Detail full-page layout variants */
.rdr-layout-page {
  min-height: calc(100vh - 280px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}
.rdr-main-page {
  max-height: none;
  border-right: 1px solid var(--border-light);
}
.rdr-sidebar-page {
  max-height: calc(100vh - 280px);
  overflow-y: auto;
  position: sticky;
  top: 0;
}


/* ─── Customer Log section ──────────────── */
.cp-log-section {
  border-top: 1px solid var(--border-light);
  background: var(--surface-2);
}
.clog-list { display: flex; flex-direction: column; gap: 0; }
.clog-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border-light);
}
.clog-row:last-child { border-bottom: none; }
.clog-icon {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  flex-shrink: 0;
}
.clog-body  { flex: 1; min-width: 0; }
.clog-label { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.clog-sub   { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
.clog-meta  { font-size: 11px; color: var(--text-muted); margin-top: 2px; }


/* ══════════════════════════════════════════
   VA CONNECTION MODAL
══════════════════════════════════════════ */
.vaconn-modal-body { padding: 0 !important; max-height: 82vh; overflow-y: auto; }

/* Hero */
.vaconn-hero {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 20px 14px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border-light);
  flex-wrap: wrap;
}
.vaconn-hero-left  { flex: 1; min-width: 0; }
.vaconn-hero-right { flex-shrink: 0; }

/* Hours card */
.vaconn-hours-card {
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  color: #fff;
  border-radius: var(--radius-md);
  padding: 12px 18px;
  text-align: center;
  min-width: 90px;
}
.vaconn-hours-card.vaconn-hours-req {
  background: linear-gradient(135deg, #10b981, #059669);
}
.vaconn-hours-val   { font-size: 26px; font-weight: 900; line-height: 1.1; }
.vaconn-hours-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; opacity: .85; margin-top: 2px; }
.vaconn-hours-sub   { font-size: 11px; opacity: .75; margin-top: 1px; }

/* Three-column layout: Connection Details | Timeline | Update Log */
.vaconn-layout {
  display: grid;
  grid-template-columns: 1fr 260px 280px;
  gap: 0;
  min-height: 260px;
}
.vaconn-details {
  padding: 16px 18px;
  border-right: 1px solid var(--border-light);
  overflow-y: auto;
}
.vaconn-timeline {
  padding: 16px 14px;
  border-right: 1px solid var(--border-light);
  overflow-y: auto;
  max-height: 420px;
}
.vaconn-thread {
  padding: 16px 14px 0;
  display: flex;
  flex-direction: column;
  max-height: 420px;
  overflow: hidden;
}
.vaconn-thread .rdr-thread { flex: 1; overflow-y: auto; min-height: 0; }

@media (max-width: 900px) {
  .vaconn-layout { grid-template-columns: 1fr; }
  .vaconn-details, .vaconn-timeline { border-right: none; border-bottom: 1px solid var(--border-light); }
}


/* ══════════════════════════════════════════
   ACCOUNT PROFILE — OVERVIEW GRID (3-col)
   Explicit named grid areas — guarantees column 1 = details/contacts,
   column 2 = Active VA Connections, column 3 = Account Documents,
   regardless of source order in the HTML.
══════════════════════════════════════════ */
.acc-overview-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 280px;
  grid-template-areas: "col1 col2 milestone";
  gap: 16px;
  align-items: start;
  width: 100%;
}
.acc-overview-col1 {
  grid-area: col1;
  display: flex; flex-direction: column; gap: 12px;
  min-width: 0; max-width: 100%;
}
.acc-overview-col2 {
  grid-area: col2;
  display: flex; flex-direction: column; gap: 12px;
  min-width: 0; max-width: 100%;
}
.acc-overview-milestone {
  grid-area: milestone;
  min-width: 0; max-width: 100%;
  position: sticky;
  top: 16px;
  max-height: calc(100vh - 32px);
  display: flex;
  flex-direction: column;
}
.acc-overview-milestone .section-card {
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 32px);
  overflow: hidden;
}
.acc-overview-milestone .section-header {
  flex-shrink: 0;
}
.acc-overview-milestone #acctMilestoneBody {
  overflow-y: auto;
  flex: 1;
}

@media (max-width: 1280px) {
  .acc-overview-grid {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas:
      "col1 col2"
      "milestone milestone";
  }
  .acc-overview-milestone {
    position: static;
    max-height: none;
  }
  .acc-overview-milestone .section-card {
    max-height: none;
  }
  .acc-overview-milestone #acctMilestoneBody {
    overflow-y: visible;
  }
}
@media (max-width: 680px) {
  .acc-overview-grid {
    grid-template-columns: 1fr;
    grid-template-areas:
      "col1"
      "col2"
      "milestone";
  }
}

/* VA connection summary card — used in Account Overview's middle column */
.vaconn-overview-card {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  min-width: 0;
  overflow-wrap: anywhere;
}


/* Customer module multi-status checkbox filter */
.cust-status-multi {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  align-items: center;
  padding: 4px 8px;
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
}


/* ══════════════════════════════════════════
   INQUIRY TICKET MODAL
══════════════════════════════════════════ */
.iq-ticket-body {
  display: flex;
  gap: 0;
  height: 70vh;
  overflow: hidden;
}
.iq-ticket-timeline {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
#iqTimelineScroll {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.iq-ticket-meta {
  width: 220px;
  flex-shrink: 0;
  padding: 16px;
  overflow-y: auto;
  background: var(--surface);
  border-right: 1px solid var(--border-light);
}
.iq-term-clearance-col {
  width: 320px;
  flex-shrink: 0;
  padding: 16px;
  overflow-y: auto;
  background: var(--surface-2);
  border-right: 1px solid var(--border-light);
}
.iq-meta-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-bottom: 12px;
  font-size: 13px;
}
.iq-meta-label {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--text-muted);
}

/* Timeline entries */
.iq-entry {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  max-width: 85%;
}
.iq-entry-right {
  align-self: flex-end;
  flex-direction: row-reverse;
}
.iq-entry-system {
  align-self: center;
  justify-content: center;
  max-width: 100%;
  padding: 4px 0;
}
.iq-entry-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 12px;
  flex-shrink: 0;
  margin-top: 2px;
}
.iq-entry-bubble {
  border-radius: var(--radius-md);
  padding: 10px 14px;
  min-width: 120px;
  border: 1px solid var(--border-light);
}
.iq-entry-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.iq-entry-name {
  font-weight: 700;
  font-size: 12.5px;
}
.iq-role-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 10px;
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: .3px;
}
.iq-entry-subtitle {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 6px;
  margin-top: -2px;
}
.iq-entry-time {
  font-size: 11px;
  color: var(--text-muted);
  margin-left: auto;
}
.iq-entry-edit-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 11px;
  padding: 2px 4px;
  border-radius: 4px;
  line-height: 1;
}
.iq-entry-edit-btn:hover { background: var(--surface-2); color: var(--accent); }

.iq-entry-content {
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-primary);
  white-space: pre-wrap;
  word-break: break-word;
}
.iq-entry-status-chip {
  font-size: 11px;
  color: var(--text-muted);
  font-style: italic;
  margin-bottom: 4px;
}

/* Message type tags */
.iq-tag {
  font-size: 10.5px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 10px;
  white-space: nowrap;
}
.iq-tag-initial  { background: #ede9fe; color: #6d28d9; }
.iq-tag-email    { background: #dbeafe; color: #1d4ed8; }
.iq-tag-whatsapp { background: #d1f7e0; color: #166534; }
.iq-tag-response { background: #d1fae5; color: #065f46; }
.iq-tag-note     { background: #fef3c7; color: #92400e; }
.iq-tag-followup { background: #fee2e2; color: #991b1b; }

/* Reply area */
.iq-reply-area {
  background: var(--surface);
}

/* Needs response row highlight */
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: .5; }
}

/* Inquiry table row — needs response */
tr[style*="background:#fef2f2"] { border-left: 3px solid #ef4444; }


/* Dashboard notification panel */
.dash-notifications {
  position: sticky;
  top: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 0;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  box-shadow: 0 1px 2px rgba(15,23,42,.03), 0 1px 10px rgba(15,23,42,.03);
}
/* Panel title bar at the very top */
.dash-notif-panel-title {
  font-family: 'DM Sans', 'Inter', sans-serif;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text-muted);
  padding: 14px 16px 8px;
}
/* Each sub-section */
.dash-notif-section {
  border-top: 1px solid var(--border-light);
  flex-shrink: 0;
}
.dash-notif-section:first-of-type { border-top: none; }

.dash-notif-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px 8px;
  cursor: pointer;
  user-select: none;
  transition: background .12s;
}
.dash-notif-section-header:hover { background: var(--surface-2); }

/* Smaller, more compact title */
.dash-notif-section-title {
  font-family: 'DM Sans', 'Inter', sans-serif;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 7px;
  letter-spacing: 0.1px;
}
/* Count badge */
.dash-notif-count-badge {
  font-family: 'DM Sans', 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--border);
  color: var(--text-muted);
  min-width: 18px;
  text-align: center;
  transition: background .15s, color .15s;
}
.dash-notif-count-badge:not(.is-zero) {
  background: #fef2f2;
  color: #dc2626;
}
.dash-notif-count-badge.is-zero { background: var(--border); color: var(--text-muted); }

/* Chevron — rotates to show open/closed state */
.dash-notif-chevron {
  font-size: 10px;
  color: var(--text-muted);
  transition: transform .2s ease;
  flex-shrink: 0;
}
.dash-notif-section:not(.collapsed) .dash-notif-chevron { transform: rotate(180deg); }

.dash-notif-section-body {
  max-height: 340px;
  overflow-y: auto;
  padding: 4px 16px 14px;
}
/* Collapsed: hide body with a smooth slide */
.dash-notif-section.collapsed .dash-notif-section-body { display: none; }

@media (max-width: 860px) {
  .dash-page[style*="grid-template-columns"] { display: block !important; }
  .dash-notifications {
    margin-top: 16px;
    position: static;
    max-height: none;
  }
  .dash-notif-section-body { max-height: 240px; }
}


/* Headcount Report — drill-down click affordances */
.hc-kpi-clickable:hover { box-shadow: 0 2px 10px rgba(0,0,0,.08); transform: translateY(-1px); transition: box-shadow .15s, transform .15s; }
.hc-row-clickable:hover { background: var(--surface-2); }
.hc-bar-clickable:hover > div:nth-child(2) { filter: brightness(1.12); }


/* ══════════════════════════════════════════
   ACCOUNT MEETINGS — pivoted matrix table
   First 2 columns frozen, horizontal scroll for offset columns
══════════════════════════════════════════ */
.mtg-pivot-wrap {
  overflow-x: auto;
  max-width: 100%;
}
.mtg-pivot-table {
  border-collapse: separate;
  border-spacing: 0;
  white-space: nowrap;
}
.mtg-pivot-table th,
.mtg-pivot-table td {
  white-space: nowrap;
}
.mtg-col-fixed {
  position: sticky;
  background: var(--surface);
  z-index: 2;
}
.mtg-col-fixed-1 {
  left: 0;
  min-width: 180px;
  max-width: 220px;
  white-space: normal;
  border-right: 1px solid var(--border);
}
.mtg-col-fixed-2 {
  left: 180px;
  min-width: 150px;
  max-width: 180px;
  white-space: normal;
  border-right: 1px solid var(--border);
}
.mtg-col-fixed-3 {
  left: 330px;
  min-width: 100px;
  max-width: 120px;
  white-space: normal;
  border-right: 1px solid var(--border);
}
.mtg-pivot-table thead .mtg-col-fixed {
  background: var(--surface-2);
  z-index: 3;
}
.mtg-pivot-table tbody tr:hover .mtg-col-fixed {
  background: var(--surface-2);
}

/* Shared inline-edit hover button (used in Playbook and Customers table) */
.pb-edit-btn {
  opacity: 0; pointer-events: none;
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 4px;
  border: 1.5px solid var(--accent); color: var(--accent);
  background: var(--accent-light); font-size: 11px; cursor: pointer;
  transition: opacity .15s, transform .15s; transform: scale(.8); padding: 0;
  flex-shrink: 0;
}
td:hover .pb-edit-btn { opacity: 1; pointer-events: auto; transform: scale(1); }

/* Guidebook slide-in panel ─────────────────────────────────────────────── */
.guidebook-overlay {
  position: fixed; inset: 0; z-index: 600;
  background: rgba(15,23,42,.35);
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease;
}
.guidebook-overlay.open { opacity: 1; pointer-events: auto; }

.guidebook-panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 520px; max-width: calc(100vw - 48px);
  background: var(--surface);
  box-shadow: -6px 0 32px rgba(15,23,42,.18);
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform .25s cubic-bezier(.4,0,.2,1);
  z-index: 601;
}
.guidebook-overlay.open .guidebook-panel { transform: translateX(0); }

.guidebook-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: linear-gradient(135deg, #3b82f611 0%, var(--surface) 60%);
