function caRender(d) {
  var body = document.getElementById('caBody'); if (!body) return;
  var monthly    = d.monthly    || {};
  var monthlyEnt = monthly[_caEntity] || {};
  var months     = d.months     || [];
  var labels     = d.monthLabels || months;
  var depts      = (d.departments || []).filter(function(x){ return x !== '(All)'; });
  var entLbl     = _caEntity === 'clients' ? 'Account' : 'Customer';
  var legacyData = d[_caEntity] || {}; // for drill-down detail

  // ── Drill-down modal — reads from the SAME month-scoped records the
  // displayed count came from (monthly[entity][ym].records), not the old
  // separate "legacy" all-time-ish structure, which caused the table to
  // show e.g. 2 while the modal listed 13 (two different date windows).
  window._caDetail = function(dept, metricKey, ym) {
    var mData = monthlyEnt[ym];
    var items = (mData && mData.records && mData.records[dept] && mData.records[dept][metricKey]) || [];
    var VT_SUBMETRIC_LABELS = { activeRegular:'Regular', activeProject:'Non-Regular', activeMixed:'Mixed' };
    var m     = CA_METRICS.find(function(x){ return x.key === metricKey; }) || { label: VT_SUBMETRIC_LABELS[metricKey] || metricKey };
    var monthLbl = mData ? mData.label : ym;
    var detailId = 'caDetailTbody_' + Date.now();
    var searchId = 'caDetailSearch_' + Date.now();

    // For the 'active' metric, add a note: records are counted based on
    // VA connection overlap with the month — so an account that was
    // Terminated *after* the month still appears here, showing it WAS
    // active during that month. The status badge makes this clear.
    var headerNote = (metricKey === 'active')
      ? '<div style="font-size:12px;color:var(--text-muted);background:var(--surface-2);border-radius:var(--radius-md);padding:8px 12px;margin-bottom:10px;">' +
          'ℹ Active = had a running VA connection during ' + _esc(monthLbl) + '. ' +
          'Accounts now Terminated or Paused still appear if they were active in this month.' +
        '</div>'
      : '';

    var isAcctView = _caEntity === 'clients';

    function buildRows(list) {
      if (!list.length) return '<tr><td colspan="' + (isAcctView ? 5 : 4) + '" style="text-align:center;padding:20px;color:var(--text-muted);">No records found.</td></tr>';
      return list.map(function(r, rowIdx) {
        var bc = 'badge badge-' + (r.status || '').toLowerCase();
        var fn = isAcctView
          ? 'cliOpenModal(\'' + _esc(r.clientId || '') + '\')'
          : 'custOpenModal(\'' + _esc(r.customerId || '') + '\')';
        return '<tr>' +
          '<td class="muted" style="text-align:center;">' + (rowIdx+1) + '</td>' +
          (isAcctView
            ? '<td class="muted">' + _esc(r.customerName || '—') + '</td>' +
              '<td><a href="#" onclick="' + fn + ';return false;" style="color:var(--accent);font-weight:600;">' + _esc(r.accountName || r.name || '—') + '</a></td>'
            : '<td><a href="#" onclick="' + fn + ';return false;" style="color:var(--accent);font-weight:600;">' + _esc(r.name || '—') + '</a></td>') +
          '<td><span class="' + bc + '">' + _esc(r.status || '—') + '</span></td>' +

        '</tr>';
      }).join('');
    }

    openModal(
      '<div class="modal-header">' +
        '<div><div class="modal-title">' + m.label + ' ' + entLbl + 's</div>' +

        '</div><button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button>' +
      '</div>' +
      '<div class="modal-body" style="max-height:65vh;overflow-y:auto;">' +
        headerNote +
        '<div style="margin-bottom:10px;">' +
          '<input id="'+searchId+'" class="form-input" type="text" placeholder="Search by name…" style="width:100%;height:32px;font-size:13px;" oninput="(function(q){var tb=document.getElementById(\''+detailId+'\');if(!tb)return;var rows=tb.querySelectorAll(\'tr\');rows.forEach(function(r){r.style.display=r.textContent.toLowerCase().indexOf(q.toLowerCase())!==-1?\'\':\' none\';});})(this.value)" />' +
        '</div>' +

          '<thead><tr><th style="width:36px;">#</th>' + (isAcctView ? '<th>Customer</th><th>Account</th>' : '<th>Name</th>') + '<th>Current Status</th><th>Status Date</th></tr></thead>' +

          : '<span class="ca-count-zero">—</span>';
        return '<td class="ca-cell' + (isLast ? ' ca-cell-current' : '') + '">' + nCell + trendEl + '</td>';
      }).join('');
      return '<tr>' +
        '<td class="ca-metric-label"' + (mColor ? ' style="color:'+mColor+';"' : '') + '>' + m.label + '</td>' +
        cells +
      '</tr>';
    }

    var colCount = months.length + 1;

    // ── Group 1: current-state snapshot (Active, [VA type breakdown], Paused, Churned, No Active VA)
    var activeRowHtml = buildRow(CA_METRICS_SNAPSHOT[0]); // 'Active' is always first

    // VA type sub-breakdown (Accounts entity only) — collapsible, sits right
    // under Active. IMPORTANT: this classifies by each VA Connection's HOURS
    // TYPE (Fixed/Flexible/Daily/'Project Based'), NOT the ConnectionType
    // field. ConnectionType defaults to 'Regular' at creation and is almost
    // never changed afterward, so grouping by it made nearly every account
    // land under "Regular" even when its actual hours arrangement was
    // project-based. HoursType is the field that's kept accurate per-connection.
    var vaTypeSection = '';
    if (_caEntity === 'clients') {
      var vtSectionId = 'vt_' + deptLabel.replace(/[^a-zA-Z0-9]/g, '_');
      var vtDefs = [
        { key:'activeRegular', label:'Regular',       color:'#3b82f6' },
        { key:'activeProject', label:'Non-Regular', color:'#8b5cf6' },
        { key:'activeMixed',   label:'Mixed',         color:'#10b981' }
      ];
      var vtRowsHtml = vtDefs.map(function(vt) {
        var vtCells = months.map(function(ym, idx) {
          var n2 = getCount(deptKey, vt.key, ym);
          var isLast2 = idx === months.length - 1;
          var cell2 = n2 > 0
            ? '<a href="#" onclick="_caDetail(\'' + _esc(deptKey) + '\',\'' + vt.key + '\',\'' + ym + '\');return false;" style="font-weight:700;font-size:13px;color:'+vt.color+';">'+n2+'</a>'
            : '<span class="ca-count-zero">—</span>';
          return '<td class="ca-cell'+(isLast2?' ca-cell-current':'')+'">'+cell2+'</td>';
        }).join('');
        return '<tr class="ca-vatype-row" data-vt-section="'+vtSectionId+'" style="background:var(--surface-2);display:none;">' +
          '<td class="ca-metric-label" style="color:'+vt.color+';font-size:12px;padding-left:18px;">↳ ' + vt.label + '</td>' + vtCells +
        '</tr>';
      }).join('');
      var toggleRow = '<tr class="ca-vatype-toggle" style="cursor:pointer;" onclick="caToggleVAType(this,\''+vtSectionId+'\')">' +
        '<td colspan="'+colCount+'" style="font-size:11.5px;color:var(--text-muted);font-weight:600;padding:6px 12px;">' +
          '<span class="ca-vatype-arrow" style="display:inline-block;">▸</span> Regular / Non-Regular / Mixed breakdown' +
          '<span style="font-weight:400;font-style:italic;"> — by VA Connection Hours Type, not Connection Type</span>' +
        '</td>' +
      '</tr>';
      vaTypeSection = toggleRow + vtRowsHtml;
    }

    var restSnapshotRows = CA_METRICS_SNAPSHOT.slice(1).map(buildRow).join(''); // Paused, Churned

    // "No Active VA" only ever has data under (All) — an account with zero
    // active VAs has no department to be grouped under in the first place.
    var noActiveVARow = '';
    if (deptLabel === '(All)') {
      var navCells = months.map(function(ym, idx) {
        var n = getCount('(All)', CA_METRIC_NO_ACTIVE_VA.key, ym);
        var isLast = (idx === months.length - 1);
        var prev = idx > 0 ? getCount('(All)', CA_METRIC_NO_ACTIVE_VA.key, months[idx-1]) : null;
        var trendEl = (isLast && prev !== null) ? trend(n, prev) : '';
        var nCell = n > 0
          ? '<a href="#" onclick="_caDetail(\'(All)\',\'' + CA_METRIC_NO_ACTIVE_VA.key + '\',\'' + ym + '\');return false;" class="ca-count' + (isLast ? ' ca-count-current' : '') + '" style="color:#ef4444;">' + n + '</a>'
          : '<span class="ca-count-zero">—</span>';
        return '<td class="ca-cell' + (isLast ? ' ca-cell-current' : '') + '">' + nCell + trendEl + '</td>';
      }).join('');
      noActiveVARow = '<tr>' +
        '<td class="ca-metric-label" style="color:#ef4444;">⚠ ' + CA_METRIC_NO_ACTIVE_VA.label + '</td>' +
        navCells +
      '</tr>';
    }

    var groupHeader1 = '<tr class="ca-group-divider"><td colspan="'+colCount+'" style="padding:8px 12px 4px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted);">Current Snapshot</td></tr>';
    var groupHeader2 = '<tr class="ca-group-divider"><td colspan="'+colCount+'" style="padding:10px 12px 4px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted);border-top:2px solid var(--border);">Period Activity</td></tr>';

    // ── Group 2: what happened this period (New, Returning, Resuming, Cancelled, Terminated)
    var activityRows = CA_METRICS_ACTIVITY.map(buildRow).join('');

    var tableHtml = '<div class="ca-section-table"><table class="ca-table">' +
      '<thead><tr>' +
        '<th class="ca-metric-col">Metric</th>' + colHeaders +
      '</tr></thead>' +
      '<tbody>' +
        groupHeader1 + activeRowHtml + vaTypeSection + restSnapshotRows + noActiveVARow +
        groupHeader2 + activityRows +
      '</tbody>' +
    '</table></div>';

    var chartHtml = _caMultiLineChart(
      CA_METRICS.concat(deptLabel === '(All)' ? [CA_METRIC_NO_ACTIVE_VA] : []),
      months, labels, getCount, deptLabel
    );

    return '<div class="ca-section-body">' + tableHtml + chartHtml + '</div>';
  } // end buildMetricTable

  // ── Multi-line trend chart — right panel of each section ───────────
  // One polyline per metric, all sharing the same Y axis (max of all metrics
  // in this section). Gridlines, X-axis month labels, and a compact legend
  // are included. SVG, no external libraries.
  function _caMultiLineChart(metrics, months2, labels2, getCountFn, deptKey2) {
    var W = 252, H = 160, padL = 28, padR = 10, padT = 14, padB = 32;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var n = months2.length;

    // Y-scale across all metrics
    var allVals = [];
    metrics.forEach(function(m) {
      months2.forEach(function(ym) {
        allVals.push(getCountFn(deptKey2, m.key, ym));
      });
    });
    var maxVal = Math.max.apply(null, allVals.concat([1]));

    function xPos(i) { return padL + (n <= 1 ? innerW / 2 : i * innerW / (n - 1)); }
    function yPos(v) { return padT + innerH - (v / maxVal) * innerH; }

    // Y gridlines (0, 50%, 100%)
    var gridLines = [0, 0.5, 1].map(function(pct) {
      var y = padT + innerH - pct * innerH;
      return '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y+'" y2="'+y+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,2"/>' +
        '<text x="'+(padL-4)+'" y="'+(y+4)+'" text-anchor="end" font-size="9" fill="var(--text-muted)">' + Math.round(maxVal*pct) + '</text>';
    }).join('');

    // X-axis labels
    var xLabels = labels2.map(function(lbl, i) {
      return '<text x="'+xPos(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9" fill="var(--text-muted)">' + lbl.substring(0,3) + '</text>';
    }).join('');

    var palette = ['#3b82f6','#10b981','#8b5cf6','#f59e0b','#ef4444','#f59e0b','#6b7280'];
    var lines = metrics.map(function(m, mi) {
      var color = m.color || palette[mi % palette.length];
      var pts = months2.map(function(ym, i) {
        return xPos(i).toFixed(1) + ',' + yPos(getCountFn(deptKey2, m.key, ym)).toFixed(1);
      }).join(' ');
      var dots = months2.map(function(ym, i) {
        var v = getCountFn(deptKey2, m.key, ym);
        return '<circle cx="'+xPos(i).toFixed(1)+'" cy="'+yPos(v).toFixed(1)+'" r="2.5" fill="'+color+'" stroke="var(--surface)" stroke-width="1.5"><title>'+m.label+': '+v+'</title></circle>';
      }).join('');
      return '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>' + dots;
    }).join('');

    var legendItems = metrics.map(function(m, mi) {
      var color = m.color || palette[mi % palette.length];
      return '<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-secondary);">' +
        '<svg width="12" height="4" style="flex-shrink:0;"><line x1="0" y1="2" x2="12" y2="2" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round"/></svg>' +
        '<span>'+_esc(m.label)+'</span></div>';
    }).join('');

    return '<div class="ca-section-chart">' +
      '<div class="ca-chart-title">6-Month Trend</div>' +
      '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="display:block;overflow:visible;">' +
        gridLines + xLabels + lines +
        '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+(padT+innerH)+'" y2="'+(padT+innerH)+'" stroke="var(--border)" stroke-width="1.5"/>' +
        '<line x1="'+padL+'" x2="'+padL+'" y1="'+padT+'" y2="'+(padT+innerH)+'" stroke="var(--border)" stroke-width="1"/>' +
      '</svg>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:6px;">' + legendItems + '</div>' +
    '</div>';
  }

  var html = '';

  // ════════════════════════════════════════════
  // GROUP BY DEPARTMENT
  // One section per department; rows = metrics, cols = months
  // ════════════════════════════════════════════
  if (_caGroup === 'department') {
    // Sort departments: (All) first, specific departments alphabetically in the
    // middle, then "(No Department)" / empty last.
    var NO_DEPT_LABELS = ['(No Department)', '—', '', 'Unknown'];
    var allDepts = ['(All)'].concat(
      depts
        .filter(function(d){ return NO_DEPT_LABELS.indexOf(d) === -1; })
        .sort(function(a,b){ return a.localeCompare(b); })
    ).concat(
      depts.filter(function(d){ return NO_DEPT_LABELS.indexOf(d) !== -1; })
    );
    allDepts.forEach(function(dept) {
      var isAllDept = dept === '(All)';
      html += '<div class="ca-section' + (isAllDept ? ' ca-section-primary' : '') + '">' +
        '<div class="ca-section-header">' +
          '<div class="ca-section-title">' + _esc(isAllDept ? 'All Departments' : dept) + '</div>' +
          (isAllDept ? '<div class="ca-section-sub">Unique ' + entLbl + 's across all departments</div>' : '') +
        '</div>' +
        buildMetricTable(dept) +
      '</div>';
    });
  }

  // ════════════════════════════════════════════
  // GROUP BY METRIC
  // One section per metric; rows = departments, cols = months
  // ════════════════════════════════════════════
  else {
    CA_METRICS.forEach(function(m) {
      var NO_DEPT_LABELS2 = ['(No Department)', '—', '', 'Unknown'];
      var deptListSorted = ['(All)'].concat(
        depts.filter(function(d){ return NO_DEPT_LABELS2.indexOf(d) === -1; }).sort(function(a,b){ return a.localeCompare(b); })
      ).concat(depts.filter(function(d){ return NO_DEPT_LABELS2.indexOf(d) !== -1; }));

      var rows = deptListSorted.map(function(dept) {
        var cells = months.map(function(ym, idx) {
          var n       = getCount(dept, m.key, ym);
          var isLast  = (idx === months.length - 1);
          var prev    = idx > 0 ? getCount(dept, m.key, months[idx-1]) : null;
          var trendEl = (isLast && prev !== null) ? trend(n, prev) : '';
          var nCell   = n > 0
            ? '<a href="#" onclick="_caDetail(\'' + _esc(dept) + '\',\'' + m.key + '\',\'' + ym + '\');return false;" class="ca-count' + (isLast ? ' ca-count-current' : '') + '"' + (m.color?' style="color:'+m.color+';"':'') + '>' + n + '</a>'
            : '<span class="ca-count-zero">—</span>';
          return '<td class="ca-cell' + (isLast ? ' ca-cell-current' : '') + '">' + nCell + trendEl + '</td>';
        }).join('');
        var isAll = (dept === '(All)');
        return '<tr' + (isAll ? ' class="ca-row-total"' : '') + '>' +
          '<td class="ca-metric-label">' + _esc(isAll ? 'All Departments' : dept) + '</td>' + cells +
        '</tr>';
      }).join('');

      // For "by metric" mode, the chart shows each department as a separate line
      function getCountByDept(dept2, key2, ym) { return getCount(dept2, key2, ym); }
      var deptMetrics = deptListSorted.map(function(dept, di) {
        var NO_DEPT_LABELS3 = ['(No Department)', '—', '', 'Unknown'];
        var palette3 = ['#3b82f6','#10b981','#8b5cf6','#f59e0b','#6b7280','#ec4899'];
        return { key: m.key, label: dept === '(All)' ? 'All Depts' : dept, color: m.color || palette3[di % palette3.length], _dept: dept };
      });
      var chartByDept = _caMultiLineChartByDept(deptMetrics, months, labels, m.key, getCount);

      html += '<div class="ca-section">' +
        '<div class="ca-section-header">' +
          '<div class="ca-section-title"' + (m.color?' style="color:'+m.color+';"':'') + '>' + m.label + ' ' + entLbl + 's</div>' +
          '<div class="ca-section-sub">' + _caMDesc(m.key) + '</div>' +
        '</div>' +
        '<div class="ca-section-body">' +
          '<div class="ca-section-table"><table class="ca-table">' +
            '<thead><tr><th class="ca-metric-col">Department</th>' + colHeaders + '</tr></thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table></div>' +
          chartByDept +
        '</div>' +
      '</div>';
    });

    // No Active VA row
    var navCells2 = months.map(function(ym, idx) {
      var n = getCount('(All)', CA_METRIC_NO_ACTIVE_VA.key, ym);
      var isLast = (idx === months.length - 1);
      var prev = idx > 0 ? getCount('(All)', CA_METRIC_NO_ACTIVE_VA.key, months[idx-1]) : null;
      var trendEl = (isLast && prev !== null) ? trend(n, prev) : '';
      var nCell = n > 0
        ? '<a href="#" onclick="_caDetail(\'(All)\',\'' + CA_METRIC_NO_ACTIVE_VA.key + '\',\'' + ym + '\');return false;" class="ca-count' + (isLast ? ' ca-count-current' : '') + '" style="color:#ef4444;">' + n + '</a>'
        : '<span class="ca-count-zero">—</span>';
      return '<td class="ca-cell' + (isLast ? ' ca-cell-current' : '') + '">' + nCell + trendEl + '</td>';
    }).join('');
    var navChart = _caMultiLineChart([CA_METRIC_NO_ACTIVE_VA], months, labels, getCount, '(All)');
    html += '<div class="ca-section ca-section-primary">' +
      '<div class="ca-section-header">' +
        '<div class="ca-section-title" style="color:#ef4444;">⚠ ' + CA_METRIC_NO_ACTIVE_VA.label + ' ' + entLbl + 's</div>' +
        '<div class="ca-section-sub">Active status, not Terminated/Cancelled/Paused, but zero active VA connections — department-agnostic</div>' +
      '</div>' +
      '<div class="ca-section-body">' +
        '<div class="ca-section-table"><table class="ca-table">' +
          '<thead><tr><th class="ca-metric-col">Department</th>' + colHeaders + '</tr></thead>' +
          '<tbody><tr class="ca-row-total"><td class="ca-metric-label">All Departments</td>' + navCells2 + '</tr></tbody>' +
        '</table></div>' +
        navChart +
      '</div>' +
    '</div>';
  }

  body.innerHTML = html +
    '<div class="ca-legend">' +
      '<span class="ca-legend-title">Definitions</span>' +
      '<span class="ca-legend-item"><strong>New</strong> — first VA connection to this department started in the month</span>' +
      '<span class="ca-legend-item"><strong>Active</strong> — had at least one active VA connection during the month</span>' +
      '<span class="ca-legend-item"><strong>Paused</strong> — status Paused during the month</span>' +
      '<span class="ca-legend-item"><strong>Returning</strong> — IsReturning flag set</span>' +
      '<span class="ca-legend-item"><strong>Resuming</strong> — back Active this month from Paused (not a Terminated/Cancelled reactivation, not brand-new)</span>' +
      '<span class="ca-legend-item"><strong style="color:#ef4444;">Churned</strong> — Terminated in the <em>previous</em> month (churn counted one month after termination)</span>' +
      '<span class="ca-legend-item"><strong style="color:#ef4444;">Terminated</strong> — Terminated during the <em>current</em> month, no lag (see Churned for the lagged version)</span>' +
      '<span class="ca-legend-item"><strong style="color:#f59e0b;">Cancelled</strong> — Cancelled during the current month (tracked separately from Churned/Terminated)</span>' +
      '<span class="ca-legend-item"><strong style="color:#ef4444;">No Active VA</strong> — Active status, not Paused/Terminated/Cancelled, but zero active VA connections (All only)</span>' +
      '<span class="ca-legend-item">Trend <span class="ca-trend ca-trend-up">↑</span> <span class="ca-trend ca-trend-down">↓</span> vs prior month</span>' +
    '</div>';
}

// Chart variant for "Group By Metric" mode — each line is a department
function _caMultiLineChartByDept(deptMetrics, months2, labels2, metricKey, getCountFn) {
  var W = 252, H = 160, padL = 28, padR = 10, padT = 14, padB = 32;
  var innerW = W - padL - padR, innerH = H - padT - padB;
  var n = months2.length;
  var allVals = [];
  deptMetrics.forEach(function(dm) {
    months2.forEach(function(ym) { allVals.push(getCountFn(dm._dept, metricKey, ym)); });
  });
  var maxVal = Math.max.apply(null, allVals.concat([1]));
  function xPos(i) { return padL + (n <= 1 ? innerW / 2 : i * innerW / (n - 1)); }
  function yPos(v) { return padT + innerH - (v / maxVal) * innerH; }
  var gridLines = [0, 0.5, 1].map(function(pct) {
    var y = padT + innerH - pct * innerH;
    return '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y+'" y2="'+y+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,2"/>' +
      '<text x="'+(padL-4)+'" y="'+(y+4)+'" text-anchor="end" font-size="9" fill="var(--text-muted)">' + Math.round(maxVal*pct) + '</text>';
  }).join('');
  var xLabels = labels2.map(function(lbl, i) {
    return '<text x="'+xPos(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9" fill="var(--text-muted)">' + lbl.substring(0,3) + '</text>';
  }).join('');
  var lines = deptMetrics.map(function(dm) {
    var pts = months2.map(function(ym, i) {
      return xPos(i).toFixed(1) + ',' + yPos(getCountFn(dm._dept, metricKey, ym)).toFixed(1);
    }).join(' ');
    var dots = months2.map(function(ym, i) {
      var v = getCountFn(dm._dept, metricKey, ym);
      return '<circle cx="'+xPos(i).toFixed(1)+'" cy="'+yPos(v).toFixed(1)+'" r="2.5" fill="'+dm.color+'" stroke="var(--surface)" stroke-width="1.5"><title>'+dm.label+': '+v+'</title></circle>';
    }).join('');
    return '<polyline points="'+pts+'" fill="none" stroke="'+dm.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>' + dots;
  }).join('');
  var legendItems = deptMetrics.map(function(dm) {
    return '<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-secondary);">' +
      '<svg width="12" height="4" style="flex-shrink:0;"><line x1="0" y1="2" x2="12" y2="2" stroke="'+dm.color+'" stroke-width="2.5" stroke-linecap="round"/></svg>' +
      '<span>'+_esc(dm.label)+'</span></div>';
  }).join('');
  return '<div class="ca-section-chart">' +
    '<div class="ca-chart-title">By Department</div>' +
    '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="display:block;overflow:visible;">' +
      gridLines + xLabels + lines +
      '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+(padT+innerH)+'" y2="'+(padT+innerH)+'" stroke="var(--border)" stroke-width="1.5"/>' +
      '<line x1="'+padL+'" x2="'+padL+'" y1="'+padT+'" y2="'+(padT+innerH)+'" stroke="var(--border)" stroke-width="1"/>' +
    '</svg>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:6px;">' + legendItems + '</div>' +
  '</div>';
}

function _caMDesc(key) {
  return {
    active:    'Had at least one active VA connection during the month (regardless of current status)',
    paused:    'Status is Paused during the month',
    newRec:    'First VA connection to this department started in the month',
    returning: 'Previously churned and reactivated',
    resuming:  'Came back Active this month from Paused (not a fresh reactivation from Terminated/Cancelled, and not a brand-new start)',
    churned:   'Status Terminated in the PREVIOUS month — churn is counted one month after termination',
    terminated:'Status Terminated during the CURRENT month, with no one-month lag (see Churned for the lagged version)',
    cancelled: 'Status Cancelled during the current month (tracked separately from Churned/Terminated)',
    noActiveVA:'Active status, not Paused/Terminated/Cancelled, but zero active VA connections'
  }[key] || '';
}

function caExportCSV() {
  if (!_caData) return;
  var months  = _caData.months     || [];
  var labels  = _caData.monthLabels|| months;
  var monthly = _caData.monthly     || {};
  var ent     = _caEntity;
  var mEnt    = monthly[ent] || {};
  var depts   = _caData.departments || [];
  var header  = ['Department','Metric'].concat(labels);
  var lines   = [header];
  depts.forEach(function(dept) {
    CA_METRICS.forEach(function(m) {
      var row = [dept, m.label];
      months.forEach(function(ym) {
        var md = mEnt[ym]; var dm = (md && md.data && md.data[dept]) || {};
        row.push(dm[m.key] || 0);
      });
      lines.push(row);
    });
  });
  // No Active VA — (All)-only, appended as its own row
  var navRow = ['(All)', CA_METRIC_NO_ACTIVE_VA.label];
  months.forEach(function(ym) {
    var md = mEnt[ym]; var dm = (md && md.data && md.data['(All)']) || {};
    navRow.push(dm[CA_METRIC_NO_ACTIVE_VA.key] || 0);
  });
  lines.push(navRow);
  var csv = lines.map(function(r){ return r.map(function(v){ return '"'+String(v||'').replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  var blob = new Blob([csv],{type:'text/csv'}); var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='ca-report.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}



// ═══════════════════════════════════════════════════════════
// HOURS REPORT
// ═══════════════════════════════════════════════════════════
var _hrData = null;

function _renderHoursReport(container) {
  var now     = new Date();
  var defMonth = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');

  container.innerHTML =
    '<div class="ca-report">' +
      '<div style="margin-bottom:18px;">' +

var HR_ROWS = [
  { key:'total',           label:'Total Hours',              bold:true,  color:'' },
  { key:'addedNewClient',  label:'↑ Added — New Client',     bold:false, color:'#10b981' },
  { key:'addedAdditional', label:'↑ Added — Additional VA',  bold:false, color:'#3b82f6' },
  { key:'lostChurn',       label:'↓ Lost — Churned Client',  bold:false, color:'#ef4444' },
  { key:'lostReduction',   label:'↓ Lost — Reduction',       bold:false, color:'#f59e0b' },
];

function hrRender(d) {
  var body    = document.getElementById('hrBody'); if (!body) return;
  // d.months = array of { label, regular, project }
  // d.connections = array of connection detail objects
  var months     = d.months || [];
  var conns      = d.connections || [];
  var lastIdx    = months.length - 1;

  if (!months.length) {
    body.innerHTML = '<div class="empty-state"><h3>No data</h3><p>No VA connections found.</p></div>';
    return;
  }

  // ── Column headers
  var colHeaders = months.map(function(m, i) {
    var lbl = m.label || String(m);
    return '<th class="ca-month-col' + (i===lastIdx?' ca-month-current':'') + '">' + _esc(lbl) + '</th>';
  }).join('');

  // ── Map metric keys between backend (added_new etc) and display
  var HR_METRIC_ROWS = [
    { key:'total',          label:'Total Hours',             bold:true,  color:'' },
    { key:'added_new',      label:'↑ Added — New Client',    bold:false, color:'#10b981' },
    { key:'added_addl',     label:'↑ Added — Additional VA', bold:false, color:'#3b82f6' },
    { key:'lost_churn',     label:'↓ Lost — Churned Client', bold:false, color:'#ef4444' },
    { key:'lost_reduction', label:'↓ Lost — Reduction',      bold:false, color:'#f59e0b' },
    { key:'activeCount',    label:'Active VAs',               bold:false, color:'#94a3b8' },
  ];

  function buildSection(bucketKey, typeLabel, color) {
    var rows = HR_METRIC_ROWS.map(function(row) {
      var cells = months.map(function(m, i) {
        var bucket = m[bucketKey] || {};
        var val    = bucket[row.key] != null ? bucket[row.key] : 0;
        var isLast = (i === lastIdx);
        var trend  = '';
        if (isLast && i > 0 && row.key === 'total') {
          var prev = (months[i-1][bucketKey]||{}).total || 0;
          var diff = val - prev;
          if (diff > 0) trend = ' <span class="ca-trend ca-trend-up">↑'+diff+'</span>';
          else if (diff < 0) trend = ' <span class="ca-trend ca-trend-down">↓'+Math.abs(diff)+'</span>';
        }
        var stl = row.color ? 'color:'+row.color+';' : '';
        var dispVal = val > 0
          ? '<span style="font-weight:'+(row.bold?'900':'600')+';font-size:'+(row.bold?'15':'13')+'px;'+stl+'">'+val+'</span>'+trend
          : '<span style="color:var(--border);">—</span>';
        return '<td class="ca-cell'+(isLast?' ca-cell-current':'')+'">' + dispVal + '</td>';
      }).join('');
      return '<tr'+(row.bold?' style="background:var(--surface-2);"':'')+'>'+
        '<td class="ca-metric-label" style="'+(row.color?'color:'+row.color+';':'')+'">' + row.label + '</td>'+
        cells+'</tr>';
    }).join('');

    return '<div class="ca-section" style="margin-bottom:18px;">'+
      '<div class="ca-section-header">'+
        '<div class="ca-section-title" style="color:'+color+';">'+typeLabel+'</div>'+
        '<div class="ca-section-sub">Hours = weekday count × daily hours. Weekends excluded.</div>'+
      '</div>'+
      '<div class="table-wrap"><table class="ca-table">'+
        '<thead><tr><th class="ca-metric-col">Metric</th>'+colHeaders+'</tr></thead>'+
        '<tbody>'+rows+'</tbody>'+
      '</table></div>'+
    '</div>';
  }

  // ── KPI cards (current month)
  var lastMonth  = months[lastIdx] || {};
  var summaryCards = [
    { key:'regular', label:'Regular',       color:'#3b82f6' },
    { key:'project', label:'Non-Regular', color:'#8b5cf6' }
  ].map(function(t) {
    var bucket = lastMonth[t.key] || {};
    var total  = bucket.total || 0;
    var prev   = lastIdx > 0 ? ((months[lastIdx-1][t.key]||{}).total||0) : 0;
    var diff   = total - prev;
    var trendEl= diff > 0 ? '<span style="color:#10b981;font-weight:700;">↑'+diff+' vs prior</span>'
               : diff < 0 ? '<span style="color:#ef4444;font-weight:700;">↓'+Math.abs(diff)+' vs prior</span>'
               : '<span style="color:var(--text-muted);">No change</span>';
    return '<div class="ca-kpi-card" style="border-top:3px solid '+t.color+';">'+
      '<div style="font-size:28px;font-weight:900;color:'+t.color+';">'+total+'</div>'+
      '<div style="font-size:13px;font-weight:700;margin:4px 0 2px;">'+t.label+' Hours</div>'+
      '<div style="font-size:12px;">'+trendEl+'</div>'+
      '<div style="font-size:11.5px;color:var(--text-muted);">'+_esc(lastMonth.label||'')+'</div>'+
    '</div>';
  }).join('');

  // ── Drill-down: connection source table
  var connRows = conns.length
    ? conns.sort(function(a,b){ return (a.clientName||'').localeCompare(b.clientName||''); })
        .map(function(cn) {
          var typeChip = cn.connType==='Non-Regular'
            ? '<span class="badge badge-returning" style="font-size:10.5px;">Non-Regular</span>'
            : '<span class="badge badge-role" style="font-size:10.5px;">Regular</span>';
          var stBadge  = cn.status==='Started'?'badge-active':cn.status==='Cancelled'?'badge-terminated':'badge-inactive';
          return '<tr>'+
            '<td style="font-weight:600;">'+_esc(cn.vaName||'—')+'</td>'+
            '<td style="font-size:12.5px;">'+_esc(cn.clientName||'—')+'</td>'+
            '<td>'+typeChip+'</td>'+
            '<td style="font-size:12px;color:var(--text-muted);">'+_esc(cn.department||'—')+'</td>'+
            '<td style="font-size:12px;color:var(--text-muted);">'+_esc(cn.service||'—')+'</td>'+
            '<td style="text-align:center;font-weight:700;">'+cn.hpw+'</td>'+
            '<td class="muted">'+_fdate(cn.startDate)+'</td>'+
            '<td class="muted">'+(cn.termDate?_fdate(cn.termDate):'Active')+'</td>'+
            '<td><span class="badge '+stBadge+'">'+_esc(cn.status||'—')+'</span></td>'+
          '</tr>';
        }).join('')
    : '<tr><td colspan="9" style="text-align:center;padding:20px;color:var(--text-muted);">No connections found.</td></tr>';

  var drillDownSection =
    '<div class="ca-section" style="margin-bottom:18px;">'+
      '<div class="ca-section-header" style="cursor:pointer;" onclick="hrToggleDrillDown()">'+
        '<div class="ca-section-title">📋 Data Source — All VA Connections <span style="font-size:12px;font-weight:400;color:var(--text-muted);">('+conns.length+' records)</span></div>'+
        '<div id="hrDrillToggle" style="font-size:12px;color:var(--accent);">Show ▼</div>'+
      '</div>'+
      '<div id="hrDrillContent" style="display:none;">'+
        '<div class="table-wrap"><table class="ca-table" style="font-size:12.5px;">'+
          '<thead><tr>'+
            '<th>VA</th><th>Account</th><th>Type</th><th>Department</th>'+
            '<th>Service</th><th style="text-align:center;">Hrs/Wk</th>'+
            '<th>Start</th><th>End</th><th>Status</th>'+
          '</tr></thead>'+
          '<tbody>'+connRows+'</tbody>'+
        '</table></div>'+
      '</div>'+
    '</div>';

  body.innerHTML =
    '<div style="margin-bottom:20px;">'+
      '<div style="font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;">'+(lastMonth.label||'Current Month')+' Summary</div>'+
      '<div class="ca-kpi-grid">'+summaryCards+'</div>'+
    '</div>'+
    buildSection('regular', 'Regular Hours', '#3b82f6')+
    buildSection('project', 'Non-Regular Hours', '#8b5cf6')+
    drillDownSection+
    '<div class="ca-legend">'+
      '<strong>Definitions:</strong> '+
      '<strong>Total Hours</strong> = weekday hours × daily rate (hrs÷5) · '+
      '<strong>↑ New Client</strong> = first-ever connection for this account starts this month · '+
      '<strong>↑ Additional VA</strong> = extra VA added to existing account · '+
      '<strong>↓ Churned</strong> = connection ends & no other active VAs on that account · '+
      '<strong>↓ Reduction</strong> = connection ends but account retains other active VAs · '+
      '<strong>Active VAs</strong> = count of connections active during the month.'+
    '</div>';
}

function hrToggleDrillDown() {
  var content = document.getElementById('hrDrillContent');
  var toggle  = document.getElementById('hrDrillToggle');
  if (!content) return;
  var isHidden = content.style.display === 'none';
  content.style.display = isHidden ? 'block' : 'none';
  if (toggle) toggle.textContent = isHidden ? 'Hide ▲' : 'Show ▼';
}

function hrExportCSV() {
  if (!_hrData) return;
  var d = _hrData;
  var header = ['Type','Metric'].concat((d.months||[]).map(function(m){return m.label||String(m);}));
  var lines  = [header];
  var HR_EXPORT_ROWS = [
    {key:'total',label:'Total Hours'},{key:'added_new',label:'Added New Client'},
    {key:'added_addl',label:'Added Additional VA'},{key:'lost_churn',label:'Lost Churn'},
    {key:'lost_reduction',label:'Lost Reduction'},{key:'activeCount',label:'Active VAs'}
  ];
  ['regular','project'].forEach(function(typeKey) {
    HR_EXPORT_ROWS.forEach(function(row) {
      var dataRow = [typeKey==='regular'?'Regular':'Non-Regular', row.label];
      (d.months||[]).forEach(function(md) { dataRow.push((md[typeKey]||{})[row.key]||0); });
      lines.push(dataRow);
    });
  });
  // Connection details sheet
  lines.push([]);
  lines.push(['VA Name','Account','Type','Department','Service','Hrs/Wk','Start Date','End Date','Status']);
  (d.connections||[]).forEach(function(cn){
    lines.push([cn.vaName||'',cn.clientName||'',cn.connType||'',cn.department||'',cn.service||'',cn.hpw||0,cn.startDate||'',cn.termDate||'',cn.status||'']);
  });
  var csv = lines.map(function(r){ return r.map(function(v){ return '"'+String(v||'').replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  var blob=new Blob([csv],{type:'text/csv'}); var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='hours-report.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}


// ══════════════════════════════════════════════════════════
// CUSTOMER IDLE TIME REPORT
// "Idle" = days between a customer being added (or paying) and the moment
// they're actually connected to their first Virtual Assistant (their VA
// connection reaching Accepted/Started). Customers with no qualifying
// connection yet are shown as "still idle" with a live, ongoing day count.
// ══════════════════════════════════════════════════════════
var _idleData = null;

function _renderIdleTimeReport(container) {
  container.innerHTML =
    '<div class="ca-report">' +
      '<div style="margin-bottom:18px;">' +
        '<div style="font-size:22px;font-weight:800;letter-spacing:-0.3px;">Customer Idle Time Report</div>' +
        '<div style="font-size:13px;color:var(--text-muted);margin-top:3px;">Days between a customer being added / paying and their first VA connection</div>' +
      '</div>' +
      '<div class="ca-filter-bar">' +
        '<div class="dash-date-group"><label class="dash-ctrl-label">Status</label>' +
          '<select class="form-select" id="idleStatusFilter" style="min-width:160px;">' +
            '<option value="">All Statuses</option>' +
            ['Pending','Active','Paused','Inactive','Terminated','Cancelled'].map(function(s){ return '<option value="'+s+'">'+s+'</option>'; }).join('') +
          '</select></div>' +
        '<div class="dash-date-group"><label class="dash-ctrl-label">Search</label>' +
          '<input class="form-input" id="idleSearchFilter" type="text" placeholder="Customer name…" style="min-width:180px;" /></div>' +
        '<div style="display:flex;gap:8px;align-self:flex-end;">' +
          '<button class="btn btn-primary btn-sm" onclick="idleRefresh()">Apply</button>' +
          '<button class="btn btn-secondary btn-sm" id="idleExportBtn" onclick="idleExportCSV()" disabled>Export CSV</button>' +
        '</div>' +
      '</div>' +
      '<div id="idleBody" style="margin-top:20px;"><div class="loading-screen" style="height:260px;"><div class="loader-ring"></div><p>Building report…</p></div></div>' +
    '</div>';

  idleRefresh();
}

function idleRefresh() {
  var status = (document.getElementById('idleStatusFilter')||{}).value || '';
  var search = (document.getElementById('idleSearchFilter')||{}).value || '';
  var body = document.getElementById('idleBody');
  var btn  = document.getElementById('idleExportBtn');
  if (body) body.innerHTML = '<div class="loading-screen" style="height:260px;"><div class="loader-ring"></div><p>Building report…</p></div>';
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) {
        if (body) body.innerHTML = '<div class="empty-state"><h3>Error</h3><p>' + _esc((res&&res.error)||'Failed.') + '</p></div>';
        return;
      }
      _idleData = res;
      idleRender(res);
      if (btn) btn.disabled = false;
    })
    .withFailureHandler(function(err){ if(body) body.innerHTML='<div class="empty-state"><h3>Error</h3><p>'+_esc(err.message)+'</p></div>'; })
    .getCustomerIdleTimeReport({ status: status, search: search });
}

function idleRender(res) {
  var body = document.getElementById('idleBody'); if (!body) return;
  var rows = res.data || [];
  var s    = res.summary || {};

  if (!rows.length) {
    body.innerHTML = '<div class="empty-state"><h3>No data</h3><p>No customers match this filter.</p></div>';
    return;
  }

  function dayCell(val) {
    if (val === null || val === undefined) return '<span style="color:var(--border);">—</span>';
    return '<span style="font-weight:700;">' + val + '</span> <span style="font-size:11px;color:var(--text-muted);">days</span>';
  }

  var summaryHtml =
    '<div class="dash-grid" style="margin-bottom:18px;">' +
      '<div class="stat-card"><div class="stat-label">Total Customers</div><div class="stat-value">' + s.totalCustomers + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Connected to a VA</div><div class="stat-value" style="color:var(--success);">' + s.connectedCustomers + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Still Idle</div><div class="stat-value" style="color:var(--warning);">' + s.stillIdleCustomers + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Avg Idle (Since Added)</div><div class="stat-value">' + (s.avgIdleDaysSinceAdded!=null?s.avgIdleDaysSinceAdded+'d':'—') + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Avg Idle (Since Paid)</div><div class="stat-value">' + (s.avgIdleDaysSincePaid!=null?s.avgIdleDaysSincePaid+'d':'—') + '</div></div>' +
    '</div>';

  var tableRows = rows.map(function(r) {
    var connBadge = r.isConnected
      ? '<span class="badge badge-active">Connected</span>'
      : '<span class="badge badge-pending">Still Idle</span>';
    var sinceAddedCell = r.isConnected ? dayCell(r.idleDaysSinceAdded) : (r.stillIdleDaysSinceAdded!=null ? dayCell(r.stillIdleDaysSinceAdded) + ' <span style="font-size:10px;color:var(--warning);">(ongoing)</span>' : '—');
    var sincePaidCell  = r.isConnected ? dayCell(r.idleDaysSincePaid)  : (r.stillIdleDaysSincePaid!=null  ? dayCell(r.stillIdleDaysSincePaid)  + ' <span style="font-size:10px;color:var(--warning);">(ongoing)</span>' : '—');
    return '<tr>' +
      '<td><a href="#" onclick="navigate(\'customer-profile\',\''+_esc(r.customerId)+'\');return false;" style="color:var(--accent);font-weight:600;">'+_esc(r.customerName)+'</a></td>' +
      '<td><span class="badge badge-'+(r.status||'').toLowerCase()+'">'+_esc(r.status||'—')+'</span></td>' +
      '<td>'+connBadge+'</td>' +
      '<td class="muted">'+_fdate(r.createdAt)+'</td>' +
      '<td class="muted">'+(r.noPaymentYet?'⏳ Not yet paid':_fdate(r.paymentDate))+'</td>' +
      '<td>'+sinceAddedCell+'</td>' +
      '<td>'+sincePaidCell+'</td>' +
      '<td class="muted">'+(r.firstVAConnectedAt?_fdate(r.firstVAConnectedAt):'—')+'</td>' +
    '</tr>';
  }).join('');

  body.innerHTML = summaryHtml +
    '<div class="table-wrap"><table>' +
      '<thead><tr>' +
        '<th>Customer</th><th>Status</th><th>VA Status</th><th>Added</th><th>Payment Date</th>' +
        '<th>Idle (Since Added)</th><th>Idle (Since Paid)</th><th>First Connected</th>' +
      '</tr></thead>' +
      '<tbody>' + tableRows + '</tbody>' +
    '</table></div>';
}

function idleExportCSV() {
  if (!_idleData) return;
  var rows = _idleData.data || [];
  var lines = [['Customer','Status','VA Status','Added','Payment Date','Idle Days (Since Added)','Idle Days (Since Paid)','First Connected']];
  rows.forEach(function(r) {
    lines.push([
      r.customerName, r.status, r.isConnected?'Connected':'Still Idle',
      r.createdAt ? r.createdAt.substring(0,10) : '',
      r.noPaymentYet ? 'Not yet paid' : (r.paymentDate ? r.paymentDate.substring(0,10) : ''),
      r.isConnected ? r.idleDaysSinceAdded : r.stillIdleDaysSinceAdded,
      r.isConnected ? r.idleDaysSincePaid  : r.stillIdleDaysSincePaid,
      r.firstVAConnectedAt ? r.firstVAConnectedAt.substring(0,10) : ''
    ]);
  });
  var csv = lines.map(function(r){ return r.map(function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  var blob=new Blob([csv],{type:'text/csv'}); var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='customer-idle-time-report.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function srcRefresh() {

  var reqType  = (document.getElementById('srcTypeFilter')||{}).value || '';

        if (body) body.innerHTML = '<div class="empty-state"><h3>Error</h3><p>' + _esc((res&&res.error)||'Failed.') + '</p></div>';
        return;
      }
      _srcData = res;
      srcRender(res);
      if (btn) btn.disabled = false;
    })
    .withFailureHandler(function(err){ if(body) body.innerHTML='<div class="empty-state"><h3>Error</h3><p>'+_esc(err.message)+'</p></div>'; })
    .getServiceRequestCompletionReport({ fromDate: fromDate, toDate: toDate, requestType: reqType });
}

function srcRender(res) {
  var body = document.getElementById('srcBody'); if (!body) return;
  var rows = res.data || [];
  var s    = res.summary || {};

  if (!rows.length) {
    body.innerHTML = '<div class="empty-state"><h3>No data</h3><p>No service requests in this range.</p></div>';
    return;
  }

  var summaryHtml =
    '<div class="dash-grid" style="margin-bottom:18px;">' +
      '<div class="stat-card"><div class="stat-label">Total Requests</div><div class="stat-value">' + s.totalRequests + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Completion Rate</div><div class="stat-value" style="color:var(--success);">' + (s.completionRate!=null?s.completionRate+'%':'—') + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Won / Lost / Open</div><div class="stat-value" style="font-size:18px;">' + s.wonCount + ' / ' + s.lostCount + ' / ' + s.openCount + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Avg Lead Time</div><div class="stat-value">' + (s.avgLeadTimeDays!=null?s.avgLeadTimeDays+'d':'—') + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Median Lead Time</div><div class="stat-value">' + (s.medianLeadTimeDays!=null?s.medianLeadTimeDays+'d':'—') + '</div></div>' +
    '</div>';

  function statusBadge(r) {
    if (r.isWon)  return '<span class="badge badge-active">Closed - Won</span>';
    if (r.isLost) return '<span class="badge badge-terminated">Closed - Lost</span>';
    return '<span class="badge badge-pending">' + _esc(r.status||'Open') + '</span>';
  }
  function dayCell(val) {
    return (val === null || val === undefined) ? '<span style="color:var(--border);">—</span>' : (val + '<span style="font-size:10px;color:var(--text-muted);"> d</span>');
  }

  var tableRows = rows.map(function(r) {
    return '<tr>' +
      '<td><a href="#" onclick="navigate(\'va-request-profile\',\''+_esc(r.requestId)+'\');return false;" style="color:var(--accent);font-weight:600;">'+_esc(r.requestId)+'</a></td>' +
      '<td><a href="#" onclick="navigate(\'customer-profile\',\''+_esc(r.customerId)+'\');return false;" style="color:var(--accent);">'+_esc(r.customerName)+'</a></td>' +
      '<td class="muted">'+_esc(r.accountName)+'</td>' +
      '<td>'+_esc(r.requestType||'—')+'</td>' +
      '<td>'+statusBadge(r)+'</td>' +
      '<td class="muted">'+_fdate(r.createdAt)+'</td>' +
      '<td class="muted">'+(r.completedAt?_fdate(r.completedAt):'—')+'</td>' +
      '<td>'+dayCell(r.leadTimeDays)+'</td>' +
      '<td>'+dayCell(r.idleDaysSinceAdded)+'</td>' +
      '<td>'+dayCell(r.idleDaysSincePaid)+'</td>' +
    '</tr>';
  }).join('');

  body.innerHTML = summaryHtml +
    '<div class="table-wrap"><table>' +
      '<thead><tr>' +
        '<th>Request ID</th><th>Customer</th><th>Account</th><th>Type</th><th>Status</th>' +
        '<th>Created</th><th>Completed</th><th>Lead Time</th>' +
        '<th>Customer Idle (Added)</th><th>Customer Idle (Paid)</th>' +
      '</tr></thead>' +
      '<tbody>' + tableRows + '</tbody>' +
    '</table></div>';
}

function srcExportCSV() {
  if (!_srcData) return;
  var rows = _srcData.data || [];
  var lines = [['Request ID','Customer','Account','Type','Status','Created','Completed','Lead Time (days)','Customer Idle Since Added','Customer Idle Since Paid']];
  rows.forEach(function(r) {
    lines.push([
      r.requestId, r.customerName, r.accountName, r.requestType, r.status,
      r.createdAt ? r.createdAt.substring(0,10) : '',
      r.completedAt ? r.completedAt.substring(0,10) : '',
      r.leadTimeDays, r.idleDaysSinceAdded, r.idleDaysSincePaid
    ]);
  });
  var csv = lines.map(function(r){ return r.map(function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  var blob=new Blob([csv],{type:'text/csv'}); var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='service-request-completion-report.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}


// ══════════════════════════════════════════════════════════
// PLAYBOOK MODULE — Accounts / VAs / Connections
// A dense, always-current operational reference table, one tab per entity.
// Not a report (no date-range filtering, no export emphasis) — just "show
// me everything about every X in one screen," recomputed fresh on load.
// ══════════════════════════════════════════════════════════
var _pbTab = 'accounts';
var _pbAccounts = [], _pbVAs = [], _pbConnections = [];
var _pbMeetingTypeDefs = [];
var _pbSearch = '';
var _pbCsFilter = '';
var _pbPage = 1;
var _pbPageSize = 10;
var _pbFiltered = [];
// Sort state — field key matches the property name on the row object.
// Default: sellerOnboarding ascending (earliest/oldest onboarded accounts first).
var _pbSortField = 'sellerOnboarding';
var _pbSortAsc   = true;

function _renderPlaybookPage(container) {
  container.innerHTML =
    '<div class="page-playbook">' +
      '<div style="margin-bottom:16px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;">' +
        '<div>' +
          '<div style="font-size:22px;font-weight:800;letter-spacing:-0.3px;">Playbook</div>' +
          '<div style="font-size:13px;color:var(--text-muted);margin-top:3px;">A live operational reference — every Account, VA, and Connection in one place</div>' +
        '</div>' +
      '</div>' +
      '<div class="req-type-tabs" style="margin-bottom:14px;">' +
        '<button class="req-type-tab active" id="pbTabBtn_accounts"    onclick="pbSwitchTab(\'accounts\')">Accounts</button>' +
        '<button class="req-type-tab"         id="pbTabBtn_vas"         onclick="pbSwitchTab(\'vas\')">VAs</button>' +
        '<button class="req-type-tab"         id="pbTabBtn_connections" onclick="pbSwitchTab(\'connections\')">Connections</button>' +
      '</div>' +
      '<div class="table-controls" style="margin-bottom:10px;flex-wrap:wrap;gap:8px;">' +
        '<div class="table-search"><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.6"/><path d="M9.5 9.5L12 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
          '<input type="text" id="pbSearch" placeholder="Search…" oninput="pbApplySearch()" /></div>' +
        // CS Assigned filter — only relevant for Accounts tab
        '<select class="form-select" id="pbCsFilter" style="height:32px;font-size:12px;width:auto;min-width:180px;" onchange="pbApplySearch()">' +
          '<option value="">All CS Specialists</option>' +
        '</select>' +
        // Page size selector
        '<div style="display:flex;align-items:center;gap:6px;margin-left:auto;">' +
          '<span style="font-size:12px;color:var(--text-muted);">Show</span>' +
          '<select class="form-select" id="pbPageSizeSel" style="height:32px;font-size:12px;width:72px;" onchange="pbSetPageSize(this.value)">' +
            '<option value="10" selected>10</option>' +
            '<option value="30">30</option>' +
            '<option value="50">50</option>' +
            '<option value="100">100</option>' +
          '</select>' +
          '<span style="font-size:12px;color:var(--text-muted);">per page</span>' +
        '</div>' +
        '<button class="btn btn-secondary btn-sm" onclick="pbRefresh()">↻ Refresh</button>' +
      '</div>' +
      '<div id="pbBody" style="margin-top:6px;"><div class="loading-screen" style="height:260px;"><div class="loader-ring"></div><p>Loading playbook…</p></div></div>' +
      '<div id="pbPager" style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:12.5px;color:var(--text-muted);"></div>' +
    '</div>';

  pbRefresh();
}

function pbSwitchTab(tab) {
  _pbTab = tab;
  _pbPage = 1;
  // Reset sort to a sensible default per tab
  if (tab === 'accounts')    { _pbSortField = 'sellerOnboarding'; _pbSortAsc = true; }
  else if (tab === 'vas')    { _pbSortField = 'vaName';           _pbSortAsc = true; }
  else                       { _pbSortField = 'workStartDate';    _pbSortAsc = false; }
  ['accounts','vas','connections'].forEach(function(t) {
    var btn = document.getElementById('pbTabBtn_'+t);
    if (btn) btn.classList.toggle('active', t === tab);
  });
  // CS filter only makes sense on Accounts tab
  var csFilterEl = document.getElementById('pbCsFilter');
  if (csFilterEl) csFilterEl.style.display = tab === 'accounts' ? '' : 'none';
  pbRenderCurrentTab();
}

function pbRefresh() {
  var body = document.getElementById('pbBody');
  if (body) body.innerHTML = '<div class="loading-screen" style="height:260px;"><div class="loader-ring"></div><p>Loading playbook…</p></div>';

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) {
        if (body) body.innerHTML = '<div class="empty-state"><h3>Error</h3><p>'+_esc((res&&res.error)||'Failed.')+'</p></div>';
        return;
      }
      var allAccounts = res.accounts || [];
      // CS Specialists only see their own assigned accounts
      var userEmail = CMS.user ? (CMS.user.email||'').toLowerCase() : '';
      var userRole  = CMS.user ? CMS.user.role : '';
      if (userRole === 'CS Specialist' && userEmail) {
        _pbAccounts = allAccounts.filter(function(r) {
          return (r.csEmail||'').toLowerCase()    === userEmail ||
                 (r.csAssigned||'').toLowerCase() === userEmail;
        });
      } else {
        _pbAccounts = allAccounts;
      }
      _pbMeetingTypeDefs = res.meetingTypeDefs || [];
      _pbVAs             = res.vas             || [];
      _pbConnections     = res.connections     || [];
      _pbPopulateCsFilter();
      pbRenderCurrentTab();
    })
    .withFailureHandler(function(err) {
      if (body) body.innerHTML = '<div class="empty-state"><h3>Error</h3><p>'+_esc(err.message)+'</p></div>';
    })
    .getPlaybookData();
}

function _pbPopulateCsFilter() {
  var sel = document.getElementById('pbCsFilter'); if (!sel) return;
  var specialists = {};
  _pbAccounts.forEach(function(r) {
    if (r.csName || r.csEmail) {
      var key = r.csEmail || r.csAssigned || '';
      if (key) specialists[key] = r.csName || r.csEmail || key;
    }
  });
  var opts = '<option value="">All CS Specialists</option>' +
    Object.keys(specialists).sort(function(a,b){ return (specialists[a]||a).localeCompare(specialists[b]||b); }).map(function(email){
      return '<option value="'+_esc(email)+'">'+_esc(specialists[email])+'</option>';
    }).join('');
  sel.innerHTML = opts;
  if (_pbCsFilter) sel.value = _pbCsFilter;
}

function pbApplySearch() {
  _pbSearch   = ((document.getElementById('pbSearch')||{}).value || '').toLowerCase();
  _pbCsFilter = (document.getElementById('pbCsFilter')||{}).value || '';
  _pbPage = 1;
  pbRenderCurrentTab();
}

function pbSetPageSize(val) {
  _pbPageSize = parseInt(val, 10) || 10;
  _pbPage = 1;
  pbRenderCurrentTab();
}

function pbGoPage(pg) {
  var maxPg = Math.max(1, Math.ceil(_pbFiltered.length / _pbPageSize));
  if (pg >= 1 && pg <= maxPg) { _pbPage = pg; pbRenderCurrentTab(); }
}

function _pbRenderPager() {
  var el = document.getElementById('pbPager'); if (!el) return;
  var total     = _pbFiltered.length;
  var pageCount = Math.max(1, Math.ceil(total / _pbPageSize));
  if (total === 0) { el.innerHTML = ''; return; }
  var startNum = (_pbPage - 1) * _pbPageSize + 1;
  var endNum   = Math.min(_pbPage * _pbPageSize, total);
  var btns = '';
  for (var pg = 1; pg <= pageCount; pg++) {
    if (pg === 1 || pg === pageCount || Math.abs(pg - _pbPage) <= 1) {
      btns += '<button class="page-btn'+(pg===_pbPage?' active':'')+'" onclick="pbGoPage('+pg+')">'+pg+'</button>';
    } else if (Math.abs(pg - _pbPage) === 2) {
      btns += '<span style="padding:0 4px;color:var(--text-muted)">…</span>';
    }
  }
  el.innerHTML =
    '<span>Showing '+startNum+'–'+endNum+' of '+total+'</span>' +
    '<div class="page-btns">' +
      '<button class="page-btn" onclick="pbGoPage('+(_pbPage-1)+')"'+(_pbPage===1?' disabled':'')+'>‹</button>' +
      btns +
      '<button class="page-btn" onclick="pbGoPage('+(_pbPage+1)+')"'+(_pbPage>=pageCount?' disabled':'')+'>›</button>' +
    '</div>';
}

function pbRenderCurrentTab() {
  if (_pbTab === 'accounts')    pbRenderAccounts();
  else if (_pbTab === 'vas')    pbRenderVAs();
  else                          pbRenderConnections();
}

function _pbDayCell(val, suffix) {
  if (val === null || val === undefined || val === '') return '<span style="color:var(--border);">—</span>';
  var isOverdue = typeof val === 'number' && val < 0;
  return '<span style="font-weight:700;' + (isOverdue ? 'color:#ef4444;' : '') + '">' + val + '</span>' +
    '<span style="font-size:10px;color:var(--text-muted);"> ' + (suffix||'d') + '</span>';
}

function pbSetSort(field) {
  if (_pbSortField === field) {
    _pbSortAsc = !_pbSortAsc;
  } else {
    _pbSortField = field;
    _pbSortAsc = true;
  }
  _pbPage = 1;
  pbRenderCurrentTab();
}

// Returns a sort arrow indicator for a column header.
function _pbSortArrow(field) {
  if (_pbSortField !== field) return '<span style="opacity:.35;font-size:9px;"> ↕</span>';
  return '<span style="font-size:9px;color:var(--accent);"> ' + (_pbSortAsc ? '↑' : '↓') + '</span>';
}

// Generic sort comparator used by all three Playbook tabs.
// Date fields are compared as timestamps; everything else as lowercase strings.
function _pbCompare(a, b, field, asc) {
  var va = a[field], vb = b[field];
  // Null/empty always sorts to the bottom regardless of direction.
  var aEmpty = (va === null || va === undefined || va === '');
  var bEmpty = (vb === null || vb === undefined || vb === '');
  if (aEmpty && bEmpty) return 0;
  if (aEmpty) return 1;
  if (bEmpty) return -1;

  // Numeric fields
  if (typeof va === 'number' && typeof vb === 'number') {
    return asc ? va - vb : vb - va;
  }
  // Date-like strings
  if (typeof va === 'string' && va.match(/^\d{4}-\d{2}-\d{2}/)) {
    var ta = new Date(va).getTime(), tb = new Date(vb).getTime();
    return asc ? ta - tb : tb - ta;
  }
  // String fallback
  var sa = String(va).toLowerCase(), sb = String(vb).toLowerCase();
  return asc ? sa.localeCompare(sb) : sb.localeCompare(sa);
}

function pbRenderAccounts() {
  var body = document.getElementById('pbBody'); if (!body) return;
  var q    = _pbSearch;
  var cs   = _pbCsFilter;

  // Issue 1: exclude Inactive, Terminated, Cancelled accounts — Playbook
  // is an operational tool for active/current relationships only.
  var INACTIVE_STATUSES = ['Inactive', 'Terminated', 'Cancelled'];

  _pbFiltered = _pbAccounts.filter(function(r) {
    if (INACTIVE_STATUSES.indexOf(r.status || '') !== -1) return false;
    var matchQ  = !q  || (r.companyName+' '+r.accountName+' '+r.customerName+' '+r.csName+' '+r.csEmail+' '+r.csAssigned).toLowerCase().indexOf(q) !== -1;
    var matchCs = !cs || (r.csEmail||'').toLowerCase() === cs.toLowerCase() || (r.csAssigned||'').toLowerCase() === cs.toLowerCase();
    return matchQ && matchCs;
  });

  // Apply dynamic sort — default is sellerOnboarding asc (set in state vars).
  // Null/empty values always sort to the bottom so active accounts stay visible.
  _pbFiltered.sort(function(a, b) {
    return _pbCompare(a, b, _pbSortField, _pbSortAsc);
  });

  if (!_pbFiltered.length) {
    body.innerHTML = '<div class="empty-state"><h3>No accounts found</h3></div>';
    _pbRenderPager(); return;
  }

  var meetingHeaders = _pbMeetingTypeDefs.map(function(t){
    return '<th style="text-align:center;min-width:80px;cursor:pointer;" onclick="pbSetSort(\'meetingType_'+_esc(t.typeId)+'\')">' +
      _esc(t.shortName||t.label) + '</th>';
  }).join('');
  var meetingColCount = _pbMeetingTypeDefs.length;

  var startIdx = (_pbPage - 1) * _pbPageSize;
  var pageRows = _pbFiltered.slice(startIdx, startIdx + _pbPageSize);

  var tableRows = pageRows.map(function(r) {
    var vaCell = (r.activeRegular + r.activeProjectBased)
      ? '<span style="font-weight:700;">'+(r.activeRegular+r.activeProjectBased)+'</span> <span style="font-size:10px;color:var(--text-muted);">('+r.activeRegular+' Reg, '+r.activeProjectBased+' Proj)</span>'
      : '<span style="color:var(--border);">0</span>';

    // ── First Payment cell — shows date (or ⏳ Unpaid) + a hover pencil-plus
    // button that opens a compact date editor. Edits write back to the Customer
    // sheet's PaymentDate / NoPaymentYet fields without a full page refresh.
    var paymentDisplay = r.noPaymentYet ? '⏳ Unpaid' : (r.firstPayment ? _fdate(r.firstPayment) : '—');
    var paymentDateVal = r.firstPayment ? r.firstPayment.substring(0,10) : '';
    var paymentCell =
      '<div class="pb-edit-cell">' +
        '<span class="muted">'+paymentDisplay+'</span>' +
        '<button class="pb-edit-btn" title="Edit first payment date"' +
          ' onclick="pbOpenPaymentEdit(\''+_esc(r.customerId)+'\',\''+paymentDateVal+'\','+r.noPaymentYet+')">✎</button>' +
      '</div>';

    // ── Seller Onboarding cell — shows the onboarding date from the first
    // New service request + a hover edit button. Shows a ⚠ critical icon
    // when no New service request exists at all (the date can't be set until
    // the SR is created). When a requestId IS available, the edit opens a
    // date picker that patches SellerOnboardingDate on that specific SR.
    var onboardingCell;
    if (!r.hasNewSR) {
      onboardingCell =
        '<div class="pb-edit-cell" title="No \'New\' service request found for this account. Create one to set the seller onboarding date.">' +
          '<span style="color:#f59e0b;font-size:13px;">⚠</span>' +
          '<span style="font-size:11px;color:#f59e0b;margin-left:3px;">No SR</span>' +
        '</div>';
    } else {
      var onboardDateVal = r.sellerOnboarding ? r.sellerOnboarding.substring(0,10) : '';
      onboardingCell =
        '<div class="pb-edit-cell">' +
          '<span class="muted">'+(r.sellerOnboarding ? _fdate(r.sellerOnboarding) : '—')+'</span>' +
          '<button class="pb-edit-btn" title="Edit seller onboarding date"' +
            ' onclick="pbOpenOnboardingEdit(\''+_esc(r.firstRequestId)+'\',\''+onboardDateVal+'\')">✎</button>' +
        '</div>';
    }

    var payCell =
      '<td style="text-align:center;width:72px;" title="' +
        (r.hasStartedVA
          ? 'Days from first payment to first SR target start date'
          : 'Days from first payment to today (VA not yet started)') + '">' +
        _pbDayCell(r.daysSincePayment) +
      '</td>';
    var workCell =
      '<td style="text-align:center;width:72px;" title="Days since first SR target start date">' +
        _pbDayCell(r.daysSinceWorkStart) +
      '</td>';

    // ── Meeting cells — each cell is clickable and opens mtgOpenModal
    // with the meeting's ID. The modal is defined in scripts-va-ops.html
    // and is in the same global scope.
    var meetingCells = (r.meetingCols||[]).map(function(m) {
      if (!m.scheduledDate) return '<td style="text-align:center;" class="muted">—</td>';
      var sched = new Date(m.scheduledDate);
      var isPast = sched < new Date();
      var overdue = isPast && (m.status === 'Upcoming' || m.status === 'Rescheduled');
      var displayStatus = overdue ? 'Overdue' : m.status;
      var stCls = m.status === 'Completed' ? 'badge-active' : m.status === 'Cancelled' ? 'badge-inactive' : overdue ? 'badge-terminated' : 'badge-pending';
      var clickable = m.meetingId ? ' style="text-align:center;white-space:nowrap;cursor:pointer;" onclick="mtgOpenModal(\''+_esc(m.meetingId)+'\')" title="View meeting details"' : ' style="text-align:center;white-space:nowrap;"';
      return '<td'+clickable+'>' +
        '<div class="muted" style="font-size:11px;">'+_fdate(m.scheduledDate)+'</div>' +
        '<span class="badge '+stCls+'" style="font-size:9.5px;">'+_esc(displayStatus||'—')+'</span>' +
      '</td>';
    }).join('');

    var cadenceBadge = r.cadenceIsOverdue
      ? '<span class="badge badge-terminated" style="font-size:10px;">⚠ '+r.cadenceOverdueCount+' Overdue</span>'
      : '<span class="badge badge-active" style="font-size:10px;">On Track</span>';

    var csCell = r.csName
      ? '<div style="font-weight:600;font-size:12.5px;">'+_esc(r.csName)+'</div>' +
        '<div style="font-size:11px;color:var(--text-muted);">'+_esc(r.csEmail||r.csAssigned||'')+'</div>'
      : '<div class="pb-edit-cell">' +
          '<span class="muted" style="font-size:12px;">—</span>' +
          '<button class="pb-edit-btn" title="Assign CS Specialist"' +
            ' onclick="pbOpenAssignCS(\''+_escJs(r.customerId)+'\',\''+_escJs(r.companyName||r.customerName)+'\')">+</button>' +
        '</div>';

    var channelCell =
      '<div class="pb-contact-cell" data-cid="'+_esc(r.clientId)+'" data-cname="'+_esc(r.companyName||r.customerName)+'">' +
        '<span class="muted pb-channel-label">'+_esc(r.lastContactChannel||'—')+'</span>' +
        ' <button class="pb-add-contact-btn" title="Log a contact event" onclick="pbOpenContactLog(\''+_escJs(r.clientId)+'\',\''+_escJs(r.companyName||r.customerName)+'\')">+</button>' +
      '</div>';

    return '<tr>' +
      '<td class="pb-sticky-col"><a href="#" onclick="navigate(\'customer-profile\',\''+_esc(r.customerId)+'\');return false;" style="color:var(--accent);font-weight:600;">'+_esc(r.customerName||r.companyName)+'</a>' +
        (r.companyName && r.companyName !== r.customerName ? '<div style="font-size:11px;color:var(--text-muted);">'+_esc(r.companyName)+(r.accountName?' — '+_esc(r.accountName):'')+'</div>' : (r.accountName ? '<div style="font-size:11px;color:var(--text-muted);">'+_esc(r.accountName)+'</div>' : '')) + '</td>' +
      '<td>'+csCell+'</td>' +
      '<td>'+paymentCell+'</td>' +
      '<td>'+onboardingCell+'</td>' +
      payCell +
      workCell +
      '<td>'+vaCell+'</td>' +
      '<td>'+channelCell+'</td>' +
      '<td class="muted">'+(r.lastContactDate?_fdate(r.lastContactDate):'—')+'</td>' +
      '<td>'+_pbDayCell(r.daysSinceLastContact)+'</td>' +

function pbSaveContactLog(clientId) {
  var channel = (document.getElementById('pbLogChannel')||{}).value || '';
  var dateVal = (document.getElementById('pbLogDate')||{}).value || '';
  var notes   = (document.getElementById('pbLogNotes')||{}).value || '';
  var errEl   = document.getElementById('pbLogErr');
  if (!channel) { if (errEl) errEl.textContent = 'Channel is required.'; return; }
  if (!dateVal) { if (errEl) errEl.textContent = 'Date is required.'; return; }
  if (errEl) errEl.textContent = '';

  var btn = document.getElementById('pbLogSaveBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) {
        var msg = (res && res.error) || 'Save failed.';
        if (errEl) errEl.textContent = msg;
        showToast(msg, 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Save Log'; }
        return;
      }
      closeModal();
      showToast('Contact logged — "'+channel+'" on '+dateVal+'.', 'success');
      // Update the in-memory record immediately so the table refreshes
      // without a full reload (the next refresh will pull from the sheet).
      _pbAccounts.forEach(function(r) {
        if (r.clientId === clientId) {
          r.lastContactChannel = channel;

// Generic CSV export, per the request — every audit section uses this
// same helper instead of duplicating CSV-building logic per section.
// columns: array of {key, label} — key supports dot-path (e.g. 'a.b').
function _auditExportCsv(rows, columns, filename) {
  if (!rows || !rows.length) { showToast('Nothing to export — this section is empty.', 'info'); return; }
  function getVal(row, key) {
    return key.split('.').reduce(function(o, k){ return (o === null || o === undefined) ? '' : o[k]; }, row);
  }
  function csvEscape(v) {
    v = (v === null || v === undefined) ? '' : String(v);
    return (v.indexOf(',') !== -1 || v.indexOf('"') !== -1 || v.indexOf('\n') !== -1) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  var lines = [columns.map(function(c){ return csvEscape(c.label); }).join(',')];
  rows.forEach(function(row) {
    lines.push(columns.map(function(c){ return csvEscape(getVal(row, c.key)); }).join(','));
  });
  var blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  var link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast('Exported ' + rows.length + ' row' + (rows.length !== 1 ? 's' : '') + ' to ' + filename, 'success');
}
