// ── Status timeline modal — works for both Customers and Accounts ──────
function auditOpenEntityTimeline(entityType, entityId) {
  openModal(_loadingModal('220px', 'Loading timeline…'));
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { closeModal(); showToast((res && res.error) || 'Failed to load timeline.', 'error'); return; }
      _auditRenderTimelineModal(res);
    })
    .withFailureHandler(function(err) { closeModal(); showToast(err.message, 'error'); })
    .getEntityAuditTimeline(entityType, entityId);
}

function _auditRenderTimelineModal(res) {
  var entity = res.entity;
  var timeline = res.timeline || [];
  var badgeCls = 'badge badge-' + (entity.status || '').toLowerCase();

  var TYPE_COLORS = {
    'Added': '#6b7280', 'Became Active': '#10b981', 'Reactivated': '#10b981',
    'Resumed': '#3b82f6', 'Paused': '#f59e0b', 'Terminated': '#ef4444', 'Cancelled': '#ef4444'
  };

  var timelineHtml = timeline.length
    ? timeline.map(function(ev) {
        var color = TYPE_COLORS[ev.type] || '#6b7280';
        return '<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-light);">' +
          '<div style="width:9px;height:9px;border-radius:50%;background:' + color + ';margin-top:5px;flex-shrink:0;"></div>' +
          '<div style="flex:1;">' +
            '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
              '<span style="font-weight:700;font-size:13px;color:' + color + ';">' + _esc(ev.type) + '</span>' +
              '<span style="font-size:12px;color:var(--text-muted);">' + _fdate(ev.date) + '</span>' +
              (ev.manual ? '<span class="badge" style="font-size:9.5px;background:var(--surface-2);color:var(--text-muted);">Manually backfilled</span>' : '') +
              (!ev.manual && ev.source === 'log' ? '<span class="badge" style="font-size:9.5px;background:var(--surface-2);color:var(--text-muted);">From Activity Log</span>' : '') +
            '</div>' +
            (ev.reason ? '<div style="font-size:12.5px;color:var(--text-secondary);margin-top:2px;">' + _esc(ev.reason) + '</div>' : '') +
            (ev.by ? '<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">by ' + _esc(ev.by) + '</div>' : '') +
          '</div>' +
        '</div>';
      }).join('')
    : '<div class="empty-state" style="padding:24px;"><h3 style="font-size:13.5px;">No history recorded</h3></div>';

  // Chronology issues. added_after_activated is auto-fixable (align Added
  // to the Activated date); terminated_before_activated isn't — there's no
  // single unambiguous fix (could mean the Terminated date OR the Activated
  // date is wrong), so that one stays informational-only.
  var chronologyIssues = (res.issues || []).filter(function(iss){
    return iss.code === 'added_after_activated' || iss.code === 'terminated_before_activated';
  });
  var alerts = chronologyIssues.map(function(iss) {
    var fixBtn = iss.code === 'added_after_activated'
      ? '<button class="btn btn-secondary btn-sm" data-etype="' + _esc(entity.entityType) + '" data-eid="' + _esc(entity.entityId) + '" onclick="auditFixAddedDate(this.dataset.etype,this.dataset.eid)">Set Added Date = Activated Date</button>'
      : '';
    return '<div style="background:var(--danger-light);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:10px;font-size:12.5px;">' +
      '<div style="color:var(--danger);font-weight:600;margin-bottom:4px;">⚠ Date order issue</div>' +
      '<div style="color:var(--text-secondary);margin-bottom:' + (fixBtn ? '8px' : '0') + ';">' + _esc(iss.message) + '</div>' +
      fixBtn +
    '</div>';
  }).join('');

  // Completeness gaps — each gets a "+ Add" backfill action
  if (res.missingActivated) {
    alerts += '<div style="background:var(--danger-light);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:10px;font-size:12.5px;">' +
      '<div style="color:var(--danger);font-weight:600;margin-bottom:6px;">⚠ Activated date missing</div>' +
      '<div style="color:var(--text-secondary);margin-bottom:8px;">This record is (or was) Active/Paused/Terminated, but there\'s no recorded date for when it first became Active.</div>' +
      '<button class="btn btn-secondary btn-sm" data-etype="' + _esc(entity.entityType) + '" data-eid="' + _esc(entity.entityId) + '" onclick="auditPromptBackfill(this.dataset.etype,this.dataset.eid,\'Activated\')">+ Add Activated Date</button>' +
    '</div>';
  }
  if (res.missingPaused) {
    alerts += '<div style="background:var(--danger-light);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:10px;font-size:12.5px;">' +
      '<div style="color:var(--danger);font-weight:600;margin-bottom:6px;">⚠ Paused date missing</div>' +
      '<div style="color:var(--text-secondary);margin-bottom:8px;">Status is Paused, but there\'s no recorded date for when it was paused.</div>' +
      '<button class="btn btn-secondary btn-sm" data-etype="' + _esc(entity.entityType) + '" data-eid="' + _esc(entity.entityId) + '" onclick="auditPromptBackfill(this.dataset.etype,this.dataset.eid,\'Paused\')">+ Add Paused Date</button>' +
    '</div>';
  }
  if (res.missingTerminated) {
    alerts += '<div style="background:var(--danger-light);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:10px;font-size:12.5px;">' +
      '<div style="color:var(--danger);font-weight:600;margin-bottom:6px;">⚠ Terminated date missing</div>' +
      '<div style="color:var(--text-secondary);margin-bottom:8px;">Status is Terminated, but there\'s no recorded date for when it was terminated.</div>' +
      '<button class="btn btn-secondary btn-sm" data-etype="' + _esc(entity.entityType) + '" data-eid="' + _esc(entity.entityId) + '" onclick="auditPromptBackfill(this.dataset.etype,this.dataset.eid,\'Terminated\')">+ Add Terminated Date</button>' +
    '</div>';
  }
  if (res.missingResume) {
    alerts += '<div style="background:var(--danger-light);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:10px;font-size:12.5px;">' +
      '<div style="color:var(--danger);font-weight:600;margin-bottom:6px;">⚠ Resumed date missing</div>' +
      '<div style="color:var(--text-secondary);margin-bottom:8px;">This record was Paused, then later Terminated, with no "Resumed" event recorded in between.</div>' +
      '<button class="btn btn-secondary btn-sm" data-etype="' + _esc(entity.entityType) + '" data-eid="' + _esc(entity.entityId) + '" onclick="auditPromptBackfill(this.dataset.etype,this.dataset.eid,\'Resumed\')">+ Add Resumed Date</button>' +
    '</div>';
  }

  openModal(
    '<div class="modal-header">' +
      '<div><div class="modal-title">' + _esc(entity.entityName || entity.entityId) + '</div>' +
        '<span class="' + badgeCls + '" style="font-size:10.5px;">' + _esc(entity.status || '—') + '</span> ' +
        '<span class="badge" style="font-size:10.5px;background:var(--surface-2);color:var(--text-muted);">' + _esc(entity.entityType) + '</span>' +
      '</div><button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button>' +
    '</div>' +
    '<div class="modal-body" style="max-height:65vh;overflow-y:auto;">' +
      alerts +
      '<div style="font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Status Timeline</div>' +
      timelineHtml +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Close</button>' +
      (entity.entityType === 'Customer'
        ? '<button class="btn btn-ghost btn-sm" data-eid="' + _esc(entity.entityId) + '" onclick="custOpenModal(this.dataset.eid)">View Full Profile →</button>'
        : '') +
    '</div>'
  );
}

// ── Backfill prompt (date input) — covers all four completeness gaps ────
function auditPromptBackfill(entityType, entityId, eventType) {
  var labels = { Activated: 'Activated', Paused: 'Paused', Terminated: 'Terminated', Resumed: 'Resumed' };
  var label = labels[eventType] || eventType;
  openModal(
    '<div class="modal-header"><div class="modal-title">Add ' + _esc(label) + ' Date</div>' +
      '<button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button></div>' +
    '<div class="modal-body">' +
      '<div class="form-group">' +
        '<label class="form-label">Date ' + _esc(label) + ' <span class="required">*</span></label>' +
        '<input class="form-input" type="date" id="auditBackfillDate" />' +
        '<div id="auditBackfillErr" style="color:var(--danger);font-size:12.5px;margin-top:4px;"></div>' +
      '</div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" data-etype="' + _esc(entityType) + '" data-eid="' + _esc(entityId) + '" data-evtype="' + _esc(eventType) + '" onclick="auditDoBackfill(this.dataset.etype,this.dataset.eid,this.dataset.evtype,this)">Save</button></div>'
  );
  setTimeout(function(){ var el=document.getElementById('auditBackfillDate'); if(el) el.focus(); }, 50);
}

function auditDoBackfill(entityType, entityId, eventType, btn) {
  var dateVal = ((document.getElementById('auditBackfillDate') || {}).value || '').trim();
  if (!dateVal) {
    var errEl = document.getElementById('auditBackfillErr');
    if (errEl) errEl.textContent = 'Please select a date.';
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  window._auditBackfillEntity = { entityType: entityType, entityId: entityId };
  google.script.run
    .withSuccessHandler(_auditBackfillDone)
    .withFailureHandler(_auditBackfillFailed(btn))
    .addEntityStatusEvent(entityType, entityId, eventType, dateVal);
}
function _auditBackfillDone(res) {
  if (!res || !res.success) { showToast((res && res.error) || 'Failed.', 'error'); return; }
  showToast('Date added.', 'success');
  closeModal();
  var ent = window._auditBackfillEntity;
  if (ent) auditOpenEntityTimeline(ent.entityType, ent.entityId);
  // Also refresh the overview list in the background so the flag clears there too
  if (_auditData) _renderAuditPage(document.getElementById('pageView'));
}
function _auditBackfillFailed(btn) {
  return function(err) {
    showToast(err.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Save'; }
  };
}

// ── Fix: align Added date to the Activated date ─────────────────────────
// One-click resolution for the "Added after Activated" chronology issue —
// no date-entry prompt needed since the correct value (the Activated date)
// is already known; this just applies it.
function auditFixAddedDate(entityType, entityId) {
  if (!confirm('Set the Added date to match the Activated date? This overwrites the current Added date.')) return;
  window._auditBackfillEntity = { entityType: entityType, entityId: entityId };
  google.script.run
    .withSuccessHandler(_auditBackfillDone)
    .withFailureHandler(function(err){ showToast(err.message, 'error'); })
    .fixEntityAddedDate(entityType, entityId);
}
</script>
