<script>


// ═══════════════════════════════════════════════════════════
// CUSTOMER / ACCOUNT REPORT v3
// ═══════════════════════════════════════════════════════════
var _caData   = null;
var _caEntity = 'clients';
var _caGroup  = 'department';

// Group 1: current-state snapshot for the month.
var CA_METRICS_SNAPSHOT = [
  { key:'active',    label:'Active'    },
  { key:'paused',    label:'Paused'    },
  { key:'churned',   label:'Churned',  color:'#ef4444' }
];
// Group 2: things that happened during the month.
var CA_METRICS_ACTIVITY = [
  { key:'newRec',     label:'New'        },
  { key:'returning',  label:'Returning'  },
  { key:'resuming',   label:'Resuming'   },
  { key:'cancelled',  label:'Cancelled', color:'#f59e0b' },
  { key:'terminated', label:'Terminated (TOC)',color:'#ef4444' },
  { key:'eoc',        label:'End of Contract (EOC)',color:'#ef4444' },
  { key:'disconnectedVAs', label:'Disconnected VAs',color:'#ef4444' }
];
// Flat list — kept for "Group By Metric" mode and the chart, which don't
// care about the snapshot/activity split.
var CA_METRICS = CA_METRICS_SNAPSHOT.concat(CA_METRICS_ACTIVITY);
// Shown only in the "(All)" department section/row — see _caMDesc and the
// allDeptOnly check in caRender — since an account with zero active VAs
// has no department to be grouped under in the first place.
var CA_METRIC_NO_ACTIVE_VA = { key:'noActiveVA', label:'No Active VA' };


// ══════════════════════════════════════════════════════════════
// HEADCOUNT REPORT
// ══════════════════════════════════════════════════════════════
var _hcEntity = 'clients';   // 'clients' (Accounts) or 'customers'
var _hcGroupBy = 'status';   // 'status' or 'manager' (account managers / specialist)
var _hcData = null;
var _hcMonths = 6;

function _renderHeadcountReport(container) {
  var now = new Date();
  var defMonth = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');

  container.innerHTML =
    '<div class="ca-report">' +
      '<div style="margin-bottom:18px;">' +
        '<div style="font-size:22px;font-weight:800;letter-spacing:-0.3px;color:var(--text-primary);">Headcount Report</div>' +
        '<div style="font-size:13px;color:var(--text-muted);margin-top:3px;">Active, paused, and terminated headcount trend over time</div>' +
      '</div>' +

      '<div class="ca-filter-bar">' +
        '<div class="dash-date-group"><label class="dash-ctrl-label">View</label>' +
          '<div class="dash-seg-group" id="hcEntityTabs">' +
            '<button class="dash-seg active" onclick="hcSetEntity(this,\'clients\')">Accounts</button>' +
            '<button class="dash-seg"        onclick="hcSetEntity(this,\'customers\')">Customers</button>' +
          '</div>' +
        '</div>' +
        '<div class="dash-date-group"><label class="dash-ctrl-label">Group By</label>' +
          '<div class="dash-seg-group" id="hcGroupTabs">' +
            '<button class="dash-seg active" onclick="hcSetGroup(this,\'status\')">Status</button>' +
            '<button class="dash-seg"        onclick="hcSetGroup(this,\'manager\')">Account Manager</button>' +
          '</div>' +
        '</div>' +
        '<div class="ca-filter-divider"></div>' +
        '<div class="dash-date-group"><label class="dash-ctrl-label">As of Month</label>' +
          '<input type="month" id="hcMonth" class="ca-month-input" value="' + defMonth + '" />' +
        '</div>' +
        '<div class="dash-date-group"><label class="dash-ctrl-label">Trend Window</label>' +
          '<select class="form-select" id="hcMonthsBack" style="height:32px;font-size:12.5px;width:auto;">' +
            '<option value="3">Last 3 months</option>' +
            '<option value="6" selected>Last 6 months</option>' +
            '<option value="12">Last 12 months</option>' +
          '</select>' +
        '</div>' +
        '<div style="display:flex;gap:8px;align-self:flex-end;">' +
          '<button class="btn btn-primary btn-sm" onclick="hcRefresh()">Apply</button>' +
          '<button class="btn btn-secondary btn-sm" id="hcExportBtn" onclick="hcExportCSV()" disabled>Export CSV</button>' +
        '</div>' +
      '</div>' +

      '<div id="hcBody" style="margin-top:20px;">' +
        '<div class="loading-screen" style="height:300px;"><div class="loader-ring"></div><p>Building report…</p></div>' +
      '</div>' +
    '</div>';

  hcRefresh();
}

function hcSetEntity(btn, ent) {
  document.querySelectorAll('#hcEntityTabs .dash-seg').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  _hcEntity = ent;
  hcRefresh();
}

function hcSetGroup(btn, grp) {
  document.querySelectorAll('#hcGroupTabs .dash-seg').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  _hcGroupBy = grp;
  if (_hcData) hcRender(_hcData);
}

function hcRefresh() {
  var body = document.getElementById('hcBody');
  var btn  = document.getElementById('hcExportBtn');
  if (body) body.innerHTML = '<div class="loading-screen" style="height:300px;"><div class="loader-ring"></div><p>Building report…</p></div>';
  if (btn)  btn.disabled = true;

  var monthsSel = document.getElementById('hcMonthsBack');
  _hcMonths = monthsSel ? parseInt(monthsSel.value, 10) : 6;

  if (_hcEntity === 'clients') {
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) { if (body) body.innerHTML = '<div class="empty-state"><h3>Could not load data</h3></div>'; return; }
        _hcData = { entity: 'clients', rows: res.data || [] };
        hcRender(_hcData);
        if (btn) btn.disabled = false;
      })
      .withFailureHandler(function(err) { if (body) body.innerHTML = '<div class="empty-state"><h3>Error</h3><p>'+_esc(err.message)+'</p></div>'; })
      .getClients({});
  } else {
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) { if (body) body.innerHTML = '<div class="empty-state"><h3>Could not load data</h3></div>'; return; }
        _hcData = { entity: 'customers', rows: res.data || [] };
        hcRender(_hcData);
        if (btn) btn.disabled = false;
      })
      .withFailureHandler(function(err) { if (body) body.innerHTML = '<div class="empty-state"><h3>Error</h3><p>'+_esc(err.message)+'</p></div>'; })
      .getCustomers({});
  }
}

// Build an array of {ym, label} for the last N months ending at the selected "As of Month"
function _hcMonthRange() {
  var monthEl = document.getElementById('hcMonth');
  var asOf = monthEl && monthEl.value ? monthEl.value : null;
  var endDate = asOf ? new Date(asOf + '-01T00:00:00') : new Date();
  var months = [];
  for (var i = _hcMonths - 1; i >= 0; i--) {
    var d = new Date(endDate.getFullYear(), endDate.getMonth() - i, 1);
    var ym = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    var label = d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
    months.push({ ym: ym, label: label, endOfMonth: new Date(d.getFullYear(), d.getMonth()+1, 0, 23,59,59) });
  }
  return months;
}

// A record is "active as of" a given end-of-month date if:
//  - createdAt <= that date, AND
//  - it has not been terminated/cancelled before that date (best-effort using statusDate when present)
function _hcIsActiveAsOf(row, asOfDate) {
  var created = row.createdAt ? new Date(row.createdAt) : null;
  if (created && created > asOfDate) return false; // didn't exist yet
  var status = (row.status || '').toLowerCase();
  if (status === 'terminated' || status === 'cancelled') {
    var statusDate = row.statusDate ? new Date(row.statusDate) : null;
    // If we know when it was terminated and that date is after asOfDate, it was still active then
    if (statusDate && statusDate > asOfDate) return true;
    if (!statusDate) return false; // unknown date — assume already terminated
    return false;
  }
  return true; // Active, Pending, Paused, Returning all count as "on the books"
}

function hcRender(data) {
  var body = document.getElementById('hcBody'); if (!body) return;
  var rows = data.rows || [];
  var months = _hcMonthRange();
  var entityLabel = data.entity === 'clients' ? 'Accounts' : 'Customers';

  // ── Trend: total headcount (non-terminated) at the end of each month
  var trendCounts = months.map(function(m) {
    return rows.filter(function(r){ return _hcIsActiveAsOf(r, m.endOfMonth); }).length;
  });

  // ── Current snapshot (as of the selected/most-recent month) — status breakdown
  var lastMonth = months[months.length - 1];
  var snapshotRows = rows.filter(function(r){ return _hcIsActiveAsOf(r, lastMonth.endOfMonth) || true; });
  // Status buckets computed from CURRENT status field (true current state, not historical)
  var statusBuckets = {};
  rows.forEach(function(r) {
    var st = r.status || 'Unknown';
    statusBuckets[st] = (statusBuckets[st] || 0) + 1;
  });
  var statusOrder = ['Active','Pending','Paused','Returning','Inactive','Terminated','Cancelled'];
  var statusKeys = Object.keys(statusBuckets).sort(function(a,b){
    var ai = statusOrder.indexOf(a); var bi = statusOrder.indexOf(b);
    return (ai<0?99:ai) - (bi<0?99:bi);
  });

  // ── Group breakdown (by Account Manager or by Status) — current snapshot only
  var groupBuckets = {};
  var activeRows = rows.filter(function(r){ return (r.status||'').toLowerCase() === 'active'; });
  if (_hcGroupBy === 'manager') {
    activeRows.forEach(function(r) {
      var mgrField = data.entity === 'clients' ? (r.accountManagers || 'Unassigned') : (r.assignedSpecialist || 'Unassigned');
      // accountManagers can be a comma-separated list — split and count each
      var names = String(mgrField).split(',').map(function(s){return s.trim();}).filter(Boolean);
      if (!names.length) names = ['Unassigned'];
      names.forEach(function(n){ groupBuckets[n] = (groupBuckets[n]||0) + 1; });
    });
  } else {
    statusKeys.forEach(function(st){ groupBuckets[st] = statusBuckets[st]; });
  }
  var groupKeys = Object.keys(groupBuckets).sort(function(a,b){ return groupBuckets[b]-groupBuckets[a]; });

  var totalCount    = rows.length;
  var activeCount    = statusBuckets['Active'] || 0;
  var pausedCount    = statusBuckets['Paused'] || 0;
  var terminatedCount= (statusBuckets['Terminated']||0) + (statusBuckets['Cancelled']||0);

  // ── KPI cards
  var kpiHtml =
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;">' +
      _hcKpiCard('Total ' + entityLabel, totalCount,     '#3b82f6', 'all',        entityLabel) +
      _hcKpiCard('Active',     activeCount,     '#10b981', 'Active',     entityLabel) +
      _hcKpiCard('Paused',     pausedCount,     '#f59e0b', 'Paused',     entityLabel) +
      _hcKpiCard('Terminated', terminatedCount, '#ef4444', 'Terminated', entityLabel) +
    '</div>';

  // ── Trend chart (simple bar chart, no external lib needed)
  var maxTrend = Math.max.apply(null, trendCounts.concat([1]));
  var chartHtml =
    '<div class="section-card" style="margin-bottom:16px;">' +
      '<div class="section-header"><div class="section-title">Headcount Trend</div>' +
        '<div class="section-subtitle">Active ' + entityLabel.toLowerCase() + ' at end of each month — click a bar to view records</div></div>' +
      '<div style="padding:20px 24px;">' +
        '<div style="display:flex;align-items:flex-end;gap:10px;height:160px;">' +
          months.map(function(m, idx) {
            var h = Math.max(4, Math.round((trendCounts[idx] / maxTrend) * 130));
            return '<div class="hc-bar-clickable" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;" data-idx="'+idx+'" onclick="hcOpenMonthDrillDown(this.dataset.idx)">' +
              '<div style="font-size:12px;font-weight:700;color:var(--text-primary);">' + trendCounts[idx] + '</div>' +
              '<div style="width:100%;max-width:42px;height:' + h + 'px;background:linear-gradient(180deg,#3b82f6,#60a5fa);border-radius:4px 4px 0 0;"></div>' +
              '<div style="font-size:11px;color:var(--text-muted);">' + m.label + '</div>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>' +
    '</div>';

  // ── Group breakdown table
  var groupLabel = _hcGroupBy === 'manager' ? 'Account Manager' : 'Status';
  var groupTableHtml =
    '<div class="section-card">' +
      '<div class="section-header"><div class="section-title">Active ' + entityLabel + ' by ' + groupLabel + '</div></div>' +
      '<div class="table-wrap">' +
        '<table class="ca-table">' +
          '<thead><tr><th>' + groupLabel + '</th><th style="text-align:right;">Count</th><th style="text-align:right;">% of Active</th></tr></thead>' +
          '<tbody>' +
            groupKeys.map(function(k) {
              var cnt = groupBuckets[k];
              var pct = activeRows.length ? Math.round((cnt/activeRows.length)*100) : 0;
              return '<tr class="hc-row-clickable" style="cursor:pointer;" data-group="'+_esc(k)+'" onclick="hcOpenGroupDrillDown(this.dataset.group)"><td>' + _esc(k) + '</td><td style="text-align:right;font-weight:700;">' + cnt + '</td>' +
                '<td style="text-align:right;color:var(--text-muted);">' + pct + '%</td></tr>';
            }).join('') +
          '</tbody>' +
        '</table>' +
      '</div>' +
    '</div>';

  body.innerHTML = kpiHtml + chartHtml + groupTableHtml;

  // Cache for export and drill-down modal
  _hcData.months = months;
  _hcData.trendCounts = trendCounts;
  _hcData.groupBuckets = groupBuckets;
  _hcData.groupLabel = groupLabel;
  _hcData.entityLabel = entityLabel;
  _hcData.allRows = rows;       // every row, for "Total" drill-down
  _hcData.activeRows = activeRows; // rows with status === Active, for group drill-down
  _hcData.monthsRef = months;   // for trend-bar drill-down
}

function hcOpenMonthDrillDown(idxStr) {
  if (!_hcData || !_hcData.allRows || !_hcData.monthsRef) { showToast('No data loaded yet.', 'error'); return; }
  var idx = parseInt(idxStr, 10);
  var m = _hcData.monthsRef[idx];
  if (!m) return;
  var filtered = _hcData.allRows.filter(function(r){ return _hcIsActiveAsOf(r, m.endOfMonth); });
  _hcRenderDrillDownModal('Active as of ' + m.label, filtered, _hcData.entityLabel);
}

// ══════════════════════════════════════════════════════════════
// DRILL-DOWN MODAL — shows the underlying records behind a number
// ══════════════════════════════════════════════════════════════
function hcOpenDrillDown(statusFilter, label) {
  if (!_hcData || !_hcData.allRows) { showToast('No data loaded yet.', 'error'); return; }
  var rows = _hcData.allRows;
  var filtered = (statusFilter === 'all')
    ? rows
    : rows.filter(function(r) {
        if (statusFilter === 'Terminated') {
          var st = (r.status||'').toLowerCase();
          return st === 'terminated' || st === 'cancelled';
        }
        return r.status === statusFilter;
      });
  _hcRenderDrillDownModal(label, filtered, _hcData.entityLabel);
}

function hcOpenGroupDrillDown(groupKey) {
  if (!_hcData || !_hcData.activeRows) { showToast('No data loaded yet.', 'error'); return; }
  var groupLabel = _hcData.groupLabel || 'Group';
  var isManagerGroup = groupLabel === 'Account Manager';
  var filtered = _hcData.activeRows.filter(function(r) {
    if (!isManagerGroup) return r.status === groupKey; // grouped by Status
    var mgrField = _hcEntity === 'clients' ? (r.accountManagers || 'Unassigned') : (r.assignedSpecialist || 'Unassigned');
    var names = String(mgrField).split(',').map(function(s){return s.trim();}).filter(Boolean);
    if (!names.length) names = ['Unassigned'];
    return names.indexOf(groupKey) !== -1;
  });
  _hcRenderDrillDownModal(groupLabel + ': ' + groupKey, filtered, _hcData.entityLabel);
}

function _hcRenderDrillDownModal(title, rows, entityLabel) {
  var isClients = entityLabel === 'Accounts';
  var rowsHtml = rows.length
    ? rows.map(function(r) {
        var nameCell = isClients
          ? _esc(r.companyName || r.accountName || r.clientId || '—')
          : _esc(r.customerName || r.customerId || '—');
        var subCell = isClients ? _esc(r.customerName || r.customerId || '') : '';
        var mgrCell = isClients ? _esc(r.accountManagers || '—') : _esc(r.assignedSpecialist || '—');
        var stCls = 'badge-' + String(r.status||'').toLowerCase().replace(/[^a-z]/g,'');
        return '<tr>' +
          '<td style="font-weight:600;">' + nameCell + (subCell ? '<div style="font-size:11px;color:var(--text-muted);">'+subCell+'</div>' : '') + '</td>' +
          '<td><span class="badge ' + stCls + '">' + _esc(r.status||'—') + '</span></td>' +
          '<td style="font-size:12.5px;color:var(--text-secondary);">' + mgrCell + '</td>' +
          '<td class="muted">' + (r.createdAt ? _fdate(r.createdAt) : '—') + '</td>' +
        '</tr>';
      }).join('')
    : '<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text-muted);">No records found.</td></tr>';

  document.getElementById('modalBox').style.maxWidth = '760px';
  openModal(
    '<div class="modal-header">' +
      '<div><div class="modal-title">' + _esc(title) + '</div>' +
        '<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">' + rows.length + ' ' + entityLabel.toLowerCase() + '</div></div>' +
      '<button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button>' +
    '</div>' +
    '<div class="modal-body" style="max-height:60vh;overflow-y:auto;padding:0;">' +
      '<table class="ca-table" style="width:100%;">' +
        '<thead><tr><th>' + (isClients ? 'Account' : 'Customer') + '</th><th>Status</th><th>' + (isClients ? 'Account Manager' : 'Specialist') + '</th><th>Created</th></tr></thead>' +
        '<tbody>' + rowsHtml + '</tbody>' +
      '</table>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>'
  );
}

function _hcKpiCard(label, value, color, statusFilter, entityLabel) {
  return '<div class="section-card hc-kpi-clickable" style="padding:16px 18px;cursor:pointer;" ' +
      'data-status="'+_esc(statusFilter)+'" data-label="'+_esc(label)+'" onclick="hcOpenDrillDown(this.dataset.status,this.dataset.label)">' +
    '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:6px;">' + _esc(label) + '</div>' +
    '<div style="font-size:26px;font-weight:800;color:' + color + ';">' + value + '</div>' +
    '<div style="font-size:10.5px;color:var(--accent);margin-top:4px;">View records →</div>' +
  '</div>';
}

function hcExportCSV() {
  if (!_hcData || !_hcData.months) { showToast('Nothing to export yet.', 'error'); return; }
  var lines = [];
  lines.push(['Month','Headcount'].join(','));
  _hcData.months.forEach(function(m, idx) {
    lines.push([m.label, _hcData.trendCounts[idx]].join(','));
  });
  lines.push('');
  lines.push([_hcData.groupLabel, 'Count'].join(','));
  Object.keys(_hcData.groupBuckets).forEach(function(k) {
    lines.push(['"' + k.replace(/"/g,'""') + '"', _hcData.groupBuckets[k]].join(','));
  });
  var csvContent = lines.join('\n');
  var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url;
  a.download = 'headcount-report-' + _todayStr() + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV exported.', 'success');
}

// ═══════════════════════════════════════════════════════════
// PERFORMANCE REPORT — Jan–Dec × Department(+Total) grid across five
// sections: Customer Accounts, Connections, Hours, KPI Performance
// (placeholder), Retention & Meetings (placeholder).
// ═══════════════════════════════════════════════════════════
var _perfData = null;
var _perfYear = new Date().getFullYear();

function _perfExportExcel() {
  if (!_perfData) { showToast('Report not loaded yet.', 'error'); return; }
  var months = _perfData.months, monthLabels = _perfData.monthLabels;
  var depts = _perfData.departments.filter(function(d){ return d !== '(All)'; });
  var allCols = depts.concat(['Total']);
  var cols = _perfColumnFilter ? allCols.filter(function(c){ return _perfColumnFilter.indexOf(c) !== -1; }) : allCols;
  if (!cols.length) cols = ['Total'];

  // Same value logic as the on-screen table's dataCell, just returning a
  // raw number instead of building HTML — Total is a sum for Connections
  // (a connection only ever belongs to one department) but the
  // deduplicated "(All)" bucket for Customer Accounts (a customer can have
  // accounts across departments, and summing would double-count them).
  function cellValue(section, dept, ym, rowKey) {
    if (section.empty) return '';
    var isTotal = dept === 'Total';
    if (isTotal && !section.dedup && section.source !== 'hours') {
      var sum = 0;
      depts.forEach(function(d){
        var md = _perfData[section.source] && _perfData[section.source][ym];
        var v = md && md.data && md.data[d] ? md.data[d][rowKey] : 0;
        sum += (typeof v === 'number' ? v : 0);
      });
      return sum;
    }
    var lookupDept = (isTotal && section.dedup) ? '(All)' : dept;
    var monthData = _perfData[section.source] && _perfData[section.source][ym];
    var raw = monthData && monthData.data && monthData.data[lookupDept] ? monthData.data[lookupDept][rowKey] : '';
    return (raw === undefined || raw === null) ? '' : raw;
  }

  // Two-row header: month names spanning columns, then column names
  var row1 = ['', ''], row2 = ['Section', 'Row'];
  months.forEach(function(ym, i) {
    row1.push(monthLabels[i]);
    for (var k = 1; k < cols.length; k++) row1.push('');
    cols.forEach(function(c){ row2.push(c); });
  });
  var headerRows = [row1, row2];

  var dataRows = [];
  PERF_SECTIONS.forEach(function(section) {
    dataRows.push(['§ ' + section.title]);
    function pushRow(row, indent) {
      if (row.divider) { dataRows.push(['  ' + (row.label||'')]); return; }
      var line = [(indent?'  ':'') + row.label];
      months.forEach(function(ym) {
        cols.forEach(function(c) {
          if (row.allOnly && c !== 'Total') { line.push(''); return; }
          line.push(cellValue(section, c, ym, row.key));
        });
      });
      dataRows.push(line);
      (row.sub||[]).forEach(function(sr){ pushRow(sr, true); });
    }
    section.rows.forEach(function(row){ pushRow(row, false); });
  });

  showToast('Preparing Excel export…', 'info');
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { showToast((res&&res.error)||'Export failed.', 'error'); return; }
      var link = document.createElement('a');
      link.href = 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,' + res.base64;
      link.download = res.fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('Export ready.', 'success');
    })
    .withFailureHandler(function(err) { showToast(err.message, 'error'); })
    .exportPerformanceReportToExcel(_perfYear, headerRows, dataRows);
}

// Per the request — a standalone Termination Reasons breakdown. Opens a

// "Scheduled" = meetings originally due this month (based on
// OriginalScheduledDate, falling back to ScheduledDate) — a meeting that
// got rescheduled still counts toward the month it was originally due.
// "Actual" = how many of those same meetings are now marked Completed,
// regardless of which month the completion itself happened in.
function _perfRenderMeetingsReport(months) {
  var wrap = document.getElementById('perfMeetingsSection'); if (!wrap) return;
  var totalScheduled = months.reduce(function(s,m){ return s + m.scheduled; }, 0);
  var totalScheduledByCust = months.reduce(function(s,m){ return s + (m.scheduledByCustomer||0); }, 0);
  var totalActual = months.reduce(function(s,m){ return s + m.actual; }, 0);
  var totalRate = totalScheduled ? Math.round((totalActual/totalScheduled)*100) : 0;

  wrap.innerHTML =
    '<div class="section-card">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">' +
        '<div style="font-size:15px;font-weight:800;">Account Meetings — Scheduled vs Actual</div>' +
        '<div style="font-size:12.5px;color:var(--text-muted);">'+totalActual+' of '+totalScheduled+' conducted ('+totalRate+'%)</div>' +
      '</div>' +
      '<div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">Scheduled reflects each meeting\'s originally-due month, even if it was later rescheduled. Per Customer counts a customer once per month even if multiple of their VA connections each have a meeting scheduled that month. Actual counts meetings ultimately marked Completed.</div>' +
      '<div class="table-wrap"><table>' +
        '<thead><tr><th>Month</th>' + months.map(function(m){ return '<th style="text-align:center;">'+m.month+'</th>'; }).join('') + '<th style="text-align:center;font-weight:800;">Total</th></tr></thead>' +
        '<tbody>' +
          '<tr><td style="font-weight:600;">Scheduled (Per VA Connection)</td>' +
            months.map(function(m){ return '<td style="text-align:center;">'+m.scheduled+'</td>'; }).join('') +
            '<td style="text-align:center;font-weight:800;">'+totalScheduled+'</td></tr>' +
          '<tr><td style="font-weight:600;">Scheduled (Per Customer)</td>' +
            months.map(function(m){ return '<td style="text-align:center;">'+(m.scheduledByCustomer||0)+'</td>'; }).join('') +
            '<td style="text-align:center;font-weight:800;">'+totalScheduledByCust+'</td></tr>' +
          '<tr><td style="font-weight:600;">Actual (Conducted)</td>' +
            months.map(function(m){ return '<td style="text-align:center;color:#059669;font-weight:700;">'+m.actual+'</td>'; }).join('') +
            '<td style="text-align:center;font-weight:800;color:#059669;">'+totalActual+'</td></tr>' +
          '<tr><td style="font-weight:600;">Completion Rate</td>' +
            months.map(function(m){
              var rate = m.scheduled ? Math.round((m.actual/m.scheduled)*100) : null;
              var color = rate === null ? 'var(--text-muted)' : rate >= 80 ? '#059669' : rate >= 50 ? '#d97706' : '#dc2626';
              return '<td style="text-align:center;color:'+color+';font-weight:700;">'+(rate===null?'—':rate+'%')+'</td>';
            }).join('') +
            '<td style="text-align:center;font-weight:800;">'+totalRate+'%</td></tr>' +
        '</tbody>' +
      '</table></div>' +
    '</div>';
}

      '<a href="#" onclick="_perfColumnFilter=[\'Total\'];_perfRender();return false;" style="font-size:11.5px;color:var(--accent);">Total Only</a>' +
    '</div>' +
    allCols.map(function(c) {
      var checked = selected.indexOf(c) !== -1;
      return '<label style="display:flex;align-items:center;gap:6px;padding:4px 2px;font-size:12.5px;cursor:pointer;'+(c==='Total'?'font-weight:700;':'')+'">' +
        '<input type="checkbox" data-col="'+_esc(c)+'" '+(checked?'checked':'')+' onchange="_perfToggleColumn(this)" /> '+_esc(c) +
      '</label>';
    }).join('');
  pop.style.display = '';
}
function _perfToggleColumn(cb) {
  var depts = (_perfData && _perfData.departments || []).filter(function(d){ return d !== '(All)'; });
  var allCols = depts.concat(['Total']);
  var current = _perfColumnFilter || allCols.slice();
  var col = cb.dataset.col;
  if (cb.checked) { if (current.indexOf(col)===-1) current.push(col); }
  else { current = current.filter(function(c){ return c!==col; }); }
  _perfColumnFilter = current.length ? current : ['Total'];
  _perfRender();
  setTimeout(function(){ _perfToggleColumnPicker(); }, 0);
}
document.addEventListener('click', function(e){
  var pop = document.getElementById('perfColumnPicker');
  if (pop && pop.style.display !== 'none' && !e.target.closest('#perfColumnPicker') && !e.target.closest('button[onclick="_perfToggleColumnPicker()"]')) {
    pop.style.display = 'none';
  }
});

function _perfFmt(v, isPct) {
  if (v === undefined || v === null || v === '' || v === 0) return '<span style="color:var(--border);">—</span>';
  var n = typeof v === 'number' ? v : parseFloat(v);
  if (isNaN(n)) return '<span style="color:var(--border);">—</span>';
  var s = (Math.round(n*10)/10).toString();
  return isPct ? s + '%' : s;
}

function perfToggleSection(key) {
  _perfCollapsedSections[key] = !_perfCollapsedSections[key];
  _perfRender();
}
function perfToggleSubgroup(key) {

  _perfRender();
}

// Generic drill-down — reuses the exact records shape getCustomerAccountReport
// already produces for Customer Accounts/Connections (same as the Customer/
// Account Report's own detail modal), and the {name,amount} records built
// specifically for the Hours section.
function _perfDetail(sectionKey, dept, ym, rowKey, rowLabel, deptLabel) {
  var section = PERF_SECTIONS.find(function(s){ return s.key===sectionKey; });
  if (!section || section.empty) return;
  var lookupDept = (dept === 'Total' && section.dedup) ? '(All)' : dept;
  var monthLabel = (_perfData.monthLabels[_perfData.months.indexOf(ym)]) || ym;

  if (sectionKey === 'hours') {
    var recs = (_perfData.hours.records && _perfData.hours.records[ym] && _perfData.hours.records[ym][dept] && _perfData.hours.records[ym][dept][rowKey]) || [];
    openModal(
      '<div class="modal-header"><div><div class="modal-title">'+_esc(rowLabel)+'</div>' +
        '<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">'+_esc(deptLabel)+' · '+_esc(monthLabel)+' · '+recs.length+' record'+(recs.length!==1?'s':'')+'</div></div>' +
        '<button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>' +
      '<div class="modal-body" style="max-height:60vh;overflow-y:auto;">' +
        (recs.length ? '<table style="width:100%;font-size:13px;"><thead><tr><th style="text-align:center;padding:6px 8px;color:var(--text-muted);font-size:11px;width:30px;">#</th><th style="text-align:left;padding:6px 8px;color:var(--text-muted);font-size:11px;">VA</th><th style="text-align:right;padding:6px 8px;color:var(--text-muted);font-size:11px;">Hours</th></tr></thead><tbody>' +
          recs.map(function(r, idx){ return '<tr style="border-top:1px solid var(--border-light);"><td style="padding:6px 8px;text-align:center;color:var(--text-muted);">'+(idx+1)+'</td><td style="padding:6px 8px;">'+_esc(r.name)+'</td><td style="padding:6px 8px;text-align:right;font-weight:600;">'+r.amount+'h</td></tr>'; }).join('') +
        '</tbody></table>' : '<div class="empty-state" style="padding:24px;"><h3 style="font-size:13.5px;">No records</h3></div>') +
      '</div>'
    );
    document.getElementById('modalBox').style.maxWidth = '900px';
    return;
  }

  // Customer Accounts / Connections — same record shape as _caDetail
  var monthData = _perfData[sectionKey] && _perfData[sectionKey][ym];
  var items;
  if (dept === 'Total' && !section.dedup) {
    // Merge across real departments — Connections' Total is a plain sum,
    // not a deduplicated bucket, so its drill-down is every department's
    // list combined.
    //
    // Real bug fixed here: an account associated with more than one
    // department (e.g. it has an active connection in a different
    // department alongside the one that actually terminated) had its
    // SAME terminated connection pulled into more than one department's
    // own list — so concatenating them all for "Total" showed that exact
    // same connection twice (same Connection ID, same name, same
    // termination date). Deduplicated by Connection ID here — falling
    // back to client/customer ID, then name, for any record that
    // somehow has neither — so each real connection/account only ever
    // appears once in this list, regardless of how many departments it
    // touches. This only changes what this drill-down LIST shows; the
    // on-screen Total count itself is untouched, still the same plain
    // sum it always was.
    items = [];
    var _perfSeenKeys = {};
    (_perfData.departments||[]).filter(function(d){ return d!=='(All)'; }).forEach(function(d){
      var list = monthData && monthData.records && monthData.records[d] && monthData.records[d][rowKey];
      (list||[]).forEach(function(r) {
        var dedupKey = r.connectionId || r.clientId || r.customerId || ((r.customerName||'') + '|' + (r.accountName||r.name||''));
        if (_perfSeenKeys[dedupKey]) return;
        _perfSeenKeys[dedupKey] = true;
        items.push(r);
      });
    });
  } else {
    items = (monthData && monthData.records && monthData.records[lookupDept] && monthData.records[lookupDept][rowKey]) || [];
  }
  var isClients = sectionKey === 'connections';
  var showReason = rowKey === 'churned' || rowKey === 'paused';

  // Per the request — same Copy-for-Excel button as the Customer/Account
  // Report's own drill-down (_caDetail above), reusing its exact copy
  // logic. This modal is fed by getPerformanceReport, which internally
  // calls getCustomerAccountReport and reuses its records verbatim
  // (caRes.monthly.customers/clients) — so the VA-connection-level
  // enrichment added there (Connection ID, VA Name, Department,
  // Position, Start Date, Termination Reason) is already present on
  // these same record objects, just not exposed here until now.
  window._caCurrentDrilldownItems = items;
  window._caCurrentDrilldownIsAcctView = isClients;
  window._caCurrentDrilldownRowKey = rowKey;

  openModal(
    '<div class="modal-header"><div><div class="modal-title">'+_esc(rowLabel)+'</div>' +
      '<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">'+_esc(deptLabel)+' · '+_esc(monthLabel)+' · '+items.length+' record'+(items.length!==1?'s':'')+'</div></div>' +
      '<button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>' +
    '<div class="modal-body" style="max-height:60vh;overflow-y:auto;">' +
      (items.length ? items.map(function(r, cardIdx) {
        var bc = 'badge badge-' + (r.status || '').toLowerCase();
        var fn = isClients ? 'cliOpenModal(\'' + _esc(r.clientId || '') + '\')' : 'custOpenModal(\'' + _esc(r.customerId || '') + '\')';
        // Per the request — Customer/Account/VA always shown for the
        // Connections section, regardless of metric, using the VA-
        // connection-level enrichment from getCustomerAccountReport
        // (Router.gs). Churn/Terminated show that connection's own
        // Termination Date; New shows its Start Date instead — a new
        // connection has no termination to speak of.
        // Per the request — Disconnected VAs lives in the Customer
        // Accounts section (isClients false here), but still needs to
        // show which account the VA was disconnected from, not just the
        // VA's own name. accountName now carries the real "Company —
        // Account" display (Router.gs fix), so this shows it explicitly
        // for this one metric regardless of the section it's in.
        var isDisconnectedVAsRow = (rowKey === 'disconnectedVAs');
        var nameBlock = isClients
          ? '<div style="display:flex;flex-direction:column;gap:1px;">' +
              '<a href="#" onclick="'+fn+';return false;" style="color:var(--accent);font-weight:600;font-size:13px;">'+_esc(r.accountName||r.name||'—')+'</a>' +
              '<span style="font-size:11px;color:var(--text-muted);">'+_esc(r.customerName||'—')+(r.vaName?' · VA: '+_esc(r.vaName):'')+'</span>' +
            '</div>'
          : isDisconnectedVAsRow
          ? '<div style="display:flex;flex-direction:column;gap:1px;">' +
              '<a href="#" onclick="'+fn+';return false;" style="color:var(--accent);font-weight:600;font-size:13px;">'+_esc(r.vaName||r.name||'—')+'</a>' +
              '<span style="font-size:11px;color:var(--text-muted);">'+_esc(r.accountName||'—')+(r.customerName?' · '+_esc(r.customerName):'')+'</span>' +
            '</div>'
          : '<a href="#" onclick="'+fn+';return false;" style="color:var(--accent);font-weight:600;font-size:13px;">'+_esc(r.name||'—')+'</a>';
        var isDepartureRow = (rowKey === 'churned' || rowKey === 'terminated' || rowKey === 'cancelled' || rowKey === 'projectCompleted' || rowKey === 'terminatedReplaced' || rowKey === 'disconnectedVAs');
        var isNewRowEntry = (rowKey === 'newRec');
        var dateLine = '';
        if (isDepartureRow) {
          // Per the request — EOC (another connection remains for this
          // account) vs. TOC (this was the account's last connection,
          // so it Totally left) shown inline. isTOC is only set for
          // genuinely Terminated/Churned/Project Completed connections
          // (Router.gs) — Cancelled/Disconnected VAs don't carry it, so
          // nothing is shown for those rather than a guess.
          var eocTocBadge = r.isTOC === true
            ? ' <span class="badge" style="background:var(--danger-light);color:var(--danger);font-size:10px;vertical-align:middle;">TOC</span>'
            : r.isTOC === false
            ? ' <span class="badge" style="background:var(--surface-2);color:var(--text-muted);font-size:10px;vertical-align:middle;">EOC</span>'
            : '';
          // Per the request — Replacement (whether this termination had
          // a Replacement request created from it) and the Incident
          // Report link (the Termination ticket's own TicketReportLink,
          // or the originating Concern's — see Router.gs), shown inline
          // in the list, not just in the copy output.
          var replacementBadge = r.hadReplacement
            ? ' <span class="badge" style="background:var(--success-light);color:var(--success);font-size:10px;vertical-align:middle;">Replacement</span>'
            : '';
          var irLinkHtml = r.incidentReportLink
            ? ' · <a href="'+_esc(r.incidentReportLink)+'" target="_blank" rel="noopener" style="color:var(--accent);">IR</a>'
            : '';
          dateLine = '<div style="font-size:11.5px;color:var(--text-muted);margin-top:3px;">' +
            'Terminated: ' + (r.connTerminationDate ? _fdate(r.connTerminationDate) : (r.statusDate ? _fdate(r.statusDate) : 'No date on file')) +
            eocTocBadge + replacementBadge + irLinkHtml +
            (r.connTerminationReason || r.reason ? ' — ' + _esc(_extractMainReason(r.connTerminationReason || r.reason)) : (showReason ? ' — no reason on file' : '')) +
          '</div>';
        } else if (isNewRowEntry) {
          dateLine = '<div style="font-size:11.5px;color:var(--text-muted);margin-top:3px;">' +
            'Started: ' + (r.vaStartDate ? _fdate(r.vaStartDate) : 'No date on file') +
          '</div>';
        } else if (showReason) {
          dateLine = '<div style="font-size:11.5px;color:var(--text-muted);margin-top:3px;">'+(r.statusDate?_fdate(r.statusDate):'No date on file')+(r.reason?' — '+_esc(r.reason):' — no reason on file')+'</div>';
        }
        return '<div style="padding:8px 4px;border-bottom:1px solid var(--border-light);">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">' +
            '<div style="display:flex;align-items:center;gap:8px;">' +
              '<span style="color:var(--text-muted);font-size:11.5px;width:20px;flex-shrink:0;">'+(cardIdx+1)+'</span>' +
              nameBlock +
            '</div>' +
            '<span class="'+bc+'" style="font-size:10.5px;">'+_esc(r.status||'—')+'</span>' +
          '</div>' +
          dateLine +
        '</div>';
      }).join('') : '<div class="empty-state" style="padding:24px;"><h3 style="font-size:13.5px;">No records</h3></div>') +
    '</div>' +
    '<div class="modal-footer" style="justify-content:space-between;">' +
      '<button class="btn btn-secondary btn-sm" id="caCopyBtn" onclick="_caCopyDrilldown(this)">📋 Copy for Excel</button>' +
      '<button class="btn btn-secondary" onclick="closeModal()">Close</button>' +
    '</div>'
  );
  // Per the request — wider list view, same treatment as the
  // Termination Reasons modal. closeModal() already resets maxWidth
  // back to default on close.
  document.getElementById('modalBox').style.maxWidth = '900px';
}

function _perfIsFutureMonth(ym) {
  var now = new Date();
  var curYm = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  return ym > curYm;
}

function _perfRender() {
  var body = document.getElementById('perfReportBody'); if (!body || !_perfData) return;
  var months = _perfData.months, monthLabels = _perfData.monthLabels;
  var depts = _perfData.departments.filter(function(d){ return d !== '(All)'; }); // full list — needed for correct Total sums regardless of what's shown
  var allCols = depts.concat(['Total']);
  var cols = _perfColumnFilter ? allCols.filter(function(c){ return _perfColumnFilter.indexOf(c) !== -1; }) : allCols;
  if (!cols.length) cols = ['Total'];
  var COL_W = 56;
  var LABEL_W = 210;

  // ── Header: month labels spanning their department+Total sub-columns
  // (with a visible divider between each month), then a second row naming
  // each sub-column.
  var headerRow1 = '<tr>' +
    '<th class="perf-sticky-col" style="min-width:'+LABEL_W+'px;background:#1e293b;"></th>' +
    months.map(function(ym, i){
      var isFuture = _perfIsFutureMonth(ym);
      return '<th colspan="'+cols.length+'" style="text-align:center;font-size:11.5px;font-weight:700;padding:7px 4px;border-left:2px solid #0f172a;background:'+(isFuture?'#94a3b8':'#1e293b')+';color:#fff;">'+monthLabels[i]+'</th>';
    }).join('') +
  '</tr>';
  var headerRow2 = '<tr>' +
    '<th class="perf-sticky-col" style="background:#1e293b;"></th>' +
    months.map(function(ym){
      var isFuture = _perfIsFutureMonth(ym);
      return cols.map(function(c, ci){
        var isTotal = c === 'Total';
        return '<th style="width:'+COL_W+'px;min-width:'+COL_W+'px;max-width:'+COL_W+'px;font-size:9.5px;font-weight:600;color:'+(isFuture?'#e2e8f0':'#cbd5e1')+';padding:5px 2px;text-align:center;overflow:hidden;text-overflow:ellipsis;background:'+(isFuture?'#94a3b8':(isTotal?'#0f172a':'#1e293b'))+';'+(ci===0?'border-left:2px solid #0f172a;':'border-left:1px solid #334155;')+(isTotal?'font-weight:800;color:#fff;border-left:2px solid #0f172a;':'')+'" title="'+_esc(c)+'">'+_esc(c)+'</th>';
      }).join('');
    }).join('') +
  '</tr>';

  function dataCell(section, dept, ym, rowKey, opts, rowLabel, ci) {
    opts = opts || {};
    var isTotal = dept === 'Total';
    var borderLeft = isTotal ? 'border-left:2px solid #64748b;' : (ci===0 ? 'border-left:2px solid #64748b;' : 'border-left:1px solid #94a3b8;');
    var bg = isTotal ? 'background:#dbeafe;' : '';
    if (_perfIsFutureMonth(ym)) return '<td style="text-align:center;padding:5px 2px;background:#f1f5f9;'+borderLeft+'"><span style="color:#cbd5e1;">·</span></td>';
    if (opts.allOnly && !isTotal) return '<td style="text-align:center;padding:5px 2px;'+borderLeft+bg+'"><span style="color:var(--border);">·</span></td>';
    if (section.empty) return '<td style="text-align:center;padding:5px 2px;font-size:12px;'+borderLeft+bg+'"><span style="color:var(--border);">—</span></td>';
    if (section.source === 'hours' && _perfData.hours && _perfData.hours.success === false) {
      return '<td style="text-align:center;padding:5px 2px;font-size:11px;color:#ef4444;'+borderLeft+bg+'" title="'+_esc(_perfData.hours.error||'')+'">⚠</td>';
    }
    var lookupDept = (isTotal && section.dedup) ? '(All)' : dept;
    var monthData = _perfData[section.source] && _perfData[section.source][ym];
    var raw;
    if (isTotal && !section.dedup) {
      // Sum across real departments — a connection only ever belongs to
      // one department, so summing doesn't double-count the way it would
      // for a customer with accounts spread across multiple departments.
      raw = 0;
      depts.forEach(function(d){
        var v = monthData && monthData.data && monthData.data[d] ? monthData.data[d][rowKey] : 0;
        raw += (typeof v === 'number' ? v : 0);
      });
    } else {
      raw = monthData && monthData.data && monthData.data[lookupDept] ? monthData.data[lookupDept][rowKey] : undefined;
    }
    var display = _perfFmt(raw, opts.pct);
    var color = opts.danger && raw ? 'color:#ef4444;font-weight:600;' : (opts.warn && raw ? 'color:#f59e0b;font-weight:600;' : (opts.auto ? 'color:var(--text-muted);font-style:italic;' : ''));
    var fw = isTotal ? 'font-weight:700;' : '';
    var clickable = raw && !opts.auto;
    var content = clickable
      ? '<a href="#" onclick="_perfDetail(\''+section.key+'\',\''+_esc(dept)+'\',\''+ym+'\',\''+rowKey+'\',\''+_esc((rowLabel||'').replace(/'/g,"\\'"))+'\',\''+_esc(dept)+'\');return false;" style="'+color+fw+'text-decoration:none;">'+display+'</a>'
      : '<span style="'+color+fw+'">'+display+'</span>';
    return '<td style="text-align:center;padding:5px 2px;font-size:12px;'+borderLeft+bg+'">'+content+'</td>';
  }

  function buildRow(row, section, indent, parentCollapsed) {
    var hidden = parentCollapsed ? 'display:none;' : '';
    if (row.divider) {
      return '<tr style="'+hidden+'"><td class="perf-sticky-col" style="padding:8px 12px 4px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-muted);background:'+(row.color||'var(--surface)')+';">'+(row.label||'')+'</td>' +
        months.map(function(i,mi){ return cols.map(function(c,ci){ return '<td style="background:'+(c==='Total'?'#cbd5e1':(row.color||'var(--surface)'))+';'+(ci===0?'border-left:2px solid #64748b;':'border-left:1px solid #94a3b8;')+(c==='Total'?'border-left:2px solid #64748b;':'')+'"></td>'; }).join(''); }).join('') +
      '</tr>';
    }
    var isCollapsedGroup = row.subgroup && _perfCollapsedSubgroups[row.subgroup];
    var labelStyle = indent ? 'padding-left:28px;font-size:11.5px;color:var(--text-secondary);' : 'font-weight:600;font-size:12.5px;';
    if (row.danger) labelStyle += 'color:#ef4444;';
    else if (row.warn) labelStyle += 'color:#f59e0b;';
    else if (row.auto) labelStyle += 'color:var(--text-muted);font-style:italic;';
    var toggleArrow = row.subgroup ? '<span onclick="perfToggleSubgroup(\''+row.subgroup+'\')" style="cursor:pointer;display:inline-block;width:14px;color:var(--text-muted);">'+(isCollapsedGroup?'▸':'▾')+'</span>' : '';
    var mainRow = '<tr style="'+hidden+'">' +
      '<td class="perf-sticky-col" style="'+labelStyle+'padding-top:5px;padding-bottom:5px;">'+toggleArrow+_esc(row.label)+'</td>' +
      months.map(function(ym){
        return cols.map(function(c,ci){ return dataCell(section, c, ym, row.key, row, row.label, ci); }).join('');
      }).join('') +
    '</tr>';
    var subHidden = parentCollapsed || isCollapsedGroup;
    var subRows = (row.sub||[]).map(function(sr){ return buildRow(sr, section, true, subHidden); }).join('');
    return mainRow + subRows;
  }

  var sectionsHtml = PERF_SECTIONS.map(function(section) {
    var collapsed = _perfCollapsedSections[section.key];
    var sectionHeader = '<tr>' +
      '<td class="perf-sticky-col" onclick="perfToggleSection(\''+section.key+'\')" style="cursor:pointer;padding:10px 12px;font-size:13px;font-weight:800;color:#1e293b;background:'+section.color+';">' +
        '<span style="display:inline-block;width:14px;">'+(collapsed?'▸':'▾')+'</span>' + section.title +
        (section.empty?' <span style="font-size:10px;font-weight:400;color:var(--text-muted);font-style:italic;">(no data source yet)</span>':'') +
      '</td>' +
      months.map(function(i,mi){ return cols.map(function(c,ci){ return '<td style="background:'+(c==='Total'?'#94a3b8':section.color)+';'+(ci===0?'border-left:2px solid #64748b;':'border-left:1px solid #94a3b8;')+(c==='Total'?'border-left:2px solid #64748b;':'')+'"></td>'; }).join(''); }).join('') +
    '</tr>';
    var rowsHtml = section.rows.map(function(row){ return buildRow(row, section, false, collapsed); }).join('');
    return sectionHeader + rowsHtml;
  }).join('');

  body.innerHTML =
    '<style>' +
      '.perf-table-wrap{overflow:auto;border:1px solid var(--border-light);border-radius:var(--radius-md);max-height:calc(100vh - 190px);}' +
      '.perf-table{border-collapse:collapse;width:max-content;min-width:100%;}' +
      '.perf-table td, .perf-table th{border-bottom:1px solid var(--border-light);}' +
      '.perf-sticky-col{position:sticky;left:0;background:var(--surface);z-index:2;padding:4px 12px;white-space:nowrap;border-right:2px solid var(--border);}' +
    '</style>' +
    '<div class="perf-table-wrap"><table class="perf-table">' +
      '<thead style="position:sticky;top:0;z-index:3;">' + headerRow1 + headerRow2 + '</thead>' +
      '<tbody>' + sectionsHtml + '</tbody>' +
    '</table></div>';
}

var _obrSummaryIncludeCasual = false;
function _renderCustomerOnboardingReport(container) {
  container.innerHTML =
    '<div style="padding:20px;">' +
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">' +
        '<div>' +
          '<div style="font-size:22px;font-weight:800;letter-spacing:-0.3px;margin-bottom:4px;">Customer Onboarding</div>' +

function _obrSwitchGranularity(g) {

function _obrLoadReport() {

// ── Monthly Summary tab ────────────────────────────────────────────────
// Per the request — a monthly summary laid out like the team's spreadsheet:
// for each request type, one row per month with Customer Count and VA
// Request, each split into Closed - Won (Paid & Started) and Closed - Lost.
// Built from the same buckets as the Metrics tab (Started = Closed - Won,
// Cancelled = Closed - Lost), counting Regular + Project-based (and Casual
// only if "Include Casual" is ticked), so the numbers always agree with it.
function _obrSwitchView(v) {
  _obrView = v;
  var tabs = document.getElementById('obrViewTabs');
  if (tabs) Array.prototype.forEach.call(tabs.querySelectorAll('.req-type-tab'), function(b) { b.classList.toggle('active', b.dataset.v === v); });
  var g = document.getElementById('obrGranularityTabs');
  if (g) g.style.display = (v === 'summary') ? 'none' : '';
  _obrLoadReport();
}
function _obrToggleSummaryCasual(checked) {
  _obrSummaryIncludeCasual = !!checked;
  var body = document.getElementById('obReportBody');
  if (body && window._obReportData) body.innerHTML = _obrRenderSummary(window._obReportData);
}
function _obrSumClick(td) {
  var d = td.dataset;
  _obrOpenDrilldown(d.t, d.k, d.m, d.s);
}
function _obrSumCount(res, section, cat, metric, m, includeCasual) {
  var cell = (((res[section] || {})[cat] || {})[metric] || {})[m];
  if (!cell) return 0;
  return ((cell.regular || {}).count || 0) + ((cell.projectBased || {}).count || 0) + (includeCasual ? ((cell.casual || {}).count || 0) : 0);
}
function _obrRenderSummary(res) {
  var months = res.months || [];
  if (!months.length) return '<div class="empty-state"><h3>No months in range</h3></div>';
  var inclCasual = !!_obrSummaryIncludeCasual;
  var scope = inclCasual ? 'Regular, Project-based & Casual' : 'Regular & Project-based';
  var subKeys = inclCasual ? 'regular,projectBased,casual' : 'regular,projectBased';
  var years = {}; months.forEach(function(m) { years[m.split('-')[0]] = true; });
  var multiYear = Object.keys(years).length > 1;
  function monthName(m) {
    var p = m.split('-');
    var nm = new Date(Number(p[0]), Number(p[1]) - 1, 1).toLocaleDateString('en-US', { month: 'long' });
    return multiYear ? nm + ' ' + p[0] : nm;
  }
  var CATS = [{ key: 'new', label: 'New Request' }, { key: 'expansion', label: 'Expansion Request' }, { key: 'replacement', label: 'Replacement Request' }];
  var B = '1px dotted #5f6368', TITLE_BG = '#4a86e8', HDR_BG = '#c9daf8';
  var tsv = [];
  var html =
    '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;">' +
      '<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-secondary);cursor:pointer;">' +
        '<input type="checkbox" ' + (inclCasual ? 'checked ' : '') + 'onchange="_obrToggleSummaryCasual(this.checked)" /> Include Casual requests' +
      '</label>' +
      '<button class="btn btn-secondary btn-sm" onclick="_copyTsvToClipboard(window._obrSummaryTsv, this)">📋 Copy for Excel</button>' +
    '</div>';

  CATS.forEach(function(cat) {
    var title = cat.label + ' - Monthly Total (' + scope + ')';
    tsv.push(title);
    tsv.push(['', 'Customer Count', '', '', 'VA Request', ''].join('\t'));
    tsv.push(['', 'Closed - Won (Paid & Started)', 'Closed - Lost', '', 'Closed - Won (Paid & Started)', 'Closed - Lost'].join('\t'));

    function num(section, metric, m, label) {
      var n = _obrSumCount(res, section, cat.key, metric, m, inclCasual);
      var clickable = n > 0;
      return '<td style="border:' + B + ';text-align:center;padding:8px 10px;font-size:13.5px;' + (clickable ? 'cursor:pointer;color:var(--accent);font-weight:700;' : 'color:var(--text-muted);') + '"' +
        (clickable ? ' data-t="' + _esc(cat.label + ' — ' + label + ' — ' + monthName(m)) + '" data-k="' + section + '.' + cat.key + '.' + metric + '" data-m="' + m + '" data-s="' + subKeys + '" onclick="_obrSumClick(this)"' : '') + '>' + n + '</td>';
    }
    var head = function(txt, colspan) { return '<td colspan="' + colspan + '" style="border:' + B + ';background:' + HDR_BG + ';text-align:center;font-weight:700;padding:8px 10px;">' + txt + '</td>'; };
    var gap = '<td style="width:14px;border:none;background:transparent;"></td>';
    var rows = months.map(function(m) {
      var cw = _obrSumCount(res, 'customers', cat.key, 'started',   m, inclCasual);
      var cl = _obrSumCount(res, 'customers', cat.key, 'cancelled', m, inclCasual);
      var vw = _obrSumCount(res, 'vas',       cat.key, 'started',   m, inclCasual);
      var vl = _obrSumCount(res, 'vas',       cat.key, 'cancelled', m, inclCasual);
      tsv.push([monthName(m), cw, cl, '', vw, vl].join('\t'));
      return '<tr>' +
        '<td style="border:' + B + ';background:' + HDR_BG + ';font-weight:700;padding:8px 14px;white-space:nowrap;">' + _esc(monthName(m)) + '</td>' +
        num('customers', 'started',   m, 'Customers Closed - Won') + num('customers', 'cancelled', m, 'Customers Closed - Lost') +
        gap +
        num('vas', 'started',   m, 'VA Requests Closed - Won') + num('vas', 'cancelled', m, 'VA Requests Closed - Lost') +
      '</tr>';
    }).join('');
    tsv.push('');

    html += '<div style="margin-bottom:26px;overflow-x:auto;"><table style="border-collapse:collapse;min-width:560px;">' +
      '<tr><td style="border:none;"></td><td colspan="5" style="border:' + B + ';background:' + TITLE_BG + ';color:#fff;text-align:center;font-weight:800;padding:10px 14px;font-size:14px;">' + _esc(title) + '</td></tr>' +
      '<tr><td style="border:' + B + ';background:' + HDR_BG + ';"></td>' + head('Customer Count', 2) + gap + head('VA Request', 2) + '</tr>' +
      '<tr><td style="border:' + B + ';background:' + HDR_BG + ';"></td>' + head('Closed - Won (Paid &amp; Started)', 1) + head('Closed - Lost', 1) + gap + head('Closed - Won (Paid &amp; Started)', 1) + head('Closed - Lost', 1) + '</tr>' +
      rows +
    '</table></div>';
  });
  window._obrSummaryTsv = tsv.join('\n');
  return html;
}

function _obrMonthLabel(periodKey) {
  var parts = periodKey.split('-');
  if (parts.length === 3) {
    // Week key — the week's Monday date (YYYY-MM-DD).
    var wd = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    return wd.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  var d = new Date(Number(parts[0]), Number(parts[1])-1, 1);
  return d.toLocaleDateString(undefined, { month: 'short', year: '2-digit' });
}

// One section = a 2D table: rows are metric labels, columns are months.
// dataObj is the {new, expansion} (or similar) object with each value
// being {metricKey: {month: {count, items}}}.
function _obrToggleGroup(g, headerTd) {
  var collapsed = headerTd.getAttribute('data-collapsed') === '1';
  var rows = document.querySelectorAll('tr[data-obrg="' + g + '"]');
  for (var i = 0; i < rows.length; i++) rows[i].style.display = collapsed ? '' : 'none';
  headerTd.setAttribute('data-collapsed', collapsed ? '0' : '1');
  var caret = headerTd.querySelector('.obr-caret');
  if (caret) caret.textContent = collapsed ? '▾' : '▸';
}
function _obrSectionTable(title, months, categories) {
  // categories = [{ label: 'New', rows: [{label, bucket}, ...] }, { label: 'Expansion', rows: [...] }]
  var monthHeaders = months.map(function(m){ return '<th style="text-align:center;min-width:56px;">'+_esc(_obrMonthLabel(m))+'</th>'; }).join('');
  var bodyRows = categories.map(function(cat, catIdx) {
    var g = 'obrg_' + String(title).replace(/[^a-z0-9]/gi, '') + '_' + catIdx;
    // Per the request — each category (New / Expansion / Replacement) is
    // expandable/collapsible; clicking its header toggles every metric and
    // sub-metric row tagged with this group's data-obrg id.
    var catHeaderRow = '<tr><td colspan="'+(months.length+1)+'" data-collapsed="0" onclick="_obrToggleGroup(\''+g+'\',this)" title="Click to collapse / expand" style="background:var(--surface-2);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);padding:6px 10px;cursor:pointer;user-select:none;"><span class="obr-caret" style="display:inline-block;width:14px;">▾</span>'+_esc(cat.label)+'</td></tr>';
    var metricRows = cat.rows.map(function(row) {
      var cells = months.map(function(m) {
        var cell = row.bucket[m] || { count: 0, items: [] };
        var clickable = cell.count > 0;
        return '<td style="text-align:center;'+(clickable?'cursor:pointer;color:var(--accent);font-weight:700;':'color:var(--text-muted);')+'"' +
          (clickable ? ' onclick="_obrOpenDrilldown(\''+_esc(row.label)+' — '+_esc(_obrMonthLabel(m))+'\',\''+row.key+'\',\''+m+'\')"' : '') +
          '>'+cell.count+'</td>';
      }).join('');
      var mainRow = '<tr><td style="font-size:12.5px;padding-left:20px;">'+_esc(row.label)+
        (row.tooltip ? ' <span title="'+_esc(row.tooltip)+'" style="cursor:help;color:var(--text-muted);font-size:11px;border:1px solid var(--border);border-radius:50%;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;">ⓘ</span>' : '') +
        '</td>'+cells+'</tr>';
      // Per the request — Regular / Project-based sub-rows under Started
      // and Cancelled. subKey picks the pre-split sub-bucket
      // (_obrSplitByType, CustomerOnboardingReportService.gs) within
      // each month's cell; passed through to _obrOpenDrilldown as a 4th
      // argument so it knows to drill into the sub-bucket's own items
      // rather than the full list.
      // Per the request — subtle background tint on sub-rows so Regular/
      // Project-based reads as visually nested under its parent
      // Started/Cancelled row, not just via indentation. Set on both the
      // <tr> and each <td> for consistent rendering.
      var subRowsHtml = (row.subRows || []).map(function(sub) {
        var subCells = months.map(function(m) {
          var cell = row.bucket[m] || {};
          var subCell = cell[sub.subKey] || { count: 0, items: [] };
          var subClickable = subCell.count > 0;
          return '<td style="text-align:center;background:var(--surface-2);'+(subClickable?'cursor:pointer;color:var(--accent);':'color:var(--text-muted);')+'font-size:11.5px;"' +
            (subClickable ? ' onclick="_obrOpenDrilldown(\''+_esc(row.label)+' — '+_esc(sub.label)+' — '+_esc(_obrMonthLabel(m))+'\',\''+row.key+'\',\''+m+'\',\''+sub.subKey+'\')"' : '') +
            '>'+subCell.count+'</td>';
        }).join('');
        return '<tr style="background:var(--surface-2);"><td style="background:var(--surface-2);font-size:11.5px;color:var(--text-muted);padding-left:36px;">↳ '+_esc(sub.label)+'</td>'+subCells+'</tr>';
      }).join('');
      return mainRow + subRowsHtml;
    }).join('');
    return catHeaderRow + metricRows.split('<tr').join('<tr data-obrg="'+g+'"');
  }).join('');
  return '<div class="section-card" style="margin-bottom:20px;overflow-x:auto;">' +
    '<div class="section-title" style="margin-bottom:10px;">'+_esc(title)+'</div>' +
    '<table style="width:100%;border-collapse:collapse;font-size:12.5px;">' +
      '<thead><tr><th style="text-align:left;">Metric</th>'+monthHeaders+'</tr></thead>' +
      '<tbody>'+bodyRows+'</tbody>' +
    '</table>' +
  '</div>';
}

function _obrRenderTable(res) {
  var months = res.months;
  // Per the request — Regular / Project-based sub-rows under every
  // Started and Cancelled row. "Project-based" means either the
  // request's own Schedule Type or its connection's own Connection Type
  // is Project-based (_obrIsProjectBasedRequest,
  // CustomerOnboardingReportService.gs).
  // Per the request — this sub-metric is now based on HoursType, not
  // ConnectionType (CustomerOnboardingReportService.gs) — HoursType
  // keeps its own, unrenamed "Project Based" value, so the label reads
  // "Project-based" again here (not "Non-Regular", which was only ever
  // ConnectionType's own renamed value).
  var _obrTypeSubRows = [{ label: 'Regular', subKey: 'regular' }, { label: 'Project-based', subKey: 'projectBased' }, { label: 'Casual', subKey: 'casual' }];
  var custHtml = _obrSectionTable('Customers', months, [
    { label: 'New (Service Requests)', rows: [
      { label: 'Request Intake', key: 'customers.new.requestIntake', bucket: res.customers.new.requestIntake,
        tooltip: 'Unique customers who created a New Service Request this month — based on the request\'s Created At date.' },
      { label: 'Onboarded', key: 'customers.new.onboarded', bucket: res.customers.new.onboarded,
        tooltip: 'Unique customers with a New Service Request whose Seller Onboarding Date is set — based on that date. Includes requests that later became Closed - Lost, since the customer was genuinely onboarded at some point regardless of what happened afterward.' },
      { label: 'Started',   key: 'customers.new.started',   bucket: res.customers.new.started, subRows: _obrTypeSubRows,
        tooltip: 'Unique customers with a New Service Request whose VA actually started this month — based on the VA Connection\'s Actual Start Date. If a customer has multiple New requests, they still only count once per month.' },
      { label: 'Cancelled', key: 'customers.new.cancelled', bucket: res.customers.new.cancelled, subRows: _obrTypeSubRows,
        tooltip: 'Unique customers where ALL of their New Service Requests are Closed - Lost, with none ever Started (even one Started means this customer counts under Started instead, never here). Based on the Completed At of the latest Closed - Lost request.' }
    ]},
    { label: 'Expansion (Additional Service Requests)', rows: [
      { label: 'Request Intake', key: 'customers.expansion.requestIntake', bucket: res.customers.expansion.requestIntake,
        tooltip: 'Unique customers who created an Additional Service Request this month — based on the request\'s Created At date.' },
      { label: 'Started',        key: 'customers.expansion.started',       bucket: res.customers.expansion.started, subRows: _obrTypeSubRows,
        tooltip: 'Unique customers with an Additional Service Request that is Closed - Won this month — based on the request\'s Completed At date.' },
      { label: 'Cancelled',      key: 'customers.expansion.cancelled',     bucket: res.customers.expansion.cancelled, subRows: _obrTypeSubRows,
        tooltip: 'Unique customers with an Additional Service Request that is Closed - Lost this month — based on the request\'s Completed At date.' }
    ]},
    { label: 'Replacement (Replacement Service Requests)', rows: [
      { label: 'Request Intake', key: 'customers.replacement.requestIntake', bucket: res.customers.replacement.requestIntake,
        tooltip: 'Unique customers who created a Replacement Service Request this month — based on the request\'s Created At date.' },
      { label: 'Started',        key: 'customers.replacement.started',       bucket: res.customers.replacement.started, subRows: _obrTypeSubRows,
        tooltip: 'Unique customers with a Replacement Service Request whose VA actually started this month — based on the VA Connection\'s Actual Start Date (falls back to the request\'s Closed-Won date if there is no connection start date).' },
      { label: 'Cancelled',      key: 'customers.replacement.cancelled',     bucket: res.customers.replacement.cancelled, subRows: _obrTypeSubRows,
        tooltip: 'Unique customers with a Replacement Service Request that is Closed - Lost this month — based on the request\'s Completed At date.' }
    ]}
  ]);
  var vaHtml = _obrSectionTable('Virtual Assistants', months, [
    { label: 'New', rows: [
      { label: 'Request Intake', key: 'vas.new.requestIntake', bucket: res.vas.new.requestIntake,
        tooltip: 'Total New Service Requests created this month — based on Created At. Every request counts individually here, not deduplicated by customer or VA. The VA shown is whoever is assigned to the request so far.' },
      { label: 'Started',        key: 'vas.new.started',       bucket: res.vas.new.started, subRows: _obrTypeSubRows,

      { label: 'Cancelled',      key: 'vas.new.cancelled',     bucket: res.vas.new.cancelled, subRows: _obrTypeSubRows,
        tooltip: 'Total New Service Requests that are Closed - Lost this month — based on the request\'s Completed At date.' }
    ]},
    { label: 'Expansion', rows: [
      { label: 'Request Intake', key: 'vas.expansion.requestIntake', bucket: res.vas.expansion.requestIntake,
        tooltip: 'Total Additional Service Requests created this month — based on Created At.' },
      { label: 'Started',        key: 'vas.expansion.started',       bucket: res.vas.expansion.started, subRows: _obrTypeSubRows,
        tooltip: 'Requests for an Additional request whose VA Connection started this month (falls back to the request\'s Closed-Won date if no connection start date is on file). Counted per request: a VA with two requests counts as two.' },
      { label: 'Cancelled',      key: 'vas.expansion.cancelled',     bucket: res.vas.expansion.cancelled, subRows: _obrTypeSubRows,
        tooltip: 'Total Additional Service Requests that are Closed - Lost this month — based on the request\'s Completed At date.' }
    ]},
    { label: 'Replacement', rows: [
      { label: 'Request Intake', key: 'vas.replacement.requestIntake', bucket: res.vas.replacement.requestIntake,
        tooltip: 'Total Replacement Service Requests created this month — based on Created At.' },
      { label: 'Started',        key: 'vas.replacement.started',       bucket: res.vas.replacement.started, subRows: _obrTypeSubRows,
        tooltip: 'Requests for a Replacement request whose VA Connection started this month (falls back to the request\'s Closed-Won date if no connection start date is on file). Counted per request: a VA with two requests counts as two.' },
      { label: 'Cancelled',      key: 'vas.replacement.cancelled',     bucket: res.vas.replacement.cancelled, subRows: _obrTypeSubRows,
        tooltip: 'Total Replacement Service Requests that are Closed - Lost this month — based on the request\'s Completed At date.' }
    ]}
  ]);
  return custHtml + vaHtml;

// Drills into window._obReportData using the dotted key + month to find
// the exact bucket clicked, then lists its underlying customers/requests.
// subKey, when given, drills into that month's Regular/Project-based
// sub-bucket (_obrSplitByType) instead of the full list.
function _obrOpenDrilldown(title, dottedKey, month, subKey) {
  var data = window._obReportData; if (!data) return;
  var parts = dottedKey.split('.');
  var bucket = data;
  for (var i = 0; i < parts.length; i++) { bucket = bucket[parts[i]]; if (!bucket) break; }
  var cell = bucket ? bucket[month] : null;
  if (cell && subKey) {
    var subKeyList = String(subKey).split(',');
    if (subKeyList.length === 1) cell = cell[subKeyList[0]] || null;
    else {
      var mergedItems = [];
      subKeyList.forEach(function(k) { if (cell[k] && cell[k].items) mergedItems = mergedItems.concat(cell[k].items); });
      cell = { count: mergedItems.length, items: mergedItems };
    }
  }
  var items = cell ? cell.items : [];
  var statusById = data.reqStatusById || {};
  var STATUS_COLORS = { 'Open': '#2563eb', 'In Progress': '#d97706', 'Closed - Won': '#059669', 'Closed - Lost': '#dc2626' };
  function reqCell(rid) {
    var st = statusById[rid] || '';
    return '<div style="margin-bottom:2px;">' +
      '<a href="#" onclick="event.preventDefault();closeModal();reqOpenDetailModal(\''+_esc(rid)+'\');" style="color:var(--accent);">'+_esc(rid)+'</a>' +
      (st ? ' <span style="font-size:11px;font-weight:600;color:'+(STATUS_COLORS[st]||'var(--text-secondary)')+';">('+_esc(st)+')</span>' : '') +
    '</div>';
  }
  // Per the request — Started drill-downs carry the raw, un-normalized
  // Connection Type / Hours Type actually on file for each item
  // (_obrSplitByType, CustomerOnboardingReportService.gs), so you can
  // directly verify why something landed under Regular vs. Project-based
  // rather than taking the classification on faith. Not present for
  // Cancelled (no connection exists for those), so the columns are only
  // shown when at least one item actually carries them.
  var showTypeCols = items.some(function(it){ return it._scheduleType !== undefined; });
  var rows = items.length
    ? items.map(function(it, rowIdx) {
        var ids = it.requestIds || (it.requestId ? [it.requestId] : []);
        // Per the request — "VAs > Started" is now one row per VA, which
        // can legitimately list more than one client (the same VA
        // starting two connections in the same period) — each shown as
        // its own link rather than only the first being clickable.
        var custCell = (it.customerIds && it.customerIds.length > 1)
          ? it.customerIds.map(function(cid, idx) {

// Tab-separated so a paste into Excel lands as a real table — same
// approach as _caCopyDrilldown/_copyTsvToClipboard used throughout the
// Performance Report's own drill-downs.
function _obrCopyDrilldown(btnEl) {

  var lines = items.map(function(it, idx) {

    var custText = (it.customerNames && it.customerNames.length > 1) ? it.customerNames.join(', ') : (it.customerName || '');

// Per the request — Copy button on the Performance/Customer-Account
// Report's drill-down modal, formatted as tab-separated values so a
// paste into Excel lands as an actual table, not one long line of text.
// For Churned/Terminated/Cancelled this uses the richer, VA-connection-
// level column set requested (Connection ID, Customer Name, Account
// Name, VA Name, Department, Position, Start Date, Termination Date,
// Termination Reason) — populated server-side in getCustomerAccountReport
// (Router.gs). For New, the same Customer/Account/VA detail is shown but
// with Start Date only — a new connection has no termination to speak
// of. Every other metric falls back to the same columns already shown
// on screen for that metric, since VA-connection detail doesn't apply
// to e.g. Active/Returning.
// Per the request — same extraction rule as the Termination Reasons
// report's own extractMainReason (PerformanceReportService.gs): a
// termination reason is often one long, detailed, multi-clause
// explanation (category, then an em dash, then free-text elaboration
// that can itself contain more "/"-separated detail — e.g.
// "Attitude/Commitment Issues — from pause to termination / ..."). Only
// the part before the FIRST em dash is the reportable main category,
// since the category itself can legitimately contain a "/". Falls back
// to the whole (trimmed) string when there's no dash separator at all.
function _extractMainReason(raw) {
  var s = String(raw || '').trim();
  if (!s) return '';
  var dashIdx = s.indexOf(' — ');
  if (dashIdx === -1) dashIdx = s.indexOf(' - ');
  return (dashIdx === -1 ? s : s.substring(0, dashIdx).trim());
}
function _caCopyDrilldown(btnEl) {
  var rows = window._caCurrentDrilldownItems || [];
  var isAcctView = !!window._caCurrentDrilldownIsAcctView;
  var rowKey = window._caCurrentDrilldownRowKey || '';
  var isDeparture = (rowKey === 'churned' || rowKey === 'terminated' || rowKey === 'cancelled' || rowKey === 'projectCompleted' || rowKey === 'terminatedReplaced' || rowKey === 'disconnectedVAs');
  var isNewRow = (rowKey === 'newRec');
  var header, lines;

  if (isDeparture) {
    // Per the request — EOC/TOC column (isTOC is set in Router.gs only
    // for genuinely Terminated connections — Churned and Project
    // Completed share that same enrichment since they're built from the
    // same records; Cancelled/Disconnected VAs don't carry it, so they
    // show blank here rather than a guess) and the Termination Reason
    // column now shows only the main category, not the full detailed
    // text (_extractMainReason, same rule as the Termination Reasons
    // report).
    // Per the request — Incident Report link and Replacement columns,
    // set in Router.gs only for genuinely Terminated/Churned/Project
    // Completed connections (same scope as EOC/TOC above) — blank for
    // Cancelled/Disconnected VAs rather than a guess.
    header = ['#','Connection ID','Customer Name','Account Name','VA Name','Department','Position','Start Date','Termination Date','EOC or TOC','Replacement?','Incident Report Link','Termination Reason'];
    lines = rows.map(function(r, idx) {
      return [
        idx + 1,
        r.connectionId || '',
        r.customerName || '',
        // Real bug fixed here — this used to only show Account Name
        // when isAcctView was true, which meant Disconnected VAs
        // (customerAccounts section, isAcctView false) showed a blank
        // Account column even though accountName is now correctly
        // populated (Router.gs fix) with the account the VA was
        // disconnected from.
        r.accountName || r.name || '',
        r.vaName || '',
        r.connDepartment || '',
        r.position || '',
        r.vaStartDate ? _fdate(r.vaStartDate) : '',
        r.connTerminationDate ? _fdate(r.connTerminationDate) : '',
        r.isTOC === true ? 'TOC' : (r.isTOC === false ? 'EOC' : ''),
        r.hadReplacement ? 'Yes' : 'No',
        r.incidentReportLink || '',
        _extractMainReason(r.connTerminationReason || r.reason)
      ].join('\t');
    });
  } else if (isNewRow) {
    header = ['#','Connection ID','Customer Name','Account Name','VA Name','Department','Position','Start Date'];
    lines = rows.map(function(r, idx) {
      return [
        idx + 1,
        r.connectionId || '',
        r.customerName || '',
        isAcctView ? (r.accountName || r.name || '') : '',
        r.vaName || '',
        r.connDepartment || '',
        r.position || '',
        r.vaStartDate ? _fdate(r.vaStartDate) : ''
      ].join('\t');
    });
  } else if (isAcctView) {
    header = ['#','Customer', 'Account', 'Current Status', 'Status Date'];
    lines = rows.map(function(r, idx) {
      return [idx + 1, r.customerName || '', r.accountName || r.name || '', r.status || '', r.statusDate ? _fdate(r.statusDate) : ''].join('\t');
    });
  } else {
    header = ['#','Name', 'Current Status', 'Status Date'];
    lines = rows.map(function(r, idx) {
      return [idx + 1, r.name || '', r.status || '', r.statusDate ? _fdate(r.statusDate) : ''].join('\t');
    });
  }

  var tsv = header.join('\t') + '\n' + lines.join('\n');
  _copyTsvToClipboard(tsv, btnEl);
}

function _copyTsvToClipboard(text, btnEl) {
  function done(ok) {
    if (!btnEl) return;
    var orig = btnEl.getAttribute('data-orig-label');
    if (!orig) { orig = btnEl.textContent; btnEl.setAttribute('data-orig-label', orig); }
    btnEl.textContent = ok ? '✓ Copied' : 'Copy failed — try again';
    setTimeout(function(){ btnEl.textContent = orig; }, 1600);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ done(true); }).catch(function(){ _copyTsvFallback(text, done); });
  } else {
    _copyTsvFallback(text, done);
  }
}
// Fallback for environments where the async Clipboard API is blocked
// (some sandboxed/embedded contexts) — a classic hidden-textarea +
// execCommand('copy'), which works synchronously from within the same
// click handler.
function _copyTsvFallback(text, done) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    done(ok);
  } catch (e) { done(false); }
}
