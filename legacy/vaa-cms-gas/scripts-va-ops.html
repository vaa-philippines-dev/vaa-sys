<script>
console.log('%c[BUILD CHECK] scripts-va-ops.html loaded — marker: card-build-2026-09-04-c', 'background:#1e40af;color:#fff;font-size:14px;padding:4px 8px;');
window._scriptsVaOpsVersion = 'connCard-diagnostic-2026-09-04-d';
console.log('[SCRIPTS-VA-OPS LOADED] version=', window._scriptsVaOpsVersion, '— if you do not see this line in the console after a hard refresh, this file is not the one actually running.');
// CONTRACTS MODULE (sections-based)
// ══════════════════════════════════════════════════════════
var _contAll = [], _contAssignAll = [], _contSectionDefs = [];

function _renderContractsPage(container) {
  container.innerHTML =
    '<div class="page-contracts">' +



      // Contracts list
      '<div class="section-card" style="margin-bottom:18px;">' +
        '<div class="section-header" style="display:flex;align-items:center;justify-content:space-between;">' +
          '<div class="section-title">Contracts</div>' +
          '<div style="display:flex;gap:8px;">' +
            '<button class="btn btn-ghost btn-sm" onclick="contOpenSettings()" title="Contract Section Settings">' +
              '<svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" stroke="currentColor" stroke-width="1.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.22 4.22l1.42 1.42M14.36 14.36l1.42 1.42M4.22 15.78l1.42-1.42M14.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>' +
              ' Settings' +
            '</button>' +
            '<button class="btn btn-primary btn-sm" onclick="contOpenAdd()">+ New Contract</button>' +
          '</div>' +
        '</div>' +
        '<div class="table-wrap"><table>' +
          '<thead><tr><th>ID</th><th>Name</th><th>Period</th><th>Sections</th><th>Status</th><th>Actions</th></tr></thead>' +
          '<tbody id="contTbody"><tr><td colspan="6" style="text-align:center;padding:28px;"><div class="loader-ring" style="margin:0 auto 6px;"></div>Loading contracts…</td></tr></tbody>' +
        '</table></div>' +
      '</div>' +

      // Accounts & Contracts — see _contAssignRenderRows for why this now
      // reads directly from the Accounts tab instead of a separate
      // assignment log.
      '<div class="section-card">' +
        '<div class="section-header" style="display:flex;align-items:center;justify-content:space-between;">' +
          '<div><div class="section-title">Accounts &amp; Contracts</div><div id="contAssignCount" style="font-size:12px;color:var(--text-muted);"></div></div>' +
          '<div style="font-size:12px;color:var(--text-muted);">To assign or change a contract, edit the account directly.</div>' +
        '</div>' +
        '<div class="table-controls" style="padding:10px 16px 0;flex-wrap:wrap;gap:8px;">' +
          '<div class="table-search"><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.6"/><path d="M9.5 9.5L12 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
            '<input type="text" id="contAssignSearch" placeholder="Search customer, account, or contract…" oninput="contAssignFilter()" /></div>' +
          '<select class="form-select" style="width:auto;padding:5px 10px;font-size:12px;" id="contAssignContFilter" onchange="contAssignFilter()">' +
            '<option value="">All Contracts</option>' +
            (_contAll||[]).map(function(ct){return '<option value="'+_esc(ct.contractId)+'">'+_esc(ct.contractName)+'</option>';}).join('') +
          '</select>' +
          '<select class="form-select" style="width:auto;padding:5px 10px;font-size:12px;" id="contAssignStatusFilter" onchange="contAssignFilter()">' +
            '<option value="Active">Active only</option>' +
            '<option value="">All Statuses</option>' +
            '<option value="Paused">Paused</option>' +
            '<option value="Terminated">Terminated</option>' +
          '</select>' +
        '</div>' +
        '<div class="table-wrap"><table>' +
          '<thead><tr><th>Customer</th><th>Account</th><th>Contract ID</th><th>Contract</th><th>Status</th></tr></thead>' +
          '<tbody id="contAssignTbody"><tr><td colspan="5" style="text-align:center;padding:20px;"><div class="loader-ring" style="margin:0 auto 6px;"></div>Loading accounts…</td></tr></tbody>' +
        '</table></div>' +
      '</div>' +
    '</div>';

  _contRefresh();
}

function _contRefresh() {
  google.script.run
    .withSuccessHandler(function(res) {
      _contSectionDefs = (res && res.success) ? res.data : [];
      _contRenderSecDefs();
    }).withFailureHandler(function(){})
    .getContractSectionDefList();
  setTimeout(function() {
    google.script.run
      .withSuccessHandler(function(res) {
        _contAll = (res && res.success) ? res.data : [];
        _contRender();
      }).withFailureHandler(function(){})
      .getContractList();
  }, 100);
  setTimeout(function() {
    google.script.run
      .withSuccessHandler(function(res) {
        _contAssignAll = _scopeToSpecialist((res && res.success) ? res.data : [], 'clientId');
        _contAssignRender();
      }).withFailureHandler(function(){})
      .getAccountsWithContractsList();
  }, 200);
}

function _contRenderSecDefs() {
  var el = document.getElementById('contSecDefArea'); if (!el) return;
  if (!_contSectionDefs.length) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">No sections defined yet. Click "+ Add Section" to create one.</div>';
    return;
  }
  el.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:8px;">' +
    _contSectionDefs.map(function(sd) {
      var typeColors = {Percentage:'#8b5cf6',Amount:'#3b82f6',Text:'#6b7280',YesNo:'#10b981'};
      var tc = typeColors[sd.fieldType] || '#6b7280';
      return '<div style="display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);">' +
        '<div>' +
          '<div style="font-weight:700;font-size:13px;">'+_esc(sd.sectionName)+'</div>' +
          '<span style="font-size:10.5px;color:'+tc+';font-weight:700;">'+_esc(sd.fieldType)+'</span>' +
        '</div>' +
        '<button data-sdid="'+_esc(sd.sectionDefId)+'" onclick="contDeleteSecDef(this.dataset.sdid)" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:14px;line-height:1;padding:0 2px;" title="Remove">×</button>' +
      '</div>';
    }).join('') + '</div>';
}

function contOpenSettings() {
  openModal(
    '<div class="modal-header">' +
      '<div>' +
        '<div class="modal-title">Contract Section Settings</div>' +
        '<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">Define fields that appear on every contract (e.g. Night Differential, Incremental Increase).</div>' +
      '</div>' +
      '<button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button>' +
    '</div>' +
    '<div class="modal-body">' +
      '<div id="contSecDefModalArea"><div class="loader-ring" style="margin:0 auto;"></div></div>' +
      '<div style="margin-top:16px;border-top:1px solid var(--border-light);padding-top:14px;">' +
        '<div style="font-size:13px;font-weight:600;margin-bottom:10px;">Add New Section</div>' +
        '<div class="form-row">' +
          '<div class="form-group"><label class="form-label">Section Name</label>' +
            '<input class="form-input" id="sd_name" placeholder="e.g. Night Differential" /></div>' +
          '<div class="form-group"><label class="form-label">Field Type</label>' +
            '<select class="form-select" id="sd_type">' +
              '<option value="Percentage">Percentage (%)</option>' +
              '<option value="Amount">Amount</option>' +
              '<option value="Text">Text</option>' +
              '<option value="YesNo">Yes / No</option>' +
            '</select></div>' +
          '<div class="form-group"><label class="form-label">Sort Order</label>' +
            '<input class="form-input" id="sd_sort" type="number" value="0" min="0" style="max-width:80px;" /></div>' +
        '</div>' +
        '<div id="sdErr" style="color:var(--danger);font-size:12.5px;"></div>' +
        '<button class="btn btn-secondary btn-sm" id="sdBtn" onclick="contDoAddSecDef(true)">+ Add Section</button>' +
      '</div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn btn-primary" onclick="closeModal()">Done</button></div>'
  );
  _contLoadSecDefsInModal();
}

function _contLoadSecDefsInModal() {
  google.script.run
    .withSuccessHandler(function(res) {
      _contSectionDefs = (res && res.success) ? res.data : [];
      var el = document.getElementById('contSecDefModalArea'); if (!el) return;
      if (!_contSectionDefs.length) {
        el.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:8px 0;">No sections defined yet.</div>';
        return;
      }
      var typeColors = {Percentage:'#8b5cf6',Amount:'#3b82f6',Text:'#6b7280',YesNo:'#10b981'};
      el.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:8px;">' +
        _contSectionDefs.map(function(sd) {
          var tc = typeColors[sd.fieldType]||'#6b7280';
          return '<div style="display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);">' +
            '<div><div style="font-weight:700;font-size:13px;">'+_esc(sd.sectionName)+'</div>' +
            '<span style="font-size:10.5px;color:'+tc+';font-weight:700;">'+_esc(sd.fieldType)+'</span></div>' +
            '<button data-sdid="'+_esc(sd.sectionDefId)+'" onclick="contDeleteSecDef(this.dataset.sdid)" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:14px;">×</button>' +
          '</div>';
        }).join('') + '</div>';
    })
    .withFailureHandler(function(){})
    .getContractSectionDefList();
}

function contAddSectionDef() {
  var fieldTypeOpts = ['Percentage','Amount','Text','YesNo'].map(function(t){
    return '<option value="'+t+'">'+t+'</option>';
  }).join('');
  openModal(
    '<div class="modal-header"><div class="modal-title">Add Contract Section</div>' +
    '<button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>' +
    '<div class="modal-body">' +
      '<div class="form-group"><label class="form-label">Section Name <span class="required">*</span></label>' +
        '<input class="form-input" id="sd_name" placeholder="e.g. Night Differential, Incremental Increase" /></div>' +
      '<div class="form-row">' +
        '<div class="form-group"><label class="form-label">Field Type</label>' +
          '<select class="form-select" id="sd_type">'+fieldTypeOpts+'</select></div>' +
        '<div class="form-group"><label class="form-label">Sort Order</label>' +
          '<input class="form-input" id="sd_sort" type="number" value="0" min="0" /></div>' +
      '</div>' +
      '<div class="form-group"><label class="form-label">Description</label>' +
        '<input class="form-input" id="sd_desc" placeholder="Brief description…" /></div>' +
      '<div id="sdErr" style="color:var(--danger);font-size:12.5px;"></div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" id="sdBtn" onclick="contDoAddSecDef()">Add Section</button>' +
    '</div>'
  );
}

function contDoAddSecDef(stayOpen) {
  var name = (document.getElementById('sd_name')||{}).value||'';
  var errEl = document.getElementById('sdErr');
  if (!name.trim()) { if(errEl) errEl.textContent='Section Name is required.'; return; }
  var btn = document.getElementById('sdBtn');
  if(btn){btn.disabled=true;btn.textContent='Adding…';}
  google.script.run
    .withSuccessHandler(function(res) {
      if(!res||!res.success){if(errEl)errEl.textContent=(res&&res.error)||'Failed.';if(btn){btn.disabled=false;btn.textContent='Add Section';}return;}
      showToast('Section added.','success');
      _contRefresh();
      if (stayOpen) { _contLoadSecDefsInModal(); var n=document.getElementById('sd_name'); if(n)n.value=''; }
      else closeModal();
    })
    .withFailureHandler(function(e){showToast(e.message,'error');if(btn){btn.disabled=false;btn.textContent='Add Section';}})
    .createContractSectionDefRecord({
      sectionName:  name.trim(),
      fieldType:    (document.getElementById('sd_type')||{}).value||'Text',
      description:  (document.getElementById('sd_desc')||{}).value||'',
      sortOrder:    parseInt((document.getElementById('sd_sort')||{}).value)||0
    });
}

function contDeleteSecDef(id) {
  if (!confirm('Remove this section? It will no longer appear on new contracts but existing contract values are kept.')) return;
  google.script.run
    .withSuccessHandler(function(res){if(res&&res.success){showToast('Section removed.','success');_contRefresh();}else showToast((res&&res.error)||'Failed.','error');})
    .withFailureHandler(function(e){showToast(e.message,'error');})
    .deleteContractSectionDefRecord(id);
}

function _contRender() {
  var tbody = document.getElementById('contTbody'); if (!tbody) return;
  if (!_contAll.length) {
    tbody.innerHTML='<tr><td colspan="6"><div class="empty-state" style="padding:28px;"><h3>No contracts yet</h3></div></td></tr>';
    return;
  }
  tbody.innerHTML = _contAll.map(function(cont) {
    var secSummary = cont.sections.length
      ? cont.sections.map(function(s){ return _esc(s.sectionName)+': <strong>'+_esc(s.value||'—')+'</strong>'; }).join(' · ')
      : '<span style="color:var(--text-muted);">—</span>';
    var active = cont.isActive ? '<span class="badge badge-active">Active</span>' : '<span class="badge badge-inactive">Inactive</span>';
    return '<tr>' +
      '<td style="font-family:var(--font-mono);font-size:12px;color:var(--accent);">'+_esc(cont.contractId)+'</td>' +
      '<td><div style="font-weight:700;">'+_esc(cont.contractName)+'</div>'+(cont.description?'<div style="font-size:11.5px;color:var(--text-muted);">'+_esc(cont.description.substring(0,50))+'</div>':'')+'</td>' +
      '<td style="font-size:12.5px;">'+_esc(cont.period||'Annual')+'</td>' +
      '<td style="font-size:12px;">'+secSummary+'</td>' +
      '<td>'+active+'</td>' +
      '<td><button class="btn btn-ghost btn-sm" data-cid="'+_esc(cont.contractId)+'" onclick="contOpenEdit(this.dataset.cid)">Edit</button></td>' +
    '</tr>';
  }).join('');
}

// Store entity status map for filter (clientId/custId → status)
var _contEntityStatusMap = {};

function _contBuildEntityStatusMap() {
  (_cliAll||[]).forEach(function(cl){ _contEntityStatusMap[cl.clientId] = cl.status||''; });
  (CMS.customers||[]).forEach(function(cu){ _contEntityStatusMap[cu.customerId] = cu.status||''; });
}

function contAssignFilter() {
  var q    = ((document.getElementById('contAssignSearch')      ||{}).value||'').toLowerCase();
  var cont = ((document.getElementById('contAssignContFilter')  ||{}).value||'');
  var stat = ((document.getElementById('contAssignStatusFilter')||{}).value||'Active');
  var filtered = _contAssignAll.filter(function(a) {
    var mQ = !q    || (a.customerName||'').toLowerCase().includes(q) || (a.companyName||'').toLowerCase().includes(q) ||
             (a.accountName||'').toLowerCase().includes(q) || (a.contractName||'').toLowerCase().includes(q) || (a.contractId||'').toLowerCase().includes(q);
    var mC = !cont || a.contractId === cont;
    var mS = !stat || (a.status||'').toLowerCase() === stat.toLowerCase();
    return mQ && mC && mS;
  });
  _contAssignRenderRows(filtered);
}

function _contAssignRender() {
  contAssignFilter();
}

// Real change here: this table used to read from a separate
// ContractAssignments log (via getContractAssignmentList), populated
// only through this module's own "+ Assign Contract" button — which
// could silently drift out of sync with the Contract actually set on
// each account (via the Add/Edit Account form's own Contract dropdown,
// f_contractId). Now built directly from the Accounts tab itself
// (getAccountsWithContractsList), so this always matches what's
// genuinely on file for every account — including ones with no
// contract assigned yet, rather than only showing a history of
// explicit assignment actions.
function _contAssignRenderRows(rows) {
  var tbody = document.getElementById('contAssignTbody'); if (!tbody) return;
  if (!rows.length) {
    tbody.innerHTML='<tr><td colspan="5"><div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">No accounts match the filters.</div></td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(function(a) {
    var stBadge = a.status ? '<span class="badge badge-'+(a.status.toLowerCase())+'">'+_esc(a.status)+'</span>' : '—';
    var accountLabel = (a.companyName||'') + (a.accountName ? ' — ' + a.accountName : '');
    return '<tr style="cursor:default;">' +
      '<td>' +
        '<a href="#" onclick="navigate(\'customer-profile\',\''+_esc(a.customerId)+'\');return false;" style="color:var(--accent);font-weight:600;font-size:13.5px;text-decoration:none;">'+_esc(a.customerName||a.customerId)+'</a>' +
        '<div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono);">'+_esc(a.customerId)+'</div>' +
      '</td>' +
      '<td><div style="font-size:13.5px;">'+_esc(accountLabel||a.clientId)+'</div></td>' +
      '<td class="muted" style="font-size:12px;font-family:var(--font-mono);">'+_esc(a.contractId||'—')+'</td>' +
      '<td style="font-weight:600;">'+_esc(a.contractName||'—')+'</td>' +
      '<td>'+stBadge+'</td>' +
    '</tr>';
  }).join('');
  document.getElementById('contAssignCount') && (document.getElementById('contAssignCount').textContent = rows.length + ' account' + (rows.length!==1?'s':''));
}

function contOpenAdd()    { _contBuildModal(null); }
function contOpenEdit(id) {
  var found = _contAll.find(function(c){ return c.contractId === id; });
  if (!found) return;
  _contBuildModal(found);
}

function _contBuildModal(rec) {
  var isEdit = !!rec;
  var periodOpts = ['Annual','Semi-Annual','Quarterly','Monthly','Not Updated'].map(function(p){
    return '<option value="'+p+'"'+(rec&&rec.period===p?' selected':(!rec&&p==='Annual'?' selected':''))+'>'+p+'</option>';
  }).join('');
  // Build section fields from defs + existing values
  var secFields = _contSectionDefs.map(function(sd) {
    var existVal = rec ? ((rec.sections||[]).find(function(s){return s.sectionDefId===sd.sectionDefId;})||{}).value||'' : '';
    var typeHint = {Percentage:'number',Amount:'number',Text:'text',YesNo:'checkbox'}[sd.fieldType]||'text';
    var fieldHtml = '';
    if (sd.fieldType === 'YesNo') {
      fieldHtml = '<div style="display:flex;align-items:center;gap:8px;margin-top:4px;">' +
        '<input type="checkbox" id="sec_'+_esc(sd.sectionDefId)+'" '+(existVal==='true'||existVal==='Yes'?'checked':'')+' style="width:16px;height:16px;" />' +
        '<label for="sec_'+_esc(sd.sectionDefId)+'" style="font-size:13px;">Enabled</label></div>';
    } else {
      var unit = sd.fieldType==='Percentage' ? '<span style="font-size:13px;color:var(--text-muted);margin-left:4px;">%</span>' : sd.fieldType==='Amount' ? '' : '';
      fieldHtml = '<div style="display:flex;align-items:center;gap:4px;">' +
        '<input class="form-input" id="sec_'+_esc(sd.sectionDefId)+'" type="'+typeHint+'" value="'+_esc(existVal)+'" style="'+(sd.fieldType!=='Text'?'max-width:120px;':'')+'"/>' + unit + '</div>';
    }
    return '<div class="form-group">' +
      '<label class="form-label">'+_esc(sd.sectionName)+'<span style="font-size:10.5px;color:var(--text-muted);margin-left:6px;">'+_esc(sd.fieldType)+'</span></label>' +
      fieldHtml + '</div>';
  }).join('');

  openModal(
    '<div class="modal-header"><div class="modal-title">'+(isEdit?'Edit Contract':'New Contract')+'</div>' +
    '<button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>' +
    '<div class="modal-body" style="max-height:72vh;overflow-y:auto;">' +
      '<div class="form-row">' +
        '<div class="form-group"><label class="form-label">Contract Name <span class="required">*</span></label>' +
          '<input class="form-input" id="cf_name" value="'+(rec?_esc(rec.contractName):'')+'" placeholder="e.g. Standard, Premium" /></div>' +
        '<div class="form-group"><label class="form-label">Review Period</label>' +
          '<select class="form-select" id="cf_period">'+periodOpts+'</select></div>' +
      '</div>' +
      '<div class="form-group"><label class="form-label">Description</label>' +
        '<textarea class="form-textarea" id="cf_desc" style="min-height:48px;">'+(rec?_esc(rec.description||''):'')+'</textarea></div>' +
      (secFields ? '<div class="form-section-label">Contract Terms</div>' + secFields : '') +
      '<div class="form-group"><label class="form-label">Notes</label>' +
        '<textarea class="form-textarea" id="cf_notes" style="min-height:48px;">'+(rec?_esc(rec.notes||''):'')+'</textarea></div>' +
      '<div id="cfErr" style="color:var(--danger);font-size:12.5px;"></div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" id="cfBtn" data-cid="'+(isEdit?_esc(rec.contractId):'')+'" onclick="contSubmit(this.dataset.cid)">'+(isEdit?'Save':'Create')+'</button>' +
    '</div>'
  );
}

function contSubmit(id) {
  var name = (document.getElementById('cf_name')||{}).value||'';
  var errEl = document.getElementById('cfErr');
  if (!name.trim()) { if(errEl) errEl.textContent='Contract Name is required.'; return; }
  if (errEl) errEl.textContent='';
  var sections = _contSectionDefs.map(function(sd) {
    var el = document.getElementById('sec_'+sd.sectionDefId);
    var val = el ? (sd.fieldType==='YesNo' ? (el.checked?'Yes':'No') : el.value||'') : '';
    return { sectionDefId:sd.sectionDefId, sectionName:sd.sectionName, fieldType:sd.fieldType, value:val };
  });
  var btn = document.getElementById('cfBtn');
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  var payload = {
    contractName: name.trim(),
    description:  (document.getElementById('cf_desc')||{}).value||'',
    period:       (document.getElementById('cf_period')||{}).value||'Annual',
    notes:        (document.getElementById('cf_notes')||{}).value||'',
    sections:     sections
  };
  function done(res) {
    if(!res||!res.success){if(errEl)errEl.textContent=(res&&res.error)||'Failed.';if(btn){btn.disabled=false;btn.textContent=id?'Save':'Create';}return;}
    closeModal(); showToast('Contract saved.','success'); _contRefresh();
  }
  if (id) google.script.run.withSuccessHandler(done).withFailureHandler(function(e){showToast(e.message,'error');if(btn){btn.disabled=false;btn.textContent='Save';}}).updateContractRecord(id, payload);
  else    google.script.run.withSuccessHandler(done).withFailureHandler(function(e){showToast(e.message,'error');if(btn){btn.disabled=false;btn.textContent='Create';}}).createContractRecord(payload);
}

function contOpenAssign() {
  var custOpts = (CMS.customers||[]).slice().sort(function(a,b){return(a.customerName||'').localeCompare(b.customerName||'');}).map(function(c){
    return '<option value="cust:'+_esc(c.customerId)+'">'+_esc(c.customerName)+'</option>';
  }).join('');
  // Build account options grouped by customer

function contDoAssign() {

    .assignContractToEntity(contId, etype, eid, notes);
}

function mtSubmit(typeId) {
  var label     = ((document.getElementById('mt_label')||{}).value||'').trim();
  var shortName = ((document.getElementById('mt_shortname')||{}).value||'').trim();
  var noOffset  = (document.getElementById('mt_noOffset')||{}).checked;
  var errEl     = document.getElementById('mtFormErr');

  if (!label)     { if(errEl) errEl.textContent='Label is required.'; return; }
  if (!shortName) { if(errEl) errEl.textContent='Short name is required.'; return; }

  var payload = { typeId: typeId, label: label, shortName: shortName };

  if (noOffset) {
    payload.offsetValue = null;
    payload.offsetUnit  = 'day';
  } else {
    var offsetValue = parseFloat((document.getElementById('mt_offsetValue')||{}).value);
    var offsetUnit  = (document.getElementById('mt_offsetUnit')||{}).value || 'day';
    if (isNaN(offsetValue) || offsetValue < 0) { if(errEl) errEl.textContent='Offset value must be a non-negative number.'; return; }
    payload.offsetValue = offsetValue;
    payload.offsetUnit  = offsetUnit;
  }
  if (errEl) errEl.textContent = '';

  var activeEl = document.getElementById('mt_active');
  if (activeEl) payload.isActive = activeEl.checked;

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { if(errEl) errEl.textContent=(res&&res.error)||'Failed.'; return; }

      closeModal();

// ── Meeting Report ──────────────────────────────────────────────────────────
// Generates a summary report from the already-loaded _mtgAll data:
//   1. Meetings conducted by type (Completed count per meeting type) per month
//   2. Meetings conducted by CS Specialist per month
// Rendered in a wide modal with two tables side-by-side.
function mtgOpenReport() {
  if (!_mtgAll.length) { showToast('No meeting data loaded yet.', 'info'); return; }

  // Build a list of the last 6 calendar months for the column headers
  var now    = new Date();
  var months = [];
  for (var mi = 5; mi >= 0; mi--) {
    var d = new Date(now.getFullYear(), now.getMonth() - mi, 1);
    months.push({
      key:   d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'),
      label: d.toLocaleString('default', { month: 'short', year: 'numeric' })
    });
  }

  // Index Completed meetings by (typeId, month) and by (csAssigned, month)
  var byType = {};   // { typeId: { label, monthKey: count } }
  var bySpec = {};   // { csAssigned: { monthKey: count } }
  var EXCLUDED_STATUS = ['Terminated', 'Cancelled'];

  _mtgAll.forEach(function(m) {
    if (m.accountStatus && EXCLUDED_STATUS.indexOf(m.accountStatus) !== -1) return;
    var schedRaw = m.originalScheduledDate ? new Date(m.originalScheduledDate) : (m.scheduledDate ? new Date(m.scheduledDate) : null);
    if (!schedRaw || isNaN(schedRaw.getTime())) return;
    var schedKey = schedRaw.getFullYear() + '-' + String(schedRaw.getMonth() + 1).padStart(2, '0');
    if (!months.some(function(mo){ return mo.key === schedKey; })) return;
    var schedTypeId = m.meetingTypeId || 'unknown';
    if (!byType[schedTypeId]) {
      var schedTypeMeta = _mtgOffsetTypes.filter(function(x){ return x.typeId === schedTypeId; })[0];
      var schedTypeLabel = (function() {
        var t = _mtgOffsetTypes.filter(function(x){ return x.typeId === schedTypeId; })[0];
        return t ? (t.shortName || t.label) : (m.meetingType || schedTypeId);
      })();
      byType[schedTypeId] = { label: schedTypeLabel, _offsetValue: schedTypeMeta ? (schedTypeMeta.sortOrder||0) : 999999 };
    }
    byType[schedTypeId]['sch_' + schedKey] = (byType[schedTypeId]['sch_' + schedKey] || 0) + 1;
  });

  _mtgAll.forEach(function(m) {
    if (m.status !== 'Completed') return;
    if (m.accountStatus && EXCLUDED_STATUS.indexOf(m.accountStatus) !== -1) return;
    var sched = m.scheduledDate ? new Date(m.scheduledDate) : null;
    if (!sched || isNaN(sched.getTime())) return;
    var mKey = sched.getFullYear() + '-' + String(sched.getMonth() + 1).padStart(2, '0');
    if (!months.some(function(mo){ return mo.key === mKey; })) return;

    // By meeting type
    var typeId    = m.meetingTypeId || 'unknown';
    var typeLabel = (function() {
      var t = _mtgOffsetTypes.filter(function(x){ return x.typeId === typeId; })[0];
      return t ? (t.shortName || t.label) : (m.meetingType || typeId);
    })();
    if (!byType[typeId]) {
      var typeMeta = _mtgOffsetTypes.filter(function(x){ return x.typeId === typeId; })[0];
      // Uses sortOrder directly — the same admin-configured field
      // _mtgOffsetTypes is already sorted by when loaded, rather than a
      // derived offset-in-days value that could disagree with an
      // intentional custom order.
      byType[typeId] = { label: typeLabel, _offsetValue: typeMeta ? (typeMeta.sortOrder||0) : 999999 };
    }
    byType[typeId][mKey] = (byType[typeId][mKey] || 0) + 1;

    // By CS Specialist
    var spec = m.csAssigned || 'Unassigned';
    if (!bySpec[spec]) bySpec[spec] = { label: _cpSpecName(spec) || spec, _email: spec !== 'Unassigned' ? spec : '' };
    bySpec[spec][mKey] = (bySpec[spec][mKey] || 0) + 1;
  });

  // Build table HTML for a given data object. sortFn (optional) overrides
  // the default alphabetical-by-key row order — used for "By Meeting
  // Type" to arrange by actual cadence (W2, M1, M2, M6, Y1) via each
  // type's offsetValue, rather than alphabetically by its ID.
  function buildTable(rows, rowLabelHeader, sortFn, showScheduledSubtitle) {
    if (!Object.keys(rows).length) return '<div style="color:var(--text-muted);font-size:13px;padding:16px;">No completed meetings in the last 6 months.</div>';
    var colTh = months.map(function(mo){ return '<th style="text-align:center;min-width:60px;">'+_esc(mo.label)+'</th>'; }).join('');
    var totalTh = '<th style="text-align:center;font-weight:700;">Total</th>';
    var sortedKeys = Object.keys(rows).sort(sortFn ? function(a,b){ return sortFn(rows[a], rows[b]); } : undefined);
    var rowHtml = sortedKeys.map(function(key) {
      var row = rows[key];
      var rowTotal = 0;
      var cells = months.map(function(mo){
        var v = row[mo.key] || 0;
        rowTotal += v;
        var schedSubtitle = showScheduledSubtitle ? '<div style="font-size:10px;color:var(--text-muted);font-weight:400;">SCH: '+(row['sch_'+mo.key]||0)+'</div>' : '';
        return '<td style="text-align:center;">' + (v > 0 ? '<strong>'+v+'</strong>' : '<span style="color:var(--border);">—</span>') + schedSubtitle + '</td>';
      }).join('');
      return '<tr>' +
        '<td style="font-weight:600;white-space:nowrap;">'+_esc(row.label || key)+(row._email?'<div style="font-size:10.5px;color:var(--text-muted);font-weight:400;">'+_esc(row._email)+'</div>':'')+'</td>' +
        cells +
        '<td style="text-align:center;font-weight:700;color:var(--accent);">'+rowTotal+'</td>' +
      '</tr>';
    }).join('');
    // Totals row
    var totals = months.map(function(mo){
      var sum = Object.keys(rows).reduce(function(s,k){ return s + (rows[k][mo.key]||0); }, 0);
      return '<td style="text-align:center;font-weight:700;border-top:2px solid var(--border);">'+sum+'</td>';
    }).join('');
    var grandTotal = Object.keys(rows).reduce(function(s,k){
      return s + months.reduce(function(s2,mo){ return s2+(rows[k][mo.key]||0); },0);
    }, 0);
    rowHtml += '<tr style="background:var(--surface-2);">' +
      '<td style="font-weight:700;border-top:2px solid var(--border);">Total</td>' +
      totals +
      '<td style="text-align:center;font-weight:800;color:var(--accent);border-top:2px solid var(--border);">'+grandTotal+'</td>' +
    '</tr>';
    return '<div class="table-wrap"><table style="width:100%;border-collapse:collapse;">' +
      '<thead><tr>' +
        '<th style="text-align:left;padding:8px 10px;">'+_esc(rowLabelHeader)+'</th>' +
        colTh + totalTh +
      '</tr></thead>' +
      '<tbody>' + rowHtml + '</tbody>' +
    '</table></div>';
  }

  // Scheduled vs Actual, per month — "Scheduled (Per VA Connection)"
  // counts every meeting originally due that month (via
  // OriginalScheduledDate, falling back to ScheduledDate for one that's
  // never been rescheduled), regardless of status; "Scheduled (Per
  // Customer)" counts a customer once per month even if multiple of
  // their VA connections each have a meeting scheduled that month.
  // "Actual" counts how many were ultimately marked Completed. Same
  // active-accounts-only filter as the rest of this report.
  var schedVsActual = {}; // { monthKey: { scheduled, actual, custSeen } }
  months.forEach(function(mo){ schedVsActual[mo.key] = { scheduled: 0, actual: 0, custSeen: {} }; });
  _mtgAll.forEach(function(m) {
    if (m.accountStatus && EXCLUDED_STATUS.indexOf(m.accountStatus) !== -1) return;
    var origRaw = m.originalScheduledDate || m.scheduledDate;
    if (!origRaw) return;
    var origDate = new Date(origRaw);
    if (isNaN(origDate.getTime())) return;
    var mKey2 = origDate.getFullYear() + '-' + String(origDate.getMonth() + 1).padStart(2, '0');
    if (!schedVsActual[mKey2]) return;
    schedVsActual[mKey2].scheduled++;
    if (m.customerId) schedVsActual[mKey2].custSeen[m.customerId] = true;
    if (m.status === 'Completed') schedVsActual[mKey2].actual++;
  });
  var svaTotalSched = months.reduce(function(s,mo){ return s + schedVsActual[mo.key].scheduled; }, 0);
  var svaTotalSchedByCust = months.reduce(function(s,mo){ return s + Object.keys(schedVsActual[mo.key].custSeen).length; }, 0);
  var svaTotalActual = months.reduce(function(s,mo){ return s + schedVsActual[mo.key].actual; }, 0);
  var svaRate = svaTotalSched ? Math.round((svaTotalActual/svaTotalSched)*100) : 0;
  var svaHtml =
    '<div class="table-wrap"><table style="width:100%;border-collapse:collapse;">' +
      '<thead><tr><th style="text-align:left;padding:8px 10px;">Month</th>' +
        months.map(function(mo){ return '<th style="text-align:center;min-width:60px;">'+_esc(mo.label)+'</th>'; }).join('') +
        '<th style="text-align:center;font-weight:700;">Total</th></tr></thead>' +
      '<tbody>' +
        '<tr><td style="font-weight:600;">Scheduled (Per VA Connection)</td>' +
          months.map(function(mo){ return '<td style="text-align:center;">'+schedVsActual[mo.key].scheduled+'</td>'; }).join('') +
          '<td style="text-align:center;font-weight:800;">'+svaTotalSched+'</td></tr>' +
        '<tr><td style="font-weight:600;">Scheduled (Per Customer)</td>' +
          months.map(function(mo){ return '<td style="text-align:center;">'+Object.keys(schedVsActual[mo.key].custSeen).length+'</td>'; }).join('') +
          '<td style="text-align:center;font-weight:800;">'+svaTotalSchedByCust+'</td></tr>' +
        '<tr><td style="font-weight:600;">Actual (Conducted)</td>' +
          months.map(function(mo){ return '<td style="text-align:center;color:#059669;font-weight:700;">'+schedVsActual[mo.key].actual+'</td>'; }).join('') +
          '<td style="text-align:center;font-weight:800;color:#059669;">'+svaTotalActual+'</td></tr>' +
        '<tr><td style="font-weight:600;">Completion Rate</td>' +
          months.map(function(mo){
            var d = schedVsActual[mo.key];
            var rate = d.scheduled ? Math.round((d.actual/d.scheduled)*100) : null;
            var color = rate === null ? 'var(--text-muted)' : rate >= 80 ? '#059669' : rate >= 50 ? '#d97706' : '#dc2626';
            return '<td style="text-align:center;color:'+color+';font-weight:700;">'+(rate===null?'—':rate+'%')+'</td>';
          }).join('') +
          '<td style="text-align:center;font-weight:800;">'+svaRate+'%</td></tr>' +
      '</tbody>' +
    '</table></div>';

  document.getElementById('modalBox').style.maxWidth = '900px';
  openModal(
    '<div class="modal-header">' +
      '<div><div class="modal-title">Meeting Report</div>' +
        '<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">Completed meetings — last 6 months · Active accounts only</div>' +
      '</div>' +
      '<button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button>' +
    '</div>' +
    '<div class="modal-body">' +
      '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin-bottom:8px;">Scheduled vs Actual</div>' +
      svaHtml +
      '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin:20px 0 8px;">By Meeting Type</div>' +
      buildTable(byType, 'Meeting Type', function(a,b){ return (a._offsetValue||0) - (b._offsetValue||0); }, true) +
      '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin:20px 0 8px;">By CS Specialist</div>' +
      buildTable(bySpec, 'CS Specialist') +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Close</button>' +
    '</div>'
  );
}

// Non-destructive counterpart to Reset & Regenerate — generates meeting
// cadences only for VA Connections that don't have any meetings at all
// yet (e.g. a VA that started after the last full reset). Existing
// meetings for every other connection are never touched, so this doesn't
// need the same "type CONFIRM" friction the destructive reset does.
function mtgGenerateMissing() {
  openModal(
    '<div class="modal-header"><div class="modal-title">Backfill Missing Meetings</div><button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>' +
    '<div class="modal-body">' +
      '<p style="font-size:13px;color:var(--text-secondary);">This checks every active account and adds its own next missing cadence, if any (e.g. an account with only Y1 gets Y2 added). Existing meetings are never touched, overwritten, or duplicated. Cadences after that generate on their own as each prior one is marked Completed — this only ever adds one step ahead, not the full remaining schedule at once.</p>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" onclick="_mtgDoGenerateMissing()">Run Backfill</button>' +
    '</div>'
  );
}
function _mtgDoGenerateMissing() {
  closeModal();
  showToast('Checking accounts for missing meetings…', 'info');
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { showToast((res&&res.error)||'Failed.', 'error'); return; }
      var msg = res.generated
        ? 'Added ' + res.generated + ' missing meeting(s).'

}

// Group the flat meeting list by Account (ClientID). Within each account
// group, meetings are indexed by meetingTypeId with an ARRAY of connection-
// level meeting objects — one entry per VA Connection that has that meeting
// type scheduled. The display layer then decides whether to show them as
// separate rows or merge them when their dates fall within 14 days.
var MTG_MERGE_WINDOW_DAYS = 14;

function _mtgGroupByConnection() {
  // One row per VA connection — keyed by (clientId + '|' + anchorConnectionId).
  // This gives each VA its own row in the pivot table, so the VA Connections
  // column and meeting columns are always 1:1 aligned.
  var groups = {};
  var EXCLUDED = ['Terminated', 'Cancelled'];
  _mtgAll.forEach(function(m) {
    if (!m.clientId) return;
    if (m.accountStatus && EXCLUDED.indexOf(m.accountStatus) !== -1) return;
    // Use anchorConnectionId to key the row; fall back to clientId alone for
    // legacy rows that predate the per-connection model.
    var connId = m.anchorConnectionId || ('__no_conn_' + m.clientId);
    var key    = m.clientId + '|' + connId;
    if (!groups[key]) {
      groups[key] = {
        key:           key,
        clientId:      m.clientId,
        customerId:    m.customerId,
        customerName:  m.customerName  || '',
        accountName:   m.accountName   || '',
        accountStatus: m.accountStatus || '',
        csAssigned:    m.csAssigned    || '',
        connectionId:  connId,
        vaName:        m.vaName        || '',
        vaStartDate:   m.anchorVAStartDate || '',
        byTypeId:      {}
      };
    }
    var g = groups[key];
    // Keep the freshest name/status values
    if (m.customerName)      g.customerName  = m.customerName;
    if (m.accountName)       g.accountName   = m.accountName;
    if (m.accountStatus)     g.accountStatus = m.accountStatus;
    if (m.csAssigned)        g.csAssigned    = m.csAssigned;
    if (m.vaName)            g.vaName        = m.vaName;
    if (m.anchorVAStartDate) g.vaStartDate   = m.anchorVAStartDate;
    // Each row holds exactly ONE meeting per type (the one for this connection)
    if (!g.byTypeId[m.meetingTypeId]) g.byTypeId[m.meetingTypeId] = m;
    else {
      // Prefer the meeting that's most relevant (Upcoming/Overdue over Completed)
      var existing = g.byTypeId[m.meetingTypeId];
      var existSt  = existing.status || '';
      var newSt    = m.status || '';
      // Upcoming/Rescheduled beats Completed; among same status, prefer newer date
      if (existSt === 'Completed' && newSt !== 'Completed') {
        g.byTypeId[m.meetingTypeId] = m;
      }
    }
  });
  return Object.values ? Object.values(groups) : Object.keys(groups).map(function(k){ return groups[k]; });
}

// Legacy alias used by mtgApplyFilters and the report
function _mtgGroupByAccount() { return _mtgGroupByConnection(); }

function mtgApplyFilters() {
  var q = ((document.getElementById('mtgSearch')||{}).value||'').toLowerCase();
  var now = new Date();
  var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()); // meetings scheduled "today" shouldn't count as Overdue or excluded from "this week"
  var weekFromNow = new Date(todayStart.getTime() + 7*24*60*60*1000);
  var rows = _mtgGroupByConnection().filter(function(row) {
    // No real VA Connection behind this row (see the __no_conn_ fallback key
    // in _mtgGroupByConnection) — nothing to actually show, so skip it
    // rather than display an empty VA Connections column.
    return !!row.vaName;
  });

  _mtgFiltered = rows.filter(function(row) {
    // Flatten all meetings (one per type) for this connection row
    var allMeetings = Object.keys(row.byTypeId).map(function(k){ return row.byTypeId[k]; });

    var hasUpcoming = allMeetings.some(function(m){ return m.status === 'Upcoming' || m.status === 'Rescheduled'; });
    var hasOverdue  = allMeetings.some(function(m){
      if (m.status !== 'Upcoming' && m.status !== 'Rescheduled') return false;
      var sched = m.scheduledDate ? new Date(m.scheduledDate) : null;
      return sched && sched < todayStart;
    });
    var hasThisWeek = allMeetings.some(function(m){
      if (m.status !== 'Upcoming' && m.status !== 'Rescheduled') return false;
      var sched = m.scheduledDate ? new Date(m.scheduledDate) : null;
      return sched && sched >= todayStart && sched <= weekFromNow;
    });
    var allCompleted = allMeetings.length > 0 && allMeetings.every(function(m){ return m.status === 'Completed' || m.status === 'Merged' || m.status === 'Waived'; });

    var matchTab =
      _mtgTab === 'all'        ? true :
      _mtgTab === 'upcoming'   ? hasUpcoming :
      _mtgTab === 'this_week'  ? (hasThisWeek || hasOverdue) :
      _mtgTab === 'overdue'    ? hasOverdue  :
      _mtgTab === 'completed'  ? allCompleted : true;

    var matchQ = !q ||
      (row.customerName||'').toLowerCase().includes(q) ||
      (row.accountName ||'').toLowerCase().includes(q) ||
      (row.vaName      ||'').toLowerCase().includes(q);

    return matchTab && matchQ;
  });

  // Sort: customer name → account name → VA name
  _mtgFiltered.sort(function(a, b) {
    var ca = (a.customerName+a.accountName+a.vaName).toLowerCase();
    var cb = (b.customerName+b.accountName+b.vaName).toLowerCase();
    return ca < cb ? -1 : ca > cb ? 1 : 0;
  });

  _mtgPage = 1;
  mtgRender();
}

function mtgSetPageSize(val) {
  _mtgPageSize = parseInt(val, 10) || 10;
  _mtgPage = 1;
  mtgRender();
}

function mtgGoPage(pg) {
  var maxPg = Math.max(1, Math.ceil(_mtgFiltered.length / _mtgPageSize));
  if (pg >= 1 && pg <= maxPg) { _mtgPage = pg; mtgRender(); }
}

function _mtgRenderPager() {
  var el = document.getElementById('mtgPager'); if (!el) return;
  var total     = _mtgFiltered.length;
  var pageCount = Math.max(1, Math.ceil(total / _mtgPageSize));
  var startNum  = (_mtgPage - 1) * _mtgPageSize + 1;
  var endNum    = Math.min(_mtgPage * _mtgPageSize, total);
  var btns = '';
  for (var pg = 1; pg <= pageCount; pg++) {
    if (pg === 1 || pg === pageCount || Math.abs(pg - _mtgPage) <= 1)
      btns += '<button class="page-btn' + (pg === _mtgPage ? ' active' : '') + '" onclick="mtgGoPage(' + pg + ')">' + pg + '</button>';
    else if (Math.abs(pg - _mtgPage) === 2)
      btns += '<span style="padding:0 4px;color:var(--text-muted)">…</span>';
  }
  el.innerHTML = '<span>Showing ' + (total ? startNum : 0) + '–' + endNum + ' of ' + total + '</span>' +
    '<div class="page-btns">' +
      '<button class="page-btn" onclick="mtgGoPage(' + (_mtgPage - 1) + ')"' + (_mtgPage === 1 ? ' disabled' : '') + '>‹</button>' +
      btns +
      '<button class="page-btn" onclick="mtgGoPage(' + (_mtgPage + 1) + ')"' + (_mtgPage >= pageCount ? ' disabled' : '') + '>›</button>' +
    '</div>';
}

function mtgRender() {
  if (_mtgTab === 'flagged') { mtgRenderFlagged(); return; }
  var table = document.getElementById('mtgPivotTable'); if (!table) return;

    var pagerEl = document.getElementById('mtgPager'); if (pagerEl) pagerEl.innerHTML = '';
    return;
  }

  var totalCols = 5 + _mtgOffsetTypes.length;

  thead.innerHTML =
    '<tr>' +
      '<th class="mtg-col-fixed mtg-col-fixed-1">Customer / Account</th>' +
      '<th class="mtg-col-fixed mtg-col-fixed-2">VA Connection</th>' +
      '<th class="mtg-col-fixed mtg-col-fixed-cs">CS Assigned</th>' +

    '</tr>';

  if (!_mtgFiltered.length) {
    tbody.innerHTML = '<tr><td colspan="'+totalCols+'" style="text-align:center;padding:40px;color:var(--text-muted);">No meetings found.</td></tr>';
    var pagerEl2 = document.getElementById('mtgPager'); if (pagerEl2) pagerEl2.innerHTML = '';
    return;
  }

  var startIdx = (_mtgPage - 1) * _mtgPageSize;
  var pageRows = _mtgFiltered.slice(startIdx, startIdx + _mtgPageSize);

  // Track when the customer+account label changes so we can visually group rows
  // that belong to the same account (same customer + account name).
  var prevAccountKey = '';

  tbody.innerHTML = pageRows.map(function(row) {
    var accountKey = row.clientId;
    var isNewAccount = (accountKey !== prevAccountKey);
    prevAccountKey = accountKey;

    // Column 1: Customer / Account — show only on the first VA row for this account
    var acctCell = isNewAccount
      ? '<td class="mtg-col-fixed mtg-col-fixed-1" style="vertical-align:top;">' +
          '<div style="font-weight:600;font-size:13px;">'+_esc(row.customerName||'—')+'</div>' +
          (row.accountName ? '<div style="font-size:11px;color:var(--text-muted);">'+_esc(row.accountName)+'</div>' : '') +
        '</td>'
      : '<td class="mtg-col-fixed mtg-col-fixed-1" style="border-top:1px dashed var(--border-light);"></td>';

    // Column 2: VA Connection name + connection ID
    var vaCell = '<td class="mtg-col-fixed mtg-col-fixed-2" style="vertical-align:top;'+(isNewAccount?'':'border-top:1px dashed var(--border-light);')+'">' +
      '<div style="font-weight:600;font-size:12.5px;">'+_esc(row.vaName||'—')+'</div>' +
      (row.connectionId ? '<div style="font-size:10.5px;color:var(--text-muted);font-family:var(--font-mono);">'+_esc(row.connectionId)+'</div>' : '') +
    '</td>';

    // Column 3: CS Assigned
    var csCell = '<td class="mtg-col-fixed mtg-col-fixed-cs" style="vertical-align:top;'+(isNewAccount?'':'border-top:1px dashed var(--border-light);')+'">' +
      (row.csAssigned ? '<div style="font-size:11.5px;color:var(--text-secondary);">'+_esc(row.csAssigned)+'</div>' : '<span class="muted">—</span>') +
    '</td>';

    // Column 4: Start Date — its own column, separate from the VA cell above
    var startDateCell = '<td class="mtg-col-fixed mtg-col-fixed-3" style="vertical-align:top;'+(isNewAccount?'':'border-top:1px dashed var(--border-light);')+'">' +
      (row.vaStartDate ? '<div style="font-size:11.5px;color:var(--text-secondary);">'+_fdate(row.vaStartDate)+'</div>' : '<span class="muted">—</span>') +
    '</td>';

    // Meeting type columns — one cell per type, one meeting per connection
    var cellsHtml = _mtgOffsetTypes.map(function(t) {
      var m = row.byTypeId[t.typeId];
      var typeShortLabel = t.shortName || t.label;
      if (!m) {
        // Per the request — a cadence with no meeting shows a dash that turns
        // into an "Add" button on hover (not for legacy rows with no real
        // VA connection to attach a meeting to).
        var canAddMeeting = row.connectionId && String(row.connectionId).indexOf('__no_conn_') !== 0;
        return '<td class="muted mtg-cell-add" style="text-align:center;'+(isNewAccount?'':'border-top:1px dashed var(--border-light);')+'">' +
          '<span class="mtg-cell-dash">—</span>' +
          (canAddMeeting ? '<button type="button" class="mtg-add-btn" data-cid="'+_esc(row.connectionId)+'" data-tid="'+_esc(t.typeId)+'" onclick="event.stopPropagation();mtgOpenAdd(this.dataset.cid,this.dataset.tid)" title="Add a '+_esc(typeShortLabel)+' meeting for this VA">＋ Add</button>' : '') +
        '</td>';
      }
      var sched   = m.scheduledDate ? new Date(m.scheduledDate) : null;
      var daysOverdue = (sched && sched < todayStart) ? Math.floor((todayStart - sched) / 86400000) : 0;
      var overdue = sched && sched < todayStart && !_mtgIsNoData(m.status) && (m.status === 'Upcoming' || m.status === 'Rescheduled');
      var isThisWeek = sched && sched >= todayStart && sched <= weekFromNowForRender && (m.status === 'Upcoming' || m.status === 'Rescheduled');

      // Per the request — each cell only shows what the active tab is
      // actually about, rather than always showing whatever meeting
      // exists for this type regardless of which tab is selected.
      var matchesTab =
        _mtgTab === 'upcoming'  ? (!overdue && (m.status === 'Upcoming' || m.status === 'Rescheduled')) :
        _mtgTab === 'overdue'   ? overdue :
        _mtgTab === 'this_week' ? (overdue || isThisWeek) :
        _mtgTab === 'completed' ? (m.status === 'Completed' || m.status === 'Merged' || m.status === 'Waived') :
        true; // 'all' — no cell-level filtering
      if (!matchesTab) return '<td class="muted" style="text-align:center;'+(isNewAccount?'':'border-top:1px dashed var(--border-light);')+'">'+'—</td>';

      var displayStatus = overdue ? 'Overdue' : _mtgStatusLabel(m.status);
      // Two overdue severities, per the request — mildly late (within a
      // week) is a warning, not yet the same as significantly overdue.
      var overdueSeverityCls = daysOverdue >= 7 ? 'badge-terminated' : 'badge-returning';
      var stCls   = m.status === 'Completed' ? 'badge-active'
                  : m.status === 'Cancelled' ? 'badge-inactive'
                  : (m.status === 'Superseded' || m.status === 'Merged' || m.status === 'Waived' || _mtgIsNoData(m.status)) ? 'badge-inactive'
                  : overdue ? overdueSeverityCls
                  : m.riskFlag ? 'badge-terminated'
                  : m.status === 'Pending'   ? 'badge-inactive'
                  : 'badge-pending';
      return '<td class="'+(sched?'':'mtg-cell-add')+'" style="text-align:center;vertical-align:top;padding:6px 4px;'+(isNewAccount?'':'border-top:1px dashed var(--border-light);')+'">' +
        '<div data-mid="'+_esc(m.meetingId)+'" onclick="mtgOpenModal(this.dataset.mid)" style="cursor:pointer;">' +
          '<div style="font-size:10px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;">'+_esc(typeShortLabel)+'</div>' +
          (sched ? '<div style="font-size:11px;color:var(--text-muted);">'+_fdate(m.scheduledDate)+'</div>' : '') +
          '<div style="margin-top:2px;"><span class="badge '+stCls+'" style="font-size:9.5px;">' +
            _esc(displayStatus) + (overdue ? ' ('+daysOverdue+'d)' : '') + (m.riskFlag ? ' ⚠' : '') +
          '</span></div>' +
          (!sched ? '<button type="button" class="mtg-add-btn mtg-setdate-btn" data-mid="'+_esc(m.meetingId)+'" onclick="event.stopPropagation();mtgOpenSetDate(this.dataset.mid)" title="This meeting has no date yet">＋ Add date</button>' : '') +
        '</div>' +
      '</td>';
    }).join('');

    return '<tr style="'+(isNewAccount?'border-top:2px solid var(--border);':'')+'">'+acctCell+vaCell+csCell+startDateCell+cellsHtml+'</tr>';
  }).join('');

  _mtgRenderPager();
}

// ══════════════════════════════════════════════════════════════
// MEETING DETAIL MODAL — account snapshot, VAs, notes, risk, actions
// ══════════════════════════════════════════════════════════════
var _mtgModalData = null;

function mtgOpenModal(meetingId) {
  // Near-fullscreen — there's a lot to show now: account snapshot, every
  // active VA with its own Concern/Good-Feedback toggle, notes, risk, and
  // escalation actions, all in one view.
  var modalBox = document.getElementById('modalBox');
  modalBox.style.maxWidth = ''; // clear any stale inline width from a previous, smaller modal
  modalBox.classList.add('modal-fullscreen');
  openModal(_loadingModal('220px', 'Loading meeting…'));

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { closeModal(); showToast((res&&res.error)||'Not found.', 'error'); return; }
      var m = res.data;
      _mtgModalData = m;
      // Fetch account detail + connected VAs in parallel for the snapshot panel
      google.script.run
        .withSuccessHandler(function(cliRes) {
          var cliData = (cliRes && cliRes.success) ? cliRes.data : null;
          google.script.run
            .withSuccessHandler(function(connRes) {
              var allConns = (connRes && connRes.success) ? connRes.data : [];
              var acctConns = allConns.filter(function(c){ return c.clientId === m.clientId; });
              google.script.run
                .withSuccessHandler(function(fbRes) {
                  var feedback = (fbRes && fbRes.success) ? fbRes.data : [];
                  google.script.run
                    .withSuccessHandler(function(acctMtgRes) {
                      var acctMeetings = (acctMtgRes && acctMtgRes.success) ? acctMtgRes.data : [];
                      _mtgRenderModal(m, cliData, acctConns, feedback, acctMeetings);
                    })
                    .withFailureHandler(function(){ _mtgRenderModal(m, cliData, acctConns, feedback, []); })
                    .getMeetingList({ clientId: m.clientId });
                })
                .withFailureHandler(function(){ _mtgRenderModal(m, cliData, acctConns, [], []); })
                .getMeetingConcernList(meetingId);
            })
            .withFailureHandler(function(){ _mtgRenderModal(m, cliData, [], [], []); })
            .getActiveVAConnectionList({ all: true });
        })
        .withFailureHandler(function(){ _mtgRenderModal(m, null, [], []); })
        .getClientById(m.clientId);
    })
    .withFailureHandler(function(err){ closeModal(); showToast(err.message, 'error'); })
    .getMeetingDetail(meetingId);
}

// Finds the meeting a given VA connection's feedback should actually
// merge into — THEIR OWN meeting, not necessarily the one currently
// open (each VA has its own independent meeting cadence). Prioritizes
// whichever of their own meetings is Upcoming/Pending (earliest first,
// since that's the one actually coming up); falls back to their most
// recent meeting of any status if none are upcoming, so there's always
// somewhere for the feedback to land rather than nowhere.
function _mtgFindTargetMeeting(connectionId, acctMeetings) {
  var ownMeetings = acctMeetings.filter(function(mt){ return mt.anchorConnectionId === connectionId; });
  if (!ownMeetings.length) return null;
  var upcoming = ownMeetings.filter(function(mt){ return mt.status === 'Upcoming' || mt.status === 'Pending'; });
  if (upcoming.length) {
    upcoming.sort(function(a,b){ return new Date(a.scheduledDate||0) - new Date(b.scheduledDate||0); });
    return upcoming[0];
  }
  ownMeetings.sort(function(a,b){ return new Date(b.scheduledDate||0) - new Date(a.scheduledDate||0); });
  return ownMeetings[0];
}

// Renders the per-VA feedback row: name/service on the left, two checkboxes
// (Concern / Good Feedback) on the right. Checking either reveals a textbox
// to log the details — unchecking hides it again without discarding what
// was typed, in case it was checked by mistake. Only ONE of the two can be
// checked at a time per VA per click (logging both at once for the same VA
// in the same pass would be confusing — if a CS wants to log both, they log
// one, then open the modal again for the other).
function _mtgVAFeedbackRow(c, existingFeedback, targetMeeting) {
  var connId = c.connectionId;
  var feedbackForVA = existingFeedback.filter(function(f){ return f.connectionId === connId; });
  var targetMeetingId = targetMeeting ? targetMeeting.meetingId : '';
  var mergeNote = targetMeeting
    ? '<div style="font-size:10.5px;color:var(--text-muted);margin-top:2px;">Will be logged under <strong>'+_esc(targetMeeting.meetingTypeLabel)+'</strong> — '+_fdate(targetMeeting.scheduledDate)+' <span class="badge" style="font-size:9px;margin-left:2px;">'+_esc(targetMeeting.status)+'</span></div>'
    : '<div style="font-size:10.5px;color:#b45309;margin-top:2px;">⚠ No meeting found for this VA yet — feedback can\'t be logged until one exists.</div>';
  return '<div class="vaconn-overview-card" style="margin-bottom:10px;">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">' +
      '<div>' +
        '<div style="font-weight:700;font-size:13.5px;">' + _esc(c.vaName||'—') + '</div>' +
        '<div style="font-size:11.5px;color:var(--text-muted);">' + _esc(c.service||'—') + (c.department ? ' · '+_esc(c.department) : '') + '</div>' +
        mergeNote +
      '</div>' +
      '<div style="display:flex;gap:14px;'+(targetMeetingId?'':'opacity:0.4;pointer-events:none;')+'">' +
        '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;font-weight:600;color:#ef4444;">' +
          '<input type="checkbox" class="mtg-fb-toggle" data-connid="'+_esc(connId)+'" data-vn="'+_esc(c.vaName||'')+'" data-mid="'+_esc(targetMeetingId)+'" data-kind="Concern" onchange="mtgToggleFeedbackBox(this)" style="width:14px;height:14px;accent-color:#ef4444;" />' +
          '⚠ Concern' +
        '</label>' +
        '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;font-weight:600;color:#64748b;">' +
          '<input type="checkbox" class="mtg-fb-toggle" data-connid="'+_esc(connId)+'" data-vn="'+_esc(c.vaName||'')+'" data-mid="'+_esc(targetMeetingId)+'" data-kind="Neutral" onchange="mtgToggleFeedbackBox(this)" style="width:14px;height:14px;accent-color:#64748b;" />' +
          '◦ Neutral' +
        '</label>' +
        '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;font-weight:600;color:#10b981;">' +
          '<input type="checkbox" class="mtg-fb-toggle" data-connid="'+_esc(connId)+'" data-vn="'+_esc(c.vaName||'')+'" data-mid="'+_esc(targetMeetingId)+'" data-kind="Good Feedback" onchange="mtgToggleFeedbackBox(this)" style="width:14px;height:14px;accent-color:#10b981;" />' +
          '★ Good Feedback' +
        '</label>' +
      '</div>' +
    '</div>' +
    '<div id="mtgFbBox_'+_esc(connId)+'" style="display:none;margin-top:10px;">' +
      '<textarea class="form-textarea" id="mtgFbText_'+_esc(connId)+'" style="min-height:80px;" placeholder="Describe what was raised…"></textarea>' +
      '<div style="display:flex;justify-content:flex-end;margin-top:6px;">' +
        '<button class="btn btn-primary btn-sm" data-connid="'+_esc(connId)+'" data-vn="'+_esc(c.vaName||'')+'" data-mid="'+_esc(targetMeetingId)+'" onclick="mtgSubmitFeedback(this)">Log this</button>' +
      '</div>' +
      '<div id="mtgFbErr_'+_esc(connId)+'" style="color:var(--danger);font-size:11.5px;margin-top:4px;"></div>' +
    '</div>' +
    (feedbackForVA.length
      ? '<div style="margin-top:10px;border-top:1px solid var(--border-light);padding-top:8px;">' +
          feedbackForVA.map(_mtgRenderFeedbackEntry).join('') +
        '</div>'
      : '') +
  '</div>';
}

function mtgToggleFeedbackBox(cb) {
  var connId = cb.dataset.connid;
  var box = document.getElementById('mtgFbBox_' + connId);
  if (!box) return;
  // Only one kind active at a time for this VA — checking one unchecks the other.
  var siblings = document.querySelectorAll('.mtg-fb-toggle[data-connid="'+connId+'"]');
  if (cb.checked) {
    siblings.forEach(function(s){ if (s !== cb) s.checked = false; });
    box.style.display = '';
    box.dataset.activeKind = cb.dataset.kind;
  } else {
    var anyChecked = Array.prototype.some.call(siblings, function(s){ return s.checked; });
    if (!anyChecked) box.style.display = 'none';
  }
}

function mtgSubmitFeedback(btn) {
  var connId = btn.dataset.connid;
  var vaName = btn.dataset.vn;
  var targetMeetingId = btn.dataset.mid;
  if (!targetMeetingId) { showToast('No meeting found for this VA — feedback can\'t be logged.', 'error'); return; }
  var box = document.getElementById('mtgFbBox_' + connId);
  var kind = (box && box.dataset.activeKind) || 'Concern';
  var details = ((document.getElementById('mtgFbText_'+connId)||{}).value||'').trim();
  var errEl = document.getElementById('mtgFbErr_'+connId);
  if (!details) { if (errEl) errEl.textContent = 'Please describe the ' + (kind === 'Concern' ? 'concern' : kind === 'Neutral' ? 'note' : 'feedback') + '.'; return; }
  if (errEl) errEl.textContent = '';
  if (!_mtgModalData) return;
  var currentMeetingId = _mtgModalData.meetingId; // to re-open this same modal afterward, regardless of which meeting the feedback itself was saved against

  btn.disabled = true; btn.textContent = 'Logging…';
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { if (errEl) errEl.textContent = (res&&res.error)||'Failed.'; btn.disabled=false; btn.textContent='Log this'; return; }
      showToast((kind === 'Concern' ? 'Concern' : 'Good feedback') + ' logged for ' + vaName + '.', 'success');
      mtgOpenModal(currentMeetingId);
    })
    .withFailureHandler(function(err){ if (errEl) errEl.textContent = err.message; btn.disabled=false; btn.textContent='Log this'; })
    .logMeetingFeedbackEntry(targetMeetingId, connId, vaName, kind, details);
}

function _mtgRenderFeedbackEntry(cn) {
  var isConcern = cn.feedbackType === 'Concern';
  var isNeutral = cn.feedbackType === 'Neutral';
  var isOpen = cn.status === 'Open';
  var stBadge = isNeutral
    ? '<span class="badge" style="font-size:10px;background:#f1f5f9;color:#64748b;">◦ Neutral</span>'
    : !isConcern
      ? '<span class="badge badge-active" style="font-size:10px;">★ Good Feedback</span>'
      : (isOpen
          ? '<span class="badge badge-terminated" style="font-size:10px;">⚠ Open Concern</span>'
          : '<span class="badge badge-active" style="font-size:10px;">⚠ Concern — Resolved</span>');
  return '<div style="padding:8px 10px;background:var(--surface-2);border-radius:var(--radius-sm);margin-bottom:6px;border-left:3px solid '+(isConcern?(isOpen?'#ef4444':'#10b981'):(isNeutral?'#94a3b8':'#10b981'))+';">' +
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">' +
      '<div style="flex:1;">' +
        '<div>'+stBadge+'</div>' +
        '<div style="font-size:12px;color:var(--text-primary);margin-top:4px;white-space:pre-wrap;">' + _esc(cn.details||'') + '</div>' +
        '<div style="font-size:10.5px;color:var(--text-muted);margin-top:4px;">By ' + _esc(cn.raisedBy||'—') + ' · ' + _fdate(cn.raisedAt) + '</div>' +
        (cn.resolution
          ? '<div style="margin-top:6px;padding:6px 8px;background:var(--surface);border-radius:var(--radius-sm);">' +
              '<div style="font-size:10.5px;font-weight:700;color:#10b981;">Resolution</div>' +
              '<div style="font-size:11.5px;white-space:pre-wrap;">' + _esc(cn.resolution) + '</div>' +
            '</div>'
          : '') +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;">' +
        (isConcern && isOpen ? '<button class="btn btn-ghost btn-sm" style="font-size:10px;color:#10b981;" data-cnid="'+_esc(cn.concernId)+'" onclick="mtgOpenResolveConcern(this.dataset.cnid)">✓ Resolve</button>' : '') +
        '<button class="btn btn-ghost btn-sm" style="font-size:10px;color:var(--danger);" data-cnid="'+_esc(cn.concernId)+'" onclick="mtgDeleteConcern(this.dataset.cnid)">Remove</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function _mtgRenderModal(m, cliData, acctConns, feedback, acctMeetings) {
  acctMeetings = acctMeetings || [];
  var stCls = m.status === 'Completed' ? 'badge-active' : m.status === 'Cancelled' ? 'badge-inactive' : (m.status === 'Superseded' || m.status === 'Merged' || m.status === 'Waived' || _mtgIsNoData(m.status)) ? 'badge-inactive' : m.status === 'Pending' ? 'badge-inactive' : 'badge-pending';

  // The anchor VA (this meeting's own connection) is already shown in the
  // Account Snapshot — excluded here so it isn't duplicated in the
  // "other VAs" feedback list.
  var otherConns = acctConns.filter(function(c) { return c.connectionId !== m.anchorConnectionId; });
  var vaListHtml = otherConns.length
    ? otherConns.map(function(c) { return _mtgVAFeedbackRow(c, feedback, _mtgFindTargetMeeting(c.connectionId, acctMeetings)); }).join('')
    : '<div style="color:var(--text-muted);font-size:13px;padding:8px 0;">No other connected VAs on this account.</div>';

  document.getElementById('modalBox').classList.add('modal-fullscreen');
  openModal(
    '<div class="modal-header" style="border-bottom:2px solid var(--border);">' +
      '<div>' +
        '<div class="modal-title" style="font-size:16px;">' + _esc(m.meetingTypeLabel) + '</div>' +
        '<div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">' +
          _esc(m.customerName||(cliData && cliData.customerName) || '') + (cliData && cliData.companyName ? ' · '+_esc(cliData.companyName) : '') +
          ' · <span class="badge '+stCls+'" style="font-size:10px;">'+_esc(_mtgStatusLabel(m.status))+'</span>' +
          (m.riskFlag ? ' <span style="color:#ef4444;font-weight:700;font-size:11px;">⚠ Risk Flagged</span>' : '') +
          (m.scheduleEmailSentAt
            ? ' <span style="color:#15803d;font-weight:600;font-size:11px;">✓ Schedule email sent '+_fdate(m.scheduleEmailSentAt)+(m.scheduleEmailSentBy?' by '+_esc(m.scheduleEmailSentBy):'')+'</span>'
            : '') +
        '</div>' +
      '</div>' +
      '<button class="modal-close" onclick="mtgCloseModal()">' + _svgClose() + '</button>' +
    '</div>' +
    '<div class="modal-body" style="padding:0;max-height:none;flex:1;overflow-y:auto;">' +
      '<div style="display:grid;grid-template-columns:300px 1fr 340px;gap:0;height:100%;">' +

        // Column 1: account snapshot, including the anchor VA (the one
        // this specific meeting is actually about).
        '<div style="border-right:1px solid var(--border-light);padding:20px;overflow-y:auto;">' +
          '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;">Account Snapshot</div>' +
          (cliData ? (
            '<div class="detail-list" style="margin-bottom:16px;">' +
              '<div class="detail-row"><span class="detail-label">Account</span><span class="detail-val">'+_esc(cliData.companyName||'—')+'</span></div>' +
              '<div class="detail-row"><span class="detail-label">Status</span><span class="detail-val">'+_esc(cliData.status||'—')+'</span></div>' +
              '<div class="detail-row"><span class="detail-label">Primary</span><span class="detail-val">'+_esc(cliData.primaryContact||'—')+'</span></div>' +
              (cliData.primaryEmail ? '<div class="detail-row"><span class="detail-label"></span><span class="detail-val" style="font-size:12px;"><a href="mailto:'+_esc(cliData.primaryEmail)+'">'+_esc(cliData.primaryEmail)+'</a></span></div>' : '') +
            '</div>'
          ) : '<div style="color:var(--text-muted);font-size:12.5px;">Account details unavailable.</div>') +
          '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;">This Meeting\'s VA</div>' +
          _mtgVAFeedbackRow(
            { connectionId: m.anchorConnectionId, vaName: m.assignedTo, service: '', department: '' },
            feedback,
            { meetingId: m.meetingId, meetingTypeLabel: m.meetingTypeLabel, scheduledDate: m.scheduledDate, status: m.status }
          ) +
        '</div>' +

        // Column 2: meeting notes, risk, actions
        '<div style="padding:20px 24px;overflow-y:auto;border-right:1px solid var(--border-light);">' +
          '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">' +

// Per the request — a meeting whose Status is "No Data" shows as "No data"
// and is never treated as overdue (a blank Status is now read as "No Data"
// by the backend too, instead of defaulting to Upcoming).
function _mtgIsNoData(status) { return String(status || '').replace(/\s+/g, ' ').trim().toLowerCase() === 'no data'; }
function _mtgStatusLabel(status) { return _mtgIsNoData(status) ? 'No data' : (status || '—'); }

// Per the request — when an open meeting has been rescheduled until it's
// almost the next cadence's due date, offer to conduct it AS the next cadence
// and merge the earlier one into it (backend: mergeMeetingIntoNextCadence).
function _mtgLoadMergeOption(m) {
  var hint = document.getElementById('mtgMergeHint');
  function setHint(t) { if (hint) { hint.textContent = t || ''; hint.style.display = t ? 'block' : 'none'; } }
  if (!m) return;
  // A waived meeting shows who/why in this same line.
  if (m.status === 'Waived') {
    var waivedLines = String(m.notes || '').match(/\[Waived[^\]]*\]/g);
    if (waivedLines && waivedLines.length) setHint('🚫 ' + waivedLines[waivedLines.length - 1].replace(/^\[|\]$/g, ''));
    return;
  }
  if (m.status !== 'Upcoming' && m.status !== 'Rescheduled') return;
  google.script.run
    .withSuccessHandler(function(res) {
      var slot = document.getElementById('mtgMergeSlot'); if (!slot) return;
      if (!res || !res.success || !res.data) { setHint('Merge into next cadence: could not check availability' + ((res && res.error) ? ' — ' + res.error : '') + '.'); return; }
      var o = res.data; o.meetingId = m.meetingId;
      if (o.available) {
        window._mtgMergeOption = o;
        slot.innerHTML = '<button class="btn btn-secondary btn-sm" data-mid="' + _esc(m.meetingId) + '" onclick="mtgOpenMerge(this.dataset.mid)" ' +
          'title="This meeting has been rescheduled close to when the ' + _esc(o.nextTypeLabel) + ' meeting is due. Conduct it as the ' + _esc(o.nextTypeLabel) + ' meeting and merge this one into it.">⤳ Conduct as ' + _esc(o.nextTypeLabel) + ' (merge)</button>';
        return;
      }
      // Not available yet: still show the option, disabled, with the reason, so it can be found.
      var why = o.reason || 'Not available.';
      if (o.nextTypeLabel && o.nextDueDate && o.daysApart > o.windowDays) {
        why = 'Merging into the ' + o.nextTypeLabel + ' meeting becomes available once this meeting is rescheduled to within ' + o.windowDays + ' days of when the ' + o.nextTypeLabel + ' meeting is due (' + _fdate(o.nextDueDate) + '). It is currently ' + o.daysApart + ' days before that.';
      } else {
        why = 'Merge into next cadence unavailable: ' + why;
      }
      slot.innerHTML = '<button class="btn btn-secondary btn-sm" disabled title="' + _esc(why) + '" style="opacity:.55;cursor:not-allowed;">⤳ Merge into next cadence</button>';
      setHint(why);
    })
    .withFailureHandler(function(err) {
      setHint('Merge into next cadence: could not check availability — ' + ((err && err.message) ? err.message : 'make sure the latest MeetingService.gs is deployed') + '.');
    })
    .getMeetingMergeOption(m.meetingId);
}
function mtgOpenMerge(meetingId) {
  var o = window._mtgMergeOption;
  if (!o || o.meetingId !== meetingId) return;
  openModal(
    '<div class="modal-header"><div class="modal-title">Conduct as ' + _esc(o.nextTypeLabel) + ' Meeting</div>' +
      '<button class="modal-close" onclick="mtgCloseModal()">' + _svgClose() + '</button></div>' +

      '</div>' +

        'Confirming records this meeting as the <strong>' + _esc(o.nextTypeLabel) + '</strong> meeting (Completed), marks the <strong>' + _esc(o.thisTypeLabel) + '</strong> meeting as <strong>Merged</strong> into it so it isn\'t left outstanding, and schedules the next cadence as usual.' +
      '</div>' +

        '<input type="date" class="form-input" id="mtg_mergeDate" value="' + _todayStr() + '" /></div>' +

function fuLoadAll() {
  google.script.run
    .withSuccessHandler(function(res) {
      _fuAll = _scopeToSpecialist((res && res.success) ? res.data : [], 'customerId');
      fuApplyFilters();
    })
    .withFailureHandler(function(err){ showToast(err.message,'error'); })
    .getFollowUpList({});
}

function fuApplyFilters() {
  var q    = ((document.getElementById('fuSearch')||{}).value||'').toLowerCase();
  var stat = ((document.getElementById('fuStatusFilter')||{}).value||'');
  _fuFiltered = _fuAll.filter(function(f) {
    var mQ = !q    || [f.subject,f.customerName,f.clientName,f.assignedTo].some(function(v){return (v||'').toLowerCase().includes(q);});
    var mS = !stat || f.status === stat;
    return mQ && mS;
  });
  _fuPage = 1; fuRender();
}

function fuSetPageSize(v) { _fuPageSize = parseInt(v)||10; _fuPage=1; fuRender(); }
function fuGoPage(pg) { var max=Math.max(1,Math.ceil(_fuFiltered.length/_fuPageSize)); if(pg>=1&&pg<=max){_fuPage=pg;fuRender();} }

function fuRender() {
  var tbody = document.getElementById('fuTbody'); if (!tbody) return;
  var start = (_fuPage-1)*_fuPageSize;
  var rows  = _fuFiltered.slice(start, start+_fuPageSize);
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state" style="padding:32px;"><h3>No follow-ups</h3><p>Add a follow-up reminder to get started.</p></div></td></tr>';
    return;
  }
  var now = new Date();
  tbody.innerHTML = rows.map(function(f) {
    var due = f.dueDate ? new Date(f.dueDate) : null;
    var daysLeft = due ? Math.ceil((due - now) / (1000*60*60*24)) : null;
    var dueStr = due ? _fdate(f.dueDate) : '—';
    var dueStyle = '';
    if (daysLeft !== null) {
      if (daysLeft < 0)   dueStyle = 'color:#ef4444;font-weight:700;';
      else if (daysLeft <= f.remindDaysBefore) dueStyle = 'color:#f59e0b;font-weight:700;';
    }
    var stClass = f.status==='Completed'?'badge-active':f.status==='Cancelled'?'badge-terminated':'badge-pending';
    return '<tr>' +
      '<td style="font-weight:600;">' + _esc(f.subject) + (f.description?'<div style="font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;">'+_esc(f.description.substring(0,60))+'</div>':'') + '</td>' +
      '<td style="font-size:13px;">' + _esc(f.customerName||'—') + '</td>' +
      '<td style="font-size:12.5px;color:var(--text-muted);">' + _esc(f.clientName||'—') + '</td>' +
      '<td><span style="'+dueStyle+'">'+dueStr+'</span>'+(daysLeft!==null&&daysLeft<0?'<div style="font-size:11px;color:#ef4444;">'+Math.abs(daysLeft)+'d overdue</div>':daysLeft!==null&&daysLeft<=f.remindDaysBefore?'<div style="font-size:11px;color:#f59e0b;">in '+daysLeft+'d</div>':'')+'</td>' +
      '<td class="muted">' + f.remindDaysBefore + ' days</td>' +
      '<td style="font-size:12.5px;">' + _esc(f.assignedTo||'—') + '</td>' +
      '<td><span class="badge '+stClass+'">' + _esc(f.status) + '</span></td>' +
      '<td><div class="flex gap-2">' +
        '<button class="btn btn-ghost btn-sm" data-fid="'+_esc(f.followUpId)+'" onclick="fuOpenEdit(this.dataset.fid)">Edit</button>' +
        (f.status==='Open'?'<button class="btn btn-ghost btn-sm" style="color:#10b981;" data-fid="'+_esc(f.followUpId)+'" onclick="fuComplete(this.dataset.fid)">Done</button>':'') +
      '</div></td>' +
    '</tr>';
  }).join('');
  var el=document.getElementById('fuPager'); if(!el) return;
  var total=_fuFiltered.length, pages=Math.max(1,Math.ceil(total/_fuPageSize));
  var s=(_fuPage-1)*_fuPageSize+1, e=Math.min(_fuPage*_fuPageSize,total);
  var btns='';
  for(var pg=1;pg<=pages;pg++) btns+='<button class="page-btn'+(pg===_fuPage?' active':'')+'" onclick="fuGoPage('+pg+')">'+pg+'</button>';
  el.innerHTML='<span>Showing '+(total?s:0)+'–'+e+' of '+total+'</span><div class="page-btns">'+btns+'</div>';
}
