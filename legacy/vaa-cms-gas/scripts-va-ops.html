function _wfLoadEmbeddedTimeline(requestId) {
  var panel = document.getElementById('wfEmbeddedTimeline'); if (!panel) return;
  google.script.run
    .withSuccessHandler(function(res) {
      var panel2 = document.getElementById('wfEmbeddedTimeline'); if (!panel2) return;
      if (!res || !res.success) {
        var isAdmin = CMS.user && CMS.user.role === 'Administrator';
        panel2.innerHTML = '<div style="padding:10px;font-size:12px;color:var(--danger);">'+_esc((res&&res.error)||'Could not load timeline.')+'</div>' +
          (isAdmin
            ? '<div style="padding:0 10px 10px;"><button class="btn btn-secondary btn-sm" data-rid="'+_esc(requestId)+'" onclick="_wfAdminFixTimeline(this.dataset.rid,this)">🛠 Fix Timeline (Admin)</button></div>'
            : '');
        return;
      }
      var timeline = res.timeline || [];
      var keyDates = res.keyDates || [];
      var timelineHtml = timeline.filter(function(t) { return t.status !== 'not_applicable'; }).map(function(t, i, arr) {
        var isCurrent = t.status === 'current';
        var isDone = t.status === 'completed';
        var marker = isDone
          ? '<div style="flex-shrink:0;width:15px;height:15px;border-radius:50%;background:#22c55e;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;">✓</div>'
          : '<div style="flex-shrink:0;width:7px;height:7px;border-radius:50%;background:'+(isCurrent?'#3361ac':'#d6d3d1')+';margin-top:5px;'+(isCurrent?'box-shadow:0 0 0 3px rgba(51,97,172,0.2);':'')+'"></div>';
        return '<div style="display:flex;gap:8px;padding:6px 8px;'+(i<arr.length-1?'border-bottom:1px solid var(--border-light);':'')+
            (isCurrent ? 'background:#eff6ff;border-left:3px solid var(--accent);border-radius:4px;margin:2px 0;' : '') + '">' +
          marker +
          '<div style="min-width:0;">' +
            '<div style="font-size:11.5px;font-weight:'+(isCurrent?'800':'600')+';'+(isCurrent?'color:var(--accent);':'')+'">'+_esc(t.label)+(isCurrent?' <span style="font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;">— Current</span>':'')+'</div>' +
            (t.changedAt && t.status!=='pending' ? '<div style="font-size:10px;color:var(--text-muted);">'+_formatDate(t.changedAt)+(t.daysInStage!==null&&t.daysInStage!==undefined?' · '+t.daysInStage+'d':'')+'</div>' : '') +
          '</div>' +
        '</div>';
      }).join('');

      var KEYDATE_DOT = { completed: '#22c55e', delayed: '#ef4444', pending: '#d6d3d1' };
      var keyDatesHtml = keyDates.length ? (
        '<div style="font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:12px 0 4px;padding-top:10px;border-top:1px solid var(--border-light);">Key Dates</div>' +
        keyDates.map(function(k, i) {
          var dot = KEYDATE_DOT[k.status] || '#d6d3d1';
          var noteColor = k.status === 'delayed' ? '#ef4444' : (k.status === 'completed' ? '#15803d' : 'var(--text-muted)');
          return '<div style="display:flex;gap:8px;padding:5px 0;'+(i<keyDates.length-1?'border-bottom:1px solid var(--border-light);':'')+'">' +
            '<div style="flex-shrink:0;width:7px;height:7px;border-radius:50%;background:'+dot+';margin-top:4px;"></div>' +
            '<div style="min-width:0;">' +
              '<div style="font-size:11.5px;font-weight:600;">'+_esc(k.label)+'</div>' +
              '<div style="font-size:10px;color:var(--text-muted);">'+_formatDate(k.date)+'</div>' +
              (k.note ? '<div style="font-size:10.5px;color:'+noteColor+';font-weight:600;margin-top:1px;">'+_esc(k.note)+'</div>' : '') +
            '</div>' +
          '</div>';
        }).join('')
      ) : '';

      panel2.innerHTML = (res.historyLoadError ? '<div style="font-size:10.5px;color:#b45309;background:#fef3c7;border-radius:5px;padding:4px 7px;margin-bottom:6px;">⚠ Some history data could not be loaded — showing what\'s available.</div>' : '') + timelineHtml + keyDatesHtml;
    })
    .withFailureHandler(function(err) {
      var panel3 = document.getElementById('wfEmbeddedTimeline'); if (!panel3) return;
      var isAdmin3 = CMS.user && CMS.user.role === 'Administrator';
      panel3.innerHTML = '<div style="padding:10px;font-size:12px;color:var(--danger);">'+_esc(err.message)+'</div>' +
        (isAdmin3
          ? '<div style="padding:0 10px 10px;"><button class="btn btn-secondary btn-sm" data-rid="'+_esc(requestId)+'" onclick="_wfAdminFixTimeline(this.dataset.rid,this)">🛠 Fix Timeline (Admin)</button></div>'
          : '');
    })
    .getRequestWorkflowTimeline(requestId);
}

// Administrator-only — calls adminFixRequestTimeline (WorkflowService.gs)
// and, on success, automatically retries loading the Timeline so the
// fix's effect is visible immediately rather than requiring a manual
// refresh. This is the UI-accessible counterpart to the one-off TEMP_
// runner scripts used earlier in the Apps Script editor for this exact
// symptom — an Administrator can now do it directly from the request.
function _wfAdminFixTimeline(requestId, btnEl) {
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'Fixing…'; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) {
        showToast((res && res.error) || 'Could not fix this request\'s Timeline.', 'error');
        if (btnEl) { btnEl.disabled = false; btnEl.textContent = '🛠 Fix Timeline (Admin)'; }
        return;
      }
      showToast(
        res.action === 'backfilled'
          ? 'Fixed — Current Stage was blank, set to "' + res.stage + '."'
          : 'Re-verified — Current Stage was already "' + res.stage + '," re-committed just in case.',
        'success'
      );
      _wfLoadEmbeddedTimeline(requestId);
    })
    .withFailureHandler(function(err) {
      showToast(err.message, 'error');
      if (btnEl) { btnEl.disabled = false; btnEl.textContent = '🛠 Fix Timeline (Admin)'; }
    })
    .adminFixRequestTimeline(requestId);
}

function reqSwitchTab(tabKey, requestId) {
  _reqProfileTab = tabKey;
  document.querySelectorAll('.profile-tab[data-tab]').forEach(function(btn){
    btn.classList.toggle('active', btn.dataset.tab === tabKey);
  });
  var body = document.getElementById('reqTabBody'); if (!body) return;
  if (tabKey==='details')     _renderReqDetails(body, _reqProfileData);
  else if (tabKey==='connections') _renderReqConnections(body, _reqProfileData);
  else if (tabKey==='notes')  _renderReqNotes(body, requestId);
}

function reqOpenAssignVA(requestId) {

  // return to that same modal instead of just closing everything or
  // navigating to the full page.
  window._reqAssignVAFromModal = !!document.querySelector('#modalBox .rdr-hero');

      var allVAs = (res.data || []).filter(function(v) { return (v.status||'').toLowerCase() === 'active'; });
      // Filter by service if available, then sort alphabetically

      var reqDept = req && req.department ? req.department : '';

  if (!list) return;
  if (list.style.display === 'none' || !list.style.display) assignVAComboShow();
  else list.style.display = 'none';
}
function assignVAComboFilter(inputEl) {
  if (!inputEl) return;
  var q = (inputEl.value||'').trim().toLowerCase();
  var matches = _reqVAsForAssign.filter(function(v){ return !q || (v.vaName||'').toLowerCase().indexOf(q) !== -1; });
  var list = document.getElementById('assignVAComboList'); if (!list) return;
  list.innerHTML = matches.length
    ? matches.map(function(v){
        var status = v.status && v.status.toLowerCase() !== 'active' ? ' ['+_esc(v.status)+']' : '';
        return '<div class="combo-option" style="padding:8px 12px;cursor:pointer;font-size:13px;" data-id="'+_esc(v.vaId)+'" data-name="'+_esc(v.vaName)+'" ' +
          'onmousedown="event.preventDefault();assignVAComboPick(this.dataset.id,this.dataset.name)" ' +
          'onmouseover="this.style.background=\'var(--surface-2)\'" onmouseout="this.style.background=\'\'">'+_esc(v.vaName)+status+'</div>';
      }).join('')
    : '<div style="padding:8px 12px;color:var(--text-muted);font-size:12.5px;">No matches</div>';
  list.style.display = '';
}
function assignVAComboPick(vaId, vaName) {
  var input = document.getElementById('f_assignVASearch');
  var list  = document.getElementById('assignVAComboList');
  var hiddenSel = document.getElementById('f_assignVA');
  if (input) input.value = vaName;
  if (list)  list.style.display = 'none';
  if (hiddenSel) hiddenSel.value = vaId;
}
document.addEventListener('click', function(e) {
  var vaList = document.getElementById('assignVAComboList');
  if (vaList && vaList.style.display !== 'none' && !e.target.closest('#f_assignVASearch') && !e.target.closest('#assignVAComboList')) {
    vaList.style.display = 'none';

});

function reqDoAssignVA(requestId) {
  var errEl = document.getElementById('assignVAErr');
  var rows = Array.prototype.slice.call(document.querySelectorAll('.assign-va-row'));
  var jobs = [];
  for (var i = 0; i < rows.length; i++) {
    var vaSel = rows[i].querySelector('.assign-va-select');
    var notesEl = rows[i].querySelector('.assign-va-notes');
    var vaId = vaSel ? vaSel.value : '';
    if (!vaId) {
      if (i === 0) { if(errEl) errEl.textContent='Please select a VA.'; return; }
      continue; // an extra row left blank — just skip it, not an error
    }
    jobs.push({ vaId: vaId, notes: (notesEl ? notesEl.value : '').trim() });
  }
  if (!jobs.length) { if(errEl) errEl.textContent='Please select at least one VA.'; return; }
  if (errEl) errEl.textContent = '';

  var btn = document.getElementById('assignVABtn');
  if (btn) { btn.disabled = true; }
  // Lock down the rest of the modal so nothing can be changed while the
  // assignment is being submitted — dropdowns, notes, Add Another VA,
  // remove-row buttons, and Cancel.
  document.querySelectorAll('.assign-va-select, .assign-va-notes').forEach(function(el){ el.disabled = true; });
  document.querySelectorAll('#stackedModalBox .modal-header button, #stackedModalBox .modal-body button, #stackedModalBox .modal-footer button, #stackedModalBox .assign-va-row button').forEach(function(b){
    if (b.id !== 'assignVABtn') b.disabled = true;
  });
  var assignedNames = [];

  function submitNext(i) {
    if (btn) btn.textContent = jobs.length > 1 ? 'Assigning ' + (i+1) + ' of ' + jobs.length + '…' : 'Assigning…';
    if (i >= jobs.length) {
      closeStackedModal();
      showToast(assignedNames.join(', ') + ' assigned.', 'success');
      if (_pbWizardIsActuallyActive()) {
        setTimeout(function(){ _pbWizardGoToStep(_pbWizard.stepIndex + 1); }, 150);
      } else if (window._reqAssignVAFromModal) {
        reqOpenDetailModal(requestId);
      } else {
        navigate('va-request-profile', requestId);
      }
      return;
    }
    google.script.run
      .withSuccessHandler(function(res){
        if (!res || !res.success) {
          showToast('Failed on VA ' + (i+1) + ': ' + ((res&&res.error)||'Unknown error'), 'error');
          if (btn) { btn.disabled = false; btn.textContent = 'Assign VA'; }
          return; // stop the chain on first failure rather than silently skipping
        }
        assignedNames.push(res.vaName);
        if (_pbWizardIsActuallyActive()) _pbWizard.connectionId = res.id; // wizard tracks the most recent one
        submitNext(i + 1);
      })
      .withFailureHandler(function(err){
        showToast('Failed on VA ' + (i+1) + ': ' + err.message, 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Assign VA'; }
      })
      .assignVA({ requestId: requestId, vaId: jobs[i].vaId, notes: jobs[i].notes });
  }
  submitNext(0);
}

// Shown before Accept/Decline — lets the user backdate when this was
// actually decided, rather than always logging it as "right now."
// Accepting a VA for a New or Additional request requires settling payment
// status first — a New request needs a payment date if none is on file
// yet; an Additional request gets a choice between Paid (with a date) or
// Add to Next Bill (no date needed, can proceed straight to Start). Other
// request types (Replacement, Hours/Schedule Change) and any request that
// already has a payment date on file skip this and just get the plain
// accept-date prompt, same as before.
function _reqRequireAcceptPayment(connId, requestId, onConfirm, btnEl) {
  function resetBtn() { if (btnEl) { btnEl.disabled = false; btnEl.textContent = btnEl.dataset.origText || 'Accept'; } }
  google.script.run
    .withSuccessHandler(function(res) {
      resetBtn();
      if (!res || !res.success) { showToast((res&&res.error)||'Could not load request details.', 'error'); return; }
      var req = res.data;
      var alreadyPaid = !!req.paymentDate;
      var needsPaymentStep = !alreadyPaid && (req.requestType === 'New' || req.requestType === 'Additional');
      if (!needsPaymentStep) {
        _reqPromptConnStatusDate(connId, 'Accepted', onConfirm);
        return;
      }
      _reqOpenAcceptPaymentModal(connId, req, onConfirm);
    })
    .withFailureHandler(function(err) { resetBtn(); showToast(err.message, 'error'); })
    .getVARequestDetail(requestId);
}

        (isNew ?
          '<div class="form-group"><label class="form-label">Payment Date <span class="required">*</span></label>' +
            '<input class="form-input" type="date" id="f_acceptPaymentDate" value="'+_todayStr()+'" /></div>' +

            '</label>' +

            '<input class="form-input" type="date" id="f_acceptPaymentDate" value="'+_todayStr()+'" /></div>'
        ) +
        '<div id="acceptPaymentErr" style="color:var(--danger);font-size:12.5px;"></div>' +
      '</div>' +

    '</div>'
  );

  window._reqConnStatusDateCallback = onConfirm;

function _reqToggleAcceptPaymentDate(show) {
  var wrap = document.getElementById('f_acceptPaymentDateWrap');
  if (wrap) wrap.style.display = show ? '' : 'none';
}
function _reqConfirmAcceptPayment(requestType) {
  var errEl = document.getElementById('acceptPaymentErr');
  var dateVal = (document.getElementById('f_connStatusDate')||{}).value || '';
  var isNew = requestType === 'New';
  var choice = isNew ? 'paid' : ((document.querySelector('input[name="acceptPaymentChoice"]:checked')||{}).value || '');
  var paymentDateVal = (document.getElementById('f_acceptPaymentDate')||{}).value || '';

  if (!isNew && !choice) { if (errEl) errEl.textContent = 'Please choose Paid or Add to Next Bill.'; return; }
  if (choice === 'paid' && !paymentDateVal) { if (errEl) errEl.textContent = 'Payment Date is required.'; return; }
  if (errEl) errEl.textContent = '';

  var btn = document.getElementById('connStatusDateBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  var paymentPayload = choice === 'paid'
    ? { paymentDate: paymentDateVal, paymentStatus: 'Paid' }
    : { paymentStatus: 'Add to Next Bill' };

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) {
        if (errEl) errEl.textContent = (res&&res.error) || 'Failed to save payment status.';
        if (btn) { btn.disabled = false; btn.textContent = 'Confirm'; }
        return;
      }
      var cb = window._reqConnStatusDateCallback;
      window._reqConnStatusDateCallback = null;
      if (cb) cb(dateVal);
    })
    .withFailureHandler(function(err) {
      if (errEl) errEl.textContent = err.message;
      if (btn) { btn.disabled = false; btn.textContent = 'Confirm'; }
    })
    .updateRequestPaymentStatus(window._reqAcceptPaymentRequestId, paymentPayload);
}

// Whether declining this specific connection would leave zero other
// non-Declined/Cancelled VA connections for the same request — used to
// warn the CS Specialist, per the request, that declining the last
// remaining VA sends the request back to the VA Assignment phase.
function _reqIsLastRemainingVA(connId) {
  var conns = (_reqProfileData && _reqProfileData.connections) || [];
  var others = conns.filter(function(c) {
    return c.connectionId !== connId && c.connectionStatus !== 'Declined' && c.connectionStatus !== 'Cancelled';
  });
  return others.length === 0;
}

// Same accept/decline/cancel action as reqUpdateConnStatus, but for the
// ticket MODAL specifically — that modal is a separate render path from the
// full request profile page, so refreshing needs to re-open the modal
// itself rather than the page underneath it.
function reqModalUpdateConnStatus(connId, newStatus, requestId) {
  if (newStatus === 'Accepted') {
    _reqRequireAcceptPayment(connId, requestId, function(dateVal) { _reqDoModalUpdateConnStatus(connId, newStatus, requestId, dateVal); });
    return;
  }
  if (newStatus === 'Declined') {
    var isLastVA = _reqIsLastRemainingVA(connId);
    _reqPromptConnStatusDate(connId, newStatus, function(dateVal) { _reqDoModalUpdateConnStatus(connId, newStatus, requestId, dateVal); }, isLastVA);
    return;
  }
  _reqDoModalUpdateConnStatus(connId, newStatus, requestId, '');
}
function _reqDoModalUpdateConnStatus(connId, newStatus, requestId, dateVal) {
  google.script.run
    .withSuccessHandler(function(res){
      if(!res||!res.success){
        showToast((res&&res.error)||'Failed.','error');
        var stuckBtn = document.getElementById('connStatusDateBtn');
        if (stuckBtn) { stuckBtn.disabled = false; stuckBtn.textContent = 'Confirm'; }
        return;
      }
      closeStackedModal();
      var statusMsg = { Declined:'VA declined.', Accepted:'VA accepted.', Cancelled:'Connection cancelled.' }[newStatus] || 'Status updated.';
      showToast(statusMsg, newStatus==='Declined'||newStatus==='Cancelled' ? 'warning' : 'success');
      reqOpenDetailModal(requestId);
    })
    .withFailureHandler(function(err){
      showToast(err.message,'error');
      var stuckBtn2 = document.getElementById('connStatusDateBtn');
      if (stuckBtn2) { stuckBtn2.disabled = false; stuckBtn2.textContent = 'Confirm'; }
    })
    .updateVAConnectionStatus(connId, newStatus, dateVal);
}

function reqUpdateConnStatus(connId, newStatus, btnEl) {
  var requestId = _reqProfileData ? _reqProfileData.requestId : null;
  if (newStatus === 'Accepted') {
    if (btnEl) { btnEl.disabled = true; btnEl.dataset.origText = btnEl.textContent; btnEl.textContent = 'Loading…'; }
    _reqRequireAcceptPayment(connId, requestId, function(dateVal) { _reqDoUpdateConnStatus(connId, newStatus, dateVal); }, btnEl);
    return;
  }
  if (newStatus === 'Declined') {
    var isLastVA = _reqIsLastRemainingVA(connId);
    _reqPromptConnStatusDate(connId, newStatus, function(dateVal) { _reqDoUpdateConnStatus(connId, newStatus, dateVal); }, isLastVA);
    return;
  }
  _reqDoUpdateConnStatus(connId, newStatus, '');
}
function _reqDoUpdateConnStatus(connId, newStatus, dateVal) {
  google.script.run
    .withSuccessHandler(function(res){
      if(!res||!res.success){
        showToast((res&&res.error)||'Failed.','error');
        var stuckBtn3 = document.getElementById('connStatusDateBtn');
        if (stuckBtn3) { stuckBtn3.disabled = false; stuckBtn3.textContent = 'Confirm'; }
        return;
      }
      closeStackedModal();
      var statusMsg = { Declined:'VA declined.', Accepted:'VA accepted.', Cancelled:'Connection cancelled.' }[newStatus] || 'Status updated.';
      showToast(statusMsg, newStatus==='Declined'||newStatus==='Cancelled' ? 'warning' : 'success');

      } else {
        _rerenderReqProfile(res.requestId || (_reqProfileData && _reqProfileData.requestId));

    })

      showToast(err.message,'error');

      if (stuckBtn4) { stuckBtn4.disabled = false; stuckBtn4.textContent = 'Confirm'; }

    .updateVAConnectionStatus(connId, newStatus, dateVal);
}

};

// Management Approval — most commonly needed for a not-yet-catalogued
// "Other" service. This is an interrupt, not a forward step, so it's
// available regardless of the current stage (as long as it isn't already
// in/past approval), not gated to whoever the current stage owner is.
var WF_MGMT_APPROVAL_TRIGGER_ROLES = ['CS Specialist', 'Service Manager', 'CS Manager', 'Administrator'];
var WF_STAGE_WAITING_NOTE = {

  'VA-Client Connection Call': 'Waiting on the VA-Client connection call outcome (Accept/Decline) below.',
  'Start VA': 'Waiting for the VA to be marked Started below.'

var WF_STAGE_DEFAULT_ROLE = {
  'Request Intake':                  'CS Specialist',
  'Management Approval':             'Executive',
  'VA Assignment':                   'Service Manager',
  'Recruitment - Sourcing':          'Recruitment Specialist',
  'Training':                        'Training Manager',
  'VA Preparation & Mock Interview': 'Service Manager',
  'Rate Agreement':                  'HR Specialist',
  'Kick Off Call':                   'CS Specialist',
  'VA-Client Connection Call':       'CS Specialist',
  'Start VA':                        'Service Manager',
  'Completed':                       ''
};
function _wfRenderStatusBar(req, extraLeftButtons, splitLayout) {
  var stage = req.currentStage || '';
  // personInChargeRole should always be set once a request has a stage,
  // but a real data gap can leave it blank on an existing ticket — falls
  // back to the stage's own default owning role so "Assigned To" and the
  // ability to act on it both still work correctly rather than silently
  // breaking for everyone.
  var role = req.personInChargeRole || WF_STAGE_DEFAULT_ROLE[stage] || '';
  if (!stage) { console.log('[WF-DIAG v2] No currentStage on request', req.requestId, '— status bar will not render. Raw req.currentStage=', req.currentStage, '| req.personInChargeRole=', req.personInChargeRole); return splitLayout ? { infoHtml: '', actionsHtml: '' } : ''; }
  var isComplete = stage === 'Completed';
  var isMgmtApproval = stage === 'Management Approval';
  // isMine (shows "(you)") is an exact role match ONLY — an Administrator
  // viewing someone else's stage isn't "them" just because they're allowed
  // to act on their behalf. canAct is the separate, broader check (used to
  // decide whether to show the action button at all) that DOES include the
  // Administrator override, matching what the backend actually permits.
  var isMine = CMS.user && CMS.user.role === role;
  var isCSManagerOverride = CMS.user && CMS.user.role === 'CS Manager' && (role === 'CS Specialist' || role === 'Executive');
  var isHRManagerOverride = CMS.user && CMS.user.role === 'HR Manager' && role === 'HR Specialist';
  var canAct = isMine || isCSManagerOverride || isHRManagerOverride || (CMS.user && CMS.user.role === 'Administrator');
  var action = WF_STAGE_ACTIONS[stage];
  var waitingNote = WF_STAGE_WAITING_NOTE[stage];
  var canTriggerApproval = stage === 'Request Intake' && CMS.user && WF_MGMT_APPROVAL_TRIGGER_ROLES.indexOf(CMS.user.role) !== -1;
  console.log('[WF-DIAG v2] requestId=', req.requestId, '| stage="'+stage+'"', '| personInChargeRole="'+role+'"', '| CMS.user.role="'+(CMS.user&&CMS.user.role)+'"', '| isMine=', isMine, '| isCSManagerOverride=', isCSManagerOverride, '| canAct=', canAct, '| action=', action, '| WF_STAGE_ACTIONS keys=', Object.keys(WF_STAGE_ACTIONS));

  // Resolve a specific person/people where we can, not just the role name.
  // CS Specialist resolves to the one person actually assigned to this
  // customer. Service Manager resolves to a live-fetched list of every
  // active Service Manager for the request's own department — there can
  // be more than one, and showing just "Service Manager" doesn't tell
  // anyone who to actually go talk to. Other roles (HR, Recruitment,
  // Training, Executive) don't have a department-scoped mapping yet, so
  // they fall back to showing just the role.
  var assigneeHtml = _esc(role);
  var assigneeId = 'wfAssignee_' + req.requestId.replace(/[^a-zA-Z0-9]/g,'');
  if (role === 'CS Specialist' && req.assignedSpecialistEmail) {
    var csMatch = (CMS.specialists||[]).find(function(s){ return (s.email||'').toLowerCase() === req.assignedSpecialistEmail.toLowerCase(); });
    assigneeHtml = _esc(csMatch ? csMatch.name : req.assignedSpecialistEmail) + '<div style="font-size:10.5px;font-weight:500;color:var(--text-muted);">' + _esc(role) + '</div>';
  } else if (role === 'Service Manager') {
    assigneeHtml = '<span id="'+assigneeId+'">Loading…</span><div style="font-size:10.5px;font-weight:500;color:var(--text-muted);">' + _esc(role) + (req.department ? ' — ' + _esc(req.department) : '') + '</div>';
    setTimeout(function() {
      google.script.run
        .withSuccessHandler(function(res) {
          var el = document.getElementById(assigneeId); if (!el) return;
          var list = (res && res.success) ? res.data : [];
          el.textContent = list.length ? list.map(function(u){ return u.name || u.email; }).join(', ') : 'No active Service Manager on file for ' + (req.department || 'this department');
        })
        .withFailureHandler(function() {
          var el = document.getElementById(assigneeId); if (el) el.textContent = role;
        })
        .getActiveUsersForRole('Service Manager', req.department || '');
    }, 0);
  }

  var actionButtons = '';
  if (isMgmtApproval && canAct) {
    actionButtons =
      '<button class="btn btn-ghost btn-sm" style="color:var(--danger);" data-rid="'+_esc(req.requestId)+'" onclick="wfOpenRejectPrompt(this.dataset.rid)">Reject</button>' +
      '<button class="btn btn-primary btn-sm" data-rid="'+_esc(req.requestId)+'" data-fn="approveManagementRequest" onclick="wfOpenActionPrompt(this.dataset.rid,this.dataset.fn,\'Approve Request\')">Approve</button>';
  } else if (stage === 'Training' && canAct) {
    actionButtons =
      '<button class="btn btn-ghost btn-sm" style="color:var(--danger);" data-rid="'+_esc(req.requestId)+'" onclick="wfOpenTrainingFailedPrompt(this.dataset.rid)">Did Not Pass</button>' +
      '<button class="btn btn-primary btn-sm" data-rid="'+_esc(req.requestId)+'" data-fn="trainingComplete" onclick="wfOpenActionPrompt(this.dataset.rid,this.dataset.fn,\'Training Passed\')">Training Passed</button>';
  } else if (action && canAct) {
    actionButtons = '<button class="btn '+action.style+' btn-sm" data-rid="'+_esc(req.requestId)+'" data-fn="'+action.fn+'" onclick="wfOpenActionPrompt(this.dataset.rid,this.dataset.fn,\''+_esc(action.label)+'\')">'+action.label+'</button>';
  }
  if (canTriggerApproval) {
    actionButtons += '<button class="btn btn-ghost btn-sm" style="color:#7c3aed;" data-rid="'+_esc(req.requestId)+'" onclick="wfOpenActionPrompt(this.dataset.rid,\'requestManagementApproval\',\'Send for Management Approval\')" title="Needed for a not-yet-catalogued service, e.g. a language-based VA role">⚑ Send for Management Approval</button>';
  }
  // Every stage except Management Approval, Request Intake, and
  // Completed needs an acknowledgement/update at least every 24 hours
  // from whoever currently owns it — given via posting in the Notes/
  // Thread panel (merged into one action rather than a separate button
  // here). Request Intake is excluded deliberately: it's a quick review-
  // and-forward decision, not an ongoing work queue that needs periodic
  // check-ins.
  var isRequestIntake = stage === 'Request Intake';

  var feedbackWarning = (!isMgmtApproval && !isRequestIntake && !isComplete && req.needsFeedback)
    ? '<div style="font-size:12px;font-weight:700;color:#dc2626;display:flex;align-items:center;gap:4px;">⚠ No feedback in the past 24 hours</div>'
    : (isRequestIntake && req.updatedAt && ((new Date() - new Date(req.updatedAt)) / 3600000) > 24
        ? '<div style="font-size:12px;font-weight:700;color:#dc2626;display:flex;align-items:center;gap:4px;">⚠ Still in Request Intake — not yet moved to VA Assignment</div>'
        : '');

  var infoHtml =
    '<div style="display:flex;flex-direction:column;gap:6px;">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;column-gap:14px;row-gap:10px;">' +
        '<div><div style="font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);">Current Stage</div>' +
          '<div style="font-size:13.5px;font-weight:700;color:'+(isComplete?'#15803d':(isMgmtApproval?'#7c3aed':'#1e40af'))+';">'+_esc(stage)+'</div></div>' +
        (!isComplete ? '<div><div style="font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);">Assigned To</div>' +
          '<div style="font-size:13.5px;font-weight:700;'+(isMine?'color:#b45309;':'')+'">'+assigneeHtml+(isMine?' <span style="font-size:11px;">(you)</span>':'')+'</div></div>' : '<div></div>') +
        _reqCustomerContractInline(req) +
        _reqPaymentInline(req) +
      '</div>' +
      (feedbackWarning || (waitingNote ? '<div style="font-size:12px;color:var(--text-muted);font-style:italic;">'+waitingNote+'</div>' : '')) +
    '</div>';
  var actionsHtmlFull = '<div style="display:flex;gap:12px;align-items:center;">' +
    '<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end;">' + (extraLeftButtons||'') + actionButtons + '</div>' +
  '</div>';

  if (splitLayout) return { infoHtml: infoHtml, actionsHtml: actionsHtmlFull };

  return '<div style="display:flex;flex-direction:column;background:'+(isComplete?'#f0fdf4':(isMgmtApproval?'#faf5ff':(req.needsFeedback?'#fef2f2':'#eff6ff')))+';border:1px solid '+(isComplete?'#bbf7d0':(isMgmtApproval?'#e9d5ff':(req.needsFeedback?'#fecaca':'#dbeafe')))+';border-radius:10px;padding:10px 16px;margin:12px 16px;">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">' +
      infoHtml +
      actionsHtmlFull +
    '</div>' +
  '</div>';
}

    .markNoVAAvailable(requestId, notes);

// Shared check for "can the current user act on this request's current
// stage" — same ownership rule the status bar itself uses (exact role
// match, the CS Manager → CS Specialist/Executive override, or
// Administrator). Used both by _wfRenderStatusBar and by the welcome
// popup trigger, so they never disagree about who's actually in charge.
// Per the request — a generic instructions panel applied to all phases,
// not just one. Each stage's own logic lives in _WF_STAGE_INSTRUCTIONS
// below, keyed by CurrentStage, so more stages can be added later
// without restructuring this. A stage with no entry here simply shows
// nothing (see _wfRenderStageInstructions), rather than an empty/broken
// panel.
var _WF_STAGE_INSTRUCTIONS = {
  'Request Intake': function(req) {
    return {
      totalSteps: 1, currentStep: 1,
      label: 'Complete all Request Details and Move to VA Assignment.'
    };
  },
  // VA Assignment and VA Preparation & Mock Interview function as one
  // continuous, Service-Manager-owned flow — assignVA already advances
  // the request straight into VA Prep the instant a VA is assigned, so
  // there's no separate "VA Assignment done" moment in between. Treating
  // both stage names as this same 4-step sequence matches how the work
  // actually happens, rather than splitting it awkwardly across 2 panels.
  'VA Assignment': function(req) { return _wfVaAssignmentAndPrepInstructions(req); },
  'VA Preparation & Mock Interview': function(req) { return _wfVaAssignmentAndPrepInstructions(req); }
};
function _wfVaAssignmentAndPrepInstructions(req) {
  if (!req.hasAcknowledgedCurrentStage && !(CMS.user && CMS.user.role === 'Administrator')) {
    return { totalSteps: 4, currentStep: 1, label: 'Acknowledge the receipt of this ticket first.' };
  }
  var conns = (req.connections || []).filter(function(c){ return c.connectionStatus !== 'Cancelled'; });
  if (!conns.length) {
    return { totalSteps: 4, currentStep: 2, label: 'Assign a VA or Mark No VA Available.' };
  }
  var hasFinal = conns.some(function(c){ return c.isFinalVA; });
  if (!hasFinal) {
    return { totalSteps: 4, currentStep: 3, label: 'Mark Final VA Recommendation.' };
  }
  var anyPrepDone = conns.some(function(c){ return c.vaPrepDone; });
  if (!anyPrepDone) {
    return { totalSteps: 4, currentStep: 4, label: 'Complete VA Preparation and Mock Interview for at least one Assigned VA.' };
  }
  return null; // all 4 steps done — markVAPrepDone's own advance takes it from here
}
function _wfRenderStageInstructions(req) {
  var fn = _WF_STAGE_INSTRUCTIONS[req.currentStage];
  if (!fn) return '';
  var info = fn(req);
  if (!info) return '';
  return '<div class="wf-instructions-panel">' +
    '<span class="wf-instructions-step">' + info.currentStep + '/' + info.totalSteps + '</span>' +
    '<span class="wf-instructions-label">' + _esc(info.label) + '</span>' +
  '</div>';
}

function _reqIntakeChecklist(req) {
  if (req.currentStage !== 'Request Intake') return '';
  var missing = [];

  if (!req.scheduleType && !req.hoursBreakdown) missing.push('Schedule is missing.');
  if (!missing.length) return '';
  return '<div style="background:#fef3c7;border:1px solid #fde68a;border-radius:var(--radius-md);padding:10px 14px;margin-bottom:14px;">' +
    '<div style="font-size:11.5px;font-weight:800;color:#92400e;text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px;">⚠ Before Moving to VA Assignment</div>' +
    missing.map(function(m) {
      return '<div style="font-size:12.5px;color:#92400e;display:flex;align-items:center;gap:6px;"><span style="width:5px;height:5px;border-radius:50%;background:#92400e;flex-shrink:0;"></span>'+_esc(m)+'</div>';
    }).join('') +
  '</div>';
}
function _wfCanActOnRequest(req) {
  if (!CMS.user) return false;
  var role = req.personInChargeRole || '';
  var isMine = CMS.user.role === role;
  var isCSManagerOverride = CMS.user.role === 'CS Manager' && (role === 'CS Specialist' || role === 'Executive');
  var isHRManagerOverride = CMS.user.role === 'HR Manager' && role === 'HR Specialist';
  return isMine || isCSManagerOverride || isHRManagerOverride || CMS.user.role === 'Administrator';

function _wfMaybeShowWelcomePopup(req) {
  var stage = req.currentStage || '';
  if (CMS.user && CMS.user.role === 'Administrator') return;
  // Request Intake is excluded from the acknowledgement system entirely
  // (it's meant to be a quick review-and-forward step, not something that
  // needs ongoing sign-off) — but that also means nothing else ever
  // reminds whoever owns it to actually move it forward. This is that
  // dedicated reminder, specifically for CS Specialist.
  if (stage === 'Request Intake') {
    if (CMS.user && CMS.user.role === 'CS Specialist' && _wfCanActOnRequest(req)) {
      _wfShowRequestIntakeReminder(req);
    }
    return;
  }
  if (!stage || stage === 'Management Approval' || stage === 'Completed') return;
  if (!_wfCanActOnRequest(req)) return;
  if (!req.hasAcknowledgedCurrentStage) {
    _wfShowWelcomePopup(req, stage);
    return;
  }
  // Already acknowledged — for VA Assignment specifically, if there's
  // still no VA on the request at all, nudge with a reminder rather than
  // staying silent just because the initial acknowledgement is done.
  if (stage === 'VA Assignment' && !(req.connections && req.connections.length)) {
    _wfShowNoVAAssignedPopup(req);
  }
}

// Admin-only delete icon for a note — shared across all note-rendering
// locations. Confirms before deleting since this permanently removes part

function _reqNoteDeleteIcon(noteId) {
  if (!CMS.user || CMS.user.role !== 'Administrator') return '';
  return '<button class="btn btn-ghost btn-icon" data-nid="'+_esc(noteId)+'" onclick="_reqConfirmDeleteNote(this.dataset.nid)" title="Delete note (Administrator)" style="margin-left:auto;padding:1px 4px;color:var(--danger);flex-shrink:0;"><svg width="11" height="11" viewBox="0 0 20 20" fill="none"><path d="M4 6h12M8 6V4a1 1 0 011-1h2a1 1 0 011 1v2m-7 0v11a1 1 0 001 1h8a1 1 0 001-1V6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';

function _reqConfirmDeleteNote(noteId) {
  if (!confirm('Delete this note? This cannot be undone.')) return;
  var noteEl = document.querySelector('[data-note-id="'+noteId+'"]');
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { showToast((res&&res.error)||'Failed to delete note.', 'error'); return; }
      if (noteEl) noteEl.remove();
      showToast('Note deleted.', 'success');
    })

    .deleteVAConnectionNote(noteId);
}
function reqPostNote(requestId, connectionId) {
  var content = ((document.getElementById('f_noteContent')||{}).value||'').trim();
  var postDate = (document.getElementById('f_notePostDate')||{}).value || '';
  if (!content) { showToast('Please write something before posting.','warning'); return; }
  var btn = document.querySelector('.note-compose .btn-primary');
  var originalLabel = btn ? btn.textContent : 'Acknowledge and Update';
  if (btn) { btn.disabled=true; btn.textContent='Posting…'; }
  google.script.run
    .withSuccessHandler(function(res){
      if(!res||!res.success){ showToast((res&&res.error)||'Failed.','error'); if(btn){btn.disabled=false;btn.textContent=originalLabel;} return; }
      // Append new note inline without full reload
      var thread = document.getElementById('notesThread');
      if (thread) {
        var existingEmpty = thread.querySelector('.empty-state');
        if (existingEmpty) existingEmpty.remove();
        var noteEl = document.createElement('div');
        noteEl.className = 'note-item note-self';
        noteEl.style.maxWidth = '100%';
        noteEl.setAttribute('data-note-id', res.id || '');
        noteEl.innerHTML =
          '<div class="note-bubble" style="max-width:100%;padding:6px 10px;">' +
            '<div class="note-meta" style="display:flex;align-items:center;gap:5px;font-size:11px;"><span style="width:16px;height:16px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;">'+_esc((res.authorName||'?').charAt(0).toUpperCase())+'</span><strong>'+_esc(res.authorName)+'</strong> <span style="color:var(--text-muted);">'+(postDate && postDate !== _todayStr() ? _fdate(postDate) : 'Just now')+'</span>'+_reqNoteDeleteIcon(res.id)+'</div>' +
            '<div class="note-content" style="font-size:12px;margin-top:3px;white-space:pre-wrap;">'+_esc(res.content)+'</div>' +
          '</div>';
        thread.appendChild(noteEl);
        thread.scrollTop = thread.scrollHeight;
      }
      var inp = document.getElementById('f_noteContent');
      if (inp) inp.value='';
      // Per this report — reset the button's text immediately and
      // unconditionally, rather than only inside the second, nested
      // call below. That inner call refining the label further (Add
      // Update vs Acknowledge and Update) is a nice-to-have; it must
      // never be the only thing standing between the button and getting
      // stuck showing "Posting…" if that inner call fails.
      if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
      // The post may have just satisfied the acknowledgement requirement
      // for whoever owns the current stage — refresh the status bar/
      // guidance so the warning/banner reflects that immediately, and
      // flip the button's own label to "Add Update" now that the first
      // acknowledgement for this stage has happened.
      google.script.run
        .withSuccessHandler(function(freshRes) {
          if (!freshRes || !freshRes.success) return;
          var heroInfoWrap = document.getElementById('wfHeroInfoWrap');
          var wfWrap = document.getElementById('wfStatusBarWrap');
          if (heroInfoWrap) {
            // Full page — infoHtml and actionsHtml live in separate cards
            var editCloseDeleteButtons = window._reqEditCloseDeleteButtons || '';
            var split = _wfRenderStatusBar(freshRes.data, editCloseDeleteButtons, true);
            heroInfoWrap.innerHTML = split.infoHtml;
            if (wfWrap) wfWrap.innerHTML = split.actionsHtml;
          } else if (wfWrap) {
            // Modal — single combined bar
            wfWrap.innerHTML = _wfRenderStatusBar(freshRes.data);
          }
          if (window._reqProfileData) window._reqProfileData = freshRes.data;
          // Per this report — the instructions panel never refreshed
          // after an acknowledgement, so it kept showing stale guidance
          // (e.g. "Acknowledge the receipt") even right after that had
          // just been done.
          var stageInstrWrap = document.getElementById('stageInstructionsWrap');
          if (stageInstrWrap) stageInstrWrap.innerHTML = _wfRenderStageInstructions(freshRes.data);
          var submitBtn = document.getElementById('reqNoteSubmitBtn');
          if (submitBtn) submitBtn.textContent = freshRes.data.currentStage === 'Request Intake' ? 'Update' : (freshRes.data.hasAcknowledgedCurrentStage ? 'Add Update' : 'Acknowledge and Update');
        })
        .withFailureHandler(function(err) { console.error('[reqPostNote] refresh after post failed:', err.message); })
        .getVARequestDetail(requestId);
    })
    .withFailureHandler(function(err){ showToast(err.message,'error'); if(btn){btn.disabled=false;btn.textContent=originalLabel;} })
    .addVAConnectionNote({ requestId: requestId, connectionId: connectionId, content: content, postDate: postDate });
}

function settingsSubmit(settingId, categoryKey) {
  var valueEl = document.getElementById('f_settingValue');
  var labelEl = document.getElementById('f_settingLabel');
  var errEl   = document.getElementById('settingFormErr');
  var valueStr = valueEl ? valueEl.value.trim() : '';
  var labelStr = labelEl ? labelEl.value.trim() : '';

  if (!valueStr) { if (errEl) errEl.textContent = 'Value is required.'; return; }
  if (errEl) errEl.textContent = '';

  var submitBtn = document.getElementById('settingSubmitBtn');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Saving…'; }

  var parentDeptEl = document.getElementById('f_settingParentDept');
  var parentDeptVal = parentDeptEl ? parentDeptEl.value : '';
  var timezoneEl = document.getElementById('f_settingTimezone');
  var timezoneVal = timezoneEl ? timezoneEl.value : '';
  var payload = { category: categoryKey, value: valueStr, label: labelStr || valueStr, parentDepartment: parentDeptVal, timezone: timezoneVal };

  function onDone(res) {
    if (!res || !res.success) {
      if (errEl) errEl.textContent = res && res.errors ? res.errors.join(' ') : ((res && res.error) || 'Save failed.');
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = settingId ? 'Save Changes' : 'Add Entry'; }
      return;
    }
    closeModal();
    showToast('Setting saved.', 'success');
    _settingsReloadAndRefresh();
  }
  function onFail(err) { showToast(err.message, 'error'); if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Save'; } }

  if (settingId) {
    google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).updateSetting(settingId, payload);
  } else {
    google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).createSetting(payload);
  }
}

function settingsConfirmDelete(settingId, valueStr) {
  openModal(
    '<div class="modal-header"><div class="modal-title">Delete Entry</div><button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button></div>' +
    '<div class="modal-body">' +
      '<p style="font-size:14px;">Delete <strong>' + _esc(valueStr) + '</strong>?</p>' +
      '<p style="font-size:13px;color:var(--text-muted);margin-top:8px;">This will remove it from all dropdown menus. Existing records using this value will not be affected.</p>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-danger" onclick="settingsDoDelete(\'' + _esc(settingId) + '\')">Delete</button>' +
    '</div>'
  );
}

function settingsDoDelete(settingId) {
  google.script.run
    .withSuccessHandler(function (res) {
      closeModal();
      if (res && res.success) { showToast('Entry deleted.', 'success'); _settingsReloadAndRefresh(); }
      else showToast((res && res.error) || 'Failed.', 'error');
    })
    .withFailureHandler(function (err) { showToast(err.message, 'error'); })
    .deleteSetting(settingId);
}

function settingsToggleActive(settingId, newActiveState) {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) { showToast((res && res.error) || 'Failed.', 'error'); return; }
      showToast('Entry ' + (newActiveState ? 'activated' : 'deactivated') + '.', 'success');
      _settingsReloadAndRefresh();
    })
    .withFailureHandler(function (err) { showToast(err.message, 'error'); })
    .toggleSettingActive(settingId, newActiveState);
}

function settingsMoveUp(settingId) {
  var tabRows = _settingsAllData
    .filter(function (settingRow) { return settingRow.category === _settingsTab; })
    .sort(function (rowA, rowB) { return (rowA.sortOrder || 0) - (rowB.sortOrder || 0); });

  var currentIdx = tabRows.findIndex(function (settingRow) { return settingRow.settingId === settingId; });
  if (currentIdx <= 0) return;

  // Swap with previous
  var temp = tabRows[currentIdx];
  tabRows[currentIdx]     = tabRows[currentIdx - 1];
  tabRows[currentIdx - 1] = temp;

  var orderedIds = tabRows.map(function (settingRow) { return settingRow.settingId; });
  _settingsSaveOrder(orderedIds);
}

function settingsMoveDown(settingId) {
  var tabRows = _settingsAllData
    .filter(function (settingRow) { return settingRow.category === _settingsTab; })
    .sort(function (rowA, rowB) { return (rowA.sortOrder || 0) - (rowB.sortOrder || 0); });

  var currentIdx = tabRows.findIndex(function (settingRow) { return settingRow.settingId === settingId; });
  if (currentIdx < 0 || currentIdx >= tabRows.length - 1) return;

  var temp = tabRows[currentIdx];
  tabRows[currentIdx]     = tabRows[currentIdx + 1];
  tabRows[currentIdx + 1] = temp;

  var orderedIds = tabRows.map(function (settingRow) { return settingRow.settingId; });
  _settingsSaveOrder(orderedIds);
}

function _settingsSaveOrder(orderedIds) {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) { showToast('Reorder failed.', 'error'); return; }
      _settingsReloadAndRefresh();
    })
    .withFailureHandler(function (err) { showToast(err.message, 'error'); })
    .reorderSettings(_settingsTab, orderedIds);
}

// Reload from server, refresh panel AND update CMS.settings for dropdowns
function _settingsReloadAndRefresh() {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) return;
      _settingsAllData = res.data || [];
      _settingsRenderPanel();
      // Also refresh CMS.settings so dropdowns stay in sync
      google.script.run
        .withSuccessHandler(function (settingsMap) { if (settingsMap) CMS.settings = settingsMap; })
        .getSettingsMap();
    })
    .withFailureHandler(function (err) { showToast(err.message, 'error'); })
    .getSettingsForAdmin();
}

// Switches the body textarea between Plain Text and HTML modes.
// Only changes styling cues and the hint text — the textarea content is
// untouched so the CS never loses work by toggling the mode.
function etSetBodyMode(isHtml) {
  var hiddenEl = document.getElementById('f_etIsHtml');
  var textBtn  = document.getElementById('etModeText');
  var htmlBtn  = document.getElementById('etModeHtml');
  var hintEl   = document.getElementById('etBodyHint');
  var bodyEl   = document.getElementById('f_etBody');
  if (!hiddenEl) return;

  hiddenEl.value = isHtml ? '1' : '0';

  if (textBtn) { textBtn.style.background = isHtml ? 'var(--surface-2)' : 'var(--accent)'; textBtn.style.color = isHtml ? 'var(--text-secondary)' : '#fff'; }
  if (htmlBtn) { htmlBtn.style.background = isHtml ? 'var(--accent)' : 'var(--surface-2)'; htmlBtn.style.color = isHtml ? '#fff' : 'var(--text-secondary)'; }
  if (bodyEl)  { bodyEl.style.fontFamily = isHtml ? 'var(--font-mono)' : 'inherit'; }

  if (hintEl) hintEl.innerHTML = (isHtml

function etSubmit(templateId) {

  var subjectVal = ((document.getElementById('f_etSubject')||{}).value||'').trim();
  var bodyVal    = (document.getElementById('f_etBody')||{}).value||'';
  var errEl = document.getElementById('etFormErr');
  if (!nameVal)    { if (errEl) errEl.textContent = 'Template Name is required.'; return; }
  if (!subjectVal) { if (errEl) errEl.textContent = 'Subject is required.'; return; }
  if (!bodyVal.trim()) { if (errEl) errEl.textContent = 'Body is required.'; return; }
  if (errEl) errEl.textContent = '';

  var btn = document.getElementById('etSubmitBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  var moduleVal = (document.getElementById('f_etModule')||{}).value || 'Celebrations';
  var payload = {
    module:    moduleVal,
    category:  moduleVal === 'Celebrations' ? ((document.getElementById('f_etCategory')||{}).value || '') : '',
    name:      nameVal,
    subject:   subjectVal,
    body:      bodyVal,
    imageUrl:  ((document.getElementById('f_etImageUrl')||{}).value||'').trim(),
    isHtml:    (document.getElementById('f_etIsHtml')||{}).value === '1',
    isActive:  !!(document.getElementById('f_etIsActive')||{}).checked,
    isDefault: !!(document.getElementById('f_etIsDefault')||{}).checked
  };

  function onDone(res) {
    if (!res || !res.success) {
      if (errEl) errEl.textContent = (res && res.errors ? res.errors.join(' ') : (res && res.error)) || 'Save failed.';
      if (btn) { btn.disabled = false; btn.textContent = templateId ? 'Save Changes' : 'Add Template'; }
      return;
    }
    closeModal();
    showToast('Template saved.', 'success');
    _etRenderPanel(document.getElementById('settingsPanel'));
  }
  function onFail(err) { showToast(err.message, 'error'); if (btn) { btn.disabled = false; btn.textContent = 'Save'; } }
  if (templateId) google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).updateEmailTemplate(templateId, payload);
  else            google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).createEmailTemplate(payload);
}

// Bug fix (2026-06-24): reqApplyFilters actually reads window._reqOpenOnly
// to decide whether to restrict to Open/In Progress — but this function was
// setting window._reqOpenFilter instead (an unused, similarly-named variable
// left over from an earlier version), so _reqOpenOnly stayed stuck at its
// default of `true` forever. Every tab — including "All" and every specific
// type — was silently filtered down to Open/In Progress only, since nothing
// ever cleared it. The "Open" tab is now the ONLY one that sets it true;
// every other tab clears it.
function reqSetOpenTab(btn) {
  document.querySelectorAll('#reqTypeTabs .req-type-tab').forEach(function(b){b.classList.remove('active');});
  if(btn) btn.classList.add('active');
  window._reqOpenOnly = true;
  var sel = document.getElementById('reqTypeFilter');
  if (sel) sel.value = '';
  _reqPageNum = 1; reqApplyFilters();
}

function reqSetTypeTab(btn, typeVal) {
  document.querySelectorAll('.req-type-tab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  // "All" and every specific-type tab show requests regardless of status —
  // only the dedicated "Open" tab (reqSetOpenTab above) restricts to Open/In Progress.
  window._reqOpenOnly = false;
  var sel = document.getElementById('reqTypeFilter');
  if (sel) { sel.value = typeVal; }
  _updateReqStats();
  _reqPageNum = 1;
  reqApplyFilters();
}

// BIRTHDAYS & ANNIVERSARIES MODULE
// Two tabs: VA Birthdays (next 30 days) and Work Anniversaries (VA↔Client
// connection start dates, next 30 days). Both follow the same pattern:
// Notify → editable preview → send; Follow-up → second editable preview →
// send. Recipients are resolved server-side every time (never trusted from
// stale client state) so the BCC/TO list is always current.
// ══════════════════════════════════════════════════════════
var _celTab = 'birthdays';
var _celBirthdays = [], _celAnniversaries = [];

// ── State ──────────────────────────────────────────────────────────────
var _celTab          = 'birthdays';
var _celBirthdays    = [];
var _celAnniversaries= [];
var _celPageSize     = 10;
var _celPage         = 1;
var _celCsFilter     = '';
var _celStatusFilter = '';
var _celWindow       = 'month';  // 'week' | 'next_week' | 'month' | 'next_month' | 'range'
var _celWindowFrom   = '';       // ISO date string, only used when _celWindow === 'range'
var _celWindowTo     = '';

// Real bug fixed here: the quick windows were rolling day counts from today
// (This Month = the next 30 days, Next Week = the next 14, Next Month = the next
// 60), and nothing filtered them afterwards — so "Next Month" still listed
// everything from today onward, this month's birthdays included. They are now
// proper CALENDAR windows, expressed as a range of days-from-today (which each
// row already carries as daysUntil, the same number behind "Today"/"Tomorrow"):
//   This Week  — today through this Sunday
//   Next Week  — next Monday through next Sunday
//   This Month — today through the last day of this month
//   Next Month — the 1st through the last day of next month
function _celWindowSpan() {
  var t = new Date(); t.setHours(0, 0, 0, 0);
  var dow = t.getDay() === 0 ? 7 : t.getDay();   // Mon = 1 … Sun = 7
  var daysLeftInMonth = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate() - t.getDate();
  var daysInNextMonth = new Date(t.getFullYear(), t.getMonth() + 2, 0).getDate();
  if (_celWindow === 'week')       return { from: 0, to: 7 - dow };
  if (_celWindow === 'next_week')  return { from: 8 - dow, to: 14 - dow };
  if (_celWindow === 'month')      return { from: 0, to: daysLeftInMonth };
  if (_celWindow === 'next_month') return { from: daysLeftInMonth + 1, to: daysLeftInMonth + daysInNextMonth };
  return null; // date-range mode — filtered by the chosen dates instead
}
function _celWindowDays() {
  // How many days ahead to ask the backend for — far enough to cover the whole window.
  var span = _celWindowSpan();
  return span ? Math.max(span.to, 1) : 60; // range — fetch 60 days and filter client-side
}
function _celDaysUntil(r) {
  if (typeof r.daysUntil === 'number' && !isNaN(r.daysUntil)) return r.daysUntil;
  if (r.nextOccurrence) {
    var t = new Date(); t.setHours(0, 0, 0, 0);
    var o = new Date(r.nextOccurrence); o.setHours(0, 0, 0, 0);
    return Math.round((o - t) / 86400000);
  }
  return null;
}

// CLIENT PAYMENTS — CS Manager uploads a CSV each month; everyone in CS
// can view the resulting pivot (customer × month/year).
// ══════════════════════════════════════════════════════════════
function _renderClientPaymentsPage(container) {
  var canUpload = CMS.user && (CMS.user.role === 'CS Manager' || CMS.user.role === 'Administrator');
  container.innerHTML =

        (canUpload ? '<button class="btn btn-primary btn-sm" onclick="cpayOpenUpload()">📤 Upload CSV</button>' : '') +
      '</div>' +
      '<div id="cpayGridBody" style="margin-top:10px;"><div class="loading-screen" style="height:200px;"><div class="loader-ring"></div></div></div>' +
    '</div>';
  cpayLoadGrid();
}
function cpayLoadGrid() {
  var body = document.getElementById('cpayGridBody'); if (!body) return;
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { body.innerHTML = '<div class="empty-state" style="padding:32px;"><h3>Could not load payment data</h3><p>'+_esc((res&&res.error)||'')+'</p></div>'; return; }
      _cpayRenderGrid(body, res.records, res.periods);
    })
    .withFailureHandler(function(err) { body.innerHTML = '<div class="empty-state" style="padding:32px;"><h3>Error</h3><p>'+_esc(err.message)+'</p></div>'; })
    .getClientPaymentsGrid();
}
function _cpayRenderGrid(body, records, periods) {
  if (!periods.length) {
    body.innerHTML = '<div class="empty-state" style="padding:40px;"><h3>No payment data uploaded yet</h3><p>Upload a CSV to get started.</p></div>';
    return;
  }
  // Pivot: one row per distinct customer, one column per period.
  var customersById = {};
  records.forEach(function(r) {
    if (!customersById[r.customerId]) customersById[r.customerId] = { customerId: r.customerId, customerName: r.customerName, byPeriod: {} };
    if (r.customerName && !customersById[r.customerId].customerName) customersById[r.customerId].customerName = r.customerName;
    customersById[r.customerId].byPeriod[r.period] = r.status;
  });
  var customerRows = Object.keys(customersById).map(function(k){ return customersById[k]; })
    .sort(function(a,b){ return (a.customerName||a.customerId).localeCompare(b.customerName||b.customerId); });

  var headerCells = periods.map(function(p) { return '<th style="text-align:center;">'+_esc(p.month)+' '+_esc(p.year)+'</th>'; }).join('');
  var rows = customerRows.map(function(c) {
    var cells = periods.map(function(p) {
      var status = c.byPeriod[p.month+' '+p.year];
      if (!status) return '<td style="text-align:center;color:var(--text-muted);">—</td>';
      var isPaid = status === 'Paid';
      return '<td style="text-align:center;"><span class="badge '+(isPaid?'badge-active':'badge-terminated')+'" style="font-size:10.5px;">'+_esc(status)+'</span></td>';
    }).join('');
    return '<tr><td style="font-weight:600;">'+_esc(c.customerName||c.customerId)+'</td>'+cells+'</tr>';
  }).join('');

  body.innerHTML =
    '<div class="table-wrap"><table>' +
      '<thead><tr><th>Customer</th>'+headerCells+'</tr></thead>' +
      '<tbody>'+rows+'</tbody>' +
    '</table></div>';
}

function cpayDoUpload() {
  var fileEl = document.getElementById('f_cpayFile');
  var errEl = document.getElementById('cpayUploadErr');
  if (!fileEl || !fileEl.files || !fileEl.files.length) { if (errEl) errEl.textContent = 'Please choose a CSV file.'; return; }

      .withSuccessHandler(function(res) {

      })
      .uploadClientPaymentsCSV(e.target.result, month, year);
  };
  reader.readAsText(fileEl.files[0]);
}

  _celTab = tab;

function celSetWindow(win) {

function celRefresh() {

    .withSuccessHandler(function(res) {

      celPopulateCsFilter();

// Populate the CS Specialist filter dropdown from the union of both datasets
function celPopulateCsFilter() {
  var sel = document.getElementById('celCsFilter'); if (!sel) return;
  var specialists = {};
  _celBirthdays.concat(_celAnniversaries).forEach(function(r) {
    if (r.csAssigned && typeof r.csAssigned === 'string') specialists[r.csAssigned] = true;
  });
  var opts = '<option value="">All CS Specialists</option>' +
    Object.keys(specialists).sort().map(function(s){
      return '<option value="'+_esc(s)+'">'+_esc(s)+'</option>';
    }).join('');
  sel.innerHTML = opts;
  if (_celCsFilter) sel.value = _celCsFilter;
}

function celApplyFilters() {
  var q = ((document.getElementById('celSearch')||{}).value||'').toLowerCase();
  _celCsFilter     = (document.getElementById('celCsFilter')    ||{}).value||'';
  _celStatusFilter = (document.getElementById('celStatusFilter')||{}).value||'';

  // Date-range filter (client-side, applies when _celWindow === 'range')
  var rangeFrom = null, rangeTo = null;
  if (_celWindow === 'range') {
    var fromVal = ((document.getElementById('celRangeFrom')||{}).value||'');
    var toVal   = ((document.getElementById('celRangeTo')||{}).value||'');
    if (fromVal) { rangeFrom = new Date(fromVal); rangeFrom.setHours(0,0,0,0); }
    if (toVal)   { rangeTo   = new Date(toVal);   rangeTo.setHours(23,59,59,999); }
  }
  var calSpan = _celWindowSpan();
  function matchWindow(r) {
    if (calSpan) { var du = _celDaysUntil(r); return du !== null && du >= calSpan.from && du <= calSpan.to; }
    if (_celWindow !== 'range') return true;
    var occ = r.nextOccurrence ? new Date(r.nextOccurrence) : null;
    if (!occ) return false;
    if (rangeFrom && occ < rangeFrom) return false;
    if (rangeTo   && occ > rangeTo)   return false;
    return true;
  }

  var celConnFilter = (document.getElementById('celConnFilter')||{}).value || '';

  if (_celTab === 'birthdays') {
    var rows = _celBirthdays.filter(function(r) {
      if (!matchWindow(r)) return false;
      if (q && (r.vaName+' '+r.clientName+' '+r.csAssigned).toLowerCase().indexOf(q) === -1) return false;
      if (_celCsFilter     && r.csAssigned   !== _celCsFilter)    return false;
      if (_celStatusFilter && r.notifStatus  !== _celStatusFilter) return false;
      if (celConnFilter === 'active' && !r.clientId) return false; // no active VA connection on this row
      if (celConnFilter === 'none'   && r.clientId)  return false;
      return true;
    });
    _celPage = 1;
    celRenderBirthdays(rows);
  } else {
    var rows2 = _celAnniversaries.filter(function(r) {
      if (!matchWindow(r)) return false;
      if (q && (r.vaName+' '+r.accountName+' '+r.companyName+' '+r.csAssigned).toLowerCase().indexOf(q) === -1) return false;
      if (_celCsFilter     && r.csAssigned   !== _celCsFilter)     return false;
      if (_celStatusFilter && r.notifStatus  !== _celStatusFilter)  return false;
      return true;
    });
    _celPage = 1;
    celRenderAnniversaries(rows2);
  }
}

// ── Pager ─────────────────────────────────────────────────────────────
function celGoPage(pg) {
  var pager = document.getElementById('celPager'); if (!pager) return;
  // _celPageTotal is set by the last render call
  if (pg >= 1 && pg <= (window._celPageTotal||1)) { _celPage = pg; celApplyFilters(); }
}

function _celRenderPager(total) {
  var el = document.getElementById('celPager'); if (!el) return;
  window._celPageTotal = Math.max(1, Math.ceil(total / _celPageSize));
  var pages = window._celPageTotal;
  if (total === 0) { el.innerHTML = ''; return; }
  var start = (_celPage - 1) * _celPageSize + 1;
  var end   = Math.min(_celPage * _celPageSize, total);
  var btns  = '';
  for (var pg = 1; pg <= pages; pg++) {
    if (pg === 1 || pg === pages || Math.abs(pg - _celPage) <= 1) {
      btns += '<button class="page-btn' + (pg === _celPage ? ' active' : '') + '" onclick="celGoPage('+pg+')">'+pg+'</button>';
    } else if (Math.abs(pg - _celPage) === 2) {
      btns += '<span style="padding:0 4px;color:var(--text-muted)">…</span>';
    }
  }
  el.innerHTML =
    '<span>Showing ' + start + '–' + end + ' of ' + total + '</span>' +
    '<div class="page-btns">' +
      '<button class="page-btn" onclick="celGoPage('+(_celPage-1)+')"' + (_celPage===1?' disabled':'')+'>‹</button>' +
      btns +
      '<button class="page-btn" onclick="celGoPage('+(_celPage+1)+')"' + (_celPage>=pages?' disabled':'')+'>›</button>' +
    '</div>';
}

// HOURS / SCHEDULE CHANGES MODULE
// A dedicated page for changing a VA connection's hours, schedule type,
// connection type (Fixed → Project-Based etc.), and setting time-limited
// hour allocations. Completely separate from the Service Requests module.
// ═══════════════════════════════════════════════════════════════════

var _hscConns = [];       // all loaded connections
var _hscSelected = null;  // currently selected connection object

// ═══════════════════════════════════════════
// DAILY HOURS BUILDER — shared widget
// ═══════════════════════════════════════════
// Used wherever an Hours Type of "Daily" needs a day-by-day breakdown
// instead of one flat weekly number: the Service Request form, the Assign
// VA modal, and the Hours & Schedule Changes "Hours Update" form. Each
// instance is keyed by its own idPrefix so multiple can exist on a page
// without colliding (though in practice only one is ever visible at a time).
//
// UX: an "Average" field fills Mon–Fri with that value when typed into —
// Sat/Sun are deliberately left alone (most schedules don't default to
// working weekends) — but every day stays individually editable afterward,
// average or not.
var DAILY_HOURS_DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function dailyHoursBuilderHtml(idPrefix) {
  var dayInputs = DAILY_HOURS_DAYS.map(function(d) {
    return '<div style="width:56px;">' +
      '<label style="font-size:10.5px;color:var(--text-muted);display:block;text-align:center;margin-bottom:2px;">' + d + '</label>' +
      '<input class="form-input daily-hours-day" type="number" min="0" step="0.5" id="' + idPrefix + '_' + d + '" ' +
        'style="text-align:center;padding:6px 4px;" oninput="dailyHoursRecalcTotal(\'' + idPrefix + '\')" />' +
    '</div>';
  }).join('');
  return (
    '<div class="form-group">' +
      '<label class="form-label" id="' + idPrefix + 'AvgLabel">Average (hrs/day)</label>' +
      '<input class="form-input" type="number" min="0" step="0.5" id="' + idPrefix + 'Avg" data-mode="daily" style="max-width:140px;" placeholder="e.g. 8" oninput="dailyHoursApplyAverage(\'' + idPrefix + '\')" />' +
      '<div class="form-hint" id="' + idPrefix + 'AvgHint">Fills Mon–Fri below — every day still stays individually editable.</div>' +
    '</div>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">' + dayInputs + '</div>' +
    '<div style="font-size:13px;font-weight:700;">Weekly Total: <span id="' + idPrefix + 'Total">0</span> hrs</div>'
  );
}

// mode: 'daily' (default) — the average fills every Mon–Fri day with the
// SAME value typed. 'weeklyTotal' — the value typed is a total for the
// whole week, split evenly across Mon–Fri instead.
function dailyHoursSetAverageMode(idPrefix, mode) {
  var avgEl = document.getElementById(idPrefix + 'Avg');
  var labelEl = document.getElementById(idPrefix + 'AvgLabel');
  var hintEl = document.getElementById(idPrefix + 'AvgHint');
  if (avgEl) avgEl.dataset.mode = mode;
  if (labelEl) labelEl.textContent = (mode === 'weeklyTotal') ? 'Total Weekly Hours' : 'Average (hrs/day)';
  if (hintEl) hintEl.textContent = (mode === 'weeklyTotal')
    ? 'Splits evenly across Mon–Fri below — every day still stays individually editable.'
    : 'Fills Mon–Fri below — every day still stays individually editable.';
}

function dailyHoursApplyAverage(idPrefix) {
  var avgEl = document.getElementById(idPrefix + 'Avg');
  var raw = parseFloat((avgEl||{}).value) || 0;
  var mode = (avgEl && avgEl.dataset.mode) || 'daily';
  var perDay = mode === 'weeklyTotal' ? (raw / 5) : raw;
  ['Mon','Tue','Wed','Thu','Fri'].forEach(function(d) {
    var el = document.getElementById(idPrefix + '_' + d);
    if (el) el.value = perDay;
  });
  dailyHoursRecalcTotal(idPrefix);
}

function dailyHoursRecalcTotal(idPrefix) {
  var total = dailyHoursWeeklyTotal(idPrefix);
  var totalEl = document.getElementById(idPrefix + 'Total');
  if (totalEl) totalEl.textContent = total;

  // Mismatch check against the PH working window — only wired up for the
  // 3 known Service Request contexts (multi-service form with its sfx,
  // single-service form, Hours & Schedule Change modal); this function
  // itself is generic and used elsewhere for unrelated day-hours builders.
  var m = /^reqDaily(.*)$/.exec(idPrefix);
  if (m) { _reqCheckHoursMismatch(idPrefix, 'f_reqPh', m[1], 'f_reqHoursMismatchWarn' + m[1]); }
  else if (idPrefix === 'hscDaily') { _reqCheckHoursMismatch(idPrefix, 'hscModalPh', '', 'hscModalHoursMismatchWarn'); }
}

// One group per day with a nonzero value — a valid (and simplest-to-edit)
// form of the same {days:[...],hoursPerDay:N} breakdown format
// VAConnectionHoursLog uses; the calculation engine doesn't care whether a
// group covers one day or several.
function dailyHoursCollectBreakdown(idPrefix) {
  var breakdown = [];
  DAILY_HOURS_DAYS.forEach(function(d) {
    var v = parseFloat((document.getElementById(idPrefix + '_' + d)||{}).value) || 0;
    if (v > 0) breakdown.push({ days: [d], hoursPerDay: v });
  });
  return breakdown;
}

function dailyHoursWeeklyTotal(idPrefix) {
  return dailyHoursCollectBreakdown(idPrefix).reduce(function(sum, g) { return sum + g.hoursPerDay; }, 0);
}

// Pre-fills day inputs from an existing breakdown (editing something that
// already has Daily hours set) — reverses dailyHoursCollectBreakdown.
function dailyHoursPrefill(idPrefix, breakdown) {
  if (!breakdown || !breakdown.length) return;
  breakdown.forEach(function(g) {
    (g.days || []).forEach(function(d) {
      var el = document.getElementById(idPrefix + '_' + d);
      if (el) el.value = g.hoursPerDay;
    });
  });
  dailyHoursRecalcTotal(idPrefix);
  // Populate the Average field too — if every weekday already has the
  // same value (the common case for a fixed daily schedule), show that
  // shared value rather than leaving this field blank even though the
  // individual days above are already correctly pre-filled.
  var avgEl = document.getElementById(idPrefix + 'Avg');
  if (avgEl) {
    var weekdayVals = DAILY_HOURS_DAYS.filter(function(d){ return d !== 'Sat' && d !== 'Sun'; })
      .map(function(d) { var el = document.getElementById(idPrefix + '_' + d); return el ? Number(el.value)||0 : 0; })
      .filter(function(v){ return v > 0; });
    if (weekdayVals.length && weekdayVals.every(function(v){ return v === weekdayVals[0]; })) {
      avgEl.value = weekdayVals[0];
    }
  }
}

// "All Connections" tab — every VA Connection's CURRENT hours/schedule
// state at a glance: total hours, hours type, which days are worked, and
// hours-per-day for each. Reuses _hscConns (already loaded for the Add
// Change modal's client picker) rather than a fresh fetch.
// Finds the most recent VAConnectionHoursLog entry for a connection that
// actually defines a schedule (excludes Limited Period overrides and
// one-off Project Hours Entry logs, same exclusions _hoursBuildTimeline in
// VAHoursService.gs uses) — this is "the current state" per the log, which
// is the source of truth this tab is meant to reflect rather than
// VAConnections' own Hours/HoursType columns.
function _hscLatestLogEntryFor(connectionId) {
  var candidates = _hscAllLogs.filter(function(l) {
    return l.connectionId === connectionId && l.changeType !== 'Limited Period' && l.changeType !== 'Project Hours Entry';
  });
  if (!candidates.length) return null;
  candidates.sort(function(a,b){ return new Date(b.effectiveDate||b.createdAt||0) - new Date(a.effectiveDate||a.createdAt||0); });
  return candidates[0];
}

var HSC_STATUS_FILTER_DEFAULT = 'Started';

function _hscDayChipsHtml(breakdown, hoursType) {
