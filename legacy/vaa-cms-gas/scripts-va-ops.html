function _loadReqListInner() {
  console.log('[REQ] _loadReqListInner(): firing getVARequestList()…');
  var _t = Date.now();
  google.script.run
    .withSuccessHandler(function (res) {
      console.log('[REQ] getVARequestList() responded after ' + (Date.now()-_t) + 'ms. success=', res && res.success, 'rows=', res && res.data && res.data.length);
      if (!res || !res.success) {

var _reqDateFilter = { preset:'all', from:'', to:'' };

function reqDatePreset(preset) {
  _reqDateFilter.preset = preset;
  var custom = document.getElementById('reqCustomDates');
  if (custom) custom.style.display = preset === 'custom' ? 'flex' : 'none';
  if (preset !== 'custom') {
    var now = new Date(), y = now.getFullYear(), m = now.getMonth();
    if (preset === 'mtd') {
      _reqDateFilter.from = _ymdLocal(new Date(y, m, 1));
      _reqDateFilter.to   = _ymdLocal(now);
    } else if (preset === 'lastmonth') {
      _reqDateFilter.from = _ymdLocal(new Date(y, m-1, 1));
      _reqDateFilter.to   = _ymdLocal(new Date(y, m, 0));
    } else if (preset === 'qtd') {
      var qStart = new Date(y, Math.floor(m/3)*3, 1);
      _reqDateFilter.from = _ymdLocal(qStart);
      _reqDateFilter.to   = _ymdLocal(now);
    } else if (preset === 'ytd') {
      _reqDateFilter.from = _ymdLocal(new Date(y, 0, 1));
      _reqDateFilter.to   = _ymdLocal(now);
    } else {
      _reqDateFilter.from = ''; _reqDateFilter.to = '';
    }
  }
  // "All Time" needs the genuinely complete dataset from the server — by
  // default, closed requests older than 6 months are excluded there for
  // performance (see getVARequests in VARequestService.gs). Without this,
  // selecting "All Time" here would just re-filter that already-limited
  // set, silently showing an incomplete view under a label that promises
  // everything.
  if (preset === 'all' && !window._reqAllTimeLoaded) {
    window._reqAllTimeLoaded = true;
    _loadReqList();
    return;
  }
  _updateReqStats();
  reqApplyFilters();
}

function _reqDateInRange(r) {
  if (_reqDateFilter.preset === 'custom') {
    _reqDateFilter.from = (document.getElementById('reqDateFrom')||{}).value || '';
    _reqDateFilter.to   = (document.getElementById('reqDateTo')||{}).value   || '';
  }
  if (!_reqDateFilter.from && !_reqDateFilter.to) return true;
  var d = r.createdAt ? new Date(r.createdAt) : null;
  if (!d) return true;
  var ds = _ymdLocal(d);
  if (_reqDateFilter.from && ds < _reqDateFilter.from) return false;
  if (_reqDateFilter.to   && ds > _reqDateFilter.to)   return false;
  return true;
}

function _updateReqStats() {
  var activeTypeBtn = document.querySelector('#reqTypeTabs .req-type-tab.active');
  var activeType    = activeTypeBtn ? (activeTypeBtn.dataset.rtype || '') : '';
  // Bug fix (2026-06-28): the "Open" tab's data-rtype is the sentinel value
  // "__open__" (it means "show all types, just restrict by status" — it is
  // NOT a real RequestType). This function used to compare it directly
  // against r.requestType, which never matches any real request, so on
  // first page load — when "Open" is the default active tab — every single
  // request was filtered out and every scorecard showed 0. Clicking any
  // other tab "fixed" it only because that tab sets a real type value (or
  // empty string for "All"), never re-triggering this comparison against
  // the sentinel again.
  if (activeType === '__open__') activeType = '';
  var counts = { open:0, openAllTime:0, won:0, lost:0, period:0 };
  _reqAll.forEach(function (r) {
    if (activeType && r.requestType !== activeType) return;
    // All-time open (not date-filtered) — denominator of X/Y
    if (r.status === 'Open' || r.status === 'In Progress') counts.openAllTime++;
    // Date-filtered stats
    if (!_reqDateInRange(r)) return;
    counts.period++;
    // Open within selected date range — numerator of X/Y
    if (r.status === 'Open' || r.status === 'In Progress') counts.open++;
    else if (r.status === 'Closed - Won')  counts.won++;
    else if (r.status === 'Closed - Lost') counts.lost++;
  });
  var setEl = function(id, v) { var el=document.getElementById(id); if(el) el.textContent=v; };
  setEl('reqStat_open',       counts.open);
  setEl('reqStat_open_total', counts.openAllTime);
  setEl('reqStat_period',     counts.period);
  setEl('reqStat_won',        counts.won);
  setEl('reqStat_lost',       counts.lost);
}

function reqFilterByStatus(status) {
  var sel = document.getElementById('reqStatusFilter');
  if (sel) sel.value = status;
  reqApplyFilters();
}

// Handles the Assigned CS Specialist filter — for a CS Specialist
// selecting anyone other than themselves (including "All"), the default
// scoped dataset (their own requests only) isn't enough to filter from,
// so this ensures the full dataset is loaded first via the same viewAll
// override the "My Requests / All Requests" toggle uses.
function reqSpecFilterChanged() {
  var spec = ((document.getElementById('reqSpecFilter')||{}).value||'');
  var isOwnEmail = CMS.user && spec.toLowerCase().trim() === (CMS.user.email||'').toLowerCase().trim();
  if (CMS.user && CMS.user.role === 'CS Specialist' && !isOwnEmail && !window._reqViewAllForSpecialist) {
    window._reqViewAllForSpecialist = true;
    _loadReqList();
    return;
  }
  reqApplyFilters();
}
function reqApplyFilters() {
  var q    = ((document.getElementById('reqSearch')      ||{}).value||'').toLowerCase();
  var stat = ((document.getElementById('reqStatusFilter')||{}).value||'');
  var type = ((document.getElementById('reqTypeFilter')  ||{}).value||'');
  var dept = ((document.getElementById('reqDeptFilter')  ||{}).value||'');
  var svc  = ((document.getElementById('reqSvcFilter')   ||{}).value||'');
  var spec = ((document.getElementById('reqSpecFilter')  ||{}).value||'');
  var effectiveType = window._reqLockedType || type;
  _reqFiltered = _reqAll.filter(function (r) {
    var mQ = !q    || [(r.requestId||''),(r.clientId||''),(r.department||''),(r.service||''),(r.customerName||''),(r.accountName||'')].some(function(v){return v.toLowerCase().includes(q);});
    var mS = !stat || r.status      === stat;
    var mT = !effectiveType || r.requestType === effectiveType;
    var mD = !dept || r.department  === dept;
    var mV = !svc  || r.service     === svc;
    var mSpec = !spec || (r.assignedSpecialistEmail||'').toLowerCase().trim() === spec.toLowerCase().trim();
    var mDate = _reqDateInRange(r);
    var mOpen = !window._reqOpenOnly || r.status === 'Open' || r.status === 'In Progress';
    var mWarning = !window._reqWarningsOnly || r.needsFeedback;
    return mQ && mS && mT && mD && mV && mSpec && mDate && mOpen && mWarning;
  });

  // When the Open filter is active, show only the Open scorecard — the others
  // are irrelevant (all Won/Lost/Period counts are from the full dataset, not
  // the filtered "Open only" view, which would be misleading).
  var openOnly = !!window._reqOpenOnly;
  ['statChip_period','statChip_won','statChip_lost'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.style.display = openOnly ? 'none' : '';
  });

  if (_reqPhaseSortDir) {
    _reqFiltered.sort(function(a, b) {
      var diff = _reqPhaseSortIndex(a.currentStage) - _reqPhaseSortIndex(b.currentStage);
      return _reqPhaseSortDir === 'asc' ? diff : -diff;
    });
  }

  _reqPageNum = 1;
  reqRender();
}

function reqRender() {
  var tbody = document.getElementById('reqTbody'); if (!tbody) return;
  var start = (_reqPageNum-1)*_reqPageSize, rows = _reqFiltered.slice(start, start+_reqPageSize);
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="14"><div class="empty-state"><h3>No requests found</h3><p>Create a new request or adjust your filters.</p></div></td></tr>';
  } else {
    var now = new Date();
    tbody.innerHTML = rows.map(function (r) {
      var stClass  = r.status==='Closed - Won'?'badge-active':r.status==='Closed - Lost'?'badge-terminated':r.status==='Open'?'badge-active':r.status==='In Progress'?'badge-returning':'badge-inactive';
      var typeClass = { 'New':'badge-active','Additional':'badge-returning','Replacement':'badge-role','Reliever':'badge-inactive' }[r.requestType] || 'badge-inactive';

      // ── Assigned VA cell ────────────────────────────────────────────
      // Priority: Started VA → the Final VA (if designated, regardless of
      // its exact status) → Pending/Accepted buffer → Declined → "+" assign button.
      // Final VA is checked before the generic Pending/Declined fallbacks
      // since those just pick whichever connection matches first in array
      // order, not specifically the one actually marked as final — with
      // multiple candidates, that could show the wrong one otherwise.
      var vaCell;
      if (r.finalVA && r.finalVA.vaName) {
        var finalBadgeCls = r.finalVA.connectionStatus === 'Started' ? 'badge-active' : 'badge-returning';
        var finalBadgeLabel = r.finalVA.connectionStatus === 'Started' ? 'Started' : ('Final VA — '+_esc(r.finalVA.connectionStatus));
        vaCell = '<div style="font-weight:600;font-size:12.5px;color:var(--accent);cursor:pointer;" onclick="event.stopPropagation();vaDbOpenProfile(\''+_esc(r.finalVA.vaId)+'\')">'+_esc(r.finalVA.vaName)+'</div>' +
          '<span class="badge '+finalBadgeCls+'" style="font-size:9.5px;">'+finalBadgeLabel+'</span>';
      } else if ((r.startedVA && r.startedVA.vaName) || (r.pendingVA && r.pendingVA.vaName) || (r.declinedVA && r.declinedVA.vaName)) {
        // At least one connection exists, but none is marked Final —
        // per the request, the specific VA's name shouldn't show here
        // until that designation actually happens.
        vaCell = '<span class="badge badge-returning" style="font-size:11px;">Final VA not yet Set</span>';
      } else {
        // No VA assigned yet
        vaCell = '<span class="muted" style="font-size:12px;font-style:italic;">Unassigned</span>';
      }

      // ── Status cell — includes Open Days as a subtitle when the request
      // is still open, instead of a separate column.
      var openDaysSubtitle = '';
      var isOpenStatus = (r.status === 'Open' || r.status === 'In Progress');
      if (isOpenStatus && r.createdAt) {
        var created = new Date(r.createdAt);
        if (!isNaN(created.getTime())) {
          var days = Math.floor((now - created) / 86400000);
          var dayColor = days > 30 ? '#ef4444' : days > 14 ? '#f59e0b' : 'var(--text-muted)';
          openDaysSubtitle = '<div style="font-size:10.5px;color:'+dayColor+';font-weight:600;margin-top:2px;">'+days+' day'+(days!==1?'s':'')+' open</div>';
        }
      }

      // ── Assigned CS Specialist cell — resolve name from email via the
      // already-loaded specialists list (CMS.specialists), same pattern
      // used for the "Assigned To" label elsewhere in the app.
      var specEmail = r.assignedSpecialistEmail || '';
      var specMatch = specEmail ? (CMS.specialists||[]).find(function(s){ return (s.email||'').toLowerCase() === specEmail.toLowerCase(); }) : null;
      var specCell = specEmail
        ? '<div style="font-size:12.5px;font-weight:600;">'+_esc(specMatch ? specMatch.name : specEmail)+'</div><div style="font-size:11px;color:var(--text-muted);">'+_esc(specEmail)+'</div>'
        : '<span class="muted" style="font-size:12px;font-style:italic;">Unassigned</span>';

      // ── Phase cell — the workflow stage and who currently owns it (see
      // WorkflowService.gs). Older requests created before this workflow
      // existed won't have a stage on file, hence the fallback dash.
      var phaseCell = r.currentStage
        ? '<div style="font-size:12.5px;font-weight:600;">'+_esc(r.currentStage)+(r.needsFeedback?' <span title="No feedback in the past 24 hours" style="color:#ef4444;">⚠</span>':'')+'</div>'+(r.personInChargeRole?'<div style="font-size:10.5px;color:var(--text-muted);">'+_esc(r.personInChargeRole)+'</div>':'')
        : '<span class="muted" style="font-size:12px;">—</span>';

      // ── Payment Status cell — promoted to its own always-visible
      // column (was previously buried in the collapsible extra-dates
      // set). Hover reveals an edit icon for authorized roles, reusing
      // the same confirm-payment modal the request detail views use.
      var PAY_COLOR_LIST = { 'Paid': '#15803d', 'Add to Next Bill': '#1e40af', 'No Payment': '#b45309' };
      var payStatusVal = r.paymentStatus || 'No Payment';
      var payColorVal = PAY_COLOR_LIST[payStatusVal] || '#b45309';
      var canEditPayment = CMS.user && (CMS.user.role === 'Executive Support' || CMS.user.role === 'Administrator' || CMS.user.role === 'CS Manager' || CMS.user.role === 'CS Specialist');
      var paymentCell =
        '<div class="rdr-payment-hover" style="'+(r.needsPaymentConfirmation?'padding:2px 4px;margin:-2px -4px;border-radius:6px;background:#fef2f2;':'')+'">' +
          '<div style="font-size:12.5px;font-weight:700;color:'+payColorVal+';">'+_esc(payStatusVal)+
            (canEditPayment ? '<span class="rdr-payment-edit-icon" data-rid="'+_esc(r.requestId)+'" onclick="event.stopPropagation();reqOpenConfirmPayment(this.dataset.rid)" title="Update payment status" style="opacity:0;cursor:pointer;margin-left:6px;font-size:11px;color:var(--accent);">✎</span>' : '') +
          '</div>' +
          (r.paymentDate ? '<div style="font-size:10.5px;color:var(--text-muted);margin-top:1px;">'+_fdate(r.paymentDate)+'</div>' : '') +
        '</div>';

      return '<tr onclick="reqOpenDetailModal(\''+_esc(r.requestId)+'\')" style="cursor:pointer;">' +
        '<td style="font-size:13px;"><div style="font-weight:600;color:var(--text-primary);">'+_esc(r.customerName||r.customerId||'—')+'</div>' +
          '<div style="font-size:11.5px;color:var(--text-muted);">'+_esc(r.accountName||r.clientId||'')+'</div></td>' +
        '<td><span class="badge '+typeClass+'">'+_esc(r.requestType||'—')+'</span></td>' +
        '<td style="font-size:13px;"><div style="font-weight:600;">'+_esc(r.service||'—')+'</div>' +
          '<div style="font-size:11.5px;color:var(--text-muted);">'+_esc(r.department||'')+'</div></td>' +
        '<td>'+vaCell+'</td>' +
        '<td><span class="badge '+stClass+'">'+_esc(r.status||'—')+'</span>'+openDaysSubtitle+'</td>' +
        '<td>'+phaseCell+'</td>' +
        '<td>'+specCell+'</td>' +
        '<td>'+paymentCell+'</td>' +
        '<td class="muted">'+_fdate(r.createdAt)+'</td>' +
        '<td class="muted req-extra-date-col" style="display:'+(_reqDateColsExpanded?'':'none')+';">'+(r.targetStartDate?_fdate(r.targetStartDate):'—')+'</td>' +
        '<td class="muted req-extra-date-col" style="display:'+(_reqDateColsExpanded?'':'none')+';">'+(r.mockCallDoneAt?_fdate(r.mockCallDoneAt):'—')+'</td>' +
        '<td class="muted req-extra-date-col" style="display:'+(_reqDateColsExpanded?'':'none')+';">'+(r.vaConnectionDate?_fdate(r.vaConnectionDate):'—')+'</td>' +
        '<td class="muted req-extra-date-col" style="display:'+(_reqDateColsExpanded?'':'none')+';">'+(r.actualStartDate?_fdate(r.actualStartDate):'—')+'</td>' +
      '</tr>';
    }).join('');
  }
  // Pager
  var el = document.getElementById('reqPager'); if (!el) return;
  var total=_reqFiltered.length, pages=Math.max(1,Math.ceil(total/_reqPageSize));
  var s=(_reqPageNum-1)*_reqPageSize+1, e=Math.min(_reqPageNum*_reqPageSize,total);
  var btns='';
  for(var pg=1;pg<=pages;pg++){
    if(pg===1||pg===pages||Math.abs(pg-_reqPageNum)<=1) btns+='<button class="page-btn'+(pg===_reqPageNum?' active':'')+'" onclick="reqGoPage('+pg+')">'+pg+'</button>';
    else if(Math.abs(pg-_reqPageNum)===2) btns+='<span style="padding:0 4px;color:var(--text-muted)">…</span>';
  }
  el.innerHTML='<span>Showing '+(total?s:0)+'–'+e+' of '+total+'</span>'+
    '<div class="page-btns"><button class="page-btn" onclick="reqGoPage('+(_reqPageNum-1)+')"'+(_reqPageNum===1?' disabled':'')+'>‹</button>'+btns+'<button class="page-btn" onclick="reqGoPage('+(_reqPageNum+1)+')"'+(_reqPageNum>=pages?' disabled':'')+'>›</button></div>';
}

function reqGoPage(pg)     { var max=Math.max(1,Math.ceil(_reqFiltered.length/_reqPageSize)); if(pg>=1&&pg<=max){_reqPageNum=pg;reqRender();} }

var _reqClientList = [], _reqVAList = [];
var _reqClientOptions = []; // [{clientId, label}] for the current customer — rebuilt whenever the account list loads

// Opens the New Request form pre-filled from an existing request — same
// customer/account/department/service/schedule/etc, but as a genuinely new
// record (createVARequest, not updateVARequest). Useful for "another one
// just like this" without re-entering everything from scratch. For New-type
// requests this fills in the first multi-service block (suffix "_0"); other
// types fall back to the single-block fields, same as editing does.
function reqDuplicateRequest(id) {
  var found = _reqAll.find(function (r) { return r.requestId === id; });
  if (!found) { showToast('Request not found.', 'error'); return; }
  var isNewType = found.requestType === 'New' || found.requestType === 'Additional';

function _ensureReqFormData(callback) {

  function done() { if (--pending === 0) callback(); }
  if (CMS.customers && CMS.customers.length) { _reqClientList = []; done(); }
  else { _reqClientList = []; done(); }
  google.script.run.withSuccessHandler(function(r){ if(r&&r.success) _reqClientList=r.data||[]; done(); }).withFailureHandler(function(){done();}).getClients({});
  // CMS.settings (Department/Service/RequestType/etc.) is normally loaded
  // once, the first time the Dashboard renders — nothing guarantees that's
  // happened yet if this form is opened from somewhere else first (e.g.
  // "Request Replacement" from the VA Connections page). Without this, that
  // path would build the form with empty Department/Service dropdowns.

// Filter services dropdown based on selected department
// Load primary/secondary contacts into SR form dropdowns when account is selected
function reqLoadContactsForClient(clientId, clientList) {
  var primarySel   = document.getElementById('f_reqPrimary');
  var secondarySel = document.getElementById('f_reqSecondary');
  var primaryFocalEl   = document.getElementById('f_reqPrimaryFocal');
  var secondaryFocalEl = document.getElementById('f_reqSecondaryFocal');
  if (!primarySel || !secondarySel) return;
  var searchList = clientList || _reqClientList || [];
  var cl = searchList.find(function(acl){ return acl.clientId === clientId; });
  if (!cl) {
    primarySel.innerHTML   = '<option value="">Select customer first…</option>';
    secondarySel.innerHTML = '<option value="">Select customer first…</option>';
    primarySel.disabled = true; secondarySel.disabled = true;
    primarySel.style.background = ''; secondarySel.style.background = '';
    if (primaryFocalEl)   primaryFocalEl.style.display   = 'none';
    if (secondaryFocalEl) secondaryFocalEl.style.display = 'none';
    return;
  }
  function buildOpt(name, role, email, isDisabled) {
    if (!name && !email) return '';
    var label = name + (role ? ' (' + role + ')' : '') + (email ? ' · ' + email : '');
    var val   = name || email;
    return '<option value="' + _esc(val) + '">' + _esc(label) + '</option>';
  }
  primarySel.innerHTML   = '<option value="">— None —</option>' + buildOpt(cl.primaryContact,   cl.primaryRole,   cl.primaryEmail);
  secondarySel.innerHTML = '<option value="">— None —</option>' + buildOpt(cl.secondaryContact, cl.secondaryRole, cl.secondaryEmail);
  // Reset to enabled first — the locked/disabled state below only applies
  // once a contact has actually been auto-populated, not by default.
  primarySel.disabled = false; secondarySel.disabled = false;
  primarySel.style.background = ''; secondarySel.style.background = '';
  // Always auto-select the first option if contact exists
  if (cl.primaryContact || cl.primaryEmail) {
    primarySel.value = cl.primaryContact || cl.primaryEmail || '';
    primarySel.disabled = true;
    primarySel.style.background = 'var(--surface-2)';
  }
  if (cl.secondaryContact || cl.secondaryEmail) {
    secondarySel.value = cl.secondaryContact || cl.secondaryEmail || '';
    secondarySel.disabled = true;
    secondarySel.style.background = 'var(--surface-2)';
  }
  // Show which contact (if any) is flagged as this account's focal person
  if (primaryFocalEl)   primaryFocalEl.style.display   = cl.primaryIsFocal   ? '' : 'none';
  if (secondaryFocalEl) secondaryFocalEl.style.display = cl.secondaryIsFocal ? '' : 'none';

  // Account Manager — populated from this account's existing manager list
  // (Clients.AccountManagers, comma-separated), plus an "add new" option.
  var mgrSel = document.getElementById('f_reqAcctMgr');
  if (mgrSel) {
    var mgrList = (cl.accountManagers || '').split(',').map(function(m){ return m.trim(); }).filter(Boolean);
    var savedMgr = (window._reqEditingRecord && window._reqEditingRecord.accountManager) || '';
    var mgrOpts = mgrList.map(function(m){
      return '<option value="'+_esc(m)+'"'+(m===savedMgr?' selected':'')+'>'+_esc(m)+'</option>';
    }).join('');
    mgrSel.innerHTML = '<option value="">— None —</option>' + mgrOpts + '<option value="__new__">+ Add new manager…</option>';
    // If the saved manager isn't in the current list (e.g. removed since), still show it selected
    if (savedMgr && mgrList.indexOf(savedMgr) === -1) {
      mgrSel.innerHTML += '<option value="'+_esc(savedMgr)+'" selected>'+_esc(savedMgr)+' (not on current list)</option>';
    }
  }
}

// ── New-type restriction ────────────────────────────────────────────────
// If this exact customer+account pairing has never had a "New" Service
// Request, that's the only valid type — you can't request Additional VAs,
// a Replacement, or an Hours/Schedule Change for an account that was never
// actually started with a New request in the first place.
function reqCheckNewTypeRestriction() {
  var custId   = (document.getElementById('f_reqCustomer')||{}).value;
  var clientId = (document.getElementById('f_reqClient')  ||{}).value;
  var typeSel  = document.getElementById('f_reqType');
  var hintEl   = document.getElementById('f_reqTypeRestrictHint');
  if (!typeSel) return;
  if (!custId || !clientId) {
    // Nothing selected yet — leave the type field alone either way
    Array.prototype.forEach.call(typeSel.options, function(o){ o.disabled = false; });
    if (hintEl) hintEl.style.display = 'none';
    return;
  }
  // Excludes the request currently being edited (if any) from the check —
  // otherwise editing an existing "New" request would lock itself out of
  // its own type.
  var excludeId = (window._reqEditingRecord && window._reqEditingRecord.requestId) || '';
  // Server-side, unscoped check — _reqAll can be scoped down to "my
  // customers" for CS Specialists and isn't reliable for this.
  google.script.run
    .withSuccessHandler(function(res) {
      var hasNew = !!(res && res.success && res.hasNew);
      Array.prototype.forEach.call(typeSel.options, function(o){
        if (o.value === '') { o.disabled = false; return; }
        // No New request yet → New is the ONLY option. A New request
        // already exists → New specifically is blocked (can't file a
        // second one for the same account), everything else is fine.
        o.disabled = hasNew ? (o.value === 'New') : (o.value !== 'New');
      });
      // Informational only from here — Request Type governs which
      // customers/accounts are selectable (see
      // _reqApplyCustomerAccountFilter), not the reverse, so this no longer
      // overrides whatever Type the user already picked. It only disables
      // options that wouldn't make sense for this account and explains why.
      if (!hasNew) {
        if (hintEl) { hintEl.style.display = ''; hintEl.textContent = 'This account has no "New" Service Request on file yet, so New is the only option until one is filed.'; }
      } else if (typeSel.value === 'New') {
        if (hintEl) { hintEl.style.display = ''; hintEl.textContent = 'This account already has a "New" Service Request on file — choose a different type.'; }
      } else if (hintEl) {
        hintEl.style.display = 'none';
      }
    })
    .withFailureHandler(function() { /* fail open — don't block the form over a check that couldn't run */ })
    .hasNewServiceRequestOnFile(custId, clientId, excludeId);
}

function reqFilterServicesByDept(suffix) {
  suffix = suffix || '';
  var deptSel = document.getElementById('f_reqDept'+suffix);
  var svcSel  = document.getElementById('f_reqSvc'+suffix);
  if (!deptSel || !svcSel) return;
  var deptId  = deptSel.value; // Department's SettingID (current format)
  var allSvcs = (CMS.settings && CMS.settings['Service']) || [];
  // s.dept (a Service's ParentDepartment) is also a SettingID — compare directly.
  // Legacy fallback: older rows may have stored the dept's text value/label instead.
  var deptObj = deptId ? ((CMS.settings && CMS.settings['Department'])||[]).find(function(d){ return (d.id||'')===deptId; }) : null;
  var deptVal = deptObj ? deptObj.value : '';
  var deptLbl = deptObj ? deptObj.label : '';
  var filtered = deptId
    ? allSvcs.filter(function(s) {
        // Services with no dept set appear in ALL departments
        if (!s.dept || s.dept === '') return true;

      })
    : allSvcs;  // no dept selected → show all services
  svcSel.innerHTML = '<option value="">Select service…</option>' +

}

// Schedule Type drives everything below it: Weekly Fixed/Weekly Flexible/
// Daily all share the exact same day-by-day hours builder (see
// dailyHoursBuilderHtml) — only Weekly Fixed additionally asks for a locked
// PH working-time window, since "flexible" specifically means that window
// isn't fixed. Project Based skips days entirely for a single starting
// hours figure.
var REQ_SCHED_TYPE_INFO = {
  'Weekly Fixed':    'The VA will work on a fixed time schedule — enter the required PH working hours below, plus the total weekly hours (split evenly across Mon–Fri, adjustable per day).',
  'Weekly Flexible': 'The VA can work flexible hours during the day, as long as the total weekly hours below are completed — no fixed PH time window is required.',
  'Daily Fixed':     'The VA works a fixed time each day — enter the required PH working hours below, plus how many hours land on each day.',
  'Daily Flexible':  'Hours may vary by day, worked flexibly — enter how many hours land on each day below.',
  'Monthly':         'A single monthly hours figure — day-by-day scheduling doesn\'t apply.',
  'Project-based':   'A single starting hours figure for this project — day-by-day scheduling doesn\'t apply.'
};
// Computes total hours between the entered PH start/end times and updates
// both the visible total and the hidden combined-string field (kept for
// backward compatibility with the existing single-string RequiredPHTime
// storage). basePrefix lets this same function serve field sets with
// different naming conventions — 'f_reqPh' (default, used by both the
// multi-service and single-service Service Request forms, each with
// their own sfx) and 'hscModalPh' (the Hours & Schedule Change modal,
// which has no suffix of its own).
// "HH:MM AM/PM – HH:MM AM/PM" → populates the visible start/end time
// inputs and recomputes the total. Used wherever an existing
// RequiredPHTime value is being pre-filled (edit, Replacement, Hours
// Change) — those set the hidden combined field directly, which by
// itself would leave the visible time inputs blank. Silently does
// nothing if the stored value doesn't match this format (e.g. an older,
// free-typed value) — the hidden field still keeps that original value.
function _reqParsePhTimeRangeIntoFields(sfx, basePrefix) {
  sfx = sfx || '';
  basePrefix = basePrefix || 'f_reqPh';
  var hiddenEl = document.getElementById(basePrefix + 'WorkTime' + sfx);
  if (!hiddenEl || !hiddenEl.value) return;
  var parts = hiddenEl.value.split(/[–-]/).map(function(s){ return s.trim(); });
  if (parts.length !== 2) return;
  function to24Hour(t) {
    var m = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec(t);
    if (!m) return null;
    var h = parseInt(m[1], 10), min = m[2];
    if (/pm/i.test(m[3]) && h !== 12) h += 12;
    if (/am/i.test(m[3]) && h === 12) h = 0;
    return (h < 10 ? '0' : '') + h + ':' + min;
  }
  var start24 = to24Hour(parts[0]), end24 = to24Hour(parts[1]);
  if (!start24 || !end24) return;
  var startEl = document.getElementById(basePrefix + 'Start' + sfx);
  var endEl   = document.getElementById(basePrefix + 'End' + sfx);
  if (startEl) startEl.value = start24;
  if (endEl)   endEl.value   = end24;
  _reqComputePhTimeRange(sfx, basePrefix);
}

// Compares the PH time window's computed total hours against each day's
// entered hours in the daily breakdown — flags a mismatch, since a
// scheduled day is expected to work the full window. Purely informational
// (per the request) — doesn't block submission, just surfaces the note.
function _reqCheckHoursMismatch(dailyIdPrefix, phBasePrefix, phSfx, warnElId) {
  var warnEl = document.getElementById(warnElId);
  if (!warnEl) return;
  var startEl = document.getElementById(phBasePrefix + 'Start' + phSfx);
  var endEl   = document.getElementById(phBasePrefix + 'End' + phSfx);
  if (!startEl || !endEl || !startEl.value || !endEl.value) { warnEl.style.display = 'none'; return; }
  var startMins = _reqTimeStrToMinutes(startEl.value);
  var endMins   = _reqTimeStrToMinutes(endEl.value);
  var diffMins = endMins - startMins;
  if (diffMins <= 0) diffMins += 24 * 60;
  var windowHours = diffMins / 60;

  // Per the report — if breaks are included in the window above, 1 hour
  // is deducted for the break, so the effective working hours are less
  // than the raw window. The comparison below needs to use this
  // effective total, not the raw one, or it flags a false mismatch.
  var breaksCheckboxId = phBasePrefix.replace('Ph', 'BreaksIncluded') + phSfx;
  var breaksIncluded = (document.getElementById(breaksCheckboxId)||{}).checked;
  var effectiveHours = breaksIncluded ? Math.max(0, windowHours - 1) : windowHours;

  var breakdown = dailyHoursCollectBreakdown(dailyIdPrefix);
  var mismatchedDays = breakdown.filter(function(g) { return g.hoursPerDay !== effectiveHours; })
    .map(function(g) { return g.days.join(','); });
  if (!breakdown.length || !mismatchedDays.length) { warnEl.style.display = 'none'; return; }
  warnEl.style.display = '';
  warnEl.textContent = '⚠ The PH working time window totals ' + effectiveHours + ' hrs' + (breaksIncluded ? ' (after the 1-hour break deduction)' : '') + ', but ' + mismatchedDays.join(', ') + ' ' + (mismatchedDays.length===1?'is':'are') + ' entered with a different number of hours. Double-check these match.';
}

function _reqComputePhTimeRange(sfx, basePrefix, clientTimezone) {
  sfx = sfx || '';
  basePrefix = basePrefix || 'f_reqPh';
  // The Service Request form's own client timezone lives in a dropdown
  // within the same form, not passed in statically — read its current
  // value directly rather than risk a stale parameter if it's since
  // changed independently of the time inputs.
  if (!clientTimezone && basePrefix === 'f_reqPh') {
    var tzEl = document.getElementById('f_reqTz');
    if (tzEl) clientTimezone = tzEl.value || '';
  } else if (!clientTimezone && basePrefix === 'hscModalPh') {
    clientTimezone = window._hscModalClientTimezone || '';
  }
  var startEl = document.getElementById(basePrefix + 'Start' + sfx);
  var endEl   = document.getElementById(basePrefix + 'End' + sfx);
  var totalEl = document.getElementById(basePrefix + 'TotalHours' + sfx);
  var hiddenEl = document.getElementById(basePrefix + 'WorkTime' + sfx); // now holds CLIENT time
  var phEquivEl = document.getElementById(basePrefix + 'PHEquiv' + sfx);
  var phHiddenEl = document.getElementById(basePrefix + 'DerivedPHTime' + sfx);
  if (!startEl || !endEl) return;
  var startVal = startEl.value, endVal = endEl.value;
  if (!startVal || !endVal) {
    if (totalEl) totalEl.textContent = '';
    if (hiddenEl) hiddenEl.value = '';
    if (phEquivEl) phEquivEl.textContent = '';
    if (phHiddenEl) phHiddenEl.value = '';
    return;
  }
  var startMins = _reqTimeStrToMinutes(startVal);
  var endMins   = _reqTimeStrToMinutes(endVal);
  // Overnight window (e.g. 10:00 PM to 6:00 AM) — end wraps past midnight.
  var diffMins = endMins - startMins;
  if (diffMins <= 0) diffMins += 24 * 60;
  var hours = diffMins / 60;
  var hoursLabel = (hours % 1 === 0) ? hours + ' hrs' : hours.toFixed(1) + ' hrs';
  if (totalEl) totalEl.textContent = '= ' + hoursLabel;
  var clientTimeStr = _reqMinutesToTimeStr(startMins) + ' – ' + _reqMinutesToTimeStr(endMins);
  if (hiddenEl) hiddenEl.value = clientTimeStr;

  // PH equivalent is derived server-side — Utilities.formatDate's real
  // IANA tz database (and therefore correct DST handling) only exists
  // in Apps Script, not in browser JS, so this can't be computed here
  // without risking it silently disagreeing with what actually gets
  // saved.
  if (phEquivEl) {
    if (!clientTimezone) {
      phEquivEl.textContent = 'Select a client timezone to see the PH equivalent.';
      if (phHiddenEl) phHiddenEl.value = '';
    } else {
      phEquivEl.textContent = 'Calculating PH equivalent…';
      google.script.run
        .withSuccessHandler(function(res) {
          var el2 = document.getElementById(basePrefix + 'PHEquiv' + sfx); if (!el2) return; // form may have closed
          if (!res || !res.success || !res.phTime) { el2.textContent = 'Could not calculate PH equivalent.'; return; }
          el2.textContent = 'PH equivalent: ' + res.phTime;
          var el3 = document.getElementById(basePrefix + 'DerivedPHTime' + sfx);
          if (el3) el3.value = res.phTime;
        })
        .withFailureHandler(function() {
          var el4 = document.getElementById(basePrefix + 'PHEquiv' + sfx); if (el4) el4.textContent = 'Could not calculate PH equivalent.';
        })
        .getPHEquivalentTime(clientTimeStr, clientTimezone, new Date().toISOString());
    }
  }

  // Re-run the mismatch check against whatever daily hours are currently
  // entered — same context mapping as dailyHoursRecalcTotal above.
  if (basePrefix === 'f_reqPh') _reqCheckHoursMismatch('reqDaily' + sfx, basePrefix, sfx, 'f_reqHoursMismatchWarn' + sfx);
  else if (basePrefix === 'hscModalPh') _reqCheckHoursMismatch('hscDaily', basePrefix, sfx, 'hscModalHoursMismatchWarn');
}
// "HH:MM" (24-hour, from a native <input type="time">) → minutes from midnight.
function _reqTimeStrToMinutes(hhmm) {
  var parts = String(hhmm).split(':');
  return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
}

function reqScheduleTypeChanged(val, suffix) {
  suffix = suffix || '';
  var selEl = document.getElementById('f_reqSchedType'+suffix);
  if (selEl && selEl.value !== val) selEl.value = val;

  var dailyWrap = document.getElementById('f_reqDailyHoursWrap'+suffix);
  var projWrap = document.getElementById('f_reqProjectHoursWrap'+suffix);
  var monthlyWrap = document.getElementById('f_reqMonthlyHoursWrap'+suffix);
  var isFixed  = (val === 'Weekly Fixed' || val === 'Daily Fixed');
  var isWeekly = (val === 'Weekly Fixed' || val === 'Weekly Flexible');
  var isDayBased = (isWeekly || val === 'Daily Fixed' || val === 'Daily Flexible');
  if (infoEl) { infoEl.style.display = val ? '' : 'none'; infoEl.textContent = REQ_SCHED_TYPE_INFO[val] || ''; }
  // Shown for every day-based type (fixed or flexible — a flexible VA
  // still works within a window, they just have latitude within it), but
  // only actually required for Fixed types, where the exact hours are
  // always known upfront.
  if (phWrap)    phWrap.style.display = isDayBased ? '' : 'none';
  if (phReqStar) phReqStar.style.display = isFixed ? '' : 'none';
  if (dailyWrap) dailyWrap.style.display = isDayBased ? '' : 'none';
  if (projWrap) projWrap.style.display = (val === 'Project-based') ? '' : 'none';
  if (monthlyWrap) monthlyWrap.style.display = (val === 'Monthly') ? '' : 'none';
  if (isDayBased) dailyHoursSetAverageMode('reqDaily'+suffix, isWeekly ? 'weeklyTotal' : 'daily');

  // so the 8am-5pm default shows its computed total immediately rather
  // than waiting for the user to touch the field.
  if (isDayBased) _reqComputePhTimeRange(suffix);

// Restricts which customers/accounts show up in the pickers based on
// Request Type: New only shows customers with no New request on file yet
// (this account has never actually been onboarded); Replacement only shows
// customers/accounts that have an active VA connection (nothing to replace
// otherwise). Fetches the underlying sets once and caches them — cheap to
// re-apply on every Type change after that.
function _reqApplyCustomerAccountFilter(typeVal) {
  function apply(sets) {
    if (typeVal === 'New') {
      _reqCustomerFilterSet = {}; (sets.customersWithoutNewSR||[]).forEach(function(id){ _reqCustomerFilterSet[id] = true; });
      _reqAccountFilterSet = null;
    } else if (typeVal === 'Replacement') {
      _reqCustomerFilterSet = {}; (sets.customersWithActiveVA||[]).forEach(function(id){ _reqCustomerFilterSet[id] = true; });
      _reqAccountFilterSet  = {}; (sets.accountsWithActiveVA ||[]).forEach(function(id){ _reqAccountFilterSet[id]  = true; });
    } else {
      _reqCustomerFilterSet = null;
      _reqAccountFilterSet  = null;
    }
    // Re-filter whatever's currently shown/typed so the change takes effect
    // immediately rather than waiting for the next keystroke.
    var custSearchEl = document.getElementById('f_reqCustomerSearch');
    if (custSearchEl && document.getElementById('reqCustComboList') && document.getElementById('reqCustComboList').style.display !== 'none') {
      reqCustComboFilter(custSearchEl);
    }
    // If the currently-selected customer no longer qualifies under the new
    // filter, clear the selection rather than silently keeping an invalid one.
    var custSel = document.getElementById('f_reqCustomer');
    if (custSel && custSel.value && _reqCustomerFilterSet && !_reqCustomerFilterSet[custSel.value]) {
      custSel.value = '';
      if (custSearchEl) custSearchEl.value = '';
      reqFormLoadClients(custSel);
    } else if (custSel && custSel.value) {
      // Customer still valid — re-check whether the currently-selected
      // ACCOUNT still qualifies (Replacement's account-level filter).
      reqFormLoadClients(custSel);
    }
  }
  if (_reqFilterSets) { apply(_reqFilterSets); return; }
  google.script.run
    .withSuccessHandler(function(res) {
      _reqFilterSets = (res && res.success) ? res : { customersWithoutNewSR: [], customersWithActiveVA: [], accountsWithActiveVA: [] };
      apply(_reqFilterSets);
    })
    .withFailureHandler(function() {
      _reqFilterSets = { customersWithoutNewSR: [], customersWithActiveVA: [], accountsWithActiveVA: [] };
      apply(_reqFilterSets);
    })
    .getRequestFormFilterSets();
}

// Fetches the selected connection's full details and auto-fills
// Department, Service, current hours/schedule, and the replacement target
// fields — the same information a Replacement request needs regardless of
// whether it started from this picker or from a connection's own button.
function reqReplacementVAChanged(connectionId) {
  if (!connectionId) return;
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { showToast('Could not load that VA\'s connection details.', 'error'); return; }
      var conn = res.data;

      document.getElementById('f_replacementForVAID').value = conn.vaId || '';
      var forEl = document.getElementById('f_replacementFor'); if (forEl) forEl.value = conn.vaName || '';
      var parentEl = document.getElementById('f_parentRequestId'); if (parentEl) parentEl.value = conn.requestId || '';
      var connEl = document.getElementById('f_fromConnection'); if (connEl) connEl.value = connectionId;

      if (conn.department) {
        var _norm2 = function(v){ return String(v||'').trim().toLowerCase(); };
        var deptObj = ((CMS.settings && CMS.settings['Department'])||[]).find(function(d){ return _norm2(d.value)===_norm2(conn.department) || _norm2(d.label)===_norm2(conn.department); });
        var deptEl = document.getElementById('f_reqDept');
        if (deptEl) { deptEl.value = deptObj ? (deptObj.id||'') : conn.department; deptEl.disabled = true; deptEl.style.background='var(--surface-2)'; }
        reqFilterServicesByDept();
        var svcEl = document.getElementById('f_reqSvc');
        var svcObj = ((CMS.settings && CMS.settings['Service'])||[]).find(function(s){ return _norm2(s.value)===_norm2(conn.service) || _norm2(s.label)===_norm2(conn.service); });
        if (svcEl && svcObj) {
          svcEl.value = svcObj.value||''; svcEl.disabled = true; svcEl.style.background='var(--surface-2)';
        } else if (svcEl && conn.service) {
          var svcOpt2 = document.createElement('option');
          svcOpt2.value = conn.service; svcOpt2.textContent = conn.service + ' (not in current list)';
          svcEl.appendChild(svcOpt2);
          svcEl.value = conn.service; svcEl.disabled = true; svcEl.style.background='var(--surface-2)';
        }
      }

      var NEW_SCHED_TYPES2 = ['Weekly Fixed','Weekly Flexible','Daily Fixed','Daily Flexible','Project-based'];
      // Same mapping fix as above — key stays 'Project Based' (matches
      // conn.hoursType's own unrenamed value), only the mapped-to value
      // (the new ScheduleType being set) changes.
      var OLD_SCHED_MAP2 = { 'Fixed':'Weekly Fixed', 'Flexible':'Weekly Flexible', 'Daily':'Daily Flexible', 'Project Based':'Project-based' };
      var resolvedSchedType2 = conn.scheduleType && NEW_SCHED_TYPES2.indexOf(conn.scheduleType) !== -1
        ? conn.scheduleType
        : (OLD_SCHED_MAP2[conn.hoursType] || OLD_SCHED_MAP2[conn.scheduleType] || '');
      if (resolvedSchedType2) {
        var schedEl = document.getElementById('f_reqSchedType');
        if (schedEl) schedEl.value = resolvedSchedType2;
        reqScheduleTypeChanged(resolvedSchedType2);
        if (resolvedSchedType2 === 'Project-based') {
          var projEl = document.getElementById('f_reqProjectHours'); if (projEl) projEl.value = conn.hours || conn.reqHours || '';
        } else {
          try { dailyHoursPrefill('reqDaily', JSON.parse(conn.hoursBreakdown || '[]')); } catch(e) {}
          if (conn.requiredClientTime || conn.requiredPHTime) { var phEl = document.getElementById('f_reqPhWorkTime'); if (phEl) { phEl.value = conn.requiredClientTime || conn.requiredPHTime; _reqParsePhTimeRangeIntoFields(''); } }
        }
      } else {
        var hoursEl = document.getElementById('f_reqHours'); if (hoursEl) hoursEl.value = conn.hours || conn.reqHours || '';
      }

      showToast('Filled in from ' + (conn.vaName||'the selected VA') + '\'s connection.', 'success');
    })
    .withFailureHandler(function(err) { showToast(err.message, 'error'); })
    .getVAConnById(connectionId);
}

    var tzDate  = new Date(now.toLocaleString('en-US', { timeZone: z   }));
    var utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));

}
function _formatUtcOffset(mins) {

  return 'UTC' + sign + hh + (mm ? ':' + (mm < 10 ? '0' : '') + mm : ':00');
}

// Splits the pipe-delimited PH Equivalent string (Client time | PH time |
// difference). Client Time and PH Time are combined into a single row,
// per the request, with Difference kept as its own separate row. Falls
// back gracefully to a single row if the value predates this format
// (older requests stored the old single-line format).
function _reqPhEquivalentRows(phTimezone, rowFn) {
  if (!phTimezone) return '';
  var parts = phTimezone.split('|');
  if (parts.length !== 3) return rowFn('PH Equivalent', phTimezone);
  var clientTime = parts[0].replace(/^Client:\s*/, '');
  var phTime = parts[1].replace(/^Manila \(PH\):\s*/, '');
  // Built directly rather than via rowFn, per the request — rowFn
  // escapes its value argument everywhere it's used, which would have
  // rendered this row's own subtitle div as literal text instead of
  // real HTML. Matches the same detail-row/detail-label/detail-val
  // classes rowFn itself produces, so it still looks consistent.
  return '<div class="detail-row"><span class="detail-label">Client Time</span><span class="detail-val">' +
    _esc(clientTime) + ' (PH Time: ' + _esc(phTime) + ')' +
    '<div style="font-size:10.5px;color:var(--text-muted);margin-top:2px;">'+_esc(parts[2])+'</div>' +
    '</span></div>';
}
function _computePHTime(tzName) {
  var el = document.getElementById('f_reqPhTz');
  if (!el || !tzName) return;
  try {
    // Reference point is a fixed 8:00 AM in the client's timezone — not
    // "now" — since this is meant to show what a typical client workday
    // start corresponds to in PH time, not a constantly-changing current
    // moment that isn't useful for scheduling reference.
    var clientMins = _tzOffsetMinutes(tzName);
    var phMins     = 480; // Asia/Manila is fixed UTC+8, no DST
    var diffMins   = phMins - clientMins;
    var diffH      = Math.floor(Math.abs(diffMins) / 60);
    var diffM      = Math.abs(diffMins) % 60;
    var diffStr    = diffMins === 0 ? 'Same time as PH'
      : (diffMins > 0 ? 'PH is ahead by ' : 'PH is behind by ') + diffH + 'h' + (diffM ? ' ' + diffM + 'm' : '');

    var clientRefMinutes = 8 * 60; // 8:00 AM
    var phRefMinutes = ((clientRefMinutes + diffMins) % 1440 + 1440) % 1440;
    var phTimeStr = _reqMinutesToTimeStr(phRefMinutes);

    el.value = 'Client: 8:00 AM|Manila (PH): ' + phTimeStr + '|' + diffStr;
  } catch (e) {
    el.value = 'Could not compute — check timezone name';
  }
}
// Converts minutes-from-midnight into a 12-hour "H:MM AM/PM" string.
function _reqMinutesToTimeStr(mins) {
  var h24 = Math.floor(mins / 60);
  var m   = mins % 60;
  var ampm = h24 >= 12 ? 'PM' : 'AM';
  var h12 = h24 % 12; if (h12 === 0) h12 = 12;
  return h12 + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
}

// Hides everything in the reused edit form except the Service Details
// (schedule) and Timezone sections — used when editing schedule details
// via the hover-edit icon, which only ever needs these two, not the full
// ticket edit view. Relies on the form's existing consistent
// .form-section-label wrapper pattern (each section's direct parent is
// its own bordered container).
function _reqFilterToScheduleOnly(container, extraKeep) {
  if (!container) return;
  window._reqScheduleOnlyMode = true;
  var KEEP = ['Service Details', 'Timezone'].concat(extraKeep || []);
  var labels = container.querySelectorAll('.form-section-label');
  var firstKeptSection = null, lastKeptSection = null;
  labels.forEach(function(label) {
    var section = label.parentElement;
    if (!section) return;
    if (KEEP.indexOf(label.textContent.trim()) === -1) {
      section.style.display = 'none';
    } else {
      if (!firstKeptSection) firstKeptSection = section;
      lastKeptSection = section; // keeps updating — ends up being whichever kept section comes last
    }
  });
  // Everything before the first labeled section (customer/client/request
  // type selectors) isn't part of any kept section — hide it too.
  if (labels.length) {
    var veryFirstSection = labels[0].parentElement;
    var sib = veryFirstSection ? veryFirstSection.previousElementSibling : null;
    while (sib) { sib.style.display = 'none'; sib = sib.previousElementSibling; }
  }
  // Everything after the LAST kept section also isn't part of any kept
  // section — e.g. the unlabeled Notes/Ticket Created Date block that
  // follows Connection Dates. Without this, whichever kept section
  // happens to be last in the form would leave everything after it
  // fully visible with nothing hiding it.
  if (lastKeptSection) {
    var nextSib = lastKeptSection.nextElementSibling;
    while (nextSib) { nextSib.style.display = 'none'; nextSib = nextSib.nextElementSibling; }
  }
  // reqFormErr lives inside the unlabeled Notes block above, which just
  // got hidden along with everything else not kept — meaning any
  // validation error from reqSubmit would previously be written into an
  // invisible element, giving the exact "clicked Save, nothing happened,
  // no notice" symptom. Move it to right after the last kept section so
  // it's always visible here, regardless of what else is hidden.
  var errEl = container.querySelector('#reqFormErr');
  if (errEl && lastKeptSection && lastKeptSection.parentElement) {
    lastKeptSection.parentElement.insertBefore(errEl, lastKeptSection.nextElementSibling);
  }
  var titleEl = container.querySelector('.modal-title');
  if (titleEl) titleEl.textContent = 'Edit Schedule & Timezone';
  var submitBtn = container.querySelector('.modal-footer .btn-primary');
  if (submitBtn) submitBtn.textContent = 'Save Changes';
}

// Collects one service block's own fields (department/service/schedule/
// hours/notes) — the per-block equivalent of the single-block logic in
// reqSubmit, just parameterized by suffix so it works for any block index.
function _reqCollectServiceBlockData(sfx, label) {
  var deptSel = document.getElementById('f_reqDept'+sfx);
  var svcSel  = document.getElementById('f_reqSvc'+sfx);
  var deptVal = deptSel ? deptSel.value : '';
  var svcVal  = svcSel ? svcSel.value : '';
  if (!deptVal) return { ok:false, error: label+': Department is required.' };
  if (!svcVal)  return { ok:false, error: label+': Service is required.' };
  var deptName = (deptSel.selectedOptions && deptSel.selectedOptions[0] && deptSel.selectedOptions[0].dataset.deptname) || deptVal;

  var schedType = (document.getElementById('f_reqSchedType'+sfx)||{}).value || '';
  if (!schedType) return { ok:false, error: label+': Schedule Type is required.' };

  var hoursVal = '', hoursType = '', hoursBreakdown = '', phWorkTime = '', derivedPHTime = '', scheduleDays = '';
  var isFixedType = (schedType === 'Weekly Fixed' || schedType === 'Daily Fixed');
  var isDayBasedType = (schedType === 'Weekly Fixed' || schedType === 'Weekly Flexible' || schedType === 'Daily Fixed' || schedType === 'Daily Flexible');
  if (schedType === 'Project-based') {
    hoursType = 'Project Based';
    hoursVal = (document.getElementById('f_reqProjectHours'+sfx)||{}).value || '';
    if (!hoursVal) return { ok:false, error: label+': Initial Hours is required.' };
  } else if (schedType === 'Monthly') {
    hoursType = 'Monthly';
    hoursVal = (document.getElementById('f_reqMonthlyHours'+sfx)||{}).value || '';
    if (!hoursVal) return { ok:false, error: label+': Monthly Hours is required.' };
  } else if (isDayBasedType) {
    hoursType = 'Daily';
    var breakdown = dailyHoursCollectBreakdown('reqDaily'+sfx);
    if (!breakdown.length) return { ok:false, error: label+": Enter at least one day's hours." };
    hoursVal = dailyHoursWeeklyTotal('reqDaily'+sfx);
    hoursBreakdown = JSON.stringify(breakdown);
    scheduleDays = breakdown.reduce(function(all,g){ return all.concat(g.days); }, []).join(',');
    phWorkTime = ((document.getElementById('f_reqPhWorkTime'+sfx)||{}).value||'').trim();
    derivedPHTime = ((document.getElementById('f_reqPhDerivedPHTime'+sfx)||{}).value||'').trim();
    if (isFixedType && !phWorkTime) return { ok:false, error: label+': Required Working Time (Client\'s Time) is required for a '+schedType+' schedule.' };
  }

  var qty = parseInt((document.getElementById('f_reqQty'+sfx)||{}).value || '1', 10);
  if (!qty || qty < 1) qty = 1;
  var targetStart = (document.getElementById('f_reqTargetStart'+sfx)||{}).value || '';

  var isOtherService = (svcVal === '__OTHER__');
  var otherSvcVal = isOtherService ? ((document.getElementById('f_reqSvcOther'+sfx)||{}).value||'').trim() : '';
  if (isOtherService && !otherSvcVal) return { ok:false, error: label+': Please specify the service.' };
  var finalSvcVal = isOtherService ? otherSvcVal : svcVal;

  return {
    ok: true,
    quantity: qty,
    data: {
      department: deptName, service: finalSvcVal, isOtherService: isOtherService, scheduleType: schedType, scheduleDays: scheduleDays,
      hours: hoursVal, hoursType: hoursType, hoursBreakdown: hoursBreakdown, requiredClientTime: phWorkTime, requiredPHTime: derivedPHTime,
      nightDiffApplicableAtSchedule: !!(document.getElementById('f_reqNightDiff'+sfx)||{}).checked,
      breaksIncludedInTotal: !!(document.getElementById('f_reqBreaksIncluded'+sfx)||{checked:true}).checked,
      scheduleNotes: ((document.getElementById('f_reqSchedNotes'+sfx)||{}).value||'').trim(),
      targetStartDate: targetStart
    }
  };
}

  var errEl = document.getElementById('reqFormErr');
  var tzEl  = document.getElementById('f_reqTz');
  var tzVal = tzEl ? (tzEl.value || (tzEl.options && tzEl.options[tzEl.selectedIndex] && tzEl.options[tzEl.selectedIndex].value) || '') : '';
  // Real bug fixed here: the form marks Client Timezone required, but reqSubmit hands New / Additional
  // requests straight to this function BEFORE its own "Client Timezone is required" check (that check
  // only exists on the single-service path) — so nothing ever stopped a blank timezone being saved.
  if (!tzVal) tzVal = _reqResolveTypedTimezone();
  if (!tzVal) {
    var typedTz = ((document.getElementById('f_reqTzSearch') || {}).value || '').trim();
    if (errEl) errEl.textContent = typedTz ? 'Pick the Client Timezone from the list — "' + typedTz + '" isn\'t a recognised timezone.' : 'Client Timezone is required.';
    return;
  }
  var mgrSelVal = (document.getElementById('f_reqAcctMgr')||{}).value || '';
  var acctMgr = mgrSelVal === '__new__'
    ? ((document.getElementById('f_reqAcctMgrNew')||{}).value||'').trim()
    : mgrSelVal;
  var acctMgrEmail = mgrSelVal === '__new__' ? ((document.getElementById('f_reqAcctMgrNewEmail')||{}).value||'').trim() : '';
  if (mgrSelVal === '__new__' && !acctMgr) { if(errEl) errEl.textContent='Enter the new account manager\'s name, or pick one from the list.'; return; }

  var reqTypeVal = window._reqForcedRequestType || (document.getElementById('f_reqType')||{}).value || 'New';
  var sharedFields = {
    customerId: custId, clientId: clientId, requestType: reqTypeVal,
    primaryAccount:   (document.getElementById('f_reqPrimary')  ||{}).value||'',
    secondaryAccount: (document.getElementById('f_reqSecondary')||{}).value||'',
    accountManager:   acctMgr,
    accountManagerEmail: acctMgrEmail,
    paymentMethod:    (document.getElementById('f_reqPaymentMethod')||{}).value||'',
    clientTimezone:   tzVal,
    phTimezone:       (document.getElementById('f_reqPhTz')     ||{}).value||'',
    sellerOnboardingDate: (document.getElementById('f_reqOnboarding') ||{}).value||'',
    notes:            ((document.getElementById('f_reqNotes')    ||{}).value||'').trim(),
    dateFiled:        (document.getElementById('f_reqDateFiled') ||{}).value||'',
    parentRequestId:  (document.getElementById('f_parentRequestId')||{}).value||'',
    requestGroup:     (document.getElementById('f_reqGroup')     ||{}).value||'Regular',
    specialRequestType: (document.getElementById('f_specialRequestType')||{}).value||''
  };

  // Collect + validate every block up front — if any block has a problem,
  // stop before creating anything rather than partially submitting.
  var blocks = Array.prototype.slice.call(document.querySelectorAll('.req-svc-block'));
  if (!blocks.length) { if(errEl) errEl.textContent='Add at least one service.'; return; }
  var jobs = []; // one entry per individual request to create (block expanded by quantity)
  for (var i = 0; i < blocks.length; i++) {
    var idx = blocks[i].dataset.idx;
    var label = 'Service ' + (i+1);
    var collected = _reqCollectServiceBlockData('_'+idx, label);
    if (!collected.ok) { if(errEl) errEl.textContent = collected.error; return; }
    for (var q = 0; q < collected.quantity; q++) jobs.push(collected.data);
  }
  if (errEl) errEl.textContent = '';

  var btn = document.getElementById('reqSubmitBtn');
  if (btn) { btn.disabled = true; }
  var created = [], failed = [], warnings = [];

  function submitNext(i) {
    if (btn) btn.textContent = 'Creating ' + (i+1) + ' of ' + jobs.length + '…';
    if (i >= jobs.length) {
      if (failed.length) {
        showToast(created.length + ' of ' + jobs.length + ' requests created — ' + failed.length + ' failed: ' + failed.join('; '), 'error');
      } else {
        showToast(created.length + ' request' + (created.length!==1?'s':'') + ' created.', 'success');
      }
      // Surfaces what used to fail completely silently — see
      // _wfInitializeForNewRequest (WorkflowService.gs): a request whose
      // workflow stage couldn't be set now says so here instead of just
      // looking like a normal success with an empty Phase later.
      if (warnings.length) {
        setTimeout(function(){ showToast(warnings.join(' '), 'error'); }, 400);
      }
      closeModal();
      // If this creation was triggered from an inquiry escalation, link
      // the first created request back to that inquiry.
      if (created.length) _reqProcessPendingEscalation(created[0]);
      if (_pbWizardIsActuallyActive()) {
        _pbWizard.requestId = created[0] || null;
        setTimeout(function(){ _pbWizardGoToStep(_pbWizard.stepIndex + 1); }, 150);
      } else if (created.length === 1) navigate('va-request-profile', created[0]);
      else _loadReqList();
      return;
    }
    var payload = Object.assign({}, sharedFields, jobs[i]);
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) { created.push(res.id); if (res.warning) warnings.push(res.warning); }
        else failed.push((res && res.error) || 'Unknown error');
        submitNext(i+1);
      })
      .withFailureHandler(function(err) { failed.push(err.message); submitNext(i+1); })
      .createVARequest(payload);
  }
  submitNext(0);
}

// Shared by both request-creation paths (the multi-service submitNext
// below, and reqSubmit's own onDone) — processes whatever pending
// inquiry-escalation state was set before this request was created:
// linking the request back to its originating ticket, setting a
// Termination ticket's outcome to Replacement if that's what triggered
// this, and auto-creating a linked Termination ticket for the VA being
// replaced when a Concern ticket (not a Termination ticket itself) is
// what triggered this.
function _reqProcessPendingEscalation(createdRequestId) {
  if (!window._pendingEscalationInquiryId || !createdRequestId) return;
  var escInqId = window._pendingEscalationInquiryId;
  var escConnId = window._pendingEscalationConnectionId || '';
  var escTermOutcomeInqId = window._pendingTerminationOutcomeOnEscalation || '';
  window._pendingEscalationInquiryId = null;
  window._pendingEscalationConnectionId = null;
  window._pendingTerminationOutcomeOnEscalation = null;
  google.script.run
    .withSuccessHandler(function() {
      if (escTermOutcomeInqId) showToast('Replacement request linked — the termination ticket stays open and continues processing normally.', 'success');
    })
    .withFailureHandler(function(){})
    .escalateInquiryToRequest(escInqId, createdRequestId);
  // Real, serious bug fixed here: this used to ALSO immediately call
  // updateInquiry(escTermOutcomeInqId, { terminationOutcome: 'Accepted' })
  // right here — which pushes the termination all the way through
  // (updateInquiry's own PUSHED_THROUGH handling), terminating the
  // actual VA Connection with today's date, completely silently, the
  // moment the replacement request was submitted. Worse, it ran as a
  // SEPARATE, unordered google.script.run call racing against the
  // escalateInquiryToRequest call right above it — if it reached the
  // server first, the termination ticket's own EscalatedToRequestID
  // wasn't set yet, so its "is the replacement still open" check found
  // nothing and closed the ticket outright instead of waiting on the
  // replacement. From the person's point of view this looked exactly
  // like "clicking Change to Replacement does nothing" — nothing
  // visible happened in the UI, while in the background a VA connection
  // could get silently terminated. Linking the replacement (above) is
  // all this step should ever do — the termination itself is meant to
  // keep being processed through its own normal Accept/Retract flow,
  // matching what this button's own confirm() text promises.
  if (escConnId && !escTermOutcomeInqId) {
    google.script.run
      .withSuccessHandler(function(termRes) {
        if (termRes && termRes.success) showToast('Termination ticket ' + termRes.inquiryId + ' created for the VA being replaced.', 'success');
      })
      .withFailureHandler(function(){})
      .createTerminationTicketFromConcern(escInqId, escConnId, createdRequestId);
  }
}

function reqSubmit(id) {
  var custId   = (document.getElementById('f_reqCustomer') ||{}).value;
  var clientId = (document.getElementById('f_reqClient')   ||{}).value;
  var reqType  = window._reqForcedRequestType || (document.getElementById('f_reqType')     ||{}).value;
  var errEl    = document.getElementById('reqFormErr');
  if (!window._reqScheduleOnlyMode) {
    if (!custId)   { if(errEl) errEl.textContent='Customer is required.';     return; }
    if (!clientId) { if(errEl) errEl.textContent='Client is required.';       return; }
    if (!reqType)  { if(errEl) errEl.textContent='Request Type is required.'; return; }
  }

  var dateFiledVal = (document.getElementById('f_reqDateFiled')||{}).value || '';
  if (dateFiledVal) {
    var parsedDateFiled = new Date(dateFiledVal);
    var nowForValidation = new Date();
    var oneYearAgoForValidation = new Date(nowForValidation); oneYearAgoForValidation.setFullYear(oneYearAgoForValidation.getFullYear() - 1);
    if (parsedDateFiled > nowForValidation) { if(errEl) errEl.textContent = 'Ticket Created Date can\'t be in the future.'; return; }
    if (parsedDateFiled < oneYearAgoForValidation) { if(errEl) errEl.textContent = 'Ticket Created Date can\'t be more than a year before today.'; return; }
  }

  // New requests go through the multi-service path — even a single service
  // block (the common case) is handled there, since it's really just "one
  // block, quantity 1." Editing an existing request, or any other request
  // type (Replacement, Hours/Schedule Change), keeps using the single-
  // block fields below exactly as before.
  if (!id && (reqType === 'New' || reqType === 'Additional')) {
    return _reqSubmitMultiServices(custId, clientId, errEl);
  }

  var changeConnId = (document.getElementById('f_changeReqConnection')||{}).value||'';
  var changeHours   = (document.getElementById('f_changeReqHours')||{}).value||'';
  var changeSched   = ((document.getElementById('f_changeReqScheduleNotes')||{}).value||'').trim();
  if (reqType === 'Hours/Schedule Change') {
    if (!changeConnId) { if(errEl) errEl.textContent='Select which existing VA this change is for.'; return; }
    if (!changeHours && !changeSched) { if(errEl) errEl.textContent='Describe the requested hours and/or schedule change.'; return; }
  }
  // Department/Service are only required for a real new assignment — not
  // for an Hours/Schedule Change request, which is about an existing VA
  // and deliberately doesn't ask for either (see f_svcDetailsWrap above).
  var deptVal = (document.getElementById('f_reqDept')||{}).value||'';
  var svcVal  = (document.getElementById('f_reqSvc') ||{}).value||'';
  if (reqType !== 'Hours/Schedule Change') {
    if (!window._reqScheduleOnlyMode) {
      if (!deptVal) { if(errEl) errEl.textContent='Department is required.'; return; }
      if (!svcVal)  { if(errEl) errEl.textContent='Service is required.';    return; }
      // Per the request — not required for Replacement (see
      // reqFormToggleReplacement, which hides this same field for that
      // type).
      var onboardingDateVal = (document.getElementById('f_reqOnboarding')||{}).value||'';
      if (!_reqNoSellerOnboarding(reqType) && !onboardingDateVal) { if(errEl) errEl.textContent='Seller Onboarding Date is required.'; return; }
      var targetStartWrap = document.getElementById('f_reqTargetStartWrap');
      var targetStartVal = (document.getElementById('f_reqTargetStart')||{}).value||'';
      if (targetStartWrap && targetStartWrap.style.display !== 'none' && !targetStartVal) { if(errEl) errEl.textContent='Target Start Date is required.'; return; }
    }
    var clientTzVal = (document.getElementById('f_reqTz')||{}).value || _reqResolveTypedTimezone();
    if (!clientTzVal) { if(errEl) errEl.textContent='Client Timezone is required.'; return; }
    if (svcVal === '__OTHER__') {
      var otherSvc = ((document.getElementById('f_reqSvcOther')||{}).value||'').trim();
      if (!otherSvc) { if(errEl) errEl.textContent='Please specify the service.'; return; }
      svcVal = otherSvc;
    }
  }
  if (errEl) errEl.textContent='';

  var tzEl          = document.getElementById('f_reqTz');
  var tzVal         = tzEl ? (tzEl.value || tzEl.options && tzEl.options[tzEl.selectedIndex] && tzEl.options[tzEl.selectedIndex].value || '') : '';

  var mgrSelVal = (document.getElementById('f_reqAcctMgr')||{}).value || '';
  var acctMgr   = mgrSelVal === '__new__'
    ? ((document.getElementById('f_reqAcctMgrNew')||{}).value||'').trim()
    : mgrSelVal;
  var acctMgrEmail = mgrSelVal === '__new__' ? ((document.getElementById('f_reqAcctMgrNewEmail')||{}).value||'').trim() : '';
  if (mgrSelVal === '__new__' && !acctMgr) { if(errEl) errEl.textContent='Enter the new account manager\'s name, or pick one from the list.'; return; }

  // Schedule Type drives hours collection. Weekly Fixed/Weekly Flexible/
  // Daily all use the same day-by-day builder — internally still recorded
  // as hoursType='Daily' so VAConnections/assignVA/the hours-calculation
  // engine (which already understand that value) don't need to change.
  // scheduleDays is kept too, for anything still reading the old flat list.
  var reqSchedType = (document.getElementById('f_reqSchedType')||{}).value||'';
  if (reqType !== 'Hours/Schedule Change' && !reqSchedType) { if(errEl) errEl.textContent='Schedule Type is required.'; return; }
  var reqHoursVal = '', reqHoursType = '', reqHoursBreakdown = '', reqPhWorkTime = '', reqDerivedPHTime = '', reqScheduleDays = '';
  var isFixedType = (reqSchedType === 'Weekly Fixed' || reqSchedType === 'Daily Fixed');
  var isDayBasedType = (reqSchedType === 'Weekly Fixed' || reqSchedType === 'Weekly Flexible' || reqSchedType === 'Daily Fixed' || reqSchedType === 'Daily Flexible');
  if (reqSchedType === 'Project-based') {
    reqHoursType = 'Project Based';
    reqHoursVal = ((document.getElementById('f_reqProjectHours')||{}).value||'');
    if (reqType !== 'Hours/Schedule Change' && !reqHoursVal) { if(errEl) errEl.textContent='Initial Hours is required.'; return; }
  } else if (isDayBasedType) {
    reqHoursType = 'Daily';
    var reqDailyBreakdown = dailyHoursCollectBreakdown('reqDaily');
    if (!reqDailyBreakdown.length) { if(errEl) errEl.textContent='Enter at least one day\'s hours.'; return; }
    reqHoursVal = dailyHoursWeeklyTotal('reqDaily');
    reqHoursBreakdown = JSON.stringify(reqDailyBreakdown);
    reqScheduleDays = reqDailyBreakdown.reduce(function(all,g){ return all.concat(g.days); }, []).join(',');
    reqPhWorkTime = ((document.getElementById('f_reqPhWorkTime')||{}).value||'').trim();
    reqDerivedPHTime = ((document.getElementById('f_reqPhDerivedPHTime')||{}).value||'').trim();
    if (isFixedType && !reqPhWorkTime) { if(errEl) errEl.textContent='Required Working Time (Client\'s Time) is required for a '+reqSchedType+' schedule.'; return; }
  }
  document.getElementById('f_reqHours').value = reqHoursVal; // kept in sync for anything still reading this field directly

  var btn = document.getElementById('reqSubmitBtn');
  if (btn) { btn.disabled=true; btn.textContent='Saving…'; }

  var payload = {
    customerId:          custId,
    clientId:            clientId,
    requestType:         reqType,
    department:          ((document.getElementById('f_reqDept')||{}).selectedOptions && (document.getElementById('f_reqDept')||{}).selectedOptions[0]
                            ? (document.getElementById('f_reqDept').selectedOptions[0].dataset.deptname || '')
                            : ((document.getElementById('f_reqDept')||{}).value||'')),
    service:             svcVal,
    primaryAccount:      (document.getElementById('f_reqPrimary')   ||{}).value||'',
    secondaryAccount:    (document.getElementById('f_reqSecondary') ||{}).value||'',
    accountManager:      acctMgr,
    accountManagerEmail: acctMgrEmail,
    hours:               reqHoursVal,
    hoursType:           reqHoursType,
    hoursBreakdown:      reqHoursBreakdown,
    requiredClientTime:  reqPhWorkTime,
    requiredPHTime:      reqDerivedPHTime,
    nightDiffApplicableAtSchedule: !!(document.getElementById('f_reqNightDiff')||{}).checked,
    breaksIncludedInTotal: !!(document.getElementById('f_reqBreaksIncluded')||{checked:true}).checked,
    paymentMethod:       ((document.getElementById('f_reqPaymentMethod')||{}).value||''),
    scheduleType:        reqSchedType,
    scheduleDays:        reqScheduleDays,
    scheduleNotes:       ((document.getElementById('f_reqSchedNotes')||{}).value||'').trim(),
    clientTimezone:      tzVal,
    phTimezone:          ((document.getElementById('f_reqPhTz')      ||{}).value||''),
    replacementForVAID:  ((document.getElementById('f_replacementForVAID')||{}).value||'').trim(),
    replacementForConnectionId: ((document.getElementById('f_fromConnection')||{}).value||'').trim(),
    sellerOnboardingDate:((document.getElementById('f_reqOnboarding') ||{}).value||''),
    targetStartDate:     ((document.getElementById('f_reqTargetStart')||{}).value||''),
    notes:               ((document.getElementById('f_reqNotes')      ||{}).value||'').trim(),
    dateFiled:           ((document.getElementById('f_reqDateFiled')  ||{}).value||''),
    parentRequestId:     (document.getElementById('f_parentRequestId') ||{}).value||'',
    requestGroup:        (document.getElementById('f_reqGroup')         ||{}).value||'Regular',
    specialRequestType:  (document.getElementById('f_specialRequestType')||{}).value||'',
    changeRequestForConnectionId: changeConnId,
    requestedHours:               changeHours,
    requestedScheduleNotes:       changeSched,
  };

  function onDone(res) {
    if(!res||!res.success){ if(errEl)errEl.textContent=(res&&res.errors?res.errors.join(' '):(res&&res.error)||'Failed.'); if(btn){btn.disabled=false;btn.textContent=id?'Save Changes':'Create Request';} return; }
    // Stacked edit (opened via the hover-edit icon on Schedule, on top of
    // the Service Request modal/full page) — close just the stacked
    // overlay and refresh whichever underlying view is open, in place,
    // rather than navigating away from it.
    if (window._reqFormIsStacked) {
      window._reqFormIsStacked = false;
      closeStackedModal();
      showToast('Schedule updated.', 'success');
      if (document.querySelector('#modalBox .rdr-hero')) reqOpenDetailModal(id);
      else if (typeof _rerenderReqProfile === 'function') _rerenderReqProfile(id);
      return;
    }
    closeModal(); showToast('Request saved.','success');
    // Surfaces what used to fail completely silently — see
    // _wfInitializeForNewRequest (WorkflowService.gs): a new request
    // whose workflow stage couldn't be set now says so here instead of
    // just looking like a normal success with an empty Phase later.
    if (!id && res.warning) { setTimeout(function(){ showToast(res.warning, 'error'); }, 400); }
    // If this creation was triggered from an inquiry escalation, process
    // it the same way the multi-service path does — this single-block
    // path (used for Replacement, Hours/Schedule Change, and editing)
    // previously never checked this at all.
    if (!id && res.id) _reqProcessPendingEscalation(res.id);
    // A new Replacement request was just filed for an existing connection —
    // prompt to end that connection now, or skip (the CS may want to wait
    // until the new VA actually starts before terminating the old one).
    if (!id && reqType === 'Replacement') {
      var origConnId = (document.getElementById('f_fromConnection')||{}).value || '';
      var origVAName = (document.getElementById('f_replacementFor')||{}).value || '';
      if (origConnId) {
        _reqPromptTerminateAfterReplacement(origConnId, origVAName, res.id);
        return;
      }
    }
    if (id) navigate('va-request-profile', id);
    else if (res.id) navigate('va-request-profile', res.id);
    else _loadReqList();
  }
  function onFail(err){ showToast(err.message,'error'); if(btn){btn.disabled=false;btn.textContent='Save';} }
  if (id) google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).updateVARequest(id, payload);
  else    google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).createVARequest(payload);
}

// After filing a Replacement request, ask whether to end the service it's
// replacing right now, or skip (e.g. the CS may want the new VA to actually
// start before terminating the old one, to avoid a coverage gap).
function _reqPromptTerminateAfterReplacement(connectionId, vaName, newRequestId) {
  openModal(
    '<div class="modal-header"><div class="modal-title">Replacement Request Filed</div></div>' +
    '<div class="modal-body">' +
      '<p style="font-size:14px;line-height:1.5;">The replacement request has been created. Would you like to end <strong>'+_esc(vaName||'the current VA')+'\'s</strong> service now, or wait?</p>' +
      '<p style="font-size:12.5px;color:var(--text-muted);margin-top:8px;">You can always terminate this connection later from its profile if you skip for now.</p>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" data-rid="'+_esc(newRequestId||'')+'" onclick="_reqSkipTerminateAfterReplacement(this.dataset.rid)">Skip for Now</button>' +
      '<button class="btn btn-danger" data-cid="'+_esc(connectionId)+'" data-vn="'+_esc(vaName||'')+'" data-rid="'+_esc(newRequestId||'')+'" onclick="_reqEndServiceAfterReplacement(this.dataset.cid,this.dataset.vn,this.dataset.rid)">End Service Now</button>' +
    '</div>'
  );
}

function _reqSkipTerminateAfterReplacement(newRequestId) {
  if (newRequestId) navigate('va-request-profile', newRequestId);
  else _loadReqList();
}

// Reuses the exact same terminate modal as the VA Connections list/profile
// — just routes its "after" behavior to land on the new replacement
// request instead of refreshing whichever list happened to be open before.
function _reqEndServiceAfterReplacement(connectionId, vaName, newRequestId) {
  vaConnOpenTerminate(connectionId, vaName);
  window._reqPostTerminateRequestId = newRequestId || '';
}

// Customer Contract — shown to the left of Payment in the stage bar, when

function _reqPaymentInline(req) {
  var PAY_COLOR = { 'Paid': '#15803d', 'Add to Next Bill': '#1e40af', 'No Payment': '#b45309' };

    ? '<button class="btn btn-ghost btn-icon rdr-payment-edit-icon" data-rid="'+_esc(req.requestId)+'" onclick="reqOpenConfirmPayment(this.dataset.rid)" title="Update payment status" style="opacity:0;position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:4px;padding:2px;color:var(--accent);">✎</button>'

function reqOpenConfirmPayment(requestId) {
  openModal(
    '<div class="modal-header"><div class="modal-title">Confirm Payment</div><button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>' +
    '<div class="modal-body">' +

function _reqDoConfirmPayment(requestId) {
  var choice = (document.querySelector('input[name="confPayChoice"]:checked')||{}).value || '';

  var errEl = document.getElementById('confPayErr');
  if (choice === 'Paid' && !payDate) { if (errEl) errEl.textContent = 'Payment Date is required.'; return; }
  if (errEl) errEl.textContent = '';
  var btn = document.getElementById('confPayBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { if (errEl) errEl.textContent = (res&&res.error)||'Failed.'; if (btn){btn.disabled=false;btn.textContent='Confirm';} return; }
      closeModal();
      showToast('Payment status updated.', 'success');
      if (document.getElementById('reqProfileRoot')) _rerenderReqProfile(requestId);
      else navigate('va-requests');
    })
    .withFailureHandler(function(err) { if (errEl) errEl.textContent = err.message; if (btn){btn.disabled=false;btn.textContent='Confirm';} })
    .confirmRequestPayment(requestId, choice, payDate);

// Per the request — the Final VA always sorts first, and Declined
// connections sort last (grouped together, since minimizing their
// visual space makes the most sense when they're not scattered
// throughout the list). Everything else keeps its original order.
// Shared across every place this app renders a request's connection
// list, rather than duplicating this logic separately in each one.
function _reqSortConnsForDisplay(conns) {
  return (conns || []).slice().sort(function(a, b) {
    var rank = function(c) {
      if (c.isFinalVA) return 0;
      if (c.connectionStatus === 'Declined') return 2;
      return 1;
    };
    return rank(a) - rank(b);
  });
}

function _reqStartRotatingLoading(elId, messages) {
  var el = document.getElementById(elId);
  if (!el) return null;
  var i = 0;
  function render() {
    el.innerHTML = '<div class="loading-screen"><div class="loader-ring"></div><p style="font-size:12.5px;color:var(--text-muted);margin-top:8px;">'+_esc(messages[i % messages.length])+'</p></div>';
  }
  render();
  return setInterval(function() { i++; render(); }, 750);
}
