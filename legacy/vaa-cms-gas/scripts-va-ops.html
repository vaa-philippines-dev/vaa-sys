function _fuBuildModal(rec, prefillCustId, prefillCliId) {
  var isEdit = !!rec;
  var g = function(k){ return rec ? _esc(rec[k]||'') : ''; };
  var today = new Date(); var todayStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  var dueVal = rec && rec.dueDate ? rec.dueDate.substring(0,10) : '';
  var custOpts = (CMS.customers||[]).slice().sort(function(a,b){return(a.customerName||'').localeCompare(b.customerName||'');}).map(function(c){
    var sel = (rec&&rec.customerId===c.customerId)||(prefillCustId===c.customerId) ? ' selected' : '';
    return '<option value="'+_esc(c.customerId)+'"'+sel+'>'+_esc(c.customerName)+'</option>';
  }).join('');
  // Default to the assigned specialist of the prefilled customer
  var fuDefaultSpec = '';
  if (!rec && prefillCustId) {
    var fuCust = (CMS.customers||[]).find(function(cx){ return cx.customerId === prefillCustId; });
    if (fuCust) fuDefaultSpec = fuCust.assignedSpecialist || '';
  }
  if (!fuDefaultSpec && CMS.user) fuDefaultSpec = CMS.user.email || '';
  var specOpts = (CMS.specialists||[]).map(function(s){
    var sel = (rec&&rec.assignedTo===s.email)||(fuDefaultSpec&&fuDefaultSpec===s.email) ? ' selected' : '';
    return '<option value="'+_esc(s.email)+'"'+sel+'>'+_esc(s.name||s.email)+'</option>';
  }).join('');
  openModal(
    '<div class="modal-header"><div class="modal-title">'+(isEdit?'Edit Follow-Up':'New Follow-Up')+'</div>' +
    '<button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>' +
    '<div class="modal-body" style="max-height:70vh;overflow-y:auto;">' +
      '<div class="form-group"><label class="form-label">Subject <span class="required">*</span></label>' +
        '<input class="form-input" id="fu_subject" value="'+g('subject')+'" placeholder="What needs to be followed up?" /></div>' +
      '<div class="form-group"><label class="form-label">Description</label>' +
        '<textarea class="form-textarea" id="fu_desc" style="min-height:64px;" placeholder="Details about this follow-up…">'+g('description')+'</textarea></div>' +
      '<div class="form-row">' +
        '<div class="form-group"><label class="form-label">Customer</label>' +
          '<select class="form-select" id="fu_cust" onchange="fuFormLoadAccounts()"><option value="">— None —</option>'+custOpts+'</select></div>' +
        '<div class="form-group"><label class="form-label">Account (optional)</label>' +
          '<select class="form-select" id="fu_cli" '+((!rec&&!prefillCustId)?'disabled style="opacity:.5;"':'')+'>'+
          '<option value="">— Select customer first —</option></select></div>' +
      '</div>' +
      '<div class="form-row">' +
        '<div class="form-group"><label class="form-label">Due Date <span class="required">*</span></label>' +
          '<input class="form-input" id="fu_due" type="date" value="'+dueVal+'" /></div>' +
        '<div class="form-group"><label class="form-label">Remind (days before)</label>' +
          '<input class="form-input" id="fu_remind" type="number" min="0" max="90" value="'+(rec?rec.remindDaysBefore:7)+'" /></div>' +
      '</div>' +
      '<div class="form-row">' +
        '<div class="form-group"><label class="form-label">Assigned To</label>' +
          '<select class="form-select" id="fu_assigned"><option value="">— Unassigned —</option>'+specOpts+'</select></div>' +
        (isEdit ? '<div class="form-group"><label class="form-label">Status</label>' +
          '<select class="form-select" id="fu_status"><option value="Open"'+(rec&&rec.status==='Open'?' selected':'')+'>Open</option>' +
          '<option value="Completed"'+(rec&&rec.status==='Completed'?' selected':'')+'>Completed</option>' +
          '<option value="Cancelled"'+(rec&&rec.status==='Cancelled'?' selected':'')+'>Cancelled</option></select></div>' : '<div class="form-group"></div>') +
      '</div>' +
      '<div id="fuFormErr" style="color:var(--danger);font-size:12.5px;"></div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" id="fuSubmitBtn" data-fid="'+(isEdit?g('followUpId'):'')+'" onclick="fuSubmit(this.dataset.fid)">'+(isEdit?'Save Changes':'Create')+'</button>' +
    '</div>'
  );
  if (prefillCustId || (rec && rec.customerId)) fuFormLoadAccounts(rec && rec.clientId);
}

function fuFormLoadAccounts(preselectId) {
  var custId = (document.getElementById('fu_cust')||{}).value||'';
  var sel    = document.getElementById('fu_cli'); if (!sel) return;
  // Also default assigned specialist from the selected customer
  if (custId) {
    var fuC = (CMS.customers||[]).find(function(cx){ return cx.customerId===custId; });
    if (fuC && fuC.assignedSpecialist) {
      var specEl = document.getElementById('fu_assigned');
      if (specEl && !specEl.dataset.manuallySet) specEl.value = fuC.assignedSpecialist;
    }
  }
  if (!custId) { sel.innerHTML = '<option value="">— Select customer first —</option>'; sel.disabled=true; return; }
  sel.disabled = false;
  if (!custId) { sel.innerHTML = '<option value="">— None —</option>'; return; }
  google.script.run
    .withSuccessHandler(function(res) {
      var clients = (res && res.success) ? res.data : [];
      sel.innerHTML = '<option value="">— None —</option>' +
        clients.map(function(c){
          var s = (c.clientId === preselectId) ? ' selected' : '';
          return '<option value="'+_esc(c.clientId)+'"'+s+'>'+_esc(c.companyName+(c.accountName?' — '+c.accountName:''))+'</option>';
        }).join('');
    })
    .withFailureHandler(function(){})
    .getClients({ customerId: custId });
}

function fuSubmit(id) {
  var subject = (document.getElementById('fu_subject')||{}).value||'';
  var dueDate = (document.getElementById('fu_due')||{}).value||'';
  var errEl   = document.getElementById('fuFormErr');
  if (!subject.trim()) { if(errEl)errEl.textContent='Subject is required.'; return; }
  if (!dueDate)         { if(errEl)errEl.textContent='Due date is required.'; return; }
  if (errEl) errEl.textContent='';
  var btn = document.getElementById('fuSubmitBtn');
  if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  var payload = {
    subject:         subject.trim(),
    description:     (document.getElementById('fu_desc')||{}).value||'',
    customerId:      (document.getElementById('fu_cust')||{}).value||'',
    clientId:        (document.getElementById('fu_cli')||{}).value||'',
    dueDate:         dueDate,
    remindDaysBefore:parseInt((document.getElementById('fu_remind')||{}).value)||7,
    assignedTo:      (document.getElementById('fu_assigned')||{}).value||'',
    status:          (document.getElementById('fu_status')||{value:'Open'}).value||'Open'
  };
  function done(res) {
    if(!res||!res.success){if(errEl)errEl.textContent=(res&&res.error)||'Save failed.';if(btn){btn.disabled=false;btn.textContent=id?'Save Changes':'Create';}return;}
    closeModal(); showToast('Follow-up saved.','success'); fuLoadAll();
  }
  function fail(e){showToast(e.message,'error');if(btn){btn.disabled=false;btn.textContent=id?'Save Changes':'Create';}}
  if (id) google.script.run.withSuccessHandler(done).withFailureHandler(fail).updateFollowUpRecord(id, payload);
  else    google.script.run.withSuccessHandler(done).withFailureHandler(fail).createFollowUpRecord(payload);
}

function fuComplete(id) {
  google.script.run
    .withSuccessHandler(function(res){
      if(!res||!res.success){ showToast((res&&res.error)||'Failed.','error'); return; }
      showToast('Marked as completed!','success'); fuLoadAll();
    })
    .withFailureHandler(function(e){ showToast(e.message,'error'); })
    .updateFollowUpRecord(id, { status: 'Completed' });
}

function _showVAConnProfile(container, conn) {
  var stClass   = conn.connectionStatus === 'Started'   ? 'badge-active'
                : conn.connectionStatus === 'Paused'    ? 'badge-paused'
                : (conn.connectionStatus === 'Cancelled' || conn.connectionStatus === 'Terminated') ? 'badge-terminated' : 'badge-inactive';
  var typeChip  = conn.connectionType === 'Non-Regular'
    ? '<span class="badge badge-returning">Non-Regular</span>'
    : '<span class="badge badge-role">Regular</span>';

  function dRow(lbl, val) {
    if (!val) return '';
    return '<div class="detail-row"><span class="detail-label">'+_esc(lbl)+'</span>' +
           '<span class="detail-val">'+_esc(val)+'</span></div>';
  }

  // Thread
  var threadHtml = (conn.thread && conn.thread.length)
    ? conn.thread.map(function(n) {
        return '<div class="iq-entry">' +
          '<div class="iq-entry-avatar" style="background:#10b981;">' +
            _esc((n.authorName||'?').charAt(0).toUpperCase()) +
          '</div>' +
          '<div class="iq-entry-bubble" style="background:var(--surface-2);">' +
            '<div class="iq-entry-header">' +
              '<span class="iq-entry-name">' + _esc(n.authorName||n.authorEmail||'—') + '</span>' +
              '<span class="iq-entry-time">' + _fdate(n.createdAt) + '</span>' +
            '</div>' +
            '<div class="iq-entry-content">' + _esc(n.content||'') + '</div>' +
          '</div>' +
        '</div>';

function _vaConnLoadPauseHistory(connectionId) {
  var el = document.getElementById('vaConnPauseHistBody'); if (!el) return;
  google.script.run
    .withSuccessHandler(function(res) {
      var el2 = document.getElementById('vaConnPauseHistBody'); if (!el2) return;
      var rows = (res && res.success) ? res.data : [];
      if (!rows.length) {
        el2.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">Never paused.</div>';
        return;
      }
      el2.innerHTML = rows.map(function(r) {
        var isPause = r.eventType === 'Paused';
        return '<div style="padding:8px 0;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;">' +
          '<div>' +
            '<span class="badge '+(isPause?'badge-paused':'badge-active')+'" style="font-size:10.5px;">'+(isPause?'⏸ Paused':'▶ Resumed')+'</span>' +
            '<div style="font-size:11px;color:var(--text-muted);margin-top:3px;">By '+_esc(r.loggedBy||'—')+'</div>' +
          '</div>' +
          '<div style="font-size:12.5px;font-weight:600;">'+_fdate(r.eventDate)+'</div>' +
        '</div>';
      }).join('');
    })
    .withFailureHandler(function(){
      var el2=document.getElementById('vaConnPauseHistBody');
      if(el2) el2.innerHTML='<div style="color:var(--text-muted);font-size:13px;">Could not load.</div>';
    })
    .getVAConnectionPauseLog(connectionId);
}

function _vaConnLoadReplacementHistory(requestId, currentConnId) {
  var el = document.getElementById('vaConnReplHistBody'); if (!el) return;
  if (!requestId) { el.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">No parent request.</div>'; return; }
  // Load all VA requests with this parentRequestId OR whose requestId matches (to find replacements)
  google.script.run
    .withSuccessHandler(function(res) {
      var el2 = document.getElementById('vaConnReplHistBody'); if (!el2) return;
      var all = (res && res.success) ? res.data : [];
      // Find replacement requests that point to this original request
      var replacements = all.filter(function(r) {
        return r.parentRequestId === requestId || r.requestType === 'Replacement';
      });
      if (!replacements.length) {
        el2.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">No replacements on record.</div>';
        return;
      }
      el2.innerHTML = replacements.map(function(r, i) {
        return '<div style="padding:8px 0;border-bottom:1px solid var(--border-light);">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;">' +
            '<div style="font-size:12.5px;font-weight:700;">' + _esc(r.requestId) + '</div>' +
            '<span class="badge badge-' + (r.status||'').toLowerCase().replace(' ','-') + '" style="font-size:10.5px;">' + _esc(r.status) + '</span>' +
          '</div>' +
          '<div style="font-size:12px;color:var(--text-muted);">Replacement #'+(i+1)+' · '+ _fdate(r.createdAt) + (r.replacementForVAID ? ' · Replacing: '+_esc(r.replacementForVAID) : '') + '</div>' +
        '</div>';
      }).join('');
    })
    .withFailureHandler(function(){
      var el2=document.getElementById('vaConnReplHistBody');
      if(el2) el2.innerHTML='<div style="color:var(--text-muted);font-size:13px;">Could not load.</div>';
    })
    .getVARequestList({ parentRequestId: requestId });
}

function vaConnProfilePostNote(connectionId, requestId) {
  var inp  = document.getElementById('vaConnProfileNote');
  var text = (inp || {}).value ? inp.value.trim() : '';
  if (!text) return;
  inp.value = ''; inp.disabled = true;
  google.script.run
    .withSuccessHandler(function(res) {
      inp.disabled = false;
      if (!res || !res.success) { showToast((res&&res.error)||'Failed.','error'); return; }
      showToast('Note added.','success');
      navigate('va-connection-profile', connectionId);
    })
    .withFailureHandler(function(err){ inp.disabled=false; showToast(err.message,'error'); })
    .addVAConnectionNote({ connectionId:connectionId, requestId:requestId, content:text });
}

// Open replacement service request form
function vaConnProfileAddReplacement(connectionId, requestId, vaName, clientId, customerId, connData) {
  var conn = connData || {};
  _ensureReqFormData(function() {
    document.getElementById('modalBox').style.maxWidth = '860px';
    openModal(_reqBuildForm(null, {
      prefillClientId:    clientId,
      prefillCustomerId:  customerId,
      prefillType:        'Replacement',
      prefillParentReqId: requestId,
      prefillVAName:      vaName,
      fromConnection:     connectionId,
      replacementForVAID: conn.vaId || '',
      connDept:           conn.department || '',
      connSvc:            conn.service    || '',
      connHours:          conn.hours      || '',
      connSchedType:      conn.scheduleType|| '',
      connSchedDays:      conn.scheduleDays|| ''
    }));
    { var mb2137 = document.getElementById('modalBox'); if (mb2137) mb2137.style.maxWidth = '860px'; }

    function setField(id, val, lock) {
      var el = document.getElementById(id); if (!el) return;
      el.value = val;
      if (lock) { el.disabled = true; }
    }
    function lockLabel(id) {
      var el = document.getElementById(id); if (!el) return;
      el.style.background='var(--surface-2)'; el.style.cursor='not-allowed';
    }

    // Lock customer, then ONLY set the account once its dropdown has actually
    // finished loading real <option> elements — this used to be a fixed
    // 700ms setTimeout, which silently left the Account field blank whenever
    // the getClients() round trip took longer than that (slow connection,
    // server under load, etc.). Bug fix 2026-06-24.
    setField('f_reqCustomer', customerId, true);
    reqFormLoadClients({ value: customerId, disabled: true }, function() {
      setField('f_reqClient', clientId, true);
      var clSearch = document.getElementById('f_reqClientSearch');
      if (clSearch) {
        var label = (_reqClientOptions.find(function(o){ return o.clientId === clientId; })||{}).label;
        clSearch.value = label || clSearch.value;
        clSearch.setAttribute('readonly','readonly');
      }
      // Lock type
      setField('f_reqType', 'Replacement', true);
      var rw = document.getElementById('f_replacementWrap'); if(rw) rw.style.display='';
      setField('f_replacementFor', vaName, true);
      lockLabel('f_replacementFor');

      // Department + Service must match the connection being replaced — locked,
      // not just pre-filled, since a replacement is for the SAME role, just a
      // different person. reqFilterServicesByDept() is itself synchronous
      // (filters an already-loaded in-memory list), so no further timeout
      // chain is needed once Department's SettingID is resolved and set.
      if (conn.department) {
        var _norm = function(v){ return String(v||'').trim().toLowerCase(); };
        var _replDeptObj = ((CMS.settings && CMS.settings['Department'])||[]).find(function(d){ return _norm(d.value)===_norm(conn.department) || _norm(d.label)===_norm(conn.department); });
        setField('f_reqDept', _replDeptObj ? (_replDeptObj.id||'') : conn.department, true);
        reqFilterServicesByDept();
        var _replSvcObj = ((CMS.settings && CMS.settings['Service'])||[]).find(function(s){ return _norm(s.value)===_norm(conn.service) || _norm(s.label)===_norm(conn.service); });
        var svcSelEl = document.getElementById('f_reqSvc');
        if (_replSvcObj) {
          setField('f_reqSvc', _replSvcObj.value||'', true);
        } else if (conn.service && svcSelEl) {
          // Nothing in current Settings matches this connection's saved
          // Service (renamed/removed since, or a data mismatch) — rather
          // than leaving the dropdown looking blank, inject the original
          // saved value as its own option so the real data is still shown.
          var svcOpt = document.createElement('option');
          svcOpt.value = conn.service; svcOpt.textContent = conn.service + ' (not in current list)';
          svcSelEl.appendChild(svcOpt);
          setField('f_reqSvc', conn.service, true);
        }
      }

      // Pre-fill hours/schedule (editable) using the connection's CURRENT
      // state — Schedule Type, day-by-day breakdown, and PH working time —
      // rather than the old flat Hours/Schedule Type fields, so this
      // matches the same unified model the rest of the Service Request
      // form uses.
      // conn.scheduleType may hold an old-format value (Fixed/Flexible/
      // Shifting, or blank) from before the 5-option Schedule Type model —
      // map it to the closest equivalent rather than leaving the field
      // silently unmatched against the new dropdown options.
      var NEW_SCHED_TYPES = ['Weekly Fixed','Weekly Flexible','Daily Fixed','Daily Flexible','Project-based'];
      // Per the request — ScheduleType's "Project Based" value renamed to
      // "Project-based" system-wide. The map KEY here stays 'Project Based'
      // (it matches conn.hoursType, which keeps its own unrenamed value,
      // or an un-migrated legacy conn.scheduleType) — only the VALUE this
      // maps TO (the new ScheduleType actually being set) changes.
      var OLD_SCHED_MAP = { 'Fixed':'Weekly Fixed', 'Flexible':'Weekly Flexible', 'Daily':'Daily Flexible', 'Project Based':'Project-based' };
      var resolvedSchedType = conn.scheduleType && NEW_SCHED_TYPES.indexOf(conn.scheduleType) !== -1
        ? conn.scheduleType
        : (OLD_SCHED_MAP[conn.hoursType] || OLD_SCHED_MAP[conn.scheduleType] || '');
      if (resolvedSchedType) {
        setField('f_reqSchedType', resolvedSchedType, false);
        reqScheduleTypeChanged(resolvedSchedType);
        if (resolvedSchedType === 'Project-based') {
          setField('f_reqProjectHours', conn.hours || conn.reqHours || '', false);
        } else {
          try { dailyHoursPrefill('reqDaily', JSON.parse(conn.hoursBreakdown || '[]')); } catch(e) {}
          if (conn.requiredClientTime || conn.requiredPHTime) { setField('f_reqPhWorkTime', conn.requiredClientTime || conn.requiredPHTime, false); _reqParsePhTimeRangeIntoFields(''); }
        }
      } else {
        // No recognized schedule type on file for this connection — fall
        // back to at least carrying the raw hours number over, editable.
        setField('f_reqHours', conn.hours || conn.reqHours || '', false);
      }

      // Load contacts — this is synchronous (reads from the already-loaded
      // in-memory client list) and already disables Primary/Secondary itself
      // whenever a contact value exists, so no extra timeout/lock step is needed.
      reqLoadContactsForClient(clientId);
      var priSel = document.getElementById('f_reqPrimary');
      var secSel = document.getElementById('f_reqSecondary');
      if (priSel) priSel.disabled = true;
      if (secSel) secSel.disabled = true;

      // Rename Seller Onboarding Date label to Connection Date
      var onbLbl = document.getElementById('lbl_reqOnboarding');
      if (onbLbl) onbLbl.textContent = 'Connection Date';
    });

    // Bug fix (2026-06-29): Client Timezone used to be left on its static
    // "Loading timezones…" placeholder forever in this flow — every OTHER
    // path that opens this form calls reqFormLoadTimezones() right after
    // rendering it, but this one never did. Timezone lives on the ORIGINAL
    // VARequest (VAConnections don't have their own clientTimezone field),
    // so fetch that request and use its saved value. Locked, like
    // Department/Service, since the account's contact location hasn't
    // changed just because the VA assigned to it is being swapped.
    google.script.run
      .withSuccessHandler(function(res) {
        var tz = (res && res.success && res.data) ? (res.data.clientTimezone || '') : '';
        reqFormLoadTimezones(tz);
        var tzEl = document.getElementById('f_reqTz');
        if (tzEl && tz) tzEl.disabled = true;
        // If the connection itself didn't already carry a vaId (some call
        // sites pass an empty connData), resolve it from the original
        // request/connection here so ReplacementForVAID is never blank.
        if (!conn.vaId) {
          google.script.run
            .withSuccessHandler(function(connRes) {
              var vaIdEl = document.getElementById('f_replacementForVAID');
              if (vaIdEl && connRes && connRes.success && connRes.data) vaIdEl.value = connRes.data.vaId || '';
            })
            .getVAConnById(connectionId);
        }
      })
      .withFailureHandler(function() { reqFormLoadTimezones(''); })
      .getVARequestById(requestId);
  });
}

// Nav permissions are defined in scripts-core.html (_loadNavPermissions,

function _permSwitchSubTab(tab) {

    btn.classList.toggle('active', btn.dataset.tab === tab);
  });

}
function _permRenderActiveSubTab() {

  if (_permActiveSubTab === 'nav') { body.innerHTML = _permBuildNavScopingTab(); return; }

// ── Module Permissions matrix ───────────────────────────────────────
var _permModuleData = null;
function _permRenderModuleMatrix(body) {
  body.innerHTML = _loadingHtml('Loading permissions matrix…', '200px');
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { body.innerHTML = '<div class="empty-state"><h3>Error</h3><p>'+_esc((res&&res.error)||'')+'</p></div>'; return; }
      _permModuleData = res;
      _permRenderModuleMatrixTable(body);
    })
    .withFailureHandler(function(err) { body.innerHTML = '<div class="empty-state"><h3>Error</h3><p>'+_esc(err.message)+'</p></div>'; })
    .getPermissionsMatrix();
}
function _permRenderModuleMatrixTable(body) {
  var res = _permModuleData;
  var headerCells = res.roles.map(function(role) {
    return '<th style="text-align:center;min-width:110px;font-size:11px;padding:6px 4px;">'+_esc(role)+(role==='Administrator'?' <span title="Always full access" style="cursor:help;">🔒</span>':'')+'</th>';
  }).join('');
  var bodyRows = res.modules.map(function(module) {
    var cells = res.roles.map(function(role) {
      var cell = (res.grid[module] && res.grid[module][role]) || { c:false, r:false, u:false, d:false };
      var isAdmin = role === 'Administrator';
      function badge(action, on, label) {
        var style = on ? 'background:var(--accent);color:#fff;' : 'background:var(--surface-2);color:var(--text-muted);';
        return '<span class="perm-badge" data-module="'+_esc(module)+'" data-role="'+_esc(role)+'" data-action="'+action+'" '+
          (isAdmin ? '' : 'onclick="_permToggleCell(this)"') +
          ' style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;font-size:9.5px;font-weight:700;cursor:'+(isAdmin?'default':'pointer')+';margin:1px;'+style+'" title="'+label+'">'+action.toUpperCase()+'</span>';
      }
      return '<td style="text-align:center;padding:4px;">' +
        badge('c', cell.c, 'Create') + badge('r', cell.r, 'Read') + badge('u', cell.u, 'Update') + badge('d', cell.d, 'Delete') +
      '</td>';
    }).join('');
    return '<tr><td style="font-weight:600;font-size:12.5px;padding:6px 8px;white-space:nowrap;">'+_esc(module)+'</td>'+cells+'</tr>';
  }).join('');

  body.innerHTML =
    '<div class="form-hint" style="margin-bottom:10px;">Click a badge to toggle Create / Read / Update / Delete for that module and role. Changes save immediately. Administrator always has full access.</div>' +
    '<div style="overflow-x:auto;border:1px solid var(--border-light);border-radius:8px;">' +
      '<table style="border-collapse:collapse;font-size:12.5px;">' +
        '<thead><tr><th style="text-align:left;padding:6px 8px;">Module</th>'+headerCells+'</tr></thead>' +
        '<tbody>'+bodyRows+'</tbody>' +
      '</table>' +
    '</div>';
}
function _permToggleCell(el) {
  var module = el.dataset.module, role = el.dataset.role, action = el.dataset.action;
  var cell = _permModuleData.grid[module][role];
  var newVal = !cell[action];
  el.style.background = newVal ? 'var(--accent)' : 'var(--surface-2)';
  el.style.color = newVal ? '#fff' : 'var(--text-muted)';
  cell[action] = newVal;
  google.script.run
    .withFailureHandler(function(err) {
      // Revert on failure
      cell[action] = !newVal;
      el.style.background = !newVal ? 'var(--accent)' : 'var(--surface-2)';
      el.style.color = !newVal ? '#fff' : 'var(--text-muted)';
      showToast(err.message, 'error');
    })
    .updateModulePermission(module, role, action, newVal);
}

function _permRenderFieldMatrix(body) {

      _permRenderFieldMatrixTable(body);

    return '<th style="text-align:center;min-width:100px;font-size:11px;padding:6px 4px;">'+_esc(role)+'</th>';
  }).join('');
  var rows = [];
  Object.keys(res.fields).forEach(function(module) {
    rows.push('<tr><td colspan="'+(res.roles.length+1)+'" style="background:var(--surface-2);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);padding:6px 10px;">'+_esc(module)+'</td></tr>');
    res.fields[module].forEach(function(field) {
      var cells = res.roles.map(function(role) {
        var vis = (res.grid[module] && res.grid[module][field] && res.grid[module][field][role]) || 'Read';
        var isAdmin = role === 'Administrator';
        var colors = { None: '#dc2626', Read: '#b45309', Edit: '#15803d' };
        return '<td style="text-align:center;padding:4px;">' +
          '<select '+(isAdmin?'disabled':'')+' data-module="'+_esc(module)+'" data-field="'+_esc(field)+'" data-role="'+_esc(role)+'" onchange="_permFieldChanged(this)" ' +
            'style="font-size:10.5px;padding:2px 4px;border-radius:4px;font-weight:600;color:'+(colors[vis]||'#64748b')+';border:1px solid var(--border);">' +
            ['None','Read','Edit'].map(function(v){ return '<option value="'+v+'"'+(v===(isAdmin?'Edit':vis)?' selected':'')+'>'+v+'</option>'; }).join('') +
          '</select>' +
        '</td>';
      }).join('');
      rows.push('<tr><td style="font-size:12.5px;padding-left:20px;">'+_esc(field)+'</td>'+cells+'</tr>');
    });
  });

  body.innerHTML =
    '<div class="form-hint" style="margin-bottom:10px;">Overrides a module\'s own permission for one specific sensitive field — e.g. Rate can be fully editable for HR while staying entirely invisible to CS Specialist, regardless of what CS Specialist can otherwise do in VA Connections generally. Changes save immediately.</div>' +
    '<div style="overflow-x:auto;border:1px solid var(--border-light);border-radius:8px;">' +
      '<table style="border-collapse:collapse;font-size:12.5px;width:100%;">' +
        '<thead><tr><th style="text-align:left;padding:6px 8px;">Field</th>'+headerCells+'</tr></thead>' +
        '<tbody>'+rows.join('')+'</tbody>' +
      '</table>' +
    '</div>';
}
function _permFieldChanged(el) {
  var module = el.dataset.module, field = el.dataset.field, role = el.dataset.role;
  var newVal = el.value;
  var prevVal = el.dataset.prevValue || 'Read';
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { showToast((res&&res.error)||'Failed.', 'error'); el.value = prevVal; return; }
      el.dataset.prevValue = newVal;
      showToast('Saved.', 'success');
    })
    .withFailureHandler(function(err) { showToast(err.message, 'error'); el.value = prevVal; })
    .updateFieldPermission(module, field, role, newVal);
}

  if (cb.checked) {

  } else {
    label.style.borderColor = 'var(--border)';

function permSaveAll() {
  var grid = document.getElementById('permPageGrid');
  if (!grid) return;
  var role = grid.dataset.role;
  var checked = [];
  grid.querySelectorAll('input[type="checkbox"]:checked').forEach(function(cb){ checked.push(cb.value); });
  _navRolePermissions[role] = checked;

  // Save to CMS.settings and to backend settings
  google.script.run
    .withSuccessHandler(function(){
      var msg = document.getElementById('permSaveMsg');
      if (msg) { msg.style.display='block'; setTimeout(function(){msg.style.display='none';},3000); }
      // Re-apply nav permissions immediately
      _applyNavPermissions();

}

function vaConnExportToggleTermRange() {
  var termChecked = Array.prototype.some.call(document.querySelectorAll('.f_vaExportStatus'), function(el) {
    return el.value === 'Terminated' && el.checked;
  });
  var wrap = document.getElementById('f_vaExportTermRangeWrap');

function vaConnDoExport() {
  var statuses = Array.prototype.filter.call(document.querySelectorAll('.f_vaExportStatus'), function(el){ return el.checked; }).map(function(el){ return el.value; });
  var errEl = document.getElementById('vaExportErr');
  if (!statuses.length) { if (errEl) errEl.textContent = 'Select at least one status.'; return; }
  var dept = (document.getElementById('f_vaExportDept')||{}).value || '';
  var termRange = (document.getElementById('f_vaExportTermRange')||{}).value || 'all';
  var termFrom = (document.getElementById('f_vaExportTermFrom')||{}).value || '';
  var termTo = (document.getElementById('f_vaExportTermTo')||{}).value || '';

  var btn = document.getElementById('vaExportBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Preparing…'; }
  // Fetches everything regardless of the page's current tab/filters —
  // this export's scope is independent of whatever's currently displayed.
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { if (errEl) errEl.textContent = (res&&res.error)||'Failed.'; if (btn) { btn.disabled=false; btn.textContent='Export'; } return; }
      var all = res.data || [];
      var now = new Date();
      var termCutoff = null;
      if (termRange === 'ytd') termCutoff = new Date(now.getFullYear(), 0, 1);
      else if (termRange === 'pastyear') { termCutoff = new Date(now); termCutoff.setFullYear(termCutoff.getFullYear()-1); }
      var termFromDate = termRange === 'custom' && termFrom ? new Date(termFrom) : null;
      var termToDate   = termRange === 'custom' && termTo   ? new Date(termTo)   : null;

      var filtered = all.filter(function(conn) {
        if (dept && conn.department !== dept) return false;
        if (statuses.indexOf(conn.connectionStatus) === -1) return false;
        if (conn.connectionStatus === 'Terminated' && termRange !== 'all') {
          var td = new Date(conn.terminationDate || 0);
          if (isNaN(td.getTime())) return false;
          if (termRange === 'custom') {
            if (termFromDate && td < termFromDate) return false;
            if (termToDate && td > termToDate) return false;
          } else if (termCutoff && td < termCutoff) return false;
        }
        return true;
      });

      if (!filtered.length) { if (errEl) errEl.textContent = 'No connections match these filters.'; if (btn) { btn.disabled=false; btn.textContent='Export'; } return; }

      var headerRow = ['VA Name', 'Customer', 'Account', 'Service', 'Department', 'Status', 'Connection Type', 'Hours Type', 'Actual Start Date', 'Termination Date', 'WR Link'];
      var dataRows = filtered.map(function(conn) {
        return [
          conn.vaName || '', conn.customerName || conn.customerId || '', conn.accountName || conn.companyName || '',
          conn.service || '', conn.department || '', conn.connectionStatus || '', conn.connectionType || '',
          conn.hoursType || '', conn.actualStartDate ? _fdate(conn.actualStartDate) : '',
          conn.connectionStatus === 'Terminated' && conn.terminationDate ? _fdate(conn.terminationDate) : '',
          conn.wrLink || ''
        ];
      });
      google.script.run
        .withSuccessHandler(function(exportRes) {
          if (!exportRes || !exportRes.success) { if (errEl) errEl.textContent = (exportRes&&exportRes.error)||'Export failed.'; if (btn) { btn.disabled=false; btn.textContent='Export'; } return; }
          var link = document.createElement('a');
          link.href = 'data:text/csv;charset=utf-8;base64,' + exportRes.base64;
          link.download = exportRes.fileName;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast('Export ready — ' + dataRows.length + ' connection(s).', 'success');
          closeModal();
        })
        .withFailureHandler(function(err) { if (errEl) errEl.textContent = err.message; if (btn) { btn.disabled=false; btn.textContent='Export'; } })
        .exportVAConnectionsToExcel([headerRow], dataRows);
    })
    .withFailureHandler(function(err) { if (errEl) errEl.textContent = err.message; if (btn) { btn.disabled=false; btn.textContent='Export'; } })
    .getActiveVAConnectionList({ all: true, forExport: true });
}

    .withSuccessHandler(function(res) {
      console.log('[VACONN] getActiveVAConnectionList() responded after ' + (Date.now()-_t) + 'ms. success=', res && res.success, 'rows=', res && res.data && res.data.length);
      if (!res || !res.success) { showToast((res && res.error) || 'Failed.', 'error'); return; }
      _vaConnAll = _scopeToSpecialist(res.data || [], 'customerId');
      vaConnApplyFilters();
    })
    .withFailureHandler(function(err) { console.error('[VACONN] getActiveVAConnectionList() THREW after ' + (Date.now()-_t) + 'ms:', err.message); showToast(err.message, 'error'); })

// Real bug fixed here: which columns show on the Terminated tab (Termination Date / Reason / IR,
// instead of WR / Payroll / Actions) was only applied when a tab was CLICKED. _vaConnTab persists
// while you move around the app, so coming back to this page with Terminated still selected drew the
// header in its default state (Termination Date / Reason / IR hidden, WR / Payroll / Actions shown)
// while the rows were drawn for Terminated — 8 headers over 10 cells, and no Termination Date column.
// Now applied every time the page is built, a tab is clicked, or the rows are redrawn.
function _vaConnApplyTabColumns() {
  var isTerm = (_vaConnTab === 'Terminated');
  document.querySelectorAll('.vaconn-term-col').forEach(function(el) { el.style.display = isTerm ? '' : 'none'; });
  document.querySelectorAll('.vaconn-nonterm-col').forEach(function(el) { el.style.display = isTerm ? 'none' : ''; });
}

function vaConnSetTab(btn, statusVal) {

  btn.classList.add('active');
  _vaConnTab = statusVal;
  _vaConnAll = [];
  _vaConnApplyTabColumns();
  var tbody = document.getElementById('vaConnTbody');

  if (tbody) tbody.innerHTML = '<tr><td colspan="'+cols+'" style="text-align:center;padding:40px;"><div class="loader-ring" style="margin:0 auto;"></div></td></tr>';

function _vaConnDateFieldChanged() {

  var wrap = document.getElementById('vaConnDateRangeWrap');

function vaConnApplyFilters() {
  var q    = ((document.getElementById('vaConnSearch')    ||{}).value||'').toLowerCase();
  var dept = ((document.getElementById('vaConnDeptFilter')||{}).value||'');
  var svc  = ((document.getElementById('vaConnSvcFilter') ||{}).value||'');
  var type = ((document.getElementById('vaConnTypeFilter')||{}).value||'');
  var csSpec = ((document.getElementById('vaConnCsFilter')||{}).value||'');
  var dateField = ((document.getElementById('vaConnDateField')||{}).value||'');
  var dateFrom  = ((document.getElementById('vaConnDateFrom') ||{}).value||'');
  var dateTo    = ((document.getElementById('vaConnDateTo')   ||{}).value||'');
  // Dropdown's simpler display value maps to the connection's actual
  // field name — Start Date is stored as actualStartDate, not startDate.
  var actualDateField = dateField === 'startDate' ? 'actualStartDate' : dateField;
  _vaConnFiltered = _vaConnAll.filter(function(r) {
    var mQ = !q    || [(r.vaName||''),(r.companyName||''),(r.accountName||''),(r.customerName||''),(r.connectionId||'')].some(function(v){ return v.toLowerCase().includes(q); });
    var mD = !dept || r.department === dept;
    var mS = !svc  || r.service    === svc;
    var mT = !type || r.connectionType === type;
    var mCs = !csSpec || (r.csAssignedEmail||'').toLowerCase() === csSpec.toLowerCase();
    var mDate = true;
    if (actualDateField && (dateFrom || dateTo)) {
      var rawVal = r[actualDateField];
      if (!rawVal) { mDate = false; } // record has no value for the chosen date field — can't match a range
      else {
        var d = new Date(rawVal);
        if (isNaN(d.getTime())) { mDate = false; }
        else {
          var dKey = d.toISOString().substring(0,10);
          if (dateFrom && dKey < dateFrom) mDate = false;
          if (dateTo && dKey > dateTo) mDate = false;
        }
      }
    }
    return mQ && mD && mS && mT && mCs && mDate;
  });
  if (_vaConnTab === 'Terminated') {
    _vaConnFiltered.sort(function(a,b){ return new Date(b.terminationDate||0) - new Date(a.terminationDate||0); });
  }
  _vaConnPageNum = 1;
  vaConnRender();
}

function vaConnSetPageSize(v) { _vaConnPageSize = (v === 'all') ? Infinity : (parseInt(v)||10); _vaConnPageNum=1; vaConnRender(); }
function vaConnGoPage(pg)      { var max=Math.max(1,Math.ceil(_vaConnFiltered.length/_vaConnPageSize)); if(pg>=1&&pg<=max){_vaConnPageNum=pg;vaConnRender();} }

    .updateVAConnectionWRLink(connectionId, link);

function vaConnDoEditTermDate(connectionId) {
  var newDate = (document.getElementById('f_vaConnTermDate')||{}).value || '';
  var errEl = document.getElementById('vaConnTermDateErr');
  if (!newDate) { if (errEl) errEl.textContent = 'Please select a date.'; return; }
  var btn = document.getElementById('vaConnTermDateBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { if (errEl) errEl.textContent = (res&&res.error)||'Failed.'; if (btn) { btn.disabled=false; btn.textContent='Save'; } return; }
      showToast('Termination date updated.', 'success');
      closeModal();
      vaConnLoadAll();
    })
    .withFailureHandler(function(err) { if (errEl) errEl.textContent = err.message; if (btn) { btn.disabled=false; btn.textContent='Save'; } })
    .updateVAConnectionTerminationDate(connectionId, newDate);
}

function vaConnOpenEditTermReason(connectionId, currentReason) {
  var reasons = (CMS.settings && CMS.settings['TerminationReason']) || [];
  var reasonOpts = reasons.map(function(r){ return '<option value="'+_esc(r.value)+'">'+_esc(r.label)+'</option>'; }).join('');
  // The saved value is a combined "Reason — Notes" string (same combining
  // logic as the main Terminate modal) — try splitting it back apart so
  // the dropdown can be pre-selected rather than always starting blank.
  var prefillReasonVal = '', prefillNotes = currentReason || '';
  var splitIdx = (currentReason||'').indexOf(' — ');
  if (splitIdx !== -1) {
    var firstPart = currentReason.substring(0, splitIdx);
    var matched = reasons.filter(function(r){ return r.label === firstPart || r.value === firstPart; })[0];
    if (matched) { prefillReasonVal = matched.value; prefillNotes = currentReason.substring(splitIdx + 3); }
  }
  openModal(
    '<div class="modal-header"><div class="modal-title">Edit Termination Reason</div><button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>' +
    '<div class="modal-body">' +
      '<div class="form-group"><label class="form-label">Reason <span class="required">*</span></label>' +
        '<select class="form-select" id="f_vaConnEditReason"><option value="">Select reason…</option>'+reasonOpts+'</select></div>' +
      '<div class="form-group"><label class="form-label">Notes</label><textarea class="form-textarea" id="f_vaConnEditNotes" style="min-height:70px;">'+_esc(prefillNotes)+'</textarea></div>' +
      '<div id="vaConnTermReasonErr" style="color:var(--danger);font-size:12.5px;"></div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" id="vaConnTermReasonBtn" data-cid="'+_esc(connectionId)+'" onclick="vaConnDoEditTermReason(this.dataset.cid)">Save</button></div>'
  );
  var reasonSel = document.getElementById('f_vaConnEditReason');
  if (reasonSel && prefillReasonVal) reasonSel.value = prefillReasonVal;
}
function vaConnDoEditTermReason(connectionId) {
  var reasonSel = document.getElementById('f_vaConnEditReason');
  var reasonVal = (reasonSel || {}).value || '';
  var reasonLabel = reasonSel && reasonSel.selectedIndex > 0 ? reasonSel.options[reasonSel.selectedIndex].text : '';
  var notes = ((document.getElementById('f_vaConnEditNotes')||{}).value || '').trim();
  var errEl = document.getElementById('vaConnTermReasonErr');
  if (!reasonVal) { if (errEl) errEl.textContent = 'A reason is required.'; return; }
  var newReason = [reasonLabel, notes].filter(Boolean).join(' — ');
  var btn = document.getElementById('vaConnTermReasonBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { if (errEl) errEl.textContent = (res&&res.error)||'Failed.'; if (btn) { btn.disabled=false; btn.textContent='Save'; } return; }
      showToast('Termination reason updated.', 'success');
      closeModal();
      vaConnLoadAll();
    })
    .withFailureHandler(function(err) { if (errEl) errEl.textContent = err.message; if (btn) { btn.disabled=false; btn.textContent='Save'; } })
    .updateVAConnectionTerminationReason(connectionId, newReason);
}

// ── Pause / Resume VA Connection ──────────────────────────────────────
// For Resume (Paused→Started): fires immediately, no date needed.
// For Pause (Started→Paused): opens a modal to capture the pause date,
// then — if this is the last active VA for the account or the customer —
// prompts to also pause those records.
function vaConnTogglePayroll(el, connectionId, currentStatus) {
  if (el && el.dataset.pending === '1') return; // already in flight — ignore a second click
  var newStatus = currentStatus === 'Added' ? 'Not Yet Added' : 'Added';
  if (el) { el.dataset.pending = '1'; el.style.opacity = '0.5'; el.style.pointerEvents = 'none'; }
  showToast('Updating payroll status…', 'info');
  google.script.run
    .withSuccessHandler(function(res) {
      if (el) { el.dataset.pending = '0'; el.style.opacity = ''; el.style.pointerEvents = ''; }
      if (!res || !res.success) { showToast((res&&res.error)||'Failed.', 'error'); return; }
      showToast('Payroll status updated to "' + newStatus + '".', 'success');
      vaConnLoadAll();
    })
    .withFailureHandler(function(err) {
      if (el) { el.dataset.pending = '0'; el.style.opacity = ''; el.style.pointerEvents = ''; }
      showToast(err.message, 'error');
    })
    .setVAConnectionPayrollStatus(connectionId, newStatus);
}

        row('Client', _esc(conn.customerName||conn.companyName||conn.accountName||'—')) +

        row('Termination Date', conn.terminationDate ? _fdate(conn.terminationDate) : '<span class="muted">—</span>') +

      '</div>' +

function vaConnDoPause(connectionId) {
  // Determine current status of this connection in the loaded list
  var conn = (_vaConnAll||[]).filter(function(c){ return c.connectionId === connectionId; })[0];
  var isCurrentlyPaused = conn && conn.connectionStatus === 'Paused';

  if (isCurrentlyPaused) {
    // Resuming — no date prompt, just do it immediately
    _vaConnExecutePause(connectionId, null);
    return;
  }

  // Pausing — ask for the effective pause date
  var todayStr = _todayStr();
  document.getElementById('modalBox').style.maxWidth = '420px';
  openModal(
    '<div class="modal-header"><div class="modal-title">Pause VA Connection</div>' +
      '<button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>' +
    '<div class="modal-body">' +
      '<div class="form-group">' +
        '<label class="form-label">Effective Pause Date <span class="required">*</span></label>' +
        '<input class="form-input" type="date" id="vaPauseDateInput" value="'+todayStr+'" />' +
        '<div class="form-hint">The date the VA\'s work was paused — can be backdated if needed.</div>' +
      '</div>' +
      '<div id="vaPauseErr" style="color:var(--danger);font-size:12.5px;margin-top:4px;"></div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-warning" id="vaPauseConfirmBtn" data-cid="'+_esc(connectionId)+'" onclick="vaConnConfirmPause(this.dataset.cid)">Pause Connection</button>' +
    '</div>'
  );
}

function vaConnConfirmPause(connectionId) {
  var dateVal = ((document.getElementById('vaPauseDateInput')||{}).value||'').trim();
  var errEl   = document.getElementById('vaPauseErr');
  if (!dateVal) { if (errEl) errEl.textContent = 'Pause date is required.'; return; }
  if (errEl) errEl.textContent = '';
  var btn = document.getElementById('vaPauseConfirmBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Pausing…'; }
  closeModal();
  _vaConnExecutePause(connectionId, dateVal);
}

function _vaConnExecutePause(connectionId, pauseDate) {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { showToast((res && res.error) || 'Failed.', 'error'); return; }
      showToast('Connection ' + res.newStatus + '.', 'success');

      // Reload the connections list immediately
      var activeTab = document.querySelector('#vaConnStatusTabs .req-type-tab.active');
      vaConnLoadAll();

      // Only offer the escalate-to-Terminate follow-up when we just PAUSED
      // (not resumed) and this was the last Started connection for the
      // account and/or customer — which the backend has already
      // auto-Paused as the safe default (see _checkAndCascadeLastActiveConnection).
      if (res.newStatus !== 'Paused') return;
      if (!res.clientPaused && !res.customerPaused) return;

      _vaConnOfferCascadeEscalate(res.clientId, res.customerId, res.clientPaused, res.customerPaused);
    })
    .withFailureHandler(function(err) { showToast(err.message, 'error'); })
    .pauseVAConn(connectionId, pauseDate);
}

// Shown after a connection action auto-pauses the account and/or customer
// (they had no other active VA left) — the pause already happened; this is
// only offering the OPTIONAL escalation to fully Terminate instead, since
// Terminate is the bigger, less-reversible step and shouldn't happen
// without an explicit choice. Closing/skipping just leaves it Paused.
function _vaConnOfferCascadeEscalate(clientId, customerId, clientPaused, customerPaused) {
  var lines = [];
  if (clientPaused)   lines.push('This was the <strong>last active VA</strong> for this account — it has been automatically <strong>Paused</strong>.');
  if (customerPaused) lines.push('This was the <strong>last active VA</strong> for this customer — it has been automatically <strong>Paused</strong>.');

  document.getElementById('modalBox').style.maxWidth = '500px';
  openModal(
    '<div class="modal-header"><div class="modal-title">Account/Customer Paused</div>' +
      '<button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>' +
    '<div class="modal-body">' +
      '<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:var(--radius-md);padding:12px 14px;margin-bottom:14px;font-size:13px;color:#78350f;">' +
        lines.join('<br>') +
      '</div>' +
      '<div style="font-size:13px;color:var(--text-secondary);">If this is permanent rather than temporary, you can Terminate instead — otherwise Paused is fine as-is.</div>' +

// Offers a genuine choice (Pause or Terminate) for the account/customer
// when the connection just terminated was the last active one — per the
// request, unlike the Paused case above (which already auto-pauses and
// only offers an upgrade), Terminated doesn't act automatically at all.
function _vaConnOfferPauseOrTerminateChoice(clientId, customerId, isLastForClient, isLastForCustomer) {
  var lines = [];
  if (isLastForClient)   lines.push('This was the <strong>last active VA</strong> for this account.');
  if (isLastForCustomer) lines.push('This was the <strong>last active VA</strong> for this customer.');

  document.getElementById('modalBox').style.maxWidth = '500px';
  openModal(
    '<div class="modal-header"><div class="modal-title">Update Account/Customer Status?</div>' +
      '<button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>' +
    '<div class="modal-body">' +
      '<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:var(--radius-md);padding:12px 14px;margin-bottom:14px;font-size:13px;color:#78350f;">' +
        lines.join('<br>') +
      '</div>' +
      '<div style="font-size:13px;color:var(--text-secondary);">Would you like to Pause or Terminate the affected account/customer as well? You can also leave them as-is for now.</div>' +
      '<div id="vaConnChoiceErr" style="color:var(--danger);font-size:12.5px;margin-top:8px;"></div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Leave As-Is</button>' +
      '<button class="btn btn-secondary" data-cid="'+_esc(clientId)+'" data-cuid="'+_esc(customerId)+'" data-lc="'+isLastForClient+'" data-lcu="'+isLastForCustomer+'" onclick="_vaConnApplyChoice(this,\'Paused\')">Pause</button>' +
      '<button class="btn btn-danger" data-cid="'+_esc(clientId)+'" data-cuid="'+_esc(customerId)+'" data-lc="'+isLastForClient+'" data-lcu="'+isLastForCustomer+'" onclick="_vaConnApplyChoice(this,\'Terminated\')">Terminate</button>' +
    '</div>'
  );
}
function _vaConnApplyChoice(btn, targetStatus) {
  var clientId = btn.dataset.cid, customerId = btn.dataset.cuid;
  var doClient = btn.dataset.lc === 'true', doCustomer = btn.dataset.lcu === 'true';
  var errEl = document.getElementById('vaConnChoiceErr');
  var buttons = btn.closest('.modal-footer').querySelectorAll('button');
  buttons.forEach(function(b){ b.disabled = true; });
  var todayStr = _todayStr();

  var tasks = [];
  if (doClient && clientId) tasks.push({ fn: 'updateClient', id: clientId });
  if (doCustomer && customerId) tasks.push({ fn: 'updateCustomer', id: customerId });
  if (!tasks.length) { closeModal(); return; }

  var remaining = tasks.length, errors = [];
  tasks.forEach(function(task) {
    var payload = { status: targetStatus, statusDate: todayStr };
    var handlers = google.script.run.withSuccessHandler(done).withFailureHandler(failed);
    if (task.fn === 'updateClient') handlers.updateClient(task.id, payload);
    else handlers.updateCustomer(task.id, payload);
  });
  function done(res) {
    if (!res || !res.success) errors.push((res&&res.error)||'Failed.');
    remaining--;
    if (remaining <= 0) finish();
  }
  function failed(err) { errors.push(err.message); remaining--; if (remaining <= 0) finish(); }
  function finish() {
    if (errors.length) { if (errEl) errEl.textContent = errors.join(' '); buttons.forEach(function(b){ b.disabled = false; }); return; }
    closeModal();
    showToast('Account/customer set to ' + targetStatus + '.', 'success');
  }
}

function vaConnDoCascadeTerminate(clientId, customerId, doClient, doCustomer, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  var errEl = document.getElementById('vaConnCascadeErr');
  var todayStr = _todayStr();

  var tasks = [];
  if (doClient  && clientId)   tasks.push({ fn: 'updateClient',   id: clientId });
  if (doCustomer && customerId) tasks.push({ fn: 'updateCustomer', id: customerId });
  if (!tasks.length) { closeModal(); return; }

  var remaining = tasks.length, errors = [];
  tasks.forEach(function(task) {
    var payload = { status: 'Terminated', statusDate: todayStr };
    var call = task.fn === 'updateClient'
      ? google.script.run.withSuccessHandler(done).withFailureHandler(failed).updateClient(task.id, payload)
      : google.script.run.withSuccessHandler(done).withFailureHandler(failed).updateCustomer(task.id, payload);
  });
  function done(res) {
    remaining--;
    if (!res || !res.success) errors.push((res && res.error) || 'Failed.');
    if (remaining === 0) finish();
  }
  function failed(err) {
    remaining--;
    errors.push(err.message);
    if (remaining === 0) finish();
  }
  function finish() {
    if (errors.length) {
      if (errEl) errEl.textContent = errors.join(' ');
      if (btn) { btn.disabled = false; btn.textContent = 'Terminate Instead'; }
      return;
    }
    closeModal();
    showToast('Terminated.', 'success');
  }
}

function _visScheduleTypeChanged(val) {
  var phWrap = document.getElementById('f_visPhTimeWrap');
  var dailyWrap = document.getElementById('f_visDailyWrap');
  var projWrap = document.getElementById('f_visProjectHoursWrap');
  var monthlyWrap = document.getElementById('f_visMonthlyHoursWrap');
  var isFixed = (val === 'Weekly Fixed' || val === 'Daily Fixed');

  if (dailyWrap) dailyWrap.style.display = isDayBased ? '' : 'none';
  if (projWrap) projWrap.style.display = (val === 'Project-based') ? '' : 'none';
  if (monthlyWrap) monthlyWrap.style.display = (val === 'Monthly') ? '' : 'none';
  if (isDayBased) dailyHoursSetAverageMode('visDaily', isWeekly ? 'weeklyTotal' : 'daily');
}
function vaConnDoSetInitialSchedule(connectionId) {
  var errEl = document.getElementById('visErr');
  var schedType = (document.getElementById('f_visSchedType')||{}).value || '';
  if (!schedType) { if(errEl) errEl.textContent = 'Schedule Type is required.'; return; }

  var newHours = '', hoursType = '', breakdown = '', phWorkTime = '';
  var isFixed = (schedType === 'Weekly Fixed' || schedType === 'Daily Fixed');
  var isDayBased = (schedType === 'Weekly Fixed' || schedType === 'Weekly Flexible' || schedType === 'Daily Fixed' || schedType === 'Daily Flexible');
  if (schedType === 'Project-based') {
    hoursType = 'Project Based';
    newHours = (document.getElementById('f_visProjectHours')||{}).value || '';
    if (!newHours) { if(errEl) errEl.textContent = 'Initial Hours is required.'; return; }
  } else if (schedType === 'Monthly') {
    hoursType = 'Monthly';
    newHours = (document.getElementById('f_visMonthlyHours')||{}).value || '';
    if (!newHours) { if(errEl) errEl.textContent = 'Monthly Hours is required.'; return; }
  } else if (isDayBased) {
    hoursType = 'Daily';
    var collected = dailyHoursCollectBreakdown('visDaily');
    if (!collected.length) { if(errEl) errEl.textContent = "Enter at least one day's hours."; return; }
    newHours = dailyHoursWeeklyTotal('visDaily');
    breakdown = JSON.stringify(collected);
    if (isFixed) {
      phWorkTime = ((document.getElementById('f_visPhWorkTime')||{}).value||'').trim();
      if (!phWorkTime) { if(errEl) errEl.textContent = 'Required Working Time (Client\'s Time) is required for a '+schedType+' schedule.'; return; }
    }
  }
  var derivedPHTime = ((document.getElementById('f_visPhDerivedPHTime')||{}).value||'').trim();

  var btn = document.getElementById('visSubmitBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { if(errEl) errEl.textContent = (res&&res.error)||'Failed.'; if(btn){btn.disabled=false;btn.textContent='Save';} return; }
      closeModal();
      showToast('Initial schedule set.', 'success');
      var wasRequired = window._visRequiredMode;
      window._visRequiredMode = false;
      if (_pbWizardIsActuallyActive()) {
        setTimeout(function(){ _pbWizardGoToStep(_pbWizard.stepIndex + 1); }, 150);
      } else if (wasRequired) { navigate('va-requests'); }
      else _vaConnLoadHoursSummary(connectionId, hoursType);
    })
    .withFailureHandler(function(err) { if(errEl) errEl.textContent = err.message; if(btn){btn.disabled=false;btn.textContent='Save';} })
    .applyVAConnectionHoursChange({
      connectionId: connectionId,
      changeType: 'Initial Assignment',
      newHours: newHours,
      newHoursType: hoursType,
      newScheduleBreakdown: breakdown,
      requiredClientTime: phWorkTime,
      requiredPHTime: derivedPHTime,
      effectiveDate: (document.getElementById('f_visEffDate')||{}).value || '',
      notes: ((document.getElementById('f_visNotes')||{}).value||'').trim()
    });
}

// weekly/cutoff/monthly totals.
// VA start date plus every hours/schedule change since, per the
// request — same colored-dot visual pattern already used by the Audit
// module's Status Timeline, reusing the same hours-log data already
// fetched for Edit Schedule elsewhere in this file.
function _vaConnLoadTimeline(connectionId, actualStartDate, terminationDate, terminationReason) {
  var el = document.getElementById('vaConnTimeline'); if (!el) return;
  google.script.run
    .withSuccessHandler(function(res) {
      var el2 = document.getElementById('vaConnTimeline'); if (!el2) return; // modal may have closed already
      if (!res || !res.success) { el2.innerHTML = '<span style="font-style:italic;">Could not load.</span>'; return; }
      var entries = (res.data || []).filter(function(l){ return l.connectionId === connectionId; });
      entries.sort(function(a,b){ return new Date(a.effectiveDate||a.createdAt||0) - new Date(b.effectiveDate||b.createdAt||0); });

      var TYPE_COLORS = { 'Initial Assignment': '#10b981', 'Limited Period': '#f59e0b' };
      var events = [];
      if (actualStartDate) {
        events.push({ label: 'VA Started', date: actualStartDate, color: '#10b981', desc: '' });
      }
      entries.forEach(function(entry) {
        // Initial Assignment is already represented by "VA Started" above
        // — showing it again here would just duplicate the same moment.
        if (entry.changeType === 'Initial Assignment') return;
        var descParts = [];
        if (entry.newScheduleType) descParts.push(entry.newScheduleType);
        if (entry.newHours) descParts.push(entry.newHours + 'h' + (entry.newScheduleType ? '' : (entry.newHoursType ? ' (' + entry.newHoursType + ')' : '')));
        events.push({
          label: entry.changeType || 'Schedule Change',
          date: entry.effectiveDate || entry.createdAt,
          color: TYPE_COLORS[entry.changeType] || '#3b82f6',
          desc: descParts.join(' · ')
        });
      });
      // Real bug fixed here: Terminated was never included as a Timeline
      // event at all — the connection's own terminationDate is already
      // shown correctly in the Dates panel right above this, but this
      // function was never given it, so no amount of correct data could
      // ever make it appear here. Included now, with the reason as its
      // description when one was recorded.
      if (terminationDate) {
        events.push({ label: 'Terminated', date: terminationDate, color: '#ef4444', desc: terminationReason || '' });
      }
      // Combined "VA Started" + log entries + "Terminated" aren't
      // guaranteed to already be in date order once merged — sort once,
      // here, rather than relying on push order.
      events.sort(function(a,b){ return new Date(a.date||0) - new Date(b.date||0); });

      if (!events.length) { el2.innerHTML = '<span style="font-style:italic;">No history yet.</span>'; return; }
      el2.innerHTML = events.map(function(ev) {
        return '<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-light);">' +
          '<div style="width:8px;height:8px;border-radius:50%;background:' + ev.color + ';margin-top:4px;flex-shrink:0;"></div>' +
          '<div style="flex:1;min-width:0;">' +
            '<div style="font-weight:700;font-size:12px;color:' + ev.color + ';">' + _esc(ev.label) + '</div>' +
            '<div style="font-size:11px;color:var(--text-muted);">' + _fdate(ev.date) + '</div>' +
            (ev.desc ? '<div style="font-size:11.5px;color:var(--text-secondary);margin-top:2px;">' + _esc(ev.desc) + '</div>' : '') +
          '</div>' +
        '</div>';
      }).join('');
    })
    .withFailureHandler(function() {
      var el3 = document.getElementById('vaConnTimeline'); if (el3) el3.innerHTML = '<span style="font-style:italic;">Could not load.</span>';
    })
    .getAllVAConnectionHoursLogs();
}

// ── Set/edit the HR-only Rate on a VA Connection ────────────────────────
// Corrects the VA connection's current hours directly, per the request —
// distinct from "Add Hours / Schedule Change," which records a new
// schedule transition with its own effective date. This instead finds
// the most recent hours-log entry and edits it in place, reusing the
// exact same "Edit Change Entry" modal/save logic already built for the
// Hours & Schedule page (hscOpenEditLogEntry etc.), which depend on the
// global _hscAllLogs array — populated here for that reuse to work from
// this different entry point.
// Converts a stored "8:00 AM"/"5:00 PM"-style time string to the strict
// 24-hour "HH:MM" an <input type="time"> requires to pre-fill at all —
// without this, the browser silently ignores the invalid 12-hour value.
function _esPhTimeTo24h(timeStr) {
  var m = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec((timeStr||'').trim());
  if (!m) return '';
  var h = parseInt(m[1], 10) % 12;
  if (/PM/i.test(m[3])) h += 12;
  return (h < 10 ? '0' : '') + h + ':' + m[2];
}

function _vaConnDoEditSchedule(logId, connectionId) {
  var errEl = document.getElementById('esEditErr');
  var btn = document.getElementById('esSaveBtn');
  var schedTypeEl = document.getElementById('f_esSchedType');
  var payload = {
    effectiveDate: (document.getElementById('f_esEffDate')||{}).value || '',
    notes: ((document.getElementById('f_esNotes')||{}).value || '').trim()
  };

  // Limited Period entries only ever send effectiveDate/notes above —
  // schedule fields aren't rendered for them at all, matching the same
  // restriction updateHoursLogEntry itself enforces.
  if (schedTypeEl) {
    var schedType = schedTypeEl.value || '';
    if (!schedType) { if(errEl) errEl.textContent = 'Schedule Type is required.'; return; }
    var isFixed = (schedType === 'Weekly Fixed' || schedType === 'Daily Fixed');
    var isDayBased = (schedType === 'Weekly Fixed' || schedType === 'Weekly Flexible' || schedType === 'Daily Fixed' || schedType === 'Daily Flexible');
    payload.newScheduleType = schedType;

    if (schedType === 'Project-based') {
      payload.newHoursType = 'Project Based';
      payload.newHours = (document.getElementById('f_esProjectHours')||{}).value || '';
      if (!payload.newHours) { if(errEl) errEl.textContent = 'Hours is required.'; return; }
    } else if (schedType === 'Monthly') {
      payload.newHoursType = 'Monthly';
      payload.newHours = (document.getElementById('f_esMonthlyHours')||{}).value || '';
      if (!payload.newHours) { if(errEl) errEl.textContent = 'Monthly Hours is required.'; return; }
    } else if (isDayBased) {
      payload.newHoursType = 'Daily';
      var collected = dailyHoursCollectBreakdown('esDaily');
      if (!collected.length) { if(errEl) errEl.textContent = "Enter at least one day's hours."; return; }
      payload.newHours = dailyHoursWeeklyTotal('esDaily');
      payload.newScheduleBreakdown = JSON.stringify(collected);
      if (isFixed) {
        payload.requiredClientTime = ((document.getElementById('f_esPhWorkTime')||{}).value||'').trim();
        payload.requiredPHTime = ((document.getElementById('f_esPhDerivedPHTime')||{}).value||'').trim();
        if (!payload.requiredClientTime) { if(errEl) errEl.textContent = 'Required Working Time (Client\'s Time) is required for a '+schedType+' schedule.'; return; }
      }
    }
  }

  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  if (errEl) errEl.textContent = '';
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { if(errEl) errEl.textContent = (res&&res.error)||'Failed.'; if(btn){btn.disabled=false;btn.textContent='Save';} return; }
      showToast('Schedule updated.', 'success');
      closeStackedModal();
      // The View Connection modal underneath never closed — refresh its
      // content in place so the updated schedule shows immediately,
      // rather than leaving it showing what's now stale data.
      vaConnOpenModal(connectionId);
    })
    .withFailureHandler(function(err) { if(errEl) errEl.textContent = err.message; if(btn){btn.disabled=false;btn.textContent='Save';} })

function vaConnDoSetRate(connectionId, btn) {

function vaConnOpenTerminate(connectionId, vaName, reqBy, reqDate, reqReason, pausedDate) {

            '<input type="radio" name="vaConnEndResult" value="Terminated" checked style="margin-top:3px;accent-color:var(--accent);" />' +
            '<div><span class="badge badge-terminated" style="font-size:11px;">Terminated</span><div style="font-size:11.5px;color:var(--text-muted);margin-top:3px;">The VA had actually started working on this account.</div></div>' +
          '</label>' +
          '<label style="flex:1;display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-md);cursor:pointer;">' +
            '<input type="radio" name="vaConnEndResult" value="Cancelled" style="margin-top:3px;accent-color:var(--accent);" />' +
            '<div><span class="badge badge-inactive" style="font-size:11px;">Cancelled</span><div style="font-size:11.5px;color:var(--text-muted);margin-top:3px;">This connection never actually got underway.</div></div>' +
          '</label>' +
        '</div>' +
      '</div>' +
      '<div class="form-row">' +
        '<div class="form-group"><label class="form-label">Effective Date</label>' +
          '<input class="form-input" type="date" id="f_vaConnTermDate" max="'+_todayStr()+'" value="'+defaultDate+'" /></div>' +
        '<div class="form-group"><label class="form-label">Reason <span class="required">*</span></label>' +
          '<select class="form-select" id="f_vaConnReason"><option value="">Select reason…</option>'+reasonOpts+'</select></div>' +
      '</div>' +
      '<div class="form-group"><label class="form-label">Notes</label>' +
        '<textarea class="form-textarea" id="f_vaConnNotes" style="min-height:56px;" placeholder="Additional context…">'+_esc(reqReason||'')+'</textarea></div>' +
      '<div id="vaConnTermErr" style="color:var(--danger);font-size:12.5px;"></div>' +
    '</div>' +

      '<button class="btn btn-secondary" onclick="_vaConnCancelTerminate()">Cancel</button>' +

    '</div>'
  );
}

// Cancelling out of Terminate (X or Cancel) — if this modal was opened from
// the post-Replacement "End service now?" prompt, land on the new request
// instead of just closing to a blank background; otherwise behave exactly
// like a normal close.
function _vaConnCancelTerminate() {
  var postReqId = window._reqPostTerminateRequestId || '';
  window._reqPostTerminateRequestId = '';
  closeModal();
  if (postReqId) navigate('va-request-profile', postReqId);
}

function vaConnDoTerminate(connectionId) {
  var dateVal   = (document.getElementById('f_vaConnTermDate')  || {}).value || '';
  var reason    = (document.getElementById('f_vaConnReason')    || {}).value || '';
  var notes     = ((document.getElementById('f_vaConnNotes')    || {}).value || '').trim();
  var resultChoice = (document.querySelector('input[name="vaConnEndResult"]:checked') || {}).value || '';
  var errEl = document.getElementById('vaConnTermErr');
  if (!reason) { if (errEl) errEl.textContent = 'A reason for termination is required.'; return; }
  var fullReason = [reason, notes].filter(Boolean).join(' — ');
  closeModal();
  // If this termination was triggered from the "Replacement request filed —
  // end service now?" prompt, land on the new request afterward instead of
  // just refreshing whichever Connections tab happened to be open.
  var postReqId = window._reqPostTerminateRequestId || '';
  window._reqPostTerminateRequestId = '';
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { showToast((res && res.error) || 'Failed.', 'error'); return; }
      if (res.requiresApproval) {
        showToast('Termination requested — pending approval from the CS Assigned.', 'success');
        if (postReqId) { navigate('va-request-profile', postReqId); return; }
        var activeTabPending = document.querySelector('#vaConnStatusTabs .req-type-tab.active');
        vaConnLoadAll();
        return;
      }
      showToast('VA connection ' + (res.newStatus === 'Terminated' ? 'terminated' : 'cancelled') + '.', 'success');
      if (postReqId) { navigate('va-request-profile', postReqId); return; }
      // Refresh the active tab
      var activeTab = document.querySelector('#vaConnStatusTabs .req-type-tab.active');
      var status = activeTab ? activeTab.dataset.connstatus : 'Started';
      vaConnLoadAll();

      if (res.clientPaused || res.customerPaused) {
        _vaConnOfferCascadeEscalate(res.clientId, res.customerId, res.clientPaused, res.customerPaused);
      } else if (res.offerChoice) {
        _vaConnOfferPauseOrTerminateChoice(res.clientId, res.customerId, res.isLastForClient, res.isLastForCustomer);
      }
    })
    .withFailureHandler(function(err) { showToast(err.message, 'error'); })
    .terminateVAConn(connectionId, dateVal, fullReason, '', resultChoice);
}

var _vaRatesAll = [], _vaRatesTab = 'needsRate';

      '</div>';

      '<div class="flex items-center justify-between mb-4">' +
        '<div style="font-size:13px;color:var(--text-muted);">VA Connections that need a rate assigned, and the full list of all VA Connections</div>' +

    '</div>';

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) {
        var b = document.getElementById('vaRatesBody');
        if (b) b.innerHTML = '<div class="empty-state"><h3>Error</h3><p>' + _esc((res && res.error) || 'Failed.') + '</p></div>';
        return;
      }
      _vaRatesAll = res.data || [];

    })

                  ((CMS.user && (CMS.user.role === 'Accounting' || CMS.user.role === 'Administrator')) ? '<div style="margin-top:3px;"><button class="btn btn-primary btn-sm" style="font-size:10.5px;padding:2px 8px;" data-cid="'+_esc(c.connectionId)+'" onclick="vaRatesConfirmRA(this.dataset.cid)">Confirm RA</button></div>' : '')
                : '<span style="color:var(--text-muted);font-size:11.5px;">Not sent yet</span>');
        var tbCell = c.trainingBondApplicable
          ? '<span style="font-weight:600;">'+(c.trainingBondAmount?_esc(c.trainingBondAmount):'—')+'</span>'+(c.trainingBondMonths?'<div style="font-size:10.5px;color:var(--text-muted);">'+_esc(c.trainingBondMonths)+' mo</div>':'')
          : '<span style="color:var(--text-muted);">—</span>';

        return '<tr>' +
          '<td><a href="#" data-cid="'+_esc(c.connectionId)+'" onclick="vaConnOpenModal(this.dataset.cid);return false;" style="color:var(--accent);font-weight:600;">'+_esc(c.vaName||'—')+'</a></td>' +
          '<td><div style="font-weight:600;">'+_esc(c.customerName||'—')+'</div>'+(c.accountName?'<div style="font-size:11.5px;color:var(--text-muted);">'+_esc(c.accountName)+'</div>':'')+'</td>' +

          '<td><span class="badge '+stClass+'">'+_esc(c.connectionStatus||'—')+'</span></td>' +

  body.innerHTML =
    '<div class="section-card">' +
      '<div class="section-header">' +
        '<div>' +

function vaCompDoImport() {
  var fileInput = document.getElementById('f_compCsvFile');
  var errEl = document.getElementById('vaCompImportErr');
  if (!fileInput || !fileInput.files || !fileInput.files.length) { if (errEl) errEl.textContent = 'Please choose a CSV file.'; return; }
  var btn = document.getElementById('vaCompImportBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Importing…'; }
  var reader = new FileReader();
  reader.onload = function(e) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) { if (errEl) errEl.textContent = (res&&res.error)||'Failed.'; if (btn) { btn.disabled=false; btn.textContent='Import'; } return; }
        var msg = 'Imported ' + res.imported + ' row(s).';
        if (res.errors && res.errors.length) msg += ' ' + res.errors.length + ' row(s) had errors — check Activity Logs.';
        showToast(msg, res.errors && res.errors.length ? 'info' : 'success');
        vaCompOpenModal(window._vaCompConnId, window._vaCompVaName);
      })
      .withFailureHandler(function(err) { if (errEl) errEl.textContent = err.message; if (btn) { btn.disabled=false; btn.textContent='Import'; } })
      .importCompHistoryCSV(e.target.result);
  };
  reader.readAsText(fileInput.files[0]);
}

  var q    = ((document.getElementById('vaDbSearch')      || {}).value || '').toLowerCase();
  var dept = ((document.getElementById('vaDbDeptFilter')  || {}).value || '');
  var stat = ((document.getElementById('vaDbStatusFilter')|| {}).value || '');
  _vaFiltered = _vaAll.filter(function (r) {
    var mQ = !q    || [(r.vaName||''), (r.email||''), (r.service||'')].some(function (v) { return v.toLowerCase().includes(q); });
    var mD = !dept || r.department === dept;
    var mS = !stat || r.status     === stat;
    return mQ && mD && mS;
  });
  _vaFiltered.sort(function (a, b) {
    var va = String(a[_vaSortField]||'').toLowerCase(), vb = String(b[_vaSortField]||'').toLowerCase();
    return _vaSortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
  });
  _vaPageNum = 1;
  vaDbRender();
}

function vaDbRender() {
  var tbody = document.getElementById('vaDbTbody'); if (!tbody) return;
  var start = (_vaPageNum-1)*_vaPageSize, rows = _vaFiltered.slice(start, start+_vaPageSize);
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><h3>No VAs found</h3><p>Add VAs to the database.</p></div></td></tr>';
  } else {
    tbody.innerHTML = rows.map(function (r) {
      var stClass = r.status === 'Active' ? 'badge-active' : (r.status === 'On Leave' ? 'badge-returning' : 'badge-inactive');
      return '<tr style="cursor:pointer;" data-vid="'+_esc(r.vaId)+'" onclick="vaDbOpenProfile(this.dataset.vid)">' +
        '<td><div style="font-weight:600;color:var(--accent);">' + _esc(r.vaName) + '</div>' +
          (r.email ? '<div style="font-size:11.5px;color:var(--text-muted);">' + _esc(r.email) + '</div>' : '') + '</td>' +
        '<td>' + _esc(r.department || '—') + '</td>' +
        '<td style="font-size:12px;color:var(--text-secondary);">' + _esc(r.service || '—') + '</td>' +
        '<td class="muted">' + (r.birthday ? _fdate(r.birthday) : '—') + '</td>' +
        '<td><span class="badge ' + stClass + '">' + _esc(r.status || '—') + '</span></td>' +
        '<td onclick="event.stopPropagation();"><div class="flex gap-2">' +
          '<button class="btn btn-ghost btn-icon" data-vid="'+_esc(r.vaId)+'" onclick="vaDbOpenEdit(this.dataset.vid)">' + _svgEdit() + '</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }
  // Pager
  var el = document.getElementById('vaDbPager'); if (!el) return;
  var total = _vaFiltered.length, pages = Math.max(1, Math.ceil(total/_vaPageSize));
  var s = (_vaPageNum-1)*_vaPageSize+1, e = Math.min(_vaPageNum*_vaPageSize, total);
  var btns = '';
  for (var pg=1;pg<=pages;pg++) {
    if (pg===1||pg===pages||Math.abs(pg-_vaPageNum)<=1) btns += '<button class="page-btn'+(pg===_vaPageNum?' active':'')+'" onclick="vaDbGoPage('+pg+')">'+pg+'</button>';
    else if (Math.abs(pg-_vaPageNum)===2) btns += '<span style="padding:0 4px;color:var(--text-muted)">…</span>';
  }
  el.innerHTML = '<span>Showing '+(total?s:0)+'–'+e+' of '+total+'</span>' +
    '<div class="page-btns"><button class="page-btn" onclick="vaDbGoPage('+(_vaPageNum-1)+')"'+(_vaPageNum===1?' disabled':'')+'>‹</button>'+btns+'<button class="page-btn" onclick="vaDbGoPage('+(_vaPageNum+1)+')"'+(_vaPageNum>=pages?' disabled':'')+'>›</button></div>';
}

function vaDbSort(f)       { _vaSortField===f?_vaSortAsc=!_vaSortAsc:(_vaSortField=f,_vaSortAsc=true); vaDbApplyFilters(); }
function vaDbGoPage(pg)    { var max=Math.max(1,Math.ceil(_vaFiltered.length/_vaPageSize)); if(pg>=1&&pg<=max){_vaPageNum=pg;vaDbRender();} }
function vaDbSetPageSize(v){ _vaPageSize=parseInt(v)||10; _vaPageNum=1; vaDbRender(); }

function vaDbSubmit(id) {
  var nameVal = ((document.getElementById('f_vaName')||{}).value||'').trim();
  var errEl = document.getElementById('vaDbFormErr');
  if (!nameVal) { if(errEl) errEl.textContent='VA Name is required.'; return; }
  if (errEl) errEl.textContent='';
  var btn = document.getElementById('vaDbSubmitBtn');
  if (btn) { btn.disabled=true; btn.textContent='Saving…'; }
  var payload = {
    vaName:     nameVal,
    email:      ((document.getElementById('f_vaEmail')  ||{}).value||'').trim(),
    department: (document.getElementById('f_vaDept')    ||{}).value||'',
    status:     (document.getElementById('f_vaStatus')  ||{}).value||'Active',
    gender:     (document.getElementById('f_vaGender')  ||{}).value||'',
    service:    ((document.getElementById('f_vaSkills') ||{}).value||'').trim(),
    birthday:   (document.getElementById('f_vaBirthday')||{}).value||'',
    hireDate:   (document.getElementById('f_vaHireDate')||{}).value||'',
    portfolioLink: ((document.getElementById('f_vaPortfolio')||{}).value||'').trim(),
    notes:      (document.getElementById('f_vaNotes')   ||{}).value||''
  };
  // Only present in the DOM for HR/Admin (see rateFieldHtml above) — the
  // server independently ignores this too if the caller isn't authorized,
  // so this is just avoiding sending a field that isn't there.
  var rateEl = document.getElementById('f_vaBaseRate');
  if (rateEl) payload.baseRate = rateEl.value;
  function onDone(res) {
    if(!res||!res.success){ if(errEl)errEl.textContent=(res&&res.errors?res.errors.join(' '):(res&&res.error)||'Failed.'); if(btn){btn.disabled=false;btn.textContent=id?'Save Changes':'Add VA';} return; }
    closeModal(); showToast('VA saved.','success');
    google.script.run.withSuccessHandler(function(r){ if(r&&r.success){_vaAll=r.data||[];vaDbApplyFilters();} }).getVAList({});
  }
  function onFail(err){ showToast(err.message,'error'); if(btn){btn.disabled=false;btn.textContent='Save';} }
  if (id) google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).updateVA(id, payload);
  else    google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).createVA(payload);
}

function _loadReqList() {
