function hscFilterConnectionsTable() {
  var currentStatusFilter = document.getElementById('hscConnStatusFilter')
    ? document.getElementById('hscConnStatusFilter').value
    : HSC_STATUS_FILTER_DEFAULT;
  var currentDeptFilter = (document.getElementById('hscConnDeptFilter')||{}).value || '';
  var currentHrsTypeFilter = (document.getElementById('hscConnHrsTypeFilter')||{}).value || '';
  var currentSearch = ((document.getElementById('hscConnSearch')||{}).value||'');

  var q = currentSearch.toLowerCase();
  var list = _hscConns.filter(function(c){
    var matchQ = !q || [(c.vaName||''),(c.customerName||''),(c.accountName||c.companyName||'')].some(function(v){ return v.toLowerCase().indexOf(q) !== -1; });
    var matchStatus = !currentStatusFilter || c.connectionStatus === currentStatusFilter;
    var matchDept = !currentDeptFilter || c.department === currentDeptFilter;
    // "Regular" = everything that ISN'T Project Based — matches the latest
    // logged hours type where available, same source the table itself uses,
    // not the (possibly stale) cached HoursType on the connection record.
    var latestForFilter = _hscLatestLogEntryFor(c.connectionId);
    var effectiveHrsType = latestForFilter ? latestForFilter.newHoursType : c.hoursType;
    var isProjectBased = effectiveHrsType === 'Project Based';
    var matchHrsType = !currentHrsTypeFilter || (currentHrsTypeFilter === 'Project Based' ? isProjectBased : !isProjectBased);
    return matchQ && matchStatus && matchDept && matchHrsType;
  });

  var rowsHtml = list.length ? list.map(function(c) {
    // Sourced from VAConnectionHoursLog (the latest entry that actually
    // defines a schedule), not from VAConnections' own Hours/HoursType
    // columns — those can drift out of sync once changes start getting
    // logged, so the log is treated as the source of truth here.
    var latest = _hscLatestLogEntryFor(c.connectionId);
    var hours = latest ? latest.newHours : c.hours;
    var hoursType = latest ? latest.newHoursType : c.hoursType;
    var breakdownRaw = latest ? latest.newScheduleBreakdown : c.hoursBreakdown;
    var breakdown = null;
    try { breakdown = JSON.parse(breakdownRaw||'[]'); } catch(e) { breakdown = null; }
    var scheduleCell = _hscDayChipsHtml(breakdown, hoursType);
    var stCls = {Pending:'badge-inactive',Accepted:'badge-returning',Declined:'badge-terminated',Started:'badge-active',Cancelled:'badge-inactive',Terminated:'badge-terminated'}[c.connectionStatus]||'badge-inactive';
    var hasSchedule = !!latest;
    var actionCell = hasSchedule
      ? '<button class="btn btn-ghost btn-sm" style="font-size:11px;" data-cid="'+_esc(c.connectionId)+'" onclick="event.stopPropagation();hscOpenAddModal(this.dataset.cid)">Add Change</button>'
      : '<button class="btn btn-primary btn-sm" style="font-size:11px;" data-cid="'+_esc(c.connectionId)+'" onclick="event.stopPropagation();vaConnOpenSetInitialSchedule(this.dataset.cid,false,\''+_esc(c.vaName)+'\')">Set Initial Assignment</button>';
    return '<tr style="cursor:pointer;" data-cid="'+_esc(c.connectionId)+'" onclick="hscOpenLogDetail(this.dataset.cid)">' +
      '<td><a href="#" data-cid="'+_esc(c.connectionId)+'" onclick="event.stopPropagation();vaConnOpenModal(this.dataset.cid);return false;" style="color:var(--accent);font-weight:600;">'+_esc(c.vaName)+'</a></td>' +
      '<td style="font-size:12.5px;">'+_esc(c.customerName||'—')+(c.accountName||c.companyName?'<div style="font-size:11px;color:var(--text-muted);">'+_esc(c.accountName||c.companyName)+'</div>':'')+'</td>' +
      '<td><div style="font-weight:600;">'+_esc(c.service||'—')+'</div>'+(c.department?'<div style="font-size:11.5px;color:var(--text-muted);">'+_esc(c.department)+'</div>':'')+'</td>' +
      '<td><span class="badge '+stCls+'">'+_esc(c.connectionStatus||'—')+'</span></td>' +
      '<td class="muted">'+_esc(hoursType||'—')+'</td>' +
      '<td style="font-weight:700;">'+_esc(hours||'0')+'h</td>' +
      '<td>'+scheduleCell+'</td>' +
      '<td onclick="event.stopPropagation()">'+actionCell+'</td>' +
    '</tr>';
  }).join('') : '<tr><td colspan="8"><div class="empty-state" style="padding:24px;"><h3 style="font-size:14px;">No VA Connections found</h3></div></td></tr>';

  document.getElementById('hscConnTableBody').innerHTML = rowsHtml;
}

var _hscAllLogs = [];
var _hscLogPage = 1, _hscLogPageSize = 25;

function hscLoadAllLogs() {
  // Load all connections (for names) and all hours-log entries, each in one
  // call — this used to fetch logs with one separate round-trip PER
  // connection, which is what made this page look permanently stuck
  // loading once there were more than a handful of connections.
  google.script.run
    .withSuccessHandler(function(res) {
      _hscConns = (res && res.success) ? res.data : [];
      var connById = {};
      _hscConns.forEach(function(c){ connById[c.connectionId] = c; });
      google.script.run
        .withSuccessHandler(function(lr) {
          var allLogs = (lr && lr.success) ? lr.data : [];
          allLogs.forEach(function(l) {
            var conn = connById[l.connectionId] || {};
            l._connId   = l.connectionId;
            l._vaName   = conn.vaName || '';
            l._custName = conn.customerName || '';
            l._acctName = conn.accountName || conn.companyName || '';
            l._service    = conn.service || '';
            l._department = conn.department || '';
          });
          allLogs.sort(function(a,b){ return new Date(b.effectiveDate||b.createdAt||0)-new Date(a.effectiveDate||a.createdAt||0); });
          _hscAllLogs = allLogs;
          if (_hscActiveTab === 'conns') hscRenderConnectionsTab();
          else hscRenderTable(_hscChangeLogEntries());
        })
        .withFailureHandler(function(err) {
          var tb = document.getElementById('hscTableBody');
          if (tb) tb.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:24px;color:var(--danger);">'+_esc(err.message)+'</td></tr>';
        })
        .getAllVAConnectionHoursLogs();
    })
    .withFailureHandler(function(err) {
      var tb = document.getElementById('hscTableBody');
      if (tb) tb.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:24px;color:var(--danger);">'+_esc(err.message)+'</td></tr>';
    })
    .getConnectionsForHoursChange({});
}

// Excludes "Initial Assignment" entries from the Change Log display —
// those are the baseline snapshot written when a VA is first assigned, not
// an actual change someone made afterward, so they don't belong in a log of
// changes. Kept in _hscAllLogs itself (unfiltered) since the "All
// Connections" tab still needs them as the starting point for a
// connection's schedule history.
function _hscChangeLogEntries() {
  return _hscAllLogs.filter(function(l){ return l.changeType !== 'Initial Assignment'; });
}

function hscTableFilter() {
  var q    = ((document.getElementById('hscTableSearch')||{}).value||'').toLowerCase();
  var type = ((document.getElementById('hscTypeFilter')||{}).value||'');
  var filtered = _hscChangeLogEntries().filter(function(l) {
    var matchQ = !q || (_esc(l._vaName)+' '+_esc(l._custName)+' '+_esc(l._acctName)+' '+_esc(l.changeType)).toLowerCase().indexOf(q) !== -1;
    var matchT = !type || l.changeType === type;
    return matchQ && matchT;
  });
  _hscLogPage = 1;
  hscRenderTable(filtered);
}

function hscRenderTable(logs) {
  var tb = document.getElementById('hscTableBody'); if (!tb) return;
  if (!logs.length) {
    tb.innerHTML = '<tr><td colspan="13"><div class="empty-state" style="padding:40px;"><h3>No changes logged yet</h3><p>Click <strong>Add Change</strong> to record a hours or schedule change for a VA Connection.</p></div></td></tr>';
    var pg = document.getElementById('hscPager'); if (pg) pg.innerHTML = '';
    return;
  }
  var start = (_hscLogPage-1)*_hscLogPageSize;
  var page  = logs.slice(start, start+_hscLogPageSize);
  tb.innerHTML = page.map(function(l) {
    var isProjHours = l.changeType === 'Project Hours Entry';
    var hoursChange = isProjHours
      ? '<strong>+'+_esc(l.newHours)+'h</strong>'
      : ((l.prevHours||l.newHours) ? (l.prevHours||'?')+' → '+(l.newHours||'?') : '—');
    var ack = l.ackStatus || {};
    var ackDots =
      '<span title="Service Manager" style="opacity:'+(ack.serviceManager?'1':'0.3')+';">SM</span> ' +
      '<span title="HR" style="opacity:'+(ack.hr?'1':'0.3')+';">HR</span> ' +
      '<span title="Accounting" style="opacity:'+(ack.accounting?'1':'0.3')+';">ACC</span>';
    var myAckRole = { 'Service Manager':'serviceManager', 'HR Specialist':'hr', 'HR Manager':'hr', 'Accounting':'accounting' }[CMS.user && CMS.user.role];
    var canAckThis = myAckRole && !ack[myAckRole];
    var ackCell = '<div style="font-size:10.5px;font-weight:700;letter-spacing:.3px;">' + ackDots + '</div>' +
      (l.fullyAcknowledged
        ? '<div style="font-size:10px;color:#15803d;font-weight:700;margin-top:2px;">✓ Fully acknowledged</div>'
        : (canAckThis
            ? '<button class="btn btn-primary btn-sm" style="font-size:10.5px;padding:3px 8px;margin-top:3px;" data-lid="'+_esc(l.logId)+'" onclick="event.stopPropagation();hscOpenAcknowledge(this.dataset.lid)">Acknowledge</button>'
            : '<div style="font-size:10px;color:var(--text-muted);margin-top:2px;">Pending</div>'));
    var isPendingChange = l.applyStatus === 'Pending';
    var isCancelledChange = l.applyStatus === 'Cancelled';
    var canConfirmCancel = CMS.user && (CMS.user.role === 'CS Specialist' || CMS.user.role === 'Administrator');
    var statusCell;
    if (isPendingChange) {
      statusCell = '<span class="badge badge-inactive" style="font-size:10.5px;">Pending</span>' +
        (canConfirmCancel
          ? '<div style="display:flex;gap:4px;margin-top:4px;">' +
              '<button class="btn btn-primary btn-sm" style="font-size:10px;padding:2px 7px;" data-lid="'+_esc(l.logId)+'" onclick="event.stopPropagation();hscOpenConfirmChange(this.dataset.lid)">Confirm</button>' +
              '<button class="btn btn-ghost btn-sm" style="color:var(--danger);font-size:10px;padding:2px 7px;" data-lid="'+_esc(l.logId)+'" onclick="event.stopPropagation();hscOpenCancelChange(this.dataset.lid)">Cancel</button>' +
            '</div>'
          : '<div style="font-size:10px;color:var(--text-muted);margin-top:2px;">Awaiting CS Specialist confirmation</div>');
    } else if (isCancelledChange) {
      statusCell = '<span class="badge badge-terminated" style="font-size:10.5px;">Cancelled</span>' +
        (l.cancelReason ? '<div style="font-size:10px;color:var(--text-muted);margin-top:2px;max-width:140px;overflow:hidden;text-overflow:ellipsis;">'+_esc(l.cancelReason)+'</div>' : '');
    } else {
      statusCell = ackCell;
    }
    var nightDiffBadge = l.nightDiffApplicable
      ? '<span class="badge badge-active" style="font-size:10px;">Applies</span>'
      : '<span class="badge badge-inactive" style="font-size:10px;">No</span>';
    var breaksBadge = l.breaksIncluded
      ? '<span class="badge badge-active" style="font-size:10px;">Included</span>'
      : '<span class="badge badge-inactive" style="font-size:10px;">Excluded</span>';
    return '<tr style="cursor:pointer;" data-cid="'+_esc(l.connectionId)+'" onclick="hscOpenLogDetail(this.dataset.cid)">' +
      '<td class="muted" style="white-space:nowrap;">'+_fdate(l.effectiveDate||l.createdAt)+'</td>' +
      '<td><div style="font-weight:600;">'+_esc(l._vaName||'—')+'</div><div style="font-size:11px;color:var(--text-muted);">'+_esc(l._service||'—')+'</div></td>' +
      '<td><div>'+_esc(l._custName||'—')+'</div><div style="font-size:11px;color:var(--text-muted);">'+_esc(l._acctName||'')+'</div></td>' +
      '<td><span class="badge badge-returning" style="font-size:10.5px;">'+_esc(l.changeType||'—')+'</span></td>' +
      '<td>'+hoursChange+'</td>' +
      '<td class="muted">'+(isProjHours ? '—' : ((l.prevHoursType||l.newHoursType)?(l.prevHoursType||'?')+' → '+(l.newHoursType||'?'):'—'))+'</td>' +
      '<td class="muted">'+(isProjHours ? '—' : ((l.prevConnectionType||l.newConnectionType)?(l.prevConnectionType||'?')+' → '+(l.newConnectionType||'?'):'—'))+'</td>' +
      '<td>'+nightDiffBadge+'</td>' +
      '<td>'+breaksBadge+'</td>' +
      '<td class="muted" style="font-size:12px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+_esc(l.notes||'—')+(l.changeType==='Project Hours Entry'&&l.requestedBy?' <span style="color:var(--text-muted);">('+_esc(l.requestedBy)+'-requested)</span>':'')+'</td>' +
      '<td class="muted" style="font-size:11px;">'+_esc(_cpSpecName(l.loggedBy)||l.loggedBy||'—')+(l.loggedBy&&_cpSpecName(l.loggedBy)?'<div style="font-size:10px;color:var(--text-muted);">'+_esc(l.loggedBy)+'</div>':'')+'</td>' +
      '<td onclick="event.stopPropagation()">'+statusCell+'</td>' +
      '<td onclick="event.stopPropagation()"><button class="btn btn-ghost btn-icon" data-lid="'+_esc(l.logId)+'" data-cid="'+_esc(l.connectionId)+'" onclick="hscOpenEditLogEntry(this.dataset.lid,this.dataset.cid)" title="Edit this entry"><svg width="13" height="13" viewBox="0 0 20 20" fill="none"><path d="M14.5 3.5a1.5 1.5 0 012.12 2.12L6 16.25l-3 1 1-3L14.5 3.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button></td>' +
    '</tr>';
  }).join('');
  // Simple pager
  var pager = document.getElementById('hscPager'); if (!pager) return;
  var pages = Math.ceil(logs.length/_hscLogPageSize);
  if (pages <= 1) { pager.innerHTML = ''; return; }
  var btns = '';
  for (var pg=1;pg<=pages;pg++) {
    btns += '<button class="page-btn'+(pg===_hscLogPage?' active':'')+'" onclick="_hscGoPage('+pg+','+logs.length+')">'+pg+'</button>';
  }
  pager.innerHTML = '<div class="page-btns">'+btns+'</div><span style="font-size:12px;color:var(--text-muted);">Showing '+(start+1)+'–'+Math.min(start+_hscLogPageSize,logs.length)+' of '+logs.length+'</span>';
}

// Shows this connection's FULL hours/schedule history — its schedule as of
// assignment, then every change since, in order — rather than the request
// ticket it originated from (which is a separate, mostly-static record;
// this is about how the CONNECTION's hours have actually evolved).
function hscOpenLogDetail(connectionId) {
  var entries = (_hscAllLogs||[]).filter(function(l){ return l.connectionId === connectionId; });
  if (!entries.length) { showToast('No history found for this connection.', 'error'); return; }
  entries.sort(function(a,b){ return new Date(a.effectiveDate||a.createdAt||0) - new Date(b.effectiveDate||b.createdAt||0); });

  var connInfo = (_hscConns||[]).find(function(c){ return c.connectionId === connectionId; }) || {};

  var vaName = entries[0]._vaName || connInfo.vaName || 'this VA';
  var custName = entries[0]._custName || connInfo.customerName || '';
  var acctName = entries[0]._acctName || connInfo.accountName || connInfo.companyName || '';

  // Current recurring schedule — always computed from the latest entry
  // that actually defines a schedule (Daily/Weekly/Monthly/Project Based
  // as its own base rate), never from a Project Hours Entry, since those
  // are one-off additions on top of whatever the real schedule already
  // is, not a redefinition of it.
  var schedEntries = entries.filter(function(e){ return e.changeType !== 'Project Hours Entry'; });
  var latest = schedEntries[schedEntries.length-1];
  var currentHoursType = latest ? latest.newHoursType : connInfo.hoursType;
  var isCurrentlyProjectBased = String(currentHoursType||'').trim().toLowerCase() === 'project based';

  var currentScheduleHtml;
  if (isCurrentlyProjectBased) {
    currentScheduleHtml =
      '<div style="background:#eff6ff;border:1.5px solid #93c5fd;border-radius:var(--radius-md);padding:14px 16px;margin-bottom:12px;">' +
        '<div style="font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#1e40af;margin-bottom:6px;">Current — Project Based</div>' +
        '<div style="font-size:13px;color:#1e40af;">This connection\'s base schedule is Project Based — hours are tracked separately below, under Project Hours Added.</div>' +
      '</div>';
  } else {
    var latestBreakdown = null;
    try { latestBreakdown = latest && latest.newScheduleBreakdown ? JSON.parse(latest.newScheduleBreakdown) : null; } catch(ex){ latestBreakdown = null; }
    var DAY_ORDER = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    var breakdownChips = latestBreakdown && latestBreakdown.length
      ? latestBreakdown.slice().sort(function(a,b){ return DAY_ORDER.indexOf((a.days||[])[0]) - DAY_ORDER.indexOf((b.days||[])[0]); })
          .map(function(g){ return '<span style="display:inline-block;background:#fff;border-radius:6px;padding:3px 8px;margin:2px;font-size:11.5px;font-weight:600;">'+(g.days||[]).join('/')+': '+g.hoursPerDay+'h</span>'; }).join('')
      : '';
    var unitLabel = currentHoursType === 'Monthly' ? '/month' : '/week';
    currentScheduleHtml =
      '<div style="background:#eff6ff;border:1.5px solid #93c5fd;border-radius:var(--radius-md);padding:14px 16px;margin-bottom:12px;">' +
        '<div style="font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#1e40af;margin-bottom:6px;">Current Schedule'+(currentHoursType?' — '+_esc(currentHoursType):'')+'</div>' +
        '<div style="font-size:24px;font-weight:800;color:#1e40af;">'+(latest?latest.newHours:'—')+'h<span style="font-size:13px;font-weight:600;color:#3b82f6;">'+unitLabel+'</span></div>' +
        (breakdownChips ? '<div style="margin-top:6px;">'+breakdownChips+'</div>' : '') +
      '</div>';
  }

  // Project hours added — a separate, additive running total, shown
  // alongside the current schedule (not instead of it) whenever any
  // Project Hours Entry has actually been logged for this connection.
  var additions = entries.filter(function(e){ return e.changeType === 'Project Hours Entry'; });
  var projectHoursHtml = '';
  if (additions.length) {
    var totalAdded = additions.reduce(function(s,e){ return s + (parseFloat(e.newHours)||0); }, 0);
    projectHoursHtml =
      '<div style="background:#ecfdf5;border:1.5px solid #6ee7b7;border-radius:var(--radius-md);padding:14px 16px;margin-bottom:16px;">' +
        '<div style="font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#047857;margin-bottom:6px;">Project Hours Added</div>' +
        '<div style="font-size:24px;font-weight:800;color:#047857;">+'+totalAdded+'h</div>' +
        '<div style="font-size:12px;color:#065f46;margin-top:2px;">Across '+additions.length+' entr'+(additions.length===1?'y':'ies')+'</div>' +
      '</div>';
  }
  var currentHtml = currentScheduleHtml + projectHoursHtml;

  // Full history — every entry, both schedule changes and project-hours
  // additions, in one combined timeline, most recent first.
  var historyHtml = entries.map(function(e, idx) {
    var isInitial = e.changeType === 'Initial Assignment' || e.changeType === 'Initial Migration';
    var isAddition = e.changeType === 'Project Hours Entry';
    var label = isInitial ? 'Started with' : (isAddition ? 'Additional hours logged' : e.changeType);
    var amount;
    if (isAddition) amount = '+'+(parseFloat(e.newHours)||0)+'h';
    else if (isInitial) amount = (parseFloat(e.newHours)||0)+'h';
    else amount = (e.prevHours || e.newHours) ? (e.prevHours||'?')+'h → '+(e.newHours||'?')+'h' : '';
    var amountColor = isInitial ? 'var(--text-primary)' : (isAddition ? '#059669' : '#2563eb');
    return '<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-light);">' +
      '<div style="width:90px;flex-shrink:0;font-size:11.5px;color:var(--text-muted);">'+_fdate(e.effectiveDate||e.createdAt)+'</div>' +
      '<div style="flex:1;">' +
        '<div style="font-size:13px;font-weight:600;">'+label+(amount?': <span style="color:'+amountColor+';">'+amount+'</span>':'')+'</div>' +
        (e.notes ? '<div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">'+_esc(e.notes)+(e.requestedBy?' ('+_esc(e.requestedBy)+'-requested)':'')+'</div>' : '') +
      '</div>' +
    '</div>';
  }).reverse().join('');

  document.getElementById('modalBox').style.maxWidth = '560px';
  openModal(
    '<div class="modal-header"><div><div class="modal-title">'+_esc(vaName)+'</div>' +
      '<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">'+_esc(custName)+(acctName?' — '+_esc(acctName):'')+'</div></div>' +
      '<button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button></div>' +
    '<div class="modal-body" style="max-height:65vh;overflow-y:auto;">' +
      currentHtml +
      '<div style="font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;">Full History (most recent first)</div>' +
      historyHtml +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" data-cid="'+_esc(connectionId)+'" onclick="closeModal();vaConnOpenModal(this.dataset.cid)">View Connection</button>' +
      '<button class="btn btn-primary" onclick="closeModal()">Close</button>' +
    '</div>'
  );
}

// Step 1: pick the client — filters which VAs show up in step 2
function hscModalClientChanged() {
  var clientSel = document.getElementById('hscModalClient');
  var vaSel = document.getElementById('hscModalConn');
  var vaSearchEl = document.getElementById('hscVASearch');
  if (!clientSel || !vaSel) return;
  var clientId = clientSel.value;
  var infoEl = document.getElementById('hscModalCurrentState'); if (infoEl) infoEl.style.display = 'none';
  window._hscSelectedConnId = '';
  if (!clientId) {
    vaSel.innerHTML = '<option value="">Select client first…</option>';
    vaSel.disabled = true;
    if (vaSearchEl) { vaSearchEl.value = ''; vaSearchEl.disabled = true; vaSearchEl.placeholder = 'Select client first…'; }
    _hscVAOptions = [];
    return;
  }
  var matches = _hscConns.filter(function(c){ return c.clientId === clientId; });
  vaSel.innerHTML = '<option value="">Select a VA…</option>' + matches.map(function(c) {
    return '<option value="'+_esc(c.connectionId)+'">'+_esc(c.vaName)+' — '+_esc(c.connectionStatus)+'</option>';
  }).join('');
  vaSel.disabled = false;
  _hscVAOptions = matches;
  if (vaSearchEl) { vaSearchEl.value = ''; vaSearchEl.disabled = false; vaSearchEl.placeholder = 'Type or click to search VA…'; }
  // Auto-select if there's exactly one VA on this account
  if (matches.length === 1) {
    vaSel.value = matches[0].connectionId;
    window._hscSelectedConnId = matches[0].connectionId;
    if (vaSearchEl) vaSearchEl.value = matches[0].vaName + ' — ' + matches[0].connectionStatus;
    hscModalConnChanged();
  }
}

// Step 2: pick the VA — loads that connection's current schedule/hours
function hscModalConnChanged() {
  var sel = document.getElementById('hscModalConn'); if (!sel) return;
  var connId = (window._hscSelectedConnId || sel.value || '').trim();
  var conn = _hscConns.filter(function(c){ return c.connectionId===connId; })[0];
  var infoEl = document.getElementById('hscModalCurrentState'); if (!infoEl) return;
  if (!conn) { infoEl.style.display='none'; return; }
  infoEl.style.display = '';
  infoEl.innerHTML =
    '<strong>Current Schedule:</strong> ' + _esc(conn.connectionType||'—') + ' · ' +
    _esc(conn.hours||'—') + 'h · ' + _esc(conn.hoursType||conn.scheduleType||'—') +
    ' <span class="badge badge-'+(conn.connectionStatus||'').toLowerCase()+'">'+_esc(conn.connectionStatus)+'</span>';
  // Pre-fill the change fields with this connection's current values
  var ctEl = document.getElementById('hscModalNewConnType'); if(ctEl&&conn.connectionType) ctEl.value=conn.connectionType;
  var schedSel = document.getElementById('hscModalSchedType');
  if (schedSel) {
    // conn.scheduleType may hold the old flat Hours Type (Fixed/Flexible/
    // Daily/Project Based) for older connections — map it to the closest
    // equivalent in the new 5-option model rather than leaving it blank.
    // Per the request — ScheduleType's "Project Based" value renamed to
    // "Project-based"; the map KEY stays 'Project Based' (matches
    // conn.hoursType's own unrenamed value), only the mapped-to value
    // (the new ScheduleType being set) changes.
    var mapOld = { 'Fixed':'Weekly Fixed', 'Flexible':'Weekly Flexible', 'Daily':'Daily Flexible', 'Project Based':'Project-based' };
    var current = conn.scheduleType && ['Weekly Fixed','Weekly Flexible','Daily Fixed','Daily Flexible','Monthly','Project-based'].indexOf(conn.scheduleType) !== -1
      ? conn.scheduleType
      : (mapOld[conn.hoursType] || '');
    schedSel.value = current;
    hscScheduleTypeChanged(current);
    if (current === 'Project-based') {
      var projEl = document.getElementById('hscModalProjectHours'); if (projEl && conn.hours) projEl.value = conn.hours;
    } else if (current === 'Monthly') {
      var monthlyElHsc = document.getElementById('hscModalMonthlyHours'); if (monthlyElHsc && conn.hours) monthlyElHsc.value = conn.hours;
    } else if (current) {
      try { dailyHoursPrefill('hscDaily', JSON.parse(conn.hoursBreakdown || '[]')); } catch(e) {}
    }
    if (current === 'Weekly Fixed' || current === 'Daily Fixed') {
      window._hscModalClientTimezone = conn.clientTimezone || '';
      _reqComputePhTimeRange('', 'hscModalPh', conn.clientTimezone || '');
    }
  }
}

var HSC_SCHED_TYPE_INFO = {
  'Weekly Fixed':    'The VA will work on a fixed time schedule — enter the required PH working hours below, plus the total weekly hours (split evenly across Mon–Fri, adjustable per day).',
  'Weekly Flexible': 'The VA can work flexible hours during the day, as long as the total weekly hours below are completed — no fixed PH time window is required.',
  'Daily Fixed':     'The VA works a fixed time each day — enter the required PH working hours below, plus how many hours land on each day.',
  'Daily Flexible':  'Hours may vary by day, worked flexibly — enter how many hours land on each day below.',
  'Monthly':         'A single monthly hours figure — day-by-day scheduling doesn\'t apply.',
  'Project-based':   'A single starting hours figure for this project — day-by-day scheduling doesn\'t apply.'
};
function hscScheduleTypeChanged(val) {
  var infoEl = document.getElementById('hscModalSchedTypeInfo');
  var phWrap = document.getElementById('hscModalPhTimeWrap');
  var dailyWrap = document.getElementById('hscModalDailyHours');
  var projWrap = document.getElementById('hscModalProjectHoursWrap');
  var monthlyWrap = document.getElementById('hscModalMonthlyHoursWrap');
  var isFixed  = (val === 'Weekly Fixed' || val === 'Daily Fixed');
  var isWeekly = (val === 'Weekly Fixed' || val === 'Weekly Flexible');
  var isDayBased = (isWeekly || val === 'Daily Fixed' || val === 'Daily Flexible');
  var phReqStar = document.getElementById('hscModalPhTimeReq');
  if (infoEl) { infoEl.style.display = val ? '' : 'none'; infoEl.textContent = HSC_SCHED_TYPE_INFO[val] || ''; }
  if (phWrap)    phWrap.style.display = isDayBased ? '' : 'none';
  if (phReqStar) phReqStar.style.display = isFixed ? '' : 'none';
  if (dailyWrap) dailyWrap.style.display = isDayBased ? '' : 'none';
  if (projWrap) projWrap.style.display = (val === 'Project-based') ? '' : 'none';
  if (monthlyWrap) monthlyWrap.style.display = (val === 'Monthly') ? '' : 'none';
  if (isDayBased) dailyHoursSetAverageMode('hscDaily', isWeekly ? 'weeklyTotal' : 'daily');
  if (isDayBased && !isFixed) {
    var phStartFlex = document.getElementById('hscModalPhStart');
    var phEndFlex = document.getElementById('hscModalPhEnd');
    if (phStartFlex) phStartFlex.value = '';
    if (phEndFlex) phEndFlex.value = '';
  }
  if (isDayBased) _reqComputePhTimeRange('', 'hscModalPh');
}

function hscModalSave() {
  var connId = (window._hscSelectedConnId || ((document.getElementById('hscModalConn')||{}).value||'')).trim();
  var type   = ((document.getElementById('hscModalType')||{}).value||'');
  var date   = ((document.getElementById('hscModalDate')||{}).value||'').trim();
  var errEl  = document.getElementById('hscModalErr');
  var btn    = document.getElementById('hscModalSaveBtn');
  if (!connId) { if(errEl) errEl.textContent='Select a client, then a VA.'; return; }
  if (!date)   { if(errEl) errEl.textContent='Effective date is required.'; return; }
  if (errEl) errEl.textContent='';
  if (btn) { btn.disabled=true; btn.textContent='Saving…'; }

  if (type==='Log Project Hours') {
    var ph = ((document.getElementById('hscModalProjHours')||{}).value||'').trim();
    var requestedBy = ((document.getElementById('hscModalProjRequestedBy')||{}).value||'VA');
    if (!ph) { if(errEl) errEl.textContent='Additional Hours is required.'; if(btn){btn.disabled=false;btn.textContent='Apply Change';} return; }
    google.script.run
      .withSuccessHandler(function(res){
        if(!res||!res.success){if(errEl)errEl.textContent=(res&&res.error)||'Failed.';if(btn){btn.disabled=false;btn.textContent='Apply Change';}return;}
        closeModal();
        var resumeMsg = (res.clientResumed || res.customerResumed)
          ? ' — ' + [res.clientResumed?'account':'', res.customerResumed?'customer':''].filter(Boolean).join(' & ') + ' auto-resumed to Active.'
          : '';
        showToast('Additional hours logged.' + resumeMsg, 'success');
        hscLoadAllLogs();
      })
      .withFailureHandler(function(err){if(errEl)errEl.textContent=err.message;if(btn){btn.disabled=false;btn.textContent='Apply Change';}})
      .addProjectHoursEntry(connId, parseFloat(ph), ((document.getElementById('hscModalProjDesc')||{}).value||''), date, requestedBy);
    return;
  }

  var payload = { connectionId:connId, changeType:type, effectiveDate:date, notes:((document.getElementById('hscModalNotes')||{}).value||'') };
  if (type==='Hours/Schedule Update') {
    var schedType = ((document.getElementById('hscModalSchedType')||{}).value||'');
    if (!schedType) { if(errEl) errEl.textContent='Schedule Type is required.'; if(btn){btn.disabled=false;btn.textContent='Apply Change';} return; }
    payload.newScheduleType = schedType;
    var isFixed = (schedType === 'Weekly Fixed' || schedType === 'Daily Fixed');
    if (schedType === 'Project-based') {
      payload.newHoursType = 'Project Based';
      payload.newHours = ((document.getElementById('hscModalProjectHours')||{}).value||'').trim();
      if (!payload.newHours) { if(errEl) errEl.textContent='Initial Hours is required.'; if(btn){btn.disabled=false;btn.textContent='Apply Change';} return; }
    } else if (schedType === 'Monthly') {
      payload.newHoursType = 'Monthly';
      payload.newHours = ((document.getElementById('hscModalMonthlyHours')||{}).value||'').trim();
      if (!payload.newHours) { if(errEl) errEl.textContent='Monthly Hours is required.'; if(btn){btn.disabled=false;btn.textContent='Apply Change';} return; }
    } else {
      payload.newHoursType = 'Daily';
      var dailyBreakdown = dailyHoursCollectBreakdown('hscDaily');
      if (!dailyBreakdown.length) { if(errEl) errEl.textContent='Enter at least one day\'s hours.'; if(btn){btn.disabled=false;btn.textContent='Apply Change';} return; }
      payload.newHours = dailyHoursWeeklyTotal('hscDaily');
      payload.newScheduleBreakdown = JSON.stringify(dailyBreakdown);
      payload.newScheduleDays = dailyBreakdown.reduce(function(all,g){ return all.concat(g.days); }, []).join(',');
      payload.requiredClientTime = ((document.getElementById('hscModalPhWorkTime')||{}).value||'').trim();
      payload.requiredPHTime = ((document.getElementById('hscModalPhDerivedPHTime')||{}).value||'').trim();
      payload.nightDiffApplicableAtSchedule = !!(document.getElementById('hscModalNightDiff')||{}).checked;
      payload.breaksIncludedInTotal = !!(document.getElementById('hscModalBreaksIncluded')||{checked:true}).checked;
      if (isFixed && !payload.requiredClientTime) { if(errEl) errEl.textContent='Required Working Time (Client\'s Time) is required for a '+schedType+' schedule.'; if(btn){btn.disabled=false;btn.textContent='Apply Change';} return; }
    }
  }
  if (type==='Type Change') {
    payload.newConnectionType=((document.getElementById('hscModalNewConnType')||{}).value||'');
  }
  if (type==='Limited Period') {
    payload.limitHours=((document.getElementById('hscModalLimitHours')||{}).value||'').trim();
    payload.limitFrom=((document.getElementById('hscModalLimitFrom')||{}).value||'');
    payload.limitTo=((document.getElementById('hscModalLimitTo')||{}).value||'');
    payload.limitNotes=((document.getElementById('hscModalLimitNotes')||{}).value||'').trim();
    if(!payload.limitHours||!payload.limitFrom||!payload.limitTo){if(errEl)errEl.textContent='Limit hours, from, and to dates are required.';if(btn){btn.disabled=false;btn.textContent='Apply Change';}return;}
  }
  google.script.run
    .withSuccessHandler(function(res){
      if(!res||!res.success){if(errEl)errEl.textContent=(res&&res.error)||'Failed.';if(btn){btn.disabled=false;btn.textContent='Apply Change';}return;}
      closeModal();
      showToast('Change submitted — pending CS Specialist confirmation.', 'success');
      hscLoadAllLogs();
    })
    .withFailureHandler(function(err){if(errEl)errEl.textContent=err.message;if(btn){btn.disabled=false;btn.textContent='Apply Change';}})
    .applyVAConnectionHoursChange(payload);
}

function hscSaveChange() {
  if (!_hscSelected) return;
  var changeType = (document.getElementById('hscChangeType')||{}).value||'';
  var errEl = document.getElementById('hscSaveErr');
  var btn   = document.getElementById('hscSaveBtn');
  if (errEl) errEl.textContent = '';

  if (changeType === 'Project Hours Entry') {
    var projHours = ((document.getElementById('hscProjHours')||{}).value||'').trim();
    var projDesc  = ((document.getElementById('hscProjDesc') ||{}).value||'').trim();
    var effDate   = ((document.getElementById('hscEffectiveDate')||{}).value||'').trim();
    if (!projHours) { if(errEl) errEl.textContent='Hours completed is required.'; return; }
    if (btn) { btn.disabled=true; btn.textContent='Saving…'; }
    google.script.run
      .withSuccessHandler(function(res){
        if(!res||!res.success){if(errEl)errEl.textContent=(res&&res.error)||'Save failed.';if(btn){btn.disabled=false;btn.textContent='Apply Change';}return;}
        showToast('Project hours logged.','success');
        if(btn){btn.disabled=false;btn.textContent='Apply Change';}
        hscSelectConn(_hscSelected.connectionId);
      })
      .withFailureHandler(function(err){if(errEl)errEl.textContent=err.message;if(btn){btn.disabled=false;btn.textContent='Apply Change';}})
      .addProjectHoursEntry(_hscSelected.connectionId, parseFloat(projHours), projDesc, effDate);
    return;
  }

  var payload = {
    connectionId:     _hscSelected.connectionId,
    changeType:       changeType,
    effectiveDate:    ((document.getElementById('hscEffectiveDate')||{}).value||''),
    notes:            ((document.getElementById('hscNotes')||{}).value||'').trim()
  };
  if (changeType === 'Hours Update' || changeType === 'Type Change') {
    payload.newHours          = ((document.getElementById('hscNewHours')||{}).value||'').trim();
    payload.newHoursType      = ((document.getElementById('hscNewHoursType')||{}).value||'');
    payload.newConnectionType = ((document.getElementById('hscNewConnType')||{}).value||'');
    if (!payload.newHours && changeType === 'Hours Update') { if(errEl) errEl.textContent='New hours is required.'; return; }
  }
  if (changeType === 'Schedule Change') {
    payload.newScheduleType = ((document.getElementById('hscNewScheduleType')||{}).value||'');
    payload.newScheduleDays = ((document.getElementById('hscNewScheduleDays')||{}).value||'').trim();
  }
  if (changeType === 'Limited Period') {
    payload.limitHours = ((document.getElementById('hscLimitHours')||{}).value||'').trim();
    payload.limitFrom  = ((document.getElementById('hscLimitFrom') ||{}).value||'');
    payload.limitTo    = ((document.getElementById('hscLimitTo')   ||{}).value||'');
    payload.limitNotes = ((document.getElementById('hscLimitNotes')||{}).value||'').trim();
    if (!payload.limitHours || !payload.limitFrom || !payload.limitTo) { if(errEl) errEl.textContent='Limit hours, from, and to dates are required.'; return; }
  }

  if (btn) { btn.disabled=true; btn.textContent='Saving…'; }
  google.script.run
    .withSuccessHandler(function(res){
      if(!res||!res.success){if(errEl)errEl.textContent=(res&&res.error)||'Save failed.';if(btn){btn.disabled=false;btn.textContent='Apply Change';}return;}
      showToast('Change submitted — pending CS Specialist confirmation.','success');
      if(btn){btn.disabled=false;btn.textContent='Apply Change';}
      hscSelectConn(_hscSelected.connectionId); // refresh log
    })
    .withFailureHandler(function(err){if(errEl)errEl.textContent=err.message;if(btn){btn.disabled=false;btn.textContent='Apply Change';}})
    .applyVAConnectionHoursChange(payload);
}

function hscRenderLog(log) {
  if (!log || !log.length) return '<div style="color:var(--text-muted);font-size:13px;padding:8px 0;">No changes logged yet.</div>';
  return '<div style="display:flex;flex-direction:column;gap:10px;">' +
    log.map(function(entry) {
      var isProject = entry.changeType === 'Project Hours Entry';
      var summary = isProject
        ? '<span style="font-weight:600;color:var(--accent);">'+_esc(entry.newHours||'')+'h logged</span>'+(entry.limitNotes?' — '+_esc(entry.limitNotes):'')
        : _hscLogSummary(entry);
      var nightDiffBadge2 = entry.nightDiffApplicable
        ? '<span class="badge badge-active" style="font-size:10px;">Night Diff: Applies</span>'
        : '<span class="badge badge-inactive" style="font-size:10px;">Night Diff: No</span>';
      var breaksBadge2 = entry.breaksIncluded
        ? '<span class="badge badge-active" style="font-size:10px;">Breaks: Included</span>'
        : '<span class="badge badge-inactive" style="font-size:10px;">Breaks: Excluded</span>';
      return '<div style="background:var(--surface-2);border-radius:var(--radius-md);padding:10px 14px;">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">' +
          '<span style="font-size:11.5px;font-weight:700;">'+_esc(entry.changeType)+'</span>' +
          '<span style="font-size:11px;color:var(--text-muted);">'+_fdate(entry.effectiveDate||entry.createdAt)+(entry.loggedBy?' · '+_esc(entry.loggedBy):'')+'</span>' +
        '</div>' +
        '<div style="font-size:12.5px;color:var(--text-secondary);">'+summary+'</div>' +
        '<div style="display:flex;gap:6px;margin-top:6px;">'+nightDiffBadge2+breaksBadge2+'</div>' +
        (entry.limitFrom&&entry.limitTo ? '<div style="font-size:11.5px;color:var(--text-muted);margin-top:3px;">Period: '+_fdate(entry.limitFrom)+' → '+_fdate(entry.limitTo)+'</div>' : '') +
        (entry.notes ? '<div style="font-size:12px;color:var(--text-muted);margin-top:4px;font-style:italic;">'+_esc(entry.notes)+'</div>' : '') +
      '</div>';
    }).join('') +
  '</div>';
}

function _hscLogSummary(e) {
  var parts = [];
  if (e.prevHours !== e.newHours && (e.prevHours||e.newHours))
    parts.push('Hours: <strong>'+_esc(e.prevHours||'—')+'</strong> → <strong>'+_esc(e.newHours||'—')+'</strong>');
  if (e.prevHoursType !== e.newHoursType && (e.prevHoursType||e.newHoursType))
    parts.push('Hours Type: <strong>'+_esc(e.prevHoursType||'—')+'</strong> → <strong>'+_esc(e.newHoursType||'—')+'</strong>');
  if (e.prevConnectionType !== e.newConnectionType && (e.prevConnectionType||e.newConnectionType))
    parts.push('Connection Type: <strong>'+_esc(e.prevConnectionType||'—')+'</strong> → <strong>'+_esc(e.newConnectionType||'—')+'</strong>');
  if (e.prevScheduleType !== e.newScheduleType && (e.prevScheduleType||e.newScheduleType))
    parts.push('Schedule: <strong>'+_esc(e.prevScheduleType||'—')+'</strong> → <strong>'+_esc(e.newScheduleType||'—')+'</strong>');
  if (e.limitHours) parts.push('Limit: <strong>'+_esc(e.limitHours)+'h/wk</strong>');
  return parts.length ? parts.join(' &nbsp;·&nbsp; ') : '(no details)';
}
function _celStatusBadge(r) {
  if (r.followUpSentAt) return '<span class="badge badge-returning" style="font-size:10.5px;">Follow-up ' + _fdate(r.followUpSentAt) + '</span>';
  if (r.notifiedAt)     return '<span class="badge badge-active"    style="font-size:10.5px;">Notified '   + _fdate(r.notifiedAt)     + '</span>';
  return '<span class="badge badge-pending" style="font-size:10.5px;">Not notified</span>';
}

// ── Birthdays table ─────────────────────────────────────────────────────
function celRenderBirthdays(rows) {
  var body = document.getElementById('celBody'); if (!body) return;

  if (!rows.length) {
    body.innerHTML = '<div class="empty-state" style="padding:40px;"><h3>No birthdays found</h3><p>No VA birthdays match the current filters.</p></div>';
    _celRenderPager(0); return;
  }

  var startIdx = (_celPage - 1) * _celPageSize;
  var shown    = rows.slice(startIdx, startIdx + _celPageSize);

  // Group adjacent rows with the same vaId + csAssigned for visual cell-merging.
  // Rows are already sorted by daysUntil → vaId, so same-VA rows are contiguous.
  var groups = [];
  shown.forEach(function(r) {
    var key = r.vaId + '|' + (r.csAssigned || '');
    var last = groups[groups.length - 1];
    if (last && last.key === key) {
      last.clients.push(r);
    } else {
      groups.push({ key: key, primary: r, clients: [r] });
    }
  });

  var tableRows = groups.map(function(g) {
    var r = g.primary;
    var dayLabel = r.daysUntil === 0 ? 'Today' : r.daysUntil === 1 ? 'Tomorrow' : 'in ' + r.daysUntil + ' days';
    var rowspan  = g.clients.length;

    // Account + email cells: one per client in the group
    var clientCells = g.clients.map(function(c, idx) {
      var hasEmail = c.focalEmails && c.focalEmails.length;
      var accountCell = '<td>'+(c.clientName
        ? '<a href="#" onclick="navigate(\'client-profile\',\''+_esc(c.clientId)+'\');return false;" style="color:var(--accent);font-weight:600;">'+_esc(c.clientName)+'</a>'+(c.customerUnpaid?' <span title="This customer\'s most recent payment status is Unpaid" style="color:#b45309;">⚠</span>':'')
        : '<span style="color:var(--border);">No active clients</span>')+'</td>';
      var emailCell = '<td>'+(hasEmail
        ? '<div style="font-size:11.5px;">'+c.focalEmails.map(_esc).join(', ')+'</div>'
        : '<span style="color:var(--danger);font-size:11.5px;">No email on file</span>')+'</td>';
      var statusCell = '<td>'+_celStatusBadge(c)+'</td>';
      var actionCell = '<td><div style="display:flex;gap:6px;flex-wrap:nowrap;">' +
        '<button class="btn btn-primary btn-sm"'+(hasEmail?'':' disabled title="No email on file"')+
          ' onclick="celOpenPreview(\'birthday\',\'notify\',\''+_esc(c.vaId)+'\','+c.occasionYear+',\''+_esc(c.clientId)+'\')">Notify</button>' +
        '<button class="btn btn-secondary btn-sm"'+(hasEmail?'':' disabled')+
          ' onclick="celOpenPreview(\'birthday\',\'followup\',\''+_esc(c.vaId)+'\','+c.occasionYear+',\''+_esc(c.clientId)+'\')">Follow-up</button>' +
      '</div></td>';

      if (idx === 0) {
        // First client row carries the merged VA + Birthday + CS cells
        return '<tr>' +
          '<td rowspan="'+rowspan+'"><div style="font-weight:600;">'+_esc(r.vaName)+(r.hasOpenConcern?' <span title="This VA has an open Concern ticket" style="color:var(--danger);">⚠</span>':'')+'</div><div style="font-size:11px;color:var(--text-muted);">'+_esc(r.department||'')+'</div></td>' +
          '<td rowspan="'+rowspan+'" class="muted">'+_fdate(r.nextOccurrence)+'<div style="font-size:11px;color:var(--accent);font-weight:600;">'+dayLabel+'</div></td>' +
          accountCell + emailCell +
          '<td rowspan="'+rowspan+'" class="muted">'+_esc(_cpSpecName(r.csAssigned)||r.csAssigned||'—')+(r.csAssigned&&_cpSpecName(r.csAssigned)?'<div style="font-size:10.5px;color:var(--text-muted);">'+_esc(r.csAssigned)+'</div>':'')+'</td>' +
          statusCell + actionCell +
        '</tr>';
      } else {
        // Subsequent clients share the merged VA/Birthday/CS cells
        return '<tr>' + accountCell + emailCell + statusCell + actionCell + '</tr>';
      }
    }).join('');

    return clientCells;
  }).join('');

  body.innerHTML =
    '<table style="width:100%;border-collapse:collapse;">' +
      '<thead><tr>' +
        '<th>VA</th><th>Birthday</th><th>Account</th><th>Recipient Email</th>' +
        '<th>CS Assigned</th><th>Status</th><th style="width:200px;">Actions</th>' +
      '</tr></thead>' +
      '<tbody>'+tableRows+'</tbody>' +
    '</table>';

  _celRenderPager(rows.length);
}

// ── Anniversaries table ─────────────────────────────────────────────────
function celRenderAnniversaries(rows) {
  var body = document.getElementById('celBody'); if (!body) return;

  if (!rows.length) {
    body.innerHTML = '<div class="empty-state" style="padding:40px;"><h3>No anniversaries found</h3><p>No work anniversaries match the current filters.</p></div>';
    _celRenderPager(0); return;
  }

  var startIdx = (_celPage - 1) * _celPageSize;
  var shown    = rows.slice(startIdx, startIdx + _celPageSize);
  var tableRows = shown.map(function(r) {
    var dayLabel = r.daysUntil === 0 ? 'Today' : r.daysUntil === 1 ? 'Tomorrow' : 'in ' + r.daysUntil + ' days';
    return '<tr>' +
      '<td><div style="font-weight:600;">'+_esc(r.vaName)+(r.hasOpenConcern?' <span title="This VA has an open Concern ticket" style="color:var(--danger);">⚠</span>':'')+'</div></td>' +
      '<td><a href="#" onclick="navigate(\'client-profile\',\''+_esc(r.clientId)+'\');return false;" style="color:var(--accent);font-weight:600;">'+_esc(r.accountName)+'</a>'+(r.customerUnpaid?' <span title="This customer\'s most recent payment status is Unpaid" style="color:#b45309;">⚠</span>':'')+'</td>' +
      '<td class="muted">'+_fdate(r.nextOccurrence)+'<div style="font-size:11px;color:var(--accent);font-weight:600;">'+dayLabel+'</div></td>' +
      '<td style="font-weight:700;">'+r.years+' yr'+(r.years>1?'s':'')+'</td>' +
      '<td class="muted">'+_esc(_cpSpecName(r.csAssigned)||r.csAssigned||'—')+(r.csAssigned&&_cpSpecName(r.csAssigned)?'<div style="font-size:10.5px;color:var(--text-muted);">'+_esc(r.csAssigned)+'</div>':'')+'</td>' +
      '<td>'+_celStatusBadge(r)+'</td>' +
      '<td><div style="display:flex;gap:6px;flex-wrap:nowrap;">' +
        '<button class="btn btn-primary btn-sm"    onclick="celOpenPreview(\'anniversary\',\'notify\',\''+_esc(r.connectionId)+'\','+r.occasionYear+')">Notify Client</button>' +
        '<button class="btn btn-secondary btn-sm"  onclick="celOpenPreview(\'anniversary\',\'followup\',\''+_esc(r.connectionId)+'\','+r.occasionYear+')">Follow-up</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');

  body.innerHTML =
    '<table style="width:100%;border-collapse:collapse;">' +
      '<thead><tr><th>VA</th><th>Account</th><th>Anniversary</th><th>Years</th><th>CS Assigned</th><th>Status</th><th style="width:220px;">Actions</th></tr></thead>' +
      '<tbody>'+tableRows+'</tbody>' +
    '</table>';

  _celRenderPager(rows.length);
}

// ── Edit Email Templates modal ──────────────────────────────────────────
// Opens the existing Email Templates admin panel in a dedicated modal so
// the CS doesn't need to navigate to Settings to manage celebration
// templates. Reuses the exact same _etRenderPanel function used in Settings.
function celOpenEmailTemplates() {
  document.getElementById('modalBox').style.maxWidth = '860px';
  openModal(
    '<div class="modal-header">' +
      '<div class="modal-title">Celebration Email Templates</div>' +
      '<button class="modal-close" onclick="closeModal()">'+_svgClose()+'</button>' +
    '</div>' +
    '<div class="modal-body" id="celEtModalBody" style="max-height:70vh;overflow-y:auto;padding:0;">' +
      '<div class="loader-ring" style="margin:24px auto;"></div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>'
  );
  var panel = document.getElementById('celEtModalBody');
  if (panel) _etRenderPanel(panel);
}

// ── Editable email preview modal ───────────────────────────────────────
// occasionKind: 'birthday' | 'anniversary'. emailKind: 'notify' | 'followup'.
// entityId: vaId (birthday) or connectionId (anniversary).
function celOpenPreview(occasionKind, emailKind, entityId, occasionYear, clientId) {
  openModal(_loadingModal('160px', 'Loading preview…'));
  var fetchFn = occasionKind === 'birthday' ? 'getBirthdayEmailPreview' : 'getAnniversaryEmailPreview';
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { closeModal(); showToast((res && res.error) || 'Could not build preview.', 'error'); return; }
      _celRenderPreviewModal(occasionKind, emailKind, entityId, occasionYear, res.data, clientId);
    })
    .withFailureHandler(function(err) { closeModal(); showToast(err.message, 'error'); })
    [fetchFn](entityId, clientId || '', emailKind);
}

function _celRenderPreviewModal(occasionKind, emailKind, entityId, occasionYear, preview, clientId) {
  var isBirthday = occasionKind === 'birthday';
  // Birthdays: now sent To the specific client (not BCC all clients)
  var recipientLabel  = 'To';
  var recipientList   = preview.to || preview.bcc || [];
  var title = (emailKind === 'followup' ? 'Follow-up — ' : 'Notify — ') + (isBirthday ? 'Birthday' : 'Work Anniversary');
  // A template not explicitly marked HTML can still end up with real HTML
  // in it — e.g. someone pastes an <img> or <a> tag straight into the body.
  // Sending that as plain text is exactly why an image shows as literal
  // text in the recipient's inbox instead of rendering: MailApp sends
  // mailOpts.body (plain) instead of mailOpts.htmlBody when isHtml is
  // false, regardless of what's actually inside the string. Detecting real
  // markup here means the Edit/Preview toggle appears and the email is
  // correctly sent as HTML whenever it's actually needed, not only when
  // the stored template happens to already have the flag set.
  var isHtml = !!preview.isHtml || /<(img|a|div|p|strong|em|b|i|br|span|table)[\s/>]/i.test(preview.body||'');

  document.getElementById('modalBox').style.maxWidth = '680px';
  openModal(
    '<div class="modal-header"><div class="modal-title">' + title + '</div><button class="modal-close" onclick="closeModal()">' + _svgClose() + '</button></div>' +
    '<div class="modal-body" style="max-height:72vh;overflow-y:auto;">' +
      '<div class="form-group">' +
        '<label class="form-label">' + recipientLabel + ' <span style="font-size:11px;color:var(--text-muted);font-weight:400;">(editable — separate multiple with commas)</span></label>' +
        '<input class="form-input" id="celPrevToField" type="text" value="' + _esc(recipientList.join(', ')) + '" placeholder="recipient@example.com" />' +
        (recipientList.length ? '' : '<div style="font-size:11.5px;color:var(--danger);margin-top:4px;">⚠ No focal person email found for this account — please enter one manually.</div>') +
      '</div>' +
      '<div class="form-group"><label class="form-label">Subject</label>' +
        '<input class="form-input" id="celPrevSubject" type="text" value="' + _esc(preview.subject||'') + '" /></div>' +
      '<div class="form-group">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">' +
          '<label class="form-label" style="margin-bottom:0;">Body</label>' +
          '<div style="display:flex;gap:6px;">' +
            '<button type="button" class="btn btn-ghost btn-sm" style="font-size:11.5px;" onclick="celInsertLink()" title="Wrap the selected text with a link">🔗 Insert Link</button>' +
            '<button type="button" class="btn btn-ghost btn-sm" style="font-size:11.5px;" onclick="celInsertImage()" title="Insert an image at the cursor">🖼 Insert Image</button>' +
            (isHtml
              ? '<button type="button" id="celPrevTabEdit" onclick="celPrevSwitchTab(\'edit\')" style="padding:3px 10px;font-size:12px;border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent);color:#fff;cursor:pointer;">Edit HTML</button>' +
                '<button type="button" id="celPrevTabPreview" onclick="celPrevSwitchTab(\'preview\')" style="padding:3px 10px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text-secondary);cursor:pointer;">Preview</button>'
              : '') +
          '</div>' +
        '</div>' +
        '<textarea class="form-textarea" id="celPrevBody" style="min-height:220px;font-family:'+(isHtml?'var(--font-mono)':'inherit')+';font-size:12.5px;">' + _esc(preview.body||'') + '</textarea>' +
        (isHtml
          ? '<div id="celPrevHtmlDiv" style="display:none;min-height:220px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;background:#fff;overflow-y:auto;"></div>'
          : '') +
        '<div class="form-hint">' + (isHtml ? 'HTML content detected — use the Preview tab to see how it will render, or the toolbar above to insert a link/image. ' : '') + 'Pre-filled from the default template — edit freely before sending.</div>' +
      '</div>' +
      '<input type="hidden" id="celPrevIsHtml" value="' + (isHtml ? '1' : '0') + '" />' +
      '<input type="hidden" id="celPrevClientId" value="' + _esc(clientId||'') + '" />' +
      '<input type="hidden" id="celPrevRecipientList" value="' + _esc(JSON.stringify(recipientList)) + '" />' +
      '<div id="celPrevErr" style="color:var(--danger);font-size:12.5px;margin-top:4px;"></div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" id="celPrevSendBtn"' +
        ' onclick="celSendPreview(\'' + occasionKind + '\',\'' + emailKind + '\',\'' + _esc(entityId) + '\',' + occasionYear + ')">Send Email</button>' +
    '</div>'
  );
  // Show the rendered version immediately when there's actual media in the
  // body (an image or a link) — that's the whole point of asking to see it
  // "already visible" rather than needing to click Preview first.
  if (isHtml && /<(img|a)[\s/>]/i.test(preview.body||'')) {
    setTimeout(function(){ celPrevSwitchTab('preview'); }, 0);
  }
}

// Wraps whatever text is currently selected in the given textarea with a
// link. If nothing is selected, the URL itself becomes the visible link
// text instead — either way, ends up with a real <a href> in the body.
// Generic over which textarea/flag it targets so both the template editor
// and the send-preview modal can share this one implementation.
function _insertLinkInto(taId, flagId, onMarkedHtml) {
  var ta = document.getElementById(taId); if (!ta) return;
  var start = ta.selectionStart, end = ta.selectionEnd;
  var selectedText = ta.value.substring(start, end);
  var url = prompt('Link URL:', 'https://');
  if (!url) return;
  var linkHtml = '<a href="' + url + '" style="color:#c2410c;text-decoration:underline;">' + (selectedText || url) + '</a>';
  ta.value = ta.value.substring(0, start) + linkHtml + ta.value.substring(end);
  ta.focus();
  var newPos = start + linkHtml.length;
  ta.setSelectionRange(newPos, newPos);
  var flagEl = document.getElementById(flagId);
  var wasHtml = flagEl && flagEl.value === '1';
  if (flagEl) flagEl.value = '1';
  if (!wasHtml && onMarkedHtml) onMarkedHtml();
}
function _insertImageInto(taId, flagId, onMarkedHtml) {
  var ta = document.getElementById(taId); if (!ta) return;
  var url = prompt('Image URL:', 'https://');
  if (!url) return;
  var imgHtml = '<img src="' + url + '" alt="" style="display:block;max-width:100%;margin:16px auto;" />';
  var start = ta.selectionStart, end = ta.selectionEnd;
  ta.value = ta.value.substring(0, start) + imgHtml + ta.value.substring(end);
  ta.focus();
  var newPos = start + imgHtml.length;
  ta.setSelectionRange(newPos, newPos);
  var flagEl = document.getElementById(flagId);
  var wasHtml = flagEl && flagEl.value === '1';
  if (flagEl) flagEl.value = '1';
  if (!wasHtml && onMarkedHtml) onMarkedHtml();
}
function celInsertLink()  { _insertLinkInto('celPrevBody', 'celPrevIsHtml', function(){
  if (!document.getElementById('celPrevTabEdit')) showToast('Marked this email as HTML so the link/image will render — check the Preview tab before sending.', 'info');
}); }
function celInsertImage() { _insertImageInto('celPrevBody', 'celPrevIsHtml', function(){
  if (!document.getElementById('celPrevTabEdit')) showToast('Marked this email as HTML so the link/image will render — check the Preview tab before sending.', 'info');
}); }

function celPrevSwitchTab(tab) {
  var textEl    = document.getElementById('celPrevBody');
  var previewEl = document.getElementById('celPrevHtmlDiv');
  var editBtn   = document.getElementById('celPrevTabEdit');
  var prevBtn   = document.getElementById('celPrevTabPreview');
  if (!textEl || !previewEl) return;

  if (tab === 'preview') {
    previewEl.innerHTML = textEl.value; // render raw HTML into the preview div
    textEl.style.display = 'none';
    previewEl.style.display = '';
    if (editBtn) { editBtn.style.background='var(--surface-2)'; editBtn.style.color='var(--text-secondary)'; editBtn.style.borderColor='var(--border)'; }
    if (prevBtn) { prevBtn.style.background='var(--accent)'; prevBtn.style.color='#fff'; prevBtn.style.borderColor='var(--accent)'; }
  } else {
    textEl.style.display = '';
    previewEl.style.display = 'none';
    if (editBtn) { editBtn.style.background='var(--accent)'; editBtn.style.color='#fff'; editBtn.style.borderColor='var(--accent)'; }
    if (prevBtn) { prevBtn.style.background='var(--surface-2)'; prevBtn.style.color='var(--text-secondary)'; prevBtn.style.borderColor='var(--border)'; }
  }
}

function celSendPreview(occasionKind, emailKind, entityId, occasionYear) {
  var subjectVal    = (document.getElementById('celPrevSubject')||{}).value || '';
  var bodyVal       = (document.getElementById('celPrevBody')||{}).value || '';
  var isHtml        = (document.getElementById('celPrevIsHtml')||{}).value === '1';
  var clientId      = (document.getElementById('celPrevClientId')||{}).value || '';
  // Read from the editable To field — the user may have changed the email
  var toFieldVal    = ((document.getElementById('celPrevToField')||{}).value||'').trim();
  var recipientList = toFieldVal ? toFieldVal.split(',').map(function(e){ return e.trim(); }).filter(Boolean) : [];

  var errEl = document.getElementById('celPrevErr');
  if (!subjectVal.trim()) { if (errEl) errEl.textContent = 'Subject is required.'; return; }
  if (!bodyVal.trim())    { if (errEl) errEl.textContent = 'Body is required.';    return; }
  if (errEl) errEl.textContent = '';

  var btn = document.getElementById('celPrevSendBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending\u2026'; }

  function onSuccess(res) {
    if (!res || !res.success) {
      if (errEl) errEl.textContent = (res && res.error) || 'Send failed.';
      if (btn) { btn.disabled = false; btn.textContent = 'Send Email'; }
      return;
    }
    closeModal();
    showToast('Email sent.', 'success');
    celRefresh();
  }
  function onFail(err) {
    if (errEl) errEl.textContent = err.message;
    if (btn) { btn.disabled = false; btn.textContent = 'Send Email'; }
  }

  if (occasionKind === 'birthday') {
    google.script.run
      .withSuccessHandler(onSuccess).withFailureHandler(onFail)
      .sendBirthdayEmail(entityId, clientId, occasionYear, emailKind, subjectVal, bodyVal, recipientList, isHtml);
  } else {
    google.script.run
      .withSuccessHandler(onSuccess).withFailureHandler(onFail)
      .sendAnniversaryEmail(entityId, occasionYear, emailKind, subjectVal, bodyVal, null, isHtml);
  }
}

</script>
